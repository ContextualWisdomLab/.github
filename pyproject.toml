[project]
name = "opencode-review-ci"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pip==26.2.1",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "interrogate>=1.7.0",
    "tomli>=2.0.0; python_version < '3.11'"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["scripts/ci"]
# contextual_orchestrator_review_launcher.py imports the vendored
# contextual-orchestrator library, which is installed only inside the review
# sidecar's runtime (scripts/ci/contextual_orchestrator_review_sidecar.sh).
# It cannot be imported by this repository's test suite, so it is omitted from
# coverage exactly as contextual-orchestrator omits its own runtime-only
# __main__.py and server.py. The policy and ZDR decision logic it consumes are
# fully tested offline.
omit = [
    "tests/*",
    "scripts/ci/contextual_orchestrator_review_launcher.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.interrogate]
exclude = ["tests"]
fail-under = 100
