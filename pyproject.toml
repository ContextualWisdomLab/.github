[project]
name = "opencode-review-ci"
version = "0.0.2"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "interrogate>=1.7.0",
    "tomli>=2.0.0; python_version < '3.11'"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["scripts/ci"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.interrogate]
exclude = ["tests"]
fail-under = 100
