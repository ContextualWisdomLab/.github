name: Temporary PR 1606 current-main restack

on:
  push:
    branches:
      - fix/noema-truncated-completion-contract-20260901
    paths:
      - .github/workflows/tmp-pr1606-current-main-restack.yml

permissions: {}

concurrency:
  group: tmp-pr1606-current-main-restack
  cancel-in-progress: true

jobs:
  restack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Merge protected main and preserve the Noema semantic delta
        shell: bash
        env:
          EXPECTED_REF: fix/noema-truncated-completion-contract-20260901
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_REF}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin main "${EXPECTED_REF}"
          test "$(git rev-parse "origin/${EXPECTED_REF}")" = "${GITHUB_SHA}"
          MAIN_SHA="$(git rev-parse origin/main)"

          git config user.name contextualwisdomlab-automation
          git config user.email contextualwisdomlab-automation@users.noreply.github.com
          git merge --no-ff --no-commit "${MAIN_SHA}" || true

          mapfile -d '' conflicts < <(git diff --name-only --diff-filter=U -z)
          for path in "${conflicts[@]}"; do
            if [ "$path" != "CHANGELOG.md" ]; then
              echo "::error::Unexpected semantic conflict while restacking PR 1606: $path"
              exit 1
            fi
          done

          if printf '%s\0' "${conflicts[@]}" | grep -Fqz -- 'CHANGELOG.md'; then
            git checkout --theirs -- CHANGELOG.md
            python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '''- **Recover Noema from provider-truncated structured review completions (`#1596`).**
            The review client now retains bounded `finish_reason`, model, and token-usage
            metadata from the OpenAI-compatible envelope, requests JSON mode with an
            explicit 4,096-token output budget through Contextual Orchestrator, and
            constrains verdict cardinality and field lengths. A provider-declared
            `finish_reason=length` receives one compact exact-head repair request; a
            repeated length stop fails closed as `truncated_after_retry`, distinct from
            `invalid_json_after_retry`. Raw model output remains absent from public logs.
          '''.replace('        ', '')
          if entry not in text:
              marker = '## [Unreleased]\n'
              if text.count(marker) != 1:
                  raise SystemExit('CHANGELOG Unreleased marker changed; refusing restack')
              text = text.replace(marker, marker + entry, 1)
          path.write_text(text, encoding='utf-8')
          PY
            git add CHANGELOG.md
          fi

          rm .github/workflows/tmp-pr1606-current-main-restack.yml
          git add -A

          test -z "$(git diff --name-only --diff-filter=U)"
          actual_paths="$(git diff --cached --name-only "${MAIN_SHA}" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' CHANGELOG.md scripts/ci/noema_review_gate.py tests/test_noema_truncated_completion_contract.py | LC_ALL=C sort)"
          test "${actual_paths}" = "${expected_paths}"
          git diff --cached --check "${MAIN_SHA}"
          PYTHONPATH=. python -m pytest -q tests/test_noema_truncated_completion_contract.py
          python3 -m py_compile scripts/ci/noema_review_gate.py

          git fetch origin "${EXPECTED_REF}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git commit -m "chore(noema): restack truncation repair on current main"
          git push origin "HEAD:${EXPECTED_REF}"
