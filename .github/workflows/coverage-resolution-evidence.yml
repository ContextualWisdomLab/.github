name: Coverage resolution evidence

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/coverage-resolution-evidence.yml

permissions:
  contents: read

concurrency:
  group: coverage-resolution-evidence
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.actor == 'seonghobae'
      && github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact evidence head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize reviewed reconciliation helper and stage merged tree
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git show 96aef94ce4d28c863f9fa5d8e0f468a240860b53:scripts/ci/pr759_reconcile.py \
            > scripts/ci/reconcile_coverage_tree.py
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/reconcile_coverage_tree.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'Path(__file__).unlink(missing_ok=True)',
              'Path(__file__).unlink(missing_ok=True)',
              1,
          )
          old = '''    expected = {"CHANGELOG.md", "scripts/ci/materialize_base_python_requirements.py"}
          if unresolved != expected:
              raise SystemExit(f"unexpected merge conflict set: {sorted(unresolved)}")
          '''
          new = '''    expected_conflict_sets = (
              {"CHANGELOG.md", "scripts/ci/materialize_base_python_requirements.py"},
              {"scripts/ci/materialize_base_python_requirements.py"},
          )
          if unresolved not in expected_conflict_sets:
              raise SystemExit(f"unexpected merge conflict set: {sorted(unresolved)}")
          '''
          if source.count(old) != 1:
              raise SystemExit('coverage reconciliation conflict contract drifted')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/ci/reconcile_coverage_tree.py
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install merged hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify merged diagnostics, trusted uv, libclang, and Strix contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_coverage_native_fuzz_lock_boundary.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_strix_dependency_security_floor.py \
            tests/test_opencode_libclang_toolchain_contract.py \
            --cov=scripts.ci.coverage_failure_summary \
            --cov=scripts.ci.materialize_base_javascript_packages \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov=scripts.ci.sanitize_github_output_summary \
            --cov-branch \
            --cov-fail-under=100 \
            -q
          python -m pytest -q \
            tests/test_strix_model_utils_source_dirs.py \
            tests/test_opencode_agent_contract.py
          python -m interrogate --fail-under 100 \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m compileall -q scripts/ci tests
          bash -n scripts/ci/strix_model_utils.sh scripts/ci/strix_quick_gate.sh scripts/ci/test_strix_quick_gate.sh
          git diff --check

      - name: Upload verified resolved files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage-resolved-files-${{ github.run_id }}
          path: |
            CHANGELOG.md
            .github/workflows/opencode-coverage-diagnostics-ci.yml
            .github/workflows/opencode-review-dispatch.yml
            docs/doctoring/opencode-llvm-coverage-toolchain.md
            scripts/ci/materialize_base_python_requirements.py
            tests/test_coverage_materializer_failure_diagnostics.py
            tests/test_opencode_libclang_toolchain_contract.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Publish bounded artifact locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          body="<!-- coverage-resolved-tree-evidence head_sha=${HEAD_SHA} run_id=${RUN_ID} -->

          Verified read-only resolved-tree evidence is available for exact head \`${HEAD_SHA}\` in workflow run \`${RUN_ID}\`."
          gh api -X POST repos/ContextualWisdomLab/.github/issues/759/comments -f "body=$body"
