name: One-shot PR 782 explicit push contract repair

on:
  push:
    branches: [fix/hourly-nvidia-nim-review-repair-main]
    paths:
      - .github/workflows/one-shot-pr782-explicit-push-contract.yml

permissions:
  contents: write

concurrency:
  group: one-shot-pr782-explicit-push-contract
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/hourly-nvidia-nim-review-repair-main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Align the regression with the protected explicit push destination
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_opencode_agent_contract.py")
          source = path.read_text(encoding="utf-8")
          old = '    assert \'git push origin "HEAD:${PR_HEAD_REF}"\' in worker\n'
          new = (
              '    assert \'expected_origin="${GITHUB_SERVER_URL}/${TARGET_REPOSITORY}.git"\' in worker\n'
              '    assert (\n'
              '        \'git -c core.hooksPath=/dev/null push "$expected_origin" \'\n'
              '        \'"HEAD:${PR_HEAD_REF}"\'\n'
              '        in worker\n'
              '    )\n'
              '    assert \'git push origin "HEAD:${PR_HEAD_REF}"\' not in worker\n'
          )
          if source.count(old) != 1:
              raise SystemExit(
                  f"expected one stale origin-push assertion, found {source.count(old)}"
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify focused and complete quality contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_opencode_agent_contract.py::test_autofix_worker_resolves_merge_conflicts_fail_closed
          python -m pytest -q \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov=scripts.ci.pr_review_autofix_context \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate \
            --fail-under 100 \
            scripts/ci/pr_review_conflict_scope.py \
            scripts/ci/pr_review_autofix_context.py
          python -m compileall -q \
            scripts/ci/pr_review_conflict_scope.py \
            scripts/ci/pr_review_autofix_context.py \
            tests/test_opencode_agent_contract.py \
            tests/test_pr_review_conflict_scope.py \
            tests/test_hourly_autofix_context_quality_gate.py \
            tests/test_pr_review_conflict_scope_git_executable.py \
            tests/test_pr_review_conflict_scope_ignored_paths.py \
            tests/test_pr_review_conflict_scope_symlink_targets.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py
          git diff --check

      - name: Publish verified repair and remove this workflow
        env:
          BRANCH_NAME: fix/hourly-nvidia-nim-review-repair-main
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-pr782-explicit-push-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_opencode_agent_contract.py \
            .github/workflows/one-shot-pr782-explicit-push-contract.yml
          git diff --cached --quiet && { echo "No push-contract repair generated" >&2; exit 1; }
          git commit -m "test(autofix): require explicit protected push destination"
          git push origin "HEAD:${BRANCH_NAME}"
