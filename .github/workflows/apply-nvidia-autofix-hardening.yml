name: Apply NVIDIA NIM autofix hardening

on:
  push:
    branches:
      - fix/hourly-nvidia-nim-autofix
    paths:
      - .github/workflows/apply-nvidia-autofix-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-nvidia-autofix-hardening
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/hourly-nvidia-nim-autofix
          fetch-depth: 0

      - name: Apply reviewed trust-boundary changes
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/pr-review-autofix.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          mutable_checkout = (
              '          repository: ContextualWisdomLab/.github\n'
              '          fetch-depth: 1\n'
          )
          pinned_checkout = (
              '          repository: ContextualWisdomLab/.github\n'
              '          ref: ${{ github.sha }}\n'
              '          fetch-depth: 1\n'
          )
          if workflow.count(mutable_checkout) != 1:
              raise SystemExit('trusted source checkout marker was not unique')
          workflow = workflow.replace(mutable_checkout, pinned_checkout, 1)

          permission_marker = (
              '              "task": "deny",\n'
              '              "webfetch": "deny",\n'
          )
          hardened_permissions = (
              '              "task": "deny",\n'
              '              "skill": "deny",\n'
              '              "question": "deny",\n'
              '              "webfetch": "deny",\n'
              '              "websearch": "deny",\n'
              '              "lsp": "deny",\n'
              '              "external_directory": "deny",\n'
              '              "doom_loop": "deny"\n'
          )
          existing_tail = (
              '              "task": "deny",\n'
              '              "webfetch": "deny",\n'
              '              "websearch": "deny",\n'
              '              "lsp": "deny",\n'
              '              "external_directory": "deny"\n'
          )
          if workflow.count(existing_tail) != 2:
              raise SystemExit('OpenCode permission marker count was not two')
          workflow = workflow.replace(existing_tail, hardened_permissions)

          if workflow.count('ref: ${{ github.sha }}') != 1:
              raise SystemExit('trusted checkout was not pinned exactly once')
          for permission_name in ('skill', 'question', 'doom_loop'):
              expected = f'"{permission_name}": "deny"'
              if workflow.count(expected) != 2:
                  raise SystemExit(f'{permission_name} deny count was not two')

          workflow_path.write_text(workflow, encoding='utf-8')
          Path('.github/workflows/apply-nvidia-autofix-hardening.yml').unlink()

      - name: Commit hardened workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/pr-review-autofix.yml \
            .github/workflows/apply-nvidia-autofix-hardening.yml
          git commit -m "fix(ci): harden NVIDIA NIM autofix trust boundary"
          git push origin HEAD:fix/hourly-nvidia-nim-autofix
