name: One-shot finalize PR 782 conflict scope

on:
  push:
    branches: [fix/hourly-nvidia-nim-review-repair-main]
    paths:
      - .github/workflows/one-shot-finalize-pr782.yml

concurrency:
  group: one-shot-finalize-pr782-conflict-scope
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/hourly-nvidia-nim-review-repair-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/hourly-nvidia-nim-review-repair-main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply the permanent conflict-scope boundary
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow_path = Path(".github/workflows/pr-review-autofix.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_entry = '''          if [ -n "$conflicted_files" ]; then
            prompt_file="${RUNNER_TEMP}/opencode-conflict-prompt.md"
'''
          new_entry = '''          if [ -n "$conflicted_files" ]; then
            conflicted_paths_file="${RUNNER_TEMP}/opencode-conflicted-files.zlist"
            conflict_scope_snapshot="${RUNNER_TEMP}/opencode-conflict-workspace-before.json"
            git diff --name-only -z --diff-filter=U >"$conflicted_paths_file"
            python3 "$GITHUB_WORKSPACE/trusted-autofix-source/scripts/ci/pr_review_conflict_scope.py" snapshot \\
              --root "$TARGET_WORKSPACE" \\
              --output "$conflict_scope_snapshot"
            prompt_file="${RUNNER_TEMP}/opencode-conflict-prompt.md"
'''
          if new_entry not in workflow:
              if workflow.count(old_entry) != 1:
                  raise SystemExit("conflict-model entry anchor drifted")
              workflow = workflow.replace(old_entry, new_entry, 1)

          old_exit = '''            restore_workspace_config
            trap - EXIT
          fi

          # Fail closed: never push unresolved conflict markers.
'''
          new_exit = '''            restore_workspace_config
            trap - EXIT
            python3 "$GITHUB_WORKSPACE/trusted-autofix-source/scripts/ci/pr_review_conflict_scope.py" verify \\
              --root "$TARGET_WORKSPACE" \\
              --snapshot "$conflict_scope_snapshot" \\
              --allowed-paths "$conflicted_paths_file"
          fi

          # Fail closed: never push unresolved conflict markers.
'''
          if new_exit not in workflow:
              if workflow.count(old_exit) != 1:
                  raise SystemExit("conflict-model completion anchor drifted")
              workflow = workflow.replace(old_exit, new_exit, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          scope_path = Path("scripts/ci/pr_review_conflict_scope.py")
          scope_source = scope_path.read_text(encoding="utf-8")
          old_guard = '''    path = Path(raw_path)
    if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts):
        raise ValueError("repository path must be a normalized relative path")
    return raw_path
'''
          new_guard = '''    path = Path(raw_path)
    normalized_path = path.as_posix()
    if (
        path.is_absolute()
        or normalized_path != raw_path
        or any(part in {"", ".", ".."} for part in path.parts)
    ):
        raise ValueError("repository path must be a normalized relative path")
    return raw_path
'''
          if new_guard not in scope_source:
              if scope_source.count(old_guard) != 1:
                  raise SystemExit("relative-path validator drifted")
              scope_source = scope_source.replace(old_guard, new_guard, 1)
          scope_path.write_text(scope_source, encoding="utf-8")

          test_path = Path("tests/test_pr_review_conflict_scope.py")
          test_source = test_path.read_text(encoding="utf-8")
          old_workflow = '_WORKFLOW = Path(".github/workflows/pr-review-autofix.yml")\n'
          new_workflow = '''_REPOSITORY_ROOT = Path(__file__).resolve().parents[1]
_WORKFLOW = _REPOSITORY_ROOT / ".github/workflows/pr-review-autofix.yml"
_TEMPORARY_PR782_PATHS = (
    ".github/workflows/export-pr782-source.yml",
    ".github/workflows/finalize-pr782-conflict-scope.yml",
    ".github/workflows/one-shot-finalize-pr782.yml",
    ".github/workflows/one-shot-pr782-conflict-scope-repair.yml",
    ".github/workflows/repair-pr782-conflict-scope.yml",
    ".github/workflows/reopen-finalize-pr782.yml",
    "scripts/ci/repair_pr782_conflict_scope_once.py",
)
'''
          if new_workflow not in test_source:
              if test_source.count(old_workflow) != 1:
                  raise SystemExit("workflow path anchor drifted")
              test_source = test_source.replace(old_workflow, new_workflow, 1)

          old_paths = '["", "/absolute", "../escape", "nested/../escape"],'
          new_paths = '''[
        "",
        "/absolute",
        "../escape",
        "nested/../escape",
        "./relative",
        "a//b",
    ],'''
          if new_paths not in test_source:
              if test_source.count(old_paths) != 1:
                  raise SystemExit("invalid-path table drifted")
              test_source = test_source.replace(old_paths, new_paths, 1)

          absence_test = '''

def test_pr782_temporary_repair_automation_is_absent() -> None:
    """Completed PR-specific writer and export helpers must not reach the final tree."""

    for relative_path in _TEMPORARY_PR782_PATHS:
        assert not (_REPOSITORY_ROOT / relative_path).exists(), relative_path
'''
          marker = '\n\ndef test_workflow_snapshots_after_merge_and_verifies_before_staging() -> None:\n'
          if absence_test.strip() not in test_source:
              if test_source.count(marker) != 1:
                  raise SystemExit("workflow-order test marker drifted")
              test_source = test_source.replace(marker, absence_test + marker, 1)
          test_path.write_text(test_source, encoding="utf-8")

          doctoring_path = Path("docs/doctoring/hourly-nvidia-nim-autofix.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          if "## Conflict-resolution model write boundary" not in doctoring:
              marker = "\n## GitHub write boundary\n"
              section = dedent(
                  '''
                  ## Conflict-resolution model write boundary

                  A merge-conflict repair snapshots every tracked and non-ignored
                  untracked worktree path immediately after the validated base merge and
                  before OpenCode receives the task. Git's NUL-delimited unmerged-path
                  inventory is the only edit allowlist. After the model exits and its
                  temporary configuration is restored, regular-file hashes, sizes, modes,
                  symbolic-link targets, deletions, and newly created paths are compared
                  against the snapshot. Any difference outside the exact conflict set
                  fails before staging, commit, or push.

                  This is a file-publication boundary rather than an operating-system
                  sandbox. The model process separately receives no shell permission,
                  GitHub token, or Actions OIDC credential. Live-head, unresolved-marker,
                  syntax, merge-state, and protected-branch checks remain independent
                  defenses.
                  '''
              )
              if doctoring.count(marker) != 1:
                  raise SystemExit("doctoring write-boundary heading drifted")
              doctoring = doctoring.replace(marker, "\n" + section + marker, 1)
              doctoring_path.write_text(doctoring, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          bullet = (
              "- Snapshot the post-merge worktree before OpenCode conflict repair "
              "and reject every model-caused changed, created, deleted, or "
              "retargeted path outside Git's exact conflict allowlist before "
              "staging or push.\n"
          )
          if bullet not in changelog:
              anchor = "### Security\n\n"
              if changelog.count(anchor) != 1:
                  raise SystemExit("changelog Security heading drifted")
              changelog = changelog.replace(anchor, anchor + bullet, 1)
              changelog_path.write_text(changelog, encoding="utf-8")
          PY

          rm -f \
            .github/workflows/export-pr782-source.yml \
            .github/workflows/finalize-pr782-conflict-scope.yml \
            .github/workflows/one-shot-finalize-pr782.yml \
            .github/workflows/one-shot-pr782-conflict-scope-repair.yml \
            .github/workflows/repair-pr782-conflict-scope.yml \
            .github/workflows/reopen-finalize-pr782.yml \
            scripts/ci/repair_pr782_conflict_scope_once.py
          git diff --check

      - name: Verify permanent contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate --fail-under 100 scripts/ci/pr_review_conflict_scope.py
          python -m compileall -q \
            scripts/ci/pr_review_conflict_scope.py \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py
          git diff --check

      - name: Publish verified final tree
        env:
          BRANCH_NAME: fix/hourly-nvidia-nim-review-repair-main
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No final changes were produced" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(automation): enforce conflict repair write scope"
          git push origin "HEAD:${BRANCH_NAME}"
