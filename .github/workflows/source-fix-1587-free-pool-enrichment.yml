name: One-shot PR 1587 free-pool enrichment repair

on:
  push:
    branches:
      - fix/free-pool-credential-admission
    paths:
      - .github/workflows/source-fix-1587-free-pool-enrichment.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify RED, repair discovery enrichment, verify GREEN, and retire
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/free-pool-credential-admission
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 -m pip install --require-hashes --only-binary=:all: \
            -r requirements-opencode-review-ci-hashes.txt

          if PYTHONPATH=. python3 -m pytest -q \
            tests/test_contextual_orchestrator_free_pool_enrichment.py; then
            echo "::error::Expected the committed regression to fail before the source repair."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/contextual_orchestrator_review_launcher.py")
          text = path.read_text(encoding="utf-8")

          import_marker = "from typing import Any\n"
          policy_import = (
              "from scripts.ci.contextual_orchestrator_review_policy import "
              "FREE_POOL_CREDENTIAL_NAMES\n"
          )
          if policy_import not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("unexpected launcher import marker cardinality")
              text = text.replace(import_marker, import_marker + "\n" + policy_import)

          enrich_marker = "    enriched = dict(report)\n"
          free_rows_block = (
              "    free_rows = [row for row in rows if row.get(\"cost_evidence\") == \"free\"]\n"
              "    free_pool_rows = [\n"
              "        row\n"
              "        for row in free_rows\n"
              "        if isinstance(row.get(\"credential_key\"), str)\n"
              "        and row[\"credential_key\"] in FREE_POOL_CREDENTIAL_NAMES\n"
              "    ]\n"
          )
          if free_rows_block not in text:
              if text.count(enrich_marker) != 1:
                  raise SystemExit("unexpected discovery enrichment marker cardinality")
              text = text.replace(enrich_marker, free_rows_block + enrich_marker)

          old_total_free = (
              '            "total_free_routes": sum(row.get("cost_evidence") == "free" for row in rows),\n'
          )
          new_total_free = '            "total_free_routes": len(free_rows),\n'
          if old_total_free in text:
              text = text.replace(old_total_free, new_total_free, 1)

          old_diversity = (
              '            "free_account_diversity": len(\n'
              '                {\n'
              '                    provider_account(str(row["provider"]))\n'
              '                    for row in rows\n'
              '                    if row.get("cost_evidence") == "free"\n'
              '                }\n'
              '            ),\n'
          )
          new_diversity = (
              '            "free_account_diversity": len(\n'
              '                {provider_account(str(row["provider"])) for row in free_rows}\n'
              '            ),\n'
              '            "free_pool_admitted_routes": len(free_pool_rows),\n'
              '            "free_pool_excluded_source_count": len(free_rows) - len(free_pool_rows),\n'
              '            "free_pool_account_diversity": len(\n'
              '                {\n'
              '                    provider_account(str(row["provider"]))\n'
              '                    for row in free_pool_rows\n'
              '                }\n'
              '            ),\n'
          )
          if old_diversity not in text:
              raise SystemExit("unexpected free-account diversity block")
          text = text.replace(old_diversity, new_diversity, 1)
          path.write_text(text, encoding="utf-8")
          PY

          PYTHONPATH=. python3 -m pytest -q \
            tests/test_contextual_orchestrator_free_pool_enrichment.py \
            tests/test_contextual_orchestrator_free_credential_admission.py \
            tests/test_contextual_orchestrator_review_runtime_preflight.py
          git diff --check

          git rm .github/workflows/source-fix-1587-free-pool-enrichment.yml
          git add scripts/ci/contextual_orchestrator_review_launcher.py \
            tests/test_contextual_orchestrator_free_pool_enrichment.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): preserve free-pool counts across priced fallback"
          git push origin "HEAD:${TARGET_BRANCH}"
