name: Finalize PR 797 minimal

on:
  push:
    branches:
      - release/exact-artifact-sbom-attestation
    paths:
      - .github/pr797-finalize.trigger

permissions:
  contents: read

jobs:
  finalize:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply final test fixes
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          contract = Path('tests/test_exact_artifact_sbom_attestation_contract.py')
          source = contract.read_text(encoding='utf-8')
          old = '    assert "' + '$' + '{{ github.run_id }}" in intake\n'
          new = '    assert "GITHUB_RUN_ID" in intake\n'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('run-ID contract anchor is absent')
          contract.write_text(source, encoding='utf-8')

          hostile = Path('tests/test_verify_exact_artifact_sbom_handoff.py')
          source = hostile.read_text(encoding='utf-8')
          old = '    root.mkdir()\n'
          new = '    root.mkdir(parents=True)\n'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('fixture root anchor is absent')
          marker = 'def test_checksum_control_file_bounds_and_entrypoint_are_covered('
          if marker not in source:
              import base64
              payload = base64.b64decode('').decode('utf-8')
              source = source.rstrip() + payload
          hostile.write_text(source, encoding='utf-8')
          PY
          rm -f \
            .github/pr797-finalize.trigger \
            .github/workflows/finalize-pr797-minimal.yml \
            .github/workflows/finalize-pr797-on-ready.yml \
            .github/workflows/repair-pr797-exact-handoff.yml \
            .github/workflows/repair-pr797-final-coverage.yml \
            .github/workflows/trigger-pr797-exact-handoff-repair.yml
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Verify full quality
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q tests/test_exact_artifact_sbom_attestation_contract.py tests/test_verify_exact_artifact_sbom_handoff.py
          python -m coverage report --include=scripts/ci/verify_exact_artifact_sbom_handoff.py --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci/verify_exact_artifact_sbom_handoff.py
          python -m compileall -q scripts/ci/verify_exact_artifact_sbom_handoff.py tests/test_exact_artifact_sbom_attestation_contract.py tests/test_verify_exact_artifact_sbom_handoff.py
          git diff --check

      - name: Create immutable final commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr797-final.txt"
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'ContextualWisdomLab/.github'
          parent = os.environ['EXPECTED_HEAD']
          token = os.environ['API_TOKEN']
          root = f'https://api.github.com/repos/{repo}'
          expected = {
              '.github/pr797-finalize.trigger',
              '.github/workflows/finalize-pr797-minimal.yml',
              '.github/workflows/finalize-pr797-on-ready.yml',
              '.github/workflows/repair-pr797-exact-handoff.yml',
              '.github/workflows/repair-pr797-final-coverage.yml',
              '.github/workflows/trigger-pr797-exact-handoff-repair.yml',
              'tests/test_exact_artifact_sbom_attestation_contract.py',
              'tests/test_verify_exact_artifact_sbom_handoff.py',
          }
          def request(method, endpoint, payload=None):
              req = urllib.request.Request(root + endpoint, data=None if payload is None else json.dumps(payload).encode(), method=method, headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'cwl-pr797-finalizer'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          raw = subprocess.check_output(['git','diff','--name-status','-z','HEAD']).decode().split('\0')
          changes=[]
          i=0
          while i < len(raw)-1:
              changes.append((raw[i],raw[i+1])); i += 2
          actual={path for _,path in changes}
          if actual != expected:
              raise SystemExit(f'path mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          parent_obj=request('GET',f'/git/commits/{parent}')
          entries=[]
          for status,path in changes:
              if status == 'D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else:
                  blob=request('POST','/git/blobs',{'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'})
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('POST','/git/trees',{'base_tree':parent_obj['tree']['sha'],'tree':entries})
          commit=request('POST','/git/commits',{'message':'test: complete exact artifact handoff coverage','tree':tree['sha'],'parents':[parent]})
          print('PR797_FINAL_PARENT_SHA=' + parent)
          print('PR797_FINAL_COMMIT_SHA=' + commit['sha'])
          PY

      - name: Publish final pointer
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          commit_sha="$(sed -n 's/^PR797_FINAL_COMMIT_SHA=//p' "${RUNNER_TEMP}/pr797-final.txt")"
          test "${#commit_sha}" -eq 40
          gh api --method POST repos/ContextualWisdomLab/.github/issues/797/comments -f "body=PR797_FINAL_PARENT_SHA=${EXPECTED_HEAD}%0APR797_FINAL_COMMIT_SHA=${commit_sha}"
