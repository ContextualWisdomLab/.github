name: Source fix Strix no-heuristic retry and severity

on:
  push:
    branches:
      - fix/strix-free-only-model-normalization-20260902

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply RED-before-GREEN exact-source repair
        shell: bash
        run: python3 scripts/ci/source_fix_strix_no_heuristic_retry_severity.py

      - name: Verify focused contracts and syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_strix_no_heuristic_retry_contract.py \
            tests/test_strix_no_heuristic_severity_contract.py \
            tests/test_required_workflow_queue_contract.py
          bash -n scripts/ci/strix_quick_gate.sh
          git diff --check

      - name: Remove one-shot repair artifacts and publish non-destructively
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/source-fix-strix-no-heuristic-retry-severity.yml \
            scripts/ci/source_fix_strix_no_heuristic_retry_severity.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(strix): remove heuristic retry and severity admission"
          git push origin HEAD:fix/strix-free-only-model-normalization-20260902
