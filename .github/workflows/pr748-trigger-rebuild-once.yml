name: PR 748 Trigger Current-Main Rebuild Once

on:
  push:
    branches:
      - fix/npm-workspace-coverage-root-clean
    paths:
      - .github/workflows/pr748-trigger-rebuild-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trigger:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/npm-workspace-coverage-root-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Refuse concurrent branch movement
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: fix/npm-workspace-coverage-root-clean
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Touch rebuild source and remove trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rebuild-pr748-current-main.yml')
          text = path.read_text(encoding='utf-8')
          old = '# Re-run after replacing the hard-coded patch path with a private temporary directory.\n'
          new = '# Re-run on the reconciled current-main head with the private temporary patch directory.\n'
          if text.count(old) != 1:
              raise SystemExit('rebuild trigger comment anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -- .github/workflows/pr748-trigger-rebuild-once.yml
          git diff --check

      - name: Commit and trigger bounded rebuild
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: fix/npm-workspace-coverage-root-clean
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(coverage): rerun PR 748 current-main rebuild"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
