name: Finalize npm workspace review feedback

on:
  push:
    branches: [fix/npm-workspace-coverage-root]
    paths:
      - scripts/ci/finalize_npm_workspace_review_feedback.py
      - .github/workflows/finalize-npm-workspace-review-feedback.yml
  workflow_dispatch:

concurrency:
  group: finalize-npm-workspace-review-feedback
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.actor != 'github-actions[bot]'
      && github.ref_name == 'fix/npm-workspace-coverage-root'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/npm-workspace-coverage-root
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Install hash-pinned verification tools
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply reviewed resolver cleanup
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci/finalize_npm_workspace_review_feedback.py
          python3 scripts/ci/finalize_npm_workspace_review_feedback.py

      - name: Verify behavior, coverage, docstrings, and lint
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/ci/npm_workspace_install_root.py \
            tests/npm_workspace_test_support.py \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py
          python3 -m pytest -q \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py
          python3 -m coverage erase
          python3 -m coverage run \
            --source=scripts.ci.npm_workspace_install_root \
            -m pytest -q \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py
          python3 -m coverage report --show-missing --fail-under=100
          python3 -m interrogate --fail-under=100 scripts/ci/npm_workspace_install_root.py
          python3 -m ruff check \
            scripts/ci/npm_workspace_install_root.py \
            tests/npm_workspace_test_support.py \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py
          git diff --check
          test ! -e scripts/ci/finalize_npm_workspace_review_feedback.py

      - name: Commit verified cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No resolver review changes to commit."
            exit 0
          fi
          git commit -m "refactor(coverage): address npm resolver review feedback"
          git push origin HEAD:refs/heads/fix/npm-workspace-coverage-root
