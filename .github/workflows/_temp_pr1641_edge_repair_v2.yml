name: Temporary PR1641 robust edge repair

on:
  push:
    branches:
      - fix/noema-observed-defect-corpus-current-main-20260902

concurrency:
  group: temp-pr1641-edge-v2-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Re-prove RED and apply exact-source repair
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"

          python - <<'PY'
          from pathlib import Path

          target = Path("tests/test_noema_class_evidence_observation_contract.py")
          text = target.read_text()
          marker = "def test_whitespace_only_changed_source_requires_explicit_blank_marker() -> None:"
          if marker not in text:
              text = text.rstrip() + r'''


def test_whitespace_only_changed_source_requires_explicit_blank_marker() -> None:
    source = "    "
    diff = f"""diff --git a/src/tool.py b/src/tool.py
--- a/src/tool.py
+++ b/src/tool.py
@@ -1 +1 @@
-old = 1
+{source}
"""
    verdict = _verdict(observations=True, source_excerpt=True)
    for probe in verdict["adversarial_validation"]["probes"]:
        for field, witness in probe["class_evidence"].items():
            witness["source_excerpt"] = source
            witness["observation"] = f"Incidental    spacing for {probe['probe_kind']}:{field}."
    with pytest.raises(noema.NoemaModelOutputError, match="quote the exact source_excerpt"):
        noema.validate_substantive_verdict(verdict, diff, ["src/tool.py"])


def test_long_changed_line_uses_structural_exact_source_binding() -> None:
    source = "x" * (noema.MAX_THREAD_BODY_CHARS + 64)
    diff = f"""diff --git a/src/tool.py b/src/tool.py
--- a/src/tool.py
+++ b/src/tool.py
@@ -1 +1 @@
-old = 1
+{source}
"""
    verdict = _verdict(observations=True, source_excerpt=True)
    for probe in verdict["adversarial_validation"]["probes"]:
        for field, witness in probe["class_evidence"].items():
            witness["source_excerpt"] = source
            witness["observation"] = f"Bounded structural observation for {probe['probe_kind']}:{field}."
    noema.validate_substantive_verdict(verdict, diff, ["src/tool.py"])
''' + "\n"
              target.write_text(text)
          PY

          for spec in \
            tests/test_noema_class_evidence_observation_contract.py::test_whitespace_only_changed_source_requires_explicit_blank_marker \
            tests/test_noema_class_evidence_observation_contract.py::test_long_changed_line_uses_structural_exact_source_binding; do
            set +e
            python -m pytest -q "$spec" >/tmp/red.log 2>&1
            rc=$?
            set -e
            cat /tmp/red.log
            test "$rc" -ne 0
            grep -q "1 failed" /tmp/red.log
          done

          python - <<'PY'
          from pathlib import Path

          gate = Path("scripts/ci/noema_review_gate.py")
          text = gate.read_text()
          start_marker = '        source_marker = source_excerpt if source_excerpt else "<blank>"\n'
          end_marker = '        expected_claim_role = OBSERVED_REVIEW_PROBE_CLAIM_ROLES[probe_kind][field]\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''        source_is_blank = not source_excerpt.strip()
        source_marker = "<blank>" if source_is_blank else source_excerpt
        # Exact source identity is already established by equality against the
        # trusted changed-line map. Repetition inside bounded prose is required
        # only when the source can fit; blank/whitespace lines use <blank>.
        if source_is_blank or len(source_excerpt) <= MAX_THREAD_BODY_CHARS:
            if source_marker not in observation:
                raise NoemaModelOutputError(
                    f"Noema adversarial probe {index} class_evidence.{field} observation "
                    "must quote the exact source_excerpt (or <blank> for an empty line)"
                )
'''
          text = text[:start] + replacement + text[end:]
          old_prompt = "The observation must quote that exact source_excerpt (or <blank>) and explain the claimed behavior."
          new_prompt = "For an empty or whitespace-only source line the observation must quote <blank>; for a bounded nonblank source_excerpt it must quote the exact text. Longer nonblank lines remain exactly bound by source_excerpt equality while observation stays bounded and explains the claim."
          if old_prompt in text:
              text = text.replace(old_prompt, new_prompt, 1)
          gate.write_text(text)

          docs = Path("docs/product-technical-gap-baseline.md")
          dtext = docs.read_text()
          heading = "## 2026-09-02 — Noema exact-source edge binding"
          if heading not in dtext:
              docs.write_text(dtext.rstrip() + "\n\n" + heading + "\n\nExact source identity remains the equality check between `class_evidence.source_excerpt` and the trusted changed-side diff map. Whitespace-only changed lines now require the explicit `<blank>` observation marker; nonblank changed lines longer than the bounded observation cap remain admissible because structural source equality, not impossible prose repetition, is authoritative. Regression fixtures cover both edge orderings.\n")

          changelog = Path("CHANGELOG.md")
          ctext = changelog.read_text()
          entry = "- Harden Noema exact-source evidence edges: whitespace-only changed lines require `<blank>`, while over-cap nonblank lines retain exact structural source binding without impossible bounded-prose repetition.\n"
          if entry not in ctext:
              heading = "## [Unreleased]\n"
              if heading in ctext:
                  ctext = ctext.replace(heading, heading + entry, 1)
              else:
                  ctext = entry + ctext
              changelog.write_text(ctext)
          PY

          git add scripts/ci/noema_review_gate.py tests/test_noema_class_evidence_observation_contract.py docs/product-technical-gap-baseline.md CHANGELOG.md
          python -m pytest -q \
            tests/test_noema_class_evidence_observation_contract.py \
            tests/test_noema_observed_defect_corpus_current_main.py
          python -m pytest -q tests/test_noema_*.py
          python -m compileall -q scripts/ci
          git diff --check

          git rm -f .github/workflows/_temp_pr1641_source_evidence_edge_repair.yml
          git rm -f .github/workflows/_temp_pr1641_edge_repair_v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git commit -m "fix(noema): harden exact-source evidence edges"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
