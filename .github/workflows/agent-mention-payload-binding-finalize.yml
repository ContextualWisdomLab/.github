# Exact-head retrigger: 2026-08-06T06:20Z
name: Agent mention payload-binding finalizer

on:
  push:
    branches:
      - feat/review-agent-mention-router-main
    paths:
      - .github/workflows/agent-mention-payload-binding-finalize.yml

permissions:
  contents: read

concurrency:
  group: pr787-payload-binding-finalizer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/feat/review-agent-mention-router-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply the reviewed permanent repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: python scripts/ci/apply_pr787_payload_binding.py

      - name: Remove every branch-only repair artifact
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -f \
            .github/pr787-payload-repair.trigger \
            .github/workflows/agent-mention-payload-binding-finalize.yml \
            .github/workflows/repair-pr787-export-reviewed-files.yml \
            .github/workflows/repair-pr787-export-workflows.yml \
            .github/workflows/repair-pr787-finalize-payload-binding.yml \
            .github/workflows/repair-pr787-noema-base-branch.yml \
            .github/workflows/repair-pr787-payload-binding-push.yml \
            .github/workflows/repair-pr787-payload-bound-invocation.yml \
            .github/workflows/repair-pr787-payload-bound-v2.yml \
            .github/workflows/repair-pr787-payload-candidate.yml \
            .github/workflows/repair-pr787-payload-digest.yml \
            .github/workflows/repair-pr787-payload-upload.yml \
            scripts/ci/apply_pr787_payload_binding.py \
            scripts/ci/repair_pr787_payload_bound_once.py

      - name: Verify complete behavior and quality contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/agent_mention_router.py
              scripts/ci/agent_mention_sweep.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py \
            tests/test_agent_mention_idempotency.py \
            tests/test_agent_mention_downstream_idempotency.py \
            tests/test_agent_mention_receipt_authority.py
          python -m coverage report --fail-under=100
          python -m interrogate --fail-under=100 \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py
          python -m compileall -q \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py \
            tests/test_agent_mention_idempotency.py \
            tests/test_agent_mention_downstream_idempotency.py \
            tests/test_agent_mention_receipt_authority.py
          git diff --check

      - name: Prove the permanent payload and credential boundary
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path("scripts/ci/agent_mention_router.py").read_text(encoding="utf-8")
          noema_start = router.index("def noema_payload")
          opencode_start = router.index("def opencode_payload")
          noema_block = router[noema_start:opencode_start]
          assert '"base_branch": request.pull_request_base_branch' in noema_block

          for workflow_path in (
              Path(".github/workflows/agent-mention-noema-dispatch.yml"),
              Path(".github/workflows/agent-mention-opencode-dispatch.yml"),
          ):
              workflow = workflow_path.read_text(encoding="utf-8")
              assert "contents: read" in workflow
              assert "hmac.compare_digest" in workflow
              assert '"base_branch"' in workflow
              assert '"source_comment_id"' in workflow
              assert '"requested_by"' in workflow

          temporary = [
              path
              for path in Path(".github/workflows").glob("repair-pr787-*")
              if path.exists()
          ]
          assert not temporary, temporary
          assert not Path("scripts/ci/apply_pr787_payload_binding.py").exists()
          assert not Path("scripts/ci/repair_pr787_payload_bound_once.py").exists()
          PY

      - name: Publish the verified product-only commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: feat/review-agent-mention-router-main
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No verified product repair was produced." >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(automation): bind review dispatch keys to payloads"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
