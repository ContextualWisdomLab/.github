name: Dispatch exact-head review for central baseline

on:
  push:
    branches: [fix/hourly-nvidia-nim-autofix]
    paths:
      - .github/workflows/dispatch-central-review-731.yml

concurrency:
  group: dispatch-central-review-731
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  dispatch:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EXPECTED_TRIGGER_SHA: ${{ github.sha }}
      TARGET_REPOSITORY: ContextualWisdomLab/.github
      PR_NUMBER: "731"
      EXPECTED_BASE_REF: main
      EXPECTED_BASE_SHA: 3f65dbee6672b78802e7d71d49c390f3817bb03b
      EXPECTED_HEAD_REF: fix/strix-python-security-cves
      EXPECTED_HEAD_SHA: e672f23d539114068ff74a7f190789217d15ef93
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact trigger head
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_TRIGGER_SHA" ]; then
            printf '::error::Checkout SHA %s did not match trigger SHA %s.\n' \
              "$actual_sha" "$EXPECTED_TRIGGER_SHA"
            exit 1
          fi

      - name: Exchange OpenCode App token
        id: app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || \
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo '::error::OIDC request environment is missing.'
            exit 1
          fi
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator='&'
          case "$request_url" in
            *\?*) ;;
            *) separator='?' ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          [ -n "$oidc_token" ] || { echo '::error::OIDC token response was empty.'; exit 1; }
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          [ -n "$app_token" ] || { echo '::error::OpenCode App token response was empty.'; exit 1; }
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Validate live PR and dispatch existing reviewer
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          [ "$(jq -r '.state' <<<"$live_pr")" = 'open' ] || { echo '::error::PR is not open.'; exit 1; }
          [ "$(jq -r '.base.ref' <<<"$live_pr")" = "$EXPECTED_BASE_REF" ] || { echo '::error::Base ref moved.'; exit 1; }
          [ "$(jq -r '.base.sha' <<<"$live_pr")" = "$EXPECTED_BASE_SHA" ] || { echo '::error::Base SHA moved.'; exit 1; }
          [ "$(jq -r '.head.ref' <<<"$live_pr")" = "$EXPECTED_HEAD_REF" ] || { echo '::error::Head ref moved.'; exit 1; }
          [ "$(jq -r '.head.sha' <<<"$live_pr")" = "$EXPECTED_HEAD_SHA" ] || { echo '::error::Head SHA moved.'; exit 1; }
          jq -n \
            --arg target_repository "$TARGET_REPOSITORY" \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_base_ref "$EXPECTED_BASE_REF" \
            --arg pr_base_sha "$EXPECTED_BASE_SHA" \
            --arg pr_head_ref "$EXPECTED_HEAD_REF" \
            --arg pr_head_sha "$EXPECTED_HEAD_SHA" \
            '{event_type:"opencode-review",client_payload:{target_repository:$target_repository,pr_number:$pr_number,pr_base_ref:$pr_base_ref,pr_base_sha:$pr_base_sha,pr_head_ref:$pr_head_ref,pr_head_sha:$pr_head_sha}}' \
            >"$RUNNER_TEMP/dispatch.json"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${TARGET_REPOSITORY}/dispatches" \
            --input "$RUNNER_TEMP/dispatch.json"

      - name: Remove one-shot dispatcher
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          helper_path='.github/workflows/dispatch-central-review-731.yml'
          helper_sha="$(git rev-parse "HEAD:${helper_path}")"
          gh api \
            --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ContextualWisdomLab/.github/contents/${helper_path}" \
            -f message='ci: remove exact-head review dispatcher' \
            -f branch='fix/hourly-nvidia-nim-autofix' \
            -f sha="$helper_sha" >/dev/null
