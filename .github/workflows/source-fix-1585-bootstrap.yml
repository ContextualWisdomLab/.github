name: One-shot PR 1585 repair bootstrap

on:
  push:
    branches:
      - fix/strix-control-plane-supersession-20260901
    paths:
      - .github/workflows/source-fix-1585-bootstrap.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Run the reviewed repair with pinned test dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/strix-control-plane-supersession-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bootstrap
          cd bootstrap
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 -m pip install --require-hashes --only-binary=:all: \
            -r requirements-opencode-review-ci-hashes.txt

          python3 - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/source-fix-1585-strix-control-plane-supersession.yml")
          lines = source.read_text(encoding="utf-8").splitlines()
          marker = "        run: |"
          start = lines.index(marker) + 1
          block = []
          for line in lines[start:]:
              if line.startswith("          "):
                  block.append(line[10:])
              elif not line:
                  block.append("")
              else:
                  break
          if not block:
              raise SystemExit("repair run block is empty")
          Path("/tmp/pr1585-repair.sh").write_text("\n".join(block) + "\n", encoding="utf-8")
          PY

          cd ..
          bash /tmp/pr1585-repair.sh

          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cleanup
          cd cleanup
          git checkout "$TARGET_BRANCH"
          git rm .github/workflows/source-fix-1585-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): retire PR 1585 repair bootstrap"
          git push origin "HEAD:${TARGET_BRANCH}"
