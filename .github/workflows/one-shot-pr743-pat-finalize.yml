name: One-shot PR 743 PAT finalization

on:
  push:
    branches:
      - fix/trusted-uv-lock-coverage-clean
    paths:
      - .github/workflows/one-shot-pr743-pat-finalize.yml

concurrency:
  group: one-shot-pr743-pat-finalization
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/trusted-uv-lock-coverage-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply, verify, and publish bounded repairs
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_PARENT_SHA: db4dc6c57d1a0b8149fdc6dac0e882f3eac12026
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          HEAD_BRANCH: fix/trusted-uv-lock-coverage-clean
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test -n "$PUSH_TOKEN"
          python3 -I - <<'PY'
          from pathlib import Path


          def replace_exact(path: Path, old: str, new: str, expected: int) -> None:
              """Replace reviewed source text and fail when the branch has drifted."""
              content = path.read_text(encoding="utf-8")
              occurrences = content.count(old)
              if occurrences != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} repair targets, found {occurrences}"
                  )
              path.write_text(content.replace(old, new), encoding="utf-8")


          review_workflow = Path(".github/workflows/opencode-review-dispatch.yml")
          unisolated_git = (
              "              GIT_CONFIG_COUNT=1 \\\n"
              "              GIT_CONFIG_KEY_0=safe.directory \\\n"
          )
          isolated_git = (
              "              GIT_CONFIG_NOSYSTEM=1 \\\n"
              "              GIT_CONFIG_GLOBAL=/dev/null \\\n"
              + unisolated_git
          )
          replace_exact(review_workflow, unisolated_git, isolated_git, 3)

          strix_test = Path("scripts/ci/test_strix_quick_gate.sh")
          replace_exact(
              strix_test,
              "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6",
              "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0",
              1,
          )

          for temporary_workflow in (
              ".github/workflows/one-shot-pr743-apply-git-isolation.yml",
              ".github/workflows/one-shot-pr743-current-review-fixes.yml",
              ".github/workflows/one-shot-pr743-pat-finalize.yml",
          ):
              Path(temporary_workflow).unlink()
          PY
          python -m pytest -q tests/test_repository_branch_coverage_pr743_cleanup.py
          bash scripts/ci/test_strix_quick_gate.sh
          python -m pytest -q tests
          python -m compileall -q tests scripts/ci
          git diff --check
          test ! -e .github/workflows/one-shot-pr743-apply-git-isolation.yml
          test ! -e .github/workflows/one-shot-pr743-current-review-fixes.yml
          test ! -e .github/workflows/one-shot-pr743-pat-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(ci): complete bounded PR 743 review repairs"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
