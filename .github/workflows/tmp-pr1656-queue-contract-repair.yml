name: Temporary PR1656 Queue Contract Repair

on:
  push:
    branches:
      - fix/close-empty-noop-runner-712
    paths:
      - .github/workflows/tmp-pr1656-queue-contract-repair.yml

permissions:
  contents: write

jobs:
  repair-contract:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard unchanged branch head
        env:
          REPAIR_BRANCH: fix/close-empty-noop-runner-712
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${REPAIR_BRANCH}:refs/remotes/origin/${REPAIR_BRANCH}"
          remote_head="$(git rev-parse "refs/remotes/origin/${REPAIR_BRANCH}")"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Repair branch moved from ${GITHUB_SHA} to ${remote_head}; refusing to write."
            exit 1
          fi

      - name: Align the canonical close-event queue contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_required_workflow_queue_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''        else:\n            assert "cancel-closed-pr-runs:" in workflow\n            assert (\n                "PR closed; this run only cancels older runs through workflow concurrency."\n                in workflow\n            )\n        assert "github.event.action != 'closed'" in workflow\n'''
          new = '''        elif filename in {\n            "close-empty-pr.yml",\n            "osv-scanner-pr.yml",\n            "scorecard-pr.yml",\n        }:\n            assert "cancel-closed-pr-runs:" not in workflow\n            assert "cancel-in-progress: true" in workflow\n        else:\n            assert "cancel-closed-pr-runs:" in workflow\n            assert (\n                "PR closed; this run only cancels older runs through workflow concurrency."\n                in workflow\n            )\n        assert "github.event.action != 'closed'" in workflow\n'''
          if text.count(old) != 1:
              raise SystemExit("canonical close-event queue contract did not match exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pytest -q \
            tests/test_close_empty_pr_queue_pressure.py \
            tests/test_required_workflow_queue_contract.py::test_pull_request_close_events_cancel_superseded_runs_without_heavy_jobs
          git diff --check

      - name: Delete bounded repair workflow and push canonical commit
        env:
          REPAIR_BRANCH: fix/close-empty-noop-runner-712
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${REPAIR_BRANCH}:refs/remotes/origin/${REPAIR_BRANCH}"
          remote_head="$(git rev-parse "refs/remotes/origin/${REPAIR_BRANCH}")"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Repair branch moved before publish; refusing to write."
            exit 1
          fi
          rm .github/workflows/tmp-pr1656-queue-contract-repair.yml
          git config user.name "cwl-queue-contract-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_required_workflow_queue_contract.py .github/workflows/tmp-pr1656-queue-contract-repair.yml
          git commit -m "test(actions): align close-event queue contract"
          git push origin "HEAD:refs/heads/${REPAIR_BRANCH}"
