name: Release Dependency License and Strix Gate

# Central pre-publish dependency gate (issue #2342). A release workflow calls
# this BEFORE it publishes anything. There is no neutral outcome: the gate
# either succeeds or the release is refused. The organization's scheduled SBOM
# roll-up (scripts/ci/sbom_inventory_aggregator.py) is informational governance
# reporting and is deliberately not reused here.
#
# On success the job's outputs are exactly the inputs of
# .github/workflows/exact-artifact-sbom-attestation.yml, so the caller chains:
#
#   gate:
#     uses: ContextualWisdomLab/.github/.github/workflows/release-dependency-license-strix-gate.yml@<sha>
#     secrets: inherit
#   attest:
#     needs: gate
#     uses: ContextualWisdomLab/.github/.github/workflows/exact-artifact-sbom-attestation.yml@<sha>
#     with:
#       source_repository: ${{ needs.gate.outputs.source_repository }}
#       ...
#
# Provenance then covers exactly the bytes the gate examined.

on:
  workflow_call:
    inputs:
      source_repository:
        description: Release repository in owner/name form.
        required: true
        type: string
      source_sha:
        description: Exact release head commit SHA.
        required: true
        type: string
      ecosystems:
        description: Comma-separated ecosystems to enumerate (python and/or cargo).
        required: true
        type: string
      python_lock_path:
        description: Hash-pinned Python lock installed into the build environment.
        required: false
        type: string
        default: ""
      cargo_manifest_path:
        description: Release Cargo.toml whose Cargo.lock and build graph are gated.
        required: false
        type: string
        default: ""
      build_artifact_name:
        description: Caller artifact holding the exact wheel and sdist to publish.
        required: true
        type: string
      wheel_filename:
        description: Exact wheel filename inside the build artifact.
        required: true
        type: string
      sdist_filename:
        description: Exact source distribution filename inside the build artifact.
        required: true
        type: string
      evidence_artifact_name:
        description: Unique per-call sealed evidence name; also namespaces diagnostic reports. The default retains legacy report names.
        required: false
        type: string
        default: release-dependency-sealed-evidence
    # The five provider credentials are declared optional so the licence stage,
    # which needs none of them, can run on a review-only negative fixture that
    # never reaches Strix. Optional is not lenient: the Strix stage refuses to
    # start unless all five are present (STRIX_CREDENTIALS_ABSENT), so an allowed
    # input that reaches Strix without credentials fails closed rather than being
    # skipped, neutralized, or passed. `required: false` exists so a caller that
    # passes no secrets fails on the *licence decision* rather than on
    # `workflow_call` schema validation — a schema error is not evidence of a
    # licence denial or of Strix being blocked. It is not an invitation to supply
    # dummy secrets, and it does not widen any caller's secret exposure.
    secrets:
      BYTEZ_API_KEY:
        required: false
      NVIDIA_NIM_API_KEY:
        required: false
      NVIDIA_NIM_API_KEY_SUB:
        required: false
      OPENROUTER_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
    outputs:
      source_repository:
        description: Gated release repository.
        value: ${{ jobs.gate.outputs.source_repository }}
      source_sha:
        description: Gated release head SHA.
        value: ${{ jobs.gate.outputs.source_sha }}
      evidence_artifact_id:
        description: Immutable same-run sealed evidence artifact ID.
        value: ${{ jobs.gate.outputs.evidence_artifact_id }}
      evidence_artifact_name:
        description: Sealed evidence artifact name.
        value: ${{ jobs.gate.outputs.evidence_artifact_name }}
      evidence_artifact_digest:
        description: Sealed evidence artifact digest in sha256:<hex> form.
        value: ${{ jobs.gate.outputs.evidence_artifact_digest }}
      wheel_filename:
        description: Exact gated wheel filename.
        value: ${{ jobs.gate.outputs.wheel_filename }}
      wheel_sha256:
        description: SHA-256 of the exact gated wheel.
        value: ${{ jobs.gate.outputs.wheel_sha256 }}
      wheel_sbom_filename:
        description: CycloneDX SBOM filename for the gated wheel.
        value: ${{ jobs.gate.outputs.wheel_sbom_filename }}
      wheel_sbom_sha256:
        description: SHA-256 of the gated wheel's CycloneDX SBOM.
        value: ${{ jobs.gate.outputs.wheel_sbom_sha256 }}
      sdist_filename:
        description: Exact gated source distribution filename.
        value: ${{ jobs.gate.outputs.sdist_filename }}
      sdist_sha256:
        description: SHA-256 of the exact gated source distribution.
        value: ${{ jobs.gate.outputs.sdist_sha256 }}
      sdist_sbom_filename:
        description: CycloneDX SBOM filename for the gated source distribution.
        value: ${{ jobs.gate.outputs.sdist_sbom_filename }}
      sdist_sbom_sha256:
        description: SHA-256 of the gated source distribution's CycloneDX SBOM.
        value: ${{ jobs.gate.outputs.sdist_sbom_sha256 }}
      source_identity_sha256:
        description: SHA-256 of the sealed source-identity.json.
        value: ${{ jobs.gate.outputs.source_identity_sha256 }}
      checksum_sha256:
        description: SHA-256 of the sealed checksums.sha256.
        value: ${{ jobs.gate.outputs.checksum_sha256 }}
      predicate_type:
        description: Canonical CycloneDX in-toto predicate type.
        value: ${{ jobs.gate.outputs.predicate_type }}
      cyclonedx_schema:
        description: Canonical CycloneDX 1.7 schema URL.
        value: ${{ jobs.gate.outputs.cyclonedx_schema }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    name: Gate every resolved dependency before publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      source_repository: ${{ steps.seal.outputs.source_repository }}
      source_sha: ${{ steps.seal.outputs.source_sha }}
      evidence_artifact_id: ${{ steps.sealed-evidence.outputs.artifact-id }}
      evidence_artifact_name: ${{ steps.seal.outputs.evidence_artifact_name }}
      evidence_artifact_digest: sha256:${{ steps.sealed-evidence.outputs.artifact-digest }}
      wheel_filename: ${{ steps.seal.outputs.wheel_filename }}
      wheel_sha256: ${{ steps.seal.outputs.wheel_sha256 }}
      wheel_sbom_filename: ${{ steps.seal.outputs.wheel_sbom_filename }}
      wheel_sbom_sha256: ${{ steps.seal.outputs.wheel_sbom_sha256 }}
      sdist_filename: ${{ steps.seal.outputs.sdist_filename }}
      sdist_sha256: ${{ steps.seal.outputs.sdist_sha256 }}
      sdist_sbom_filename: ${{ steps.seal.outputs.sdist_sbom_filename }}
      sdist_sbom_sha256: ${{ steps.seal.outputs.sdist_sbom_sha256 }}
      source_identity_sha256: ${{ steps.seal.outputs.source_identity_sha256 }}
      checksum_sha256: ${{ steps.seal.outputs.checksum_sha256 }}
      predicate_type: ${{ steps.seal.outputs.predicate_type }}
      cyclonedx_schema: ${{ steps.seal.outputs.cyclonedx_schema }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Materialize immutable trusted gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ github.workflow_sha }}
          path: trusted-gate
          persist-credentials: false
          # The whole scripts/ci tree, not an enumerated file list: the trusted
          # Strix gate, the orchestrator sidecar and the token loader each source
          # siblings by their own directory (strix_model_utils.sh,
          # sanitize_contextual_orchestrator_sidecar_stream.py,
          # install_strix_timeout_compat.py, strix_timeout_compat.py, …), and an
          # enumeration silently breaks the moment one of them gains another.
          sparse-checkout: |
            scripts/ci/
            requirements-strix-ci-hashes.txt
          sparse-checkout-cone-mode: false

      - name: Validate the exact release identity before anything else runs
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # `workflow_call` can only type these inputs as `string`, so a branch
          # name or a short SHA would otherwise be accepted here and only caught
          # by the gate's own 40-hex check after Strix had already run. The shape
          # is therefore checked by the trusted gate before the release head is
          # even fetched, and long before any credential is materialized.
          python3 -I trusted-gate/scripts/ci/release_dependency_gate.py validate-inputs \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA"

      - name: Check out the exact release head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Set up the release build interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download the exact distributions the caller intends to publish
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build_artifact_name }}
          path: release-distributions

      - name: Collect the release closure without installing or executing it
        env:
          ECOSYSTEMS: ${{ inputs.ecosystems }}
          PYTHON_LOCK_PATH: ${{ inputs.python_lock_path }}
          CARGO_MANIFEST_PATH: ${{ inputs.cargo_manifest_path }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python_lock=""
          cargo_manifest=""
          if [ -n "$PYTHON_LOCK_PATH" ]; then
            python_lock="${PWD}/release-source/${PYTHON_LOCK_PATH}"
          fi
          if [ -n "$CARGO_MANIFEST_PATH" ]; then
            cargo_manifest="${PWD}/release-source/${CARGO_MANIFEST_PATH}"
          fi
          bash trusted-gate/scripts/ci/release_dependency_capture_raw.sh \
            --raw-root "${RUNNER_TEMP}/raw" \
            --capture-root "${RUNNER_TEMP}/capture" \
            --ecosystems "$ECOSYSTEMS" \
            --python-lock "$python_lock" \
            --download-root "${RUNNER_TEMP}/collected" \
            --cargo-manifest "$cargo_manifest"

      - name: Assemble per-dependency evidence and isolated synthetic fixtures
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ECOSYSTEMS: ${{ inputs.ecosystems }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          jq -n \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            --arg ecosystems "$ECOSYSTEMS" \
            '{source_repository: $repository, source_sha: $sha,
              ecosystems: ($ecosystems | split(","))}' \
            > "${RUNNER_TEMP}/capture/release.json"
          python3 -I trusted-gate/scripts/ci/release_dependency_gate.py capture \
            --raw "${RUNNER_TEMP}/raw" \
            --capture "${RUNNER_TEMP}/capture"

      - name: Refuse a denied or unverifiable licence before any credential exists
        id: license-stage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # The licence determination runs here, ahead of every credentialed and
          # model step, using the *same* evaluate_dependency_license path the final
          # gate uses — so a GPL/LGPL/AGPL dependency, an UNKNOWN licence, or an
          # `OR` expression with no recorded permissive selection refuses the
          # release before a provider secret is ever read. `capture` alone does not
          # reject a licence; it only assembles evidence and fixtures. This stage
          # also performs the full-set scope comparison, so an ecosystem whose
          # membership cannot be established fails here too.
          python3 -I trusted-gate/scripts/ci/release_dependency_gate.py prescreen \
            --capture "${RUNNER_TEMP}/capture" \
            --report "${RUNNER_TEMP}/license-report.json"

      - name: Install the prescreened closure into a lock-only environment
        if: ${{ inputs.python_lock_path != '' }}
        env:
          PYTHON_LOCK_PATH: ${{ inputs.python_lock_path }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # Installing runs dependency code, so it happens only after the licence
          # stage above has passed, and only from the bytes that stage judged:
          # --no-index --find-links over the collected distributions, with
          # --require-hashes so pip proves each file against the lock. Nothing is
          # re-resolved or re-downloaded, so the installed bytes are the inspected
          # bytes even when the lock records several hashes for a project.
          # --without-pip keeps the environment's contents exactly what the lock
          # installed, so LOCK_ENV_MISMATCH means a real disagreement.
          python3 -m venv --without-pip "${RUNNER_TEMP}/gate-venv"
          bash trusted-gate/scripts/ci/release_dependency_capture_raw.sh \
            --install-gated \
            --python-lock "${PWD}/release-source/${PYTHON_LOCK_PATH}" \
            --python-interpreter "${RUNNER_TEMP}/gate-venv/bin/python" \
            --capture-root "${RUNNER_TEMP}/capture" \
            --download-root "${RUNNER_TEMP}/collected" \
            --license-report "${RUNNER_TEMP}/license-report.json"

      - name: Require every Strix provider credential before the Strix stage starts
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # The secrets are optional on the contract so the licence stage above can
          # run without them. An allowed input that gets this far must still be
          # scanned, so absence is a refusal with STRIX_CREDENTIALS_ABSENT. This is
          # deliberately not an `if:` condition: a condition would *skip* the Strix
          # stage and let the release proceed unscanned. The reason code names only
          # the absent variables and never echoes or measures a present value.
          python3 -I trusted-gate/scripts/ci/release_dependency_gate.py require-strix-credentials

      - name: Provision the zero-cost review gateway for Strix
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          bash trusted-gate/scripts/ci/contextual_orchestrator_review_sidecar.sh

      # Scope boundary, recorded rather than left implicit. The steps below install
      # the *gate's own* toolchain — this repository's hash-pinned
      # requirements-strix-ci-hashes.txt, materialized from github.workflow_sha, and
      # the orchestrator sidecar's own pinned lock. They are a different trust domain
      # from the caller's release closure: they are pinned and reviewed in this
      # repository, and the licence stage that judges the closure cannot judge the
      # scanner it has to run first without a cycle. They are therefore NOT covered by
      # the prescreen above, and that is a stated limit, not an exemption: bringing
      # the gate's own dependencies under a licence verdict is an owner decision,
      # tracked separately, and nothing here may be read as evidence that it happened.
      - name: Install the pinned Strix toolchain
        working-directory: trusted-gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # Mirrors .github/workflows/strix.yml's install invariants: a private
          # umask so the credential-bearing console script is not group-writable,
          # --no-deps because strix-agent declares cryptography<49 against this
          # repository's cryptography==50.0.0 security pin (see
          # requirements-strix-ci-overrides.txt, #952), and an absolute,
          # non-symlinked executable inside the interpreter's own scripts root.
          umask 022
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes --no-deps -r requirements-strix-ci-hashes.txt
          strix_executable=""
          if command -v strix >/dev/null 2>&1; then
            strix_executable="$(command -v strix)"
          fi
          if [ -z "$strix_executable" ] || [[ "$strix_executable" != /* ]] \
            || [ ! -f "$strix_executable" ] || [ -L "$strix_executable" ] \
            || [ ! -x "$strix_executable" ]; then
            echo "::error::Pinned Strix installation did not produce a trusted absolute executable path."
            exit 1
          fi
          case "$strix_executable" in
            "$GITHUB_WORKSPACE"/*|"$RUNNER_TEMP"/*)
              echo "::error::Refusing a Strix executable from a workspace or runner-temp path."
              exit 1
              ;;
          esac
          strix_scripts_root="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))')"
          if [ -z "$strix_scripts_root" ] || [[ "$strix_scripts_root" != /* ]] \
            || [ ! -d "$strix_scripts_root" ] || [ -L "$strix_scripts_root" ]; then
            echo "::error::Pinned Strix installation did not produce a trusted absolute scripts root."
            exit 1
          fi
          case "$strix_executable" in
            "$strix_scripts_root"/*) ;;
            *)
              echo "::error::Pinned Strix executable is outside the trusted scripts root."
              exit 1
              ;;
          esac
          chmod go-w -- "$strix_scripts_root" "$strix_executable"
          {
            printf 'STRIX_EXECUTABLE_PATH=%s\n' "$strix_executable"
            printf 'STRIX_EXECUTABLE_ROOT=%s\n' "$strix_scripts_root"
            printf 'STRIX_EXECUTABLE_SHA256=%s\n' \
              "$(sha256sum "$strix_executable" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Bind the zero-cost model, key, and API base for Strix
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          source trusted-gate/scripts/ci/load_contextual_orchestrator_token.sh
          sanitized="$(printf '%s' "${CONTEXTUAL_ORCHESTRATOR_TOKEN:-}" | tr -d '\r\n')"
          trimmed="$(printf '%s' "$sanitized" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$trimmed" ]; then
            echo '::error::CONTEXTUAL_ORCHESTRATOR_TOKEN is required for Strix scans.'
            exit 1
          fi
          echo "::add-mask::${trimmed}"
          sidecar_base="${CONTEXTUAL_ORCHESTRATOR_BASE_URL:-}"
          if [ "$sidecar_base" != "http://127.0.0.1:18080" ]; then
            echo '::error::Strix sidecar base URL is not the pinned local gateway origin.'
            exit 1
          fi
          umask 077
          printf '%s' "$trimmed" > "${RUNNER_TEMP}/llm_api_key.txt"
          printf '%s/v1' "${sidecar_base%/}" > "${RUNNER_TEMP}/llm_api_base.txt"
          printf '%s' 'orchestrator/free' > "${RUNNER_TEMP}/strix_llm.txt"
          {
            printf 'LLM_API_KEY_FILE=%s\n' "${RUNNER_TEMP}/llm_api_key.txt"
            printf 'LLM_API_BASE_FILE=%s\n' "${RUNNER_TEMP}/llm_api_base.txt"
            printf 'STRIX_LLM_FILE=%s\n' "${RUNNER_TEMP}/strix_llm.txt"
          } >> "$GITHUB_ENV"

      - name: Run Strix against one isolated synthetic fixture per dependency
        env:
          STRIX_LLM_DEFAULT_PROVIDER: contextual_orchestrator
          STRIX_REASONING_EFFORT: none
          STRIX_FALLBACK_MODELS: ""
          STRIX_FAIL_ON_PROVIDER_SIGNAL: "1"
          STRIX_FAIL_ON_MIN_SEVERITY: MEDIUM
          STRIX_DISABLE_PR_SCOPING: "1"
          # Narrow the scan to the fixture subdirectory. The trusted gate
          # requires its evidence binder at $STRIX_REPO_ROOT/scripts/ci on
          # current main, so the workspace root necessarily holds that module;
          # scanning "./" would pentest the trusted binder itself and fail every
          # dependency on a finding against code this PR did not ship.
          STRIX_TARGET_PATH: fixture
          STRIX_SOURCE_DIRS: "."
          # strix_quick_gate.sh treats PR_NUMBER/PR_BASE_SHA/PR_HEAD_SHA as
          # optional and defaults IS_PR_EVIDENCE_RUN to false; this is a release
          # scan, not PR evidence, so the value is stated rather than implied.
          IS_PR_EVIDENCE_RUN: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          PNPM_CONFIG_IGNORE_SCRIPTS: "true"
          YARN_ENABLE_SCRIPTS: "false"
          BUN_CONFIG_IGNORE_SCRIPTS: "true"
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          # docs/product-goal-directive.md section 8: elapsed inference time is
          # never converted into a model-failure verdict.
          export LLM_TIMEOUT=0
          export STRIX_MEMORY_COMPRESSOR_TIMEOUT=0
          export STRIX_PROCESS_TIMEOUT_SECONDS=0
          export STRIX_TOTAL_TIMEOUT_SECONDS=0
          trusted_gate_root="${PWD}/trusted-gate"
          mkdir -p "${RUNNER_TEMP}/capture/strix/bindings"
          for fixture in "${RUNNER_TEMP}"/capture/strix/fixtures/*.json; do
            slug="$(basename "$fixture" .json)"
            workspace="${RUNNER_TEMP}/strix-workspace/${slug}"
            mkdir -p "$workspace/scripts/ci" "$workspace/fixture"
            cp "$fixture" "$workspace/fixture/fixture.json"
            # sanitize_remediation_evidence_claims returns 2 when
            # $REPO_ROOT/scripts/ci/strix_evidence_binding.py is absent, and
            # REPO_ROOT is STRIX_REPO_ROOT on current main (its own script
            # directory once #2291 lands). The trusted binder is therefore copied
            # into each isolated workspace so both resolutions hold without
            # editing strix_quick_gate.sh, which #2291 owns. It sits beside the
            # scan target, never inside it.
            cp "$trusted_gate_root/scripts/ci/strix_evidence_binding.py" \
              "$workspace/scripts/ci/strix_evidence_binding.py"
            (
              cd "$workspace" &&
                STRIX_REPO_ROOT="$workspace" \
                  bash "$trusted_gate_root/scripts/ci/strix_quick_gate.sh"
            )
            vulnerabilities=""
            if [ -d "$workspace/strix_runs" ]; then
              vulnerabilities="$(find "$workspace/strix_runs" -type f \
                -name 'vulnerabilities.json' -print -quit)"
            fi
            if [ -z "$vulnerabilities" ]; then
              echo "::warning::Strix produced no machine-readable findings file for ${slug};" \
                "the gate will refuse the release with STRIX_BINDING_MISSING."
              continue
            fi
            # Normalize Strix's findings document to an array without inventing
            # a result: an array is used as-is, an object carrying a
            # `vulnerabilities` array contributes that array, and any other
            # shape yields null so no binding is written at all and the gate
            # refuses with STRIX_BINDING_MISSING. A textual summary can never
            # become a pass here.
            findings_json="$(jq -c '
              if type == "array" then .
              elif type == "object" and (.vulnerabilities? | type) == "array" then .vulnerabilities
              else null end' "$vulnerabilities")"
            if [ "$findings_json" = "null" ]; then
              echo "::warning::Strix findings for ${slug} are not a structured array;" \
                "the gate will refuse the release with STRIX_BINDING_MISSING."
              continue
            fi
            jq -n \
              --argjson fixture "$(cat "$fixture")" \
              --argjson findings "$findings_json" \
              --arg sha "$SOURCE_SHA" \
              --arg digest "$(cat "${fixture%.json}.sha256")" \
              '{
                schema: "cwl.release-dependency-strix-binding/1",
                dependency: $fixture.dependency,
                fixture: {
                  id: ($fixture.dependency.ecosystem + "/" + $fixture.dependency.name
                       + "@" + $fixture.dependency.version),
                  sha256: $digest,
                  scenarios: ($fixture.scenarios | keys)
                },
                source_sha: $sha,
                findings: $findings,
                verdict: (if ($findings | length) == 0
                          then "no_exploitable_findings" else "findings_present" end)
              }' > "${RUNNER_TEMP}/capture/strix/bindings/${slug}.json"
          done

      - name: Refuse the release unless every dependency passes
        id: full-stage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I trusted-gate/scripts/ci/release_dependency_gate.py gate \
            --capture "${RUNNER_TEMP}/capture" \
            --report "${RUNNER_TEMP}/gate-report.json"

      - name: Seal exactly the gated bytes for attestation
        id: seal
        env:
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          WHEEL_FILENAME: ${{ inputs.wheel_filename }}
          SDIST_FILENAME: ${{ inputs.sdist_filename }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I trusted-gate/scripts/ci/release_dependency_gate.py seal \
            --report "${RUNNER_TEMP}/gate-report.json" \
            --wheel "release-distributions/${WHEEL_FILENAME}" \
            --sdist "release-distributions/${SDIST_FILENAME}" \
            --evidence-root "${RUNNER_TEMP}/sealed-evidence" \
            --evidence-artifact-name "$EVIDENCE_ARTIFACT_NAME"

      - name: Export the sealed evidence as one immutable same-run artifact
        id: sealed-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: ${{ runner.temp }}/sealed-evidence
          if-no-files-found: error

      # Failure evidence has to survive the failure that produced it. A default
      # (success-conditional) upload is skipped exactly when the gate refuses the
      # release, which is when the report matters most. Each upload is therefore
      # bound to the step that writes its report: it runs whether that step passed
      # or failed, but not when that step never ran, and not on cancellation. This
      # is narrower than a blanket `always()` on purpose — with
      # `if-no-files-found: error`, a report that its own producing step should
      # have written but did not stays a failure instead of being masked. Neither
      # upload can rescue the run: a refusing stage has already failed the job, and
      # a later successful step does not undo that.
      - name: Export the pre-credential licence report
        if: ${{ !cancelled() && steps.license-stage.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ inputs.evidence_artifact_name == 'release-dependency-sealed-evidence' && 'release-dependency-license-report' || format('release-dependency-license-report--{0}', inputs.evidence_artifact_name) }}
          path: ${{ runner.temp }}/license-report.json
          if-no-files-found: error

      - name: Export the per-dependency gate report
        if: ${{ !cancelled() && steps.full-stage.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ inputs.evidence_artifact_name == 'release-dependency-sealed-evidence' && 'release-dependency-gate-report' || format('release-dependency-gate-report--{0}', inputs.evidence_artifact_name) }}
          path: ${{ runner.temp }}/gate-report.json
          if-no-files-found: error
