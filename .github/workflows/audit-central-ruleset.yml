name: Central Required Workflow Ruleset Audit

on:
  schedule:
    - cron: "11 2 * * *"
  repository_dispatch:
    types: [audit-central-ruleset]
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-central-ruleset.yml"
      - "scripts/ci/audit_central_required_workflows.py"
      - "scripts/ci/audit_org_codeql_coverage.py"
      - "docs/org-required-workflow-rollout.md"

concurrency:
  group: central-required-workflow-ruleset-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit organization ruleset 18156473
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout trusted audit source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read live inherited organization ruleset and repository scope
        env:
          ORG_LOGIN: ContextualWisdomLab
          RULESET_ID: "18156473"
          STACKED_RULESET_ID: "21732164"
          RULESET_SENTINEL_REPOSITORY: naruon
        run: |
          set -euo pipefail
          ruleset_json="$RUNNER_TEMP/central-required-workflow-ruleset.json"
          ruleset_with_scope_json="$RUNNER_TEMP/central-required-workflow-ruleset-with-scope.json"
          ruleset_error="$RUNNER_TEMP/central-required-workflow-ruleset.error"
          repositories_json="$RUNNER_TEMP/central-required-workflow-organization-repositories.json"
          scope_json="$RUNNER_TEMP/central-required-workflow-scope.json"
          ruleset_endpoint="repos/${ORG_LOGIN}/${RULESET_SENTINEL_REPOSITORY}/rulesets/${RULESET_ID}?includes_parents=true"

          if ! gh api "$ruleset_endpoint" >"$ruleset_json" 2>"$ruleset_error"; then
            echo "::error::Ruleset audit could not read inherited organization ruleset ${RULESET_ID} through ${ORG_LOGIN}/${RULESET_SENTINEL_REPOSITORY}."
            sed 's/^/    /' "$ruleset_error"
            exit 1
          fi
          if ! gh api --paginate "orgs/${ORG_LOGIN}/repos?type=all&per_page=100" \
            | jq -s 'add | map(.name) | unique | sort' >"$repositories_json"; then
            echo "::error::Ruleset audit could not enumerate organization repositories for ${ORG_LOGIN}."
            exit 1
          fi

          printf '{}\n' >"$scope_json"
          while IFS= read -r repository; do
            probe_json="$RUNNER_TEMP/ruleset-probe-${repository//[^A-Za-z0-9_.-]/_}.json"
            probe_error="$RUNNER_TEMP/ruleset-probe-${repository//[^A-Za-z0-9_.-]/_}.error"
            probe_endpoint="repos/${ORG_LOGIN}/${repository}/rulesets/${RULESET_ID}?includes_parents=true"
            inherited=false
            if gh api "$probe_endpoint" >"$probe_json" 2>"$probe_error"; then
              if ! jq -e --argjson ruleset_id "$RULESET_ID" '.id == $ruleset_id' "$probe_json" >/dev/null; then
                echo "::error::Ruleset scope probe for ${ORG_LOGIN}/${repository} returned the wrong ruleset object."
                jq '{id,name,source_type,source,enforcement,target}' "$probe_json"
                exit 1
              fi
              inherited=true
            elif ! grep -q 'HTTP 404' "$probe_error"; then
              echo "::error::Ruleset scope probe for ${ORG_LOGIN}/${repository} failed for a reason other than non-inheritance."
              sed 's/^/    /' "$probe_error"
              exit 1
            fi
            echo "RULESET_SCOPE repository=${repository} inherited=${inherited}"
            jq --arg repository "$repository" --argjson inherited "$inherited" \
              '. + {($repository): $inherited}' "$scope_json" >"${scope_json}.next"
            mv "${scope_json}.next" "$scope_json"
          done < <(jq -r '.[]' "$repositories_json")

          jq --slurpfile scope "$scope_json" \
            '. + {"_audit_repository_scope": $scope[0]}' \
            "$ruleset_json" >"$ruleset_with_scope_json"
          python3 scripts/ci/audit_central_required_workflows.py "$ruleset_with_scope_json"

          stacked_ruleset_json="$RUNNER_TEMP/stacked-opencode-ruleset.json"
          stacked_ruleset_error="$RUNNER_TEMP/stacked-opencode-ruleset.error"
          stacked_endpoint="repos/${ORG_LOGIN}/${RULESET_SENTINEL_REPOSITORY}/rulesets/${STACKED_RULESET_ID}?includes_parents=true"
          if ! gh api "$stacked_endpoint" >"$stacked_ruleset_json" 2>"$stacked_ruleset_error"; then
            echo "::error::Ruleset audit could not read inherited stacked OpenCode ruleset ${STACKED_RULESET_ID}."
            sed 's/^/    /' "$stacked_ruleset_error"
            exit 1
          fi
          python3 scripts/ci/audit_central_required_workflows.py --stacked "$stacked_ruleset_json"

      - name: Audit organization CodeQL coverage
        env:
          ORG_LOGIN: ContextualWisdomLab
          ORG_WIDE_CREDENTIAL_AVAILABLE: ${{ secrets.PR_REVIEW_MERGE_TOKEN != '' || secrets.OPENCODE_APPROVE_TOKEN != '' }}
        run: |
          set -euo pipefail

          if [ "$ORG_WIDE_CREDENTIAL_AVAILABLE" = "false" ]; then
            echo "::error::CodeQL coverage audit requires an org-scoped credential (PR_REVIEW_MERGE_TOKEN or OPENCODE_APPROVE_TOKEN) to reliably enumerate private organization repositories; the repository-scoped github.token fallback cannot see them, which would silently narrow this audit to a subset of the organization."
            exit 1
          fi

          repositories_json="$RUNNER_TEMP/codeql-coverage-organization-repositories.json"
          coverage_json="$RUNNER_TEMP/codeql-coverage-repositories.json"

          if ! gh api --paginate "orgs/${ORG_LOGIN}/repos?type=all&per_page=100" \
            | jq -s 'add | map({name, archived}) | unique_by(.name) | sort_by(.name)' >"$repositories_json"; then
            echo "::error::CodeQL coverage audit could not enumerate organization repositories for ${ORG_LOGIN}."
            exit 1
          fi

          printf '[]\n' >"$coverage_json"
          while IFS=$'\t' read -r repository archived; do
            default_setup_state=null
            if [ "$archived" != "true" ]; then
              default_setup_state_json="$RUNNER_TEMP/codeql-default-setup-${repository//[^A-Za-z0-9_.-]/_}.json"
              if gh api "repos/${ORG_LOGIN}/${repository}/code-scanning/default-setup" --jq .state \
                >"$default_setup_state_json" 2>/dev/null; then
                default_setup_state=$(jq -R '.' "$default_setup_state_json")
              else
                default_setup_state=null
              fi
            fi

            latest_codeql_analysis=null
            if [ "$archived" != "true" ]; then
              analysis_json="$RUNNER_TEMP/codeql-analysis-${repository//[^A-Za-z0-9_.-]/_}.json"
              if gh api "repos/${ORG_LOGIN}/${repository}/code-scanning/analyses?tool_name=CodeQL&per_page=1" \
                --jq '.[0] | if . then {created_at, error} else null end' \
                >"$analysis_json" 2>/dev/null; then
                latest_codeql_analysis=$(cat "$analysis_json")
              else
                latest_codeql_analysis=null
              fi
            fi

            echo "CODEQL_COVERAGE repository=${repository} archived=${archived} default_setup_state=${default_setup_state} latest_codeql_analysis=${latest_codeql_analysis}"
            jq --arg name "$repository" \
              --argjson archived "$archived" \
              --argjson default_setup_state "$default_setup_state" \
              --argjson latest_codeql_analysis "$latest_codeql_analysis" \
              '. + [{name: $name, archived: $archived, default_setup_state: $default_setup_state, latest_codeql_analysis: $latest_codeql_analysis}]' \
              "$coverage_json" >"${coverage_json}.next"
            mv "${coverage_json}.next" "$coverage_json"
          done < <(jq -r '.[] | [.name, (.archived | tostring)] | @tsv' "$repositories_json")

          python3 scripts/ci/audit_org_codeql_coverage.py "$coverage_json"
