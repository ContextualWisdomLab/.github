name: One-shot PR759 libclang finalization

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/one-shot-pr759-libclang-final.yml

permissions:
  contents: read

concurrency:
  group: one-shot-pr759-libclang-finalization
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.actor == 'seonghobae'
      && github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate exact setup delta and prove RED contract
        env:
          EXPECTED_PARENT_SHA: 5a979466a7927c830102c153e449208ea8606f34
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-shot-pr759-libclang-final.yml"
          set +e
          python3 -I - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/opencode-review-dispatch.yml').read_text(encoding='utf-8')
          assert '              libclang-19-dev ' + chr(92) in workflow
          assert 'ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib' in workflow
          assert 'find "$LIBCLANG_PATH" -maxdepth 1' in workflow
          assert "-name 'libclang.so*'" in workflow
          PY
          red_status=$?
          set -e
          test "$red_status" -ne 0

      - name: Implement version-aligned libclang prerequisite
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          dispatch_path = Path('.github/workflows/opencode-review-dispatch.yml')
          dispatch = dispatch_path.read_text(encoding='utf-8')
          package_old = '              llvm-19 ' + chr(92) + '\n'
          package_new = '              libclang-19-dev ' + chr(92) + '\n' + package_old
          if dispatch.count(package_old) != 1:
              raise SystemExit('expected one llvm-19 package declaration')
          dispatch = dispatch.replace(package_old, package_new, 1)
          env_old = '          ENV LLVM_COV=/usr/bin/llvm-cov-19\n'
          env_new = '          ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib\n' + env_old
          if dispatch.count(env_old) != 1:
              raise SystemExit('expected one LLVM_COV declaration')
          dispatch = dispatch.replace(env_old, env_new, 1)
          probe_old = '          RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"\n'
          probe_new = (
              '          RUN test -d "$LIBCLANG_PATH" \\\n'
              '            && find "$LIBCLANG_PATH" -maxdepth 1 '
              "\\( -type f -o -type l \\) -name 'libclang.so*' "
              '-print -quit | grep -q . \\\n'
              '            && test -x "$LLVM_COV" \\\n'
              '            && test -x "$LLVM_PROFDATA"\n'
          )
          if dispatch.count(probe_old) != 1:
              raise SystemExit('expected one LLVM executable probe')
          dispatch_path.write_text(
              dispatch.replace(probe_old, probe_new, 1),
              encoding='utf-8',
          )

          Path('tests/test_opencode_libclang_toolchain_contract.py').write_text(
              '''"""Regression contract for the central Rust bindgen toolchain."""

from pathlib import Path


def test_opencode_coverage_image_provisions_bindgen_libclang() -> None:
    """Keep bindgen-backed Rust packages executable in central coverage."""
    workflow = Path(
        ".github/workflows/opencode-review-dispatch.yml"
    ).read_text(encoding="utf-8")
    assert "              libclang-19-dev " + chr(92) in workflow
    assert "ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib" in workflow
    assert 'find "$LIBCLANG_PATH" -maxdepth 1' in workflow
    assert "-name 'libclang.so*'" in workflow
''',
              encoding='utf-8',
          )

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          anchor = '### Fixed\n\n'
          bullet = '- Install version-aligned `libclang-19-dev` and export `LIBCLANG_PATH` so bindgen-backed Rust crates execute in the central coverage image.\n'
          if changelog.count(anchor) != 1:
              raise SystemExit('changelog Fixed heading drifted')
          changelog_path.write_text(
              changelog.replace(anchor, anchor + bullet, 1),
              encoding='utf-8',
          )

          doctoring_path = Path('docs/doctoring/opencode-llvm-coverage-toolchain.md')
          doctoring = doctoring_path.read_text(encoding='utf-8')
          section = '''

## Bindgen and libclang compatibility boundary

`llvm-19` supplies the versioned coverage executables, while Rust crates using
`bindgen` also require the Clang C interface at build time. The central image
therefore installs matching `libclang-19-dev`, exports
`LIBCLANG_PATH=/usr/lib/llvm-19/lib`, and fails image construction unless a
regular file or symbolic link matching `libclang.so*` exists. Repository fuzz
and package-specific native validation remain independent required gates.

Debian Project. (2026). *libclang-19-dev: Clang library—Development package*.
Debian Packages. Retrieved August 5, 2026, from
https://packages.debian.org/trixie/libclang-19-dev

Ubuntu. (2026). *libclang-19-dev in noble-updates*. Ubuntu Packages. Retrieved
August 5, 2026, from https://packages.ubuntu.com/noble-updates/libclang-19-dev
'''
          doctoring_path.write_text(
              doctoring.rstrip() + section + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Verify GREEN contract and real package availability
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_opencode_libclang_toolchain_contract.py')
          namespace['test_opencode_coverage_image_provisions_bindgen_libclang']()
          PY
          python3 -m py_compile tests/test_opencode_libclang_toolchain_contract.py
          probe_dir="$(mktemp -d)"
          cat >"$probe_dir/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/library/python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update \
            && apt-get install --no-install-recommends -y libclang-19-dev llvm-19 \
            && rm -rf /var/lib/apt/lists/*
          ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib
          ENV LLVM_COV=/usr/bin/llvm-cov-19
          ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19
          RUN test -d "$LIBCLANG_PATH" \
            && find "$LIBCLANG_PATH" -maxdepth 1 \( -type f -o -type l \) -name 'libclang.so*' -print -quit | grep -q . \
            && test -x "$LLVM_COV" \
            && test -x "$LLVM_PROFDATA"
          DOCKERFILE
          docker build --pull --no-cache --tag pr759-libclang-probe "$probe_dir"
          rm -rf "$probe_dir"
          git diff --check

      - name: Remove one-shot automation and publish verified source
        env:
          HEAD_BRANCH: fix/opencode-coverage-failure-diagnostics
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/one-shot-pr759-libclang-final.yml
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(coverage): provision libclang for Rust bindgen'
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:${HEAD_BRANCH}"
