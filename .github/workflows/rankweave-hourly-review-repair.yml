name: RankWeave Hourly Review Repair

on:
  schedule:
    # Minute 33 avoids minute-zero pressure and every existing per-repo caller.
    - cron: "33 * * * *"

concurrency:
  group: rankweave-hourly-review-repair
  # Preserve bounded RCA when a later hourly heartbeat arrives.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-review-repair:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-review-fix-scheduler.yml
    with:
      target_repository: ContextualWisdomLab/RankWeave
      base_branch: main
      max_prs: "50"
      max_dispatches: "1"
      # Central OpenCode/Strix/NVIDIA NIM review can approach two hours.
      retry_hours: "2"
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
