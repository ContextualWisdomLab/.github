name: Finalize PR 759 diagnostics

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/repair-pr759-finalize.yml

permissions:
  contents: write

concurrency:
  group: repair-pr759-finalize
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Verify immutable repair parent
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "2315fc014338eb9a738b5e2bf1c4b7f57e39fcfa"
          test "$(git rev-parse --abbrev-ref HEAD)" = "HEAD"

      - name: Apply deterministic production repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one repair anchor in {path}, found {count}"
                  )
              file_path.write_text(content.replace(old, new, 1), encoding="utf-8")

          function_pattern = re.compile(
              r"\ndef _publish_coverage_failure_summary\(\n"
              r"    stage: str, error: BaseException, remediation: str\n"
              r"\) -> None:\n.*?"
              r"(?=\n\ndef main\()",
              re.DOTALL,
          )
          wrapper = '''

def _publish_coverage_failure_summary(
    stage: str, error: BaseException, remediation: str
) -> None:
    """Publish bounded redacted setup evidence through the trusted helper."""

    _PUBLISH_COVERAGE_FAILURE_SUMMARY(stage, error, remediation)
'''

          javascript_path = Path("scripts/ci/materialize_base_javascript_packages.py")
          javascript = javascript_path.read_text(encoding="utf-8")
          javascript_imports = '''import argparse
          import html
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import urllib.parse
          from typing import Any
          '''
          javascript_replacement = '''import argparse
          import json
          import pathlib
          import re
          import runpy
          import subprocess
          import sys
          import urllib.parse
          from collections.abc import Callable
          from typing import Any, cast
          '''
          if javascript.count(javascript_imports) != 1:
              raise SystemExit("JavaScript materializer import anchor mismatch")
          javascript = javascript.replace(
              javascript_imports,
              javascript_replacement,
              1,
          )
          javascript_marker = 'SHA512_SRI_RE = re.compile(r"^sha512-[A-Za-z0-9+/]{86}==$")\n'
          javascript_binding = javascript_marker + '''_PUBLISH_COVERAGE_FAILURE_SUMMARY = cast(
              Callable[[str, BaseException, str], None],
              runpy.run_path(
                  str(pathlib.Path(__file__).with_name("coverage_failure_summary.py")),
                  run_name="cwl_coverage_failure_summary",
              )["publish_coverage_failure_summary"],
          )
          '''
          if javascript.count(javascript_marker) != 1:
              raise SystemExit("JavaScript materializer binding anchor mismatch")
          javascript = javascript.replace(
              javascript_marker,
              javascript_binding,
              1,
          )
          javascript, substitutions = function_pattern.subn(
              wrapper,
              javascript,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit("JavaScript materializer publisher mismatch")
          javascript_path.write_text(javascript, encoding="utf-8")

          python_path = Path("scripts/ci/materialize_base_python_requirements.py")
          python_source = python_path.read_text(encoding="utf-8")
          python_imports = '''import argparse
          import fnmatch
          import html
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          '''
          python_replacement = '''import argparse
          import fnmatch
          import json
          import pathlib
          import re
          import runpy
          import shutil
          import subprocess
          import sys
          import tempfile
          from collections.abc import Callable
          from typing import cast
          '''
          if python_source.count(python_imports) != 1:
              raise SystemExit("Python materializer import anchor mismatch")
          python_source = python_source.replace(
              python_imports,
              python_replacement,
              1,
          )
          python_marker = "UV_EXPORT_TIMEOUT_SECONDS = 120\n"
          python_binding = python_marker + '''_PUBLISH_COVERAGE_FAILURE_SUMMARY = cast(
              Callable[[str, BaseException, str], None],
              runpy.run_path(
                  str(pathlib.Path(__file__).with_name("coverage_failure_summary.py")),
                  run_name="cwl_coverage_failure_summary",
              )["publish_coverage_failure_summary"],
          )
          '''
          if python_source.count(python_marker) != 1:
              raise SystemExit("Python materializer binding anchor mismatch")
          python_source = python_source.replace(
              python_marker,
              python_binding,
              1,
          )
          python_source, substitutions = function_pattern.subn(
              wrapper,
              python_source,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit("Python materializer publisher mismatch")
          python_path.write_text(python_source, encoding="utf-8")

          coverage_test = Path("tests/test_coverage_failure_summary.py")
          coverage_test.write_text(
              '''"""Contracts for bounded coverage setup failure publication."""

          from __future__ import annotations

          from scripts.ci import coverage_failure_summary


          def test_publisher_is_optional_outside_github_actions(monkeypatch) -> None:
              """Local materializer failures do not require an Actions output file."""

              monkeypatch.delenv("GITHUB_OUTPUT", raising=False)
              coverage_failure_summary.publish_coverage_failure_summary(
                  "Local stage",
                  RuntimeError("local failure"),
                  "Repair locally.",
              )


          def test_publisher_redacts_bounds_and_delimiter_proofs_fields(
              tmp_path,
              monkeypatch,
          ) -> None:
              """Mixed credentials cannot escape the bounded GitHub output envelope."""

              output_file = tmp_path / "github-output"
              monkeypatch.setenv("GITHUB_OUTPUT", str(output_file))
              delimiter = "CWL_COVERAGE_SUMMARY_EOF"
              coverage_failure_summary.publish_coverage_failure_summary(
                  f"<stage> {delimiter}",
                  RuntimeError(
                      "failure https://alice:url-secret@example.invalid/a.tgz "
                      "Authorization: Bearer bearer-secret TOKEN=token-secret "
                      f"{delimiter}"
                  ),
                  "<repair> " + ("x" * 2000),
              )

              published = output_file.read_text(encoding="utf-8")
              assert "&lt;stage&gt; CWL_COVERAGE_SUMMARY_END" in published
              assert "https://&lt;redacted&gt;@example.invalid/a.tgz" in published
              assert "Authorization: Bearer &lt;redacted&gt;" in published
              assert "TOKEN=&lt;redacted&gt;" in published
              assert "url-secret" not in published
              assert "bearer-secret" not in published
              assert "token-secret" not in published
              assert "&lt;repair&gt;" in published
              assert published.count(f"{delimiter}\\n") == 2
              assert len(published) < 6000


          def test_safe_field_applies_the_requested_length_bound() -> None:
              """Field normalization truncates before HTML publication."""

              assert coverage_failure_summary._safe_field("x" * 100, 16) == "x" * 16
          ''',
              encoding="utf-8",
          )

          sanitizer_test = Path("tests/test_sanitize_github_output_summary.py")
          sanitizer = sanitizer_test.read_text(encoding="utf-8")
          sanitizer = sanitizer.replace(
              "import sys\n",
              "import sys\nfrom pathlib import Path\n",
              1,
          )
          sanitizer = sanitizer.replace(
              "from scripts.ci.sanitize_github_output_summary import sanitize_text\n",
              "from scripts.ci import sanitize_github_output_summary as sanitizer\n\n"
              "sanitize_text = sanitizer.sanitize_text\n",
              1,
          )
          sanitizer = sanitizer.replace(
              'runpy.run_path("scripts/ci/sanitize_github_output_summary.py", run_name="__main__")',
              'runpy.run_path(str(Path(sanitizer.__file__).resolve()), run_name="__main__")',
              1,
          )
          sanitizer = sanitizer.replace(
              "    with pytest.raises(SystemExit) as excinfo:\n"
              "        runpy.run_path(str(Path(sanitizer.__file__).resolve()), run_name=\"__main__\")\n\n"
              "    assert excinfo.value.code == 0\n",
              "    assert sanitizer.main() == 0\n"
              "    with pytest.raises(SystemExit) as excinfo:\n"
              "        runpy.run_path(str(Path(sanitizer.__file__).resolve()), run_name=\"__main__\")\n\n"
              "    assert excinfo.value.code == 0\n",
              1,
          )
          sanitizer_test.write_text(sanitizer, encoding="utf-8")

          diagnostics_workflow = Path(
              ".github/workflows/opencode-coverage-diagnostics-ci.yml"
          )
          diagnostics = diagnostics_workflow.read_text(encoding="utf-8")
          diagnostics = diagnostics.replace(
              '      - "tests/test_coverage_materializer_failure_diagnostics.py"\n',
              '      - "tests/test_coverage_failure_summary.py"\n'
              '      - "tests/test_coverage_materializer_failure_diagnostics.py"\n',
          )
          diagnostics = diagnostics.replace(
              "            tests/test_coverage_materializer_failure_diagnostics.py " + chr(92) + "\n",
              "            tests/test_coverage_failure_summary.py " + chr(92) + "\n"
              "            tests/test_coverage_materializer_failure_diagnostics.py " + chr(92) + "\n",
              1,
          )
          diagnostics = diagnostics.replace(
              "            tests/test_coverage_materializer_failure_diagnostics.py " + chr(92) + "\n"
              "            tests/test_sanitize_github_output_summary.py " + chr(92) + "\n",
              "            tests/test_coverage_materializer_failure_diagnostics.py " + chr(92) + "\n"
              "            tests/test_coverage_failure_summary.py " + chr(92) + "\n"
              "            tests/test_sanitize_github_output_summary.py " + chr(92) + "\n",
              1,
          )
          diagnostics_workflow.write_text(diagnostics, encoding="utf-8")

          strix_path = "scripts/ci/strix_quick_gate.sh"
          replace_once(
              strix_path,
              "uv.lock | */uv.lock)",
              "uv.lock | */uv.lock | Cargo.toml | */Cargo.toml | Cargo.lock | */Cargo.lock)",
          )
          replace_once(
              strix_path,
              "backend/scripts/* | backend/tests/*)\n\t\t\t;;",
              "backend/scripts/* | backend/tests/*)\n\t\t\t:\n\t\t\t;;",
          )

          strix_test_path = "scripts/ci/test_strix_quick_gate.sh"
          replace_once(
              strix_test_path,
              '\tassert_file_contains "$GATE_SCRIPT" "Dockerfile | */Dockerfile | Dockerfile.* | */Dockerfile.* | Containerfile | */Containerfile | Makefile | */Makefile" "strix gate treats deployment files as source files"\n',
              '\tassert_file_contains "$GATE_SCRIPT" "Dockerfile | */Dockerfile | Dockerfile.* | */Dockerfile.* | Containerfile | */Containerfile | Makefile | */Makefile" "strix gate treats deployment files as source files"\n'
              '\tassert_file_contains "$GATE_SCRIPT" "Cargo.toml | */Cargo.toml | Cargo.lock | */Cargo.lock" "strix gate includes Rust crate dependency and feature context"\n'
              '\tassert_file_contains "$GATE_SCRIPT" "backend/scripts/* | backend/tests/*)" "strix gate retains the standalone support-tool exclusion branch"\n',
          )

          agent_test_path = "tests/test_opencode_agent_contract.py"
          replace_once(
              agent_test_path,
              '    assert \'RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"\' in workflow\n',
              '    assert \'RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"\' in workflow\n'
              '    llvm_install = workflow.index("              llvm-19 " + chr(92))\n'
              '    llvm_check = workflow.index(\n'
              '        \'RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"\'\n'
              '    )\n'
              '    cargo_llvm_cov_install = workflow.index(\n'
              '        "https://github.com/taiki-e/cargo-llvm-cov/releases/download/"\n'
              '    )\n'
              '    assert llvm_install < llvm_check < cargo_llvm_cov_install\n',
          )

          codeql_sha = "d1ba80a13dd99fba24a470575428917156a28b43"
          for workflow_path in (
              ".github/workflows/codeql-pr.yml",
              ".github/workflows/scheduled-security-scan.yml",
          ):
              workflow = Path(workflow_path)
              content = workflow.read_text(encoding="utf-8")
              content = content.replace(
                  "99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0",
                  f"{codeql_sha} # v4.37.5",
              ).replace(
                  "f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4",
                  f"{codeql_sha} # v4.37.5",
              )
              workflow.write_text(content, encoding="utf-8")

          Path(".github/workflows/repair-pr759-finalize.yml").unlink()
          PY

      - name: Validate static repair surfaces
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -m py_compile \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py \
            tests/test_coverage_failure_summary.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_opencode_agent_contract.py
          bash -n scripts/ci/strix_quick_gate.sh
          bash -n scripts/ci/test_strix_quick_gate.sh
          git diff --check
          test ! -e .github/workflows/repair-pr759-finalize.yml

      - name: Publish production repair commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(opencode-review): finalize bounded diagnostics"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/opencode-coverage-failure-diagnostics
