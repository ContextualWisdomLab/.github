name: One-shot Noema observed-probe taxonomy GREEN

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-noema-observed-probe-taxonomy.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Apply causal repair, verify, and retire workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          # Retry after fixing the fixture migrator to advance by probe occurrence.
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=. python3 scripts/ci/source_fix_noema_observed_probe_taxonomy.py
          PYTHONPATH=. python3 scripts/ci/source_fix_noema_probe_test_fixtures.py
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt >/dev/null
          PYTHONPATH=. python3 -m pytest -q tests/test_noema_observed_defect_probe_taxonomy.py tests/test_noema_review_gate.py
          PYTHONPATH=. python3 -m pytest -q tests
          interrogate --fail-under=100 scripts/ci/noema_review_gate.py
          python3 -m compileall -q scripts/ci tests
          git diff --check
          git rm .github/workflows/source-fix-noema-observed-probe-taxonomy.yml
          git rm scripts/ci/source_fix_noema_observed_probe_taxonomy.py
          git rm scripts/ci/source_fix_noema_probe_test_fixtures.py
          git add scripts/ci/noema_review_gate.py tests/test_noema_observed_defect_probe_taxonomy.py tests/test_noema_review_gate.py CHANGELOG.md docs/product-technical-gap-baseline.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(noema): require observed defect-class probes"
          git push origin "HEAD:${TARGET_BRANCH}"
