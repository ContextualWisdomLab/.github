name: One-shot Noema observed-probe taxonomy GREEN

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-noema-observed-probe-taxonomy.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Apply causal repair, verify, and retire workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/noema_review_gate.py")
          text = path.read_text(encoding="utf-8")

          anchor = 'DIFF_HUNK_RE = re.compile(r"^@@ -(\\d+)(?:,\\d+)? \\+(\\d+)(?:,\\d+)? @@")\n'
          taxonomy = '''DIFF_HUNK_RE = re.compile(r"^@@ -(\\d+)(?:,\\d+)? \\+(\\d+)(?:,\\d+)? @@")
OBSERVED_REVIEW_PROBE_KINDS = frozenset(
    {
        "mutable_alias",
        "time_of_check_time_of_use",
        "execution_identity",
        "coercion_boundary",
        "test_oracle",
        "cross_contract",
        "authority_boundary",
        "dependency_context",
        "state_machine_race",
    }
)
'''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one diff-hunk anchor, found {text.count(anchor)}")
          text = text.replace(anchor, taxonomy, 1)

          old_validation = '''    confirmed: set[tuple[str, int, str]] = set()
    identities: set[tuple[Any, ...]] = set()
    for index, probe in enumerate(probes, start=1):
        if not isinstance(probe, dict):
            raise RuntimeError(f"Noema adversarial probe {index} must be an object")
        location = (probe.get("path"), probe.get("line"), probe.get("side"))
'''
          new_validation = '''    confirmed: set[tuple[str, int, str]] = set()
    identities: set[tuple[Any, ...]] = set()
    probe_kinds: set[str] = set()
    for index, probe in enumerate(probes, start=1):
        if not isinstance(probe, dict):
            raise RuntimeError(f"Noema adversarial probe {index} must be an object")
        probe_kind = probe.get("probe_kind")
        if probe_kind not in OBSERVED_REVIEW_PROBE_KINDS:
            raise RuntimeError(
                f"Noema adversarial probe {index} requires probe_kind from the observed defect taxonomy"
            )
        probe_kinds.add(str(probe_kind))
        location = (probe.get("path"), probe.get("line"), probe.get("side"))
'''
          if text.count(old_validation) != 1:
              raise SystemExit(f"expected one validation block, found {text.count(old_validation)}")
          text = text.replace(old_validation, new_validation, 1)

          old_post_loop = '''        if outcome == "confirmed":
            confirmed.add((str(probe["path"]), int(probe["line"]), str(probe["side"])))

    if decision == "approve" and confirmed:
'''
          new_post_loop = '''        if outcome == "confirmed":
            confirmed.add((str(probe["path"]), int(probe["line"]), str(probe["side"])))

    if len(probe_kinds) < required_probes:
        raise RuntimeError(
            f"Noema {decision} requires at least {required_probes} distinct probe_kind values"
        )

    if decision == "approve" and confirmed:
'''
          if text.count(old_post_loop) != 1:
              raise SystemExit(f"expected one post-probe block, found {text.count(old_post_loop)}")
          text = text.replace(old_post_loop, new_post_loop, 1)

          old_schema = '''                                    **location_example,
                                    "hypothesis": "...",
'''
          new_schema = '''                                    **location_example,
                                    "probe_kind": "mutable_alias|time_of_check_time_of_use|execution_identity|coercion_boundary|test_oracle|cross_contract|authority_boundary|dependency_context|state_machine_race",
                                    "hypothesis": "...",
'''
          if text.count(old_schema) != 1:
              raise SystemExit(f"expected one probe schema block, found {text.count(old_schema)}")
          text = text.replace(old_schema, new_schema, 1)

          old_prompt = '''                "Every formal verdict must cite exact changed-side lines. APPROVE requires falsifying concrete regression hypotheses; source or test changes require at least two distinct probes and other changes require at least one. REQUEST_CHANGES requires a confirmed probe at a finding location.",
                "Use request_changes only for blocking, concrete issues. A generic no-issues statement is not review evidence.",
'''
          new_prompt = '''                "Every formal verdict must cite exact changed-side lines. APPROVE requires falsifying concrete regression hypotheses; source or test changes require at least two distinct probes and other changes require at least one. REQUEST_CHANGES requires a confirmed probe at a finding location.",
                "Classify every adversarial probe with one observed defect class and use distinct classes when multiple probes are required: mutable_alias, time_of_check_time_of_use, execution_identity, coercion_boundary, test_oracle, cross_contract, authority_boundary, dependency_context, state_machine_race.",
                "Actively attack caller-owned mutable aliases and readonly illusions; changing getters or Proxies between validation and use; execution/tenant/request identity confusion; JavaScript or serialization coercion at enum, key, digest, and identity boundaries; weak substring or vacuous test oracles; contradictions across PRD/ADR/architecture/changelog/contracts; component-vs-host authority overreach; omitted causal dependency context; and cancellation/retry/publication state-machine races.",
                "Use request_changes only for blocking, concrete issues. A generic no-issues statement is not review evidence.",
'''
          if text.count(old_prompt) != 1:
              raise SystemExit(f"expected one review prompt block, found {text.count(old_prompt)}")
          text = text.replace(old_prompt, new_prompt, 1)

          old_render = '''            lines.append(
                f"- `{probe.get('path')}:{probe.get('line')} ({probe.get('side')})` "
                f"{probe.get('outcome')}: {str(probe.get('hypothesis') or '').strip()} — "
                f"{str(probe.get('evidence') or '').strip()}"
            )
'''
          new_render = '''            lines.append(
                f"- `{probe.get('path')}:{probe.get('line')} ({probe.get('side')})` "
                f"[{probe.get('probe_kind')}] {probe.get('outcome')}: "
                f"{str(probe.get('hypothesis') or '').strip()} — "
                f"{str(probe.get('evidence') or '').strip()}"
            )
'''
          if text.count(old_render) != 1:
              raise SystemExit(f"expected one evidence-render block, found {text.count(old_render)}")
          text = text.replace(old_render, new_render, 1)
          path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = (
              "- Noema formal reviews now classify adversarial probes against an executable corpus of observed "
              "reviewer defect classes (mutable aliases, TOCTOU, identity/coercion boundaries, weak oracles, "
              "cross-contract and authority contradictions, dependency context, and state-machine races), and "
              "material changes require distinct probe classes before approval.\n"
          )
          if entry not in changelog_text:
              if changelog_text.count(marker) != 1:
                  raise SystemExit("expected exactly one Unreleased changelog heading")
              changelog.write_text(changelog_text.replace(marker, marker + entry, 1), encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text(encoding="utf-8")
          heading_end = baseline_text.find("\n")
          if heading_end < 0:
              raise SystemExit("product gap baseline has no heading line")
          note = '''

## 2026-09-01 — Noema observed-defect adversarial-probe corpus

Live review evidence from `ContextualWisdomLab/noema#528` demonstrated several defect classes that an independent reviewer must actively attack rather than relying on generic correctness prose: Devin found caller-owned mutable checkpoint aliases, changing-getter/Proxy TOCTOU across validation and snapshot, and cross-execution identity confusion; CodeRabbit separately found a vacuous `toContain("released")` oracle and cross-document contract contradictions. The central Noema validator now requires every formal adversarial probe to carry an executable `probe_kind` from the observed corpus (`mutable_alias`, `time_of_check_time_of_use`, `execution_identity`, `coercion_boundary`, `test_oracle`, `cross_contract`, `authority_boundary`, `dependency_context`, `state_machine_race`). Material source/test changes already require two probes; they now must cover distinct classes so duplicated generic attacks cannot satisfy the gate. The prompt explicitly attacks these failure shapes and the published review evidence renders the class for auditability. This strengthens review evidence without claiming parity or superiority over proprietary reviewers; the corpus is grounded only in concrete, independently observed PR findings.
'''
          if "## 2026-09-01 — Noema observed-defect adversarial-probe corpus" not in baseline_text:
              baseline.write_text(baseline_text[: heading_end + 1] + note + baseline_text[heading_end + 1 :], encoding="utf-8")
          PY

          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt >/dev/null
          PYTHONPATH=. python3 -m pytest -q tests/test_noema_observed_defect_probe_taxonomy.py tests/test_noema_review_gate.py
          PYTHONPATH=. python3 -m pytest -q tests
          python3 -m interrogate --fail-under=100 scripts/ci/noema_review_gate.py
          python3 -m compileall -q scripts/ci tests
          git diff --check

          git rm .github/workflows/source-fix-noema-observed-probe-taxonomy.yml
          git add scripts/ci/noema_review_gate.py tests/test_noema_observed_defect_probe_taxonomy.py CHANGELOG.md docs/product-technical-gap-baseline.md
          git diff --cached --check
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(noema): require observed defect-class probes"
          git push origin "HEAD:${TARGET_BRANCH}"
