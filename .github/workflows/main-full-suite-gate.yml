name: Main full suite gate

# Post-merge safety net for the whole `tests/` suite.
#
# No workflow ran `tests/` on an unfiltered `main` push.
# `agent-review-runtime-quality-ci.yml` has no push trigger at all;
# `opencode-review-dispatch.yml` triggers solely on `repository_dispatch`;
# `trusted-uv-materializer-quality-ci.yml` does run on `main` push but only for
# its own `paths` list (the materialize/uv surface plus `tests/conftest.py`,
# `pyproject.toml`, the tooling requirements lock, and the repository
# branch-coverage tests). `repository-metadata-reconcile.yml` runs an
# unrestricted `pytest -q`, but on an hourly schedule rather than on a push, so
# a broken merge still sits undetected until that schedule happens to fire.
#
# So a merge that broke the suite landed silently and first surfaced as a red
# check on the next, entirely unrelated pull request — the failure mode behind
# #1823, #1826, #1828, #1892, and #1895.
#
# This job deliberately carries NO `paths` filter: the point is to catch the
# merges no path list anticipated. It is not part of the organization required
# workflow ruleset and is not injected into sibling repositories, so its cost
# is one runner slot per `main` push in this repository alone. Successive
# pushes coalesce through the concurrency group below rather than stacking.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-full-suite-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Full suite, coverage, and docstrings on main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Run the full suite with coverage
        run: python -m coverage run -m pytest tests -q

      - name: Enforce the 100% coverage gate
        run: python -m coverage report --show-missing

      - name: Enforce the 100% docstring gate
        run: python -m interrogate
