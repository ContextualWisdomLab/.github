name: One-shot PR 1589 Noema CodeGraph repair

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-noema-codegraph.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply source-only GREEN transform
        env:
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci/source_fix_1589_noema_codegraph.py
          python3 -m py_compile scripts/ci/noema_review_gate.py tests/test_noema_codegraph_context_contract.py
          bash -n scripts/ci/noema_codegraph_context.sh
          git diff --check
          test ! -e .github/workflows/source-fix-1589-noema-codegraph.yml
          test ! -e scripts/ci/source_fix_1589_noema_codegraph.py
          git config user.name "cwl-source-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(noema): bind review to exact-head CodeGraph context"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
