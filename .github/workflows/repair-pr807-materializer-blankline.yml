name: Repair PR 807 materializer blank line

on:
  push:
    branches: [fix/npm-nested-metadata-lock-validation]
    paths: [.github/pr807-materializer.trigger]

permissions:
  contents: read

jobs:
  repair:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Repair generated-test trailing whitespace and remove superseded trigger
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/materialize-npm-nested-metadata-validation.yml')
          source = path.read_text(encoding='utf-8')
          old = 'path.write_text(source.rstrip() + tests + "\\n", encoding="utf-8")'
          new = 'path.write_text(source.rstrip() + tests.rstrip() + "\\n", encoding="utf-8")'
          if source.count(old) != 1:
              raise SystemExit(f'materializer append anchor count={source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f \
            .github/npm-nested-metadata.trigger \
            .github/pr807-materializer.trigger \
            .github/workflows/trigger-npm-nested-metadata-materializer.yml \
            .github/workflows/repair-pr807-materializer-blankline.yml
          git diff --check

      - name: Create immutable corrected materializer commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr807-materializer.txt"
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repository='ContextualWisdomLab/.github'
          parent=os.environ['EXPECTED_HEAD']
          token=os.environ['API_TOKEN']
          root=f'https://api.github.com/repos/{repository}'
          expected={'.github/npm-nested-metadata.trigger','.github/pr807-materializer.trigger','.github/workflows/trigger-npm-nested-metadata-materializer.yml','.github/workflows/repair-pr807-materializer-blankline.yml','.github/workflows/materialize-npm-nested-metadata-validation.yml'}
          def request(method, endpoint, payload=None):
              req=urllib.request.Request(root+endpoint,data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'cwl-pr807-materializer-repair'})
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          raw=subprocess.check_output(['git','diff','--name-status','-z','HEAD']).decode().split('\0')
          changes=[]; index=0
          while index < len(raw)-1:
              changes.append((raw[index],raw[index+1])); index += 2
          actual={path for _,path in changes}
          if actual != expected: raise SystemExit(f'path mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          parent_obj=request('GET',f'/git/commits/{parent}')
          entries=[]
          for status,path in changes:
              if status == 'D': entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else:
                  blob=request('POST','/git/blobs',{'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'})
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('POST','/git/trees',{'base_tree':parent_obj['tree']['sha'],'tree':entries})
          commit=request('POST','/git/commits',{'message':'ci: remove trailing blank line from generated npm tests','tree':tree['sha'],'parents':[parent]})
          print('PR807_MATERIALIZER_PARENT_SHA='+parent)
          print('PR807_MATERIALIZER_COMMIT_SHA='+commit['sha'])
          PY

      - name: Publish corrected materializer pointer
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          commit_sha="$(sed -n 's/^PR807_MATERIALIZER_COMMIT_SHA=//p' "${RUNNER_TEMP}/pr807-materializer.txt")"
          test "${#commit_sha}" -eq 40
          gh api --method POST repos/ContextualWisdomLab/.github/issues/807/comments -f "body=PR807_MATERIALIZER_PARENT_SHA=${EXPECTED_HEAD}%0APR807_MATERIALIZER_COMMIT_SHA=${commit_sha}"
