name: Export live PR 782 RCA implementation

on:
  push:
    branches:
      - tmp/export-pr782-rca-live-20260808
    paths:
      - .github/workflows/export-pr782-live-rca.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize RCA implementation bundle
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          bundle="$RUNNER_TEMP/pr782-live-rca"
          mkdir -p "$bundle/.github/workflows" "$bundle/scripts/ci" "$bundle/tests" "$bundle/docs/automation" "$bundle/docs/doctoring"
          cp .github/workflows/pr-review-autofix.yml "$bundle/.github/workflows/pr-review-autofix.yml"
          cp .github/workflows/pr-review-fix-scheduler.yml "$bundle/.github/workflows/pr-review-fix-scheduler.yml"
          cp .github/workflows/hourly-nvidia-nim-review-repair.yml "$bundle/.github/workflows/hourly-nvidia-nim-review-repair.yml"
          cp scripts/ci/pr_review_autofix_context.py "$bundle/scripts/ci/pr_review_autofix_context.py"
          cp scripts/ci/pr_review_fix_scheduler.py "$bundle/scripts/ci/pr_review_fix_scheduler.py"
          cp scripts/ci/test_strix_quick_gate.sh "$bundle/scripts/ci/test_strix_quick_gate.sh"
          cp scripts/ci/strix_quick_gate.sh "$bundle/scripts/ci/strix_quick_gate.sh"
          cp tests/test_hourly_autofix_context_quality_gate.py "$bundle/tests/test_hourly_autofix_context_quality_gate.py"
          cp tests/test_pr_review_autofix_context_head_binding.py "$bundle/tests/test_pr_review_autofix_context_head_binding.py"
          cp tests/test_pr_review_fix_scheduler.py "$bundle/tests/test_pr_review_fix_scheduler.py"
          cp tests/test_pr_review_fix_hourly_contract.py "$bundle/tests/test_pr_review_fix_hourly_contract.py"
          cp tests/test_opencode_agent_contract.py "$bundle/tests/test_opencode_agent_contract.py"
          cp docs/automation/hourly-review-repair.md "$bundle/docs/automation/hourly-review-repair.md"
          cp docs/doctoring/hourly-nvidia-nim-autofix.md "$bundle/docs/doctoring/hourly-nvidia-nim-autofix.md"
          cp CHANGELOG.md "$bundle/CHANGELOG.md"
          {
            printf 'source_head=%s\n' "$GITHUB_SHA"
            find "$bundle" -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum
          } >"$bundle/MANIFEST.sha256"
      - name: Upload RCA implementation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr782-live-rca-${{ github.sha }}
          path: ${{ runner.temp }}/pr782-live-rca
          if-no-files-found: error
          retention-days: 1
