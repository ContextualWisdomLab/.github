name: Reconcile PR 1606 with current main

on:
  push:
    branches:
      - fix/noema-truncated-completion-contract-20260901
    paths:
      - .github/workflows/reconcile-pr1606-current-main.yml

concurrency:
  group: reconcile-pr1606-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile protected main without history rewrite
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          main_head="$(git rev-parse origin/main)"
          base="$(git merge-base HEAD origin/main)"
          intended=(
            CHANGELOG.md
            scripts/ci/noema_review_gate.py
            tests/test_noema_truncated_completion_contract.py
          )
          git diff --binary "$base" HEAD -- \
            scripts/ci/noema_review_gate.py \
            tests/test_noema_truncated_completion_contract.py > /tmp/pr1606-core.patch
          test -s /tmp/pr1606-core.patch

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicts"
            while IFS= read -r path; do
              case "$path" in
                CHANGELOG.md|scripts/ci/noema_review_gate.py|tests/test_noema_truncated_completion_contract.py) ;;
                *) echo "unexpected merge conflict: $path" >&2; exit 1 ;;
              esac
            done <<< "$conflicts"
          fi

          # Resolve intended paths from current protected main first. The new
          # test does not exist on main, so remove it from the merge index
          # without passing a now-missing pathspec to a bulk git-add command.
          for path in "${intended[@]}"; do
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git checkout origin/main -- "$path"
            else
              git rm -f --ignore-unmatch "$path"
            fi
          done
          git add -A -- CHANGELOG.md scripts/ci/noema_review_gate.py

          # Reapply the production/test semantic delta with Git's three-way
          # machinery so concurrent main edits are retained where non-conflicting.
          git apply --3way --index /tmp/pr1606-core.patch

          # Changelog additions near [Unreleased] conflict frequently with
          # unrelated concurrent entries. Materialize this PR's exact entry
          # idempotently on the live-main text instead of replaying an obsolete
          # line-context patch that would overwrite or conflict with new entries.
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "- **Recover Noema from provider-truncated structured review completions (`#1596`).**"
          if marker not in text:
              block = """- **Recover Noema from provider-truncated structured review completions (`#1596`).**
            The review client now retains bounded `finish_reason`, model, and token-usage
            metadata from the OpenAI-compatible envelope, requests JSON mode with an
            explicit 4,096-token output budget through Contextual Orchestrator, and
            constrains verdict cardinality and field lengths. A provider-declared
            `finish_reason=length` receives one compact exact-head repair request; a
            repeated length stop fails closed as `truncated_after_retry`, distinct from
            `invalid_json_after_retry`. Raw model output remains absent from public logs.
          """
              heading = "## [Unreleased]\n"
              if heading not in text:
                  raise SystemExit("missing [Unreleased] changelog heading")
              text = text.replace(heading, heading + block, 1)
              path.write_text(text)
          PY
          git add CHANGELOG.md

          python -m pytest -q tests/test_noema_truncated_completion_contract.py
          python -m pytest -q
          python -m compileall -q scripts/ci/noema_review_gate.py tests/test_noema_truncated_completion_contract.py
          git diff --check

          # One-shot reconciliation scaffolding must not survive the repair.
          git rm .github/workflows/reconcile-pr1606-current-main.yml

          # The post-merge tree relative to live main must contain only the
          # PR's three intended permanent paths.
          mapfile -t changed < <(git diff --cached --name-only "$main_head")
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed
          printf '%s\n' "${intended[@]}" | sort -u > /tmp/expected
          diff -u /tmp/expected /tmp/changed

          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git commit -m "merge: reconcile PR 1606 with current main"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
