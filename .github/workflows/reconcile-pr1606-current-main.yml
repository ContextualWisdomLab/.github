name: Reconcile PR 1606 with current main

on:
  push:
    branches:
      - fix/noema-truncated-completion-contract-20260901
    paths:
      - .github/workflows/reconcile-pr1606-current-main.yml

concurrency:
  group: reconcile-pr1606-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile protected main without history rewrite
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          git fetch origin main
          main_head="$(git rev-parse origin/main)"
          base="$(git merge-base HEAD origin/main)"
          intended=(
            CHANGELOG.md
            scripts/ci/noema_review_gate.py
            tests/test_noema_truncated_completion_contract.py
          )
          git diff --binary "$base" HEAD -- "${intended[@]}" > /tmp/pr1606.patch
          test -s /tmp/pr1606.patch

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicts"
            while IFS= read -r path; do
              case "$path" in
                CHANGELOG.md|scripts/ci/noema_review_gate.py|tests/test_noema_truncated_completion_contract.py) ;;
                *) echo "unexpected merge conflict: $path" >&2; exit 1 ;;
              esac
            done <<< "$conflicts"
          fi

          # Resolve every intended path from current protected main first, then
          # reapply only PR1606's semantic delta. Fail closed if that delta no
          # longer applies cleanly to the live baseline.
          for path in "${intended[@]}"; do
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git checkout origin/main -- "$path"
            else
              git rm -f --ignore-unmatch "$path"
            fi
          done
          git add -A -- "${intended[@]}"
          git apply --check /tmp/pr1606.patch
          git apply --index /tmp/pr1606.patch

          python -m pytest -q tests/test_noema_truncated_completion_contract.py
          python -m pytest -q
          python -m compileall -q scripts/ci/noema_review_gate.py tests/test_noema_truncated_completion_contract.py
          git diff --check

          # One-shot reconciliation scaffolding must not survive the repair.
          git rm .github/workflows/reconcile-pr1606-current-main.yml

          # The post-merge tree relative to live main must contain only the
          # PR's three intended permanent paths.
          mapfile -t changed < <(git diff --cached --name-only "$main_head")
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed
          printf '%s\n' "${intended[@]}" | sort -u > /tmp/expected
          diff -u /tmp/expected /tmp/changed

          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "merge: reconcile PR 1606 with current main"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
