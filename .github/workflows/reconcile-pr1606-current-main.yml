name: Reconcile PR 1606 with current main

on:
  push:
    branches:
      - fix/noema-truncated-completion-contract-20260901
    paths:
      - .github/workflows/reconcile-pr1606-current-main.yml

concurrency:
  group: reconcile-pr1606-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Reconcile protected main without history rewrite
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          main_head="$(git rev-parse origin/main)"
          intended=(
            CHANGELOG.md
            scripts/ci/noema_review_gate.py
            tests/test_noema_truncated_completion_contract.py
          )

          # Preserve the exact RED regression from the writer head before the
          # merge index is reset to protected main.
          test -f tests/test_noema_truncated_completion_contract.py
          cp tests/test_noema_truncated_completion_contract.py /tmp/pr1606-test.py

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicts"
            while IFS= read -r path; do
              case "$path" in
                CHANGELOG.md|scripts/ci/noema_review_gate.py|tests/test_noema_truncated_completion_contract.py) ;;
                *) echo "unexpected merge conflict: $path" >&2; exit 1 ;;
              esac
            done <<< "$conflicts"
          fi

          # Protected main is the authoritative baseline. Re-materialize only
          # this PR's semantic delta rather than accepting either side of the
          # conflicted historical source file wholesale.
          git checkout origin/main -- CHANGELOG.md scripts/ci/noema_review_gate.py
          git rm -f --ignore-unmatch tests/test_noema_truncated_completion_contract.py
          install -D -m 0644 /tmp/pr1606-test.py tests/test_noema_truncated_completion_contract.py

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/noema_review_gate.py")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one live-main anchor, found {count}")
              text = text.replace(old, new, 1)

          if "from dataclasses import dataclass\n" not in text:
              replace_once(
                  "from collections.abc import Sequence\nfrom typing import Any\n",
                  "from collections.abc import Sequence\nfrom dataclasses import dataclass\nfrom typing import Any\n",
                  "dataclass import",
              )

          constants = """NOEMA_LLM_MAX_COMPLETION_TOKENS = 4096
          NOEMA_MAX_VERDICT_TEXT_CHARS = 600
          NOEMA_MAX_REVIEWED_LINES = 6
          NOEMA_MAX_ADVERSARIAL_PROBES = 4
          NOEMA_MAX_FINDINGS = 5
          NOEMA_MAX_CLASS_EVIDENCE_FIELDS = 6
          NOEMA_MAX_CLASS_EVIDENCE_CHARS = 400
          """
          if "NOEMA_LLM_MAX_COMPLETION_TOKENS = 4096" not in text:
              replace_once(
                  "MAX_THREAD_BODY_CHARS = 1200\n",
                  "MAX_THREAD_BODY_CHARS = 1200\n" + constants,
                  "bounded completion constants",
              )

          types_and_bounds = '''class TruncatedCompletionError(NoemaModelOutputError):
              """Signal a provider-declared output-budget termination."""


          class InvalidCompletionError(NoemaModelOutputError):
              """Signal an unusable structured-completion envelope or JSON payload."""


          class InvalidVerdictError(NoemaModelOutputError):
              """Signal decoded JSON that fails the bounded Noema verdict contract."""


          @dataclass(frozen=True)
          class LLMCompletion:
              """Store validated content and bounded provider completion metadata."""

              content: str
              finish_reason: str
              model: str
              prompt_tokens: int | None
              completion_tokens: int | None


          def _bounded_text(value: Any, label: str, limit: int) -> None:
              """Reject a present rendered field unless it is bounded text."""
              if value is None:
                  return
              if not isinstance(value, str):
                  raise NoemaModelOutputError(f"Noema LLM response {label} must be a string")
              if len(value) > limit:
                  raise NoemaModelOutputError(
                      f"Noema LLM response {label} exceeds {limit} characters"
                  )


          def _required_bounded_text(value: Any, label: str, limit: int) -> str:
              """Return one non-empty rendered text field after enforcing its bound."""
              _bounded_text(value, label, limit)
              if not isinstance(value, str) or not value.strip():
                  raise NoemaModelOutputError(
                      f"Noema LLM response {label} must be a non-empty string"
                  )
              return value


          def _positive_line(value: Any, label: str) -> int:
              """Return one positive rendered line number after rejecting bools/objects."""
              if type(value) is not int or value <= 0:
                  raise NoemaModelOutputError(
                      f"Noema LLM response {label} must be a positive integer"
                  )
              return value


          def _bounded_list(value: Any, label: str, limit: int) -> list[Any]:
              """Return an optional list after enforcing type and cardinality bounds."""
              if value is None:
                  return []
              if not isinstance(value, list):
                  raise NoemaModelOutputError(f"Noema LLM response {label} must be a list")
              if len(value) > limit:
                  raise NoemaModelOutputError(
                      f"Noema LLM response {label} exceeds {limit} items"
                  )
              return value


          def validate_verdict_output_bounds(verdict: dict[str, Any]) -> None:
              """Type and bound every model-controlled value rendered into GitHub Markdown."""
              _bounded_text(verdict.get("summary"), "summary", NOEMA_MAX_VERDICT_TEXT_CHARS)
              reviewed_lines = _bounded_list(
                  verdict.get("reviewed_lines"), "reviewed_lines", NOEMA_MAX_REVIEWED_LINES
              )
              for reviewed in reviewed_lines:
                  if not isinstance(reviewed, dict):
                      raise NoemaModelOutputError(
                          "Noema LLM response reviewed_lines entries must be objects"
                      )
                  _required_bounded_text(
                      reviewed.get("path"), "reviewed_lines.path", NOEMA_MAX_VERDICT_TEXT_CHARS
                  )
                  _positive_line(reviewed.get("line"), "reviewed_lines.line")
                  _required_bounded_text(
                      reviewed.get("side"), "reviewed_lines.side", NOEMA_MAX_VERDICT_TEXT_CHARS
                  )
                  _required_bounded_text(
                      reviewed.get("analysis"),
                      "reviewed_lines.analysis",
                      NOEMA_MAX_VERDICT_TEXT_CHARS,
                  )

              validation = verdict.get("adversarial_validation")
              if validation is not None and not isinstance(validation, dict):
                  raise NoemaModelOutputError(
                      "Noema LLM response adversarial_validation must be an object"
                  )
              if isinstance(validation, dict):
                  _required_bounded_text(
                      validation.get("residual_risk"),
                      "adversarial_validation.residual_risk",
                      NOEMA_MAX_VERDICT_TEXT_CHARS,
                  )
                  probes = _bounded_list(
                      validation.get("probes"),
                      "adversarial_validation.probes",
                      NOEMA_MAX_ADVERSARIAL_PROBES,
                  )
                  for probe in probes:
                      if not isinstance(probe, dict):
                          raise NoemaModelOutputError(
                              "Noema LLM response adversarial_validation.probes entries must be objects"
                          )
                      for field in (
                          "path",
                          "side",
                          "outcome",
                          "hypothesis",
                          "attack_or_counterexample",
                          "evidence",
                      ):
                          _required_bounded_text(
                              probe.get(field),
                              f"adversarial_validation.probes.{field}",
                              NOEMA_MAX_VERDICT_TEXT_CHARS,
                          )
                      _positive_line(
                          probe.get("line"), "adversarial_validation.probes.line"
                      )
                      class_evidence = probe.get("class_evidence")
                      if class_evidence is None:
                          continue
                      if not isinstance(class_evidence, dict):
                          raise NoemaModelOutputError(
                              "Noema LLM response adversarial probe class_evidence must be an object"
                          )
                      if len(class_evidence) > NOEMA_MAX_CLASS_EVIDENCE_FIELDS:
                          raise NoemaModelOutputError(
                              "Noema LLM response adversarial probe class_evidence "
                              f"exceeds {NOEMA_MAX_CLASS_EVIDENCE_FIELDS} fields"
                          )
                      for value in class_evidence.values():
                          _bounded_text(
                              value,
                              "adversarial_validation.probes.class_evidence",
                              NOEMA_MAX_CLASS_EVIDENCE_CHARS,
                          )

              findings = _bounded_list(verdict.get("findings"), "findings", NOEMA_MAX_FINDINGS)
              for finding in findings:
                  if not isinstance(finding, dict):
                      raise NoemaModelOutputError(
                          "Noema LLM response findings entries must be objects"
                      )
                  _required_bounded_text(
                      finding.get("file"), "findings.file", NOEMA_MAX_VERDICT_TEXT_CHARS
                  )
                  _bounded_text(
                      finding.get("message"), "findings.message", NOEMA_MAX_VERDICT_TEXT_CHARS
                  )
          '''
          if "class TruncatedCompletionError" not in text:
              anchor = "def _stable_failure_diagnostic(exc: BaseException) -> str:\n"
              index = text.index(anchor)
              text = text[:index] + types_and_bounds + "\n\n" + text[index:]

          completion_parser = '''def _bounded_token_count(value: Any, field: str) -> int | None:
              """Validate one optional usage count without retaining an unbounded value."""
              if value is None:
                  return None
              if type(value) is not int or value < 0 or value > 1_048_576_000:
                  raise NoemaModelOutputError(
                      f"Noema LLM response usage.{field} was not a bounded non-negative integer"
                  )
              return value


          def extract_llm_completion(raw: str) -> LLMCompletion:
              """Parse one OpenAI-compatible completion and retain bounded metadata."""
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise NoemaModelOutputError(
                      f"Noema LLM response body was not valid JSON: {exc}"
                  ) from exc
              if not isinstance(data, dict):
                  raise NoemaModelOutputError(
                      f"Noema LLM response body was not a JSON object (got {type(data).__name__})"
                  )
              choices = data.get("choices")
              if not choices:
                  choices = [{}]
              elif not isinstance(choices, list):
                  raise NoemaModelOutputError(
                      f"Noema LLM response 'choices' was not a list (got {type(choices).__name__})"
                  )
              first_choice = choices[0]
              if not isinstance(first_choice, dict):
                  raise NoemaModelOutputError(
                      "Noema LLM response choices[0] was not a JSON object "
                      f"(got {type(first_choice).__name__})"
                  )
              message = first_choice.get("message")
              if not message:
                  message = {}
              elif not isinstance(message, dict):
                  raise NoemaModelOutputError(
                      f"Noema LLM response 'message' was not a JSON object (got {type(message).__name__})"
                  )
              content = message.get("content")
              if not content:
                  content = ""
              elif not isinstance(content, str):
                  raise NoemaModelOutputError(
                      f"Noema LLM response 'content' was not a string (got {type(content).__name__})"
                  )

              finish_reason_value = first_choice.get("finish_reason")
              if finish_reason_value is None:
                  finish_reason = ""
              elif not isinstance(finish_reason_value, str):
                  raise NoemaModelOutputError(
                      "Noema LLM response finish_reason was not a string"
                  )
              else:
                  finish_reason = finish_reason_value.strip().lower()
                  if len(finish_reason) > 64 or not re.fullmatch(
                      r"[a-z0-9_-]*", finish_reason
                  ):
                      raise NoemaModelOutputError(
                          "Noema LLM response finish_reason was malformed"
                      )

              model_value = data.get("model")
              if model_value is None:
                  model = ""
              elif not isinstance(model_value, str):
                  raise NoemaModelOutputError(
                      "Noema LLM response model metadata was not a string"
                  )
              else:
                  model = model_value.strip()
                  if len(model) > 256 or any(ord(character) < 32 for character in model):
                      raise NoemaModelOutputError(
                          "Noema LLM response model metadata was malformed"
                      )

              usage_value = data.get("usage")
              if usage_value is None:
                  usage: dict[str, Any] = {}
              elif not isinstance(usage_value, dict):
                  raise NoemaModelOutputError(
                      "Noema LLM response usage metadata was not an object"
                  )
              else:
                  usage = usage_value
              prompt_tokens = _bounded_token_count(
                  usage.get("prompt_tokens", usage.get("input_tokens")), "prompt_tokens"
              )
              completion_tokens = _bounded_token_count(
                  usage.get("completion_tokens", usage.get("output_tokens")),
                  "completion_tokens",
              )
              return LLMCompletion(
                  content=content.strip(),
                  finish_reason=finish_reason,
                  model=model,
                  prompt_tokens=prompt_tokens,
                  completion_tokens=completion_tokens,
              )


          def extract_llm_message_content(raw: str) -> str:
              """Return content from a validated completion envelope."""
              return extract_llm_completion(raw).content
          '''
          start = text.index("def extract_llm_message_content(raw: str) -> str:\n")
          end = text.index("\n\ndef decode_llm_response_body", start)
          text = text[:start] + completion_parser + text[end:]

          compact_prompt = (
              '                "Use request_changes only for blocking, concrete issues. A generic no-issues statement is not review evidence.",\n'
          )
          if "Keep the JSON compact:" not in text:
              replace_once(
                  compact_prompt,
                  compact_prompt
                  + '                "Keep the JSON compact: summary, reviewed-line analysis, probe hypothesis/attack/evidence, residual risk, and finding messages must each stay within 600 characters; use at most 6 reviewed_lines, 4 probes, and 5 findings.",\n',
                  "compact verdict prompt",
              )
          if "Repair mode: emit the smallest complete JSON verdict" not in text:
              replace_once(
                  '                        "Return one corrected JSON verdict using only exact changed-side locations from the supplied diff.",\n',
                  '                        "Return one corrected JSON verdict using only exact changed-side locations from the supplied diff.",\n'
                  '                        "Repair mode: emit the smallest complete JSON verdict that satisfies the schema; prefer one reviewed line, the minimum required probes, and no nonblocking findings.",\n',
                  "compact repair prompt",
              )
          if '"max_completion_tokens": NOEMA_LLM_MAX_COMPLETION_TOKENS' not in text:
              replace_once(
                  '        "temperature": 0,\n        "messages": [\n',
                  '        "temperature": 0,\n'
                  '        "max_completion_tokens": NOEMA_LLM_MAX_COMPLETION_TOKENS,\n'
                  '        "response_format": {"type": "json_object"},\n'
                  '        "messages": [\n',
                  "structured completion request",
              )

          call_start = text.index("def call_llm(")
          parse_start = text.index(
              "            raw = decode_llm_response_body(raw_bytes)\n", call_start
          )
          parse_end_marker = (
              "            validate_substantive_verdict(verdict, diff, changed_paths)\n"
          )
          parse_end = text.index(parse_end_marker, parse_start) + len(parse_end_marker)
          parse_block = '''            raw = decode_llm_response_body(raw_bytes)
              try:
                  completion = extract_llm_completion(raw)
              except NoemaModelOutputError as exc:
                  raise InvalidCompletionError(
                      "Noema LLM response invalid completion: "
                      + _stable_failure_diagnostic(exc)
                  ) from exc
              if completion.finish_reason == "length":
                  raise TruncatedCompletionError(
                      "Noema LLM response ended with finish_reason=length"
                  )
              if completion.finish_reason not in {"", "stop"}:
                  raise InvalidCompletionError(
                      "Noema LLM response invalid completion: unsupported finish reason"
                  )
              try:
                  verdict = extract_json_object(completion.content)
              except NoemaModelOutputError as exc:
                  raise InvalidCompletionError(
                      "Noema LLM response invalid completion: "
                      + _stable_failure_diagnostic(exc)
                  ) from exc
              try:
                  decision_value = verdict.get("decision")
                  if not isinstance(decision_value, str):
                      raise NoemaModelOutputError(
                          "Noema LLM response decision must be a string"
                      )
                  decision = decision_value.strip().lower()
                  if decision not in {"approve", "request_changes", "comment"}:
                      raise NoemaModelOutputError(
                          "Noema LLM returned an unsupported decision"
                      )
                  summary = verdict.get("summary")
                  if not isinstance(summary, str) or not summary.strip():
                      raise NoemaModelOutputError(
                          "Noema LLM response did not contain a substantive summary"
                      )
                  findings = verdict.get("findings")
                  if not isinstance(findings, list) or any(
                      not isinstance(finding, dict) for finding in findings
                  ):
                      raise NoemaModelOutputError(
                          "Noema LLM response findings must be a list of objects"
                      )
                  for finding in findings:
                      if (
                          finding.get("severity") not in {"high", "medium", "low"}
                          or not isinstance(finding.get("file"), str)
                          or not finding["file"].strip()
                          or type(finding.get("line")) is not int
                          or finding["line"] <= 0
                          or finding.get("side") not in {"RIGHT", "LEFT"}
                          or not isinstance(finding.get("message"), str)
                          or not finding["message"].strip()
                      ):
                          raise NoemaModelOutputError(
                              "Noema LLM response contained a malformed finding"
                          )
                  if decision == "request_changes" and not findings:
                      raise NoemaModelOutputError(
                          "Noema LLM request_changes response did not contain a substantive finding"
                      )
                  validate_verdict_output_bounds(verdict)
                  validate_substantive_verdict(verdict, diff, changed_paths)
              except NoemaModelOutputError as exc:
                  raise InvalidVerdictError(
                      "Noema LLM response invalid verdict: "
                      + _stable_failure_diagnostic(exc)
                  ) from exc
              except RuntimeError as exc:
                  raise InvalidVerdictError(
                      "Noema LLM response invalid verdict: " + str(exc)
                  ) from exc
          '''
          text = text[:parse_start] + parse_block + text[parse_end:]

          retry_anchor = "        if is_retry:\n            initial_failure = (\n"
          if "truncated_after_retry" not in text:
              replace_once(
                  retry_anchor,
                  "        if is_retry:\n"
                  "            if isinstance(exc, TruncatedCompletionError):\n"
                  "                raise NoemaModelOutputError(\n"
                  "                    \"Noema LLM response truncated_after_retry: provider again ended the structured completion at its output limit\"\n"
                  "                ) from None\n"
                  "            if isinstance(exc, InvalidCompletionError):\n"
                  "                raise NoemaModelOutputError(\n"
                  "                    \"Noema LLM response invalid_json_after_retry: structured completion remained invalid\"\n"
                  "                ) from None\n"
                  "            if isinstance(exc, InvalidVerdictError):\n"
                  "                raise NoemaModelOutputError(\n"
                  "                    \"Noema LLM response invalid_verdict_after_retry: decoded verdict remained outside the trusted schema\"\n"
                  "                ) from None\n"
                  "            initial_failure = (\n",
                  "typed retry terminal diagnostics",
              )

          path.write_text(text)
          PY

          # Changelog additions near [Unreleased] conflict frequently with
          # unrelated concurrent entries. Materialize this PR's exact entry
          # idempotently on the live-main text.
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "- **Recover Noema from provider-truncated structured review completions (`#1596`).**"
          if marker not in text:
              block = """- **Recover Noema from provider-truncated structured review completions (`#1596`).**
            The review client now retains bounded `finish_reason`, model, and token-usage
            metadata from the OpenAI-compatible envelope, requests JSON mode with an
            explicit 4,096-token output budget through Contextual Orchestrator, and
            constrains verdict cardinality and field lengths. A provider-declared
            `finish_reason=length` receives one compact exact-head repair request; a
            repeated length stop fails closed as `truncated_after_retry`, distinct from
            `invalid_json_after_retry`. Raw model output remains absent from public logs.
          """
              heading = "## [Unreleased]\n"
              if heading not in text:
                  raise SystemExit("missing [Unreleased] changelog heading")
              text = text.replace(heading, heading + block, 1)
              path.write_text(text)
          PY

          git add CHANGELOG.md scripts/ci/noema_review_gate.py tests/test_noema_truncated_completion_contract.py
          python -m pytest -q tests/test_noema_truncated_completion_contract.py
          python -m pytest -q
          python -m compileall -q scripts/ci/noema_review_gate.py tests/test_noema_truncated_completion_contract.py
          git diff --check

          # One-shot reconciliation scaffolding must not survive the repair.
          git rm .github/workflows/reconcile-pr1606-current-main.yml

          # Relative to the exact protected main we fetched, only the PR's
          # three permanent semantic paths may remain.
          mapfile -t changed < <(git diff --cached --name-only "$main_head")
          printf '%s\n' "${changed[@]}" | sort -u > /tmp/changed
          printf '%s\n' "${intended[@]}" | sort -u > /tmp/expected
          diff -u /tmp/expected /tmp/changed

          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git commit -m "merge: reconcile PR 1606 with current main"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
