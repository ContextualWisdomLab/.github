name: Reconcile PR 1606 onto current main

on:
  push:
    branches:
      - fix/noema-truncated-completion-contract-20260901
    paths:
      - .github/workflows/reconcile-pr1606-current-main.yml

concurrency:
  group: reconcile-pr1606-current-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-slim
    timeout-minutes: 45
    env:
      WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Reconcile protected main without history rewrite
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${WORKFLOW_PUSH_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"

          intended=(
            CHANGELOG.md
            scripts/ci/noema_review_gate.py
            tests/test_noema_truncated_completion_contract.py
          )

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicts"
            while IFS= read -r conflict; do
              [ -n "$conflict" ] || continue
              allowed=false
              for path in "${intended[@]}"; do
                if [ "$conflict" = "$path" ]; then
                  allowed=true
                  break
                fi
              done
              if [ "$allowed" != true ]; then
                echo "Unexpected current-main conflict outside semantic PR scope: $conflict" >&2
                exit 1
              fi
            done <<< "$conflicts"
          fi

          # Always begin conflict resolution from current protected main. The
          # old branch source contains valid semantics but is not authoritative
          # for unrelated Noema hardening that landed later on main.
          git checkout --theirs -- CHANGELOG.md scripts/ci/noema_review_gate.py 2>/dev/null || true
          git add CHANGELOG.md scripts/ci/noema_review_gate.py
          # The focused regression is the PR's intended new test. Recreate it
          # from the exact pre-merge writer commit so current-main reconciliation
          # preserves the branch's TDD evidence without taking old production code.
          git show "$EXPECTED_HEAD:tests/test_noema_truncated_completion_contract.py" > tests/test_noema_truncated_completion_contract.py
          git add tests/test_noema_truncated_completion_contract.py

          # Materialize the semantic delta on top of live main. The transaction
          # is deliberately fail closed: every anchor must have exactly the
          # expected current-main shape or this run stops without pushing.
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/noema_review_gate.py")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              text = text.replace(old, new, 1)

          # --- exact PR1606 semantic constants/types, adapted to current main ---
          const_anchor = "NOEMA_MAX_RESPONSE_BYTES = 2 * 1024 * 1024\n"
          if "NOEMA_LLM_MAX_COMPLETION_TOKENS" not in text:
              replace_once(
                  const_anchor,
                  const_anchor
                  + "NOEMA_LLM_MAX_COMPLETION_TOKENS = 4096\n"
                  + "NOEMA_MAX_VERDICT_TEXT_CHARS = 600\n"
                  + "NOEMA_MAX_REVIEWED_LINES = 6\n"
                  + "NOEMA_MAX_ADVERSARIAL_PROBES = 4\n"
                  + "NOEMA_MAX_FINDINGS = 5\n",
                  "bounded completion constants",
              )

          type_anchor = '''class NoemaRepairDeadlineExceeded(NoemaTransportError):
              """Raised when the one corrective attempt exhausts its absolute wall clock."""
          '''
          if "class TruncatedCompletionError" not in text:
              replacement = type_anchor + '''

          class TruncatedCompletionError(NoemaModelOutputError):
              """Raised when the provider explicitly reports a length-truncated completion."""


          class InvalidCompletionError(NoemaModelOutputError):
              """Raised when the structured completion envelope/content is malformed."""


          class InvalidVerdictError(NoemaModelOutputError):
              """Raised when decoded JSON violates the trusted Noema verdict schema."""


          @dataclass(frozen=True)
          class LLMCompletion:
              """Bounded metadata retained from a provider completion envelope."""

              content: str
              finish_reason: str
              model: str
              prompt_tokens: int | None
              completion_tokens: int | None
          '''
              replace_once(type_anchor, replacement, "completion error types")

          parser_anchor = "def extract_llm_message_content(raw: str) -> str:\n"
          completion_parser = '''def _bounded_token_count(value: Any, field: str) -> int | None:
              """Return bounded non-negative provider token metadata or fail closed."""
              if value is None:
                  return None
              if type(value) is not int or value < 0 or value > 100_000_000:
                  raise NoemaModelOutputError(
                      f"Noema LLM response {field} was not a bounded non-negative integer"
                  )
              return value


          def extract_llm_completion(raw: str) -> LLMCompletion:
              """Extract bounded structured completion metadata without reflecting model output."""
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError as exc:
                  raise NoemaModelOutputError(
                      f"Noema LLM response body was not valid JSON: {exc}"
                  ) from exc
              if not isinstance(data, dict):
                  raise NoemaModelOutputError(
                      f"Noema LLM response body was not a JSON object (got {type(data).__name__})"
                  )
              choices = data.get("choices")
              if not choices:
                  choices = [{}]
              elif not isinstance(choices, list):
                  raise NoemaModelOutputError(
                      f"Noema LLM response 'choices' was not a list (got {type(choices).__name__})"
                  )
              first_choice = choices[0]
              if not isinstance(first_choice, dict):
                  raise NoemaModelOutputError(
                      "Noema LLM response choices[0] was not a JSON object "
                      f"(got {type(first_choice).__name__})"
                  )
              message = first_choice.get("message")
              if not message:
                  message = {}
              elif not isinstance(message, dict):
                  raise NoemaModelOutputError(
                      f"Noema LLM response 'message' was not a JSON object (got {type(message).__name__})"
                  )
              content = message.get("content")
              if not content:
                  content = ""
              elif not isinstance(content, str):
                  raise NoemaModelOutputError(
                      f"Noema LLM response 'content' was not a string (got {type(content).__name__})"
                  )

              finish_reason_value = first_choice.get("finish_reason")
              if finish_reason_value is None:
                  finish_reason = ""
              elif not isinstance(finish_reason_value, str):
                  raise NoemaModelOutputError(
                      "Noema LLM response finish_reason was not a string"
                  )
              else:
                  finish_reason = finish_reason_value.strip().lower()
                  if len(finish_reason) > 64 or not re.fullmatch(
                      r"[a-z0-9_-]*", finish_reason
                  ):
                      raise NoemaModelOutputError(
                          "Noema LLM response finish_reason was malformed"
                      )

              model_value = data.get("model")
              if model_value is None:
                  model = ""
              elif not isinstance(model_value, str):
                  raise NoemaModelOutputError(
                      "Noema LLM response model metadata was not a string"
                  )
              else:
                  model = model_value.strip()
                  if len(model) > 256 or any(ord(character) < 32 for character in model):
                      raise NoemaModelOutputError(
                          "Noema LLM response model metadata was malformed"
                      )

              usage_value = data.get("usage")
              if usage_value is None:
                  usage: dict[str, Any] = {}
              elif not isinstance(usage_value, dict):
                  raise NoemaModelOutputError(
                      "Noema LLM response usage metadata was not an object"
                  )
              else:
                  usage = usage_value
              prompt_tokens = _bounded_token_count(
                  usage.get("prompt_tokens", usage.get("input_tokens")), "prompt_tokens"
              )
              completion_tokens = _bounded_token_count(
                  usage.get("completion_tokens", usage.get("output_tokens")),
                  "completion_tokens",
              )
              return LLMCompletion(
                  content=content.strip(),
                  finish_reason=finish_reason,
                  model=model,
                  prompt_tokens=prompt_tokens,
                  completion_tokens=completion_tokens,
              )


          def extract_llm_message_content(raw: str) -> str:
              """Return content from a validated completion envelope."""
              return extract_llm_completion(raw).content
          '''
          start = text.index("def extract_llm_message_content(raw: str) -> str:\n")
          end = text.index("\n\ndef decode_llm_response_body", start)
          text = text[:start] + completion_parser + text[end:]

          compact_prompt = (
              '                "Use request_changes only for blocking, concrete issues. A generic no-issues statement is not review evidence.",\n'
          )
          if "Keep the JSON compact:" not in text:
              replace_once(
                  compact_prompt,
                  compact_prompt
                  + '                "Keep the JSON compact: summary, reviewed-line analysis, probe hypothesis/attack/evidence, residual risk, and finding messages must each stay within 600 characters; use at most 6 reviewed_lines, 4 probes, and 5 findings.",\n',
                  "compact verdict prompt",
              )
          if "Repair mode: emit the smallest complete JSON verdict" not in text:
              replace_once(
                  '                        "Return one corrected JSON verdict using only exact changed-side locations from the supplied diff.",\n',
                  '                        "Return one corrected JSON verdict using only exact changed-side locations from the supplied diff.",\n'
                  '                        "Repair mode: emit the smallest complete JSON verdict that satisfies the schema; prefer one reviewed line, the minimum required probes, and no nonblocking findings.",\n',
                  "compact repair prompt",
              )
          if '"max_completion_tokens": NOEMA_LLM_MAX_COMPLETION_TOKENS' not in text:
              replace_once(
                  '        "temperature": 0,\n        "messages": [\n',
                  '        "temperature": 0,\n'
                  '        "max_completion_tokens": NOEMA_LLM_MAX_COMPLETION_TOKENS,\n'
                  '        "response_format": {"type": "json_object"},\n'
                  '        "messages": [\n',
                  "structured completion request",
              )

          call_start = text.index("def call_llm(")
          parse_start = text.index(
              "            raw = decode_llm_response_body(raw_bytes)\n", call_start
          )
          parse_end_marker = (
              "            validate_substantive_verdict(verdict, diff, changed_paths)\n"
          )
          parse_end = text.index(parse_end_marker, parse_start) + len(parse_end_marker)
          parse_block = '''            raw = decode_llm_response_body(raw_bytes)
            try:
                completion = extract_llm_completion(raw)
            except NoemaModelOutputError as exc:
                raise InvalidCompletionError(
                    "Noema LLM response invalid completion: "
                    + _stable_failure_diagnostic(exc)
                ) from exc
            if completion.finish_reason == "length":
                raise TruncatedCompletionError(
                    "Noema LLM response ended with finish_reason=length"
                )
            if completion.finish_reason not in {"", "stop"}:
                raise InvalidCompletionError(
                    "Noema LLM response invalid completion: unsupported finish reason"
                )
            try:
                verdict = extract_json_object(completion.content)
            except NoemaModelOutputError as exc:
                raise InvalidCompletionError(
                    "Noema LLM response invalid completion: "
                    + _stable_failure_diagnostic(exc)
                ) from exc
            try:
                decision_value = verdict.get("decision")
                if not isinstance(decision_value, str):
                    raise NoemaModelOutputError(
                        "Noema LLM response decision must be a string"
                    )
                decision = decision_value.strip().lower()
                if decision not in {"approve", "request_changes", "comment"}:
                    raise NoemaModelOutputError(
                        "Noema LLM returned an unsupported decision"
                    )
                summary = verdict.get("summary")
                if not isinstance(summary, str) or not summary.strip():
                    raise NoemaModelOutputError(
                        "Noema LLM response did not contain a substantive summary"
                    )
                findings = verdict.get("findings")
                if not isinstance(findings, list) or any(
                    not isinstance(finding, dict) for finding in findings
                ):
                    raise NoemaModelOutputError(
                        "Noema LLM response findings must be a list of objects"
                    )
                for finding in findings:
                    if (
                        finding.get("severity") not in {"high", "medium", "low"}
                        or not isinstance(finding.get("file"), str)
                        or not finding["file"].strip()
                        or type(finding.get("line")) is not int
                        or finding["line"] <= 0
                        or finding.get("side") not in {"RIGHT", "LEFT"}
                        or not isinstance(finding.get("message"), str)
                        or not finding["message"].strip()
                    ):
                        raise NoemaModelOutputError(
                            "Noema LLM response contained a malformed finding"
                        )
                if decision == "request_changes" and not findings:
                    raise NoemaModelOutputError(
                        "Noema LLM request_changes response did not contain a substantive finding"
                    )
                validate_verdict_output_bounds(verdict)
                validate_substantive_verdict(verdict, diff, changed_paths)
            except NoemaModelOutputError as exc:
                raise InvalidVerdictError(
                    "Noema LLM response invalid verdict: "
                    + _stable_failure_diagnostic(exc)
                ) from exc
            except RuntimeError as exc:
                raise InvalidVerdictError(
                    "Noema LLM response invalid verdict: " + str(exc)
                ) from exc
          '''
          text = text[:parse_start] + parse_block + text[parse_end:]

          retry_anchor = "        if is_retry:\n            initial_failure = (\n"
          if "truncated_after_retry" not in text:
              replace_once(
                  retry_anchor,
                  "        if is_retry:\n"
                  "            if isinstance(exc, TruncatedCompletionError):\n"
                  "                raise NoemaModelOutputError(\n"
                  "                    \"Noema LLM response truncated_after_retry: provider again ended the structured completion at its output limit\"\n"
                  "                ) from None\n"
                  "            if isinstance(exc, InvalidCompletionError):\n"
                  "                raise NoemaModelOutputError(\n"
                  "                    \"Noema LLM response invalid_json_after_retry: structured completion remained invalid\"\n"
                  "                ) from None\n"
                  "            if isinstance(exc, InvalidVerdictError):\n"
                  "                raise NoemaModelOutputError(\n"
                  "                    \"Noema LLM response invalid_verdict_after_retry: \"\n"
                  "                    + _stable_failure_diagnostic(exc)\n"
                  "                ) from None\n"
                  "            initial_failure = (\n",
                  "typed retry terminal diagnostics",
              )

          path.write_text(text)
          PY

          # Changelog additions near [Unreleased] conflict frequently with
          # unrelated concurrent entries. Materialize this PR's exact entry
          # idempotently on the live-main text.
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          marker = "- **Recover Noema from provider-truncated structured review completions (`#1596`).**"
          if marker not in text:
              block = """- **Recover Noema from provider-truncated structured review completions (`#1596`).**
            The review client now retains bounded `finish_reason`, model, and token-usage
            metadata from the OpenAI-compatible envelope, requests JSON mode with an
            explicit 4,096-token output budget through Contextual Orchestrator, and
            constrains verdict cardinality and field lengths. A provider-declared
            `finish_reason=length` receives one compact exact-head repair request; a
            repeated length stop fails closed as `truncated_after_retry`, distinct from
            `invalid_json_after_retry`. Raw model output remains absent from public logs.
          """
              insert = text.find("\n", text.find("## [Unreleased]")) + 1
              if insert <= 0:
                  raise SystemExit("CHANGELOG missing [Unreleased] heading")
              text = text[:insert] + block + text[insert:]
              path.write_text(text)
          PY

          python -m pytest -q tests/test_noema_truncated_completion_contract.py
          python -m pytest -q tests/test_noema_*.py
          python -m compileall -q scripts/ci
          git diff --check

          git add CHANGELOG.md scripts/ci/noema_review_gate.py tests/test_noema_truncated_completion_contract.py
          git rm .github/workflows/reconcile-pr1606-current-main.yml
          git diff --cached --check

          # Fail closed if the reconciliation picks up any semantic path other
          # than the PR's exact intended delta plus self-removal.
          mapfile -t changed < <(git diff --cached --name-only HEAD)
          for changed_path in "${changed[@]}"; do
            allowed=false
            for path in "${intended[@]}"; do
              if [ "$changed_path" = "$path" ]; then
                allowed=true
                break
              fi
            done
            if [ "$changed_path" = ".github/workflows/reconcile-pr1606-current-main.yml" ]; then
              allowed=true
            fi
            if [ "$allowed" != true ]; then
              echo "Unexpected semantic path after reconciliation: $changed_path" >&2
              exit 1
            fi
          done

          git commit -m "fix(noema): reconcile truncated verdict recovery with current main"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
