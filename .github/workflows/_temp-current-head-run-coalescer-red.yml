name: Temporary current-head run coalescer RED

on:
  push:
    branches:
      - fix/current-head-run-coalescing-20260902

permissions:
  contents: read

concurrency:
  group: temp-current-head-run-coalescer-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    if: github.event.head_commit.message == 'test(ci): execute current-head coalescer RED'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the new regression fails because implementation is absent
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/current-head-coalescer-red.log"
          set +e
          PYTHONPATH=. python3 -m pytest -q tests/test_current_head_run_coalescer.py >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -eq 0 ]; then
            echo '::error::Expected current-head duplicate coalescing regression to fail before implementation.'
            exit 1
          fi
          if ! grep -Fq 'current-head duplicate coalescer is not implemented' "$log"; then
            echo '::error::RED failed for an unexpected reason.'
            exit 1
          fi
          if grep -Fq 'ERROR collecting' "$log"; then
            echo '::error::RED was a collection/environment failure.'
            exit 1
          fi
          echo "Verified expected behavior-level RED (pytest rc=${rc})."
