name: Temporary current-head run coalescer verification
# execution nonce: 20260902-green-1

on:
  push:
    branches:
      - fix/current-head-run-coalescing-20260902

permissions:
  contents: read

concurrency:
  group: temp-current-head-run-coalescer-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.head_commit.message == 'test(ci): execute current-head coalescer GREEN'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact GREEN head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install repository-declared test toolchain
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
      - name: Verify focused contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q tests/test_current_head_run_coalescer.py
          interrogate --fail-under=100 scripts/ci/current_head_run_coalescer.py
          python3 -m compileall -q scripts/ci/current_head_run_coalescer.py tests/test_current_head_run_coalescer.py
          git diff --check
