name: One-shot tighten stale-pin classifier

on:
  push:
    branches: [fix/strix-python-security-cves]

concurrency:
  group: one-shot-tighten-stale-pin-classifier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/strix-python-security-cves
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'

      - name: Tighten the stale-pin classifier and add counterexamples
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("scripts/ci/install_base_python_locks.py")
          source = source_path.read_text(encoding="utf-8")

          concrete_pattern = '''    # A base lock can pin a version that has since been yanked or that offers no
              # wheel for the pinned coverage-image interpreter. pip proves the index was
              # reachable only when it lists at least one concrete version. Empty lists,
              # ``none``, and unreachable-index diagnostics remain fatal.
              re.compile(
                  r"Could not find a version that satisfies the requirement[^\\n]*"
                  r"\\(from versions:\\s*(?!none\\b)(?=[A-Za-z0-9])[^)\\n]+\\)",
                  re.IGNORECASE,
              ),
          '''
          concrete_pattern = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in concrete_pattern.splitlines()
          ) + "\n"
          if source.count(concrete_pattern) != 1:
              raise SystemExit("expected exactly one broad concrete-version pattern")
          source = source.replace(concrete_pattern, "", 1)

          runner_anchor = ")\nRunner = Callable[..., subprocess.CompletedProcess[str]]\n"
          if source.count(runner_anchor) != 1:
              raise SystemExit("could not locate the classifier constant boundary")
          requirement_patterns = '''
          )
          UNSATISFIED_REQUIREMENT_RE = re.compile(
              r"^ERROR:\\s*Could not find a version that satisfies the requirement "
              r"(?P<requirement>[^\\s(]+)[^\\n]*"
              r"\\(from versions:\\s*(?!none\\b)(?=[A-Za-z0-9])[^)\\n]+\\)",
              re.IGNORECASE | re.MULTILINE,
          )
          NO_MATCHING_DISTRIBUTION_RE = re.compile(
              r"^ERROR:\\s*No matching distribution found for "
              r"(?P<requirement>\\S+)",
              re.IGNORECASE | re.MULTILINE,
          )
          Runner = Callable[..., subprocess.CompletedProcess[str]]
          '''
          requirement_patterns = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in requirement_patterns.splitlines()
          ).lstrip("\n")
          source = source.replace(runner_anchor, requirement_patterns, 1)

          helper_anchor = "def _contains_unclassified_error(output: str) -> bool:\n"
          if source.count(helper_anchor) != 1:
              raise SystemExit("could not locate unclassified-error helper")
          helper = '''
          def _matching_binary_unavailability_requirements(output: str) -> set[str]:
              """Return exact pins paired across pip's binary-unavailability diagnostics."""
              unsatisfied = {
                  match.group("requirement").rstrip(".,")
                  for match in UNSATISFIED_REQUIREMENT_RE.finditer(output)
              }
              unmatched = {
                  match.group("requirement").rstrip(".,")
                  for match in NO_MATCHING_DISTRIBUTION_RE.finditer(output)
              }
              return unsatisfied if unsatisfied and unsatisfied == unmatched else set()


          '''
          helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helper.splitlines()
          ).lstrip("\n")
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          old_unclassified = '''def _contains_unclassified_error(output: str) -> bool:
              """Return whether pip emitted an error outside the deferable contract."""
              for line in output.splitlines():
                  normalized_line = line.strip()
                  if not normalized_line.casefold().startswith("error:"):
                      continue
                  if any(pattern.search(normalized_line) for pattern in DEFERABLE_ERROR_LINES):
                      continue
                  return True
              return False
          '''
          old_unclassified = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_unclassified.splitlines()
          ) + "\n"
          new_unclassified = '''def _contains_unclassified_error(output: str) -> bool:
              """Return whether pip emitted an error outside the deferable contract."""
              matching_requirements = _matching_binary_unavailability_requirements(output)
              for line in output.splitlines():
                  normalized_line = line.strip()
                  if not normalized_line.casefold().startswith("error:"):
                      continue
                  binary_match = UNSATISFIED_REQUIREMENT_RE.search(normalized_line)
                  if binary_match is None:
                      binary_match = NO_MATCHING_DISTRIBUTION_RE.search(normalized_line)
                  if binary_match is not None:
                      requirement = binary_match.group("requirement").rstrip(".,")
                      if requirement in matching_requirements:
                          continue
                      return True
                  if any(pattern.search(normalized_line) for pattern in DEFERABLE_ERROR_LINES):
                      continue
                  return True
              return False
          '''
          new_unclassified = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_unclassified.splitlines()
          ) + "\n"
          if source.count(old_unclassified) != 1:
              raise SystemExit("unclassified-error helper changed unexpectedly")
          source = source.replace(old_unclassified, new_unclassified, 1)

          old_decision = '''        and any(
                      pattern.search(normalized_output)
                      for pattern in DEFERABLE_PREFLIGHT_FAILURES
                  )
          '''
          old_decision = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_decision.splitlines()
          ) + "\n"
          new_decision = '''        and (
                      any(
                          pattern.search(normalized_output)
                          for pattern in DEFERABLE_PREFLIGHT_FAILURES
                      )
                      or bool(
                          _matching_binary_unavailability_requirements(normalized_output)
                      )
                  )
          '''
          new_decision = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_decision.splitlines()
          ) + "\n"
          if source.count(old_decision) != 1:
              raise SystemExit("deferability decision changed unexpectedly")
          source = source.replace(old_decision, new_decision, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_install_base_python_lock_missing_pin.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_mismatched_binary_diagnostics_remain_fatal"
          if marker not in tests:
              tests += '''


def test_atheris_binary_wheel_unavailability_is_deferable(tmp_path: Path) -> None:
    """The real Python 3.14 binary-only diagnostic is a visible skipped lock."""

    output = (
        "ERROR: Could not find a version that satisfies the requirement "
        "atheris==3.0.0 (from versions: 3.1.0)\\n"
        "ERROR: No matching distribution found for atheris==3.0.0"
    )

    result, stdout, stderr = _run_preflight_failure(tmp_path, output)

    assert result == 0
    assert "candidates=1 installed=0 skipped=1" in stdout
    assert "atheris==3.0.0" in stderr


def test_mismatched_binary_diagnostics_remain_fatal(tmp_path: Path) -> None:
    """Two resolver lines for different exact pins cannot authorize deferral."""

    output = (
        "ERROR: Could not find a version that satisfies the requirement "
        "pypdf==6.13.3 (from versions: 6.14.2)\\n"
        "ERROR: No matching distribution found for atheris==3.0.0"
    )

    result, stdout, stderr = _run_preflight_failure(tmp_path, output)

    assert result == 1
    assert "preflight failed" in stderr
    assert "installed=" not in stdout


@pytest.mark.parametrize(
    "output",
    [
        (
            "ERROR: Could not find a version that satisfies the requirement "
            "atheris==3.0.0 (from versions: 3.1.0)"
        ),
        "ERROR: No matching distribution found for atheris==3.0.0",
    ],
)
def test_single_binary_diagnostic_remains_fatal(
    tmp_path: Path,
    output: str,
) -> None:
    """Neither half of pip's binary-unavailability evidence is sufficient alone."""

    result, stdout, stderr = _run_preflight_failure(tmp_path, output)

    assert result == 1
    assert "preflight failed" in stderr
    assert "installed=" not in stdout
'''
          test_path.write_text(tests, encoding="utf-8")

          doctoring_path = Path("docs/doctoring/central-security-and-review-baseline.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          old_decision_text = (
              "   incomplete closures, interpreter incompatibility, or stale pins proven by a\\n"
              "   reachable index; mixed integrity, transport, or unknown errors fail closed."
          )
          new_decision_text = (
              "   incomplete closures, interpreter incompatibility, or binary-unavailable and\\n"
              "   stale pins proven by paired diagnostics for the same exact requirement on a\\n"
              "   reachable index; mixed integrity, transport, or unknown errors fail closed."
          )
          if doctoring.count(old_decision_text) != 1:
              raise SystemExit("doctoring decision text changed unexpectedly")
          doctoring = doctoring.replace(old_decision_text, new_decision_text, 1)
          old_verification_text = (
              "- stale-pin deferral accepts only concrete reachable-index evidence;"
          )
          new_verification_text = (
              "- stale-pin deferral requires concrete reachable-index evidence and matching\\n"
              "  exact-requirement resolver diagnostics;"
          )
          if doctoring.count(old_verification_text) != 1:
              raise SystemExit("doctoring verification text changed unexpectedly")
          doctoring = doctoring.replace(
              old_verification_text,
              new_verification_text,
              1,
          )
          doctoring_path.write_text(doctoring, encoding="utf-8")
          PY

      - name: Install the hash-locked review test toolchain
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r requirements-opencode-review-ci-hashes.txt

      - name: Verify targeted behavior, coverage, docstrings, and full suite
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_install_base_python_locks.py \
            tests/test_install_base_python_lock_missing_pin.py
          python3 -m coverage erase
          python3 -m coverage run --branch -m pytest -q \
            tests/test_install_base_python_locks.py \
            tests/test_install_base_python_lock_missing_pin.py
          python3 -m coverage report \
            --include='scripts/ci/install_base_python_locks.py' \
            --show-missing \
            --fail-under=100
          python3 -m interrogate \
            --fail-under=100 \
            --quiet \
            scripts/ci/install_base_python_locks.py
          python3 -m pytest -q
          git diff --check

      - name: Publish verified canonical changes and remove this workflow
        env:
          BRANCH_NAME: fix/strix-python-security-cves
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-tighten-stale-pin-classifier.yml
          git add \
            scripts/ci/install_base_python_locks.py \
            tests/test_install_base_python_lock_missing_pin.py \
            docs/doctoring/central-security-and-review-baseline.md
          git diff --cached --check
          git config user.name "seonghobae"
          git config user.email "8172694+seonghobae@users.noreply.github.com"
          git commit -m "fix(ci): require matching stale-pin diagnostics"
          git push origin "HEAD:${BRANCH_NAME}"
