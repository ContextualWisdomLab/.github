name: TEMP repair PR 1629 stale sidecar contract

on:
  push:
    branches:
      - fix/no-heuristic-review-admission-current-main

concurrency:
  group: repair-pr1629-stale-sidecar-contract
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.triggering_actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind writer branch to exact triggering head
        run: |
          set -euo pipefail
          writer_ref='refs/heads/fix/no-heuristic-review-admission-current-main'
          remote_head="$(git ls-remote origin "$writer_ref" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install repository-pinned quality tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply stale contract repair
        run: PYTHONPATH=. python scripts/ci/repair_pr1629_stale_sidecar_contract.py

      - name: Remove temporary repair machinery
        run: |
          set -euo pipefail
          rm -f scripts/ci/repair_pr1629_stale_sidecar_contract.py
          rm -f .github/workflows/repair-pr1629-stale-sidecar-contract.yml
          test ! -e scripts/ci/repair_pr1629_stale_sidecar_contract.py
          test ! -e .github/workflows/repair-pr1629-stale-sidecar-contract.yml

      - name: Verify focused false-negative and authority-boundary regressions
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_contextual_orchestrator_review_sidecar_contract.py \
            tests/test_contextual_orchestrator_review_policy.py \
            tests/test_contextual_orchestrator_agent_id_collisions.py \
            tests/test_contextual_orchestrator_central_free_only.py

      - name: Verify full review-policy quality suite
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov=scripts.ci.pr_review_autofix_context \
            --cov=scripts.ci.zdr_policy \
            --cov=scripts.ci.contextual_orchestrator_review_policy \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate --fail-under 100 \
            scripts/ci/pr_review_conflict_scope.py \
            scripts/ci/pr_review_autofix_context.py \
            scripts/ci/zdr_policy.py \
            scripts/ci/contextual_orchestrator_review_policy.py \
            scripts/ci/contextual_orchestrator_review_launcher.py
          git diff --check
          test ! -e scripts/ci/repair_pr1629_stale_sidecar_contract.py
          test ! -e .github/workflows/repair-pr1629-stale-sidecar-contract.yml

      - name: Commit only the verified durable contract repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            tests/test_contextual_orchestrator_review_sidecar_contract.py \
            scripts/ci/repair_pr1629_stale_sidecar_contract.py \
            .github/workflows/repair-pr1629-stale-sidecar-contract.yml
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git diff --cached --name-only | grep -Fx 'tests/test_contextual_orchestrator_review_sidecar_contract.py'
          git commit -m 'test(ci): align sidecar contract with free-only admission'

      - name: Guard and push exact verified head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          writer_branch='fix/no-heuristic-review-admission-current-main'
          writer_ref="refs/heads/${writer_branch}"
          remote_head="$(git ls-remote origin "$writer_ref" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          gh auth setup-git
          git push origin HEAD:"$writer_branch"
