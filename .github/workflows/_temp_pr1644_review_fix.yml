name: PR 1644 one-shot review regression repair

on:
  push:
    branches:
      - fix/ruleset-owner-plane-reconciler
    paths:
      - ".github/workflows/_temp_pr1644_review_fix.yml"

permissions:
  contents: write

concurrency:
  group: pr1644-one-shot-review-regression-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out writer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruleset-owner-plane-reconciler
          fetch-depth: 0
      - name: Apply current review regressions and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/ruleset-owner-plane-reconciler
          git reset --hard origin/fix/ruleset-owner-plane-reconciler
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected one current contract site in {path}: {old!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/test_ruleset_governance_review_regressions.py",
              'with pytest.raises(module.RulesetGovernanceError, match="does not match reviewed mutation"):',
              'with pytest.raises(\n        module.RulesetMutationStillSettlingError,\n        match="latest ruleset history changed before the reviewed mutation became visible",\n    ):',
          )
          replace_once(
              "tests/test_ruleset_governance_timeout_regression.py",
              'with pytest.raises(module.RulesetGovernanceError, match="left a newer state"):',
              'with pytest.raises(\n        module.RulesetGovernanceError,\n        match="ambiguous ruleset recovery PUT outcome remains unresolved after settlement window",\n    ):',
          )
          replace_once(
              "tests/test_ruleset_governance_review_round2.py",
              '        "tests/test_ruleset_governance_review_round2.py",\n        "tests/test_central_required_workflow_ruleset_audit.py",',
              '        "tests/test_ruleset_governance_review_round2.py",\n        "tests/test_ruleset_governance_delayed_recovery_regression.py",\n        "tests/test_ruleset_governance_runtime_budget_regression.py",\n        "tests/test_ruleset_governance_post_put_cleanup_regression.py",\n        "tests/test_central_required_workflow_ruleset_audit.py",',
          )

          timeout_path = Path("tests/test_ruleset_governance_timeout_regression.py")
          timeout_text = timeout_path.read_text(encoding="utf-8")
          old_timeout = '''    put_count = 0
    monkeypatch.setattr(module, "_history_version_state", lambda *_args: displaced)
    monkeypatch.setattr(module, "_assert_current_main", lambda *_args: None)
    monkeypatch.setattr(module.time, "sleep", lambda *_args: None)

    def fake_api(method, endpoint, **_kwargs):
        nonlocal put_count
        if method == "GET":
            return current
        if method == "PUT":
            put_count += 1
            raise subprocess.TimeoutExpired(cmd=["gh", "api"], timeout=30)
        raise AssertionError((method, endpoint))

    monkeypatch.setattr(module, "_gh_api", fake_api)
    monkeypatch.setattr(module, "_gh_api_list", lambda *_args: [{"version_id": 10}])
'''
          new_timeout = '''    put_count = 0
    history_reads = 0
    sleep_calls = 0
    monkeypatch.setattr(module, "_history_version_state", lambda *_args: displaced)
    monkeypatch.setattr(module, "_assert_current_main", lambda *_args: None)

    def fake_sleep(_seconds):
        nonlocal sleep_calls
        sleep_calls += 1

    def fake_api(method, endpoint, **_kwargs):
        nonlocal put_count
        if method == "GET":
            return current
        if method == "PUT":
            put_count += 1
            raise subprocess.TimeoutExpired(cmd=["gh", "api"], timeout=30)
        raise AssertionError((method, endpoint))

    def fake_history(*_args):
        nonlocal history_reads
        history_reads += 1
        return [{"version_id": 10}]

    monkeypatch.setattr(module.time, "sleep", fake_sleep)
    monkeypatch.setattr(module, "_gh_api", fake_api)
    monkeypatch.setattr(module, "_gh_api_list", fake_history)
'''
          if new_timeout not in timeout_text:
              if timeout_text.count(old_timeout) != 1:
                  raise SystemExit("timeout settlement regression shape changed concurrently")
              timeout_text = timeout_text.replace(old_timeout, new_timeout, 1)
          old_assert = '''    assert put_count == 1


def test_recovery_timeout_with_new_version_requires_predecessor'''
          new_assert = '''    assert put_count == 1
    assert history_reads == module.AMBIGUOUS_WRITE_SETTLEMENT_POLLS
    assert sleep_calls == module.AMBIGUOUS_WRITE_SETTLEMENT_POLLS - 1


def test_recovery_timeout_with_new_version_requires_predecessor'''
          if new_assert not in timeout_text:
              if timeout_text.count(old_assert) != 1:
                  raise SystemExit("timeout settlement assertion site changed concurrently")
              timeout_text = timeout_text.replace(old_assert, new_assert, 1)
          timeout_path.write_text(timeout_text, encoding="utf-8")

          delayed_path = Path("tests/test_ruleset_governance_delayed_recovery_regression.py")
          delayed_text = delayed_path.read_text(encoding="utf-8")
          old_delayed = '''    history_reads = 0
    put_count = 0

    monkeypatch.setattr(module, "_assert_current_main", lambda *_args: None)
    monkeypatch.setattr(module.time, "sleep", lambda *_args: None)
    monkeypatch.setattr(module, "_history_version_state", lambda *_args: displaced)
'''
          new_delayed = '''    history_reads = 0
    put_count = 0
    sleep_calls = 0

    monkeypatch.setattr(module, "_assert_current_main", lambda *_args: None)

    def fake_sleep(_seconds):
        nonlocal sleep_calls
        sleep_calls += 1

    monkeypatch.setattr(module.time, "sleep", fake_sleep)
    monkeypatch.setattr(module, "_history_version_state", lambda *_args: displaced)
'''
          if new_delayed not in delayed_text:
              if delayed_text.count(old_delayed) != 1:
                  raise SystemExit("delayed recovery regression shape changed concurrently")
              delayed_text = delayed_text.replace(old_delayed, new_delayed, 1)
          old_delayed_assert = '''    assert history_reads == 2
    assert put_count == 1
'''
          new_delayed_assert = '''    assert history_reads == 2
    assert sleep_calls == 1
    assert put_count == 1
'''
          if new_delayed_assert not in delayed_text:
              if delayed_text.count(old_delayed_assert) != 1:
                  raise SystemExit("delayed recovery assertion site changed concurrently")
              delayed_text = delayed_text.replace(old_delayed_assert, new_delayed_assert, 1)
          delayed_path.write_text(delayed_text, encoding="utf-8")
          PY
          git rm .github/workflows/_temp_pr1644_review_fix.yml
          git diff --check
          git add tests/test_ruleset_governance_review_regressions.py \
                  tests/test_ruleset_governance_timeout_regression.py \
                  tests/test_ruleset_governance_delayed_recovery_regression.py \
                  tests/test_ruleset_governance_review_round2.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(governance): align settlement regression contracts"
          git push origin HEAD:fix/ruleset-owner-plane-reconciler
