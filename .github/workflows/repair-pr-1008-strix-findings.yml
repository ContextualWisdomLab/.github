name: Repair PR 1008 Strix findings

on:
  push:
    branches: [codex/coverage-uv-retry]
    paths:
      - ".github/workflows/repair-pr-1008-strix-findings.yml"

concurrency:
  group: repair-pr-1008-strix-findings
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/coverage-uv-retry
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked test tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Configure repair commit identity
        run: |
          git config user.name "Seongho Bae"
          git config user.email "me@seonghobae.me"

      - name: Add fail-first security regressions
        run: python .github/repair_pr_1008.py tests

      - name: Prove the regressions fail before production changes
        run: |
          set +e
          python -m pytest \
            tests/test_uv_workspace_fail_closed.py::test_true_uv_workspace_fails_before_exporter_bootstrap \
            tests/test_materialize_base_python_requirements.py::test_rejects_symlink_output_directory \
            tests/test_materialize_base_python_requirements.py::test_materialize_rejects_symlink_substitution_during_creation \
            tests/test_materialize_base_python_requirements.py::test_materialize_detects_output_path_replacement_after_open \
            -q
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Security regressions unexpectedly passed before the fix."
            exit 1
          fi

      - name: Record RED security evidence
        run: |
          git add \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_materialize_base_python_requirements.py
          git commit -m "test(ci): reproduce trusted materializer output boundaries"

      - name: Apply bounded production hardening
        run: python .github/repair_pr_1008.py source

      - name: Run focused security regressions
        run: |
          python -m pytest \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_uv_redirect_boundary.py \
            -q

      - name: Run trusted materializer suite with complete branch coverage
        run: |
          cat >"${RUNNER_TEMP}/trusted-uv-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/trusted-uv-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            -q
          python -m coverage report

      - name: Run complete central quality gate
        run: |
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q scripts/ci/materialize_base_python_requirements.py tests
          git diff --check

      - name: Commit verified repair and remove one-shot files
        run: |
          rm \
            .github/repair_pr_1008.py \
            .github/workflows/repair-pr-1008-strix-findings.yml
          git add \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_materialize_base_python_requirements.py \
            .github/repair_pr_1008.py \
            .github/workflows/repair-pr-1008-strix-findings.yml
          git commit -m "fix(ci): harden trusted materializer output boundary"
          git push origin HEAD:codex/coverage-uv-retry
