name: Verify current PR759 reconciliation with protected main

on:
  push:
    branches:
      - tmp/pr759-merge-inspection-20260805c
    paths:
      - .github/workflows/pr759-current-merge-reconciliation.yml

permissions:
  contents: read

concurrency:
  group: pr759-current-main-reconciliation-20260805
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PR_HEAD_SHA: 17aadccac9957e802ec7dd9b62b874e1bc1a10d7
      MAIN_SHA: f070c504c1cb06891b800d7ab0cf6ac7d3cf8eae
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact current PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge exact protected main and resolve only reviewed conflicts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git config user.name merge-inspector
          git config user.email merge-inspector@example.invalid
          git fetch --no-tags origin "$MAIN_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN_SHA"
          set +e
          git merge --no-commit --no-ff "$MAIN_SHA"
          merge_exit=$?
          set -e
          unmerged="$(git diff --name-only --diff-filter=U)"
          expected=$'CHANGELOG.md\nscripts/ci/materialize_base_python_requirements.py'
          test "$merge_exit" -ne 0
          test "$unmerged" = "$expected"
          python3 - <<'PY'
          from pathlib import Path

          def parse_conflicts(text: str) -> tuple[list[str], list[tuple[list[str], list[str]]]]:
              lines = text.splitlines(keepends=True)
              output: list[str] = []
              conflicts: list[tuple[list[str], list[str]]] = []
              index = 0
              while index < len(lines):
                  if not lines[index].startswith("<<<<<<< "):
                      output.append(lines[index])
                      index += 1
                      continue
                  index += 1
                  ours: list[str] = []
                  while index < len(lines) and not lines[index].startswith("======="):
                      ours.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise SystemExit("unterminated conflict before separator")
                  index += 1
                  theirs: list[str] = []
                  while index < len(lines) and not lines[index].startswith(">>>>>>> "):
                      theirs.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise SystemExit("unterminated conflict after separator")
                  index += 1
                  marker = f"__CONFLICT_{len(conflicts)}__\n"
                  output.append(marker)
                  conflicts.append((ours, theirs))
              return output, conflicts

          changelog = Path("CHANGELOG.md")
          skeleton, conflicts = parse_conflicts(changelog.read_text(encoding="utf-8"))
          if len(conflicts) != 2:
              raise SystemExit(f"unexpected changelog conflict count: {len(conflicts)}")
          replacements = [conflicts[0][0], conflicts[1][0] + conflicts[1][1]]
          resolved_parts: list[str] = []
          for line in skeleton:
              if line.startswith("__CONFLICT_"):
                  conflict_index = int(line.removeprefix("__CONFLICT_").removesuffix("__\n"))
                  resolved_parts.extend(replacements[conflict_index])
              else:
                  resolved_parts.append(line)
          resolved_changelog = "".join(resolved_parts)
          required_changelog = (
              "central GitHub control plane",
              "Keep the native Atheris fuzz-engine lock",
              "trusted-uv materializer",
          )
          missing = [item for item in required_changelog if item not in resolved_changelog]
          if missing:
              raise SystemExit(f"changelog resolution lost evidence: {missing}")
          changelog.write_text(resolved_changelog, encoding="utf-8")

          materializer = Path("scripts/ci/materialize_base_python_requirements.py")
          skeleton, conflicts = parse_conflicts(materializer.read_text(encoding="utf-8"))
          if len(conflicts) != 1:
              raise SystemExit(f"unexpected materializer conflict count: {len(conflicts)}")
          combined = conflicts[0][0] + conflicts[0][1]
          resolved_parts = []
          for line in skeleton:
              if line.startswith("__CONFLICT_"):
                  resolved_parts.extend(combined)
              else:
                  resolved_parts.append(line)
          resolved_materializer = "".join(resolved_parts)
          required_materializer = (
              'NATIVE_FUZZ_ENGINE_LOCK_NAMES = frozenset({"requirements-atheris.txt"})',
              'TRUSTED_UV_VERSION = "0.12.1"',
              "_publish_coverage_failure_summary",
          )
          missing = [item for item in required_materializer if item not in resolved_materializer]
          if missing:
              raise SystemExit(f"materializer resolution lost contracts: {missing}")
          if any(marker in resolved_materializer for marker in ("<<<<<<<", "=======", ">>>>>>>")):
              raise SystemExit("materializer conflict markers remain")
          materializer.write_text(resolved_materializer, encoding="utf-8")
          PY
          git add CHANGELOG.md scripts/ci/materialize_base_python_requirements.py
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install merged hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify merged diagnostics, uv, native-fuzz, LLVM, and Strix contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_coverage_native_fuzz_lock_boundary.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_strix_dependency_security_floor.py \
            tests/test_opencode_libclang_toolchain_contract.py \
            --cov=scripts.ci.coverage_failure_summary \
            --cov=scripts.ci.materialize_base_javascript_packages \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov=scripts.ci.sanitize_github_output_summary \
            --cov-branch \
            --cov-fail-under=100 \
            -q
          python -m pytest -q \
            tests/test_strix_model_utils_source_dirs.py \
            tests/test_opencode_agent_contract.py \
            tests/test_strix_nvidia_nim_not_found_fallback.py
          python -m interrogate --fail-under 100 \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m compileall -q scripts/ci tests
          bash -n scripts/ci/strix_model_utils.sh scripts/ci/strix_quick_gate.sh scripts/ci/test_strix_quick_gate.sh
          git diff --cached --check

      - name: Upload exact current resolved files
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pr759-current-resolved-files-${{ github.sha }}
          path: |
            CHANGELOG.md
            scripts/ci/materialize_base_python_requirements.py
          if-no-files-found: error
          retention-days: 1
