name: Finalize PR 787 Review Findings

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-pr787-review-findings.yml"
      - "scripts/ci/finalize_pr787_review_findings.py"
      - "scripts/ci/repair_pr787_finalizer_source.py"

concurrency:
  group: finalize-pr787-review-findings-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PUSH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt
      - name: Install exact hash-locked tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt
      - name: Apply deterministic repairs and remove transient writer
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          python3 scripts/ci/repair_pr787_finalizer_source.py
          python3 scripts/ci/finalize_pr787_review_findings.py
          rm -f \
            .github/workflows/finalize-pr787-review-findings.yml \
            scripts/ci/finalize_pr787_review_findings.py \
            scripts/ci/repair_pr787_finalizer_source.py
      - name: Verify complete suite, focused coverage, docs, and syntax
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/agent_mention_router.py
              scripts/ci/agent_mention_sweep.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate --fail-under=100 \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py
          python -m compileall -q scripts/ci tests
          git diff --check
          test ! -e .github/workflows/finalize-pr787-review-findings.yml
          test ! -e scripts/ci/finalize_pr787_review_findings.py
          test ! -e scripts/ci/repair_pr787_finalizer_source.py
      - name: Commit and push verified non-workflow final state
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::The workflow GITHUB_TOKEN is required for the verified final-state commit."
            exit 1
          fi
          git checkout "$TARGET_HEAD_SHA" -- \
            .github/workflows/agent-mention-noema-dispatch.yml \
            .github/workflows/agent-mention-opencode-dispatch.yml \
            .github/workflows/agent-mention-router.yml \
            .github/workflows/agent-mention-router-quality-ci.yml \
            .github/workflows/finalize-pr787-review-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(automation): close mention-router runtime findings"
          askpass="$(mktemp)"
          cat >"$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$PUSH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 0700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push origin HEAD:feat/review-agent-mention-router-main
          rm -f "$askpass"
