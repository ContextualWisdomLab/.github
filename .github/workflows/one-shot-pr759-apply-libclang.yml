name: One-shot PR759 apply libclang repair

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/one-shot-pr759-apply-libclang.yml

permissions:
  contents: read

concurrency:
  group: one-shot-pr759-apply-libclang-repair
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.actor == 'seonghobae'
      && github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate one-file trigger delta and prove RED contract
        env:
          EXPECTED_PARENT_SHA: 760b9485d27de09c333ee238f977aeb1384f66e1
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-shot-pr759-apply-libclang.yml"
          test -f scripts/ci/apply_pr759_libclang_final.py
          set +e
          python3 -I - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/opencode-review-dispatch.yml').read_text(encoding='utf-8')
          assert '              libclang-19-dev ' + chr(92) in workflow
          assert 'ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib' in workflow
          assert 'find "$LIBCLANG_PATH" -maxdepth 1' in workflow
          assert "-name 'libclang.so*'" in workflow
          PY
          red_status=$?
          set -e
          test "$red_status" -ne 0

      - name: Apply deterministic reviewed repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 scripts/ci/apply_pr759_libclang_final.py
          git diff --check

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify permanent quality, compatibility, and security contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_coverage_native_fuzz_lock_boundary.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_opencode_libclang_toolchain_contract.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_strix_dependency_security_floor.py \
            --cov=scripts.ci.coverage_failure_summary \
            --cov=scripts.ci.materialize_base_javascript_packages \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov=scripts.ci.sanitize_github_output_summary \
            --cov-branch \
            --cov-fail-under=100 \
            -q
          python -m pytest -q \
            tests/test_strix_model_utils_source_dirs.py \
            tests/test_opencode_agent_contract.py
          python -m interrogate --fail-under 100 \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m compileall -q scripts/ci tests
          bash -n scripts/ci/strix_model_utils.sh scripts/ci/strix_quick_gate.sh scripts/ci/test_strix_quick_gate.sh
          git diff --check

      - name: Verify matching libclang package in the pinned base image
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          probe_dir="$(mktemp -d)"
          cat >"$probe_dir/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/library/python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update \
            && apt-get install --no-install-recommends -y libclang-19-dev llvm-19 \
            && rm -rf /var/lib/apt/lists/*
          ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib
          ENV LLVM_COV=/usr/bin/llvm-cov-19
          ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19
          RUN test -d "$LIBCLANG_PATH" \
            && find "$LIBCLANG_PATH" -maxdepth 1 \( -type f -o -type l \) -name 'libclang.so*' -print -quit | grep -q . \
            && test -x "$LLVM_COV" \
            && test -x "$LLVM_PROFDATA"
          DOCKERFILE
          docker build --pull --no-cache --tag pr759-libclang-probe "$probe_dir"
          rm -rf "$probe_dir"

      - name: Remove one-shot sources and publish verified permanent tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: fix/opencode-coverage-failure-diagnostics
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm scripts/ci/apply_pr759_libclang_final.py
          rm .github/workflows/one-shot-pr759-apply-libclang.yml
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(coverage): provision libclang for Rust bindgen'
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
