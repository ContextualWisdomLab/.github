name: Temporary Strix auto gateway patch

on:
  push:
    branches:
      - fix/strix-auto-orchestrator-loopback

permissions:
  contents: write

concurrency:
  group: temporary-strix-auto-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: fix/strix-auto-orchestrator-loopback

      - name: Prove regression and apply minimal production fix
        shell: bash
        run: |
          set -euo pipefail

          set +e
          python tests/test_strix_openai_fallback_api_base.py -v > /tmp/strix-auto-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/strix-auto-red.log
          if [ "$red_rc" -eq 0 ]; then
            echo 'Expected the new auto-pool regression contract to fail before the production fix.' >&2
            exit 1
          fi
          grep -q 'test_gateway_child_model_preserves_selected_virtual_pool' /tmp/strix-auto-red.log
          grep -q 'test_workflow_gateway_base_is_the_only_http_exception' /tmp/strix-auto-red.log

          python - <<'PY'
          from pathlib import Path

          gate_path = Path("scripts/ci/strix_quick_gate.sh")
          workflow_path = Path(".github/workflows/_agent-patch-strix-auto.yml")
          source = gate_path.read_text(encoding="utf-8")

          old_classifier = "\n".join(
              [
                  "is_contextual_orchestrator_model() {",
                  '\tcase "$1" in',
                  "\torchestrator/free | contextual-orchestrator/orchestrator/free)",
                  "\t\treturn 0",
                  "\t\t;;",
                  "\t*)",
                  "\t\treturn 1",
                  "\t\t;;",
                  "\tesac",
                  "}",
              ]
          ) + "\n"
          new_classifier = "\n".join(
              [
                  "is_contextual_orchestrator_model() {",
                  '\tcase "$1" in',
                  "\torchestrator/free | contextual-orchestrator/orchestrator/free | " + "\\",
                  "\t\torchestrator/auto | contextual-orchestrator/orchestrator/auto)",
                  "\t\treturn 0",
                  "\t\t;;",
                  "\t*)",
                  "\t\treturn 1",
                  "\t\t;;",
                  "\tesac",
                  "}",
              ]
          ) + "\n"

          old_child = "\n".join(
              [
                  "\t# LiteLLM requires an explicit provider prefix even when the gateway is an",
                  "\t# OpenAI-compatible local endpoint. Keep the public gateway model name, but",
                  "\t# qualify only the child process model so the request still carries",
                  "\t# orchestrator/free to contextual-orchestrator.",
                  '\tif is_contextual_orchestrator_model "$model" &&',
                  '\t\tis_contextual_orchestrator_api_base "$llm_api_base_value"; then',
                  "\t\tprintf '%s\\n' 'openai/orchestrator/free'",
                  "\t\treturn 0",
                  "\tfi",
              ]
          ) + "\n"
          new_child = "\n".join(
              [
                  "\t# LiteLLM requires an explicit provider prefix even when the gateway is an",
                  "\t# OpenAI-compatible local endpoint. Strip only the connector-facing alias so",
                  "\t# the selected orchestrator/free or orchestrator/auto virtual pool reaches",
                  "\t# contextual-orchestrator unchanged.",
                  '\tif is_contextual_orchestrator_model "$model" &&',
                  '\t\tis_contextual_orchestrator_api_base "$llm_api_base_value"; then',
                  "\t\tlocal contextual_orchestrator_model",
                  '\t\tcontextual_orchestrator_model="${model#contextual-orchestrator/}"',
                  "\t\tprintf 'openai/%s\\n' \"$contextual_orchestrator_model\"",
                  "\t\treturn 0",
                  "\tfi",
              ]
          ) + "\n"

          if source.count(old_classifier) != 1:
              raise SystemExit("expected exactly one legacy contextual-orchestrator classifier")
          if source.count(old_child) != 1:
              raise SystemExit("expected exactly one legacy contextual-orchestrator child-model block")

          source = source.replace(old_classifier, new_classifier, 1)
          source = source.replace(old_child, new_child, 1)
          gate_path.write_text(source, encoding="utf-8")
          workflow_path.unlink()
          PY

          python tests/test_strix_openai_fallback_api_base.py -v
          bash -n scripts/ci/strix_quick_gate.sh
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix(strix): preserve auto orchestrator gateway route'
          git push origin HEAD:"$GITHUB_REF_NAME"
