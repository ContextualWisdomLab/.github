name: One-shot PR 759 centralize coverage failure summary

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/one-shot-pr759-centralize-coverage-failure-summary.yml

concurrency:
  group: one-shot-pr759-centralize-coverage-failure-summary
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Apply bounded central-summary repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I - <<'PY'
          from pathlib import Path

          files = (
              Path("scripts/ci/materialize_base_javascript_packages.py"),
              Path("scripts/ci/materialize_base_python_requirements.py"),
          )
          for path in files:
              content = path.read_text(encoding="utf-8")
              if "def _publish_coverage_failure_summary(" not in content:
                  raise SystemExit(f"missing local publisher in {path}")
              content = content.replace("import html\n", "", 1)
              content = content.replace("import os\n", "", 1)
              import_anchor = "from typing import Any\n" if "javascript" in path.name else "import tempfile\n"
              shared_import = (
                  f"{import_anchor}\n"
                  "if __package__ in (None, \"\"):\n"
                  "    sys.path.insert(0, str(pathlib.Path(__file__).resolve().parents[2]))\n\n"
                  "from scripts.ci.coverage_failure_summary import (\n"
                  "    publish_coverage_failure_summary,\n"
                  ")\n"
              )
              if content.count(import_anchor) != 1:
                  raise SystemExit(f"unexpected import anchor count in {path}")
              content = content.replace(import_anchor, shared_import, 1)
              start = content.index("\ndef _publish_coverage_failure_summary(")
              end = content.index("\ndef main(", start)
              content = content[:start] + "\n" + content[end:]
              content = content.replace(
                  "_publish_coverage_failure_summary(",
                  "publish_coverage_failure_summary(",
              )
              path.write_text(content, encoding="utf-8")

          Path(
              ".github/workflows/one-shot-pr759-centralize-coverage-failure-summary.yml"
          ).unlink()
          PY
          python -m pip install --disable-pip-version-check --require-hashes \
            -r requirements-opencode-review-ci-hashes.txt
          python -m pytest \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_strix_dependency_security_floor.py \
            --cov=scripts.ci.coverage_failure_summary \
            --cov=scripts.ci.materialize_base_javascript_packages \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov=scripts.ci.sanitize_github_output_summary \
            --cov-branch \
            --cov-fail-under=100 \
            -q
          python -m compileall -q scripts/ci
          git diff --check

      - name: Commit verified repair and remove one-shot workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(opencode-review): centralize safe coverage failure evidence"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
