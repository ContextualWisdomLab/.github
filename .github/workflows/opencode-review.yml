name: Required OpenCode Review
run-name: >-
  Required OpenCode Review ${{ github.event.pull_request.base.repo.full_name ||
  github.repository }}#${{ github.event.pull_request.number || 'event' }}@${{
  github.event.pull_request.head.sha || github.sha }}

on:
  # This required-workflow entrypoint never checks out or executes pull-request
  # content and never binds repository secrets. Privileged review execution is
  # isolated in opencode-review-dispatch.yml on repository_dispatch only.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: >-
    opencode-review-bootstrap-${{
    github.event.pull_request.base.repo.full_name || github.repository }}-${{
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  required-workflow-bootstrap:
    name: required-workflow-bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Materialize the required review workflow
        run: >-
          echo "Required OpenCode workflow materialized without checking out or
          executing pull-request content."

  coverage-source-tree:
    name: coverage-source-tree
    needs: [required-workflow-bootstrap]
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "PR-head source and coverage execution are delegated to the
          authenticated default-branch OpenCode review dispatch."

  coverage-evidence:
    name: coverage-evidence
    needs: [coverage-source-tree]
    runs-on: ubuntu-latest
    steps:
      - run: >-
          echo "This required-workflow job preserves the stable branch-protection
          context without executing pull-request content."

  opencode-review-target:
    name: opencode-review
    needs: [coverage-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify current-head formal OpenCode review receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAGER: cat
          TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_ACTION: ${{ github.event.action }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          echo "Review approval remains a separate current-head PR review requirement produced by the authenticated dispatch workflow."
          if [ "${EVENT_ACTION:-}" = "closed" ] || [ -z "${PR_NUMBER:-}" ]; then
            echo "No open pull request receipt is required for this event."
            exit 0
          fi
          if ! [[ "$TARGET_REPOSITORY" =~ ^ContextualWisdomLab/[A-Za-z0-9_.-]+$ ]] ||
            ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
            ! [[ "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]] ||
            ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Required OpenCode receipt gate rejected malformed live pull request or workflow identity."
            exit 1
          fi
          trusted_archive="${RUNNER_TEMP:-/tmp}/trusted-opencode-source.tar.gz"
          api_url="${GITHUB_API_URL:-https://api.github.com}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o "$trusted_archive" \
            "${api_url}/repos/ContextualWisdomLab/.github/tarball/${WORKFLOW_SHA}"
          tar -xzf "$trusted_archive" -C "${GITHUB_WORKSPACE:-.}" --strip-components=1
          test -f scripts/ci/opencode_review_receipt_gate.py
          draft_args=()
          if [ "${IS_DRAFT:-false}" = "true" ]; then
            draft_args=(--draft)
          fi
          python3 scripts/ci/opencode_review_receipt_gate.py \
            --repo "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$EXPECTED_HEAD" \
            "${draft_args[@]}"
