name: Source fix PR1672 no-heuristic probes

on:
  push:
    branches:
      - fix/noema-repair-attempt-telemetry
    paths:
      - .github/workflows/source-fix-pr1672-no-heuristic-probes.yml
      - scripts/ci/source_fix_pr1672_no_heuristic_probe_allocation.py
      - tests/test_noema_no_heuristic_probe_allocation.py
      - .github/source-fix-pr1672-no-heuristic-probes.trigger

concurrency:
  group: source-fix-pr1672-no-heuristic-probes-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/noema-repair-attempt-telemetry'
    runs-on: ubuntu-slim
    timeout-minutes: 75
    steps:
      - name: Checkout exact source-fix head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install hash-locked review dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
      - name: Prove the current production rule violates the new contract
        run: |
          set -euo pipefail
          if PYTHONPATH=. python -m pytest tests/test_noema_no_heuristic_probe_allocation.py -q; then
            echo 'Expected the no-heuristic regression to fail before the production repair.' >&2
            exit 1
          fi
      - name: Materialize the owner-side repair
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          python scripts/ci/source_fix_pr1672_no_heuristic_probe_allocation.py
          rm .github/workflows/source-fix-pr1672-no-heuristic-probes.yml
          rm scripts/ci/source_fix_pr1672_no_heuristic_probe_allocation.py
          rm -f .github/source-fix-pr1672-no-heuristic-probes.trigger
          ! grep -q 'changed_file_is_material' scripts/ci/noema_review_gate.py
          ! grep -q 'source or test changes require at least two distinct probes' scripts/ci/noema_review_gate.py
          git diff --check
      - name: Verify focused contracts after repair
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest \
            tests/test_noema_no_heuristic_probe_allocation.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_noema_model_output_failure_classification.py \
            tests/test_noema_review_gate.py -q
          python -m compileall -q scripts tests
          git diff --check

  publish:
    needs: verify
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/noema-repair-attempt-telemetry'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact verified source-fix head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install hash-locked review dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
      - name: Re-materialize and verify exact publish candidate
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          python scripts/ci/source_fix_pr1672_no_heuristic_probe_allocation.py
          rm .github/workflows/source-fix-pr1672-no-heuristic-probes.yml
          rm scripts/ci/source_fix_pr1672_no_heuristic_probe_allocation.py
          rm -f .github/source-fix-pr1672-no-heuristic-probes.trigger
          PYTHONPATH=. python -m pytest \
            tests/test_noema_no_heuristic_probe_allocation.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_noema_model_output_failure_classification.py \
            tests/test_noema_review_gate.py -q
          python -m compileall -q scripts tests
          git diff --check
      - name: Publish one non-destructive successor
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_PUSH_TOKEN"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(noema): replace heuristic probe allocation with exhaustive scope"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
