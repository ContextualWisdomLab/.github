name: One-shot LineageWeave OpenCode route repair

on:
  push:
    branches:
      - fix/required-review-fail-closed-without-verdict

permissions:
  contents: read

concurrency:
  group: one-shot-lineageweave-opencode-route-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair LineageWeave OpenCode route
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/required-review-fail-closed-without-verdict
          fetch-depth: 0

      - name: Install test tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'pytest>=8.0.0' \
            'pytest-cov>=7.1.0' \
            'coverage[toml]>=7.8.0' \
            'interrogate>=1.7.0'

      - name: Add the route regression contract
        run: |
          set -euo pipefail
          cat > tests/test_lineageweave_opencode_route.py <<'PY'
          """Regression contract for the LineageWeave central review route."""

          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          VARIABLE_EXPRESSION = "$" + "{{ vars.OPENCODE_REPOSITORY_DISPATCH_TARGETS }}"
          LINEAGEWEAVE_SUFFIX = ",ContextualWisdomLab/LineageWeave"
          ROUTE_VALUE = VARIABLE_EXPRESSION + LINEAGEWEAVE_SUFFIX


          def test_lineageweave_is_in_every_central_opencode_route() -> None:
              """Keep LineageWeave routable when the mutable repository variable drifts."""

              router = (
                  ROOT / ".github" / "workflows" / "agent-mention-router.yml"
              ).read_text(encoding="utf-8")
              scheduler = (
                  ROOT / ".github" / "workflows" / "pr-review-merge-scheduler.yml"
              ).read_text(encoding="utf-8")
              opencode = (
                  ROOT / ".github" / "workflows" / "opencode-review-dispatch.yml"
              ).read_text(encoding="utf-8")

              assert router.count(
                  "OPENCODE_REPOSITORY_DISPATCH_TARGETS: " + ROUTE_VALUE
              ) == 2
              assert (
                  "ALLOWED_TARGET_REPOSITORIES: " + ROUTE_VALUE
              ) in scheduler
              assert "ALLOWED_DISPATCH_TARGETS: " + ROUTE_VALUE in opencode
          PY

      - name: Prove the route contract is RED
        run: |
          set -euo pipefail
          set +e
          python -m pytest tests/test_lineageweave_opencode_route.py \
            >/tmp/lineageweave-route-red.log 2>&1
          status=$?
          set -e
          cat /tmp/lineageweave-route-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::The LineageWeave route regression unexpectedly passed before implementation."
            exit 1
          fi

      - name: Add a source-controlled LineageWeave routing floor
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expression = "$" + "{{ vars.OPENCODE_REPOSITORY_DISPATCH_TARGETS }}"
          suffix = ",ContextualWisdomLab/LineageWeave"
          route = expression + suffix

          replacements = {
              Path(".github/workflows/agent-mention-router.yml"): (
                  "OPENCODE_REPOSITORY_DISPATCH_TARGETS: " + expression,
                  "OPENCODE_REPOSITORY_DISPATCH_TARGETS: " + route,
                  2,
              ),
              Path(".github/workflows/pr-review-merge-scheduler.yml"): (
                  "ALLOWED_TARGET_REPOSITORIES: " + expression,
                  "ALLOWED_TARGET_REPOSITORIES: " + route,
                  1,
              ),
              Path(".github/workflows/opencode-review-dispatch.yml"): (
                  "ALLOWED_DISPATCH_TARGETS: " + expression,
                  "ALLOWED_DISPATCH_TARGETS: " + route,
                  1,
              ),
          }
          for path, (old, new, expected_count) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != expected_count:
                  raise SystemExit(
                      f"{path} route marker count changed: "
                      f"expected {expected_count}, found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Fixed\n\n"
          entry = (
              "- LineageWeave is now retained in the source-controlled exact "
              "OpenCode dispatch allowlist floor, so mutable repository-variable "
              "drift cannot silently suppress its central review route.\n"
          )
          if marker not in changelog:
              raise SystemExit("CHANGELOG Fixed marker changed")
          if entry not in changelog:
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          doctoring_path = Path(
              "docs/doctoring/required-review-check-is-not-a-verdict.md"
          )
          doctoring = doctoring_path.read_text(encoding="utf-8")
          marker = "## Verification contract\n"
          section = '''## LineageWeave route contract

          The mutable `OPENCODE_REPOSITORY_DISPATCH_TARGETS` variable remains the
          organization-managed allowlist, but LineageWeave is appended as a
          source-controlled exact routing floor in the comment router, scheduler,
          and privileged OpenCode dispatch validator. This prevents a missing UI
          variable entry from silently converting a valid review request into a
          non-event while retaining exact repository matching.

          '''
          if marker not in doctoring:
              raise SystemExit("doctoring verification marker changed")
          if section not in doctoring:
              doctoring = doctoring.replace(marker, section + marker, 1)
          doctoring_path.write_text(doctoring, encoding="utf-8")
          PY

      - name: Verify focused and repository-wide quality gates
        run: |
          set -euo pipefail
          python -m pytest tests/test_lineageweave_opencode_route.py
          python -m coverage erase
          python -m coverage run -m pytest tests
          python -m coverage report --show-missing
          python -m interrogate -c pyproject.toml scripts/ci
          python -m compileall -q scripts tests

      - name: Remove one-shot workflow and publish verified repair
        run: |
          set -euo pipefail
          rm .github/workflows/repair-lineageweave-opencode-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/agent-mention-router.yml \
            .github/workflows/pr-review-merge-scheduler.yml \
            .github/workflows/opencode-review-dispatch.yml \
            tests/test_lineageweave_opencode_route.py \
            docs/doctoring/required-review-check-is-not-a-verdict.md \
            CHANGELOG.md \
            .github/workflows/repair-lineageweave-opencode-route.yml
          git diff --cached --check
          git commit -m "fix(review): retain LineageWeave in central dispatch routes"
          git push origin HEAD:fix/required-review-fail-closed-without-verdict
