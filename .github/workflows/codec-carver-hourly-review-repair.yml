name: Codec-Carver Hourly Review Repair

on:
  schedule:
    # Minute 5 avoids Clearfolio (23), DiskSage (37), fast-mlsirm (49),
    # BandScope (53), naruon (11), Inkspan (47), orchestrator (17),
    # Wardnet (7), and Keyverse (29).
    - cron: "5 * * * *"

concurrency:
  group: codec-carver-hourly-review-repair
  # A later heartbeat must not cancel an in-flight STT/codec RCA or repair.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-review-repair:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-review-fix-scheduler.yml
    with:
      target_repository: ContextualWisdomLab/codec-carver
      base_branch: main
      max_prs: "50"
      max_dispatches: "1"
      retry_hours: "2"
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
