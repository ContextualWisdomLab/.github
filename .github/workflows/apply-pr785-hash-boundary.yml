name: Apply PR 785 hash boundary

on:
  push:
    branches: [fix/coverage-materialize-requirements-directory-locks]
    paths:
      - ".github/pr785-hash-boundary.trigger"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/coverage-materialize-requirements-directory-locks'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply fail-closed global directive repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/ci/materialize_base_python_requirements.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''    lines = _requirement_lines(content)
    if not lines:
        return False
    return any(line == "--require-hashes" for line in lines) or all(
        "--hash=" in line or line.startswith(("-r ", "--requirement "))
        for line in lines
    )
'''
          new = '''    lines = _requirement_lines(content)
    requirement_lines = [line for line in lines if line != "--require-hashes"]
    if not requirement_lines:
        return False
    return all(
        "--hash=" in line or line.startswith(("-r ", "--requirement "))
        for line in requirement_lines
    )
'''
          if source.count(old) != 1:
              raise SystemExit('hash classifier anchor changed')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          doctoring = Path('docs/doctoring/trusted-requirements-directory-lock-discovery.md')
          text = doctoring.read_text(encoding='utf-8')
          sentence = (
              'A global `--require-hashes` directive is not trust evidence by itself; '
              'every non-directive logical requirement must still carry an inline hash '
              'or a bounded requirement include.\n\n'
          )
          anchor = 'The path rule grants candidate status only. '
          if sentence not in text:
              if anchor not in text:
                  raise SystemExit('doctoring anchor changed')
              doctoring.write_text(text.replace(anchor, sentence + anchor, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = (
              '- Reject requirement candidates where a global `--require-hashes` directive '
              'coexists with an unpinned logical requirement.\n'
          )
          if entry not in text:
              anchor = '### Fixed\n\n'
              if anchor not in text:
                  raise SystemExit('changelog anchor changed')
              changelog.write_text(text.replace(anchor, anchor + entry, 1), encoding='utf-8')
          PY
          rm -f \
            .github/workflows/apply-pr785-hash-boundary.yml \
            .github/pr785-hash-boundary.trigger
          git diff --check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify regression and complete tests
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q \
            tests/test_requirements_directory_lock_materialization.py::test_rejects_global_hash_directive_with_unpinned_requirement
          python -m pytest -q tests
          python -m compileall -q scripts/ci/materialize_base_python_requirements.py tests/test_requirements_directory_lock_materialization.py
          git diff --check

      - name: Publish verified source repair
        env:
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          TARGET_BRANCH: fix/coverage-materialize-requirements-directory-locks
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test -n "${PUSH_TOKEN:-}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(coverage): reject unpinned global-hash locks"
          echo "::add-mask::$PUSH_TOKEN"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
