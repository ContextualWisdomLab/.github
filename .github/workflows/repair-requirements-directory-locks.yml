name: Repair requirements-directory lock discovery

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: repair-requirements-directory-locks
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.number == 785 &&
      github.event.pull_request.head.ref == 'fix/coverage-materialize-requirements-directory-locks'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact RED lineage and bounded setup delta
        env:
          RED_CONTRACT_SHA: 8344a2b2e24d6952fe2442e68b9ee514cb1d7ee8
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "${RED_CONTRACT_SHA}^{commit}"
          git merge-base --is-ancestor "$RED_CONTRACT_SHA" "$EXPECTED_HEAD"
          mapfile -t changed_paths < <(git diff --name-only "$RED_CONTRACT_SHA" "$EXPECTED_HEAD" | sort)
          expected_paths=(
            ".github/workflows/repair-requirements-directory-locks.yml"
            "scripts/ci/apply_requirements_directory_lock_repair.py"
          )
          test "${#changed_paths[@]}" -eq "${#expected_paths[@]}"
          for index in "${!expected_paths[@]}"; do
            test "${changed_paths[$index]}" = "${expected_paths[$index]}"
          done

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Preserve the genuine failing contract
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          python -m pytest -q tests/test_requirements_directory_lock_materialization.py \
            >"${RUNNER_TEMP}/requirements-directory-red.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/requirements-directory-red.log"
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected a genuine pytest assertion failure (exit 1), observed ${status}."
            exit 1
          fi
          grep -F '_is_candidate_lock_path' "${RUNNER_TEMP}/requirements-directory-red.log"

      - name: Apply the reviewed permanent repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/ci/apply_requirements_directory_lock_repair.py
          git diff --check

      - name: Run focused and complete quality gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/requirements-directory-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/requirements-directory-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_requirements_directory_lock_materialization.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py
          python -m coverage report --fail-under=100
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run --branch -m pytest tests -q
          python -m coverage report --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_requirements_directory_lock_materialization.py
          test ! -e .github/workflows/reopen-requirements-directory-locks.yml
          test ! -e .github/workflows/repair-requirements-directory-locks.yml
          test ! -e scripts/ci/apply_requirements_directory_lock_repair.py
          git diff --check

      - name: Publish immutable verified blob receipt
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: fix/coverage-materialize-requirements-directory-locks
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr785-repair-receipt.txt"
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = 'ContextualWisdomLab/.github'
          expected_head = os.environ['EXPECTED_HEAD']
          token = os.environ['API_TOKEN']
          api_root = f'https://api.github.com/repos/{repository}'

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cwl-pr785-blob-receipt',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          parent = request('GET', f'/git/commits/{expected_head}')
          print(f"REPAIR_PARENT_SHA={expected_head}")
          print(f"REPAIR_PARENT_TREE_SHA={parent['tree']['sha']}")
          for label, path in (
              ('MATERIALIZER', 'scripts/ci/materialize_base_python_requirements.py'),
              ('QUALITY_WORKFLOW', '.github/workflows/trusted-uv-materializer-quality-ci.yml'),
              ('DOCTORING', 'docs/doctoring/trusted-requirements-directory-lock-discovery.md'),
              ('CHANGELOG', 'CHANGELOG.md'),
          ):
              encoded = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = request('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              print(f"REPAIR_{label}_BLOB_SHA={blob['sha']}")
          print('REPAIR_DELETE_PATH=.github/workflows/repair-requirements-directory-locks.yml')
          print('REPAIR_DELETE_PATH=scripts/ci/apply_requirements_directory_lock_repair.py')
          PY

      - name: Upload exact-head repair receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr785-exact-head-repair
          path: ${{ runner.temp }}/pr785-repair-receipt.txt
          if-no-files-found: error
          retention-days: 5
