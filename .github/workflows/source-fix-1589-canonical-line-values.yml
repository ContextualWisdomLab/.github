name: One-shot PR 1589 canonical review line repair

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-canonical-line-values.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.sha == '24685ffccc87447f62f713cba9dd43c9049fbb61'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Patch canonical review locations, verify, and retire writer
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/noema_review_gate.py")
          text = path.read_text(encoding="utf-8")

          marker = '''return value.removeprefix(prefix)\n\n\n\ndef _validate_observed_probe_class_evidence(\n'''
          replacement = '''return value.removeprefix(prefix)\n\n\n\ndef _canonical_review_location(\n    record: dict[str, Any], *, path_key: str = "path"\n) -> tuple[str, int, str] | None:\n    """Return one canonical changed-side location without bool/int coercion."""\n    path_value = record.get(path_key)\n    line_value = record.get("line")\n    side_value = record.get("side")\n    if (\n        not isinstance(path_value, str)\n        or not path_value\n        or type(line_value) is not int\n        or line_value <= 0\n        or side_value not in {"LEFT", "RIGHT"}\n    ):\n        return None\n    return (path_value, line_value, side_value)\n\n\ndef _validate_observed_probe_class_evidence(\n'''
          if text.count(marker) != 1:
              raise SystemExit("canonical-location insertion point changed unexpectedly")
          text = text.replace(marker, replacement, 1)

          old = '''        source_ref = class_evidence.get(field)\n        if not isinstance(source_ref, dict) or set(source_ref) != {"path", "line", "side"}:\n            raise RuntimeError(\n                f"Noema adversarial probe {index} class_evidence.{field} requires a "\n                "source-bound changed-line reference"\n            )\n        if source_ref != expected_ref:\n            raise RuntimeError(\n                f"Noema adversarial probe {index} class_evidence.{field} must bind to "\n                "the probe location"\n            )\n'''
          new = '''        source_ref = class_evidence.get(field)\n        if not isinstance(source_ref, dict) or set(source_ref) != {"path", "line", "side"}:\n            raise RuntimeError(\n                f"Noema adversarial probe {index} class_evidence.{field} requires a "\n                "source-bound changed-line reference"\n            )\n        canonical_ref = _canonical_review_location(source_ref)\n        if canonical_ref is None:\n            raise RuntimeError(\n                f"Noema adversarial probe {index} class_evidence.{field} requires a "\n                "canonical positive-integer changed-line reference"\n            )\n        if canonical_ref != location:\n            raise RuntimeError(\n                f"Noema adversarial probe {index} class_evidence.{field} must bind to "\n                "the probe location"\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit("class-evidence location validator changed unexpectedly")
          text = text.replace(old, new, 1)
          text = text.replace('    expected_ref = {"path": location[0], "line": location[1], "side": location[2]}\n', '', 1)

          old = '''        location = (reviewed.get("path"), reviewed.get("line"), reviewed.get("side"))\n        if location not in locations:\n            raise RuntimeError(f"Noema reviewed line {index} is not an exact changed-side line")\n'''
          new = '''        location = _canonical_review_location(reviewed)\n        if location is None or location not in locations:\n            raise RuntimeError(f"Noema reviewed line {index} is not an exact changed-side line")\n'''
          if text.count(old) != 1:
              raise SystemExit("reviewed-line location validation changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''        location = (probe.get("path"), probe.get("line"), probe.get("side"))\n        if location not in locations:\n            raise RuntimeError(f"Noema adversarial probe {index} is not an exact changed-side line")\n'''
          new = '''        location = _canonical_review_location(probe)\n        if location is None or location not in locations:\n            raise RuntimeError(f"Noema adversarial probe {index} is not an exact changed-side line")\n'''
          if text.count(old) != 1:
              raise SystemExit("probe location validation changed unexpectedly")
          text = text.replace(old, new, 1)
          text = text.replace(
              '            confirmed.add((str(probe["path"]), int(probe["line"]), str(probe["side"])))\n',
              '            confirmed.add(location)\n',
              1,
          )

          old = '''        finding_locations = {\n            (str(finding.get("file") or ""), finding.get("line"), str(finding.get("side") or ""))\n            for finding in verdict.get("findings") or []\n            if isinstance(finding, dict)\n        }\n'''
          new = '''        finding_locations = {\n            location\n            for finding in verdict.get("findings") or []\n            if isinstance(finding, dict)\n            for location in [_canonical_review_location(finding, path_key="file")]\n            if location is not None\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit("finding location validation changed unexpectedly")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          tests = Path("tests/test_noema_probe_source_binding.py")
          test_text = tests.read_text(encoding="utf-8")
          addition = '''\n\n@pytest.mark.parametrize("bad_line", [True, False])\ndef test_boolean_reviewed_line_coordinates_fail_closed(bad_line: bool) -> None:\n    """JSON booleans must never coerce to changed-line integers."""\n    verdict = _verdict(\n        {field: _source_ref(1) for field in gate.OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS["mutable_alias"]},\n        {field: _source_ref(10) for field in gate.OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS["execution_identity"]},\n    )\n    verdict["reviewed_lines"][0]["line"] = bad_line\n    with pytest.raises(RuntimeError, match="exact changed-side line"):\n        gate.validate_substantive_verdict(verdict, DIFF, ["tool.py"])\n\n\n@pytest.mark.parametrize("bad_line", [True, False])\ndef test_boolean_probe_coordinates_fail_closed(bad_line: bool) -> None:\n    """Probe coordinates require canonical positive JSON integers."""\n    verdict = _verdict(\n        {field: _source_ref(1) for field in gate.OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS["mutable_alias"]},\n        {field: _source_ref(10) for field in gate.OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS["execution_identity"]},\n    )\n    verdict["adversarial_validation"]["probes"][0]["line"] = bad_line\n    with pytest.raises(RuntimeError, match="exact changed-side line"):\n        gate.validate_substantive_verdict(verdict, DIFF, ["tool.py"])\n\n\n@pytest.mark.parametrize("bad_line", [True, False])\ndef test_boolean_class_evidence_coordinates_fail_closed(bad_line: bool) -> None:\n    """Class witnesses cannot exploit bool/int equality at changed line one."""\n    first = {field: _source_ref(1) for field in gate.OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS["mutable_alias"]}\n    second = {field: _source_ref(10) for field in gate.OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS["execution_identity"]}\n    first["alias_origin"]["line"] = bad_line\n    with pytest.raises(RuntimeError, match="canonical positive-integer"):\n        gate.validate_substantive_verdict(_verdict(first, second), DIFF, ["tool.py"])\n'''
          if "test_boolean_reviewed_line_coordinates_fail_closed" in test_text:
              raise SystemExit("boolean-coordinate regressions already exist")
          tests.write_text(test_text + addition, encoding="utf-8")
          PY

          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
          unset GH_TOKEN
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_probe_source_binding.py \
            tests/test_noema_observed_defect_probe_taxonomy.py \
            tests/test_noema_review_gate.py
          interrogate --fail-under=100 scripts/ci/noema_review_gate.py
          python3 -m compileall -q scripts/ci tests
          git diff --check

          git rm .github/workflows/source-fix-1589-canonical-line-values.yml
          git add scripts/ci/noema_review_gate.py tests/test_noema_probe_source_binding.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(noema): reject non-canonical review line values"
          git push origin "HEAD:${TARGET_BRANCH}"
