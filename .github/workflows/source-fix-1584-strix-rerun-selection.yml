name: One-shot PR 1584 Strix rerun selector repair

on:
  push:
    branches:
      - fix/strix-rerun-select-scan-20260901
    paths:
      - .github/workflows/source-fix-1584-strix-rerun-selection.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Apply focused repair, verify, and retire workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/strix-rerun-select-scan-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/pr_review_merge_scheduler.py")
          text = path.read_text(encoding="utf-8")
          old = '''def dispatch_strix_evidence(repo: str, workflow: str, pr: dict[str, Any], *, dry_run: bool) -> str:
              """Dispatch same-head Strix workflow evidence before OpenCode reviews."""
              job_id = matching_actions_job_id(pr, is_strix_context)
          '''.replace("          ", "")
          new = '''def is_strix_scan_check_run(node: dict[str, Any]) -> bool:
              """Return whether a check run is the authoritative Strix scan job."""
              return (
                  node.get("__typename") == "CheckRun"
                  and node.get("name") == "strix"
                  and is_strix_context(node)
              )


          def dispatch_strix_evidence(repo: str, workflow: str, pr: dict[str, Any], *, dry_run: bool) -> str:
              """Dispatch same-head Strix workflow evidence before OpenCode reviews."""
              job_id = matching_actions_job_id(pr, is_strix_scan_check_run)
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected exactly one Strix dispatch block, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python3 - <<'PY'
          from scripts.ci import pr_review_merge_scheduler as sched

          def strix_job(name: str, job_id: int, conclusion: str) -> dict:
              return {
                  "__typename": "CheckRun",
                  "name": name,
                  "status": "COMPLETED",
                  "conclusion": conclusion,
                  "startedAt": "2026-08-30T05:24:23Z",
                  "detailsUrl": (
                      "https://github.com/ContextualWisdomLab/bandscope/"
                      f"actions/runs/33294403831/job/{job_id}"
                  ),
                  "checkSuite": {
                      "createdAt": "2026-08-30T05:22:18Z",
                      "workflowRun": {"workflow": {"name": "Strix Security Scan"}},
                  },
              }

          scan = strix_job("strix", 99212031836, "FAILURE")
          publisher = strix_job(
              "publish-manual-pr-evidence-status", 99212677006, "SKIPPED"
          )
          assert sched.is_strix_context(scan)
          assert sched.is_strix_context(publisher)
          assert sched.is_strix_scan_check_run(scan)
          assert not sched.is_strix_scan_check_run(publisher)

          pr = {
              "number": 1055,
              "statusCheckRollup": {"contexts": {"nodes": [scan, publisher]}},
          }
          reruns = []

          def record_rerun(repo: str, job_id: str, *, dry_run: bool, action: str) -> None:
              reruns.append((repo, job_id, action))

          sched.rerun_actions_job = record_rerun
          assert (
              sched.dispatch_strix_evidence(
                  "ContextualWisdomLab/bandscope",
                  "Strix Security Scan",
                  pr,
                  dry_run=False,
              )
              == "rerun"
          )
          assert reruns == [
              (
                  "ContextualWisdomLab/bandscope",
                  "99212031836",
                  "rerun-strix-evidence",
              )
          ]
          PY
          python3 scripts/ci/pr_review_merge_scheduler.py --self-test
          git diff --check

          git rm .github/workflows/source-fix-1584-strix-rerun-selection.yml
          git add scripts/ci/pr_review_merge_scheduler.py tests/test_strix_rerun_job_selection.py
          git diff --cached --check
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(scheduler): rerun authoritative Strix scan job"
          git push origin "HEAD:${TARGET_BRANCH}"
