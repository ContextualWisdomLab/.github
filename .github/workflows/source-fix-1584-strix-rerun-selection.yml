name: One-shot PR 1584 Strix rerun selector repair

on:
  push:
    branches:
      - fix/strix-rerun-select-scan-20260901
    paths:
      - .github/workflows/source-fix-1584-strix-rerun-selection.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install exact hash-verified test runner dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/source-fix-quality-requirements.txt" <<'EOF'
          coverage==7.15.2 --hash=sha256:b9a6367e4aff723e8ee8190836836124284e8fcd4265e307c844010cfa074f3f
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          EOF
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r "${RUNNER_TEMP}/source-fix-quality-requirements.txt"

      - name: Apply focused repair, verify, and retire workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/strix-rerun-select-scan-20260901
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/pr_review_merge_scheduler.py")
          text = path.read_text(encoding="utf-8")
          old = "    job_id = matching_actions_job_id(pr, is_strix_context)\n"
          new = (
              "    job_id = matching_actions_job_id(\n"
              "        pr, lambda node: node.get(\"name\") == \"strix\" and is_strix_context(node)\n"
              "    )\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Strix rerun selector, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          python -m pytest -q \
            tests/test_strix_rerun_job_selection.py \
            tests/test_pr_review_merge_scheduler.py
          python scripts/ci/pr_review_merge_scheduler.py --self-test
          git diff --check

          git rm .github/workflows/source-fix-1584-strix-rerun-selection.yml
          git add scripts/ci/pr_review_merge_scheduler.py tests/test_strix_rerun_job_selection.py
          git diff --cached --check
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(scheduler): rerun authoritative Strix scan job"
          git push origin "HEAD:${TARGET_BRANCH}"
