name: Temporary PR 1672 deadline repair

on:
  push:
    branches:
      - fix/noema-repair-attempt-telemetry
    paths:
      - .github/workflows/_temp_pr1672_reviewer_green.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Materialize fixed-deadline GREEN
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import ast
          import re

          source_path = Path("scripts/ci/noema_review_gate.py")
          source = source_path.read_text()
          source = source.replace("import contextlib\n", "", 1).replace("import signal\n", "", 1)
          source, count = re.subn(
              r"# NOT DATA-DERIVED -- UNRESOLVED, flagged for an explicit owner decision\.\n.*?NOEMA_REPAIR_DEADLINE_SECONDS = 15 \* 60\n\n",
              "# Noema owns corrective-request cardinality, not provider/model wall-clock policy.\n# Repair inference duration/failover belongs to contextual-orchestrator.\n\n",
              source,
              count=1,
              flags=re.DOTALL,
          )
          assert count == 1
          source = source.replace(
              "\n\nclass NoemaRepairDeadlineExceeded(TimeoutError):\n    \"\"\"Raised when the corrective attempt exceeds its total wall-clock budget.\"\"\"\n",
              "",
              1,
          )
          source, count = re.subn(
              r"@contextlib\.contextmanager\ndef _repair_wall_clock_deadline\(seconds: float\):\n.*?\n\nclass StaleHeadDuringRepairRetryError",
              "class StaleHeadDuringRepairRetryError",
              source,
              count=1,
              flags=re.DOTALL,
          )
          assert count == 1
          source = source.replace(
              "    if isinstance(exc, NoemaRepairDeadlineExceeded):\n        return \"deadline_exceeded\"\n",
              "",
              1,
          )
          source = source.replace(
              "    Order matters: ``NoemaRepairDeadlineExceeded`` is itself a\n    ``TimeoutError``/``OSError`` subclass, so it is checked before the\n    broader transport-error class -- otherwise every deadline-exceeded\n    attempt would misreport as an ordinary transport error and the\n    telemetry this classifies for would lose the one distinction the\n    original bare \"900-second timeout\" message could not make.\n",
              "    The classification is caller-observed evidence only; provider/model\n    inference timeout policy belongs to contextual-orchestrator.\n",
              1,
          )
          old = '''    try:\n        deadline_context = (\n            _repair_wall_clock_deadline(NOEMA_REPAIR_DEADLINE_SECONDS)\n            if is_retry\n            else contextlib.nullcontext()\n        )\n        with deadline_context:\n            with opener.open(request) as response:  # nosec B310\n                phase_reached = \"reading\"\n                raw_bytes = response.read()\n            phase_reached = \"decoding\"\n            raw = decode_llm_response_body(raw_bytes)\n            served_model = _extract_served_model(raw)\n            content = extract_llm_message_content(raw)\n            verdict = extract_json_object(content)\n            phase_reached = \"validating\"\n            decision = str(verdict.get(\"decision\") or \"\").strip().lower()\n            if decision not in {\"approve\", \"request_changes\", \"comment\"}:\n                raise NoemaModelOutputError(f\"Noema LLM returned unsupported decision: {decision!r}\")\n            summary = verdict.get(\"summary\")\n            if not isinstance(summary, str) or not summary.strip():\n                raise NoemaModelOutputError(\"Noema LLM response did not contain a substantive summary\")\n            findings = verdict.get(\"findings\")\n            if not isinstance(findings, list) or any(not isinstance(finding, dict) for finding in findings):\n                raise NoemaModelOutputError(\"Noema LLM response findings must be a list of objects\")\n            for finding in findings:\n                if (\n                    finding.get(\"severity\") not in {\"high\", \"medium\", \"low\"}\n                    or not isinstance(finding.get(\"file\"), str)\n                    or not finding[\"file\"].strip()\n                    or type(finding.get(\"line\")) is not int\n                    or finding[\"line\"] <= 0\n                    or finding.get(\"side\") not in {\"RIGHT\", \"LEFT\"}\n                    or not isinstance(finding.get(\"message\"), str)\n                    or not finding[\"message\"].strip()\n                ):\n                    raise NoemaModelOutputError(\"Noema LLM response contained a malformed finding\")\n            if decision == \"request_changes\" and not findings:\n                raise NoemaModelOutputError(\"Noema LLM request_changes response did not contain a substantive finding\")\n            validate_substantive_verdict(verdict, diff, changed_paths)\n'''
          new = '''    try:\n        with opener.open(request) as response:  # nosec B310\n            phase_reached = \"reading\"\n            raw_bytes = response.read()\n        phase_reached = \"decoding\"\n        raw = decode_llm_response_body(raw_bytes)\n        served_model = _extract_served_model(raw)\n        content = extract_llm_message_content(raw)\n        verdict = extract_json_object(content)\n        phase_reached = \"validating\"\n        decision = str(verdict.get(\"decision\") or \"\").strip().lower()\n        if decision not in {\"approve\", \"request_changes\", \"comment\"}:\n            raise NoemaModelOutputError(f\"Noema LLM returned unsupported decision: {decision!r}\")\n        summary = verdict.get(\"summary\")\n        if not isinstance(summary, str) or not summary.strip():\n            raise NoemaModelOutputError(\"Noema LLM response did not contain a substantive summary\")\n        findings = verdict.get(\"findings\")\n        if not isinstance(findings, list) or any(not isinstance(finding, dict) for finding in findings):\n            raise NoemaModelOutputError(\"Noema LLM response findings must be a list of objects\")\n        for finding in findings:\n            if (\n                finding.get(\"severity\") not in {\"high\", \"medium\", \"low\"}\n                or not isinstance(finding.get(\"file\"), str)\n                or not finding[\"file\"].strip()\n                or type(finding.get(\"line\")) is not int\n                or finding[\"line\"] <= 0\n                or finding.get(\"side\") not in {\"RIGHT\", \"LEFT\"}\n                or not isinstance(finding.get(\"message\"), str)\n                or not finding[\"message\"].strip()\n            ):\n                raise NoemaModelOutputError(\"Noema LLM response contained a malformed finding\")\n        if decision == \"request_changes\" and not findings:\n            raise NoemaModelOutputError(\"Noema LLM request_changes response did not contain a substantive finding\")\n        validate_substantive_verdict(verdict, diff, changed_paths)\n'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          source = source.replace(
              "                f\"deadline={NOEMA_REPAIR_DEADLINE_SECONDS:g}s \"\n",
              "",
              1,
          )
          source = source.replace(
              "            f\"({current_failure}); starting one bounded repair attempt \"\n            f\"(deadline={NOEMA_REPAIR_DEADLINE_SECONDS:g}s).\"\n",
              "            f\"({current_failure}); starting one corrective repair attempt.\"\n",
              1,
          )
          for forbidden in ("NOEMA_REPAIR_DEADLINE_SECONDS", "NoemaRepairDeadlineExceeded", "_repair_wall_clock_deadline", "setitimer"):
              assert forbidden not in source, forbidden
          ast.parse(source)
          source_path.write_text(source)

          def remove_functions(path: Path, names: set[str]) -> None:
              text = path.read_text()
              tree = ast.parse(text)
              spans = [
                  (node.lineno, node.end_lineno or node.lineno)
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names
              ]
              lines = text.splitlines(keepends=True)
              for start, end in sorted(spans, reverse=True):
                  del lines[start - 1:end]
              path.write_text("".join(lines))

          telemetry = Path("tests/test_noema_repair_attempt_telemetry.py")
          text = telemetry.read_text().replace("import signal\n", "").replace("import time\n", "")
          text = text.replace("        (gate.NoemaRepairDeadlineExceeded(\"exceeded\"), \"deadline_exceeded\"),\n", "", 1)
          telemetry.write_text(text)
          remove_functions(telemetry, {"test_repair_deadline_exceeded_emits_full_attempt_breakdown"})

          classification = Path("tests/test_noema_model_output_failure_classification.py")
          remove_functions(classification, {
              "test_total_repair_wall_clock_deadline_interrupts_slow_read",
              "test_repair_wall_clock_deadline_defensive_fail_closed_paths",
              "test_repair_wall_clock_deadline_refuses_existing_process_alarm",
              "test_repair_wall_clock_deadline_rejects_non_main_thread_signal_context",
              "test_repair_deadline_rejects_nonpositive_budget",
              "test_repair_deadline_requires_setitimer",
              "test_repair_deadline_requires_itimer_real",
          })
          classification_text = classification.read_text()
          classification_text, removed = re.subn(
              r"\n\n@pytest\.mark\.parametrize\(\"timer_state\".*?(?=\n\ndef )",
              "",
              classification_text,
              flags=re.DOTALL,
          )
          classification.write_text(classification_text)

          Path("tests/test_noema_repair_deadline_alarm_safety.py").write_text(
              '"""Noema owns corrective-request cardinality, not inference timeouts."""\n\n'
              'import ast\nfrom pathlib import Path\n\n'
              'def test_noema_has_no_fixed_repair_deadline() -> None:\n'
              '    source = Path("scripts/ci/noema_review_gate.py").read_text()\n'
              '    tree = ast.parse(source)\n'
              '    names = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.ClassDef))}\n'
              '    assigned = {target.id for node in ast.walk(tree) if isinstance(node, ast.Assign) for target in node.targets if isinstance(target, ast.Name)}\n'
              '    assert "_repair_wall_clock_deadline" not in names\n'
              '    assert "NoemaRepairDeadlineExceeded" not in names\n'
              '    assert "NOEMA_REPAIR_DEADLINE_SECONDS" not in assigned\n'
              '    assert not any(isinstance(node, ast.Attribute) and node.attr == "setitimer" for node in ast.walk(tree))\n'
          )

          for path, marker, note in (
              (
                  Path("docs/product-technical-gap-baseline.md"),
                  "Noema corrective-request timeout authority",
                  "\n\n### 2026-09-02 — Noema corrective-request timeout authority\n\nNoema now owns exactly one corrective request but no guessed model-inference wall-clock deadline. Provider/model timeout and failover policy remain with `contextual-orchestrator`; exact attempt duration and phase telemetry stay reviewer evidence.\n",
              ),
              (
                  Path("docs/doctoring/noema-repair-attempt-telemetry.md"),
                  "current-head timeout authority",
                  "\n\n## 2026-09-02 current-head timeout authority\n\nThe caller-owned 900-second repair alarm was removed rather than replaced by another unmeasured number. Noema still permits exactly one corrective request; model/provider latency policy is delegated to `contextual-orchestrator`.\n",
              ),
          ):
              doc = path.read_text()
              if marker not in doc:
                  path.write_text(doc.rstrip() + note)
          PY

      - name: Install pinned review CI dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Verify deadline ownership repair
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_noema_model_output_failure_classification.py \
            tests/test_noema_repair_deadline_alarm_safety.py \
            tests/test_noema_review_gate.py
          python3 -m compileall -q scripts/ci/noema_review_gate.py tests/test_noema_repair_attempt_telemetry.py tests/test_noema_model_output_failure_classification.py tests/test_noema_repair_deadline_alarm_safety.py
          git diff --check

      - name: Retire temporary workflow and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: fix/noema-repair-attempt-telemetry
          WORKFLOW_PATH: .github/workflows/_temp_pr1672_reviewer_green.yml
        run: |
          set -euo pipefail
          rm "$WORKFLOW_PATH"
          test -z "$(find .github scripts/ci -type f -name '*temp_pr1672*' -print -quit)"
          git add -A
          git config user.name "CWL repair automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(noema): remove caller-owned repair deadline"
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | cut -f1)"
          test "$remote_head" = "${{ github.sha }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/ContextualWisdomLab/.github.git"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
