name: Temporary PR 1672 reviewer green

on:
  push:
    branches:
      - fix/noema-repair-attempt-telemetry
    paths:
      - .github/workflows/_temp_pr1672_reviewer_green.yml

permissions:
  contents: write

concurrency:
  group: temp-pr1672-reviewer-green
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Guard canonical one-shot input
        env:
          EXPECTED_PARENT: 6f2c9360417173959a875bb5f4e1365cc5dbb9cb
          WORKFLOW_PATH: .github/workflows/_temp_pr1672_reviewer_green.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_PATH"

      - name: Materialize production and regression GREEN
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import ast
          import re

          source_path = Path("scripts/ci/noema_review_gate.py")
          telemetry_path = Path("tests/test_noema_repair_attempt_telemetry.py")
          classification_path = Path("tests/test_noema_model_output_failure_classification.py")
          deadline_test_path = Path("tests/test_noema_repair_deadline_alarm_safety.py")
          baseline_path = Path("docs/product-technical-gap-baseline.md")
          doctoring_path = Path("docs/doctoring/noema-repair-attempt-telemetry.md")

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, *, label: str) -> str:
              updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {count}")
              return updated

          source = source_path.read_text()
          source = replace_once(source, "import contextlib\n", "", label="remove contextlib import")
          source = replace_once(source, "import signal\n", "", label="remove signal import")
          source = regex_once(
              source,
              r"# NOT DATA-DERIVED -- UNRESOLVED, flagged for an explicit owner decision\.\n.*?NOEMA_REPAIR_DEADLINE_SECONDS = 15 \* 60\n\n",
              "# Noema owns corrective-request cardinality, not provider/model wall-clock policy.\n# Repair inference duration/failover belongs to contextual-orchestrator.\n\n",
              label="remove caller-owned fixed repair deadline",
          )
          source = replace_once(
              source,
              "\n\nclass NoemaRepairDeadlineExceeded(TimeoutError):\n    \"\"\"Raised when the corrective attempt exceeds its total wall-clock budget.\"\"\"\n",
              "",
              label="remove deadline exception",
          )

          helper_block = '''\n\ndef _entry_ordinal(position: int, total: int) -> str:\n    \"\"\"Return an unambiguous array-position label for a validated JSON entry.\"\"\"\n    return f\"entry {position}/{total} (array index {position - 1}, not a source line)\"\n\n\ndef _format_location(path: Any, line: Any, side: Any) -> str:\n    \"\"\"Format one rejected path/line/side citation for repair diagnostics.\"\"\"\n    return f\"path={path!r} line={line!r} side={side!r}\"\n\n\ndef _nearby_changed_locations(\n    locations: set[tuple[str, int, str]], path: Any, line: Any, *, limit: int = 5\n) -> str:\n    \"\"\"Return a bounded nearest-line hint for the rejected citation's path.\"\"\"\n    if not isinstance(path, str):\n        return \"\"\n    same_path = [location for location in locations if location[0] == path]\n    if not same_path:\n        return \"\"\n    if isinstance(line, int):\n        same_path.sort(key=lambda location: (abs(location[1] - line), location[1], location[2]))\n    else:\n        same_path.sort(key=lambda location: (location[1], location[2]))\n    sample = \", \".join(f\"{p}:{ln} ({s})\" for p, ln, s in same_path[:limit])\n    remaining = len(same_path) - limit\n    more = f\", +{remaining} more\" if remaining > 0 else \"\"\n    return f\"; nearest changed lines for {path}: {sample}{more}\"\n'''
          source = replace_once(
              source,
              "\n\ndef validate_substantive_verdict(\n",
              helper_block + "\n\ndef validate_substantive_verdict(\n",
              label="restore citation diagnostic helpers",
          )
          source = replace_once(
              source,
              '''    for index, reviewed in enumerate(reviewed_lines, start=1):\n        if not isinstance(reviewed, dict):\n            raise NoemaModelOutputError(f\"Noema reviewed line {index} must be an object\")\n        location = (reviewed.get(\"path\"), reviewed.get(\"line\"), reviewed.get(\"side\"))\n        if location not in locations:\n            raise NoemaModelOutputError(f\"Noema reviewed line {index} is not an exact changed-side line\")\n        analysis = reviewed.get(\"analysis\")\n        if not isinstance(analysis, str) or not analysis.strip():\n            raise NoemaModelOutputError(f\"Noema reviewed line {index} requires concrete analysis\")\n''',
              '''    reviewed_total = len(reviewed_lines)\n    for position, reviewed in enumerate(reviewed_lines, start=1):\n        entry = _entry_ordinal(position, reviewed_total)\n        if not isinstance(reviewed, dict):\n            raise NoemaModelOutputError(f\"Noema reviewed line {entry} must be an object\")\n        location = (reviewed.get(\"path\"), reviewed.get(\"line\"), reviewed.get(\"side\"))\n        if location not in locations:\n            path, line, side = location\n            raise NoemaModelOutputError(\n                f\"Noema reviewed line {entry} cites {_format_location(path, line, side)}, \"\n                f\"which is not an exact changed-side line\"\n                f\"{_nearby_changed_locations(locations, path, line)}\"\n            )\n        analysis = reviewed.get(\"analysis\")\n        if not isinstance(analysis, str) or not analysis.strip():\n            raise NoemaModelOutputError(f\"Noema reviewed line {entry} requires concrete analysis\")\n''',
              label="restore reviewed-line diagnostics",
          )
          source = replace_once(
              source,
              '''    for index, probe in enumerate(probes, start=1):\n        if not isinstance(probe, dict):\n            raise NoemaModelOutputError(f\"Noema adversarial probe {index} must be an object\")\n        location = (probe.get(\"path\"), probe.get(\"line\"), probe.get(\"side\"))\n        if location not in locations:\n            raise NoemaModelOutputError(f\"Noema adversarial probe {index} is not an exact changed-side line\")\n        for field in (\"hypothesis\", \"attack_or_counterexample\", \"evidence\"):\n            value = probe.get(field)\n            if not isinstance(value, str) or not value.strip():\n                raise NoemaModelOutputError(f\"Noema adversarial probe {index} requires {field}\")\n        outcome = probe.get(\"outcome\")\n        if outcome not in {\"falsified\", \"confirmed\"}:\n            raise NoemaModelOutputError(f\"Noema adversarial probe {index} outcome must be falsified or confirmed\")\n        identity = (*location, probe[\"hypothesis\"].strip().casefold(), probe[\"attack_or_counterexample\"].strip().casefold())\n        if identity in identities:\n            raise NoemaModelOutputError(f\"Noema adversarial probe {index} duplicates an earlier probe\")\n''',
              '''    probes_total = len(probes)\n    for position, probe in enumerate(probes, start=1):\n        entry = _entry_ordinal(position, probes_total)\n        if not isinstance(probe, dict):\n            raise NoemaModelOutputError(f\"Noema adversarial probe {entry} must be an object\")\n        location = (probe.get(\"path\"), probe.get(\"line\"), probe.get(\"side\"))\n        if location not in locations:\n            path, line, side = location\n            raise NoemaModelOutputError(\n                f\"Noema adversarial probe {entry} cites {_format_location(path, line, side)}, \"\n                f\"which is not an exact changed-side line\"\n                f\"{_nearby_changed_locations(locations, path, line)}\"\n            )\n        for field in (\"hypothesis\", \"attack_or_counterexample\", \"evidence\"):\n            value = probe.get(field)\n            if not isinstance(value, str) or not value.strip():\n                raise NoemaModelOutputError(f\"Noema adversarial probe {entry} requires {field}\")\n        outcome = probe.get(\"outcome\")\n        if outcome not in {\"falsified\", \"confirmed\"}:\n            raise NoemaModelOutputError(f\"Noema adversarial probe {entry} outcome must be falsified or confirmed\")\n        identity = (*location, probe[\"hypothesis\"].strip().casefold(), probe[\"attack_or_counterexample\"].strip().casefold())\n        if identity in identities:\n            raise NoemaModelOutputError(f\"Noema adversarial probe {entry} duplicates an earlier probe\")\n''',
              label="restore adversarial-probe diagnostics",
          )

          parser = '''def _strip_trailing_commas_outside_strings(text: str) -> str:\n    \"\"\"Remove only genuine trailing commas after complete JSON values.\n\n    Missing-value forms such as ``[,]``, ``{,}``, ``[1,,]``, and\n    ``{\"a\":,}`` remain malformed. The scan records removal offsets rather\n    than one Python object per character, avoiding memory amplification on\n    large malformed responses.\n    \"\"\"\n    removals: list[int] = []\n    in_string = False\n    escaped = False\n    length = len(text)\n    for index, char in enumerate(text):\n        if in_string:\n            if escaped:\n                escaped = False\n            elif char == \"\\\\\":\n                escaped = True\n            elif char == '\"':\n                in_string = False\n            continue\n        if char == '\"':\n            in_string = True\n            continue\n        if char != \",\":\n            continue\n        lookahead = index + 1\n        while lookahead < length and text[lookahead] in \" \\t\\r\\n\":\n            lookahead += 1\n        if lookahead >= length or text[lookahead] not in \"}]\":\n            continue\n        previous = index - 1\n        while previous >= 0 and text[previous] in \" \\t\\r\\n\":\n            previous -= 1\n        if previous < 0 or text[previous] in \"[{,:\":\n            continue\n        removals.append(index)\n    if not removals:\n        return text\n    pieces: list[str] = []\n    start = 0\n    for index in removals:\n        pieces.append(text[start:index])\n        start = index + 1\n    pieces.append(text[start:])\n    return \"\".join(pieces)\n\n\n'''
          source = regex_once(
              source,
              r"def _strip_trailing_commas_outside_strings\(text: str\) -> str:\n.*?\n\ndef extract_json_object\(",
              parser + "def extract_json_object(",
              label="replace trailing-comma repair",
          )
          source = replace_once(
              source,
              '''        verdict = _extract_json_object_once(repaired)\n        print(\n            \"::notice::Noema local trailing-comma JSON repair recovered an \"\n            \"otherwise-malformed response; no network repair retry was needed.\"\n        )\n        return verdict\n''',
              '''        return _extract_json_object_once(repaired)\n''',
              label="remove duplicate local-repair annotation",
          )
          source = source.replace(
              "and it emits a ``::notice::`` (no raw content) when it is what\n    actually rescued the response, since that is itself useful repair-path\n    telemetry. It does not attempt to guess-repair any other malformation\n",
              "without emitting a second Actions annotation; the enclosing attempt's\n    single success/failure annotation remains the telemetry authority. It does\n    not attempt to guess-repair any other malformation\n",
          )

          safe_model = '''def _extract_served_model(raw: str) -> str | None:\n    \"\"\"Best-effort read of an annotation-safe serving-model identifier.\n\n    The top-level model value is untrusted gateway output. Secrets are\n    scrubbed before JSON-string escaping; escaping makes lone surrogates,\n    newlines, carriage returns, and controls printable on one Actions log\n    line. The final escaped value is bounded after expansion.\n    \"\"\"\n    try:\n        data = json.loads(raw)\n    except (json.JSONDecodeError, TypeError, ValueError):\n        return None\n    if not isinstance(data, dict):\n        return None\n    served = data.get(\"model\")\n    if not isinstance(served, str) or not served.strip():\n        return None\n    scrubbed = scrub_sensitive_data(served.strip()) or \"\"\n    if not scrubbed:\n        return None\n    printable = json.dumps(scrubbed, ensure_ascii=True)[1:-1].replace(\"%\", \"%25\")\n    return printable[:200] or None\n\n\n'''
          source = regex_once(
              source,
              r"def _extract_served_model\(raw: str\) -> str \| None:\n.*?\n\ndef _truthy_env\(",
              safe_model + "def _truthy_env(",
              label="harden served-model telemetry",
          )
          source = regex_once(
              source,
              r"@contextlib\.contextmanager\ndef _repair_wall_clock_deadline\(seconds: float\):\n.*?\n\nclass StaleHeadDuringRepairRetryError",
              "class StaleHeadDuringRepairRetryError",
              label="remove signal deadline context",
          )
          source = regex_once(
              source,
              r"def _classify_attempt_outcome\(exc: BaseException\) -> str:\n.*?\n\ndef call_llm\(",
              '''def _classify_attempt_outcome(exc: BaseException) -> str:\n    \"\"\"Return a stable outcome class for one model attempt.\"\"\"\n    if isinstance(exc, NoemaModelOutputError):\n        return \"malformed_output\"\n    if isinstance(exc, (urllib.error.URLError, http.client.HTTPException, OSError)):\n        return \"transport_error\"\n    return \"runtime_error\"\n\n\ndef _attempt_summary(\n    *, kind: str, outcome: str, phase: str, elapsed: float, served_model: str\n) -> str:\n    \"\"\"Format bounded structured attempt telemetry for final diagnostics.\"\"\"\n    return (\n        f\"{kind} outcome={outcome} duration={elapsed:.1f}s \"\n        f\"phase={phase} served_model={served_model}\"\n    )\n\n\ndef call_llm(''',
              label="replace attempt classifier",
          )
          source = replace_once(
              source,
              "    repair_error: str = \"\",\n    is_retry: bool = False,\n) -> dict[str, Any]:",
              "    repair_error: str = \"\",\n    is_retry: bool = False,\n    primary_attempt: str = \"\",\n) -> dict[str, Any]:",
              label="thread primary attempt telemetry",
          )
          source = replace_once(
              source,
              '''    try:\n        deadline_context = (\n            _repair_wall_clock_deadline(NOEMA_REPAIR_DEADLINE_SECONDS)\n            if is_retry\n            else contextlib.nullcontext()\n        )\n        with deadline_context:\n            with opener.open(request) as response:  # nosec B310\n                phase_reached = \"reading\"\n                raw_bytes = response.read()\n            phase_reached = \"decoding\"\n            raw = decode_llm_response_body(raw_bytes)\n            served_model = _extract_served_model(raw)\n            content = extract_llm_message_content(raw)\n            verdict = extract_json_object(content)\n            phase_reached = \"validating\"\n            decision = str(verdict.get(\"decision\") or \"\").strip().lower()\n            if decision not in {\"approve\", \"request_changes\", \"comment\"}:\n                raise NoemaModelOutputError(f\"Noema LLM returned unsupported decision: {decision!r}\")\n            summary = verdict.get(\"summary\")\n            if not isinstance(summary, str) or not summary.strip():\n                raise NoemaModelOutputError(\"Noema LLM response did not contain a substantive summary\")\n            findings = verdict.get(\"findings\")\n            if not isinstance(findings, list) or any(not isinstance(finding, dict) for finding in findings):\n                raise NoemaModelOutputError(\"Noema LLM response findings must be a list of objects\")\n            for finding in findings:\n                if (\n                    finding.get(\"severity\") not in {\"high\", \"medium\", \"low\"}\n                    or not isinstance(finding.get(\"file\"), str)\n                    or not finding[\"file\"].strip()\n                    or type(finding.get(\"line\")) is not int\n                    or finding[\"line\"] <= 0\n                    or finding.get(\"side\") not in {\"RIGHT\", \"LEFT\"}\n                    or not isinstance(finding.get(\"message\"), str)\n                    or not finding[\"message\"].strip()\n                ):\n                    raise NoemaModelOutputError(\"Noema LLM response contained a malformed finding\")\n            if decision == \"request_changes\" and not findings:\n                raise NoemaModelOutputError(\"Noema LLM request_changes response did not contain a substantive finding\")\n            validate_substantive_verdict(verdict, diff, changed_paths)\n''',
              '''    try:\n        with opener.open(request) as response:  # nosec B310\n            phase_reached = \"reading\"\n            raw_bytes = response.read()\n        phase_reached = \"decoding\"\n        raw = decode_llm_response_body(raw_bytes)\n        served_model = _extract_served_model(raw)\n        content = extract_llm_message_content(raw)\n        verdict = extract_json_object(content)\n        phase_reached = \"validating\"\n        decision = str(verdict.get(\"decision\") or \"\").strip().lower()\n        if decision not in {\"approve\", \"request_changes\", \"comment\"}:\n            raise NoemaModelOutputError(f\"Noema LLM returned unsupported decision: {decision!r}\")\n        summary = verdict.get(\"summary\")\n        if not isinstance(summary, str) or not summary.strip():\n            raise NoemaModelOutputError(\"Noema LLM response did not contain a substantive summary\")\n        findings = verdict.get(\"findings\")\n        if not isinstance(findings, list) or any(not isinstance(finding, dict) for finding in findings):\n            raise NoemaModelOutputError(\"Noema LLM response findings must be a list of objects\")\n        for finding in findings:\n            if (\n                finding.get(\"severity\") not in {\"high\", \"medium\", \"low\"}\n                or not isinstance(finding.get(\"file\"), str)\n                or not finding[\"file\"].strip()\n                or type(finding.get(\"line\")) is not int\n                or finding[\"line\"] <= 0\n                or finding.get(\"side\") not in {\"RIGHT\", \"LEFT\"}\n                or not isinstance(finding.get(\"message\"), str)\n                or not finding[\"message\"].strip()\n            ):\n                raise NoemaModelOutputError(\"Noema LLM response contained a malformed finding\")\n        if decision == \"request_changes\" and not findings:\n            raise NoemaModelOutputError(\"Noema LLM request_changes response did not contain a substantive finding\")\n        validate_substantive_verdict(verdict, diff, changed_paths)\n''',
              label="remove deadline wrapper from call",
          )
          old_except_start = '''    except (RuntimeError, urllib.error.URLError, http.client.HTTPException, OSError) as exc:\n'''
          success_marker = '''    attempt_elapsed = time.monotonic() - attempt_started\n    print(\n        f\"::notice::Noema {attempt_kind} attempt outcome=success \"\n        f\"duration={attempt_elapsed:.1f}s served_model={served_model or 'unknown'}\"\n    )\n    return verdict\n'''
          start = source.index(old_except_start, source.index("def call_llm("))
          end = source.index(success_marker, start) + len(success_marker)
          replacement = '''    except (RuntimeError, urllib.error.URLError, http.client.HTTPException, OSError) as exc:\n        attempt_elapsed = time.monotonic() - attempt_started\n        outcome = _classify_attempt_outcome(exc)\n        current_failure = _stable_failure_diagnostic(exc)\n        served_model_note = served_model or \"unknown\"\n        attempt_record = _attempt_summary(\n            kind=attempt_kind,\n            outcome=outcome,\n            phase=phase_reached,\n            elapsed=attempt_elapsed,\n            served_model=served_model_note,\n        )\n        if is_retry:\n            print(f\"::warning::Noema {attempt_record}; repair attempts=1 (one corrective call -- not a retry loop).\")\n            initial_failure = scrub_sensitive_data(repair_error) or \"no diagnostic message was available\"\n            evidence = f\"; {primary_attempt}; {attempt_record}\" if primary_attempt else f\"; {attempt_record}\"\n            if isinstance(exc, NoemaModelOutputError):\n                raise NoemaModelOutputError(\n                    \"Noema model-output repair remained invalid; \"\n                    f\"initial failure: {initial_failure}; repair failure: {current_failure}{evidence}\"\n                ) from None\n            if isinstance(exc, (urllib.error.URLError, http.client.HTTPException, OSError)):\n                raise NoemaTransportError(\n                    \"Noema corrective repair transport was exhausted; \"\n                    f\"initial failure: {initial_failure}; repair failure: {type(exc).__name__}: {current_failure}{evidence}\"\n                ) from exc\n            raise RuntimeError(\n                \"Noema repair failed closed; \"\n                f\"initial failure: {initial_failure}; repair failure: {current_failure}{evidence}\"\n            ) from exc\n        print(f\"::notice::Noema {attempt_record}; starting one corrective repair attempt.\")\n        if str(fetch_pr(repo, number).get(\"headRefOid\") or \"\").lower() != expected_head:\n            raise StaleHeadDuringRepairRetryError(\n                \"Pull request head changed during review; stale before repair retry.\"\n            ) from exc\n        return call_llm(\n            repo,\n            number,\n            pr,\n            diff,\n            truncated,\n            expected_head,\n            review_context,\n            changed_paths,\n            current_failure,\n            is_retry=True,\n            primary_attempt=attempt_record,\n        )\n    attempt_elapsed = time.monotonic() - attempt_started\n    success_record = _attempt_summary(\n        kind=attempt_kind,\n        outcome=\"success\",\n        phase=phase_reached,\n        elapsed=attempt_elapsed,\n        served_model=served_model or \"unknown\",\n    )\n    print(f\"::notice::Noema {success_record}\")\n    return verdict\n'''
          source = source[:start] + replacement + source[end:]
          for forbidden in (
              "NOEMA_REPAIR_DEADLINE_SECONDS",
              "NoemaRepairDeadlineExceeded",
              "_repair_wall_clock_deadline",
              "setitimer",
          ):
              if forbidden in source:
                  raise RuntimeError(f"caller-owned fixed deadline survived: {forbidden}")
          ast.parse(source)
          source_path.write_text(source)

          telemetry = telemetry_path.read_text()
          telemetry = telemetry.replace("import signal\n", "").replace("import time\n", "")
          telemetry = regex_once(
              telemetry,
              r"@pytest\.mark\.parametrize\(\n    \(\"exc\", \"expected\"\),\n    \[.*?\n\ndef test_classify_attempt_outcome_detects_transport_family",
              '''@pytest.mark.parametrize(\n    (\"exc\", \"expected\"),\n    [\n        (gate.NoemaModelOutputError(\"bad\"), \"malformed_output\"),\n        (gate.NoemaTransportError(\"bad transport\"), \"runtime_error\"),\n        (RuntimeError(\"unexpected\"), \"runtime_error\"),\n    ],\n)\ndef test_classify_attempt_outcome_preserves_typed_failure_classes(exc, expected):\n    \"\"\"Reviewer-owned classification keeps model and runtime evidence distinct.\"\"\"\n    assert gate._classify_attempt_outcome(exc) == expected\n\n\ndef test_classify_attempt_outcome_detects_transport_family''',
              label="replace deadline classifier regression",
          )
          telemetry = regex_once(
              telemetry,
              r"\n\ndef test_repair_deadline_exceeded_emits_full_attempt_breakdown\(.*?\n\ndef test_strip_trailing_commas_outside_strings_is_lossless_and_string_safe",
              "\n\ndef test_strip_trailing_commas_outside_strings_is_lossless_and_string_safe",
              label="remove fixed-deadline telemetry regression",
          )
          telemetry = replace_once(
              telemetry,
              '''def test_extract_json_object_recovers_a_trailing_comma_response(capsys):\n    \"\"\"A trailing-comma-malformed verdict recovers locally, no network retry needed.\"\"\"\n    malformed = '{\"decision\":\"comment\",\"summary\":\"ok\",\"findings\":[],}'\n    with pytest.raises(gate.NoemaModelOutputError):\n        gate._extract_json_object_once(malformed)\n\n    verdict = gate.extract_json_object(malformed)\n    assert verdict == {\"decision\": \"comment\", \"summary\": \"ok\", \"findings\": []}\n    notice = capsys.readouterr().out\n    assert \"::notice::Noema local trailing-comma JSON repair recovered\" in notice\n    assert \"no network repair retry was needed\" in notice\n''',
              '''def test_extract_json_object_recovers_a_trailing_comma_without_duplicate_annotation(capsys):\n    \"\"\"Local syntax recovery does not violate one-annotation-per-attempt telemetry.\"\"\"\n    malformed = '{\"decision\":\"comment\",\"summary\":\"ok\",\"findings\":[],}'\n    with pytest.raises(gate.NoemaModelOutputError):\n        gate._extract_json_object_once(malformed)\n    verdict = gate.extract_json_object(malformed)\n    assert verdict == {\"decision\": \"comment\", \"summary\": \"ok\", \"findings\": []}\n    assert \"::notice::\" not in capsys.readouterr().out\n''',
              label="replace duplicate local repair notice test",
          )
          telemetry = telemetry.replace(
              '    assert "served_model=some-provider/some-model-v1" in notice\n',
              '    assert "served_model=some-provider/some-model-v1" in notice\n    assert "phase=validating" in notice\n',
              1,
          )
          telemetry = telemetry.replace(
              '    assert "served_model=repair-candidate/model-y" in captured',
              '    assert "served_model=repair-candidate/model-y" in captured\n    assert "phase=validating" in captured',
              1,
          )
          telemetry += r'''


def test_trailing_comma_repair_rejects_missing_values_and_accepts_complete_values():
    """Syntax repair never fabricates values while preserving genuine trailing commas."""
    for malformed in ("[,]", "{,}", "[1,,]", '{"a":,}'):
        assert gate._strip_trailing_commas_outside_strings(malformed) == malformed
        with pytest.raises(gate.NoemaModelOutputError):
            gate.extract_json_object('{"decision":"comment","summary":"x","findings":' + malformed + '}')
    assert gate._strip_trailing_commas_outside_strings('["x", 1, true, {}, [],]') == '["x", 1, true, {}, []]'


def test_served_model_is_single_line_utf8_printable_and_workflow_command_safe():
    """Untrusted model telemetry cannot inject Actions commands or crash encoding."""
    raw = '{"model":"evil\\ud800\\n::error::forged%0Aline","choices":[]}'
    served = gate._extract_served_model(raw)
    assert served is not None
    served.encode("utf-8")
    assert "\n" not in served and "\r" not in served
    assert "\\ud800" in served
    assert "%0A" not in served
    assert len(served) <= 200


def test_invalid_location_diagnostic_preserves_rejected_and_nearby_source():
    """Corrective prompts receive exact rejected coordinates and bounded alternatives."""
    verdict = _malformed_probe_verdict()
    verdict["reviewed_lines"][0]["line"] = 99
    with pytest.raises(gate.NoemaModelOutputError) as exc_info:
        gate.validate_substantive_verdict(verdict, DIFF, ("README.md",))
    message = str(exc_info.value)
    assert "entry 1/1 (array index 0, not a source line)" in message
    assert "path='README.md' line=99 side='RIGHT'" in message
    assert "nearest changed lines for README.md: README.md:1 (RIGHT)" in message


def test_stale_head_still_emits_primary_attempt_telemetry(monkeypatch, capsys):
    """Completed primary evidence is logged before stale-head repair suppression."""
    monkeypatch.setenv("NOEMA_LLM_API_URL", "https://llm.example/v1/chat/completions")
    monkeypatch.setenv("NOEMA_LLM_API_KEY", "test-key")
    head_sha = "a" * 40
    monkeypatch.setattr(
        gate.urllib.request.OpenerDirector,
        "open",
        lambda *_a, **_k: _JsonResponse({"choices": [{"message": {"content": json.dumps(_malformed_probe_verdict())}}]}),
    )
    monkeypatch.setattr(gate, "fetch_pr", lambda _repo, _number: {"headRefOid": "b" * 40})
    with pytest.raises(gate.StaleHeadDuringRepairRetryError):
        gate.call_llm("owner/repo", 7, {"title": "test", "headRefOid": head_sha}, DIFF, False, head_sha, changed_paths=("README.md",))
