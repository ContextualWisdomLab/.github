name: ConceptWeave Product Ruleset Reconcile

on:
  pull_request:
    paths:
      - "config/conceptweave-product-ruleset.json"
      - "scripts/ci/reconcile_conceptweave_product_ruleset.py"
      - "tests/test_conceptweave_product_ruleset_reconciliation.py"
      - "tests/test_conceptweave_product_ruleset_contents_encoding.py"
      - "tests/test_conceptweave_product_ruleset_bootstrap_race.py"
      - "tests/test_conceptweave_product_ruleset_activation_race.py"
      - "tests/test_conceptweave_product_ruleset_workflow.py"
      - "docs/doctoring/conceptweave-product-ruleset-bootstrap.md"
      - ".github/workflows/conceptweave-product-ruleset-reconcile.yml"
  push:
    branches:
      - main
    paths:
      - "config/conceptweave-product-ruleset.json"
      - "scripts/ci/reconcile_conceptweave_product_ruleset.py"
      - "tests/test_conceptweave_product_ruleset_reconciliation.py"
      - "tests/test_conceptweave_product_ruleset_contents_encoding.py"
      - "tests/test_conceptweave_product_ruleset_bootstrap_race.py"
      - "tests/test_conceptweave_product_ruleset_activation_race.py"
      - "tests/test_conceptweave_product_ruleset_workflow.py"
      - "docs/doctoring/conceptweave-product-ruleset-bootstrap.md"
      - ".github/workflows/conceptweave-product-ruleset-reconcile.yml"
  repository_dispatch:
    types: [conceptweave-product-ruleset-reconcile]

permissions:
  contents: read

concurrency:
  group: conceptweave-product-ruleset-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'owner-plane' }}
  # PR validation may supersede itself. Privileged create/PUT plus immutable-history
  # settlement must never be cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate trusted dispatch request
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_MODE: ${{ github.event.client_payload.mode }}
          EXPECTED_MAIN_SHA: ${{ github.event.client_payload.expected_main_sha }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          case "$DISPATCH_MODE" in
            verify|bootstrap|activate) ;;
            *) exit 1 ;;
          esac
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
      - name: Validate reviewed Product target manifest
        run: >-
          python -m scripts.ci.reconcile_conceptweave_product_ruleset
          --manifest config/conceptweave-product-ruleset.json
          --mode validate
      - name: Prove Product ruleset lifecycle contract
        env:
          COVERAGE_RCFILE: /dev/null
        run: |
          set -euo pipefail
          python -m coverage run \
            --branch \
            --include=scripts/ci/reconcile_conceptweave_product_ruleset.py \
            -m pytest -q \
              tests/test_conceptweave_product_ruleset_reconciliation.py \
              tests/test_conceptweave_product_ruleset_contents_encoding.py \
              tests/test_conceptweave_product_ruleset_bootstrap_race.py \
              tests/test_conceptweave_product_ruleset_activation_race.py \
              tests/test_conceptweave_product_ruleset_workflow.py
          python -m coverage report \
            --fail-under=100 \
            --show-missing \
            --include=scripts/ci/reconcile_conceptweave_product_ruleset.py
          python -m interrogate \
            --fail-under 100 \
            scripts/ci/reconcile_conceptweave_product_ruleset.py
          git diff --check

  verify-live:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.mode == 'verify' &&
      github.event.client_payload.expected_main_sha == github.sha &&
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ruleset-governance-maintenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out trusted revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact trusted revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify live Product ruleset stage
        env:
          GH_TOKEN: ${{ secrets.CWL_RULESET_ADMIN_TOKEN }}
        run: >-
          python -m scripts.ci.reconcile_conceptweave_product_ruleset
          --manifest config/conceptweave-product-ruleset.json
          --mode verify

  mutate-owner-plane:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.client_payload.expected_main_sha == github.sha &&
      (github.event.client_payload.mode == 'bootstrap' ||
      github.event.client_payload.mode == 'activate') &&
      vars.CWL_RULESET_RECONCILE_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    # The shared #1644 immutable-history recovery path is intentionally allowed
    # to finish even under slow GitHub API settlement.
    timeout-minutes: 360
    environment: ruleset-governance-maintenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out trusted protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact trusted revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require dedicated ruleset administration credential
        env:
          GH_TOKEN: ${{ secrets.CWL_RULESET_ADMIN_TOKEN }}
        run: test -n "$GH_TOKEN"
      - name: Validate activation inputs
        if: github.event.client_payload.mode == 'activate'
        env:
          CANARY_PR: ${{ github.event.client_payload.canary_pr }}
          CANARY_RUN_ID: ${{ github.event.client_payload.canary_run_id }}
        shell: bash
        run: |
          [[ "$CANARY_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANARY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Bootstrap evaluate policy
        if: github.event.client_payload.mode == 'bootstrap'
        env:
          GH_TOKEN: ${{ secrets.CWL_RULESET_ADMIN_TOKEN }}
          CWL_RULESET_RECONCILE_ENABLED: ${{ vars.CWL_RULESET_RECONCILE_ENABLED }}
        run: >-
          python -m scripts.ci.reconcile_conceptweave_product_ruleset
          --manifest config/conceptweave-product-ruleset.json
          --mode bootstrap
          --expected-main-sha "$GITHUB_SHA"
      - name: Activate policy from exact Product canary
        if: github.event.client_payload.mode == 'activate'
        env:
          GH_TOKEN: ${{ secrets.CWL_RULESET_ADMIN_TOKEN }}
          CWL_RULESET_RECONCILE_ENABLED: ${{ vars.CWL_RULESET_RECONCILE_ENABLED }}
          CANARY_PR: ${{ github.event.client_payload.canary_pr }}
          CANARY_RUN_ID: ${{ github.event.client_payload.canary_run_id }}
        run: >-
          python -m scripts.ci.reconcile_conceptweave_product_ruleset
          --manifest config/conceptweave-product-ruleset.json
          --mode activate
          --expected-main-sha "$GITHUB_SHA"
          --canary-pr "$CANARY_PR"
          --canary-run-id "$CANARY_RUN_ID"
      - name: Verify active post-change live state
        if: github.event.client_payload.mode == 'activate'
        env:
          GH_TOKEN: ${{ secrets.CWL_RULESET_ADMIN_TOKEN }}
        run: >-
          python -m scripts.ci.reconcile_conceptweave_product_ruleset
          --manifest config/conceptweave-product-ruleset.json
          --mode verify
