name: Python Source Tests

on:
  workflow_call:
    inputs:
      pull_request_number:
        description: Native pull request number explicitly supplied by the caller
        required: true
        type: number
      python_version:
        description: Python version for the source-tree tests
        required: false
        type: string
        default: "3.13"
      project_extra:
        description: Optional project extra containing test dependencies; empty for none
        required: false
        type: string
        default: dev

permissions:
  contents: read

concurrency:
  # The reusable workflow owns this group; callers must not duplicate it.
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate pull request identity
        env:
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [[ "$EVENT_NAME" != pull_request ||
                ! "$INPUT_PR_NUMBER" =~ ^[1-9][0-9]*$ ||
                "$INPUT_PR_NUMBER" != "$EVENT_PR_NUMBER" ||
                ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo invalid_pull_request_identity >&2
            exit 1
          fi
      - name: Checkout native PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: ${{ inputs.python_version }}
          enable-cache: false
      - name: Install locked test dependencies
        env:
          PROJECT_EXTRA: ${{ inputs.project_extra }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          extra_args=()
          if [[ -n "$PROJECT_EXTRA" ]]; then
            extra_args+=(--extra "$PROJECT_EXTRA")
          fi
          uv sync --locked --no-install-project "${extra_args[@]}"
      - name: Run source-tree tests
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: uv run --no-sync python -m pytest tests
