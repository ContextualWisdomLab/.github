name: Materialize verified sandbox evidence commit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: materialize-sandboxed-evidence-receipt
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  materialize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.number == 788 &&
      github.event.pull_request.head.ref == 'fix/sandboxed-evidence-bounds-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact current-main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Verify bounded setup and import immutable focused source
        env:
          SOURCE_SHA: 45e4929e1fc473211168b2d6360c9da2516e5341
          EXPECTED_MAIN: f070c504c1cb06891b800d7ab0cf6ac7d3cf8eae
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "${EXPECTED_MAIN}^{commit}"
          test "$(git merge-base "$EXPECTED_HEAD" "$EXPECTED_MAIN")" = "$EXPECTED_MAIN"
          mapfile -t setup_paths < <(git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_HEAD" | sort)
          expected_setup_paths=(
            ".github/workflows/materialize-sandboxed-evidence-bounds.yml"
            ".github/workflows/materialize-sandboxed-evidence-receipt.yml"
          )
          test "${#setup_paths[@]}" -eq "${#expected_setup_paths[@]}"
          for index in "${!expected_setup_paths[@]}"; do
            test "${setup_paths[$index]}" = "${expected_setup_paths[$index]}"
          done
          if ! git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin refs/pull/767/head
          fi
          test "$(git rev-parse "${SOURCE_SHA}^{commit}")" = "$SOURCE_SHA"
          git checkout "$SOURCE_SHA" -- \
            docs/doctoring/sandboxed-command-log-redaction.md \
            docs/doctoring/sandboxed-output-resource-bounds.md \
            docs/superpowers/plans/2026-08-05-sandboxed-output-resource-bounds.md \
            docs/superpowers/specs/2026-08-05-sandboxed-output-resource-bounds-design.md \
            scripts/ci/bounded_subprocess.py \
            scripts/ci/redact_sensitive_log.py \
            scripts/ci/run_opencode_review_model_pool.sh \
            scripts/ci/sandboxed_verify.py \
            scripts/ci/sandboxed_web_e2e.py \
            tests/test_bounded_subprocess.py \
            tests/test_bounded_subprocess_capture_startup.py \
            tests/test_bounded_subprocess_contract.py \
            tests/test_opencode_model_pool_runner.py \
            tests/test_redact_json_key_boundary.py \
            tests/test_redact_sensitive_log_contract.py \
            tests/test_sandboxed_entrypoint_and_cleanup_coverage.py \
            tests/test_sandboxed_output_redaction.py \
            tests/test_sandboxed_service_capture_startup.py \
            tests/test_sandboxed_verify_output_limits.py \
            tests/test_sandboxed_web_e2e.py \
            tests/test_sandboxed_web_e2e_branch_contract.py \
            tests/test_sandboxed_web_e2e_output_limits.py

          cat >.github/workflows/sandboxed-evidence-quality-ci.yml <<'YAML'
          name: Sandboxed Evidence Quality CI

          on:
            pull_request:
              branches: [main]
              paths:
                - ".github/workflows/sandboxed-evidence-quality-ci.yml"
                - "scripts/ci/bounded_subprocess.py"
                - "scripts/ci/redact_sensitive_log.py"
                - "scripts/ci/run_opencode_review_model_pool.sh"
                - "scripts/ci/sandboxed_verify.py"
                - "scripts/ci/sandboxed_web_e2e.py"
                - "tests/test_bounded_subprocess*.py"
                - "tests/test_opencode_model_pool_runner.py"
                - "tests/test_redact*.py"
                - "tests/test_sandboxed*.py"
                - "requirements-opencode-review-ci-hashes.txt"
            push:
              branches: [main]
              paths:
                - ".github/workflows/sandboxed-evidence-quality-ci.yml"
                - "scripts/ci/bounded_subprocess.py"
                - "scripts/ci/redact_sensitive_log.py"
                - "scripts/ci/run_opencode_review_model_pool.sh"
                - "scripts/ci/sandboxed_verify.py"
                - "scripts/ci/sandboxed_web_e2e.py"
                - "tests/test_bounded_subprocess*.py"
                - "tests/test_opencode_model_pool_runner.py"
                - "tests/test_redact*.py"
                - "tests/test_sandboxed*.py"
                - "requirements-opencode-review-ci-hashes.txt"

          concurrency:
            group: sandboxed-evidence-quality-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read

          env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

          jobs:
            quality:
              runs-on: ubuntu-24.04
              timeout-minutes: 40
              steps:
                - name: Harden runner
                  uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
                  with:
                    egress-policy: audit
                - name: Checkout exact head
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    persist-credentials: false
                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                  with:
                    python-version: "3.14"
                    cache: pip
                    cache-dependency-path: requirements-opencode-review-ci-hashes.txt
                - name: Install exact hash-locked tooling
                  run: >-
                    python -m pip install --disable-pip-version-check --require-hashes
                    -r requirements-opencode-review-ci-hashes.txt
                - name: Run complete integrated quality contract
                  shell: bash --noprofile --norc -e -o pipefail {0}
                  run: |
                    python -m coverage erase
                    python -m coverage run --branch -m pytest -q
                    python -m coverage report --show-missing --fail-under=100
                    python -m interrogate --fail-under=100 scripts/ci
                    python -m compileall -q scripts tests
                    bash -n scripts/ci/run_opencode_review_model_pool.sh
                    git diff --check
          YAML

          python3 - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          source = changelog.read_text(encoding="utf-8")
          entries = (
              "- Redact credentials from every sandbox command, timeout, service-tail, JSON, and review-evidence sink while preserving ordinary diagnostics.\n",
              "- Bound command and long-running service output, terminate isolated process groups on overflow, and emit deterministic resource-limit evidence without capping unrelated repository artifacts.\n",
              "- Add a permanent exact-head quality workflow enforcing 100% production statement, branch, and docstring coverage for sandbox evidence controls.\n",
          )
          marker = "## [Unreleased]\n"
          if marker not in source:
              raise SystemExit("CHANGELOG is missing the Unreleased section")
          missing = "".join(entry for entry in entries if entry not in source)
          if missing:
              changelog.write_text(
                  source.replace(marker, marker + "\n" + missing, 1),
                  encoding="utf-8",
              )
          PY
          rm \
            .github/workflows/materialize-sandboxed-evidence-bounds.yml \
            .github/workflows/materialize-sandboxed-evidence-receipt.yml
          git diff --check

      - name: Install exact hash-locked tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify complete integrated quality contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci
          python -m compileall -q scripts tests
          bash -n scripts/ci/run_opencode_review_model_pool.sh
          git diff --check

      - name: Build immutable verified Git commit object
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: fix/sandboxed-evidence-bounds-main
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr788-materialization-receipt.txt"
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = 'ContextualWisdomLab/.github'
          parent_sha = os.environ['EXPECTED_HEAD']
          token = os.environ['API_TOKEN']
          api_root = f'https://api.github.com/repos/{repository}'

          expected_paths = {
              '.github/workflows/materialize-sandboxed-evidence-bounds.yml',
              '.github/workflows/materialize-sandboxed-evidence-receipt.yml',
              '.github/workflows/sandboxed-evidence-quality-ci.yml',
              'CHANGELOG.md',
              'docs/doctoring/sandboxed-command-log-redaction.md',
              'docs/doctoring/sandboxed-output-resource-bounds.md',
              'docs/superpowers/plans/2026-08-05-sandboxed-output-resource-bounds.md',
              'docs/superpowers/specs/2026-08-05-sandboxed-output-resource-bounds-design.md',
              'scripts/ci/bounded_subprocess.py',
              'scripts/ci/redact_sensitive_log.py',
              'scripts/ci/run_opencode_review_model_pool.sh',
              'scripts/ci/sandboxed_verify.py',
              'scripts/ci/sandboxed_web_e2e.py',
              'tests/test_bounded_subprocess.py',
              'tests/test_bounded_subprocess_capture_startup.py',
              'tests/test_bounded_subprocess_contract.py',
              'tests/test_opencode_model_pool_runner.py',
              'tests/test_redact_json_key_boundary.py',
              'tests/test_redact_sensitive_log_contract.py',
              'tests/test_sandboxed_entrypoint_and_cleanup_coverage.py',
              'tests/test_sandboxed_output_redaction.py',
              'tests/test_sandboxed_service_capture_startup.py',
              'tests/test_sandboxed_verify_output_limits.py',
              'tests/test_sandboxed_web_e2e.py',
              'tests/test_sandboxed_web_e2e_branch_contract.py',
              'tests/test_sandboxed_web_e2e_output_limits.py',
          }

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cwl-pr788-materializer',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          raw = subprocess.check_output(
              ['git', 'diff', '--name-status', '-z', 'HEAD'],
          )
          parts = raw.decode('utf-8').split('\0')
          changes = []
          index = 0
          while index < len(parts) - 1:
              status = parts[index]
              path = parts[index + 1]
              index += 2
              if status.startswith(('R', 'C')):
                  raise SystemExit(f'rename/copy status is outside the reviewed scope: {status} {path}')
              changes.append((status, path))
          actual_paths = {path for _, path in changes}
          if actual_paths != expected_paths:
              raise SystemExit(
                  f'product path mismatch: missing={sorted(expected_paths - actual_paths)} '
                  f'extra={sorted(actual_paths - expected_paths)}'
              )

          parent = request('GET', f'/git/commits/{parent_sha}')
          tree_entries = []
          for status, path in changes:
              if status == 'D':
                  tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              encoded = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = request('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              mode = '100755' if os.access(path, os.X_OK) else '100644'
              tree_entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
              print(f"BLOB {blob['sha']} {path}")

          tree = request(
              'POST',
              '/git/trees',
              {'base_tree': parent['tree']['sha'], 'tree': tree_entries},
          )
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'fix(ci): secure and bound sandbox evidence streams',
                  'tree': tree['sha'],
                  'parents': [parent_sha],
              },
          )
          print(f"MATERIALIZATION_PARENT_SHA={parent_sha}")
          print(f"MATERIALIZATION_PARENT_TREE_SHA={parent['tree']['sha']}")
          print(f"MATERIALIZATION_TREE_SHA={tree['sha']}")
          print(f"MATERIALIZATION_COMMIT_SHA={commit['sha']}")
          PY

      - name: Upload exact-head materialization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr788-exact-head-materialization
          path: ${{ runner.temp }}/pr788-materialization-receipt.txt
          if-no-files-found: error
          retention-days: 5
