name: Queue Ownership Quality CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/queue-ownership-quality-ci.yml"
      - ".github/workflows/pr-review-merge-scheduler.yml"
      - ".github/workflows/current-head-run-coalescer.yml"
      - "scripts/ci/current_head_run_coalescer.py"
      - "tests/test_org_sweep_queue_hygiene_owner.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/queue-ownership-quality-ci.yml"
      - ".github/workflows/pr-review-merge-scheduler.yml"
      - ".github/workflows/current-head-run-coalescer.yml"
      - "scripts/ci/current_head_run_coalescer.py"
      - "tests/test_org_sweep_queue_hygiene_owner.py"

concurrency:
  group: queue-ownership-quality-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  owner-contract:
    name: queue-owner-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20
        with:
          egress-policy: audit

      - name: Checkout exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-verified pytest
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/queue-owner-requirements.txt" <<'EOF'
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          EOF
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r "${RUNNER_TEMP}/queue-owner-requirements.txt"

      - name: Verify exact head and queue single-writer contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m pytest tests/test_org_sweep_queue_hygiene_owner.py -q
          python -m compileall -q tests/test_org_sweep_queue_hygiene_owner.py
          git diff --exit-code
