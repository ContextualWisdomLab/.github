name: Review observed-defect corpus quality

on:
  pull_request:
    paths:
      - scripts/ci/opencode_review_normalize_output.py
      - scripts/ci/review_probe_taxonomy.py
      - scripts/ci/opencode_review_prompt_template.md
      - scripts/ci/run_opencode_review_model_pool.sh
      - ci-review-prompt.md
      - code-reviewer-prompt.md
      - tests/test_opencode_observed_defect_probe_taxonomy.py
      - tests/fixtures/review_observed_defect_cases.json
      - .github/workflows/review-observed-defect-corpus-quality-ci.yml

permissions:
  contents: read

jobs:
  observed-defect-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-locked review test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
      - name: Verify observed-defect admission and adjacent OpenCode contracts
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_opencode_observed_defect_probe_taxonomy.py tests/test_opencode_review_normalize_output.py tests/test_opencode_existing_approval_gate.py tests/test_opencode_agent_contract.py
