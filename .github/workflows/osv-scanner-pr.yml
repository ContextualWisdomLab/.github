# Uploads an osv-scanner code scanning analysis on every PR so the org
# ruleset "CWL Central required workflows" -> code_scanning(osv-scanner)
# requirement can actually be satisfied. Without this, the required tool
# never reports on PR refs and every PR stays mergeStateStatus=BLOCKED.
name: OSV-Scanner PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master, develop]

concurrency:
  group: osv-scanner-pr-${{ github.event.pull_request.base.repo.full_name || github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  # Scorecard Token-Permissions (alert #41): keep the workflow-level token
  # read-only. SARIF upload needs security-events:write, but the osv-scan job
  # below already grants it at job scope, so it is redundant (and over-broad)
  # here.
  actions: read
  contents: read

jobs:
  cancel-closed-pr-runs:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR closed; this run only cancels older runs through workflow concurrency."

  osv-scan:
    if: github.event.action != 'closed'
    # ponytail: use upstream reusable PR workflow, don't hand-roll the diff scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # Merge gating is done by the org code_scanning ruleset rule
      # (medium_or_higher), not by failing this check. Keep the check green
      # so it only supplies the analysis; the ruleset decides blocking.
      fail-on-vuln: false
      # RELIABILITY: resolve Maven parent POMs through Google's byte-identical
      # Maven Central mirror instead of repo.maven.apache.org, which
      # intermittently 429s during transitive resolution (e.g.
      # spring-boot-starter-parent). Same maven2 layout, same bytes -> no
      # coverage loss; transitive scanning stays fully enabled. See
      # security-scan.yml for the full rationale.
      scan-args: |-
        --maven-registry=https://maven-central.storage-download.googleapis.com/maven2
        -r
        ./
