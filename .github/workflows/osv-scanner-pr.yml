# Keeps a supplemental current-head OSV scan on every PR. The central Security
# Scan workflow owns the blocking OSV result, finding logs, and SARIF upload so
# this check does not duplicate installation API calls or fail an otherwise
# clean PR when GitHub rate-limits action downloads.
name: OSV-Scanner PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master, develop]

concurrency:
  group: >-
    osv-scanner-pr-${{
    github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  # Scorecard Token-Permissions (alert #41): keep the workflow-level token
  # read-only. This supplemental job never uploads SARIF.
  actions: read
  contents: read

jobs:
  cancel-closed-pr-runs:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR closed; this run only cancels older runs through workflow concurrency."

  osv-scan:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout current PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Local scanner pin matches security-scan.yml. Do not call the upstream
      # reusable PR workflow: it downloads the reporter action at job setup
      # even when SARIF upload is disabled, and a GitHub 429 then fails this
      # supplemental check before a non-blocking scan setting can apply.
      - name: Scan current head with OSV
        id: osv_head
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a82132c0bd6c7261ffcb78e754c46c70ab57ad9a # v2.3.8
        with:
          # Keep the PR scan deterministic: public registry rate limits cannot
          # make this supplemental check fail. The security-scan workflow still
          # performs the full base/head OSV pass first and logs its --no-resolve
          # fallback reason when registries are transiently unavailable.
          scan-args: |-
            --maven-registry=https://maven-central.storage-download.googleapis.com/maven2
            --no-resolve
            -r
            ./

      - name: Defer merge gating to central Security Scan
        run: |
          set -euo pipefail
          if [ "${{ steps.osv_head.outcome }}" = "failure" ]; then
            echo "::warning::Supplemental OSV PR scan did not finish. Merge gating stays on security-scan.yml with --fail-on-vuln=true after printing package, version, OSV ID and aliases. Action-download or registry rate limits are not findings."
          else
            echo "Supplemental OSV PR scan finished. Merge gating stays on security-scan.yml."
          fi
