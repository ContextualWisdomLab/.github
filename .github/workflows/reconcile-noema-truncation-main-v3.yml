name: One-shot Noema current-main reconciliation

on:
  push:
    branches:
      - fix/noema-truncated-completion-contract-20260901
    paths:
      - .github/workflows/reconcile-noema-truncation-main-v3.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Merge current protected main and reverify
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-truncated-completion-contract-20260901
          EXPECTED_MAIN_SHA: 547fcc875d70a9489b30a6863692c977f1444fe2
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          git clone --filter=blob:none \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          unmerged="$(git diff --name-only --diff-filter=U | sort)"
          if test -n "$unmerged"; then
            expected_conflicts="$(printf '%s\n' \
              tests/test_noema_removed_file_context.py \
              tests/test_noema_review_gate.py | sort)"
            test "$unmerged" = "$expected_conflicts"
            git checkout --theirs -- \
              tests/test_noema_removed_file_context.py \
              tests/test_noema_review_gate.py
            git add \
              tests/test_noema_removed_file_context.py \
              tests/test_noema_review_gate.py
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          if test "$merge_status" -ne 0; then
            test -n "$unmerged"
          fi

          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-opencode-review-ci-hashes.txt
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_truncated_completion_contract.py \
            tests/test_noema_review_gate.py \
            tests/test_noema_review_orchestrator_ssrf.py \
            tests/test_noema_removed_file_context.py \
            tests/test_contextual_orchestrator_review_policy.py
          PYTHONPATH=. python3 -m pytest -q tests
          interrogate --fail-under=100 scripts/ci/noema_review_gate.py
          python3 -m compileall -q scripts/ci tests
          git diff --check
          git diff --cached --check

          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

          git commit -m "chore(noema): reconcile current protected main"
          git push origin "HEAD:${TARGET_BRANCH}"
