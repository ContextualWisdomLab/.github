name: Export current Strix contract source

on:
  push:
    branches:
      - tmp/export-pr782-rca-current-20260808
    paths:
      - .github/workflows/export-strix-contract-current.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize contract bundle
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          bundle="$RUNNER_TEMP/strix-contract-current"
          mkdir -p "$bundle/tests" "$bundle/scripts/ci"
          cp tests/test_opencode_agent_contract.py "$bundle/tests/test_opencode_agent_contract.py"
          cp scripts/ci/test_strix_quick_gate.sh "$bundle/scripts/ci/test_strix_quick_gate.sh"
          cp scripts/ci/strix_quick_gate.sh "$bundle/scripts/ci/strix_quick_gate.sh"
          sha256sum "$bundle"/tests/test_opencode_agent_contract.py "$bundle"/scripts/ci/*.sh >"$bundle/MANIFEST.sha256"
      - name: Upload contract bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strix-contract-current-${{ github.sha }}
          path: ${{ runner.temp }}/strix-contract-current
          if-no-files-found: error
          retention-days: 1
