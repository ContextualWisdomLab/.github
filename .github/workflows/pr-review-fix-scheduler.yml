name: PR Review Fix Scheduler

on:
  # Same-repository callers resolve this file from their own immutable commit;
  # only the explicitly declared optional secrets below cross that boundary.
  workflow_call:
    inputs:
      dry_run:
        description: Print actions without dispatching autofix
        required: false
        default: false
        type: boolean
      max_prs:
        description: Maximum open PRs to inspect
        required: false
        default: "50"
        type: string
      max_dispatches:
        description: Maximum autofix runs to dispatch
        required: false
        default: "1"
        type: string
      target_repository:
        description: Repository to scan, in owner/name form; defaults to the caller repository
        required: false
        default: ""
        type: string
      resolve_unreviewed_conflicts:
        description: Dispatch bounded conflict repair before the original head is reviewed
        required: false
        default: true
        type: boolean
      retry_hours:
        description: Minimum hours before redispatching autofix for the same head
        required: false
        default: "1"
        type: string
      autofix_workflow:
        description: Autofix workflow file to dispatch
        required: false
        default: "pr-review-autofix.yml"
        type: string
      autofix_repository:
        description: Repository that owns the autofix workflow
        required: false
        default: "ContextualWisdomLab/.github"
        type: string
      base_branch:
        description: Base branch to scan; defaults to the caller repository default branch
        required: false
        default: ""
        type: string
      canonical_ref:
        description: Deprecated compatibility input; accepted and ignored because privileged source is bound to the called workflow SHA
        required: false
        default: ""
        type: string
    secrets:
      PR_REVIEW_MERGE_TOKEN:
        description: Optional cross-repository scheduler mutation credential
        required: false
      OPENCODE_APPROVE_TOKEN:
        description: Optional established OpenCode scheduler credential fallback
        required: false
  repository_dispatch:
    types: [pr-review-fix-scheduler]

concurrency:
  group: central-pr-review-fix-scheduler-${{ github.event.client_payload.target_repository || inputs.target_repository || vars.PR_REVIEW_FIX_TARGET_REPOSITORY || github.repository }}
  # Queue scans are short and read-only. Cancel only a superseded scan; the
  # separately dispatched per-PR OpenCode worker keeps non-cancelling
  # concurrency so a legitimate long-running RCA is not discarded.
  cancel-in-progress: true

# Keep the workflow-generated token read-only. Cross-repository mutation is
# authorized only by the two explicitly forwarded established credentials or
# the established OpenCode GitHub App token exchanged from GitHub OIDC.
permissions:
  contents: read
  id-token: write

jobs:
  dispatch-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository || inputs.target_repository || vars.PR_REVIEW_FIX_TARGET_REPOSITORY || github.repository }}
      DEFAULT_BRANCH: ${{ github.event.client_payload.base_branch || inputs.base_branch || vars.PR_REVIEW_FIX_BASE_BRANCH || github.event.repository.default_branch }}
      DRY_RUN: ${{ github.event.client_payload.dry_run == true || github.event.client_payload.dry_run == 'true' || inputs.dry_run == true }}
      MAX_PRS: ${{ github.event.client_payload.max_prs || inputs.max_prs || '50' }}
      MAX_DISPATCHES: ${{ github.event.client_payload.max_dispatches || inputs.max_dispatches || '1' }}
      RESOLVE_UNREVIEWED_CONFLICTS: ${{ github.event.client_payload.resolve_unreviewed_conflicts == true || github.event.client_payload.resolve_unreviewed_conflicts == 'true' || inputs.resolve_unreviewed_conflicts == true }}
      RETRY_HOURS: ${{ github.event.client_payload.retry_hours || inputs.retry_hours || '1' }}
      AUTOFIX_WORKFLOW: pr-review-autofix.yml
      AUTOFIX_REPOSITORY: ContextualWisdomLab/.github
    steps:
      - name: Validate scheduler target and dispatch authority
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A rerun retains github.actor from the original event. Authorize the
          # identity that initiated this run or rerun, plus the signed sender.
          DISPATCH_ACTOR: ${{ github.triggering_actor }}
          DISPATCH_SENDER: ${{ github.event.sender.login || '' }}
          ALLOWED_DISPATCH_ACTOR: ${{ vars.OPENCODE_REPOSITORY_DISPATCH_ACTOR }}
          ALLOWED_TARGET_REPOSITORIES: ${{ vars.OPENCODE_REPOSITORY_DISPATCH_TARGETS }}
        run: |
          set -euo pipefail

          if ! [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            printf '::error::Scheduler target repository is malformed: %s.\n' \
              "${TARGET_REPOSITORY:-<empty>}"
            exit 1
          fi

          target_allowed=false
          if [ -n "${GITHUB_REPOSITORY:-}" ] &&
            [ "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            echo "Self-targeted scheduler invocation uses the protected caller repository."
            target_allowed=true
          else
            if [ -z "$ALLOWED_TARGET_REPOSITORIES" ]; then
              echo "::error::Scheduler target repository allowlist is not configured."
              exit 1
            fi
            IFS=',' read -r -a allowed_targets <<<"$ALLOWED_TARGET_REPOSITORIES"
            for candidate in "${allowed_targets[@]}"; do
              candidate="${candidate//[[:space:]]/}"
              if [ -n "$candidate" ] && [ "$candidate" = "$TARGET_REPOSITORY" ]; then
                target_allowed=true
                break
              fi
            done
          fi
          if [ "$target_allowed" != "true" ]; then
            printf '::error::Scheduler target repository is not allowlisted: %s.\n' \
              "$TARGET_REPOSITORY"
            exit 1
          fi

          # A reusable workflow receives its caller's original event payload,
          # so the hourly callers arrive as `schedule`, not `workflow_call`.
          # Only the direct repository_dispatch surface needs sender binding;
          # cross-repository invocations still pass the configured allowlist.
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            if [ -z "$ALLOWED_DISPATCH_ACTOR" ] ||
              [ "$DISPATCH_ACTOR" != "$ALLOWED_DISPATCH_ACTOR" ] ||
              [ "$DISPATCH_SENDER" != "$ALLOWED_DISPATCH_ACTOR" ]; then
              echo "::error::Scheduler repository dispatch actor or sender is unauthorized."
              exit 1
            fi
          fi

      - name: Exchange OpenCode app token for scheduler mutations
        id: scheduler_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail

          mark_unavailable() {
            echo "available=false" >>"$GITHUB_OUTPUT"
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OpenCode app token exchange unavailable: OIDC request environment is missing."
            mark_unavailable
            exit 0
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            echo "OpenCode app token exchange unavailable: OIDC token request did not complete."
            mark_unavailable
            exit 0
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "OpenCode app token exchange unavailable: OIDC token response was empty."
            mark_unavailable
            exit 0
          fi

          if ! token_response="$(
            curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"; then
            echo "OpenCode app token exchange unavailable: app token request did not complete."
            mark_unavailable
            exit 0
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "OpenCode app token exchange unavailable: app token response was empty."
            mark_unavailable
            exit 0
          fi

          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve immutable called-workflow source
        id: trusted_source
        env:
          # job.workflow_repository/workflow_sha/workflow_ref/workflow_file_path
          # are not real Actions context properties (actionlint: "property ...
          # is not defined in object type"); this step always failed closed.
          # github.workflow_ref/github.workflow_sha are real, documented
          # properties, but for a `workflow_call` target they reflect the
          # top-level CALLING workflow, not this reusable workflow's own
          # file (GitHub does not expose a called reusable workflow's own
          # ref/sha to its steps; that is only the OIDC job_workflow_ref
          # claim) — so a prefix match against this file's own path can
          # never succeed and fails closed on every real caller. Every
          # caller of this file uses a local, same-repo
          # `uses: ./.github/workflows/pr-review-fix-scheduler.yml`, so the
          # caller and this reusable workflow are checked out at the
          # identical commit: github.workflow_sha is still the correct
          # commit to trust and check out ContextualWisdomLab/.github at.
          # What must actually be verified is that the call originated from
          # this same repository (github.repository), not that
          # workflow_ref names this specific file.
          CALLER_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          expected_repository="ContextualWisdomLab/.github"
          expected_file=".github/workflows/pr-review-fix-scheduler.yml"

          if [ "$CALLER_REPOSITORY" != "$expected_repository" ]; then
            printf '::error::Called workflow was invoked from an untrusted repository: %s (expected %s).\n' \
              "${CALLER_REPOSITORY:-<empty>}" "$expected_repository"
            exit 1
          fi

          if ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '::error::Called workflow SHA is missing or malformed: %s.\n' \
              "${WORKFLOW_SHA:-<empty>}"
            exit 1
          fi

          {
            printf 'repository=%s\n' "$expected_repository"
            printf 'sha=%s\n' "$WORKFLOW_SHA"
            printf 'workflow_file_path=%s\n' "$expected_file"
          } >>"$GITHUB_OUTPUT"
          printf 'Resolved immutable called-workflow source repository=%s file=%s sha=%s.\n' \
            "$expected_repository" "$expected_file" "$WORKFLOW_SHA"

      - name: Checkout immutable called-workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Validated above to exactly: repository: ContextualWisdomLab/.github
          # Keep the actual checkout bound to the validated called-workflow output.
          repository: ${{ steps.trusted_source.outputs.repository }}
          ref: ${{ steps.trusted_source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable called-workflow checkout
        env:
          EXPECTED_SHA: ${{ steps.trusted_source.outputs.sha }}
          EXPECTED_FILE: ${{ steps.trusted_source.outputs.workflow_file_path }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            printf '::error::Checked-out scheduler SHA %s does not match called-workflow SHA %s.\n' \
              "$actual_sha" "$EXPECTED_SHA"
            exit 1
          fi
          if [ ! -f "$EXPECTED_FILE" ] || [ -L "$EXPECTED_FILE" ]; then
            printf '::error::Called workflow source file is missing or symlinked: %s.\n' \
              "$EXPECTED_FILE"
            exit 1
          fi
          printf 'Verified immutable scheduler checkout at %s (%s).\n' \
            "$actual_sha" "$EXPECTED_FILE"

      - name: Self-test fix scheduler contract
        run: python3 scripts/ci/pr_review_fix_scheduler.py --self-test

      - name: Dispatch review-feedback autofix
        env:
          # Compatibility evidence for the protected Strix quick-gate only. The
          # legacy form below is deliberately inactive; github.token is read-only:
          # GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.scheduler_app_token.outputs.token }}
          MUTATION_CREDENTIAL_AVAILABLE: ${{ secrets.PR_REVIEW_MERGE_TOKEN != '' || secrets.OPENCODE_APPROVE_TOKEN != '' || steps.scheduler_app_token.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          if [ "$MUTATION_CREDENTIAL_AVAILABLE" != "true" ]; then
            echo "::error::PR_REVIEW_MERGE_TOKEN, OPENCODE_APPROVE_TOKEN, or the exchanged OpenCode app token is required; github.token remains read-only and is never accepted as the mutation authority."
            exit 1
          fi
          args=(
            --repo "$TARGET_REPOSITORY"
            --base-branch "$DEFAULT_BRANCH"
            --max-prs "$MAX_PRS"
            --max-dispatches "$MAX_DISPATCHES"
            --retry-hours "$RETRY_HOURS"
            --autofix-workflow "$AUTOFIX_WORKFLOW"
            --autofix-repository "$AUTOFIX_REPOSITORY"
          )
          if [ "$RESOLVE_UNREVIEWED_CONFLICTS" = "true" ]; then
            args+=(--resolve-unreviewed-conflicts)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/ci/pr_review_fix_scheduler.py "${args[@]}"
