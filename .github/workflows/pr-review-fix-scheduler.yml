name: PR Review Fix Scheduler

on:
  workflow_call:
    inputs:
      dry_run:
        description: Print actions without dispatching autofix
        required: false
        default: false
        type: boolean
      max_prs:
        description: Maximum open PRs to inspect
        required: false
        default: "50"
        type: string
      max_dispatches:
        description: Maximum autofix runs to dispatch
        required: false
        default: "1"
        type: string
      target_repository:
        description: Repository to scan, in owner/name form; defaults to the caller repository
        required: false
        default: ""
        type: string
      retry_hours:
        description: Minimum hours before redispatching autofix for the same head
        required: false
        default: "24"
        type: string
      autofix_workflow:
        description: Autofix workflow file to dispatch
        required: false
        default: "pr-review-autofix.yml"
        type: string
      autofix_repository:
        description: Repository that owns the autofix workflow
        required: false
        default: "ContextualWisdomLab/.github"
        type: string
      base_branch:
        description: Base branch to scan; defaults to the caller repository default branch
        required: false
        default: ""
        type: string
      canonical_ref:
        description: Ref of ContextualWisdomLab/.github to use for scheduler code
        required: false
        default: "main"
        type: string
  repository_dispatch:
    types: [pr-review-fix-scheduler]
  pull_request:
    branches: [main]
    types: [synchronize]
  schedule:
    - cron: "23 */2 * * *"

concurrency:
  group: central-pr-review-fix-scheduler-${{ github.event.client_payload.target_repository || inputs.target_repository || vars.PR_REVIEW_FIX_TARGET_REPOSITORY || github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair-pr650-review-feedback:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.number == 650
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'claude/fast-mlsirm-pr-review-mt2e1z'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: claude/fast-mlsirm-pr-review-mt2e1z
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded current-head review repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/opencode-review-dispatch.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          metadata_step_name = (
              "      - name: Exchange OpenCode app token for target repository metadata reads\n"
          )
          metadata_start = workflow.index(metadata_step_name)
          metadata_end = workflow.index("\n      - name:", metadata_start + len(metadata_step_name))
          metadata_step = workflow[metadata_start:metadata_end]
          unbounded_curl = "            curl -fsS \\\n"
          bounded_curl = (
              "            curl -fsS \\\n"
              "              --connect-timeout 5 \\\n"
              "              --max-time 20 \\\n"
          )
          if metadata_step.count("--connect-timeout 5") == 0:
              if metadata_step.count(unbounded_curl) != 2:
                  raise SystemExit("expected exactly two unbounded metadata token-exchange curl calls")
              metadata_step = metadata_step.replace(unbounded_curl, bounded_curl)
          if metadata_step.count("--connect-timeout 5") != 2 or metadata_step.count("--max-time 20") != 2:
              raise SystemExit("metadata token-exchange curl bounds are incomplete")
          workflow = workflow[:metadata_start] + metadata_step + workflow[metadata_end:]

          old_collector = '''          collect_successful_r_cmd_check_evidence() {
            local output_file="$1"
            if ! gh pr checks "$PR_NUMBER" \\
              --repo "$GH_REPOSITORY" \\
              --json name,state,workflow >"$output_file"; then
              return 1
            fi
            python3 "$GITHUB_WORKSPACE/scripts/ci/r_coverage_peer_gate.py" \\
              require-check \\
              --checks-json "$output_file" >/dev/null
          }
'''
          new_collector = '''          collect_successful_r_cmd_check_evidence() {
            local output_file="$1"
            local checks_status
            if gh pr checks "$PR_NUMBER" \\
              --repo "$GH_REPOSITORY" \\
              --json name,state,workflow >"$output_file"; then
              checks_status=0
            else
              checks_status=$?
            fi
            case "$checks_status" in
              0 | 1 | 8) ;;
              *) return 1 ;;
            esac
            if ! jq -e 'type == "array"' "$output_file" >/dev/null; then
              return 1
            fi
            python3 "$GITHUB_WORKSPACE/scripts/ci/r_coverage_peer_gate.py" \\
              require-check \\
              --checks-json "$output_file" >/dev/null
          }
'''
          if old_collector in workflow:
              workflow = workflow.replace(old_collector, new_collector, 1)
          elif new_collector not in workflow:
              raise SystemExit("R CMD peer-check collector did not match the expected current-head contract")
          workflow_path.write_text(workflow, encoding="utf-8")

          tests_path = Path("tests/test_required_workflow_queue_contract.py")
          tests = tests_path.read_text(encoding="utf-8")
          marker = "def test_opencode_review_token_exchange_and_r_peer_gate_are_bounded()"
          if marker not in tests:
              tests += '''


def test_opencode_review_token_exchange_and_r_peer_gate_are_bounded() -> None:
    """Token exchange and R peer-check collection have deterministic bounds."""
    workflow = workflow_text("opencode-review-dispatch.yml")
    initial_exchange = workflow_step(
        workflow,
        "Exchange OpenCode app token for target repository metadata reads",
    )

    assert initial_exchange.count("--connect-timeout 5") == 2
    assert initial_exchange.count("--max-time 20") == 2

    collector = workflow.split(
        "collect_successful_r_cmd_check_evidence() {", 1
    )[1].split("\n          }", 1)[0]
    assert 'case "$checks_status" in' in collector
    assert "0 | 1 | 8)" in collector
    assert "checks_status=$?" in collector
    assert "jq -e 'type == \\\"array\\\"'" in collector
    assert collector.index("jq -e") < collector.index("r_coverage_peer_gate.py")
'''
              tests_path.write_text(tests, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/opencode-review-dispatch.yml").read_text(encoding="utf-8")
          metadata = workflow.split(
              "      - name: Exchange OpenCode app token for target repository metadata reads\n", 1
          )[1].split("\n      - name:", 1)[0]
          assert metadata.count("--connect-timeout 5") == 2
          assert metadata.count("--max-time 20") == 2
          collector = workflow.split(
              "collect_successful_r_cmd_check_evidence() {", 1
          )[1].split("\n          }", 1)[0]
          assert "0 | 1 | 8)" in collector
          assert "checks_status=$?" in collector
          assert "jq -e 'type == \"array\"'" in collector
          compile(
              Path("tests/test_required_workflow_queue_contract.py").read_text(encoding="utf-8"),
              "tests/test_required_workflow_queue_contract.py",
              "exec",
          )
          PY

          git fetch --no-tags origin main
          git show origin/main:.github/workflows/pr-review-fix-scheduler.yml \
            > .github/workflows/pr-review-fix-scheduler.yml
          git diff --check

      - name: Commit verified repair and remove repair scaffold
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/opencode-review-dispatch.yml \
            tests/test_required_workflow_queue_contract.py \
            .github/workflows/pr-review-fix-scheduler.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No PR 650 repair remained to commit."
            exit 0
          fi
          git commit -m "fix(review): bound token exchange and preserve check JSON"
          git push origin HEAD:claude/fast-mlsirm-pr-review-mt2e1z

  dispatch-review-fixes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
      TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository || inputs.target_repository || vars.PR_REVIEW_FIX_TARGET_REPOSITORY || github.repository }}
      DEFAULT_BRANCH: ${{ github.event.client_payload.base_branch || inputs.base_branch || vars.PR_REVIEW_FIX_BASE_BRANCH || github.event.repository.default_branch }}
      DRY_RUN: ${{ github.event.client_payload.dry_run == true || github.event.client_payload.dry_run == 'true' || inputs.dry_run == true }}
      MAX_PRS: ${{ github.event.client_payload.max_prs || inputs.max_prs || '50' }}
      MAX_DISPATCHES: ${{ github.event.client_payload.max_dispatches || inputs.max_dispatches || '1' }}
      RETRY_HOURS: ${{ github.event.client_payload.retry_hours || inputs.retry_hours || '24' }}
      AUTOFIX_WORKFLOW: pr-review-autofix.yml
      AUTOFIX_REPOSITORY: ContextualWisdomLab/.github
      CANONICAL_REF: main
    steps:
      - name: Checkout canonical scheduler
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ env.CANONICAL_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Self-test fix scheduler contract
        run: python3 scripts/ci/pr_review_fix_scheduler.py --self-test

      - name: Dispatch review-feedback autofix
        run: |
          set -euo pipefail
          args=(
            --repo "$TARGET_REPOSITORY"
            --base-branch "$DEFAULT_BRANCH"
            --max-prs "$MAX_PRS"
            --max-dispatches "$MAX_DISPATCHES"
            --retry-hours "$RETRY_HOURS"
            --autofix-workflow "$AUTOFIX_WORKFLOW"
            --autofix-repository "$AUTOFIX_REPOSITORY"
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 scripts/ci/pr_review_fix_scheduler.py "${args[@]}"
