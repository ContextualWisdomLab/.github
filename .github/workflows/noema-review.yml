name: Required Noema Review
run-name: >-
  Required Noema Review ${{ github.event.client_payload.target_repository ||
  github.event.pull_request.base.repo.full_name || github.repository }}#${{
  github.event.client_payload.pr_number || github.event.pull_request.number ||
  'event' }}@${{
  github.event.client_payload.pr_head_sha || github.event.pull_request.head.sha ||
  github.sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  # Default-branch-only retry entrypoint; no caller-selected workflow ref.
  repository_dispatch:
    types: [noema-review]

permissions:
  contents: read
  pull-requests: read
  checks: read
  id-token: write

jobs:
  admit-current-head:
    if: >-
      github.event_name == 'repository_dispatch'
      || (
        github.event_name == 'pull_request_target'
        && github.event.action != 'closed'
        && github.event.action != 'converted_to_draft'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.live_head.outputs.admitted }}
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || github.token }}
      TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.event.client_payload.target_repository || github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || '' }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.pr_head_sha || '' }}
    steps:
      - name: Admit only the exact live Noema head
        id: live_head
        run: |
          set -euo pipefail
          echo "admitted=false" >>"$GITHUB_OUTPUT"
          if ! [[ "$TARGET_REPOSITORY" =~ ^ContextualWisdomLab/[A-Za-z0-9_.-]+$ ]] ||
            ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
            ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Noema admission rejected malformed pull request metadata."
            exit 1
          fi
          live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
          live_state="$(jq -r '.state // empty' <<<"$live_pr")"
          if [ "${live_head,,}" != "${EXPECTED_HEAD_SHA,,}" ] || [ "$live_state" != "open" ]; then
            echo "::notice::Noema admission retired a stale trigger before review queue entry."
            exit 0
          fi
          echo "admitted=true" >>"$GITHUB_OUTPUT"
          echo "Exact live Noema head admitted for ${TARGET_REPOSITORY}#${PR_NUMBER}."

  cancel-closed-pr-runs:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'closed' || github.event.action == 'converted_to_draft')
    runs-on: ubuntu-24.04
    # Bound this job well short of GitHub's 360-minute platform default. Its
    # only step is a single-repository, status-filtered gh api --paginate
    # list-and-cancel sweep (up to 3 passes x 5 statuses), no branch update
    # or merge -- lighter than pr-review-merge-scheduler.yml's scan-pr-queue
    # job (PR #1702), which got timeout-minutes: 30 for a comparable
    # single-repo scan that also dispatches a review and updates a branch.
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
      INACTIVE_PR_NUMBER: ${{ github.event.pull_request.number }}
      INACTIVE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_ACTION: ${{ github.event.action }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel queued and running Noema reviews for the inactive pull request
        shell: bash
        run: |
          set -euo pipefail

          live_target_matches() {
            local live_pr_json live_state live_draft live_head
            if ! live_pr_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${INACTIVE_PR_NUMBER}" 2>/tmp/noema-inactive-gh-error)"; then
              echo "::warning::Noema inactive-PR cleanup could not verify the live pull request; leaving runs unchanged." >&2
              return 1
            fi
            live_state="$(jq -r '.state // ""' <<<"$live_pr_json")"
            live_draft="$(jq -r '.draft // false' <<<"$live_pr_json")"
            live_head="$(jq -r '.head.sha // ""' <<<"$live_pr_json")"
            [ "$live_head" = "$INACTIVE_PR_HEAD_SHA" ] && {
              { [ "$PR_ACTION" = "closed" ] && [ "$live_state" = "closed" ]; } ||
                { [ "$PR_ACTION" = "converted_to_draft" ] && [ "$live_state" = "open" ] && [ "$live_draft" = "true" ]; }
            }
          }

          # cancel_runs prints the number of runs it matched for $1's status
          # on stdout (its only stdout output) so the multi-pass loop below
          # can tell whether a pass found anything; all human-facing log
          # lines go to stderr so they don't pollute that count.
          #
          # The runs list is scoped to this repository, not to a specific
          # workflow file: noema-review.yml runs against sibling
          # repositories only through the organization's required-workflow
          # ruleset (README.md's "또 같이" / "siblings call it" section) and
          # is never itself committed to those repositories, so
          # actions/workflows/noema-review.yml/runs is not guaranteed to
          # resolve there -- GitHub's List repository workflows family
          # enumerates workflow files that exist in that repository's own
          # tree. actions/runs plus the run object's own `.path` field is
          # this repo's own already-proven pattern for this exact cross-repo
          # cleanup (see strix.yml's identical job).
          # Status stays a server-side filter -- bounding each query to only
          # the currently active runs -- rather than an unfiltered
          # per-workflow fetch filtered client-side, since noema-review.yml
          # is this org's central, highest-volume review workflow and an
          # unbounded history walk on every PR close is a real rate-limit
          # and latency risk here.
          cancel_runs() {
            local status="$1"
            if ! live_target_matches; then
              echo "::notice::Noema inactive-PR cleanup target changed; leaving runs unchanged." >&2
              echo 0
              return 0
            fi
            local runs_url="repos/${TARGET_REPOSITORY}/actions/runs?status=${status}&per_page=100"
            local runs_json
            if ! runs_json="$(gh api --paginate "$runs_url" 2>/tmp/noema-close-gh-error)"; then
              echo "::warning::Noema close cleanup could not inspect ${TARGET_REPOSITORY}; leaving runs unchanged." >&2
              sed 's/^/  /' /tmp/noema-close-gh-error >&2 || true
              echo 0
              return 0
            fi
            local run_ids
            # PR-scoped by two independent, OR'd signals -- neither alone
            # covers every trigger this job serves. The rendered
            # display_title (this workflow's own run-name, embedding the
            # target repository/PR number/head SHA) is this workflow's
            # original signal, and stays reliable for repository_dispatch
            # and workflow_run triggers. But GitHub does not consistently
            # render run-name for an organization-required-workflow
            # pull_request_target run materialized in a sibling repository
            # (Devin Review, PR #1507: "Sibling Noema runs evade
            # cancellation") -- `name` and `display_title` can both collapse
            # to the bare workflow name and the plain PR title there,
            # matching neither the old `.name ==` filter nor the
            # display_title prefix below. GitHub's own `pull_requests[]`
            # array on the run object closes that gap: it is populated for
            # this workflow's pull_request_target runs because the
            # noema-review job itself only ever processes same-repository,
            # non-fork pull requests (its own `if:` requires
            # `head.repo.full_name == github.repository`), so the cross-fork
            # "empty pull_requests[]" caveat that rules this field out
            # elsewhere in this org's tooling does not apply here. Neither
            # signal alone is sufficient for every trigger type, so this
            # matches on either one -- never a bare head_sha, which two
            # different open PRs can share (e.g. a duplicate PR opened from
            # the same branch against another target) and which would let
            # closing one cancel the other's still-needed run. Matching by
            # PR number rather than by the closed PR's current head SHA also
            # means historical-head runs from earlier pushes to this same PR
            # are still caught. `.path` pins the workflow identity in place
            # of the old `.name ==` filter: unlike `.name` (which, like
            # display_title, only carries the bare workflow name for a
            # required-workflow-ruleset run), `.path` was independently
            # confirmed stable across both native and sibling contexts.
            if ! run_ids="$(jq -r --arg pr "$INACTIVE_PR_NUMBER" \
              --arg current "$CURRENT_RUN_ID" --arg target "$TARGET_REPOSITORY" '
                .workflow_runs[]
                | select((.id | tostring) != $current)
                | select(.path == ".github/workflows/noema-review.yml")
                | select((.name // "") | startswith("Required Noema Review"))
                | select(
                    ((.display_title // "") | startswith("Required Noema Review " + $target + "#" + $pr + "@"))
                    or ((.pull_requests // []) | any(.number == ($pr | tonumber)))
                  )
                | .id
              ' <<<"$runs_json")"; then
              echo "::warning::Noema close cleanup received invalid run data for ${TARGET_REPOSITORY}; leaving runs unchanged." >&2
              echo 0
              return 0
            fi
            local matched=0
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              if ! live_target_matches; then
                echo "::notice::Noema inactive-PR cleanup target changed before cancellation; leaving runs unchanged." >&2
                break
              fi
              matched=$((matched + 1))
              if gh api --method POST "repos/${TARGET_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>/tmp/noema-close-cancel-error; then
                echo "Cancelled Noema run ${run_id} in ${TARGET_REPOSITORY} for inactive PR #${INACTIVE_PR_NUMBER}." >&2
              else
                echo "::warning::Noema close cleanup could not cancel run ${run_id}; it may have finished or the token lacks Actions write access." >&2
                sed 's/^/  /' /tmp/noema-close-cancel-error >&2 || true
              fi
            done <<<"$run_ids"
            echo "$matched"
          }

          # A run can transition between the five active statuses between
          # one status's fetch and the next (e.g. it is "requested" when the
          # already-fetched "queued" list was read, then becomes "queued"
          # moments later, after this pass has already moved past checking
          # "queued") -- a real GitHub Actions run lifecycle race, not a
          # hypothetical. A single sequential sweep can let such a run
          # escape cancellation entirely. Re-scan every active status for up
          # to three passes: always run at least two full passes (a run that
          # slips through every status query in pass 1 has, by definition,
          # settled into a checkable status by the time pass 2 queries it
          # again), and only skip the third when both prior passes matched
          # nothing, bounding the retries so API flakiness cannot loop this
          # forever.
          max_passes=3
          pass=1
          found_any=0
          while [ "$pass" -le "$max_passes" ]; do
            pass_matches=0
            for active_status in queued in_progress requested waiting pending; do
              matched="$(cancel_runs "$active_status")"
              pass_matches=$((pass_matches + matched))
            done
            echo "Noema close cleanup pass ${pass}/${max_passes} matched ${pass_matches} run(s) across active statuses." >&2
            if [ "$pass_matches" -gt 0 ]; then
              found_any=1
            fi
            if [ "$pass" -ge 2 ] && [ "$pass_matches" -eq 0 ] && [ "$found_any" -eq 0 ]; then
              break
            fi
            pass=$((pass + 1))
          done

  cancel-superseded-noema-runs:
    # A genuinely separate job with NO concurrency block of its own,
    # deliberately -- Devin Review caught that the earlier version of this
    # fix put the equivalent cleanup logic inside a STEP of the noema-review
    # job below, which now carries its own job-level concurrency group with
    # cancel-in-progress: false. That trapped the cleanup logic in the exact
    # group it needed to unblock: a new push's own noema-review job (cleanup
    # step included) cannot even start while an older push's noema-review
    # job is still active in that group, and Noema inference deliberately
    # has no wall-clock deadline (docs/product-goal-directive.md #8), so a
    # long-running older-head review could block the current head's review
    # from ever starting. Splitting the cleanup into its own job with no
    # concurrency restriction closes that: it can run immediately regardless
    # of what the noema-review job's group is doing, live-reverify the
    # current head, and cancel a genuinely superseded active run via a
    # direct API call -- freeing the group for the current push's own
    # noema-review job. Mirrors strix.yml's cancel-superseded-pr-runs and
    # opencode-review.yml's cancel-superseded-opencode-review-runs, both of
    # which already use this exact shape.
    #
    # Also runs for repository_dispatch (Devin Review, keyverse#128-adjacent
    # finding on this same PR): the noema-review job's concurrency group is
    # scoped by target-repo + PR number regardless of which of the two
    # trigger types produced it, so a pull_request_target push and a
    # repository_dispatch retry for the SAME PR share one group. Before this
    # fix, this cleanup job's `if:` only matched pull_request_target, so a
    # repository_dispatch retry had no path to ever cancel a genuinely stale
    # active run blocking it -- it would sit pending indefinitely behind an
    # old-head review that (by design) has no wall-clock deadline.
    # repository_dispatch needs no extra trust check here the way
    # pull_request_target's `head.repo.full_name` check does: only a
    # principal with this repository's write access can send it at all
    # (GitHub's own authorization boundary for the dispatches endpoint), the
    # same trust level noema-review's own `if:` already extends it below.
    if: >-
      (
        github.event_name == 'pull_request_target'
        && github.event.action != 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Same fallback chain as noema-review's own env block below, so both
      # jobs agree on target/PR/head for either trigger type.
      TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.event.client_payload.target_repository || github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || '' }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.pr_head_sha || '' }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      # CURRENT_RUN_ID is only ever a valid run identifier under the repo
      # this run actually executes in -- distinct from TARGET_REPOSITORY
      # whenever a repository_dispatch retry names a sibling. Used below by
      # the eviction-detection step, which inspects THIS run's own jobs.
      CURRENT_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Skip dispatch events without a resolvable PR number
        if: env.PR_NUMBER == ''
        run: |
          echo "::warning::Noema supersede-cleanup received a repository_dispatch event with no client_payload.pr_number; skipping cleanup for this run."

      - name: Reject a stale trigger before scanning for superseded runs
        id: validate_target
        if: env.PR_NUMBER != ''
        run: |
          set -euo pipefail
          # TARGET_REPOSITORY now reaches this job from repository_dispatch's
          # sender-controlled client_payload.target_repository too (this same
          # diff extended this job to that trigger). The noema-review job
          # below (see its own reviewer-credential-selection step further
          # down this file) validates this exact format before using
          # TARGET_REPOSITORY for anything (Devin Review,
          # completeness-vs-original-findings lens, 2026-09-03); apply the
          # identical check here for consistency. A malformed value is
          # rejected outright regardless of which credential ends up being
          # used against it below.
          if [[ ! "$TARGET_REPOSITORY" =~ ^ContextualWisdomLab/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Noema supersede-cleanup target repository must belong to ContextualWisdomLab; observed ${TARGET_REPOSITORY:-<empty>}."
            exit 1
          fi
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Noema supersede-cleanup trigger did not provide a canonical lowercase exact head SHA."
            exit 1
          fi
          echo "repository_name=${TARGET_REPOSITORY#*/}" >>"$GITHUB_OUTPUT"

      - name: Resolve a repository-scoped credential for cross-repository cleanup
        # github.token above is scoped to THIS run's own repository. For a
        # same-repository pull_request_target run -- the dominant path, since
        # this workflow reaches sibling repositories only through the
        # required-workflow ruleset, which runs the job IN that target
        # repository's own context -- TARGET_REPOSITORY equals
        # github.repository and github.token already has everything the
        # cancel step below needs. It is only for a repository_dispatch retry
        # naming a SIBLING target_repository (the "Default-branch-only retry
        # entrypoint" above) that github.token cannot see that repository at
        # all: every gh api call below would fail to authenticate, and the
        # added repository_dispatch cleanup coverage would silently cancel
        # nothing (Devin Review, 2026-09-03: "Sibling retry cleanup never
        # authenticates") -- defeating the retry entrypoint's exact purpose
        # of unblocking a stuck sibling review stuck behind a genuinely stale
        # run (Noema inference has no wall-clock deadline by design, see this
        # job's own header comment).
        #
        # Checked in the SAME priority order as noema-review's own "Select
        # fail-closed Noema reviewer credential" step below (PAT, then the
        # GitHub App): a PAT is already a usable token, no minting needed; a
        # configured App mints a repository-scoped installation token the
        # same way the noema-review job already does for its own cross-repo
        # publication calls, narrowed to just the two permissions this job's
        # API calls use. OIDC (that step's third, lowest-priority fallback)
        # is deliberately NOT mirrored here -- replicating its token
        # -exchange call into this separate ancillary job would add real
        # complexity to a file that has already had heavy adversarial
        # scrutiny today, for the one credential mode this org has never
        # actually used in production (confirmed live: every observed run
        # selects source=github-app). An OIDC-only configuration degrades
        # the same way an unconfigured one does: warn and skip cross
        # -repository cancellation (Devin Review, 2026-09-03: "Supported
        # retries cannot unblock stale reviews" -- accepted its own
        # suggested fallback of documenting unsupported modes rather than
        # fully replicating every credential path).
        if: env.PR_NUMBER != '' && env.TARGET_REPOSITORY != github.repository
        id: cleanup_credential
        env:
          NOEMA_REVIEW_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || '' }}
          NOEMA_GITHUB_APP_CLIENT_ID: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID || '' }}
          NOEMA_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY || '' }}
        run: |
          set -euo pipefail
          if [ -n "${NOEMA_REVIEW_TOKEN:-}" ]; then
            echo "source=pat" >>"$GITHUB_OUTPUT"
          elif [ -n "${NOEMA_GITHUB_APP_CLIENT_ID:-}" ] && [ -n "${NOEMA_GITHUB_APP_PRIVATE_KEY:-}" ]; then
            echo "source=github-app" >>"$GITHUB_OUTPUT"
          else
            echo "source=none" >>"$GITHUB_OUTPUT"
            echo "::warning::Noema supersede-cleanup has no repository-scoped credential usable for cross-repository target ${TARGET_REPOSITORY} (NOEMA_REVIEW_TOKEN or the NOEMA_GITHUB_APP_* App credential is required; an OIDC-only configuration is not supported for cross-repository retries); skipping cross-repository cancellation for this run."
          fi

      - name: Mint repository-scoped token for cross-repository Noema cleanup
        # Only for the github-app credential source -- a PAT (source=pat) is
        # already a usable token and needs no minting. continue-on-error is
        # deliberate: reaching this step only proves the App secrets are
        # CONFIGURED, not that this specific mint call will succeed -- the
        # App may not be installed on this particular sibling repository
        # (installation scope is independent of whether the org-level
        # client-id/private-key secrets exist), or the exchange may hit a
        # transient API error. Without continue-on-error, that failure would
        # fail this step outright and (via the next step's implicit
        # success() gate) skip the cancel step below and mark this whole job
        # "failure" -- contradicting the "warn and skip, never fail the job
        # over an ancillary cleanup path" design this job states everywhere
        # else (Devin Review, 2026-09-03: this step was the one place that
        # didn't honor it). steps.cleanup_app_token.outcome (unlike
        # .conclusion, which continue-on-error masks back to "success")
        # still reports the raw "failure" result, which the next two steps
        # key off instead of outputs.token being merely empty.
        if: env.PR_NUMBER != '' && env.TARGET_REPOSITORY != github.repository && steps.cleanup_credential.outputs.source == 'github-app'
        id: cleanup_app_token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ steps.validate_target.outputs.repository_name }}
          permission-actions: write
          permission-pull-requests: read

      - name: Warn when cross-repository token minting failed
        if: env.PR_NUMBER != '' && env.TARGET_REPOSITORY != github.repository && steps.cleanup_credential.outputs.source == 'github-app' && steps.cleanup_app_token.outcome == 'failure'
        run: |
          echo "::warning::Noema supersede-cleanup could not mint a repository-scoped token for cross-repository target ${TARGET_REPOSITORY} (App secrets are configured, but the mint call itself failed -- possibly not installed on that repository); skipping cross-repository cancellation for this run."

      - name: Cancel superseded Noema runs after live-head validation
        # Gated on the actually-usable credential, not just a credential
        # being configured: a same-repository run never needed one at all
        # (first disjunct); a PAT is immediately usable once configured
        # (second disjunct); a GitHub App must have actually succeeded at
        # minting a token (third disjunct) -- source=github-app alone would
        # let a mint failure through to here with an empty GH_TOKEN below.
        if: env.PR_NUMBER != '' && (env.TARGET_REPOSITORY == github.repository || steps.cleanup_credential.outputs.source == 'pat' || steps.cleanup_app_token.outcome == 'success')
        env:
          GH_TOKEN: ${{ (env.TARGET_REPOSITORY == github.repository) && github.token || (steps.cleanup_credential.outputs.source == 'pat') && secrets.NOEMA_REVIEW_TOKEN || steps.cleanup_app_token.outputs.token }}
        run: |
          set -euo pipefail
          declare -A seen=()
          cancelled=0
          # Two passes, not one: the five status queries below are five
          # separate, unsynchronized API calls, so a run's status can change
          # between them within a single pass (e.g. a run this pass already
          # scanned as "queued" transitions to "in_progress" moments later,
          # or a genuinely stale run only becomes visible in a status bucket
          # this pass already queried, before this pass finishes). The
          # second pass re-scans all five statuses to catch anything that
          # changed during the first pass's own execution window; `seen`
          # keeps it idempotent against runs the first pass already
          # cancelled. This does mean every invocation issues up to 10
          # `gh api --paginate` calls (Devin Review, 2026-09-03) -- flagged
          # as a cost concern, not a correctness one; not reduced to a
          # single pass in this change since removing it without concretely
          # verifying the TOCTOU window it guards against cannot recur risks
          # reintroducing exactly the race pass 2 was presumably added to
          # close (no commit message documents the original intent).
          for pass in 1 2; do
            for active_status in queued in_progress requested waiting pending; do
              if ! runs_json="$(gh api --paginate "repos/${TARGET_REPOSITORY}/actions/runs?status=${active_status}&per_page=100")"; then
                echo "::warning::Could not inspect ${active_status} Noema runs for superseded heads."
                continue
              fi
              # See the close-cleanup job's matching comment above cancel_runs's
              # own selector for the full rationale: display_title only
              # renders this workflow's PR/head-bearing run-name reliably for
              # a native trigger, so a sibling-repository required-workflow
              # run is additionally matched via GitHub's own pull_requests[]
              # array (populated here because noema-review only ever
              # processes same-repository, non-fork pull requests), and
              # `.path` pins workflow identity where `.name` cannot. The
              # live-head exclusion below is independently reinforced with a
              # direct `.head_sha` comparison -- the run object's own
              # head_sha field, unlike display_title, is populated and
              # accurate regardless of run-name rendering, so it protects the
              # current run even when its display_title never rendered a
              # matching "@$head" suffix to exclude by.
              if ! run_ids="$(jq -r --arg pr "$PR_NUMBER" --argjson current "$CURRENT_RUN_ID" \
                --arg target "$TARGET_REPOSITORY" --arg head "$EXPECTED_HEAD_SHA" '
                  .workflow_runs[]
                  | select(.id < $current)
                  | select(.path == ".github/workflows/noema-review.yml")
                  | select((.name // "") | startswith("Required Noema Review"))
                  | select(
                      ((.display_title // "") | startswith("Required Noema Review " + $target + "#" + $pr + "@"))
                      or ((.pull_requests // []) | any(.number == ($pr | tonumber)))
                    )
                  | select(((.display_title // "") | endswith("@" + $head)) | not)
                  | select(((.head_sha // "") | ascii_downcase) != ($head | ascii_downcase))
                  | .id
                ' <<<"$runs_json")"; then
                echo "::warning::Could not parse ${active_status} Noema runs for superseded heads."
                continue
              fi
              while IFS= read -r run_id; do
                [ -n "$run_id" ] || continue
                [ -z "${seen[$run_id]:-}" ] || continue
                # A transient failure here (rate limit, network blip) must
                # never crash this step under set -e: this is a housekeeping
                # cleanup, and letting an ancillary API hiccup fail the whole
                # job would block a perfectly valid, live-head review over
                # something unrelated to it. Treat "cannot verify" the same
                # as "verified stale": stop cancelling rather than risk a
                # wrong cancellation, but let the job continue.
                if ! live_head="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/tmp/noema-supersede-live-head-error)"; then
                  echo "::warning::Noema cleanup could not re-verify the live PR head before cancelling run ${run_id}; stopping cleanup rather than risking a wrong cancellation." >&2
                  sed 's/^/  /' /tmp/noema-supersede-live-head-error >&2 || true
                  exit 0
                fi
                if [ "${live_head,,}" != "${EXPECTED_HEAD_SHA,,}" ]; then
                  echo "::notice::Noema cleanup stopped because the PR head advanced."
                  exit 0
                fi
                # seen is set ONLY on success (or below, once a fresh lookup
                # independently proves the run already terminal) -- Devin
                # Review, 2026-09-03: marking a run seen unconditionally here
                # let a merely-transient cancel failure (rate limit, network
                # blip) suppress that run for the rest of this pass AND the
                # second pass, leaving a genuinely stale run uncancelled and
                # able to block the current head's review indefinitely.
                if gh api --method POST "repos/${TARGET_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>/tmp/noema-supersede-cancel-error; then
                  seen[$run_id]=1
                  cancelled=$((cancelled + 1))
                  echo "Cancelled superseded Noema run ${run_id} for PR #${PR_NUMBER}."
                elif status_after_failed_cancel="$(gh api "repos/${TARGET_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null)" \
                  && [ "$status_after_failed_cancel" = "completed" ]; then
                  seen[$run_id]=1
                  echo "Noema run ${run_id} for PR #${PR_NUMBER} was already terminal (status: completed) when cancellation failed; not retrying." >&2
                else
                  echo "::warning::Could not cancel superseded Noema run ${run_id}; leaving it eligible for a later pass rather than assuming it is already terminal." >&2
                  sed 's/^/  /' /tmp/noema-supersede-cancel-error >&2 || true
                fi
              done <<<"$run_ids"
            done
            echo "Superseded Noema cleanup pass ${pass}/2 complete."
          done
          echo "Cancelled ${cancelled} superseded Noema run(s) after live-head validation."

      - name: Detect a current-push review evicted from its pending slot
        # GitHub's own single-pending-slot rule for this group (independent
        # of cancel-in-progress, see noema-review's own comment below) keeps
        # at most one running plus one pending job -- and evicts whichever
        # job is currently pending the instant a NEW trigger requests the
        # slot. That is safe when arrival order matches push order (the
        # newest push simply displaces an older, no-longer-relevant pending
        # one), but webhook delivery is not guaranteed FIFO: a delayed,
        # out-of-order trigger for an OLDER head can itself arrive after
        # this exact push's own job started pending, evicting THIS push's
        # job instead. An evicted job never executes a single step --
        # including noema-review's own "Reject a stale trigger" check below
        # -- so nothing else in this workflow observes it, and the PR's
        # current head can silently end up with no in-flight or completed
        # Noema review at all.
        #
        # This step makes that failure mode loud rather than fixing it
        # outright: full automated recovery needs either granting this
        # pull_request_target-triggered job `contents: write` to
        # self-dispatch a retry (docs/CWL-MASTER-CONTEXT.md's binding
        # conventions caution against widening a pull_request_target job's
        # permissions), or adding a new `workflow_dispatch` trigger (usable
        # with the `actions: write` already held here) plus matching
        # if:/env changes in at least three more places in this file.
        # Neither has been designed and adversarially verified yet, so this
        # pass only detects and flags the gap; see docs/doctoring/ for the
        # tracked follow-up design record.
        #
        # A cancelled sibling conclusion is NOT, on its own, proof of this
        # eviction -- 3-lens adversarial verification of this same step
        # (2026-09-03) independently converged on one gap, and a later Devin
        # Review pass on the fix caught a second one it missed: cancelled is
        # also produced by THREE routine, non-buggy paths in this same
        # workflow -- a LATER run's own cancel-superseded-noema-runs
        # cancelling THIS run's ACTIVE noema-review job because a newer push
        # legitimately supersedes it, cancel-closed-pr-runs cancelling this
        # run because the PR simply closed, and (the one adversarial
        # verification missed) GitHub's own single-pending-slot rule
        # legitimately evicting THIS run's still-PENDING job the instant a
        # genuinely newer push claims the slot -- the routine, common case
        # the whole mechanism exists to support. All three leave conclusion
        # "cancelled" exactly like a real out-of-order eviction, but none of
        # them need an alert. Disambiguated below on three signals: `started_at`
        # (a job cancelled while genuinely ACTIVE has one; an evicted-while-
        # pending job does not), a live re-check of whether the PR is still
        # open (a closed PR needs no review regardless of why its run was
        # cancelled), and -- the piece that closes the pending-eviction
        # ambiguity -- whether the PR's live head still equals THIS run's
        # own head (if the live head has already moved on, some newer push
        # already has its own review in flight; only a live head that still
        # matches this run's own head, with the job never having started,
        # is consistent with the genuine out-of-order race this check
        # targets). Not fully closed even so: a second run for the IDENTICAL
        # head (webhook redelivery, or a repository_dispatch retry for the
        # same PR/head, which shares this same concurrency group by design)
        # produces the same signature and still alarms -- a second Devin
        # Review pass on this fix found and accepted that gap as pre-existing
        # (not a regression this fix introduced) and consistent with this
        # step's deliberate fail-open-to-alarm posture elsewhere; closing it
        # would need also checking whether another active/queued noema-review
        # run already exists for this exact head before alarming, not
        # attempted here.
        # `if: always()` so a run that exits early above (the cancel loop's
        # own defensive `exit 0`s) still gets checked; every gh api/jq call
        # below degrades to a warning on failure, never fails the job.
        #
        # This step makes two gh api calls that need two DIFFERENT repository
        # scopes, so no single GH_TOKEN value is correct for both -- a
        # step-level override that applied to the whole step broke the first
        # call for exactly the case it was meant to fix the second call for
        # (adversarial re-verification of this same patch, 2026-09-03).
        # The first lookup below uses CURRENT_REPOSITORY (this run's own
        # jobs; a run ID is only ever valid under the repository it actually
        # executed in) with the step's default GH_TOKEN -- plain
        # github.token, which already covers CURRENT_REPOSITORY regardless
        # of trigger type. The second lookup further down (the PR live-head
        # re-check) needs TARGET_REPOSITORY instead -- that one asks about
        # the PR itself, which lives in the target repository, not this
        # run's own -- so it explicitly overrides GH_TOKEN inline to
        # CLEANUP_CROSS_REPO_TOKEN (the same credential resolved above for
        # the cancel step -- the PAT directly, or the minted App token) when
        # one is usable, falling back to the ambient github.token when
        # TARGET_REPOSITORY equals CURRENT_REPOSITORY (the dominant
        # same-repository path, where CLEANUP_CROSS_REPO_TOKEN stays empty).
        # Without that inline override the second call would silently fail
        # to authenticate on every cross-repository repository_dispatch
        # retry, falling to the "unknown" branch below and unconditionally
        # reporting a false eviction alarm on the routine, common case this
        # step's own comments describe (a newer push legitimately claiming
        # the single pending slot) -- defeating this step's whole
        # three-lens-adversarially-verified disambiguation purpose.
        if: always() && env.PR_NUMBER != ''
        env:
          CLEANUP_CROSS_REPO_TOKEN: ${{ (steps.cleanup_credential.outputs.source == 'pat' && secrets.NOEMA_REVIEW_TOKEN) || steps.cleanup_app_token.outputs.token }}
        run: |
          set -euo pipefail
          if ! jobs_json="$(gh api "repos/${CURRENT_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}/jobs")"; then
            echo "::warning::Could not inspect this run's own jobs to check for a pending-slot eviction of the sibling noema-review job."
            exit 0
          fi
          if ! sibling_json="$(jq -c '[.jobs[] | select(.name == "noema-review")] | first // empty' <<<"$jobs_json")"; then
            echo "::warning::Could not parse this run's job list to check for a pending-slot eviction."
            exit 0
          fi
          if [ -z "$sibling_json" ]; then
            echo "::warning::No 'noema-review' job entry found in this run's own job list; cannot check for a pending-slot eviction."
            exit 0
          fi
          sibling_conclusion="$(jq -r '.conclusion // "pending"' <<<"$sibling_json")"
          sibling_started_at="$(jq -r '.started_at // ""' <<<"$sibling_json")"
          if [ "$sibling_conclusion" != "cancelled" ]; then
            echo "Sibling noema-review job for PR #${PR_NUMBER} resolved as '${sibling_conclusion}'; no eviction detected."
            exit 0
          fi
          if [ -n "$sibling_started_at" ]; then
            echo "Sibling noema-review job for PR #${PR_NUMBER} was cancelled after it had already started (started_at=${sibling_started_at}) -- a routine supersession by a newer push or a PR-close cancel, not a pending-slot eviction (an evicted job never starts). Nothing to flag."
            exit 0
          fi
          # PR state alone is not enough: when a newer push legitimately
          # replaces THIS push's still-pending job (the routine, common
          # case -- GitHub's single-pending-slot rule working exactly as
          # intended), the PR stays open and this run's own sibling still
          # shows cancelled-without-started_at, which the checks above
          # cannot tell apart from a genuine out-of-order eviction (Devin
          # Review, 2026-09-03: "normal pushes trigger eviction alarms").
          # The live head is what actually distinguishes them: a live head
          # that has moved past EXPECTED_HEAD_SHA proves some newer push
          # already superseded this one -- routine, no alert -- while a
          # live head that STILL equals EXPECTED_HEAD_SHA means this run's
          # own head is still the PR's current head, yet its review never
          # ran, which only a genuine eviction (or something equally worth
          # a human's attention) explains.
          if ! pr_json="$(GH_TOKEN="${CLEANUP_CROSS_REPO_TOKEN:-$GH_TOKEN}" gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" --jq '{state: .state, head_sha: .head.sha}' 2>/tmp/noema-eviction-pr-state-error)"; then
            echo "::warning::Sibling noema-review job for PR #${PR_NUMBER} was cancelled without ever starting, but the PR's live state could not be re-checked before flagging it -- reporting the eviction anyway since it cannot be ruled out as benign." >&2
            sed 's/^/  /' /tmp/noema-eviction-pr-state-error >&2 || true
            pr_state="unknown"
            pr_live_head="unknown"
          else
            pr_state="$(jq -r '.state' <<<"$pr_json")"
            pr_live_head="$(jq -r '.head_sha' <<<"$pr_json")"
          fi
          if [ "$pr_state" = "closed" ]; then
            echo "Sibling noema-review job for PR #${PR_NUMBER} was cancelled without ever starting, but the PR is now closed -- no review is needed regardless of why the run was cancelled. Nothing to flag."
            exit 0
          fi
          if [ "$pr_live_head" != "unknown" ] && [ "${pr_live_head,,}" != "${EXPECTED_HEAD_SHA,,}" ]; then
            echo "Sibling noema-review job for PR #${PR_NUMBER} was cancelled without ever starting, but the PR's live head (${pr_live_head}) has already moved past this run's own head (${EXPECTED_HEAD_SHA}) -- a routine supersession by a newer push claiming the pending slot as intended, not the out-of-order eviction this check targets. Nothing to flag."
            exit 0
          fi
          # The two branches above only suppress the alarm; they never assert
          # the live head was actually confirmed equal. On the unknown-state
          # fetch-failure path (pr_live_head still "unknown" here, never
          # replaced by a real value) the message below must not claim that
          # equality was verified -- it wasn't, the fetch simply failed, and
          # this branch reports anyway because failure defaults to alarming
          # rather than silently swallowing a possible real eviction (Devin
          # Review fresh-eyes lens, 2026-09-03: the single shared message
          # previously overclaimed a confirmed match even on this path).
          if [ "$pr_live_head" = "unknown" ]; then
            echo "::error::This push's own noema-review job was cancelled without ever starting (no started_at), and the PR's live state/head could not be re-checked to rule out routine supersession by a newer push -- reporting the eviction anyway since it cannot be confirmed benign. The current head may now have no in-flight or completed Noema review. Manually re-trigger (mention the review agent, or push an empty commit) if the required check stays stuck."
          else
            echo "::error::This push's own noema-review job was cancelled without ever starting (no started_at), PR #${PR_NUMBER} is still ${pr_state}, and its live head still equals this run's own head (${EXPECTED_HEAD_SHA}) -- ruling out routine supersession by a newer push. Most likely evicted from the concurrency group's single pending slot by a later-arriving, out-of-order trigger for a different head, not a genuine supersession this job's own cancel loop above performed (that loop only cancels ACTIVE runs it live-reverified as stale). The current head may now have no in-flight or completed Noema review. Manually re-trigger (mention the review agent, or push an empty commit) if the required check stays stuck."
          fi

  noema-review:
    name: noema-review
    needs: [admit-current-head]
    runs-on: ubuntu-24.04
    # Only an exact live head reaches this group -- admit-current-head above
    # already re-fetches the PR's live head via `gh api` and only sets
    # admitted=true (the `if:` this job requires) when it still matches what
    # this run was triggered with, so a stale/superseded trigger never
    # reaches this job body at all. An earlier version of this fix (before
    # that live re-verification existed here) instead disabled
    # cancel-in-progress entirely to stop a delayed/out-of-order event from
    # killing a newer run's job -- see git history on this block for that
    # reasoning. That workaround is now redundant: since only a live-head-
    # verified run can start, cancel-in-progress: true is safe again and
    # matches opencode-review.yml's identical `required-` prefixed,
    # admitted-gated pattern. Keeping concurrency at the job level prevents a
    # delayed stale event from cancelling the current workflow before
    # admit-current-head can reject it.
    concurrency:
      group: >-
        required-noema-review-${{
        github.event.pull_request.base.repo.full_name ||
        github.event.client_payload.target_repository || github.repository }}-${{
        github.event.pull_request.number ||
        github.event.client_payload.pr_number || github.run_id }}
      cancel-in-progress: true
    # No job-level timeout-minutes here, deliberately. This job's "Prepare
    # Noema model verdict" step calls two_phase.py's call_llm synchronously
    # via the contextual-orchestrator gateway and blocks on the model's own
    # response -- a job-level wall-clock bound here would cap the model's
    # reasoning/tool-use time directly, which docs/product-goal-directive.md
    # #8 prohibits ("Model timeout은 application·Agent·Gateway 공통 상한 없이
    # 기본 null이다"; "OpenCode·Strix·Noema의 모델당 2시간 이상을 수용한다"). An
    # earlier version of this job set timeout-minutes: 210, reasoning it gave
    # that step "the same ~180-minute allowance" PR #1707 gave an unrelated
    # step -- that reasoning was wrong: #1707's poll_deadline_epoch bounds a
    # step that polls GitHub for whether a *separately triggered* review
    # process has posted a verdict yet (an async external wait), not a step
    # that itself runs the model synchronously. Any fixed cap on a job whose
    # body IS the synchronous model call is exactly the fixed inference-time
    # cap the policy forbids. See
    # docs/doctoring/autofix-and-noema-review-model-job-timeout-removal.md.
    if: >-
      needs.admit-current-head.outputs.admitted == 'true'
      && (
        github.event_name == 'repository_dispatch'
        || (
        github.event_name == 'pull_request_target'
        && github.event.action != 'closed'
        && github.event.action != 'converted_to_draft'
        && github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    permissions:
      # The Actions-cancel write permission moved with the cancellation
      # logic to cancel-superseded-noema-runs above; this job no longer
      # calls that API.
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.event.client_payload.target_repository || github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || '' }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.pr_head_sha || '' }}
    steps:
      - name: Skip events without pull request context
        if: env.PR_NUMBER == ''
        run: |
          echo "::notice::Noema review skipped: no pull request number is associated with this event."

      - name: Resolve trusted Noema review source ref
        if: env.PR_NUMBER != ''
        id: trusted_source
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          GITHUB_CONTEXT_JSON: ${{ toJSON(github) }}
        run: |
          set -euo pipefail
          python3 <<'PY' >>"$GITHUB_OUTPUT"
          import json
          import os
          import re
          import sys

          try:
              job_context = json.loads(os.environ.get("JOB_CONTEXT_JSON") or "{}")
              github_context = json.loads(os.environ.get("GITHUB_CONTEXT_JSON") or "{}")
          except json.JSONDecodeError as exc:
              print(f"::error::Could not parse GitHub workflow context JSON: {exc}", file=sys.stderr)
              raise SystemExit(1)

          trusted_repository = str(
              job_context.get("workflow_repository") or "ContextualWisdomLab/.github"
          ).strip()
          trusted_ref = str(
              job_context.get("workflow_sha") or github_context.get("workflow_sha") or ""
          ).strip()
          workflow_ref = str(
              job_context.get("workflow_ref") or github_context.get("workflow_ref") or ""
          ).strip()

          if not trusted_ref:
              trusted_ref = "main"
              prefix = "ContextualWisdomLab/.github/.github/workflows/noema-review.yml@"
              if workflow_ref.startswith(prefix):
                  trusted_ref = workflow_ref.split("@", 1)[1]

          if trusted_repository != "ContextualWisdomLab/.github":
              print("::error::Trusted Noema workflow repository resolved outside ContextualWisdomLab/.github.", file=sys.stderr)
              raise SystemExit(1)
          if not re.fullmatch(r"[0-9a-fA-F]{40}|refs/[^\s]+|[A-Za-z0-9._/-]+", trusted_ref):
              print("::error::Trusted Noema workflow ref resolved to an invalid value.", file=sys.stderr)
              raise SystemExit(1)

          print(f"repository={trusted_repository}")
          print(f"ref={trusted_ref}")
          PY

      - name: Materialize trusted Noema review gate
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_REF: ${{ steps.trusted_source.outputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TRUSTED_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Trusted Noema source ref must resolve to the immutable workflow commit SHA before archive materialization."
            exit 1
          fi
          trusted_archive="${RUNNER_TEMP}/trusted-noema-source.tar.gz"
          api_url="${GITHUB_API_URL:-https://api.github.com}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o "$trusted_archive" \
            "${api_url}/repos/ContextualWisdomLab/.github/tarball/${TRUSTED_SOURCE_REF}"
          tar -xzf "$trusted_archive" -C "$GITHUB_WORKSPACE" --strip-components=1
          test -f scripts/ci/noema_review_gate.py

      - name: Reject a stale trigger before credential or model setup
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Noema trigger did not provide a canonical lowercase exact head SHA."
            exit 1
          fi
          live_head="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "${live_head,,}" != "${EXPECTED_HEAD_SHA,,}" ]; then
            echo "::error::Noema trigger is stale; expected ${EXPECTED_HEAD_SHA}, observed ${live_head}."
            exit 1
          fi

      - name: Select fail-closed Noema reviewer credential
        if: env.PR_NUMBER != ''
        id: noema_credential
        env:
          NOEMA_GITHUB_APP_CLIENT_ID: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID || '' }}
          NOEMA_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY || '' }}
          TOKEN_EXCHANGE_URL: ${{ vars.NOEMA_TOKEN_EXCHANGE_URL || vars.NOEMA_EXCHANGE_URL || '' }}
          NOEMA_REVIEW_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_REPOSITORY" =~ ^ContextualWisdomLab/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Noema target repository must belong to ContextualWisdomLab; observed ${TARGET_REPOSITORY:-<empty>}."
            exit 1
          fi
          repository_name="${TARGET_REPOSITORY#*/}"
          echo "repository=$repository_name" >>"$GITHUB_OUTPUT"

          if [ -n "${NOEMA_REVIEW_TOKEN:-}" ]; then
            echo "source=pat" >>"$GITHUB_OUTPUT"
            echo "::notice::Noema reviewer using the NOEMA_REVIEW_TOKEN secret fallback identity."
            exit 0
          fi

          if [ -n "${NOEMA_GITHUB_APP_CLIENT_ID:-}" ] && [ -n "${NOEMA_GITHUB_APP_PRIVATE_KEY:-}" ]; then
            echo "source=github-app" >>"$GITHUB_OUTPUT"
            echo "::notice::Noema reviewer will mint a repository-scoped cwl-noema-review installation token."
            exit 0
          fi

          if [ -n "${TOKEN_EXCHANGE_URL:-}" ]; then
            echo "source=oidc" >>"$GITHUB_OUTPUT"
            echo "::notice::Noema reviewer will use the configured OIDC app-token exchange."
            exit 0
          fi

          echo "::error::Noema reviewer credential is unconfigured: set NOEMA_GITHUB_APP_CLIENT_ID with NOEMA_GITHUB_APP_PRIVATE_KEY, NOEMA_REVIEW_TOKEN, or NOEMA_TOKEN_EXCHANGE_URL. Review cannot be skipped."
          exit 1

      - name: Mint repository-scoped Noema GitHub App token
        if: env.PR_NUMBER != '' && steps.noema_credential.outputs.source == 'github-app'
        id: noema_github_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ steps.noema_credential.outputs.repository }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: write
          permission-security-events: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Exchange Noema app token through OIDC
        if: env.PR_NUMBER != '' && steps.noema_credential.outputs.source == 'oidc'
        id: noema_oidc_token
        env:
          OIDC_AUDIENCE: ${{ vars.NOEMA_OIDC_AUDIENCE || 'cwl-noema-review' }}
          TOKEN_EXCHANGE_URL: ${{ vars.NOEMA_TOKEN_EXCHANGE_URL || vars.NOEMA_EXCHANGE_URL || '' }}
        run: |
          set -euo pipefail

          fail_unavailable() {
            local message="$1"
            echo "::error::$message"
            exit 1
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            fail_unavailable "Noema app token exchange unavailable: OIDC request environment is missing."
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            fail_unavailable "Noema app token exchange unavailable: OIDC token request did not complete."
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            fail_unavailable "Noema app token exchange unavailable: OIDC token response was empty."
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${oidc_token}" \
              --data "$(jq -cn --arg target_repository "$TARGET_REPOSITORY" '{target_repository:$target_repository}')" \
              "${TOKEN_EXCHANGE_URL}"
          )"; then
            fail_unavailable "Noema app token exchange unavailable: app token request did not complete."
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            fail_unavailable "Noema app token exchange unavailable: app token response was empty."
          fi

          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Validate current pull request head
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || steps.noema_github_app_token.outputs.token || steps.noema_oidc_token.outputs.token }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Noema expected head must be a full commit SHA."
            exit 1
          fi
          pull_request_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_state="$(jq -r '.state // empty' <<<"$pull_request_json")"
          live_head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request_json")"
          if [ "$live_state" != "open" ] || [ "${live_head_sha,,}" != "${EXPECTED_HEAD_SHA,,}" ]; then
            printf '::error::Noema review target is closed or stale. expected head=%s; live state=%s head=%s.\n' \
              "$EXPECTED_HEAD_SHA" "${live_state:-missing}" "${live_head_sha:-missing}"
            exit 1
          fi

      - name: Resolve Noema target repository visibility
        if: env.PR_NUMBER != ''
        id: target_visibility
        env:
          GH_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || steps.noema_github_app_token.outputs.token || steps.noema_oidc_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Noema target visibility cannot be resolved without the selected repository-scoped reviewer token."
            exit 1
          fi
          visibility=""
          for target_visibility_attempt in 1 2 3 4 5 6; do
            if visibility="$(
              gh api "/repos/${TARGET_REPOSITORY}" --jq '.visibility // (if .private then "private" else "public" end)'
            )"; then
              break
            fi
            visibility=""
            if [ "$target_visibility_attempt" -lt 6 ]; then
              echo "Repository visibility lookup failed (attempt ${target_visibility_attempt}/6), possibly a transient GitHub API rate limit; retrying after backoff." >&2
              sleep "$(( target_visibility_attempt * 5 ))"
            fi
          done
          case "$visibility" in
            private|internal)
              echo "require_zdr=true" >>"$GITHUB_OUTPUT"
              echo "::notice::Private/internal target requires an attested ZDR-only review pool."
              ;;
            public)
              echo "require_zdr=false" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Noema target repository visibility is missing or unsupported: ${visibility:-<empty>}."
              exit 1
              ;;
          esac

      - name: Provision contextual-orchestrator review sidecar
        if: env.PR_NUMBER != ''
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXTUAL_ORCHESTRATOR_REQUIRE_ZDR: ${{ steps.target_visibility.outputs.require_zdr }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/contextual_orchestrator_review_sidecar.sh"

      - name: Prepare Noema model verdict
        if: env.PR_NUMBER != ''
        id: noema_prepare
        env:
          GH_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || steps.noema_github_app_token.outputs.token || steps.noema_oidc_token.outputs.token }}
          NOEMA_REVIEW_TOKEN_SOURCE: ${{ steps.noema_credential.outputs.source == 'pat' && 'noema-review-pat' || steps.noema_credential.outputs.source == 'github-app' && 'noema-review-github-app' || 'noema-review-app-oidc' }}
          NOEMA_REVIEW_ACTOR: ${{ steps.noema_github_app_token.outputs['app-slug'] && format('{0}[bot]', steps.noema_github_app_token.outputs['app-slug']) || '' }}
          NOEMA_REVIEW_INSTALLATION_ID: ${{ steps.noema_github_app_token.outputs['installation-id'] }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No pull request number was available for this event; skipping."
            echo "prepared=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Noema reviewer credential selection succeeded but no token was minted; review cannot prepare a verdict."
            exit 1
          fi
          if [ -z "${CONTEXTUAL_ORCHESTRATOR_BASE_URL:-}" ] || [ -z "${CONTEXTUAL_ORCHESTRATOR_TOKEN_FILE:-}" ]; then
            echo "::error::contextual-orchestrator review sidecar must be provisioned before Noema LLM review."
            exit 1
          fi
          source "$GITHUB_WORKSPACE/scripts/ci/load_contextual_orchestrator_token.sh"
          export NOEMA_LLM_API_URL="${CONTEXTUAL_ORCHESTRATOR_BASE_URL%/}/v1/chat/completions"
          export NOEMA_LLM_MODEL="orchestrator/free"
          export NOEMA_LLM_API_KEY="${CONTEXTUAL_ORCHESTRATOR_TOKEN}"
          export NOEMA_LLM_VIA_ORCHESTRATOR=1
          verdict_file="${RUNNER_TEMP}/noema-verdict-envelope.json"
          rm -f "$verdict_file"
          python3 "$GITHUB_WORKSPACE/.github/actions/noema-review/two_phase.py"             --repo "$TARGET_REPOSITORY"             --pr-number "$PR_NUMBER"             --expected-head "$EXPECTED_HEAD_SHA"             --prepare-verdict-file "$verdict_file"
          if [ -f "$verdict_file" ]; then
            echo "prepared=true" >>"$GITHUB_OUTPUT"
          else
            echo "prepared=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Noema model phase produced no publishable envelope; publication is skipped."
          fi

      - name: Refresh repository-scoped Noema GitHub App token for publication
        if: env.PR_NUMBER != '' && steps.noema_prepare.outputs.prepared == 'true' && steps.noema_credential.outputs.source == 'github-app'
        id: noema_github_app_publication_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ steps.noema_credential.outputs.repository }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: write
          permission-security-events: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Publish prepared Noema verdict on the exact live head
        if: env.PR_NUMBER != '' && steps.noema_prepare.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ steps.noema_credential.outputs.source == 'pat' && secrets.NOEMA_REVIEW_TOKEN || steps.noema_credential.outputs.source == 'github-app' && steps.noema_github_app_publication_token.outputs.token || steps.noema_credential.outputs.source == 'oidc' && steps.noema_oidc_token.outputs.token || '' }}
          NOEMA_REVIEW_TOKEN_SOURCE: ${{ steps.noema_credential.outputs.source == 'pat' && 'noema-review-pat' || steps.noema_credential.outputs.source == 'github-app' && 'noema-review-github-app-refresh' || steps.noema_credential.outputs.source == 'oidc' && 'noema-review-app-oidc' || '' }}
          NOEMA_REVIEW_ACTOR: ${{ steps.noema_github_app_publication_token.outputs['app-slug'] && format('{0}[bot]', steps.noema_github_app_publication_token.outputs['app-slug']) || '' }}
          NOEMA_REVIEW_INSTALLATION_ID: ${{ steps.noema_github_app_publication_token.outputs['installation-id'] }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Noema publication has no credential for the explicitly selected reviewer source; refusing any GITHUB_TOKEN or author fallback."
            exit 1
          fi
          verdict_file="${RUNNER_TEMP}/noema-verdict-envelope.json"
          if [ ! -f "$verdict_file" ]; then
            echo "::error::Noema prepared-verdict output claimed success but its private envelope is missing."
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/.github/actions/noema-review/two_phase.py"             --repo "$TARGET_REPOSITORY"             --pr-number "$PR_NUMBER"             --expected-head "$EXPECTED_HEAD_SHA"             --publish-verdict-file "$verdict_file"
