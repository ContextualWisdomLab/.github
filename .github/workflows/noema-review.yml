name: Required Noema Review
run-name: >-
  Required Noema Review ${{ github.event.client_payload.target_repository ||
  github.event.pull_request.base.repo.full_name || github.repository }}#${{
  github.event.client_payload.pr_number || github.event.pull_request.number ||
  github.event.workflow_run.pull_requests[0].number || 'event' }}@${{
  github.event.client_payload.pr_head_sha || github.event.pull_request.head.sha ||
  github.event.workflow_run.head_sha || github.sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_run:
    workflows: ["Required OpenCode Review", "Strix Security Scan"]
    types: [completed]
  # Default-branch-only retry entrypoint; no caller-selected workflow ref.
  repository_dispatch:
    types: [noema-review]

concurrency:
  group: >-
    noema-review-${{
    github.event.pull_request.base.repo.full_name ||
    github.event.client_payload.target_repository || github.repository }}-${{
    github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number ||
    github.event.client_payload.pr_number ||
    github.run_id }}-${{
    github.event.client_payload.pr_head_sha || github.event.pull_request.head.sha ||
    github.event.workflow_run.pull_requests[0].head.sha || github.sha }}-${{
    github.event_name == 'workflow_run' &&
    github.event.workflow_run.conclusion == 'cancelled' &&
    format('cancelled-{0}', github.run_id) ||
    'actionable' }}
  # A cancelled upstream review emits a workflow_run event whose Noema job is
  # skipped. It must not cancel a live same-head Noema review before skipping.
  cancel-in-progress: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}

permissions:
  contents: read
  pull-requests: read
  checks: read
  id-token: write

jobs:
  cancel-closed-pr-runs:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
      CLOSED_PR_NUMBER: ${{ github.event.pull_request.number }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel queued and running Noema reviews for the closed pull request
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen=()
          for pass in 1 2 3; do
            pass_matches=0
            for active_status in queued in_progress requested waiting pending; do
              runs_url="repos/${TARGET_REPOSITORY}/actions/runs?status=${active_status}&per_page=100"
              if ! runs_json="$(gh api --paginate "$runs_url")"; then
                echo "::warning::Noema close cleanup could not inspect ${TARGET_REPOSITORY}; leaving this status unchanged."
                continue
              fi
              run_ids="$(jq -r --arg pr "$CLOSED_PR_NUMBER" \
                --arg current "$CURRENT_RUN_ID" --arg target "$TARGET_REPOSITORY" '
                  .workflow_runs[]
                  | select((.id | tostring) != $current)
                  | select(.path == ".github/workflows/noema-review.yml")
                  | select((.name // "") | startswith("Required Noema Review"))
                  | select(
                      ((.display_title // "") | startswith("Required Noema Review " + $target + "#" + $pr + "@"))
                      or ((.pull_requests // []) | any(.number == ($pr | tonumber)))
                    )
                  | .id
                ' <<<"$runs_json")"
              while IFS= read -r run_id; do
                [ -n "$run_id" ] || continue
                [ -z "${seen[$run_id]:-}" ] || continue
                seen[$run_id]=1
                pass_matches=$((pass_matches + 1))
                if ! gh api --method POST "repos/${TARGET_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null; then
                  echo "::warning::Noema close cleanup could not cancel run ${run_id}."
                fi
              done <<<"$run_ids"
            done
            [ "$pass" -lt 2 ] || [ "$pass_matches" -gt 0 ] || break
          done

  prepare:
    name: noema-review / prepare
    runs-on: ubuntu-latest
    # Preparation is network/API work only; model serving is isolated in the
    # two bounded candidate jobs below.
    timeout-minutes: 30
    outputs:
      require_zdr: ${{ steps.target_visibility.outputs.require_zdr }}
      review_ready: ${{ steps.seal.outputs.review_ready }}
    if: >-
      github.event_name == 'repository_dispatch'
      || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion != 'cancelled'
      )
      || (
        github.event_name == 'pull_request_target'
        && github.event.action != 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.event.client_payload.target_repository || github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pr_number || '' }}
      EXPECTED_HEAD: ${{ github.event.client_payload.pr_head_sha || github.event.pull_request.head.sha || github.event.workflow_run.pull_requests[0].head.sha || '' }}
    steps:
      - name: Skip events without pull request context
        if: env.PR_NUMBER == ''
        run: |
          echo "::notice::Noema review skipped: no pull request number is associated with this event."

      - name: Resolve trusted Noema review source ref
        if: env.PR_NUMBER != ''
        id: trusted_source
        env:
          JOB_CONTEXT_JSON: ${{ toJSON(job) }}
          GITHUB_CONTEXT_JSON: ${{ toJSON(github) }}
        run: |
          set -euo pipefail
          python3 <<'PY' >>"$GITHUB_OUTPUT"
          import json
          import os
          import re
          import sys

          try:
              job_context = json.loads(os.environ.get("JOB_CONTEXT_JSON") or "{}")
              github_context = json.loads(os.environ.get("GITHUB_CONTEXT_JSON") or "{}")
          except json.JSONDecodeError as exc:
              print(f"::error::Could not parse GitHub workflow context JSON: {exc}", file=sys.stderr)
              raise SystemExit(1)

          trusted_repository = str(
              job_context.get("workflow_repository") or "ContextualWisdomLab/.github"
          ).strip()
          trusted_ref = str(
              job_context.get("workflow_sha") or github_context.get("workflow_sha") or ""
          ).strip()
          workflow_ref = str(
              job_context.get("workflow_ref") or github_context.get("workflow_ref") or ""
          ).strip()

          if not trusted_ref:
              trusted_ref = "main"
              prefix = "ContextualWisdomLab/.github/.github/workflows/noema-review.yml@"
              if workflow_ref.startswith(prefix):
                  trusted_ref = workflow_ref.split("@", 1)[1]

          if trusted_repository != "ContextualWisdomLab/.github":
              print("::error::Trusted Noema workflow repository resolved outside ContextualWisdomLab/.github.", file=sys.stderr)
              raise SystemExit(1)
          if not re.fullmatch(r"[0-9a-fA-F]{40}|refs/[^\s]+|[A-Za-z0-9._/-]+", trusted_ref):
              print("::error::Trusted Noema workflow ref resolved to an invalid value.", file=sys.stderr)
              raise SystemExit(1)

          print(f"repository={trusted_repository}")
          print(f"ref={trusted_ref}")
          PY

      - name: Materialize trusted Noema review gate
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_REF: ${{ steps.trusted_source.outputs.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$TRUSTED_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Trusted Noema source ref must resolve to the immutable workflow commit SHA before archive materialization."
            exit 1
          fi
          trusted_archive="${RUNNER_TEMP}/trusted-noema-source.tar.gz"
          api_url="${GITHUB_API_URL:-https://api.github.com}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o "$trusted_archive" \
            "${api_url}/repos/ContextualWisdomLab/.github/tarball/${TRUSTED_SOURCE_REF}"
          tar -xzf "$trusted_archive" -C "$GITHUB_WORKSPACE" --strip-components=1
          test -f scripts/ci/noema_review_gate.py

      - name: Reject a stale trigger before credential or model setup
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Noema trigger did not provide a canonical lowercase exact head SHA."
            exit 1
          fi
          live_head="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "${live_head,,}" != "${EXPECTED_HEAD,,}" ]; then
            echo "::error::Noema trigger is stale; expected ${EXPECTED_HEAD}, observed ${live_head}."
            exit 1
          fi

      - name: Select fail-closed Noema reviewer credential
        if: env.PR_NUMBER != ''
        id: noema_credential
        env:
          NOEMA_GITHUB_APP_CLIENT_ID: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID || '' }}
          NOEMA_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY || '' }}
          TOKEN_EXCHANGE_URL: ${{ vars.NOEMA_TOKEN_EXCHANGE_URL || vars.NOEMA_EXCHANGE_URL || '' }}
          NOEMA_REVIEW_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_REPOSITORY" =~ ^ContextualWisdomLab/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Noema target repository must belong to ContextualWisdomLab; observed ${TARGET_REPOSITORY:-<empty>}."
            exit 1
          fi
          repository_name="${TARGET_REPOSITORY#*/}"
          echo "repository=$repository_name" >>"$GITHUB_OUTPUT"

          if [ -n "${NOEMA_REVIEW_TOKEN:-}" ]; then
            echo "source=pat" >>"$GITHUB_OUTPUT"
            echo "::notice::Noema reviewer using the NOEMA_REVIEW_TOKEN secret fallback identity."
            exit 0
          fi

          if [ -n "${NOEMA_GITHUB_APP_CLIENT_ID:-}" ] && [ -n "${NOEMA_GITHUB_APP_PRIVATE_KEY:-}" ]; then
            echo "source=github-app" >>"$GITHUB_OUTPUT"
            echo "::notice::Noema reviewer will mint a repository-scoped cwl-noema-review installation token."
            exit 0
          fi

          if [ -n "${TOKEN_EXCHANGE_URL:-}" ]; then
            echo "source=oidc" >>"$GITHUB_OUTPUT"
            echo "::notice::Noema reviewer will use the configured OIDC app-token exchange."
            exit 0
          fi

          echo "::error::Noema reviewer credential is unconfigured: set NOEMA_GITHUB_APP_CLIENT_ID with NOEMA_GITHUB_APP_PRIVATE_KEY, NOEMA_REVIEW_TOKEN, or NOEMA_TOKEN_EXCHANGE_URL. Review cannot be skipped."
          exit 1

      - name: Mint repository-scoped Noema GitHub App token
        if: env.PR_NUMBER != '' && steps.noema_credential.outputs.source == 'github-app'
        id: noema_github_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ steps.noema_credential.outputs.repository }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: write
          permission-security-events: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Exchange Noema app token through OIDC
        if: env.PR_NUMBER != '' && steps.noema_credential.outputs.source == 'oidc'
        id: noema_oidc_token
        env:
          OIDC_AUDIENCE: ${{ vars.NOEMA_OIDC_AUDIENCE || 'cwl-noema-review' }}
          TOKEN_EXCHANGE_URL: ${{ vars.NOEMA_TOKEN_EXCHANGE_URL || vars.NOEMA_EXCHANGE_URL || '' }}
        run: |
          set -euo pipefail

          fail_unavailable() {
            local message="$1"
            echo "::error::$message"
            exit 1
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            fail_unavailable "Noema app token exchange unavailable: OIDC request environment is missing."
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            fail_unavailable "Noema app token exchange unavailable: OIDC token request did not complete."
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            fail_unavailable "Noema app token exchange unavailable: OIDC token response was empty."
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${oidc_token}" \
              --data "$(jq -cn --arg target_repository "$TARGET_REPOSITORY" '{target_repository:$target_repository}')" \
              "${TOKEN_EXCHANGE_URL}"
          )"; then
            fail_unavailable "Noema app token exchange unavailable: app token request did not complete."
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            fail_unavailable "Noema app token exchange unavailable: app token response was empty."
          fi

          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Resolve Noema target repository visibility
        if: env.PR_NUMBER != ''
        id: target_visibility
        env:
          GH_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || steps.noema_github_app_token.outputs.token || steps.noema_oidc_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Noema target visibility cannot be resolved without the selected repository-scoped reviewer token."
            exit 1
          fi
          visibility=""
          for target_visibility_attempt in 1 2 3 4 5 6; do
            if visibility="$(
              gh api "/repos/${TARGET_REPOSITORY}" --jq '.visibility // (if .private then "private" else "public" end)'
            )"; then
              break
            fi
            visibility=""
            if [ "$target_visibility_attempt" -lt 6 ]; then
              echo "Repository visibility lookup failed (attempt ${target_visibility_attempt}/6), possibly a transient GitHub API rate limit; retrying after backoff." >&2
              sleep "$(( target_visibility_attempt * 5 ))"
            fi
          done
          case "$visibility" in
            private|internal)
              echo "require_zdr=true" >>"$GITHUB_OUTPUT"
              echo "::notice::Private/internal target requires an attested ZDR-only review pool."
              ;;
            public)
              echo "require_zdr=false" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Noema target repository visibility is missing or unsupported: ${visibility:-<empty>}."
              exit 1
              ;;
          esac

      - name: Seal exact-head Noema review input
        if: env.PR_NUMBER != ''
        id: seal
        env:
          GH_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || steps.noema_github_app_token.outputs.token || steps.noema_oidc_token.outputs.token }}
          NOEMA_REVIEW_TOKEN_SOURCE: ${{ steps.noema_credential.outputs.source == 'github-app' && 'noema-review-github-app' || steps.noema_credential.outputs.source == 'pat' && 'noema-review-pat' || 'noema-review-app-oidc' }}
          NOEMA_REVIEW_ACTOR: ${{ steps.noema_github_app_token.outputs['app-slug'] && format('{0}[bot]', steps.noema_github_app_token.outputs['app-slug']) || '' }}
          NOEMA_REVIEW_INSTALLATION_ID: ${{ steps.noema_github_app_token.outputs['installation-id'] }}
        run: |
          set -euo pipefail
          python3 -m scripts.ci.noema_review_gate \
            --repo "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --mode prepare \
            --output "${RUNNER_TEMP}/noema-input.json"
          if [ -s "${RUNNER_TEMP}/noema-input.json" ] && [ -s "${RUNNER_TEMP}/noema-input.json.sha256" ]; then
            echo "review_ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "review_ready=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload sealed Noema review input
        if: steps.seal.outputs.review_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noema-review-input
          path: |
            ${{ runner.temp }}/noema-input.json
            ${{ runner.temp }}/noema-input.json.sha256
          if-no-files-found: error
          retention-days: 1

  candidate-1:
    name: noema-review / candidate-1
    needs: prepare
    if: needs.prepare.outputs.review_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Materialize trusted Noema source
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -o "${RUNNER_TEMP}/trusted.tar.gz" "${GITHUB_API_URL}/repos/ContextualWisdomLab/.github/tarball/${TRUSTED_SOURCE_REF}"
          tar -xzf "${RUNNER_TEMP}/trusted.tar.gz" -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: Download sealed Noema review input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: noema-review-input
          path: ${{ runner.temp }}/noema-input
      - name: Provision candidate pool
        id: provision
        continue-on-error: true
        env: &provider_credentials
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXTUAL_ORCHESTRATOR_REQUIRE_ZDR: ${{ needs.prepare.outputs.require_zdr }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/contextual_orchestrator_review_sidecar.sh" --single-candidate-attempt
      - name: Run first candidate
        id: review
        if: steps.provision.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 335
        run: |
          set -euo pipefail
          if [ -z "${CONTEXTUAL_ORCHESTRATOR_BASE_URL:-}" ] || [ -z "${CONTEXTUAL_ORCHESTRATOR_TOKEN_FILE:-}" ]; then
            echo "::error::contextual-orchestrator review sidecar must be provisioned before Noema LLM review."
            exit 1
          fi
          source "$GITHUB_WORKSPACE/scripts/ci/load_contextual_orchestrator_token.sh"
          candidate_id="$(jq -er '.routes[] | select(.status == "ready") | .agent_id' "$CONTEXTUAL_ORCHESTRATOR_PREFLIGHT_EVIDENCE" | head -1)"
          printf '%s\n' "$candidate_id" >"${RUNNER_TEMP}/candidate-1.id"
          export NOEMA_LLM_API_URL="${CONTEXTUAL_ORCHESTRATOR_BASE_URL%/}/v1/chat/completions"
          export NOEMA_LLM_MODEL="orchestrator/free"
          export NOEMA_LLM_API_KEY="$CONTEXTUAL_ORCHESTRATOR_TOKEN"
          export NOEMA_LLM_VIA_ORCHESTRATOR=1
          export NOEMA_LLM_CANDIDATE_ID="$candidate_id"
          python3 -m scripts.ci.noema_review_gate --repo placeholder/repo --pr-number 1 \
            --mode evaluate --input "${RUNNER_TEMP}/noema-input/noema-input.json" \
            --output "${RUNNER_TEMP}/noema-verdict.json"
      - name: Guarantee first candidate status handoff
        if: always()
        run: |
          set -euo pipefail
          if [ ! -e "${RUNNER_TEMP}/candidate-1.id" ]; then
            : >"${RUNNER_TEMP}/candidate-1.id"
          fi
      - name: Upload first candidate handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noema-candidate-1
          path: |
            ${{ runner.temp }}/candidate-1.id
            ${{ runner.temp }}/noema-verdict.json
            ${{ runner.temp }}/noema-verdict.json.sha256
          if-no-files-found: error
          retention-days: 1

  candidate-2:
    name: noema-review / candidate-2
    needs: [prepare, candidate-1]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.review_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - name: Materialize trusted Noema source
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -o "${RUNNER_TEMP}/trusted.tar.gz" "${GITHUB_API_URL}/repos/ContextualWisdomLab/.github/tarball/${TRUSTED_SOURCE_REF}"
          tar -xzf "${RUNNER_TEMP}/trusted.tar.gz" -C "$GITHUB_WORKSPACE" --strip-components=1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: noema-review-input
          path: ${{ runner.temp }}/noema-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: noema-candidate-1
          path: ${{ runner.temp }}/candidate-1
      - name: Reuse successful first verdict
        id: reuse
        run: |
          if [ -s "${RUNNER_TEMP}/candidate-1/noema-verdict.json" ] && [ -s "${RUNNER_TEMP}/candidate-1/noema-verdict.json.sha256" ]; then
            cp "${RUNNER_TEMP}/candidate-1/noema-verdict.json" "${RUNNER_TEMP}/noema-verdict.json"
            cp "${RUNNER_TEMP}/candidate-1/noema-verdict.json.sha256" "${RUNNER_TEMP}/noema-verdict.json.sha256"
            echo "reused=true" >>"$GITHUB_OUTPUT"
          else
            echo "reused=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Provision fallback candidate pool
        if: steps.reuse.outputs.reused != 'true'
        env: *provider_credentials
        run: |
          CONTEXTUAL_ORCHESTRATOR_EXCLUDE_CANDIDATE_ID="$(cat "${RUNNER_TEMP}/candidate-1/candidate-1.id" 2>/dev/null || true)"
          export CONTEXTUAL_ORCHESTRATOR_EXCLUDE_CANDIDATE_ID
          bash "$GITHUB_WORKSPACE/scripts/ci/contextual_orchestrator_review_sidecar.sh" --single-candidate-attempt
      - name: Run second candidate
        if: steps.reuse.outputs.reused != 'true'
        timeout-minutes: 335
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/ci/load_contextual_orchestrator_token.sh"
          first_id="$(cat "${RUNNER_TEMP}/candidate-1/candidate-1.id" 2>/dev/null || true)"
          candidate_id="$(jq -er --arg excluded "$first_id" '.routes[] | select(.status == "ready" and .agent_id != $excluded) | .agent_id' "$CONTEXTUAL_ORCHESTRATOR_PREFLIGHT_EVIDENCE" | head -1)"
          export NOEMA_LLM_API_URL="${CONTEXTUAL_ORCHESTRATOR_BASE_URL%/}/v1/chat/completions"
          export NOEMA_LLM_MODEL="orchestrator/free"
          export NOEMA_LLM_API_KEY="$CONTEXTUAL_ORCHESTRATOR_TOKEN"
          export NOEMA_LLM_VIA_ORCHESTRATOR=1
          export NOEMA_LLM_CANDIDATE_ID="$candidate_id"
          python3 -m scripts.ci.noema_review_gate --repo placeholder/repo --pr-number 1 \
            --mode evaluate --input "${RUNNER_TEMP}/noema-input/noema-input.json" \
            --output "${RUNNER_TEMP}/noema-verdict.json"
      - name: Upload final candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noema-candidate-final
          path: |
            ${{ runner.temp }}/noema-verdict.json
            ${{ runner.temp }}/noema-verdict.json.sha256
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: noema-review
    needs: [prepare, candidate-2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    env:
      TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.event.client_payload.target_repository || github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.client_payload.pr_number || '' }}
    steps:
      - name: Materialize trusted Noema source
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_REF: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -o "${RUNNER_TEMP}/trusted.tar.gz" "${GITHUB_API_URL}/repos/ContextualWisdomLab/.github/tarball/${TRUSTED_SOURCE_REF}"
          tar -xzf "${RUNNER_TEMP}/trusted.tar.gz" -C "$GITHUB_WORKSPACE" --strip-components=1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: noema-review-input
          path: ${{ runner.temp }}/noema-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: noema-candidate-final
          path: ${{ runner.temp }}/noema-verdict
      - name: Select finalizer credential
        id: credential
        env:
          APP_CLIENT_ID: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID || '' }}
          APP_PRIVATE_KEY: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY || '' }}
          REVIEW_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || '' }}
          EXCHANGE_URL: ${{ vars.NOEMA_TOKEN_EXCHANGE_URL || vars.NOEMA_EXCHANGE_URL || '' }}
        run: |
          set -euo pipefail
          echo "repository=${TARGET_REPOSITORY#*/}" >>"$GITHUB_OUTPUT"
          if [ -n "$REVIEW_TOKEN" ]; then echo "source=pat" >>"$GITHUB_OUTPUT"
          elif [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then echo "source=github-app" >>"$GITHUB_OUTPUT"
          elif [ -n "$EXCHANGE_URL" ]; then echo "source=oidc" >>"$GITHUB_OUTPUT"
          else echo "::error::Noema reviewer credential is unavailable."; exit 1; fi
      - name: Mint repository-scoped Noema GitHub App token
        id: app_token
        if: steps.credential.outputs.source == 'github-app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ steps.credential.outputs.repository }}
          permission-contents: read
          permission-pull-requests: write
      - name: Exchange finalizer token through OIDC
        if: steps.credential.outputs.source == 'oidc'
        id: oidc_token
        env:
          EXCHANGE_URL: ${{ vars.NOEMA_TOKEN_EXCHANGE_URL || vars.NOEMA_EXCHANGE_URL || '' }}
          OIDC_AUDIENCE: ${{ vars.NOEMA_OIDC_AUDIENCE || 'cwl-noema-review' }}
        run: |
          set -euo pipefail
          separator='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && separator='&'
          oidc="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" | jq -er .value)"
          token="$(curl -fsS -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer ${oidc}" --data "$(jq -cn --arg target_repository "$TARGET_REPOSITORY" '{target_repository:$target_repository}')" "$EXCHANGE_URL" | jq -er .token)"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - name: Submit sealed exact-head verdict
        env:
          GH_TOKEN: ${{ secrets.NOEMA_REVIEW_TOKEN || steps.app_token.outputs.token || steps.oidc_token.outputs.token }}
          NOEMA_REVIEW_TOKEN_SOURCE: ${{ steps.credential.outputs.source == 'github-app' && 'noema-review-github-app' || steps.credential.outputs.source == 'pat' && 'noema-review-pat' || 'noema-review-app-oidc' }}
          NOEMA_REVIEW_ACTOR: ${{ steps.app_token.outputs['app-slug'] && format('{0}[bot]', steps.app_token.outputs['app-slug']) || '' }}
          NOEMA_REVIEW_INSTALLATION_ID: ${{ steps.app_token.outputs['installation-id'] }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Noema reviewer credential is unavailable."; exit 1; }
          python3 -m scripts.ci.noema_review_gate --repo "$TARGET_REPOSITORY" --pr-number "$PR_NUMBER" \
            --mode finalize --input "${RUNNER_TEMP}/noema-input/noema-input.json" \
            --verdict "${RUNNER_TEMP}/noema-verdict/noema-verdict.json"
