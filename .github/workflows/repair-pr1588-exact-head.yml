name: Repair PR1588 exact-head Strix contract

on:
  push:
    branches: [fix/strix-control-plane-supersession-20260901]
    paths: [.github/repair-pr1588.trigger]

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-pr1588:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/strix-control-plane-supersession-20260901
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Patch exact-head Strix admission contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/strix.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('export LLM_TIMEOUT=0', 'export LLM_TIMEOUT=300')

          def validation_step(name: str, condition: str = "github.event_name == 'pull_request_target'") -> str:
              template = '''      - name: @@NAME@@
        if: @@CONDITION@@
        env:
          GH_TOKEN: @@D@@{{ github.token }}
          TARGET_REPOSITORY: @@D@@{{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR_NUMBER: @@D@@{{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: @@D@@{{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live_pr="$(gh api "repos/@@D@@{TARGET_REPOSITORY}/pulls/@@D@@{PR_NUMBER}")"
          live_state="$(printf '%s' "$live_pr" | jq -r '.state // empty')"
          live_head_sha="$(printf '%s' "$live_pr" | jq -r '.head.sha // empty')"
          if [ -z "$live_state" ] || [ -z "$live_head_sha" ]; then
            echo "::error::Could not validate live pull request identity."
            exit 1
          fi
          if [ "$live_state" != "open" ] || [ "@@D@@{live_head_sha}" != "@@D@@{EXPECTED_HEAD_SHA}" ]; then
            echo "::error::Strix event no longer matches the live open pull request head."
            exit 1
          fi

'''
              return (
                  template.replace('@@NAME@@', name)
                  .replace('@@CONDITION@@', condition)
                  .replace('@@D@@', '$')
              )

          early_name = 'Validate live pull request before Strix setup'
          if early_name not in text:
              marker = '    steps:\n      - name: Harden runner\n'
              if marker not in text:
                  raise SystemExit('missing Strix first-step marker')
              text = text.replace(marker, '    steps:\n' + validation_step(early_name) + '      - name: Harden runner\n', 1)

          before_provider = 'Revalidate live pull request before provider execution'
          if before_provider not in text:
              marker = '      - name: Provision contextual-orchestrator Strix sidecar\n'
              if marker not in text:
                  raise SystemExit('missing provider marker')
              text = text.replace(marker, validation_step(before_provider) + marker, 1)

          before_publish = 'Revalidate live pull request before evidence publication'
          publication_condition = '$' + "{{ always() && github.event_name == 'pull_request_target' }}"
          if before_publish not in text:
              marker = '      - name: Collect Strix reports for artifact upload\n'
              if marker not in text:
                  raise SystemExit('missing publication marker')
              text = text.replace(
                  marker,
                  validation_step(before_publish, publication_condition) + marker,
                  1,
              )

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_strix_control_plane_supersession.py')
          tests = test_path.read_text(encoding='utf-8')
          publication_anchor = '''    recheck = _step(workflow, "Revalidate live pull request before evidence publication")\n\n'''
          publication_assert = (
              '    assert "if: '
              + publication_condition
              + '" in recheck\n'
          )
          if publication_assert not in tests:
              if publication_anchor not in tests:
                  raise SystemExit('missing publication regression anchor')
              tests = tests.replace(
                  publication_anchor,
                  publication_anchor + publication_assert,
                  1,
              )
          test_path.write_text(tests, encoding='utf-8')
          PY
          python -m pytest -q tests/test_strix_control_plane_supersession.py tests/test_required_workflow_queue_contract.py
          python -m compileall -q tests/test_strix_control_plane_supersession.py
          git diff --check
      - name: Commit verified repair and retire one-shot workflow
        run: |
          set -euo pipefail
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1588" --jq '.head.sha')"
          test "$live_head" = "$GITHUB_SHA"
          rm -f .github/workflows/repair-pr1588-exact-head.yml .github/repair-pr1588.trigger
          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git add .github/workflows/strix.yml tests/test_strix_control_plane_supersession.py tests/test_required_workflow_queue_contract.py .github/workflows/repair-pr1588-exact-head.yml .github/repair-pr1588.trigger
          git diff --cached --check
          git commit -m 'fix(strix): revalidate live PR state before admission work'
          git push origin HEAD:fix/strix-control-plane-supersession-20260901
