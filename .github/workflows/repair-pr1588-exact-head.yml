name: Repair PR1588 exact-head Strix contract

on:
  push:
    branches: [fix/strix-control-plane-supersession-20260901]
    paths: [.github/repair-pr1588.trigger]

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-pr1588:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/strix-control-plane-supersession-20260901
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Reconcile current main and patch exact-head Strix admission contract
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          writer_ref='refs/heads/fix/strix-control-plane-supersession-20260901'
          starting_head="$GITHUB_SHA"
          echo "starting_head=$starting_head" >>"$GITHUB_OUTPUT"
          remote_head="$(git ls-remote origin "$writer_ref" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$starting_head"

          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          main_head="$(git rev-parse origin/main)"
          git merge --no-edit "$main_head"

          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
          python3 <<'PY'
          from pathlib import Path

          dollar = '$'
          workflow_path = Path('.github/workflows/strix.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          if '  cancel-superseded-pr-runs:\n' in workflow:
              start = workflow.index('  cancel-superseded-pr-runs:\n')
              end = workflow.index('  strix:\n', start)
              workflow = workflow[:start] + workflow[end:]

          permissions_anchor = '      models: read\n      statuses: write\n'
          strix_header = workflow.split('  strix:\n', 1)[1].split('    env:\n', 1)[0]
          if permissions_anchor in workflow and '      pull-requests: read\n' not in strix_header:
              workflow = workflow.replace(
                  permissions_anchor,
                  '      models: read\n      pull-requests: read\n      statuses: write\n',
                  1,
              )

          def expression(body: str) -> str:
              return dollar + '{{ ' + body + ' }}'

          def validation_step(name: str, *, publication: bool = False) -> str:
              condition = (
                  expression("always() && github.event_name == 'pull_request_target'")
                  if publication
                  else "github.event_name == 'pull_request_target'"
              )
              step_id = '        id: live_publication\n' if publication else ''
              output = '          echo "current=true" >>"$GITHUB_OUTPUT"\n' if publication else ''
              return (
                  f'      - name: {name}\n'
                  f'        if: {condition}\n'
                  f'{step_id}'
                  '        env:\n'
                  f'          GH_TOKEN: {expression("github.token")}\n'
                  f'          TARGET_REPOSITORY: {expression("github.event.pull_request.base.repo.full_name || github.repository")}\n'
                  f'          PR_NUMBER: {expression("github.event.pull_request.number")}\n'
                  f'          EXPECTED_HEAD_SHA: {expression("github.event.pull_request.head.sha")}\n'
                  '        run: |\n'
                  '          set -euo pipefail\n'
                  '          if ! live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"; then\n'
                  '            echo "::error::Could not look up the live pull request; refusing stale-event admission."\n'
                  '            exit 1\n'
                  '          fi\n'
                  '          live_state="$(printf \'%s\' "$live_pr" | jq -r \'.state // empty\')"\n'
                  '          live_head_sha="$(printf \'%s\' "$live_pr" | jq -r \'.head.sha // empty\')"\n'
                  '          if [ -z "$live_state" ] || [ -z "$live_head_sha" ]; then\n'
                  '            echo "::error::Could not validate live pull request identity."\n'
                  '            exit 1\n'
                  '          fi\n'
                  '          if [ "$live_state" != "open" ] || [ "$live_head_sha" != "$EXPECTED_HEAD_SHA" ]; then\n'
                  '            echo "::error::Strix event no longer matches the live open pull request head."\n'
                  '            exit 1\n'
                  '          fi\n'
                  f'{output}'
              )

          early_name = 'Validate live pull request before Strix setup'
          if early_name not in workflow:
              marker = '    steps:\n      - name: Harden runner\n'
              if marker not in workflow:
                  raise SystemExit('missing Strix first-step marker')
              workflow = workflow.replace(
                  marker,
                  '    steps:\n' + validation_step(early_name) + '      - name: Harden runner\n',
                  1,
              )

          provider_name = 'Revalidate live pull request before provider execution'
          if provider_name not in workflow:
              marker = '      - name: Provision contextual-orchestrator Strix sidecar\n'
              if marker not in workflow:
                  raise SystemExit('missing provider marker')
              workflow = workflow.replace(marker, validation_step(provider_name) + marker, 1)

          publication_name = 'Revalidate live pull request before evidence publication'
          if publication_name not in workflow:
              marker = '      - name: Collect Strix reports for artifact upload\n'
              if marker not in workflow:
                  raise SystemExit('missing publication marker')
              workflow = workflow.replace(
                  marker,
                  validation_step(publication_name, publication=True) + marker,
                  1,
              )

          collect_old = '        if: ' + expression("always() && steps.gate.outputs.enabled == 'true'") + '\n'
          collect_new = (
              '        if: '
              + expression(
                  "always() && steps.gate.outputs.enabled == 'true' && (github.event_name != 'pull_request_target' || steps.live_publication.outputs.current == 'true')"
              )
              + '\n'
          )
          collect_marker = '      - name: Collect Strix reports for artifact upload\n'
          collect_start = workflow.index(collect_marker)
          upload_start = workflow.index('      - name: Upload Strix reports artifact\n', collect_start)
          collect_block = workflow[collect_start:upload_start]
          if collect_old in collect_block:
              collect_block = collect_block.replace(collect_old, collect_new, 1)
              workflow = workflow[:collect_start] + collect_block + workflow[upload_start:]

          upload_marker = '      - name: Upload Strix reports artifact\n'
          upload_start = workflow.index(upload_marker)
          next_step = workflow.index('      - name: Publish same-head manual Strix status\n', upload_start)
          upload_block = workflow[upload_start:next_step]
          if collect_old in upload_block:
              upload_block = upload_block.replace(collect_old, collect_new, 1)
              workflow = workflow[:upload_start] + upload_block + workflow[next_step:]

          if 'export LLM_TIMEOUT=300' not in workflow:
              raise SystemExit('Strix bounded model inference timeout is missing')
          if 'export LLM_TIMEOUT=0' in workflow:
              raise SystemExit('Strix model inference timeout must not be disabled')
          if 'cancel-superseded-pr-runs:' in workflow:
              raise SystemExit('runner-backed Strix cleanup job remains')
          workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('tests/test_strix_control_plane_supersession.py')
          tests = test_path.read_text(encoding='utf-8')
          publication_anchor = '    recheck = _step(workflow, "Revalidate live pull request before evidence publication")\n\n'
          output_contract = "steps.live_publication.outputs.current == 'true'"
          extra = (
              '    assert "id: live_publication" in recheck\n'
              '    assert "current=true" in recheck\n'
              f'    assert "{output_contract}" in workflow\n'
          )
          if extra not in tests:
              if publication_anchor not in tests:
                  raise SystemExit('missing publication regression anchor')
              tests = tests.replace(publication_anchor, publication_anchor + extra, 1)
          if '    assert "export LLM_TIMEOUT=300" in workflow\n' not in tests:
              raise SystemExit('Strix supersession regression does not preserve bounded timeout')
          test_path.write_text(tests, encoding='utf-8')

          timeout_contract_path = Path('tests/test_strix_llm_timeout_contract.py')
          timeout_contract = timeout_contract_path.read_text(encoding='utf-8')
          if '    assert "export LLM_TIMEOUT=300" in workflow\n' not in timeout_contract:
              raise SystemExit('merged Strix timeout regression does not preserve bounded timeout')

          quick_gate_path = Path('scripts/ci/test_strix_quick_gate.sh')
          quick_gate = quick_gate_path.read_text(encoding='utf-8')
          stale_cleanup = '\tassert_file_contains "$workflow_file" "cancel-superseded-pr-runs:" "strix workflow runs superseded-head cleanup outside the provider scan queue"\n'
          fresh_cleanup = '\tassert_file_not_contains "$workflow_file" "cancel-superseded-pr-runs:" "strix workflow must not consume a runner for superseded-head cleanup"\n'
          if stale_cleanup in quick_gate:
              quick_gate = quick_gate.replace(stale_cleanup, fresh_cleanup, 1)
          stale_recovery = '\tassert_file_contains "$workflow_file" "re-dispatches exact-head evidence" "strix workflow documents current-head queue recovery"\n'
          fresh_recovery = '\tassert_file_contains "$workflow_file" "central queue sweep retires predecessor runs" "strix workflow documents trusted current-head queue recovery"\n'
          if stale_recovery in quick_gate:
              quick_gate = quick_gate.replace(stale_recovery, fresh_recovery, 1)
          bad_timeout = '\tassert_file_contains "$workflow_file" \'export LLM_TIMEOUT=0\' "strix disables the model client inference timeout"\n'
          good_timeout = '\tassert_file_contains "$workflow_file" \'export LLM_TIMEOUT=300\' "strix preserves the current-main bounded model preflight timeout"\n'
          if bad_timeout in quick_gate:
              quick_gate = quick_gate.replace(bad_timeout, good_timeout, 1)
          for forbidden in (
              stale_cleanup.rstrip('\n'),
              stale_recovery.rstrip('\n'),
              bad_timeout.rstrip('\n'),
          ):
              if forbidden in quick_gate:
                  raise SystemExit(f'stale Strix quick-gate assertion remains: {forbidden}')
          if good_timeout.rstrip('\n') not in quick_gate:
              raise SystemExit('Strix quick gate does not preserve bounded timeout contract')
          quick_gate_path.write_text(quick_gate, encoding='utf-8')
          PY

          python -m pytest -q tests/test_strix_control_plane_supersession.py tests/test_required_workflow_queue_contract.py tests/test_strix_llm_timeout_contract.py
          bash scripts/ci/test_strix_quick_gate.sh
          git diff --check

          latest_head="$(git ls-remote origin "$writer_ref" | awk '{print $1}')"
          test -n "$latest_head"
          test "$latest_head" = "$starting_head"
          rm -f .github/workflows/repair-pr1588-exact-head.yml .github/repair-pr1588.trigger
          git add -A
          git diff --cached --check
          git commit -m 'fix(strix): revalidate live PR state before expensive evidence'

      - name: Push repaired head with guarded branch credential
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
          STARTING_HEAD: ${{ steps.patch.outputs.starting_head }}
        run: |
          set -euo pipefail
          writer_branch='fix/strix-control-plane-supersession-20260901'
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${writer_branch}" --jq '.object.sha')"
          test -n "$remote_head"
          test "$remote_head" = "$STARTING_HEAD"
          gh auth setup-git
          git push origin HEAD:"$writer_branch"
