name: Trigger PR 797 exact handoff repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: trigger-pr797-exact-handoff-repair
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.number == 797 &&
      github.event.pull_request.head.ref == 'release/exact-artifact-sbom-attestation'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply reviewed contract repairs
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          contract = Path('tests/test_exact_artifact_sbom_attestation_contract.py')
          source = contract.read_text(encoding='utf-8')
          old = '    assert "' + '$' + '{{ github.run_id }}" in intake\n'
          new = '    assert "GITHUB_RUN_ID" in intake\n'
          if source.count(old) != 1:
              raise SystemExit('expected one exact run-ID contract anchor')
          contract.write_text(source.replace(old, new, 1), encoding='utf-8')

          hostile = Path('tests/test_verify_exact_artifact_sbom_handoff.py')
          source = hostile.read_text(encoding='utf-8')
          old = '    root.mkdir()\n'
          new = '    root.mkdir(parents=True)\n'
          if source.count(old) != 1:
              raise SystemExit('expected one nested hostile-root anchor')
          hostile.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f \
            .github/workflows/repair-pr797-exact-handoff.yml \
            .github/workflows/trigger-pr797-exact-handoff-repair.yml
          git diff --check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify exact contracts and verifier coverage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q \
            tests/test_exact_artifact_sbom_attestation_contract.py \
            tests/test_verify_exact_artifact_sbom_handoff.py
          python -m coverage report \
            --include=scripts/ci/verify_exact_artifact_sbom_handoff.py \
            --show-missing \
            --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci/verify_exact_artifact_sbom_handoff.py
          python -m compileall -q \
            scripts/ci/verify_exact_artifact_sbom_handoff.py \
            tests/test_exact_artifact_sbom_attestation_contract.py \
            tests/test_verify_exact_artifact_sbom_handoff.py
          git diff --check

      - name: Build immutable verified repair commit
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: release/exact-artifact-sbom-attestation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr797-trigger-receipt.txt"
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = 'ContextualWisdomLab/.github'
          parent_sha = os.environ['EXPECTED_HEAD']
          token = os.environ['API_TOKEN']
          api_root = f'https://api.github.com/repos/{repository}'
          expected_paths = {
              '.github/workflows/repair-pr797-exact-handoff.yml',
              '.github/workflows/trigger-pr797-exact-handoff-repair.yml',
              'tests/test_exact_artifact_sbom_attestation_contract.py',
              'tests/test_verify_exact_artifact_sbom_handoff.py',
          }

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cwl-pr797-trigger-repair',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          raw = subprocess.check_output(['git', 'diff', '--name-status', '-z', 'HEAD'])
          parts = raw.decode('utf-8').split('\0')
          changes = []
          index = 0
          while index < len(parts) - 1:
              status = parts[index]
              path = parts[index + 1]
              index += 2
              changes.append((status, path))
          actual_paths = {path for _, path in changes}
          if actual_paths != expected_paths:
              raise SystemExit(
                  f'repair path mismatch: missing={sorted(expected_paths - actual_paths)} '
                  f'extra={sorted(actual_paths - expected_paths)}'
              )

          parent = request('GET', f'/git/commits/{parent_sha}')
          tree_entries = []
          for status, path in changes:
              if status == 'D':
                  tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              encoded = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = request('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = request('POST', '/git/trees', {'base_tree': parent['tree']['sha'], 'tree': tree_entries})
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'test: repair exact artifact handoff contracts',
                  'tree': tree['sha'],
                  'parents': [parent_sha],
              },
          )
          print(f"PR797_REPAIR_PARENT_SHA={parent_sha}")
          print(f"PR797_REPAIR_COMMIT_SHA={commit['sha']}")
          PY

      - name: Publish repair pointer
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          commit_sha="$(sed -n 's/^PR797_REPAIR_COMMIT_SHA=//p' "${RUNNER_TEMP}/pr797-trigger-receipt.txt")"
          test "${#commit_sha}" -eq 40
          body="PR797_REPAIR_PARENT_SHA=${EXPECTED_HEAD}%0APR797_REPAIR_COMMIT_SHA=${commit_sha}"
          gh api --method POST repos/ContextualWisdomLab/.github/issues/797/comments -f "body=${body}"

      - name: Upload repair receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr797-trigger-repair
          path: ${{ runner.temp }}/pr797-trigger-receipt.txt
          if-no-files-found: error
          retention-days: 5
