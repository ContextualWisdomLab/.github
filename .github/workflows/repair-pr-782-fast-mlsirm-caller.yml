name: Repair PR 782 fast-mlsirm caller

on:
  push:
    branches:
      - fix/hourly-nvidia-nim-review-repair-main
    paths:
      - .github/workflows/repair-pr-782-fast-mlsirm-caller.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-782-fast-mlsirm-caller
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Add the bounded fast-mlsirm product caller
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          caller = dedent(
              """\
              name: fast-mlsirm Hourly Review Repair

              on:
                schedule:
                  # Minute 49 avoids minute-zero pressure and the existing product callers.
                  - cron: "49 * * * *"

              concurrency:
                group: fast-mlsirm-hourly-review-repair
                # Preserve bounded RCA when a later hourly heartbeat arrives.
                cancel-in-progress: false

              permissions:
                contents: read

              jobs:
                dispatch-review-repair:
                  uses: ./.github/workflows/pr-review-fix-scheduler.yml
                  with:
                    target_repository: ContextualWisdomLab/fast-mlsirm
                    base_branch: main
                    max_prs: "50"
                    max_dispatches: "1"
                    # Central OpenCode/NVIDIA NIM review and psychometric CI can approach two hours.
                    retry_hours: "2"
                  secrets:
                    PR_REVIEW_MERGE_TOKEN: __PR_REVIEW_MERGE_TOKEN__
                    OPENCODE_APPROVE_TOKEN: __OPENCODE_APPROVE_TOKEN__
              """
          )
          caller = caller.replace(
              "__PR_REVIEW_MERGE_TOKEN__",
              "$" + "{{ secrets.PR_REVIEW_MERGE_TOKEN }}",
          ).replace(
              "__OPENCODE_APPROVE_TOKEN__",
              "$" + "{{ secrets.OPENCODE_APPROVE_TOKEN }}",
          )
          Path(".github/workflows/fast-mlsirm-hourly-review-repair.yml").write_text(
              caller,
              encoding="utf-8",
          )

          doctoring = dedent(
              """\
              # fast-mlsirm hourly review-repair caller

              ## Decision

              ContextualWisdomLab operates one protected hourly caller for
              `ContextualWisdomLab/fast-mlsirm`. The caller runs at minute 49, delegates to
              the product-neutral central review-fix scheduler, inspects at most 50 open
              pull requests, and dispatches at most one bounded repair per heartbeat.

              The caller does not duplicate estimator, review, mutation, or merge logic.
              It preserves fast-mlsirm as an independently operable psychometrics package
              while centralizing privileged automation in `ContextualWisdomLab/.github`.
              The reusable worker performs exact-head root-cause analysis, evaluates
              remediation feasibility, and edits only when one small reversible action can
              alter the diagnosed cause inside sealed writer authority.

              ## Root-cause analysis and remediation feasibility

              The repository can contain long-running Rust, Python, GPU, recovery, and
              supply-chain checks. A pending check is a merge blocker, but elapsed time is
              not a source defect and must not be converted into a fabricated code change.
              Likewise, an independent non-author approval is an authorization gate that
              the repair worker cannot synthesize.

              Each heartbeat therefore applies this bounded sequence:

              1. Refetch the exact live head, protected base, reviews, checks, changed
                 paths, and writer state.
              2. Trace the causal chain from terminal symptom to the smallest source-owned
                 defect that the worker is authorized to change.
              3. Enumerate materially distinct minimal remedies.
              4. Reject a remedy that lacks writer authority, crosses sealed paths, needs
                 unavailable credentials or protected-setting changes, violates dependency
                 order, cannot be verified, or does not alter the diagnosed cause.
              5. Dispatch at most one feasible repair. Otherwise leave the tree unchanged
                 so a later heartbeat can consider another eligible pull request.

              Psychometric acceptance bounds, true-parameter recovery criteria, CPU/GPU
              parity, skipped-test prohibitions, and Rust ownership of production arithmetic
              are not loosened to make a check green. A recovery failure requires scientific
              and numerical root-cause analysis rather than threshold inflation.

              ## Cadence and concurrency

              The caller uses a single concurrency group with `cancel-in-progress: false`.
              It preserves an in-flight bounded RCA rather than discarding its evidence when
              the next heartbeat arrives. The reusable scheduler retains exact-head leases,
              one-dispatch scope, and post-edit revalidation.

              The caller sets a **two-hour same-head retry floor** because central OpenCode,
              NVIDIA NIM, Rust/GPU validation, and hosted security checks can legitimately
              approach two hours. A new hourly scan may select another eligible pull request,
              but the same unchanged head is not assigned a duplicate writer.

              GitHub scheduled workflows execute from the default branch and can be delayed
              under shared-runner load. The cron is therefore a heartbeat, not a real-time
              service-level promise. Exact-head state controls mutation and integration.

              ## Credential and model boundary

              The caller has only `contents: read`. It maps only the established
              `PR_REVIEW_MERGE_TOKEN` and `OPENCODE_APPROVE_TOKEN` scheduler credentials and
              never uses `secrets: inherit`.

              Model execution remains in the central worker. The model credential is the
              GitHub Secret `NVIDIA_NIM_API_KEY`; the caller does not receive or forward it.
              `COPILOT_GITHUB_TOKEN` is prohibited. Existing independent review-agent keys,
              identities, and model-pool contracts remain unchanged.

              ## Security, privacy, and modularity

              The caller adds no fast-mlsirm runtime dependency, database object, network
              endpoint, tenant authority, or product credential. It cannot mask or rewrite
              operational PII, modify protected settings, approve, merge, release, or change
              reviewer identities. Queued, pending, absent, failed, cancelled,
              skipped-required, neutral-required, stale-head, or synthetic-merge evidence is
              never treated as success.

              fast-mlsirm remains usable on its own and as a Rust/Python psychometrics module
              in naruon, contextual-orchestrator, TEPP, or other CWL services. Ecosystem reuse
              cannot weaken local validation, exact-head evidence, Rust arithmetic ownership,
              independent approval, or security gates.

              ## Verification and rollback

              Repository contracts require the exact cron, repository target, protected base,
              one-dispatch budget, two-hour retry floor, non-cancelling single-flight policy,
              read-only caller token, explicit secret mapping, and absence of both model and
              Copilot credentials from the caller. The focused quality workflow tracks the
              caller, this doctoring record, and its contract test on every pull request and
              push that changes them.

              Rollback is a reviewed source change. Do not disable exact-head binding, reduce
              approval requirements, widen dispatch volume, inherit secrets, or convert
              provider and runner latency into a source edit. Preserve the central RCA,
              feasibility, lease, credential, and sealed-path contracts.

              ## APA 7th references

              GitHub. (n.d.). *Control the concurrency of workflows and jobs*. Retrieved
              August 14, 2026, from
              https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency

              GitHub. (n.d.). *Events that trigger workflows: Schedule*. Retrieved August 14,
              2026, from
              https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule

              GitHub. (n.d.). *Reuse workflows*. Retrieved August 14, 2026, from
              https://docs.github.com/en/actions/how-tos/sharing-automations/reusing-workflows

              NVIDIA. (n.d.). *NVIDIA NIM for large language models documentation*. Retrieved
              August 14, 2026, from
              https://docs.nvidia.com/nim/large-language-models/latest/

              OpenCode. (n.d.). *OpenCode documentation*. Retrieved August 14, 2026, from
              https://opencode.ai/docs/

              Souppaya, M., Scarfone, K., & Dodson, D. (2022). *Secure software development
              framework (SSDF) version 1.1: Recommendations for mitigating the risk of
              software vulnerabilities* (NIST Special Publication 800-218). National
              Institute of Standards and Technology. https://doi.org/10.6028/NIST.SP.800-218
              """
          )
          Path("docs/doctoring/fast-mlsirm-hourly-review-caller.md").write_text(
              doctoring,
              encoding="utf-8",
          )

          tests = dedent(
              '''\
              """Contract tests for fast-mlsirm's bounded hourly review-repair caller."""

              from pathlib import Path


              CALLER = Path(".github/workflows/fast-mlsirm-hourly-review-repair.yml")
              DOCTORING = Path("docs/doctoring/fast-mlsirm-hourly-review-caller.md")
              QUALITY_WORKFLOW = Path(".github/workflows/hourly-nvidia-nim-review-repair.yml")


              def _read(path: Path) -> str:
                  """Return one repository contract file as UTF-8 text."""
                  return path.read_text(encoding="utf-8")


              def test_fast_mlsirm_caller_is_hourly_bounded_and_non_cancelling() -> None:
                  """fast-mlsirm receives one realistic repair opportunity per heartbeat."""
                  caller = _read(CALLER)

                  assert 'cron: "49 * * * *"' in caller
                  assert "group: fast-mlsirm-hourly-review-repair" in caller
                  assert "cancel-in-progress: false" in caller
                  assert "uses: ./.github/workflows/pr-review-fix-scheduler.yml" in caller
                  assert "target_repository: ContextualWisdomLab/fast-mlsirm" in caller
                  assert "base_branch: main" in caller
                  assert 'max_prs: "50"' in caller
                  assert 'max_dispatches: "1"' in caller
                  assert 'retry_hours: "2"' in caller


              def test_fast_mlsirm_caller_preserves_credentials_and_read_only_scope() -> None:
                  """The caller maps scheduler credentials without model-secret exposure."""
                  caller = _read(CALLER)
                  workflow_scope, jobs_scope = caller.split("\\njobs:\\n", maxsplit=1)
                  pr_review_secret = "$" + "{{ secrets.PR_REVIEW_MERGE_TOKEN }}"
                  opencode_secret = "$" + "{{ secrets.OPENCODE_APPROVE_TOKEN }}"

                  assert "\\npermissions:\\n  contents: read\\n" in workflow_scope
                  assert "\\n    permissions:\\n" not in jobs_scope
                  assert f"PR_REVIEW_MERGE_TOKEN: {pr_review_secret}" in caller
                  assert f"OPENCODE_APPROVE_TOKEN: {opencode_secret}" in caller
                  assert "secrets: inherit" not in caller
                  assert "NVIDIA_NIM_API_KEY" not in caller
                  assert "COPILOT_GITHUB_TOKEN" not in caller
                  for forbidden in (
                      "actions: write",
                      "contents: write",
                      "issues: write",
                      "pull-requests: write",
                      "statuses: write",
                  ):
                      assert forbidden not in caller


              def test_fast_mlsirm_doctoring_records_scientific_and_governance_bounds() -> None:
                  """Operators retain RCA, scientific, credential, and approval contracts."""
                  doctoring = _read(DOCTORING)

                  for phrase in (
                      "root-cause analysis",
                      "remediation feasibility",
                      "two-hour same-head retry floor",
                      "true-parameter recovery",
                      "Rust ownership of production arithmetic",
                      "independent non-author approval",
                      "NVIDIA_NIM_API_KEY",
                      "COPILOT_GITHUB_TOKEN",
                      "ContextualWisdomLab/fast-mlsirm",
                      "APA 7th references",
                  ):
                      assert phrase in doctoring


              def test_focused_quality_workflow_tracks_fast_mlsirm_contracts() -> None:
                  """Caller and doctoring edits always rerun exact-head verification."""
                  quality = _read(QUALITY_WORKFLOW)

                  assert quality.count(".github/workflows/fast-mlsirm-hourly-review-repair.yml") == 2
                  assert quality.count("docs/doctoring/fast-mlsirm-hourly-review-caller.md") == 2
                  assert quality.count("tests/test_fast_mlsirm_hourly_review_caller.py") == 3
              '''
          )
          Path("tests/test_fast_mlsirm_hourly_review_caller.py").write_text(
              tests,
              encoding="utf-8",
          )

          quality_path = Path(".github/workflows/hourly-nvidia-nim-review-repair.yml")
          quality = quality_path.read_text(encoding="utf-8")
          list_replacements = (
              (
                  "      - .github/workflows/disksage-hourly-review-repair.yml\n",
                  "      - .github/workflows/disksage-hourly-review-repair.yml\n"
                  "      - .github/workflows/fast-mlsirm-hourly-review-repair.yml\n",
              ),
              (
                  "      - tests/test_disksage_hourly_review_caller.py\n",
                  "      - tests/test_disksage_hourly_review_caller.py\n"
                  "      - tests/test_fast_mlsirm_hourly_review_caller.py\n",
              ),
              (
                  "      - docs/doctoring/disksage-hourly-review-caller.md\n",
                  "      - docs/doctoring/disksage-hourly-review-caller.md\n"
                  "      - docs/doctoring/fast-mlsirm-hourly-review-caller.md\n",
              ),
          )
          for old, new in list_replacements:
              if quality.count(old) != 2:
                  raise RuntimeError(
                      f"unexpected quality-workflow list anchor count: {old!r}"
                  )
              quality = quality.replace(old, new)

          compile_anchor = "            tests/test_disksage_hourly_review_caller.py \\\n"
          compile_replacement = (
              "            tests/test_disksage_hourly_review_caller.py \\\n"
              "            tests/test_fast_mlsirm_hourly_review_caller.py \\\n"
          )
          if quality.count(compile_anchor) != 1:
              raise RuntimeError("unexpected quality-workflow compileall anchor")
          quality = quality.replace(compile_anchor, compile_replacement)
          quality_path.write_text(quality, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_replacements = (
              (
                  "- Added a dedicated DiskSage hourly caller that invokes the same product-neutral RCA and remediation-feasibility scheduler with an exact repository target, one-dispatch budget, two-hour same-head retry floor, non-cancelling single-flight heartbeat, and explicit established scheduler credentials.\n",
                  "- Added a dedicated DiskSage hourly caller that invokes the same product-neutral RCA and remediation-feasibility scheduler with an exact repository target, one-dispatch budget, two-hour same-head retry floor, non-cancelling single-flight heartbeat, and explicit established scheduler credentials.\n"
                  "- Added a dedicated fast-mlsirm hourly caller that preserves Rust-owned psychometric arithmetic while dispatching at most one exact-head, root-cause-driven repair with a two-hour same-head retry floor.\n",
              ),
              (
                  "- Run the bounded DiskSage repair heartbeat at minute 37 of every hour, dispatch no more than one exact-head repair, and wait two hours before redispatching an unchanged head so legitimate OpenCode or NVIDIA NIM latency does not create duplicate writers.\n",
                  "- Run the bounded DiskSage repair heartbeat at minute 37 of every hour, dispatch no more than one exact-head repair, and wait two hours before redispatching an unchanged head so legitimate OpenCode or NVIDIA NIM latency does not create duplicate writers.\n"
                  "- Run the bounded fast-mlsirm repair heartbeat at minute 49 of every hour with one-dispatch scope and a two-hour same-head floor, without weakening true-parameter recovery, CPU/GPU parity, skipped-test, or Rust-ownership gates.\n",
              ),
              (
                  "- Keep the DiskSage caller read-only and pass only the established scheduler credentials; do not inherit secrets, expose the NVIDIA NIM model credential to the queue scanner, use a GitHub Copilot token, or grant the caller repository mutation permissions.\n",
                  "- Keep the DiskSage caller read-only and pass only the established scheduler credentials; do not inherit secrets, expose the NVIDIA NIM model credential to the queue scanner, use a GitHub Copilot token, or grant the caller repository mutation permissions.\n"
                  "- Keep the fast-mlsirm caller read-only and model-secret-free; preserve independent approval, exact-head evidence, and Rust production-arithmetic ownership while centralizing only bounded review repair.\n",
              ),
              (
                  "- Added DiskSage operational documentation for the hourly RCA loop, bounded retry cadence, permission model, standalone and MSA reuse, verification, rollback, and APA 7 references.\n",
                  "- Added DiskSage operational documentation for the hourly RCA loop, bounded retry cadence, permission model, standalone and MSA reuse, verification, rollback, and APA 7 references.\n"
                  "- Added fast-mlsirm operational documentation for the hourly RCA loop, psychometric scientific gates, Rust ownership, bounded retry cadence, credential isolation, modular reuse, rollback, and APA 7 references.\n",
              ),
          )
          for old, new in changelog_replacements:
              if changelog.count(old) != 1:
                  raise RuntimeError(f"unexpected changelog anchor: {old!r}")
              changelog = changelog.replace(old, new)
          changelog_path.write_text(changelog, encoding="utf-8")

          architecture_path = Path("ARCHITECTURE.md")
          architecture = architecture_path.read_text(encoding="utf-8")
          architecture_anchor = (
              "push cannot replace privileged scripts after dispatch (CWE-367). Repair binds\n"
              "`NVIDIA_NIM_API_KEY`, never `COPILOT_GITHUB_TOKEN`.\n"
          )
          architecture_insert = architecture_anchor + (
              "\nProduct callers stagger Clearfolio at minute 23, DiskSage at minute 37, and\n"
              "fast-mlsirm at minute 49. Each caller is read-only, dispatches at most one\n"
              "repair, and delegates all privileged logic to the same sealed scheduler.\n"
          )
          if architecture.count(architecture_anchor) != 1:
              raise RuntimeError("unexpected architecture anchor")
          architecture = architecture.replace(architecture_anchor, architecture_insert)
          related_anchor = (
              "- [`docs/doctoring/hourly-nvidia-nim-autofix.md`](docs/doctoring/hourly-nvidia-nim-autofix.md)\n"
              "  — current increment's repair-worker decision and APA 7th citations.\n"
          )
          related_insert = related_anchor + (
              "- [`docs/doctoring/fast-mlsirm-hourly-review-caller.md`](docs/doctoring/fast-mlsirm-hourly-review-caller.md)\n"
              "  — product-specific psychometric repair heartbeat and scientific gates.\n"
          )
          if architecture.count(related_anchor) != 1:
              raise RuntimeError("unexpected related-document anchor")
          architecture_path.write_text(
              architecture.replace(related_anchor, related_insert),
              encoding="utf-8",
          )
          PY

      - name: Verify the new caller contract
        run: |
          python - <<'PY'
          import runpy

          namespace = runpy.run_path("tests/test_fast_mlsirm_hourly_review_caller.py")
          tests = [
              namespace[name]
              for name in sorted(namespace)
              if name.startswith("test_fast_mlsirm_")
              or name == "test_focused_quality_workflow_tracks_fast_mlsirm_contracts"
          ]
          if len(tests) != 4:
              raise RuntimeError(f"expected four caller tests, found {len(tests)}")
          for test in tests:
              test()
          PY
          python -m compileall -q tests/test_fast_mlsirm_hourly_review_caller.py
          git diff --check

      - name: Commit the product caller and remove the one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-pr-782-fast-mlsirm-caller.yml
          git add \
            .github/workflows/fast-mlsirm-hourly-review-repair.yml \
            .github/workflows/hourly-nvidia-nim-review-repair.yml \
            ARCHITECTURE.md \
            CHANGELOG.md \
            docs/doctoring/fast-mlsirm-hourly-review-caller.md \
            tests/test_fast_mlsirm_hourly_review_caller.py
          git commit -m "feat(automation): schedule fast-mlsirm review repair"
          git push origin HEAD:fix/hourly-nvidia-nim-review-repair-main
