# Reusable Publish Package (workflow_call), centralising the provenance-gated
# sdist/wheel build + optional PyPI publish that fast-mlsirm previously
# carried as publish-pypi.yml. See
# docs/adr/0032-release-pipeline-reusable-workflows.md and
# docs/doctoring/release-pipeline-reusable-workflows.md.
#
# The `on: workflow_dispatch` trigger stays in each calling repo's own thin
# workflow file. Callers that still name that file publish-pypi.yml keep
# required-check / operator muscle memory; the reusable target is always
# publish-package.yml.
#
# Packaging backends:
#   - maturin: pinned maturin sdist + multi-platform wheel matrix (fast-mlsirm)
#   - pure-python: `python -m build` sdist+wheel on ubuntu only
#
# Example caller (.github/workflows/publish-pypi.yml in a product repo).
# Pin `uses:` to this file's exact commit SHA, not @main. Pass secrets with
# `secrets: inherit` (or map PIPY_TOKEN) so the pypi environment's trusted
# publishing / token path keeps working.
#
#   name: Publish Package
#   on:
#     workflow_dispatch:
#       inputs:
#         release_tag: { required: true, type: string }
#         release_commit: { required: true, type: string }
#         control_plane_commit: { required: true, type: string }
#   permissions:
#     contents: read
#   concurrency:
#     group: publish-package-${{ inputs.release_tag }}
#     cancel-in-progress: false
#   jobs:
#     publish:
#       uses: ContextualWisdomLab/.github/.github/workflows/publish-package.yml@<commit-sha>
#       permissions:
#         contents: write
#         id-token: write
#       with:
#         release_tag: ${{ inputs.release_tag }}
#         release_commit: ${{ inputs.release_commit }}
#         control_plane_commit: ${{ inputs.control_plane_commit }}
#         packaging_backend: maturin
#         publish_to_pypi: true
#       secrets: inherit

name: Reusable Publish Package

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Immutable release tag to publish (for example v0.9.0)"
        required: true
        type: string
      release_commit:
        description: "Reviewed release source commit (full lowercase SHA-1)"
        required: true
        type: string
      control_plane_commit:
        description: "Protected default-branch commit that selected this publication workflow"
        required: true
        type: string
      packaging_backend:
        description: "Build backend: maturin (Rust extension) or pure-python (python -m build)."
        required: false
        type: string
        default: "maturin"
      publish_to_pypi:
        description: "When true, publish built distributions to PyPI under the pypi environment."
        required: false
        type: boolean
        default: true
      pypi_environment:
        description: "GitHub Environment name used for PyPI trusted publishing / tokens."
        required: false
        type: string
        default: "pypi"
      maturin_version:
        description: "Pinned maturin-action maturin-version (ignored for pure-python)."
        required: false
        type: string
        default: "v1.14.1"
      pyproject_path:
        description: "Repository-relative path to the project file that carries project.version."
        required: false
        type: string
        default: "pyproject.toml"
      ensure_sdist_license:
        description: >-
          When true (maturin only), inject LICENSE into the sdist if maturin
          omitted it while still writing License-File metadata.
        required: false
        type: boolean
        default: true
    secrets:
      PIPY_TOKEN:
        description: >-
          Optional PyPI API token (legacy spelling matching fast-mlsirm). Prefer
          trusted publishing via the pypi environment; token is used when set.
        required: false

permissions:
  contents: read

concurrency:
  group: publish-package-${{ github.repository }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify packaging backend input
        env:
          PACKAGING_BACKEND: ${{ inputs.packaging_backend }}
        run: |
          set -euo pipefail
          case "$PACKAGING_BACKEND" in
            maturin|pure-python) ;;
            *)
              echo "packaging_backend must be maturin or pure-python, got: $PACKAGING_BACKEND" >&2
              exit 1
              ;;
          esac
      - name: Verify publication control-plane identity
        env:
          CONTROL_PLANE_COMMIT: ${{ inputs.control_plane_commit }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CONTROL_PLANE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "control_plane_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$PUBLISH_REF" != "$expected_ref" ]; then
            echo "package publication must run from $expected_ref, not $PUBLISH_REF" >&2
            exit 1
          fi
          if [ "$CONTROL_PLANE_SHA" != "$CONTROL_PLANE_COMMIT" ]; then
            echo "publication control plane moved after release verification" >&2
            exit 1
          fi
      - name: Validate release source identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0 (release-validated pin)
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.x pin from fast-mlsirm
        with:
          python-version: "3.12"
      - name: Require release tag and source commit to match project version
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PYPROJECT_PATH: ${{ inputs.pyproject_path }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$RELEASE_COMMIT" ]; then
            echo "checked-out release source does not match release_commit" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "release tag is unavailable for provenance verification" >&2
            exit 1
          fi
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "release tag does not target release_commit" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path(os.environ["PYPROJECT_PATH"]).read_bytes()
          )["project"]

          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag does not match project version: expected {expected!r}, got {actual!r}"
              )
          PY

  sdist:
    name: sdist
    needs: verify-release
    if: inputs.packaging_backend == 'maturin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          maturin-version: ${{ inputs.maturin_version }}
          args: --out dist
      - name: Ensure LICENSE is present in the sdist
        if: inputs.ensure_sdist_license
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import io
          import sys
          import tarfile
          from pathlib import Path

          dist = Path("dist")
          archives = sorted(dist.glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected exactly one sdist archive, found {archives!r}")
          archive = archives[0]
          license_path = Path("LICENSE")
          if not license_path.is_file():
              raise SystemExit("checked-out release source is missing LICENSE")
          license_bytes = license_path.read_bytes()

          with tarfile.open(archive, "r:gz") as reader:
              names = reader.getnames()
              members = reader.getmembers()
              file_members = {
                  member.name: reader.extractfile(member).read()
                  for member in members
                  if member.isfile()
              }

          roots = {name.split("/", 1)[0] for name in names if name}
          if len(roots) != 1:
              raise SystemExit(f"sdist must have a single top-level directory, found {sorted(roots)!r}")
          root = next(iter(roots))
          license_member = f"{root}/LICENSE"
          if license_member in file_members:
              if file_members[license_member] != license_bytes:
                  raise SystemExit("sdist LICENSE content does not match checked-out LICENSE")
              print(f"{archive.name} already contains {license_member}")
              sys.exit(0)

          rebuilt = archive.with_suffix(archive.suffix + ".rewritten")
          with tarfile.open(archive, "r:gz") as reader, tarfile.open(rebuilt, "w:gz") as writer:
              for member in members:
                  payload = reader.extractfile(member) if member.isfile() else None
                  writer.addfile(member, payload)
              info = tarfile.TarInfo(name=license_member)
              info.size = len(license_bytes)
              info.mode = 0o644
              writer.addfile(info, io.BytesIO(license_bytes))

          rebuilt.replace(archive)
          with tarfile.open(archive, "r:gz") as reader:
              if license_member not in reader.getnames():
                  raise SystemExit(f"failed to inject {license_member} into {archive.name}")
          print(f"injected {license_member} into {archive.name}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: wheels (${{ matrix.target }}, py${{ matrix.python-version }})
    needs: verify-release
    if: inputs.packaging_backend == 'maturin'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.14"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.14"
            interpreter: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: ${{ inputs.maturin_version }}
          args: --release --out dist -i ${{ matrix.interpreter }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-wheel-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  pure-python-dist:
    name: pure-python sdist+wheel
    needs: verify-release
    if: inputs.packaging_backend == 'pure-python'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          # Hash pins travel with this reusable workflow definition (not the
          # product checkout). Regenerate via:
          #   uv pip compile --generate-hashes --python-version 3.12 \
          #     --python-platform x86_64-manylinux_2_28 \
          #     requirements-publish-build-ci.txt \
          #     -o requirements-publish-build-ci-hashes.txt
          cat > /tmp/requirements-publish-build-ci-hashes.txt <<'EOF'
          build==1.2.2 \
              --hash=sha256:119b2fb462adef986483438377a13b2f42064a2a3a4161f24a0cca698a07ac8c \
              --hash=sha256:277ccc71619d98afdd841a0e96ac9fe1593b823af481d3b0cea748e8894e0613
          packaging==26.3 \
              --hash=sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject-hooks==1.3.3 \
              --hash=sha256:5fc53fdac9f7bd63fbcdc868fb5f90b4784d78a53a3d3388cd738b807441a20b \
              --hash=sha256:defda19b854fa0d3bd4f76ea4ddcba8abd7dcfcdd585a6690ade050744fc5f43
          EOF
          python -m pip install --require-hashes --only-binary=:all: \
            -r /tmp/requirements-publish-build-ci-hashes.txt
          python -m build --outdir dist
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-pure-python
          path: dist

  release-assets:
    name: attach release assets
    needs: [verify-release, sdist, wheels, pure-python-dist]
    if: >-
      always() &&
      needs.verify-release.result == 'success' &&
      (
        (needs.sdist.result == 'success' && needs.wheels.result == 'success') ||
        (needs.pure-python-dist.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List built artifacts
        run: ls -la dist
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Immutable GitHub Releases reject later asset uploads (HTTP 422).
          # Skip cleanly so a PyPI-only republish of an already-cut release is
          # not forced into an overall workflow FAILURE by an unrecoverable
          # asset sink, while still failing closed for mutable releases.
          immutable="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable // false')"
          if [ "$immutable" = "true" ]; then
            echo "release $RELEASE_TAG is immutable; skipping GitHub asset upload"
            exit 0
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY"

  publish-pypi:
    name: publish to PyPI
    needs: [verify-release, sdist, wheels, pure-python-dist]
    if: >-
      always() &&
      inputs.publish_to_pypi &&
      needs.verify-release.result == 'success' &&
      (
        (needs.sdist.result == 'success' && needs.wheels.result == 'success') ||
        (needs.pure-python-dist.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.pypi_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List built artifacts
        run: ls -la dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PIPY_TOKEN }}
          attestations: false
          # Partial publishes (wheels accepted, sdist rejected) must be
          # retryable without failing on already-uploaded filenames.
          skip-existing: true
