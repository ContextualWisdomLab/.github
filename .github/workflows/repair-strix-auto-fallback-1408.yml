name: Repair Strix staged fallback review findings

on:
  push:
    branches:
      - fix/strix-auto-unknown-price-fallback-ready
    paths:
      - .github/workflows/repair-strix-auto-fallback-1408.yml

concurrency:
  group: repair-strix-auto-fallback-1408
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    name: RED-GREEN staged fallback contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/strix-auto-unknown-price-fallback-ready'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/strix-auto-unknown-price-fallback-ready
          fetch-depth: 0

      - name: Install exact focused test runner
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'pytest==8.4.2' \
            'pytest-cov==7.1.0' \
            'interrogate==1.7.0'

      - name: Add fail-first regressions
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/test_contextual_orchestrator_review_runtime_preflight.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from contextlib import redirect_stdout
          import io
          import runpy
          '''
          new_import = '''from contextlib import redirect_stdout
          import io
          import json
          import runpy
          '''
          if text.count(old_import) != 1:
              raise SystemExit('runtime-preflight import anchor changed')
          text = text.replace(old_import, new_import, 1)

          old_anchor = '''    assert failure.value.report["ready_count"] == 0
              assert failure.value.report["primary_attempt"]["ready_count"] == 0


          def test_preflight_transport_is_bounded_and_provider_neutral() -> None:
          '''
          new_anchor = '''    assert failure.value.report["ready_count"] == 0
              assert failure.value.report["primary_attempt"]["ready_count"] == 0


          def test_preflight_stage_limits_share_one_startup_budget() -> None:
              """Free-first and priced-fallback probes must share one bounded route budget."""
              namespace = _load_launcher()
              primary_limit = namespace["_bounded_primary_catalog_limit"](
                  99, pool="auto", has_free_rows=True
              )
              fallback_limit = namespace["_bounded_fallback_catalog_limit"](
                  99, primary_count=primary_limit
              )

              assert primary_limit == 8
              assert fallback_limit == 4
              assert primary_limit + fallback_limit == namespace[
                  "REVIEW_PREFLIGHT_MAX_TOTAL_ROUTES"
              ] == 12
              assert (
                  (primary_limit + fallback_limit)
                  * namespace["REVIEW_PREFLIGHT_TIMEOUT_SECONDS"]
                  < 180
              )
              assert namespace["_bounded_primary_catalog_limit"](
                  99, pool="free", has_free_rows=True
              ) == 12
              assert namespace["_bounded_primary_catalog_limit"](
                  99, pool="auto", has_free_rows=False
              ) == 12


          def test_discovery_counts_survive_stage_specific_policy_reports() -> None:
              """Fallback selection must not erase full discovery cost-tier evidence."""
              namespace = _load_launcher()
              base_report = {"selected_count": 1, "selected": [{"model": "priced/model"}]}
              rows = [
                  {"cost_evidence": "free"},
                  {"cost_evidence": "priced"},
                  {"cost_evidence": "priced"},
                  {"cost_evidence": "unknown"},
              ]

              enriched = namespace["_with_discovery_counts"](base_report, rows)

              assert base_report == {
                  "selected_count": 1,
                  "selected": [{"model": "priced/model"}],
              }
              assert enriched["total_routes"] == 4
              assert enriched["total_free_routes"] == 1
              assert enriched["total_priced_routes"] == 2
              assert enriched["total_unknown_routes"] == 1
              assert enriched["selected"] == [{"model": "priced/model"}]


          def test_temporary_fallback_catalog_is_removed_after_loading(
              tmp_path: Path,
          ) -> None:
              """The price-only handoff file must not survive success or loader failure."""
              namespace = _load_launcher()
              helper = namespace["_load_temporary_agents"]
              path = tmp_path / "review-catalog.json.priced"
              expected = {"agents": [{"id": "priced_route"}]}

              def loader(value: str) -> list[object]:
                  assert json.loads(Path(value).read_text(encoding="utf-8")) == expected
                  return [SimpleNamespace(id="priced_route")]

              loaded = helper(str(path), expected["agents"], loader=loader)
              assert [agent.id for agent in loaded] == ["priced_route"]
              assert not path.exists()

              def failing_loader(value: str) -> list[object]:
                  assert Path(value).exists()
                  raise RuntimeError("loader rejected catalog")

              with pytest.raises(RuntimeError, match="loader rejected catalog"):
                  helper(str(path), expected["agents"], loader=failing_loader)
              assert not path.exists()


          def test_preflight_transport_is_bounded_and_provider_neutral() -> None:
          '''
          if text.count(old_anchor) != 1:
              raise SystemExit('runtime-preflight insertion anchor changed')
          path.write_text(text.replace(old_anchor, new_anchor, 1), encoding='utf-8')
          PY

      - name: Verify RED failures
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q \
            tests/test_contextual_orchestrator_review_runtime_preflight.py \
            -k 'stage_limits or discovery_counts or temporary_fallback' \
            >"$RUNNER_TEMP/strix-fallback-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/strix-fallback-red.log"
          if [ "$status" -eq 0 ]; then
            echo '::error::Fail-first regressions unexpectedly passed before implementation.'
            exit 1
          fi
          grep -q 'test_preflight_stage_limits_share_one_startup_budget' "$RUNNER_TEMP/strix-fallback-red.log"
          grep -q 'test_discovery_counts_survive_stage_specific_policy_reports' "$RUNNER_TEMP/strix-fallback-red.log"
          grep -q 'test_temporary_fallback_catalog_is_removed_after_loading' "$RUNNER_TEMP/strix-fallback-red.log"

      - name: Implement bounded stages and durable audit evidence
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          launcher_path = Path('scripts/ci/contextual_orchestrator_review_launcher.py')
          launcher = launcher_path.read_text(encoding='utf-8')

          old_constants = '''REVIEW_PREFLIGHT_TIMEOUT_SECONDS = 10
          '''
          new_constants = '''REVIEW_PREFLIGHT_TIMEOUT_SECONDS = 10
          # Both free-primary and priced-fallback probes share this ceiling. At
          # ten seconds per route, twelve probes leave one minute inside the
          # sidecar's 180-second readiness deadline for discovery and startup.
          REVIEW_PREFLIGHT_MAX_TOTAL_ROUTES = 12
          REVIEW_PREFLIGHT_PRIMARY_ROUTE_LIMIT = 8
          '''
          if launcher.count(old_constants) != 1:
              raise SystemExit('preflight constant anchor changed')
          launcher = launcher.replace(old_constants, new_constants, 1)

          old_helpers_anchor = '''        report["fallback_reason"] = "primary_routes_unavailable"
              return viable, report, True


          def _write_json(path: str, payload: object) -> None:
          '''
          new_helpers_anchor = '''        report["fallback_reason"] = "primary_routes_unavailable"
              return viable, report, True


          def _bounded_primary_catalog_limit(
              requested_limit: int, *, pool: str, has_free_rows: bool
          ) -> int:
              """Return the primary-stage route limit within one startup budget."""
              if requested_limit < 1:
                  raise ValueError("ORCHESTRATOR_CATALOG_LIMIT must be positive")
              total_limit = min(requested_limit, REVIEW_PREFLIGHT_MAX_TOTAL_ROUTES)
              if pool == "auto" and has_free_rows:
                  return min(total_limit, REVIEW_PREFLIGHT_PRIMARY_ROUTE_LIMIT)
              return total_limit


          def _bounded_fallback_catalog_limit(
              requested_limit: int, *, primary_count: int
          ) -> int:
              """Return remaining priced-fallback capacity after primary selection."""
              if requested_limit < 1:
                  raise ValueError("ORCHESTRATOR_CATALOG_LIMIT must be positive")
              total_limit = min(requested_limit, REVIEW_PREFLIGHT_MAX_TOTAL_ROUTES)
              if primary_count < 0 or primary_count > total_limit:
                  raise ValueError("primary route count exceeds the preflight budget")
              return total_limit - primary_count


          def _with_discovery_counts(
              report: dict[str, object], rows: list[dict[str, Any]]
          ) -> dict[str, object]:
              """Copy a stage report while restoring full discovery-tier counts."""
              enriched = dict(report)
              enriched.update(
                  {
                      "total_routes": len(rows),
                      "total_free_routes": sum(
                          row.get("cost_evidence") == "free" for row in rows
                      ),
                      "total_priced_routes": sum(
                          row.get("cost_evidence") == "priced" for row in rows
                      ),
                      "total_unknown_routes": sum(
                          row.get("cost_evidence") == "unknown" for row in rows
                      ),
                  }
              )
              return enriched


          def _write_json(path: str, payload: object) -> None:
          '''
          if launcher.count(old_helpers_anchor) != 1:
              raise SystemExit('preflight helper anchor changed')
          launcher = launcher.replace(old_helpers_anchor, new_helpers_anchor, 1)

          old_temp_anchor = '''def _write_json(path: str, payload: object) -> None:
              """Write one deterministic UTF-8 JSON evidence file."""
              Path(path).write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\\n", encoding="utf-8"
              )


          def main(argv: list[str] | None = None) -> int:
          '''
          new_temp_anchor = '''def _write_json(path: str, payload: object) -> None:
              """Write one deterministic UTF-8 JSON evidence file."""
              Path(path).write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\\n", encoding="utf-8"
              )


          def _load_temporary_agents(
              path: str, catalog_agents: list[dict[str, Any]], *, loader: Any
          ) -> list[object]:
              """Load one transient catalog and remove it on every exit path."""
              catalog_path = Path(path)
              _write_json(str(catalog_path), {"agents": catalog_agents})
              try:
                  return list(loader(str(catalog_path)))
              finally:
                  catalog_path.unlink(missing_ok=True)


          def main(argv: list[str] | None = None) -> int:
          '''
          if launcher.count(old_temp_anchor) != 1:
              raise SystemExit('temporary catalog helper anchor changed')
          launcher = launcher.replace(old_temp_anchor, new_temp_anchor, 1)

          old_primary = '''    primary_rows = (
                  (free_rows or priced_rows) if args.pool == "auto" else normalized_rows
              )
              result = build_zdr_prioritized_catalog(
                  primary_rows,
                  limit=int(os.environ.get("ORCHESTRATOR_CATALOG_LIMIT", "12")),
                  family_cap=int(os.environ.get("ORCHESTRATOR_CATALOG_FAMILY_CAP", "4")),
                  zdr_endpoints=zdr_endpoints,
                  require_zdr=args.require_zdr,
                  pool=args.pool,
              )
          '''
          new_primary = '''    requested_catalog_limit = int(
                  os.environ.get("ORCHESTRATOR_CATALOG_LIMIT", "12")
              )
              primary_limit = _bounded_primary_catalog_limit(
                  requested_catalog_limit,
                  pool=args.pool,
                  has_free_rows=bool(free_rows),
              )
              primary_rows = (
                  (free_rows or priced_rows) if args.pool == "auto" else normalized_rows
              )
              result = build_zdr_prioritized_catalog(
                  primary_rows,
                  limit=primary_limit,
                  family_cap=int(os.environ.get("ORCHESTRATOR_CATALOG_FAMILY_CAP", "4")),
                  zdr_endpoints=zdr_endpoints,
                  require_zdr=args.require_zdr,
                  pool=args.pool,
              )
              result["report"] = _with_discovery_counts(
                  result["report"], normalized_rows
              )
          '''
          if launcher.count(old_primary) != 1:
              raise SystemExit('primary catalog anchor changed')
          launcher = launcher.replace(old_primary, new_primary, 1)

          old_fallback = '''    agents = load_agents(args.catalog_out)
              fallback_result = None
              fallback_agents: list[object] = []
              if args.pool == "auto" and free_rows:
                  if priced_rows:
                      try:
                          fallback_result = build_zdr_prioritized_catalog(
                              priced_rows,
                              limit=int(os.environ.get("ORCHESTRATOR_CATALOG_LIMIT", "12")),
                              family_cap=int(os.environ.get("ORCHESTRATOR_CATALOG_FAMILY_CAP", "4")),
                              zdr_endpoints=zdr_endpoints,
                              require_zdr=args.require_zdr,
                              pool="auto",
                          )
                      except PolicyError:
                          fallback_result = None
                  if fallback_result is not None:
                      fallback_catalog = f"{args.catalog_out}.priced"
                      Path(fallback_catalog).write_text(
                          json.dumps({"agents": fallback_result["agents"]}, indent=2, sort_keys=True)
                          + "\\n",
                          encoding="utf-8",
                      )
                      fallback_agents = load_agents(fallback_catalog)
          '''
          new_fallback = '''    agents = load_agents(args.catalog_out)
              primary_report = result["report"]
              fallback_result = None
              fallback_agents: list[object] = []
              fallback_limit = _bounded_fallback_catalog_limit(
                  requested_catalog_limit, primary_count=len(result["agents"])
              )
              if args.pool == "auto" and free_rows and priced_rows and fallback_limit:
                  try:
                      fallback_result = build_zdr_prioritized_catalog(
                          priced_rows,
                          limit=fallback_limit,
                          family_cap=int(os.environ.get("ORCHESTRATOR_CATALOG_FAMILY_CAP", "4")),
                          zdr_endpoints=zdr_endpoints,
                          require_zdr=args.require_zdr,
                          pool="auto",
                      )
                  except PolicyError:
                      fallback_result = None
                  if fallback_result is not None:
                      fallback_result["report"] = _with_discovery_counts(
                          fallback_result["report"], normalized_rows
                      )
                      fallback_result["report"]["primary_selected_count"] = primary_report[
                          "selected_count"
                      ]
                      fallback_result["report"]["primary_selection"] = primary_report[
                          "selected"
                      ]
                      fallback_agents = _load_temporary_agents(
                          f"{args.catalog_out}.priced",
                          fallback_result["agents"],
                          loader=load_agents,
                      )
          '''
          if launcher.count(old_fallback) != 1:
              raise SystemExit('fallback catalog anchor changed')
          launcher = launcher.replace(old_fallback, new_fallback, 1)
          launcher_path.write_text(launcher, encoding='utf-8')

          adr_path = Path('docs/adr/0003-contextual-orchestrator-vendored-free-zdr.md')
          adr = adr_path.read_text(encoding='utf-8')
          old_adr = '''   fully price-attested routes and record the rejected primary attempt. This is
             evidence-triggered failover, not an arbitrary free/paid mixing ratio.
          3. **ZDR-first within each cost tier**:
          '''
          new_adr = '''   fully price-attested routes and record the rejected primary attempt. This is
             evidence-triggered failover, not an arbitrary free/paid mixing ratio.
             Both stages share one twelve-route startup budget: at most eight routes
             enter the free primary stage and only the remaining capacity may enter
             priced fallback. Ten-second probes therefore consume at most 120 of the
             sidecar's 180 readiness seconds. Full discovery counts remain in policy
             evidence after fallback, and the transient priced catalog is deleted
             immediately after loading.
          3. **ZDR-first within each cost tier**:
          '''
          if adr.count(old_adr) != 1:
              raise SystemExit('ADR fallback anchor changed')
          adr_path.write_text(adr.replace(old_adr, new_adr, 1), encoding='utf-8')
          PY

      - name: Verify GREEN focused and repository contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_contextual_orchestrator_review_policy.py \
            tests/test_contextual_orchestrator_review_runtime_preflight.py \
            tests/test_contextual_orchestrator_review_live_discovery_contract.py \
            tests/test_contextual_orchestrator_review_sidecar_contract.py \
            tests/test_strix_contextual_orchestrator_contract.py
          python -m pytest -q
          bash scripts/ci/strix_required_workflow_smoke.sh
          bash scripts/ci/test_strix_quick_gate.sh
          python -m compileall -q scripts/ci tests
          git diff --check

      - name: Commit verified repair and remove one-shot workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='fix/strix-auto-unknown-price-fallback-ready'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::Branch moved concurrently; refusing to overwrite ${remote_head}."
            exit 1
          fi

          rm -f .github/workflows/repair-strix-auto-fallback-1408.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/contextual_orchestrator_review_launcher.py \
            tests/test_contextual_orchestrator_review_runtime_preflight.py \
            docs/adr/0003-contextual-orchestrator-vendored-free-zdr.md \
            .github/workflows/repair-strix-auto-fallback-1408.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Repair produced no commit.'
            exit 1
          fi
          git commit -m 'fix(strix): bound staged preflight and preserve audit evidence'
          git push origin "HEAD:${branch}"
