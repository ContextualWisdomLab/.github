name: One-shot Flat Lock GREEN v2

on:
  push:
    branches:
      - fix/trusted-uv-flat-publication-current-main
    paths:
      - .github/workflows/one-shot-flat-lock-green-v2.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-flat-lock-green-v2.yml

permissions:
  contents: write

concurrency:
  group: one-shot-flat-lock-green-v2
  cancel-in-progress: false

jobs:
  green:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      (
        github.ref == 'refs/heads/fix/trusted-uv-flat-publication-current-main' ||
        (
          github.event.pull_request.number == 1124 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'fix/trusted-uv-flat-publication-current-main'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_PARENT_SHA: 56a0b0f132ad271fcdc1b6dcf67a8a5fb509828c
      TARGET_BRANCH: fix/trusted-uv-flat-publication-current-main
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TRIGGER_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable branch boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"

      - name: Apply minimal production correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/ci/materialize_base_python_requirements.py")
          script = script_path.read_text(encoding="utf-8")
          old_policy = '''    return all(
              _is_fully_hash_pinned_requirement(line)
              or _is_bounded_requirement_include(line)
              for line in requirement_lines
          )
          def _is_fully_hash_pinned_requirement(line: str) -> bool:
          '''
          new_policy = '''    return all(
              _is_fully_hash_pinned_requirement(line)
              or _is_bounded_requirement_include(line)
              for line in requirement_lines
          )


          def _is_flat_materializable_lock(content: bytes) -> bool:
              """Return whether content is one standalone exact SHA-256 lock.

              Selected base locks are published under generated flat names. A
              source-relative ``-r`` or ``--requirement`` edge therefore loses
              the source directory that gives the edge meaning. Only independent
              exact package pins cross this boundary until a complete immutable
              include graph can be reconstructed and rewritten.
              """
              lines = _requirement_lines(content)
              requirement_lines = [
                  line for line in lines if line != "--require-hashes"
              ]
              return bool(requirement_lines) and all(
                  _is_fully_hash_pinned_requirement(line)
                  for line in requirement_lines
              )


          def _is_fully_hash_pinned_requirement(line: str) -> bool:
          '''
          if script.count(old_policy) != 1:
              raise SystemExit("flat-lock policy insertion point drifted")
          script = script.replace(old_policy, new_policy, 1)

          old_selection = '''        if _is_candidate_lock_name(candidate.name):
                      content = _git(repo_root, "show", f"{base_sha}:{path}")
                      if _is_hash_pinned(content):
                          locks.append((path, content))
          '''
          new_selection = '''        if _is_candidate_lock_path(candidate):
                      content = _git(repo_root, "show", f"{base_sha}:{path}")
                      if _is_flat_materializable_lock(content):
                          locks.append((path, content))
          '''
          if script.count(old_selection) != 1:
              raise SystemExit("base-lock selection boundary drifted")
          script_path.write_text(
              script.replace(old_selection, new_selection, 1),
              encoding="utf-8",
          )

          old_test = Path("tests/test_flat_lock_publication_boundary.py")
          new_test = Path("tests/test_uv_flat_lock_publication_boundary.py")
          if not old_test.is_file() or new_test.exists():
              raise SystemExit("RED regression path drifted")
          old_test.replace(new_test)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          stale = "- Materialized base Python locks only when every package line is an exact SHA-256 pin or a bounded relative `-r`/`--requirement` include. A lone `--require-hashes` directive, a dotted include such as `./lock.txt`, or `-r other-hashes.txt` no longer enters the trusted build context."
          replacement = "- Excluded relative `-r` and `--requirement` referrers from generated flat base-lock publication while retaining bounded include syntax diagnostics and discovering independently complete direct `.txt` children of `requirements` directories."
          if changelog.count(stale) != 1:
              raise SystemExit("trusted-uv changelog statement drifted")
          changelog_path.write_text(
              changelog.replace(stale, replacement, 1),
              encoding="utf-8",
          )

          doctoring = Path("docs/doctoring/trusted-uv-flat-include-isolation.md")
          if doctoring.exists():
              raise SystemExit("doctoring target unexpectedly exists")
          doctoring.write_text(
              """# Trusted uv flat-include isolation

## Status

Accepted on 2026-08-18 for generated base Python lock publication.

## Buyer-facing failure

The central coverage lane renames every selected source lock to a generated flat
name such as `requirements-000.txt`. A source file containing a relative `-r` or
`--requirement` directive is valid pip syntax, but pip resolves the target
relative to the generated output location. Publishing only the referrer can
therefore fail a downstream repository before its own tests or docstring checks
execute.

## Root cause and decision

Syntax recognition and publication authority were conflated. The bounded
`_is_hash_pinned` diagnostic continues to recognize safe relative include syntax,
but `_is_flat_materializable_lock` admits only non-empty standalone exact
SHA-256 package pins. `base_hash_locks` uses the path-aware candidate predicate,
so independently complete `requirements/ci.txt` and
`service/requirements/package.txt` locks remain eligible.

No URL, proxy, redirect, package index, caller-controlled header, output path,
review authority, or repository write scope is expanded. Relative include
publication remains fail-closed until the materializer can reconstruct an entire
immutable include graph, preserve source-directory identity, rewrite every edge,
and prove the resulting closure.

## Verification and operator action

The RED regression proves that both include spellings previously crossed the
flat boundary and that path-aware nested locks were omitted. GREEN requires the
focused trusted-uv suite, complete central tests, 100% production statement and
branch coverage, complete production docstrings, Python 3.10 and current-stable
compilation, and exact-head protected checks. A downstream repository using
nested requirements should publish one standalone hash-locked closure; operators
must not manually copy or rename an unresolved include.

## Rollback

Do not restore relative include publication. A rollback would reintroduce a
source-relative edge into a namespace that no longer preserves source location.
Restore only after a graph-aware implementation has equivalent RED fixtures,
immutable edge rewriting, and full closure verification.

## APA 7th references

Python Packaging Authority. (2026). *Requirements file format*. pip
documentation. https://pip.pypa.io/en/stable/reference/requirements-file-format/

Python Packaging Authority. (2026). *Secure installs*. pip documentation.
https://pip.pypa.io/en/stable/topics/secure-installs/
""",
              encoding="utf-8",
          )
          PY

      - name: Remove temporary workflows from the verification tree
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-flat-lock-green-v2.yml

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify exact GREEN on current stable Python
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/trusted-uv-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/trusted-uv-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_flat_lock_publication_boundary.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            -q
          python -m coverage report
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 \
            scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_uv_flat_lock_publication_boundary.py
          git diff --check

      - name: Verify minimum Python compatibility
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Compile on minimum supported Python
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_uv_flat_lock_publication_boundary.py

      - name: Publish verified production correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add \
            CHANGELOG.md \
            docs/doctoring/trusted-uv-flat-include-isolation.md \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_flat_lock_publication_boundary.py \
            tests/test_uv_flat_lock_publication_boundary.py
          git config user.name "CWL One-shot Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): isolate relative includes from flat locks"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
