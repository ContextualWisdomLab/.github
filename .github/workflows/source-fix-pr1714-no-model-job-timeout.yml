name: Source Fix PR 1714 No Model Job Timeout

on:
  push:
    branches:
      - fix/no-heuristic-model-job-timeouts
    paths:
      - scripts/ci/source_fix_pr1714_no_model_job_timeout.py
      - .github/workflows/source-fix-pr1714-no-model-job-timeout.yml

concurrency:
  group: source-fix-pr1714-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/no-heuristic-model-job-timeouts | cut -f1)"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install exact test toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply causal-owner repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/source_fix_pr1714_no_model_job_timeout.py
          python -m py_compile scripts/ci/source_fix_pr1714_no_model_job_timeout.py
          git diff --check

      - name: Verify autofix timeout and writer-security contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_pr_review_autofix_writer_security_contract.py \
            tests/test_pr_review_fix_scheduler.py \
            tests/test_required_workflow_queue_contract.py \
            -q
          python -m compileall -q scripts tests
          git diff --check

      - name: Verify exact repair scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github/workflows/pr-review-autofix.yml|tests/test_pr_review_autofix_writer_security_contract.py|CHANGELOG.md|docs/product-technical-gap-baseline.md)$'
          bad="$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$bad"
          remote_head="$(git ls-remote origin refs/heads/fix/no-heuristic-model-job-timeouts | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Exchange repository-scoped OpenCode app token
        id: target_app_token
        shell: bash
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token"
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          test -n "$app_token"
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Publish normal non-force repair commit
        env:
          WORKFLOW_PUSH_TOKEN: ${{ steps.target_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_PUSH_TOKEN"
          remote_head="$(git ls-remote origin refs/heads/fix/no-heuristic-model-job-timeouts | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(autofix): remove leaf model-compute and evidence heuristics"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/no-heuristic-model-job-timeouts
