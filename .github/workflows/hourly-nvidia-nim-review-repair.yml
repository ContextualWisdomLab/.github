      - tests/test_zdr_policy.py
      - tests/test_contextual_orchestrator_review_policy.py
      - tests/test_contextual_orchestrator_review_sidecar_contract.py
      - docs/doctoring/contextual-orchestrator-vendored-sidecar.md
