permissions:
  contents: read

concurrency:
  group: contextual-orchestrator-review-repair-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    name: Scheduler, contextual-orchestrator, writer, and conflict-scope contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact-pinned test-tooling requirements are reflected in the hash lock
        # This job runs bare `pytest -q`, which collects every test under
        # tests/, so it depends on whatever requirements-opencode-review-ci
        # -hashes.txt actually provides -- not just on the trigger path list
        # above. A change that bumps an exact `==` pin in requirements
        # -opencode-review-ci.txt without regenerating the hash lock (via
        # ./scripts/ci/compile_opencode_review_lock.sh, this repo's own
        # documented discipline) would otherwise install and test against
        # the stale, unreflected old version silently. This intentionally
        # does not re-run the compile script itself (it passes --upgrade,
        # so its output legitimately drifts over time as transitive
        # dependencies release new versions -- re-running it here would
        # make this check fail non-deterministically for reasons unrelated
        # to whether this source file's own pins are reflected) and
        # intentionally does not check floor pins (e.g. `hypothesis>=6.100`),
        # since any resolved version satisfying the floor is valid by
        # design; it checks only that every exact `name==version` pin in
        # the source file appears verbatim in the lock.
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
            esac
            case "$line" in
              *'=='*)
                if ! grep -qF -- "${line} " requirements-opencode-review-ci-hashes.txt; then
                  echo "::error::requirements-opencode-review-ci-hashes.txt does not reflect pinned requirement '${line}' -- run ./scripts/ci/compile_opencode_review_lock.sh and commit the result."
                  missing=1
                fi
                ;;
            esac
          done < requirements-opencode-review-ci.txt
          exit "$missing"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt
      - name: Verify scheduler and contextual-orchestrator review-repair contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov=scripts.ci.pr_review_autofix_context \
            --cov=scripts.ci.zdr_policy \
            --cov=scripts.ci.contextual_orchestrator_review_policy \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate \
            --fail-under 100 \
            scripts/ci/pr_review_conflict_scope.py \
            scripts/ci/pr_review_autofix_context.py \
            scripts/ci/zdr_policy.py \
            scripts/ci/contextual_orchestrator_review_policy.py \
            scripts/ci/contextual_orchestrator_review_launcher.py
          python -m compileall -q \
            scripts/ci/pr_review_conflict_scope.py \
            scripts/ci/pr_review_autofix_context.py \
            tests/test_pr_review_conflict_scope.py \
            scripts/ci/zdr_policy.py \
            scripts/ci/contextual_orchestrator_review_policy.py \
            scripts/ci/contextual_orchestrator_review_launcher.py \
            tests/test_zdr_policy.py \
            tests/test_contextual_orchestrator_review_policy.py \
            tests/test_contextual_orchestrator_review_sidecar_contract.py \
            tests/test_hourly_review_repair_callers.py \
            tests/test_github_hourly_conflict_repair.py \
            tests/test_hourly_scheduler_runtime_budget.py \
            tests/test_pr_review_conflict_scope_control_files.py \
            tests/test_hourly_autofix_context_quality_gate.py \
            tests/test_pr_review_conflict_scope_git_executable.py \
            tests/test_pr_review_conflict_scope_ignored_paths.py \
            tests/test_pr_review_conflict_scope_symlink_targets.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_context_head_binding.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            tests/test_pr_review_autofix_writer_security_contract.py
          git diff --check
