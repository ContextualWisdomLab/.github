name: PR 812 Finalize Attempt Artifact Identity

on:
  push:
    branches:
      - fix/opencode-attempt-scoped-coverage-artifact
    paths:
      - ".github/workflows/pr812-finalize-attempt-artifact.yml"

concurrency:
  group: pr812-finalize-attempt-artifact
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.ref == 'refs/heads/fix/opencode-attempt-scoped-coverage-artifact'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact finalizer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Refuse stale or widened finalizer lineage
        env:
          EXPECTED_PARENT_HEAD: f6ae8a81764e16fc529acd960e893c8220af6f64
          FINALIZER_PATH: .github/workflows/pr812-finalize-attempt-artifact.yml
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT_HEAD" HEAD)" = "$FINALIZER_PATH"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Prove current-attempt identity contracts are red
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          output="$(python -m pytest -q tests/test_opencode_coverage_artifact_rerun_contract.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -F "test_coverage_source_artifact_is_attempt_scoped_and_downloaded_by_id" <<<"$output"
          grep -F "test_coverage_source_requires_current_producer_attempt" <<<"$output"
          grep -F "test_temporary_branch_writers_are_absent_from_final_tree" <<<"$output"

      - name: Materialize reviewed current-attempt identity repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/ci/prepare_opencode_attempt_artifact_patch.py
          rm -- .github/workflows/pr812-finalize-attempt-artifact.yml
          rm -- scripts/ci/prepare_opencode_attempt_artifact_patch.py
          git diff --check

      - name: Verify focused and complete green evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q tests/test_opencode_coverage_artifact_rerun_contract.py
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate .
          python -m compileall -q scripts tests
          git diff --check
          expected="$(printf '%s\n' \
            '.github/workflows/opencode-review-dispatch.yml' \
            '.github/workflows/pr812-finalize-attempt-artifact.yml' \
            'CHANGELOG.md' \
            'docs/doctoring/opencode-coverage-artifact-reruns.md' \
            'scripts/ci/prepare_opencode_attempt_artifact_patch.py' | sort)"
          actual="$(git diff --name-only HEAD | sort)"
          test "$actual" = "$expected"

      - name: Exchange OpenCode app token for workflow-file publication
        id: target_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          request_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
          separator='&'
          case "$request_url" in *\?*) ;; *) separator='?' ;; esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token"
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          test -n "$app_token"
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Refuse concurrent writers and publish permanent repair
        env:
          PUSH_TOKEN: ${{ steps.target_app_token.outputs.token }}
          TARGET_BRANCH: fix/opencode-attempt-scoped-coverage-artifact
          EXPECTED_TRIGGER_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test -n "$PUSH_TOKEN"
          echo "::add-mask::$PUSH_TOKEN"
          live_head="$(
            curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${PUSH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/ContextualWisdomLab/.github/pulls/812 \
              | jq -r '.head.sha // empty'
          )"
          test "$live_head" = "$EXPECTED_TRIGGER_HEAD"
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent[bot]@users.noreply.github.com"
          git add -A
          expected="$(printf '%s\n' \
            '.github/workflows/opencode-review-dispatch.yml' \
            '.github/workflows/pr812-finalize-attempt-artifact.yml' \
            'CHANGELOG.md' \
            'docs/doctoring/opencode-coverage-artifact-reruns.md' \
            'scripts/ci/prepare_opencode_attempt_artifact_patch.py' | sort)"
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected"
          git commit -m "fix(opencode): validate current-attempt artifact identity"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TRIGGER_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
