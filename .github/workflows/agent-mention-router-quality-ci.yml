name: Agent Mention Router Quality CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agent-mention-router.yml"
      - ".github/workflows/agent-mention-router-quality-ci.yml"
      - ".github/workflows/agent-mention-noema-dispatch.yml"
      - ".github/workflows/agent-mention-opencode-dispatch.yml"
      - ".github/workflows/opencode-review-dispatch.yml"
      - ".github/workflows/pr-review-merge-scheduler.yml"
      - ".github/workflows/strix.yml"
      - "docs/automation/review-agent-comment-invocation.md"
      - "scripts/ci/agent_mention_router.py"
      - "scripts/ci/agent_mention_sweep.py"
      - "scripts/ci/pr_review_fix_scheduler.py"
      - "scripts/ci/pr_review_merge_scheduler.py"
      - "scripts/ci/test_strix_quick_gate.sh"
      - "tests/test_agent_mention_*.py"
      - "tests/test_opencode_agent_contract.py"
      - "tests/test_opencode_workflow_shell_syntax.py"
      - "tests/test_pr_review_merge_scheduler.py"
      - "tests/test_pr_review_fix_scheduler_coverage.py"
      - "tests/test_required_workflow_queue_contract.py"
      - "requirements-opencode-review-ci-hashes.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-mention-router.yml"
      - ".github/workflows/agent-mention-router-quality-ci.yml"
      - ".github/workflows/agent-mention-noema-dispatch.yml"
      - ".github/workflows/agent-mention-opencode-dispatch.yml"
      - ".github/workflows/opencode-review-dispatch.yml"
      - ".github/workflows/pr-review-merge-scheduler.yml"
      - ".github/workflows/strix.yml"
      - "docs/automation/review-agent-comment-invocation.md"
      - "scripts/ci/agent_mention_router.py"
      - "scripts/ci/agent_mention_sweep.py"
      - "scripts/ci/pr_review_fix_scheduler.py"
      - "scripts/ci/pr_review_merge_scheduler.py"
      - "scripts/ci/test_strix_quick_gate.sh"
      - "tests/test_agent_mention_*.py"
      - "tests/test_opencode_agent_contract.py"
      - "tests/test_opencode_workflow_shell_syntax.py"
      - "tests/test_pr_review_merge_scheduler.py"
      - "tests/test_pr_review_fix_scheduler_coverage.py"
      - "tests/test_required_workflow_queue_contract.py"
      - "requirements-opencode-review-ci-hashes.txt"

concurrency:
  group: agent-mention-router-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact head with comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine exact changed range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            diff_range="${base_sha}...${head_sha}"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
            if [[ "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse "${head_sha}^")"
            fi
            diff_range="${base_sha}..${head_sha}"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          {
            echo "CHANGE_BASE_SHA=$base_sha"
            echo "CHANGE_HEAD_SHA=$head_sha"
            echo "CHANGE_DIFF_RANGE=$diff_range"
          } >>"$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt
      - name: Install exact hash-locked tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt
      - name: Run complete repository suite and bounded branch coverage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/agent_mention_router.py
              scripts/ci/agent_mention_sweep.py
              scripts/ci/pr_review_fix_scheduler.py
              scripts/ci/pr_review_merge_scheduler.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=100
          python -m interrogate --fail-under=100 \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py \
            scripts/ci/pr_review_fix_scheduler.py \
            scripts/ci/pr_review_merge_scheduler.py
          python -m compileall -q scripts/ci tests
          git diff --check "$CHANGE_DIFF_RANGE"
