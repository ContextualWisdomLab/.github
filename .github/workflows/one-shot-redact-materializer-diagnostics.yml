name: One-shot redact materializer diagnostics

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/one-shot-redact-materializer-diagnostics.yml

concurrency:
  group: one-shot-redact-materializer-diagnostics
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Add failing secret-redaction and exact-head contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one test marker in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          sanitizer_test = Path("tests/test_sanitize_github_output_summary.py")
          sanitizer_marker = "\n\ndef test_cli_writes_sanitized_summary(tmp_path, monkeypatch):\n"
          sanitizer_contract = '''

def test_sanitizes_url_and_authorization_before_later_secret_assignment():
    """Mixed one-line diagnostics redact every credential before truncation."""
    sanitized = sanitize_text(
        "failure https://user:url-secret@example.invalid/lock "
        "Authorization: Bearer bearer-secret TOKEN=token-secret\\n"
    )

    assert sanitized == (
        "failure https://<redacted>@example.invalid/lock "
        "Authorization: Bearer <redacted> TOKEN=<redacted>\\n"
    )
    assert "url-secret" not in sanitized
    assert "bearer-secret" not in sanitized
    assert "token-secret" not in sanitized
'''
          replace_once(
              sanitizer_test,
              sanitizer_marker,
              sanitizer_contract + sanitizer_marker,
          )

          diagnostics_test = Path("tests/test_coverage_materializer_failure_diagnostics.py")
          diagnostics_marker = '''

@pytest.mark.parametrize(
    "module",
    [javascript_materializer, python_materializer],
    ids=["javascript", "python"],
)
def test_failure_diagnostics_are_optional_outside_github_actions(
'''
          diagnostics_contract = '''

@pytest.mark.parametrize(
    "module",
    [javascript_materializer, python_materializer],
    ids=["javascript", "python"],
)
def test_failure_diagnostics_redact_secret_like_values(
    module: ModuleType,
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    """Lock-derived failures cannot publish credentials through job outputs."""
    output_file = tmp_path / "github-output"
    secret_reason = (
        "current-head lock https://user:url-secret@example.invalid/lock "
        "Authorization: Bearer bearer-secret TOKEN=token-secret"
    )
    monkeypatch.setenv("GITHUB_OUTPUT", str(output_file))
    monkeypatch.setattr(
        module,
        "materialize",
        _failing_materializer(ValueError(secret_reason)),
    )

    assert _run_main(module, tmp_path) == 1

    published = output_file.read_text(encoding="utf-8")
    assert "- Result: FAIL" in published
    assert "https://&lt;redacted&gt;@example.invalid/lock" in published
    assert "Authorization: Bearer &lt;redacted&gt;" in published
    assert "TOKEN=&lt;redacted&gt;" in published
    assert "url-secret" not in published
    assert "bearer-secret" not in published
    assert "token-secret" not in published


def test_diagnostics_workflow_checks_out_exact_pull_request_head() -> None:
    """Compatibility and coverage evidence must measure the contributor head."""
    workflow = Path(
        ".github/workflows/opencode-coverage-diagnostics-ci.yml"
    ).read_text(encoding="utf-8")

    assert workflow.count("ref: ${{ github.event.pull_request.head.sha }}") == 2
'''
          replace_once(
              diagnostics_test,
              diagnostics_marker,
              diagnostics_contract + diagnostics_marker,
          )
          PY

      - name: Prove the new contracts fail before implementation
        run: |
          set +e
          python -m pytest \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py \
            -q >"${RUNNER_TEMP}/red-phase.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/red-phase.log"
          test "$status" -ne 0
          grep -q "test_failure_diagnostics_redact_secret_like_values" "${RUNNER_TEMP}/red-phase.log"
          grep -q "test_sanitizes_url_and_authorization_before_later_secret_assignment" "${RUNNER_TEMP}/red-phase.log"
          grep -q "test_diagnostics_workflow_checks_out_exact_pull_request_head" "${RUNNER_TEMP}/red-phase.log"

      - name: Apply shared redaction and exact-head implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one implementation marker in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          sanitizer = Path("scripts/ci/sanitize_github_output_summary.py")
          replace_once(
              sanitizer,
              '''    match = SECRET_KEY_RE.search(line)
    if match:
        return f"{line[: match.end()]}<redacted>"
    line = URL_CREDENTIAL_RE.sub(r"\\1<redacted>@", line)
    return AUTH_HEADER_RE.sub(r"\\1\\2 <redacted>", line)
''',
              '''    line = URL_CREDENTIAL_RE.sub(r"\\1<redacted>@", line)
    line = AUTH_HEADER_RE.sub(r"\\1\\2 <redacted>", line)
    match = SECRET_KEY_RE.search(line)
    if match:
        return f"{line[: match.end()]}<redacted>"
    return line
''',
          )

          for file_name, constant_marker in (
              (
                  "scripts/ci/materialize_base_javascript_packages.py",
                  'SHA512_SRI_RE = re.compile(r"^sha512-[A-Za-z0-9+/]{86}==$")\n',
              ),
              (
                  "scripts/ci/materialize_base_python_requirements.py",
                  "UV_EXPORT_TIMEOUT_SECONDS = 120\n",
              ),
          ):
              path = Path(file_name)
              replace_once(path, "import re\n", "import re\nimport runpy\n")
              shared_loader = (
                  constant_marker
                  + "_SANITIZE_TEXT = runpy.run_path(\n"
                  + "    str(pathlib.Path(__file__).with_name(\"sanitize_github_output_summary.py\")),\n"
                  + "    run_name=\"cwl_coverage_summary_sanitizer\",\n"
                  + ")[\"sanitize_text\"]\n"
              )
              replace_once(path, constant_marker, shared_loader)
              replace_once(
                  path,
                  '''    safe_reason = html.escape(
        f"{error.__class__.__name__}: {' '.join(str(error).split())}"[:4096],
        quote=True,
    ).replace(delimiter, "CWL_COVERAGE_SUMMARY_END")
''',
                  '''    redacted_reason = _SANITIZE_TEXT(
        f"{error.__class__.__name__}: {' '.join(str(error).split())}"[:4096]
    )
    safe_reason = html.escape(redacted_reason, quote=True).replace(
        delimiter, "CWL_COVERAGE_SUMMARY_END"
    )
''',
              )

          workflow = Path(".github/workflows/opencode-coverage-diagnostics-ci.yml")
          text = workflow.read_text(encoding="utf-8")
          replacements = (
              (
                  '      - "scripts/ci/materialize_base_python_requirements.py"\n',
                  '      - "scripts/ci/materialize_base_python_requirements.py"\n'
                  '      - "scripts/ci/sanitize_github_output_summary.py"\n',
                  2,
              ),
              (
                  '      - "tests/test_coverage_materializer_failure_diagnostics.py"\n',
                  '      - "tests/test_coverage_materializer_failure_diagnostics.py"\n'
                  '      - "tests/test_sanitize_github_output_summary.py"\n',
                  2,
              ),
              (
                  "          persist-credentials: false\n",
                  "          persist-credentials: false\n"
                  "          ref: ${{ github.event.pull_request.head.sha }}\n",
                  2,
              ),
              (
                  "            scripts/ci/materialize_base_python_requirements.py\n",
                  "            scripts/ci/materialize_base_python_requirements.py \\\n"
                  "            scripts/ci/sanitize_github_output_summary.py\n",
                  1,
              ),
              (
                  "            tests/test_coverage_materializer_failure_diagnostics.py \\\n"
                  "            tests/test_strix_dependency_security_floor.py \\\n",
                  "            tests/test_coverage_materializer_failure_diagnostics.py \\\n"
                  "            tests/test_sanitize_github_output_summary.py \\\n"
                  "            tests/test_strix_dependency_security_floor.py \\\n",
                  1,
              ),
              (
                  "            --cov=scripts.ci.materialize_base_python_requirements \\\n"
                  "            --cov-branch \\\n",
                  "            --cov=scripts.ci.materialize_base_python_requirements \\\n"
                  "            --cov=scripts.ci.sanitize_github_output_summary \\\n"
                  "            --cov-branch \\\n",
                  1,
              ),
              (
                  "            scripts/ci/materialize_base_python_requirements.py\n",
                  "            scripts/ci/materialize_base_python_requirements.py \\\n"
                  "            scripts/ci/sanitize_github_output_summary.py\n",
                  1,
              ),
              (
                  "            scripts/ci/materialize_base_python_requirements.py \\\n"
                  "            tests/test_coverage_materializer_failure_diagnostics.py \\\n",
                  "            scripts/ci/materialize_base_python_requirements.py \\\n"
                  "            scripts/ci/sanitize_github_output_summary.py \\\n"
                  "            tests/test_coverage_materializer_failure_diagnostics.py \\\n"
                  "            tests/test_sanitize_github_output_summary.py \\\n",
                  1,
              ),
          )
          for old, new, expected_count in replacements:
              actual_count = text.count(old)
              if actual_count < expected_count:
                  raise SystemExit(
                      f"workflow marker count for {old!r}: expected at least {expected_count}, got {actual_count}"
                  )
              text = text.replace(old, new, expected_count)
          workflow.write_text(text, encoding="utf-8")

          doctoring = Path("docs/doctoring/coverage-failure-evidence-redaction.md")
          doctoring.write_text(
              '''# Coverage failure evidence redaction

## Decision

Early JavaScript and Python dependency-materialization failures remain blocking,
but no pull-request-derived exception text is written to `GITHUB_OUTPUT` before
secret-like values are redacted. The materializers load the existing trusted
sibling sanitizer by an exact local file path so the central workflow can retain
Python isolated mode (`-I`) without relying on `PYTHONPATH`, site packages, or a
PR-controlled import location.

The publication order is:

1. collapse untrusted exception whitespace and bound the evidence;
2. redact URL credentials and authorization values;
3. redact secret-, token-, password-, connection-, and key-like assignments;
4. HTML-escape the remaining diagnostic context;
5. replace the fixed multiline delimiter if it appears in the value;
6. write the bounded summary while preserving the materializer's nonzero status.

URL and authorization redaction precede assignment redaction because materializer
exceptions are flattened to one line. Otherwise a later `TOKEN=...` match could
truncate the line before an earlier URL credential had been sanitized.

## Verification contract

Regression tests cover both materializers, URL credentials, bearer credentials,
token assignments, HTML escaping, delimiter replacement, length bounds, local
execution without `GITHUB_OUTPUT`, and unchanged failure exit status. The
dedicated Python 3.10/3.14 workflow now checks out the exact pull-request head,
includes the shared sanitizer in its trigger and coverage surfaces, and requires
100% statement, branch, and production-docstring evidence.

This control follows GitHub's environment-file contract while treating job output
as a publication sink rather than a private scratch file. It also follows the
CWE-532 and OWASP guidance to remove or mask tokens, passwords, connection
strings, keys, and other sensitive values before operational evidence is stored
or propagated. It does not claim formal conformance to either source.

## References

GitHub, Inc. (n.d.). *Workflow commands for GitHub Actions*. GitHub Docs.
Retrieved August 5, 2026, from
https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands

MITRE. (2026). *CWE-532: Insertion of sensitive information into log file
(version 4.20)*. Common Weakness Enumeration.
https://cwe.mitre.org/data/definitions/532.html

OWASP Foundation. (n.d.). *Logging cheat sheet*. OWASP Cheat Sheet Series.
Retrieved August 5, 2026, from
https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
''',
              encoding="utf-8",
          )
          PY

      - name: Verify focused coverage, docstrings, syntax, and full tests
        run: |
          python -m pytest \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_strix_dependency_security_floor.py \
            --cov=scripts.ci.materialize_base_javascript_packages \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov=scripts.ci.sanitize_github_output_summary \
            --cov-branch \
            --cov-fail-under=100 \
            -q
          python -m interrogate \
            --fail-under 100 \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m compileall -q \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py
          python -m pytest tests -q
          git diff --check

      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-redact-materializer-diagnostics.yml
          git add \
            .github/workflows/opencode-coverage-diagnostics-ci.yml \
            docs/doctoring/coverage-failure-evidence-redaction.md \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py
          git commit -m "fix(opencode): redact early coverage diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
