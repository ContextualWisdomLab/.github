name: One-shot PR 767 current review fixes

on:
  push:
    branches: [fix/sandboxed-output-resource-bounds]
    paths:
      - .github/workflows/one-shot-pr767-review-fixes.yml

permissions:
  contents: read

concurrency:
  group: one-shot-pr767-current-review-fixes
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/sandboxed-output-resource-bounds'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact locked test tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Add failing review regressions first
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              old_text = dedent(old)
              new_text = dedent(new)
              if source.count(old_text) != 1:
                  raise SystemExit(
                      f"{path}: expected one guarded test replacement, "
                      f"found {source.count(old_text)}"
                  )
              target.write_text(source.replace(old_text, new_text, 1), encoding="utf-8")

          replace_once(
              "tests/test_bounded_subprocess.py",
              """
              def test_run_bounded_command_rejects_empty_command_and_timeout(tmp_path: Path) -> None:
              """,
              """
              def test_join_captures_applies_a_finite_timeout_and_preserves_first_error() -> None:
                  """Every reader receives the finite join bound before the first error returns."""

                  class Capture:
                      """Record join bounds and optionally raise one deterministic failure."""

                      def __init__(self, error: BaseException | None = None) -> None:
                          """Store the optional failure and an empty timeout audit trail."""

                          self.error = error
                          self.timeouts: list[float | None] = []

                      def join(self, timeout: float | None = None) -> None:
                          """Record the requested bound and raise the configured failure."""

                          self.timeouts.append(timeout)
                          if self.error is not None:
                              raise self.error

                  first = Capture(RuntimeError("first reader failure"))
                  sibling = Capture()

                  with pytest.raises(RuntimeError, match="first reader failure"):
                      bounded._join_captures([first, sibling])  # noqa: SLF001

                  assert first.timeouts == [bounded.READER_JOIN_TIMEOUT_SECONDS]
                  assert sibling.timeouts == [bounded.READER_JOIN_TIMEOUT_SECONDS]


              def test_run_bounded_command_rejects_empty_command_and_timeout(tmp_path: Path) -> None:
              """,
          )

          replace_once(
              "tests/test_sandboxed_output_redaction.py",
              """
                  assert redact_command_arguments(
                      ["tool", "--api-key", token, f"TOKEN={token}", token, "plain"]
                  ) == [
                      "tool",
                      "--api-key",
                      REDACTED,
                      f"TOKEN={REDACTED}",
                      REDACTED,
                      "plain",
                  ]
              """,
              """
                  assert redact_command_arguments(
                      ["tool", "--api-key", token, f"TOKEN={token}", token, "plain"]
                  ) == [
                      "tool",
                      "--api-key",
                      REDACTED,
                      f"TOKEN={REDACTED}",
                      REDACTED,
                      "plain",
                  ]
                  assert redact_command_arguments(
                      ["docker", "run", "-e", "TOKEN", "image"]
                  ) == ["docker", "run", "-e", "TOKEN", "image"]
              """,
          )

          replace_once(
              "tests/test_sandboxed_entrypoint_and_cleanup_coverage.py",
              "import runpy\nimport subprocess\nimport sys\n",
              "import runpy\nimport sys\n",
          )
          replace_once(
              "tests/test_sandboxed_entrypoint_and_cleanup_coverage.py",
              """
                  monkeypatch.setattr(
                      sandboxed_web_e2e,
                      "run_shell",
                      lambda *args, **kwargs: subprocess.CompletedProcess(
                          args=["e2e"],
                          returncode=0,
                          stdout="ok\\n",
                          stderr="",
                      ),
                  )
              """,
              """
                  monkeypatch.setattr(
                      sandboxed_web_e2e,
                      "run_shell",
                      lambda *args, **kwargs: bounded_subprocess.BoundedCompletedProcess(
                          args=("e2e",),
                          returncode=0,
                          stdout="ok\\n",
                          stderr="",
                          output_limited=False,
                      ),
                  )
              """,
          )
          replace_once(
              "tests/test_sandboxed_entrypoint_and_cleanup_coverage.py",
              """
                  def fail_capture_finalization(service):
                      raise OSError(f"cannot finalize {service.label}")
              """,
              """
                  def fail_capture_finalization(service):
                      raise ValueError(f"cannot finalize {service.label}")
              """,
          )

          replace_once(
              "tests/test_sandboxed_web_e2e.py",
              """
                  monkeypatch.setattr(
                      sandboxed_web_e2e,
                      "run_shell",
                      lambda command, cwd, env, timeout, output_limit_bytes=sandboxed_web_e2e.bounded_subprocess.DEFAULT_COMMAND_OUTPUT_LIMIT_BYTES: subprocess.CompletedProcess(
                          command,
                          0,
                          stdout="e2e-out\\n",
                          stderr="e2e-err\\n",
                      ),
                  )
              """,
              """
                  monkeypatch.setattr(
                      sandboxed_web_e2e,
                      "run_shell",
                      lambda command, cwd, env, timeout, output_limit_bytes=sandboxed_web_e2e.bounded_subprocess.DEFAULT_COMMAND_OUTPUT_LIMIT_BYTES: sandboxed_web_e2e.bounded_subprocess.BoundedCompletedProcess(
                          args=tuple(sandboxed_web_e2e.shlex.split(command)),
                          returncode=0,
                          stdout="e2e-out\\n",
                          stderr="e2e-err\\n",
                          output_limited=False,
                      ),
                  )
              """,
          )

          path = Path("tests/test_sandboxed_web_e2e_output_limits.py")
          source = path.read_text(encoding="utf-8")
          start = source.index(
              "def test_service_log_overflow_returns_resource_limit_before_e2e(\n"
          )
          end = source.index(
              "\n\ndef test_e2e_output_overflow_is_bounded_and_returns_123(", start
          )
          replacement = dedent(
              '''
              def test_service_log_overflow_returns_resource_limit_before_e2e(
                  tmp_path: Path,
                  capsys,
              ) -> None:
                  """Readiness cannot convert a backend log flood into an ordinary E2E run."""

                  sentinel = tmp_path / "e2e-ran"
                  exit_code = sandboxed_web_e2e.main(
                      [
                          "--repo-root",
                          str(_repository(tmp_path)),
                          "--backend-cmd",
                          _command(
                              "import os\\n"
                              "chunk=b'x'*1024\\n"
                              "while True:\\n"
                              "    os.write(1,chunk)\\n"
                          ),
                          "--backend-ready-url",
                          "http://127.0.0.1:1/ready",
                          "--frontend-cmd",
                          _command("import time; time.sleep(30)"),
                          "--e2e-cmd",
                          _command(
                              f"from pathlib import Path; Path({str(sentinel)!r}).touch()"
                          ),
                          "--service-log-limit-bytes",
                          "4096",
                      ]
                  )
                  captured = capsys.readouterr()
                  payload = _result_payload(captured.out)

                  assert exit_code == bounded.OUTPUT_LIMIT_EXIT_CODE
                  assert "service output exceeded 4096 bytes" in captured.err
                  assert payload["output_limited"] is True
                  assert payload["service_log_limit_bytes"] == 4096
                  assert not sentinel.exists()
              '''
          ).lstrip()
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY

      - name: Prove the regressions fail before production repair
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          python -m pytest -q \
            tests/test_bounded_subprocess.py::test_join_captures_applies_a_finite_timeout_and_preserves_first_error \
            tests/test_sandboxed_output_redaction.py::test_redact_command_arguments_covers_separate_equals_and_direct_tokens \
            tests/test_sandboxed_entrypoint_and_cleanup_coverage.py::test_web_e2e_reports_bounded_capture_finalization_failure \
            tests/test_sandboxed_web_e2e_output_limits.py::test_service_log_overflow_returns_resource_limit_before_e2e
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Review regressions unexpectedly passed before production repair."
            exit 1
          fi
          printf 'Observed the expected failing review-regression state (exit %s).\n' "$status"

      - name: Apply bounded production repairs and update evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              old_text = dedent(old)
              new_text = dedent(new)
              if source.count(old_text) != 1:
                  raise SystemExit(
                      f"{path}: expected one production replacement, "
                      f"found {source.count(old_text)}"
                  )
              target.write_text(source.replace(old_text, new_text, 1), encoding="utf-8")

          replace_once(
              "scripts/ci/bounded_subprocess.py",
              """
              READ_CHUNK_BYTES = 65_536
              TRUNCATION_MARKER = "...[output truncated]...\\n"
              """,
              """
              READ_CHUNK_BYTES = 65_536
              READER_JOIN_TIMEOUT_SECONDS = 30.0
              TRUNCATION_MARKER = "...[output truncated]...\\n"
              """,
          )
          replace_once(
              "scripts/ci/bounded_subprocess.py",
              """
              def _join_captures(captures: Sequence[BoundedOutputCapture]) -> None:
                  """Finalize every stream reader while preserving the first reported failure."""

                  first_error: BaseException | None = None
                  for capture in captures:
                      try:
                          capture.join()
                      except BaseException as error:  # noqa: BLE001 - re-raised after sibling join
                          if first_error is None:
                              first_error = error
                  if first_error is not None:
                      raise first_error
              """,
              """
              def _join_captures(
                  captures: Sequence[BoundedOutputCapture],
                  timeout: float = READER_JOIN_TIMEOUT_SECONDS,
              ) -> None:
                  """Finalize every stream reader within a finite shared wait bound."""

                  first_error: BaseException | None = None
                  for capture in captures:
                      try:
                          capture.join(timeout)
                      except BaseException as error:  # noqa: BLE001 - re-raised after sibling join
                          if first_error is None:
                              first_error = error
                  if first_error is not None:
                      raise first_error
              """,
          )
          replace_once(
              "scripts/ci/redact_sensitive_log.py",
              """
                      option = argument.lstrip("-")
                      if "=" in option:
                          key, _value = option.split("=", 1)
                          if SENSITIVE_OPTION_RE.fullmatch(key):
                              separator_index = argument.find("=")
                              redacted.append(f"{argument[: separator_index + 1]}{REDACTED}")
                              continue

                      redacted.append(redact_text(argument))
                      if SENSITIVE_OPTION_RE.fullmatch(option):
                          redact_next = True
              """,
              """
                      is_option = argument.startswith("-")
                      option = argument.lstrip("-")
                      if "=" in option:
                          key, _value = option.split("=", 1)
                          if SENSITIVE_OPTION_RE.fullmatch(key):
                              separator_index = argument.find("=")
                              redacted.append(f"{argument[: separator_index + 1]}{REDACTED}")
                              continue

                      redacted.append(redact_text(argument))
                      if is_option and SENSITIVE_OPTION_RE.fullmatch(option):
                          redact_next = True
              """,
          )
          replace_once(
              "scripts/ci/sandboxed_web_e2e.py",
              "            except (OSError, RuntimeError, subprocess.SubprocessError):\n",
              "            except Exception:  # noqa: BLE001 - cleanup must finish all services\n",
          )
          replace_once(
              "CHANGELOG.md",
              """
              ### Fixed

              - Replace quadratic sensitive-assignment rescanning with a bounded forward scan so one long ordinary diagnostic token cannot cause disproportionate log-processing work.
              """,
              """
              ### Fixed

              - Bound every normal-path output-reader join to 30 seconds, preserve the first reader failure after finalizing siblings, and keep web-E2E result emission and sandbox cleanup running after arbitrary ordinary cleanup exceptions.
              - Treat only dash-prefixed credential options as consumers of a following argument while retaining redaction for sensitive `KEY=value` assignments and provider-shaped values.
              - Replace quadratic sensitive-assignment rescanning with a bounded forward scan so one long ordinary diagnostic token cannot cause disproportionate log-processing work.
              """,
          )
          replace_once(
              "docs/doctoring/sandboxed-output-resource-bounds.md",
              "A truncation marker is included inside, not in addition to, the declared retained byte budget. Reader errors and reader-join timeouts are explicit failures.\n",
              "A truncation marker is included inside, not in addition to, the declared retained byte budget. Every normal-path reader join uses a finite 30-second bound, finalizes every sibling capture, and then re-raises the first failure. A drain that still has not reached EOF therefore becomes the explicit `bounded output drain did not finish` failure instead of holding the control-plane job indefinitely. Web-E2E service cleanup maps ordinary cleanup exceptions to the bounded failure result while continuing result emission and sandbox deletion.\n",
          )
          replace_once(
              "docs/doctoring/sandboxed-command-log-redaction.md",
              "- Sensitive option detection uses explicit credential terms. Ambiguous short flags such as `-p` are not guessed because they can mean port, path, project, or password depending on the child tool.\n",
              "- Sensitive option detection uses explicit credential terms and requires a dash-prefixed option before consuming the following argument. Bare words such as `TOKEN` remain ordinary positional evidence, while sensitive `KEY=value` assignments continue through the earlier assignment-redaction path. Ambiguous short flags such as `-p` are not guessed because they can mean port, path, project, or password depending on the child tool.\n",
          )
          PY

      - name: Verify complete exact-head quality contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci
          python -m compileall -q scripts tests
          bash -n \
            scripts/ci/run_opencode_review_model_pool.sh \
            scripts/ci/sandboxed_verify.py \
            scripts/ci/sandboxed_web_e2e.py
          git diff --check

      - name: Publish verified repair and remove the one-shot workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          BRANCH_NAME: fix/sandboxed-output-resource-bounds
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/one-shot-pr767-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No review repair generated" >&2; exit 1; }
          git commit -m "fix(ci): close sandbox evidence review gaps"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH_NAME}"
