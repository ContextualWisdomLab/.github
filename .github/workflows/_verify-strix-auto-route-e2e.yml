name: Verify Strix auto gateway route

on:
  push:
    branches:
      - verify/strix-auto-route-e2e-687087b

permissions:
  contents: read

concurrency:
  group: verify-strix-auto-route-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.15.1
        with:
          egress-policy: audit
          disable-file-monitoring: true

      - name: Checkout disposable verification branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Pin verification to PR exact-head gate
        shell: bash
        env:
          EXPECTED_PR_HEAD: 687087b55b2f359501f29971ae834d986778d766
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PR_HEAD"
          test "$(git rev-parse HEAD^:scripts/ci/strix_quick_gate.sh)" = \
            "$(git rev-parse HEAD:scripts/ci/strix_quick_gate.sh)"
          test "$(git rev-parse HEAD^:scripts/ci/strix_model_utils.sh)" = \
            "$(git rev-parse HEAD:scripts/ci/strix_model_utils.sh)"
          test "$(git rev-parse HEAD^:scripts/ci/contextual_orchestrator_review_sidecar.sh)" = \
            "$(git rev-parse HEAD:scripts/ci/contextual_orchestrator_review_sidecar.sh)"
          printf 'Verified unchanged gate blobs from PR exact head %s.\n' "$EXPECTED_PR_HEAD"

      - name: Provision real contextual-orchestrator sidecar
        shell: bash
        env:
          BYTEZ_API_KEY: ${{ secrets.BYTEZ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_API_KEY_SUB: ${{ secrets.NVIDIA_NIM_API_KEY_SUB }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXTUAL_ORCHESTRATOR_REQUIRE_ZDR: "false"
          CONTEXTUAL_ORCHESTRATOR_POOL: auto
        run: |
          set -euo pipefail
          bash scripts/ci/contextual_orchestrator_review_sidecar.sh

      - name: Prepare trusted auto-route probe
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/load_contextual_orchestrator_token.sh

          if [ "${CONTEXTUAL_ORCHESTRATOR_BASE_URL:-}" != "http://127.0.0.1:18080" ]; then
            echo '::error::Sidecar did not export the pinned process-local origin.'
            exit 1
          fi

          verification_root="$RUNNER_TEMP/strix-auto-route-e2e"
          input_root="$verification_root/inputs"
          target_root="$verification_root/target"
          executable_root="$verification_root/bin"
          evidence_file="$verification_root/route-evidence.json"
          gate_log="$verification_root/gate.log"
          mkdir -p "$input_root" "$target_root" "$executable_root"
          chmod go-w "$verification_root" "$input_root" "$target_root" "$executable_root"

          printf '%s' 'orchestrator/auto' > "$input_root/model.txt"
          printf '%s' 'http://127.0.0.1:18080/v1' > "$input_root/api-base.txt"
          printf '%s' "$CONTEXTUAL_ORCHESTRATOR_TOKEN" > "$input_root/api-key.txt"
          chmod 600 "$input_root/model.txt" "$input_root/api-base.txt" "$input_root/api-key.txt"
          cat > "$target_root/app.py" <<'PY'
          def answer() -> int:
              return 42
          PY

          cat > "$executable_root/strix-route-probe" <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import sys
          import urllib.error
          import urllib.request

          expected_model = "openai/orchestrator/auto"
          expected_base = "http://127.0.0.1:18080/v1"
          llm_model = os.environ.get("LLM_MODEL", "")
          strix_llm = os.environ.get("STRIX_LLM", "")
          api_base = os.environ.get("LLM_API_BASE", "")
          api_key = os.environ.get("LLM_API_KEY", "")
          evidence_path = Path(os.environ["FAKE_STRIX_EVIDENCE_FILE"])

          if llm_model != expected_model or strix_llm != expected_model:
              raise SystemExit(
                  f"gate did not preserve auto virtual pool: LLM_MODEL={llm_model!r} "
                  f"STRIX_LLM={strix_llm!r}"
              )
          if api_base != expected_base:
              raise SystemExit(f"gate supplied unexpected API base: {api_base!r}")
          if not api_key:
              raise SystemExit("gate did not supply the contextual-orchestrator bearer")
          if "-n" not in sys.argv or "-t" not in sys.argv or "--scan-mode" not in sys.argv:
              raise SystemExit(f"unexpected Strix invocation: {sys.argv!r}")

          gateway_model = llm_model.removeprefix("openai/")
          payload = json.dumps(
              {
                  "model": gateway_model,
                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply with exactly ROUTE_OK.",
                      }
                  ],
                  "max_tokens": 16,
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"{api_base.rstrip('/')}/chat/completions",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  status = response.status
                  body = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")[:1000]
              raise SystemExit(f"gateway returned HTTP {exc.code}: {detail}") from exc

          choices = body.get("choices") or []
          if status != 200 or not choices:
              raise SystemExit(
                  f"gateway route did not produce a completion: status={status} body={body!r}"
              )

          evidence = {
              "contract": "strix-auto-route-e2e-v1",
              "gate_model": llm_model,
              "gate_api_base": api_base,
              "gateway_model": gateway_model,
              "gateway_status": status,
              "choices_count": len(choices),
              "response_model": body.get("model"),
          }
          evidence_path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Vulnerabilities 0")
          PY
          chmod 755 "$executable_root/strix-route-probe"
          executable_sha="$(sha256sum "$executable_root/strix-route-probe" | awk '{print $1}')"

          {
            printf 'STRIX_INPUT_FILE_ROOT=%s\n' "$input_root"
            printf 'STRIX_LLM_FILE=%s\n' "$input_root/model.txt"
            printf 'LLM_API_BASE_FILE=%s\n' "$input_root/api-base.txt"
            printf 'LLM_API_KEY_FILE=%s\n' "$input_root/api-key.txt"
            printf 'STRIX_EXECUTABLE_PATH=%s\n' "$executable_root/strix-route-probe"
            printf 'STRIX_EXECUTABLE_ROOT=%s\n' "$executable_root"
            printf 'STRIX_EXECUTABLE_SHA256=%s\n' "$executable_sha"
            printf 'STRIX_REPO_ROOT=%s\n' "$target_root"
            printf 'STRIX_TARGET_PATH=./\n'
            printf 'STRIX_SOURCE_DIRS=.\n'
            printf 'STRIX_SCAN_MODE=quick\n'
            printf 'STRIX_DISABLE_PR_SCOPING=1\n'
            printf 'STRIX_LLM_DEFAULT_PROVIDER=contextual_orchestrator\n'
            printf 'STRIX_REASONING_EFFORT=none\n'
            printf 'STRIX_FALLBACK_MODELS=\n'
            printf 'STRIX_FAIL_ON_PROVIDER_SIGNAL=1\n'
            printf 'STRIX_TRANSIENT_RETRY_PER_MODEL=0\n'
            printf 'STRIX_PROCESS_TIMEOUT_SECONDS=180\n'
            printf 'STRIX_TOTAL_TIMEOUT_SECONDS=240\n'
            printf 'LLM_TIMEOUT=120\n'
            printf 'IS_PR_EVIDENCE_RUN=true\n'
            printf 'FAKE_STRIX_EVIDENCE_FILE=%s\n' "$evidence_file"
            printf 'ROUTE_EVIDENCE_FILE=%s\n' "$evidence_file"
            printf 'ROUTE_GATE_LOG=%s\n' "$gate_log"
          } >> "$GITHUB_ENV"

      - name: Execute patched gate through real gateway
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/strix_quick_gate.sh 2>&1 | tee "$ROUTE_GATE_LOG"

      - name: Verify routed completion evidence
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'LLM_API_BASE must be an https URL' "$ROUTE_GATE_LOG"; then
            echo '::error::Patched gate still rejected the pinned loopback gateway.'
            exit 1
          fi
          python3 - "$ROUTE_EVIDENCE_FILE" <<'PY'
          import json
          from pathlib import Path
          import sys

          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert evidence["contract"] == "strix-auto-route-e2e-v1", evidence
          assert evidence["gate_model"] == "openai/orchestrator/auto", evidence
          assert evidence["gate_api_base"] == "http://127.0.0.1:18080/v1", evidence
          assert evidence["gateway_model"] == "orchestrator/auto", evidence
          assert evidence["gateway_status"] == 200, evidence
          assert evidence["choices_count"] >= 1, evidence
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
