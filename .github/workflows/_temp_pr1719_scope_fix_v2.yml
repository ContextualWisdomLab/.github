name: Temporary PR 1719 scope documentation repair v2

on:
  push:
    branches:
      - fix/org-required-workflow-rollout-doc-accuracy
    paths:
      - .github/workflows/_temp_pr1719_scope_fix_v2.yml

permissions:
  contents: read

concurrency:
  group: temp-pr1719-scope-doc-repair-v2
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github' && github.ref == 'refs/heads/fix/org-required-workflow-rollout-doc-accuracy'
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact writer head and publication credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'workflow-starting mutation credential is required' >&2; exit 1; }
          git fetch origin fix/org-required-workflow-rollout-doc-accuracy
          test "$(git rev-parse origin/fix/org-required-workflow-rollout-doc-accuracy)" = "$GITHUB_SHA"
      - name: Repair scope prose and prove permanent contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/org-required-workflow-rollout.md')
          text = p.read_text(encoding='utf-8')
          old = '''The active ruleset no longer maintains a repository-name allowlist. Live
          ruleset inspection on 2026-09-02 KST reports
          `repository_name.include=["~ALL"]`, so all current and future organization
          repositories inherit the ten central required workflows on their default
          branch unless a later ruleset exclusion is added. The table below is the public
          non-fork inventory snapshot and rollout ledger, not the ruleset target list.'''
          new = '''The active ruleset uses `repository_name.include=["~ALL"]` together with the
          canonical exclusions `.github`, `noema`, and `IRT-bibliography-set`, matching
          `scripts/ci/audit_central_required_workflows.py::EXPECTED_EXCLUSIONS` and the
          live ruleset contract verified on 2026-09-02 KST. Every current or future
          organization repository outside that exclusion set inherits the ten central
          required workflows on its default branch. The table below is the public
          non-fork inventory snapshot and rollout ledger, not the ruleset target list.'''
          if text.count(old) != 1:
              raise SystemExit('rollout scope text drifted; expected exactly one stale contract')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_org_required_workflow_scope_contract.py \
            tests/test_code_scanning_required_workflow_contract.py \
            tests/test_central_required_workflow_ruleset_audit.py \
            tests/test_central_required_workflow_exact_inventory.py
          git diff --check
      - name: Publish and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp_pr1719_scope_fix_v2.yml
          git add docs/org-required-workflow-rollout.md .github/workflows/_temp_pr1719_scope_fix_v2.yml
          git diff --cached --check
          git config user.name 'ContextualWisdomLab repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(governance): align rollout scope with live exclusions'
          git fetch origin fix/org-required-workflow-rollout-doc-accuracy
          test "$(git rev-parse origin/fix/org-required-workflow-rollout-doc-accuracy)" = "$GITHUB_SHA"
          auth_header="Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: $auth_header" push origin HEAD:fix/org-required-workflow-rollout-doc-accuracy
