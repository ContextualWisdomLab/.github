name: Finalize PR 790 transport repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/finalize-pr790-transport.yml

permissions:
  contents: read

concurrency:
  group: finalize-pr790-transport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.number == 790 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/trusted-uv-transient-download-retry'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Preserve exact RED transport evidence
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          python -m pytest -q tests/test_trusted_uv_portability_and_streaming.py \
            >"${RUNNER_TEMP}/pr790-red.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/pr790-red.log"
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected genuine pytest assertion failures, observed exit ${status}."
            exit 1
          fi
          grep -F 'retries_only_closed_http_status_set[425]' "${RUNNER_TEMP}/pr790-red.log"
          grep -F 'does_not_retry_tls_certificate_failure' "${RUNNER_TEMP}/pr790-red.log"
          grep -F 'does_not_retry_non_temporary_dns_failure' "${RUNNER_TEMP}/pr790-red.log"
          grep -F 'does_not_retry_unclassified_os_error' "${RUNNER_TEMP}/pr790-red.log"

      - name: Apply permanent production and evidence repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/ci/finalize_pr790_transport.py
          rm -f \
            .github/workflows/finalize-pr790-transport.yml \
            .github/workflows/repair-pr790-closed-classifier.yml \
            .github/workflows/repair-pr790-transport-classification.yml \
            scripts/ci/finalize_pr790_transport.py
          git diff --check

      - name: Verify focused and complete quality contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q tests/test_trusted_uv_portability_and_streaming.py
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci
          python -m compileall -q scripts tests
          git diff --check

      - name: Publish workflow-free exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm -f \
            .github/workflows/export-pr790-final-source.yml \
            .github/workflows/finalize-pr790-transport.yml \
            .github/workflows/repair-pr790-closed-classifier.yml \
            .github/workflows/repair-pr790-transport-classification.yml \
            scripts/ci/finalize_pr790_transport.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No verified repair generated" >&2; exit 1; }
          git commit -m "fix(coverage): classify transient uv transport failures"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${HEAD_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_BRANCH}"
