name: OpenCode Coverage Artifact Rerun Repair

on:
  push:
    branches:
      - fix/opencode-attempt-scoped-coverage-artifact
    paths:
      - ".github/workflows/opencode-coverage-artifact-rerun-repair.yml"

concurrency:
  group: opencode-coverage-artifact-rerun-repair
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  materialize-and-export:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.ref == 'refs/heads/fix/opencode-attempt-scoped-coverage-artifact'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Materialize attempt-scoped artifact repair
        run: python scripts/ci/prepare_opencode_attempt_artifact_patch.py

      - name: Verify focused regression
        run: python -m pytest tests/test_opencode_coverage_artifact_rerun_contract.py -q

      - name: Verify complete central test suite
        run: python -m pytest tests -q

      - name: Verify compilation and bounded patch
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/opencode-review-dispatch.yml' 'CHANGELOG.md' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected materialized paths:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Upload verified repair payload
        id: repair_payload_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-attempt-artifact-repair-payload-${{ github.run_attempt }}
          path: |
            .github/workflows/opencode-review-dispatch.yml
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 1
