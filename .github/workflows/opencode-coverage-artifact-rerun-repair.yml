name: OpenCode Coverage Artifact Rerun Repair

on:
  push:
    branches:
      - fix/opencode-attempt-scoped-coverage-artifact
    paths:
      - ".github/workflows/opencode-coverage-artifact-rerun-repair.yml"

concurrency:
  group: opencode-coverage-artifact-rerun-repair
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.ref == 'refs/heads/fix/opencode-attempt-scoped-coverage-artifact'
      && github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply exact attempt-scoped artifact repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/opencode-review-dispatch.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          replacements = [
              (
                  """    permissions:
              contents: read
              id-token: write
            env:
          """,
                  """    permissions:
              contents: read
              id-token: write
            outputs:
              coverage_source_artifact_id: ${{ steps.coverage_source_upload.outputs.artifact-id }}
            env:
          """,
              ),
              (
                  """      - name: Upload materialized pull request merge tree
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                  name: opencode-coverage-source
                  path: ${{ runner.temp }}/opencode-coverage-source.tar
                  if-no-files-found: error
                  retention-days: 1
          """,
                  """      - name: Upload materialized pull request merge tree
                id: coverage_source_upload
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                  name: opencode-coverage-source-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/opencode-coverage-source.tar
                  if-no-files-found: error
                  retention-days: 1
          """,
              ),
              (
                  """      - name: Download materialized pull request merge tree
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                  name: opencode-coverage-source
                  path: ${{ runner.temp }}/opencode-coverage-artifact
          
                - name: Prepare pull request merge tree for coverage measurement
          """,
                  """      - name: Download current-attempt materialized pull request merge tree
                id: coverage_source_download
                continue-on-error: true
                uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                  artifact-ids: ${{ needs.coverage-source-tree.outputs.coverage_source_artifact_id }}
                  path: ${{ runner.temp }}/opencode-coverage-artifact
          
                - name: Report missing current-attempt coverage source
                  if: steps.coverage_source_download.outcome != 'success'
                  env:
                    GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
                  run: |
                    set -euo pipefail
                    echo "::error::Coverage source evidence is unavailable for workflow run attempt ${GITHUB_RUN_ATTEMPT}; a failed-jobs-only rerun cannot safely reconstruct or reuse source evidence from another attempt."
                    echo "::error::Use a full rerun or a fresh repository dispatch so coverage-source-tree uploads exact current-attempt evidence."
                    exit 1
          
                - name: Prepare pull request merge tree for coverage measurement
          """,
              ),
          ]

          for old, new in replacements:
              count = workflow.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one trusted workflow replacement target, found {count}."
                  )
              workflow = workflow.replace(old, new, 1)

          workflow_path.write_text(workflow, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Fixed\n\n"
          entry = (
              "- Bound OpenCode coverage source artifacts to one workflow attempt and immutable "
              "artifact ID, retained one-day source evidence, and made failed-jobs-only reruns "
              "fail closed with full-rerun or fresh-dispatch guidance instead of searching for "
              "expired or prior-attempt artifacts.\n"
          )
          if changelog.count(marker) != 1:
              raise SystemExit("Expected exactly one Unreleased Fixed marker.")
          if entry not in changelog:
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

          rm .github/workflows/opencode-coverage-artifact-rerun-repair.yml

      - name: Verify focused regression is green
        run: python -m pytest tests/test_opencode_coverage_artifact_rerun_contract.py -q

      - name: Verify complete central test suite
        run: python -m pytest tests -q

      - name: Verify Python compilation and clean patch
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit verified direct repair and remove bootstrap
        env:
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          TARGET_BRANCH: fix/opencode-attempt-scoped-coverage-artifact
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::PR_REVIEW_MERGE_TOKEN is required to publish the verified workflow-file repair."
            exit 1
          fi
          echo "::add-mask::$PUSH_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/opencode-review-dispatch.yml \
            .github/workflows/opencode-coverage-artifact-rerun-repair.yml \
            CHANGELOG.md
          git commit -m "fix(opencode): bind coverage source artifacts to attempts"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
