name: One-shot PR 743 complete bounded repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-pr743-apply-git-isolation.yml

concurrency:
  group: one-shot-pr743-complete-bounded-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/trusted-uv-lock-coverage-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply, verify, and materialize bounded repair commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -I - <<'PY'
          from pathlib import Path

          def ensure_exact_replacement(
              path: Path,
              old: str,
              new: str,
              expected: int,
          ) -> None:
              """Apply or verify one exact bounded repair without partial states."""
              content = path.read_text(encoding="utf-8")
              old_count = content.count(old)
              new_count = content.count(new)
              if old_count == expected and new_count == 0:
                  path.write_text(content.replace(old, new), encoding="utf-8")
                  return
              if old_count == 0 and new_count == expected:
                  return
              raise SystemExit(
                  f"{path}: invalid repair state old={old_count} new={new_count}"
              )

          review_workflow = Path(".github/workflows/opencode-review-dispatch.yml")
          unisolated_git = (
              "              GIT_CONFIG_COUNT=1 \\\n"
              "              GIT_CONFIG_KEY_0=safe.directory \\\n"
          )
          isolated_git = (
              "              GIT_CONFIG_NOSYSTEM=1 \\\n"
              "              GIT_CONFIG_GLOBAL=/dev/null \\\n"
              + unisolated_git
          )
          ensure_exact_replacement(
              review_workflow,
              unisolated_git,
              isolated_git,
              3,
          )

          strix_test = Path("scripts/ci/test_strix_quick_gate.sh")
          ensure_exact_replacement(
              strix_test,
              "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6",
              "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0",
              1,
          )

          Path(".github/workflows/one-shot-pr743-apply-git-isolation.yml").unlink()
          PY
          python3 -I - <<'PY'
          import runpy
          from pathlib import Path

          review_workflow = Path(
              ".github/workflows/opencode-review-dispatch.yml"
          ).read_text(encoding="utf-8")
          runtime = review_workflow.split("          trusted_git() {", 1)[0]
          assert runtime.count("              GIT_CONFIG_COUNT=1 " + chr(92)) == 3
          assert runtime.count("              GIT_CONFIG_NOSYSTEM=1 " + chr(92)) == 3
          assert runtime.count("              GIT_CONFIG_GLOBAL=/dev/null " + chr(92)) == 3

          strix_test = Path("scripts/ci/test_strix_quick_gate.sh").read_text(
              encoding="utf-8"
          )
          assert "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6" not in strix_test
          assert strix_test.count(
              "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0"
          ) == 1

          cleanup_contract = runpy.run_path(
              "tests/test_repository_branch_coverage_pr743_cleanup.py"
          )
          cleanup_contract[
              "test_opencode_runtime_git_calls_use_fully_isolated_configuration"
          ]()
          cleanup_contract["test_pr743_temporary_write_workflows_are_absent"]()
          PY
          bash -n scripts/ci/test_strix_quick_gate.sh
          python3 -m py_compile \
            tests/test_repository_branch_coverage_pr743_cleanup.py \
            tests/test_repository_branch_coverage_reporting_edges.py \
            tests/test_trusted_uv_portability_and_streaming.py
          git diff --check
          test ! -e .github/workflows/one-shot-pr743-apply-git-isolation.yml

          base_tree="$(
            gh api -X GET "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_HEAD}" \
              --jq '.tree.sha'
          )"
          review_blob="$(
            jq -Rs '{content: ., encoding: "utf-8"}' \
              <.github/workflows/opencode-review-dispatch.yml \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - --jq '.sha'
          )"
          strix_blob="$(
            jq -Rs '{content: ., encoding: "utf-8"}' \
              <scripts/ci/test_strix_quick_gate.sh \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - --jq '.sha'
          )"
          tree_sha="$(
            jq -n \
              --arg base_tree "$base_tree" \
              --arg review_blob "$review_blob" \
              --arg strix_blob "$strix_blob" \
              '{
                base_tree: $base_tree,
                tree: [
                  {
                    path: ".github/workflows/opencode-review-dispatch.yml",
                    mode: "100644",
                    type: "blob",
                    sha: $review_blob
                  },
                  {
                    path: "scripts/ci/test_strix_quick_gate.sh",
                    mode: "100755",
                    type: "blob",
                    sha: $strix_blob
                  },
                  {
                    path: ".github/workflows/one-shot-pr743-apply-git-isolation.yml",
                    mode: "100644",
                    type: "blob",
                    sha: null
                  }
                ]
              }' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/trees" \
                  --input - --jq '.sha'
          )"
          commit_sha="$(
            jq -n \
              --arg message "fix(ci): complete bounded PR 743 review repairs" \
              --arg tree "$tree_sha" \
              --arg parent "$EXPECTED_HEAD" \
              '{message: $message, tree: $tree, parents: [$parent]}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/commits" \
                  --input - --jq '.sha'
          )"
          test -n "$commit_sha"
          echo "BOUNDED_REPAIR_COMMIT_SHA=$commit_sha"
