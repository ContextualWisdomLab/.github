name: One-shot PR 743 apply Git isolation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-pr743-apply-git-isolation.yml

concurrency:
  group: one-shot-pr743-apply-git-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/trusted-uv-lock-coverage-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply, verify, and publish bounded repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -I - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/opencode-review-dispatch.yml")
          content = workflow_path.read_text(encoding="utf-8")
          old = (
              "              GIT_CONFIG_COUNT=1 \\\n"
              "              GIT_CONFIG_KEY_0=safe.directory \\\n"
          )
          new = (
              "              GIT_CONFIG_NOSYSTEM=1 \\\n"
              "              GIT_CONFIG_GLOBAL=/dev/null \\\n"
              + old
          )
          occurrences = content.count(old)
          if occurrences != 3:
              raise SystemExit(
                  f"expected three unisolated Git configuration blocks, found {occurrences}"
              )
          repaired = content.replace(old, new)
          if repaired.count("              GIT_CONFIG_NOSYSTEM=1 \\\n") != 3:
              raise SystemExit("system Git configuration isolation was not applied three times")
          if repaired.count("              GIT_CONFIG_GLOBAL=/dev/null \\\n") != 3:
              raise SystemExit("global Git configuration isolation was not applied three times")
          workflow_path.write_text(repaired, encoding="utf-8")
          Path(".github/workflows/one-shot-pr743-apply-git-isolation.yml").unlink()
          PY
          python3 -m py_compile tests/test_repository_branch_coverage_pr743_cleanup.py
          git diff --check
          test ! -e .github/workflows/one-shot-pr743-apply-git-isolation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(opencode-review): isolate runtime Git configuration"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
