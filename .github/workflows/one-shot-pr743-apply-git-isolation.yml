name: One-shot PR 743 apply Git isolation

on:
  push:
    branches:
      - fix/trusted-uv-lock-coverage-clean
    paths:
      - .github/workflows/one-shot-pr743-apply-git-isolation.yml

concurrency:
  group: one-shot-pr743-apply-git-isolation
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/trusted-uv-lock-coverage-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Apply and publish bounded repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_PARENT_SHA: 35e40ac93010cd3cb4c181bf5dc4ae2d9cf6d1c0
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          python3 -I - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/opencode-review-dispatch.yml")
          content = workflow.read_text(encoding="utf-8")
          old = (
              "              GIT_CONFIG_COUNT=1 \\\n"
              "              GIT_CONFIG_KEY_0=safe.directory \\\n"
          )
          new = (
              "              GIT_CONFIG_NOSYSTEM=1 \\\n"
              "              GIT_CONFIG_GLOBAL=/dev/null \\\n"
              + old
          )
          occurrences = content.count(old)
          if occurrences != 3:
              raise SystemExit(
                  f"expected three unisolated Git configuration blocks, found {occurrences}"
              )
          workflow.write_text(content.replace(old, new), encoding="utf-8")
          PY
          python3 -m pytest -q tests/test_repository_branch_coverage_pr743_cleanup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/opencode-review-dispatch.yml
          git commit -m "fix(opencode-review): isolate runtime Git configuration"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
