name: Apply PR 782 verified artifact

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/apply-pr782-artifact.yml

concurrency:
  group: apply-pr782-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.number == 782 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/hourly-nvidia-nim-review-repair-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARTIFACT_ID: "8931198871"
      ARTIFACT_ZIP_SHA256: fc26b973ade5e867e3aa40ea8f29cccabe46f35fdde08af1279c4b598b7630d8
      SOURCE_TAR_SHA256: 33e6543ffd6521b77010cdc4b0b7f06d9e40ea1cdae954b07c05d01eb5113005
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50
          persist-credentials: false

      - name: Download and verify the exact read-only source artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          artifact_zip="${RUNNER_TEMP}/pr782-source.zip"
          artifact_dir="${RUNNER_TEMP}/pr782-artifact"
          source_dir="${RUNNER_TEMP}/pr782-source"
          mkdir -p "$artifact_dir" "$source_dir"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "$artifact_zip"
          printf '%s  %s\n' "$ARTIFACT_ZIP_SHA256" "$artifact_zip" | sha256sum -c -
          unzip -q "$artifact_zip" -d "$artifact_dir"
          printf '%s  %s\n' "$SOURCE_TAR_SHA256" "$artifact_dir/pr782-source.tar" | sha256sum -c -
          tar -xf "$artifact_dir/pr782-source.tar" -C "$source_dir"
          (
            cd "$source_dir"
            printf '%s  %s\n' 9097389deeb5e64bd4106537e6dd4be1b78b4ef4ddb52518aa774a0a8b2a1ffc .github/workflows/pr-review-autofix.yml | sha256sum -c -
            printf '%s  %s\n' bb350c23783c4cb4411c6838a77c672fae34fb388d9ee4863d88ffe6104b93fa scripts/ci/pr_review_conflict_scope.py | sha256sum -c -
            printf '%s  %s\n' b5f3d8311e79a348a66a5af0080c4ac6fdddde37be75d053b76b4c690a7a1883 tests/test_pr_review_conflict_scope.py | sha256sum -c -
            printf '%s  %s\n' f90673a2ea69a4374464206c79dfba9c6b6d639c82cf04fa815e33f67b61d6cc docs/doctoring/hourly-nvidia-nim-autofix.md | sha256sum -c -
            printf '%s  %s\n' 322492aa3afbe871e2aad22c0bc654be494b8c420595a31a4df6cf206a2a9a49 CHANGELOG.md | sha256sum -c -
          )
          echo "SOURCE_DIR=$source_dir" >>"$GITHUB_ENV"

      - name: Install the reviewed final files and remove every temporary helper
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          install -m 0644 "$SOURCE_DIR/.github/workflows/pr-review-autofix.yml" .github/workflows/pr-review-autofix.yml
          install -m 0644 "$SOURCE_DIR/scripts/ci/pr_review_conflict_scope.py" scripts/ci/pr_review_conflict_scope.py
          install -m 0644 "$SOURCE_DIR/tests/test_pr_review_conflict_scope.py" tests/test_pr_review_conflict_scope.py
          install -m 0644 "$SOURCE_DIR/docs/doctoring/hourly-nvidia-nim-autofix.md" docs/doctoring/hourly-nvidia-nim-autofix.md
          install -m 0644 "$SOURCE_DIR/CHANGELOG.md" CHANGELOG.md
          rm -f \
            .github/workflows/apply-pr782-artifact.yml \
            .github/workflows/export-pr782-source.yml \
            .github/workflows/finalize-pr782-conflict-scope.yml \
            .github/workflows/one-shot-pr782-conflict-scope-repair.yml \
            .github/workflows/reopen-finalize-pr782.yml \
            .github/workflows/repair-pr782-conflict-scope.yml \
            scripts/ci/repair_pr782_conflict_scope_once.py
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify behavior, 100 percent coverage, docstrings, and workflow order
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate --fail-under 100 scripts/ci/pr_review_conflict_scope.py
          python -m compileall -q \
            scripts/ci/pr_review_conflict_scope.py \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py
          git diff --check

      - name: Publish the verified final tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(automation): enforce conflict repair write scope"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
