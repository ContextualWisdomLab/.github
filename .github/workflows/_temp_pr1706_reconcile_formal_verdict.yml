name: Temporary PR 1706 formal-verdict reconciliation repair

on:
  push:
    branches:
      - fix/opencode-poll-wall-clock-bound
    paths:
      - .github/workflows/_temp_pr1706_reconcile_formal_verdict.yml
      - scripts/ci/source_fix_pr1706_formal_verdict.py
      - tests/test_opencode_formal_verdict_authority_contract.py

permissions:
  contents: write

concurrency:
  group: temp-pr1706-formal-verdict-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor_id == '8172694'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Verify live writer head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/opencode-poll-wall-clock-bound
          test "$(git rev-parse origin/fix/opencode-poll-wall-clock-bound)" = "$GITHUB_SHA"
      - name: Apply owner repair and permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci/source_fix_pr1706_formal_verdict.py
          PYTHONPATH=. python3 -m pytest \
            tests/test_opencode_formal_verdict_authority_contract.py \
            tests/test_opencode_required_verdict_reconciliation_contract.py
          git diff --check
      - name: Publish exact repaired tree and retire temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp_pr1706_reconcile_formal_verdict.yml
          rm scripts/ci/source_fix_pr1706_formal_verdict.py
          git add .github/workflows/opencode-review.yml .github/workflows/pr-review-merge-scheduler.yml tests/test_opencode_formal_verdict_authority_contract.py tests/test_opencode_required_verdict_reconciliation_contract.py docs/product-technical-gap-baseline.md .github/workflows/_temp_pr1706_reconcile_formal_verdict.yml scripts/ci/source_fix_pr1706_formal_verdict.py
          git diff --cached --check
          git config user.name 'ContextualWisdomLab repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(opencode): reconcile exact-head formal verdicts'
          git fetch origin fix/opencode-poll-wall-clock-bound
          test "$(git rev-parse origin/fix/opencode-poll-wall-clock-bound)" = "$GITHUB_SHA"
          git push origin HEAD:fix/opencode-poll-wall-clock-bound
