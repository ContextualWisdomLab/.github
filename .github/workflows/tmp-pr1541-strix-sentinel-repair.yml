name: Temporary PR 1541 Strix sentinel repair

on:
  push:
    branches:
      - fix/draft-governance-wait-and-direct-rca
    paths:
      - .github/workflows/tmp-pr1541-strix-sentinel-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/draft-governance-wait-and-direct-rca
          fetch-depth: 2
          persist-credentials: true
          token: ${{ secrets.PR_REVIEW_MERGE_TOKEN || github.token }}

      - name: Verify unchanged test-first parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a4a86af164329ee3cc213190eb79382f3d1c9ef7"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install hash-locked test tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply bounded production repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/pr_review_merge_scheduler.py")
          text = path.read_text(encoding="utf-8")
          old = '''        return workflow_name in {"Strix Security Scan", "Strix"} or (
                      node.get("name") == "strix" and workflow_name is None
                  )
          '''
          new = '''        return workflow_name in {"Strix Security Scan", "Strix"} or (
                      node.get("name") == "strix"
                      and workflow_name in {None, REST_UNKNOWN_GITHUB_ACTIONS_WORKFLOW}
                  )
          '''
          if text.count(old) != 1:
              raise SystemExit("Strix sentinel patch anchor is not unique")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify focused GREEN contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_pr_review_fix_scheduler_rest_workflow_identity.py \
            tests/test_pr_review_merge_scheduler.py \
            tests/test_pr_review_fix_scheduler.py
          python -m compileall -q \
            scripts/ci/pr_review_merge_scheduler.py \
            scripts/ci/pr_review_fix_scheduler.py
          git diff --check

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr1541-strix-sentinel-repair.yml
          git config user.name "CWL guarded repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/ci/pr_review_merge_scheduler.py \
            .github/workflows/tmp-pr1541-strix-sentinel-repair.yml
          git commit -m "fix(governance): preserve name-only Strix evidence"
          git push origin HEAD:fix/draft-governance-wait-and-direct-rca
