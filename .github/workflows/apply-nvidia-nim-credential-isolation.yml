name: Apply NVIDIA NIM credential isolation
# Publish through the scoped OpenCode App token after deterministic tests.

on:
  push:
    branches: [fix/hourly-nvidia-nim-autofix]
    paths:
      - .github/workflows/apply-nvidia-nim-credential-isolation.yml

concurrency:
  group: apply-nvidia-nim-credential-isolation
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply-reviewed-patch:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EXPECTED_TRIGGER_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact patch-trigger branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact trigger head
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_TRIGGER_SHA" ]; then
            printf '::error::Checkout SHA %s did not match trigger SHA %s.\n' \
              "$actual_sha" "$EXPECTED_TRIGGER_SHA"
            exit 1
          fi

      - name: Exchange OpenCode App token for central workflow publication
        id: publication_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || \
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo '::error::OIDC request environment is missing.'
            exit 1
          fi
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator='&'
          case "$request_url" in
            *\?*) ;;
            *) separator='?' ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo '::error::OIDC token response was empty.'
            exit 1
          fi
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo '::error::OpenCode App token response was empty.'
            exit 1
          fi
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Apply exact credential-isolation patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/pr-review-autofix.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          ordinary_start = workflow.index('      - name: Run OpenCode review autofix')
          ordinary_end = workflow.index('      - name: Validate changed files', ordinary_start)
          ordinary = workflow[ordinary_start:ordinary_end]
          github_expression = '$' + '{{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.target_app_token.outputs.token || github.token }}'
          credential = f'          GITHUB_TOKEN: {github_expression}\n'
          if ordinary.count(credential) != 1:
              raise SystemExit('ordinary OpenCode step credential binding changed unexpectedly')
          ordinary = ordinary.replace(credential, '', 1)
          ordinary_invocation = '          timeout 18000 opencode run "$(cat "$prompt_file")" \\\n'
          ordinary_replacement = (
              '          env -u GITHUB_TOKEN -u GH_TOKEN '
              '-u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \\\n'
              '            timeout 18000 opencode run "$(cat "$prompt_file")" \\\n'
          )
          if ordinary.count(ordinary_invocation) != 1:
              raise SystemExit('ordinary OpenCode invocation changed unexpectedly')
          ordinary = ordinary.replace(ordinary_invocation, ordinary_replacement, 1)
          workflow = workflow[:ordinary_start] + ordinary + workflow[ordinary_end:]

          conflict_start = workflow.index(
              '      - name: Merge base branch and resolve conflicts with OpenCode'
          )
          conflict = workflow[conflict_start:]
          conflict_invocation = '            timeout 18000 opencode run "$(cat "$prompt_file")" \\\n'
          conflict_replacement = (
              '            env -u GITHUB_TOKEN -u GH_TOKEN '
              '-u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \\\n'
              '              timeout 18000 opencode run "$(cat "$prompt_file")" \\\n'
          )
          if conflict.count(conflict_invocation) != 1:
              raise SystemExit('conflict OpenCode invocation changed unexpectedly')
          conflict = conflict.replace(conflict_invocation, conflict_replacement, 1)
          workflow = workflow[:conflict_start] + conflict
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Execute focused trust-boundary contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import runpy

          namespace = runpy.run_path('tests/test_pr_review_autofix_nvidia_nim_contract.py')
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith('test_') and callable(value)
          )
          if not tests:
              raise SystemExit('no NVIDIA NIM autofix contract tests were discovered')
          for name, test in tests:
              test()
              print(f'PASS {name}')
          PY
          git diff --check

      - name: Publish verified workflow and remove one-shot workflow
        env:
          GH_TOKEN: ${{ steps.publication_token.outputs.token }}
        run: |
          set -euo pipefail
          workflow_path='.github/workflows/pr-review-autofix.yml'
          one_shot_path='.github/workflows/apply-nvidia-nim-credential-isolation.yml'
          workflow_sha="$(git rev-parse "HEAD:${workflow_path}")"
          one_shot_sha="$(git rev-parse "HEAD:${one_shot_path}")"
          workflow_content="$(base64 -w0 "$workflow_path")"
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ContextualWisdomLab/.github/contents/${workflow_path}" \
            -f message='fix(ci): isolate OpenCode from GitHub credentials' \
            -f branch='fix/hourly-nvidia-nim-autofix' \
            -f sha="$workflow_sha" \
            -f content="$workflow_content" >/dev/null
          gh api \
            --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/ContextualWisdomLab/.github/contents/${one_shot_path}" \
            -f message='ci: remove credential-isolation patch workflow' \
            -f branch='fix/hourly-nvidia-nim-autofix' \
            -f sha="$one_shot_sha" >/dev/null
