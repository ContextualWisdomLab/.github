name: Finalize PR 767 review repairs

on:
  push:
    branches:
      - fix/sandboxed-output-resource-bounds
    paths:
      - .github/workflows/finalize-pr767-review-repairs.yml

permissions:
  contents: read

concurrency:
  group: finalize-pr767-review-repairs
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/sandboxed-output-resource-bounds'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify audited parent and repair source
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "36afcf80cd6db52072012da3a2503baa6f5680d0"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object .github/scripts/finalize_pr767_review_repairs.py)" = \
            "c9aeba9b8e644d609c54d4017a8b3897b16766a9"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked test tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Add regressions before production changes
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: python .github/scripts/finalize_pr767_review_repairs.py add-tests

      - name: Prove current review findings are red
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          python -m pytest -q \
            tests/test_bounded_subprocess.py::test_join_captures_applies_finite_timeout_and_finishes_siblings \
            tests/test_redact_sensitive_log_contract.py::test_bare_sensitive_word_does_not_consume_the_next_argument \
            tests/test_sandboxed_entrypoint_and_cleanup_coverage.py::test_web_e2e_reports_bounded_capture_finalization_failure \
            >"${RUNNER_TEMP}/pr767-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/pr767-red.log"
          test "$status" -ne 0

      - name: Apply bounded source repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python .github/scripts/finalize_pr767_review_repairs.py apply
          git diff --check

      - name: Verify focused and full quality evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q \
            tests/test_bounded_subprocess.py \
            tests/test_redact_sensitive_log_contract.py \
            tests/test_sandboxed_entrypoint_and_cleanup_coverage.py \
            tests/test_sandboxed_web_e2e.py \
            tests/test_sandboxed_web_e2e_output_limits.py
          python -m pytest -q
          python -m interrogate --fail-under 100 \
            scripts/ci/bounded_subprocess.py \
            scripts/ci/redact_sensitive_log.py \
            scripts/ci/sandboxed_web_e2e.py
          python -m compileall -q scripts/ci tests
          git diff --check

      - name: Publish exact repair and remove one-shot automation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/sandboxed-output-resource-bounds
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python .github/scripts/finalize_pr767_review_repairs.py cleanup
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            .github/scripts/finalize_pr767_review_repairs.py \
            .github/workflows/finalize-pr767-review-repairs.yml \
            CHANGELOG.md \
            scripts/ci/bounded_subprocess.py \
            scripts/ci/redact_sensitive_log.py \
            scripts/ci/sandboxed_web_e2e.py \
            tests/test_bounded_subprocess.py \
            tests/test_redact_sensitive_log_contract.py \
            tests/test_sandboxed_entrypoint_and_cleanup_coverage.py \
            tests/test_sandboxed_web_e2e.py \
            tests/test_sandboxed_web_e2e_output_limits.py | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): close sandbox output review gaps"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
