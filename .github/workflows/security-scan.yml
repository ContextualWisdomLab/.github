# Central bundled security gate for every ContextualWisdomLab repo.
#
# This is a REQUIRED org workflow (see the "CWL Central required workflows"
# ruleset). It bundles the supply-chain / vulnerability / posture scanners into
# one gate so they pass or fail as a unit:
#
#   osv-scan          HARD  diff-scoped — fails on NEW vulns the PR introduces
#   dependency-review HARD  diff-scoped — fails on vulnerable/denied deps the PR adds
#   trivy-fs          HARD  repo-wide   — fails on FIXABLE MEDIUM/HIGH/CRITICAL findings
#   gitleaks          HARD  commit-range — blocks secrets in ContextualWisdomLab/.github PRs
#   scorecard         SOFT  repo posture — uploaded for visibility, never blocks
#
# This is the sole organization-required owner for OSV and Scorecard PR work.
# The standalone workflows remain local to this repository because its classic
# branch protection still requires their historical check contexts.
#
# Gating is by the JOB result (a failed job fails this required workflow ->
# merge blocked), NOT by the code_scanning ruleset rule. The code_scanning rule
# stays CodeQL-only on purpose: requiring multiple code-scanning TOOLS there is
# unsatisfiable because default-setup CodeQL uploads to refs/pull/N/head while
# pull_request workflows upload to refs/pull/N/merge, so no single ref ever holds
# all tools. Bundling at the workflow/check level is ref-independent.
#
# NOTE on dependency-review: unavailable evidence is not a clean result. Only
# an exact base/head comparison returning HTTP 200 may reach the pinned hard
# gate. Every other probe outcome fails closed without printing the response
# body. See docs/doctoring/dependency-review-fail-closed.md.
#
# NOTE on trivy-fs: it scans the whole repo, so a pre-existing FIXABLE
# MEDIUM/HIGH/CRITICAL finding blocks every PR in that repo until it is fixed.
# Trivy itself exits 0 so SARIF is always available; the following parser prints
# exact findings and then fails the job.
#
# NOTE on the changed-scope gate: each job below now runs only when the
# `changed-scope` job's diff-scoped output says it is in scope (`code` for
# trivy-fs/scorecard, `deps` for osv-scan/dependency-review). A doc/image-only
# PR skips every one of these jobs, and `scheduled-security-scan.yml` (push +
# default-branch schedule) and `scorecard-analysis.yml` (push + weekly cron)
# remain the full repo-wide backstops that make those skips safe.
name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    # Do not restrict the base ref: stacked PRs must receive the same
    # diff-scoped OSV/dependency and repo-wide Trivy gate as default-branch PRs.

concurrency:
  group: >-
    security-scan-${{
    github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Scorecard Token-Permissions (alert #42): workflow-level token stays
# read-only. Every job that uploads SARIF (osv-scan, trivy-fs, scorecard)
# already declares security-events:write at job scope, so granting it here as
# well is redundant and over-broad.
permissions:
  actions: read
  contents: read

jobs:
  changed-scope:
    name: Detect changed scope
    # The org ruleset IGNORES every `on:` filter (paths, branches, types) when it
    # runs this workflow in another repository, and a trigger-level skip would
    # leave `.github`'s classic required contexts Pending forever. Both
    # mechanisms honour a JOB-level skip, so the doc/image-only decision is made
    # here and consumed through `needs`. See
    # docs/doctoring/required-workflow-path-filter-boundary.md.
    # Fails OPEN: an unreadable, empty, or truncated file list scans everything.
    if: github.event.action != 'closed'
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      deps: ${{ steps.scope.outputs.deps }}
    steps:
      - name: Classify changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -uo pipefail
          code=true
          deps=true
          if [ -n "${PR}" ] && [ -n "${EXPECTED_FILES}" ]; then
            changed=""
            for attempt in 1 2 3; do
              if changed="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files?per_page=100" --jq '.[].filename')" && [ -n "$changed" ]; then
                break
              fi
              changed=""
              sleep $((attempt * 3))
            done
            # GitHub caps /pulls/N/files at 3000 entries; a short list would hide
            # source files behind a doc-only verdict, so require an exact count.
            if [ -n "$changed" ] && [ "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = "${EXPECTED_FILES}" ]; then
              code=false
              deps=false
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  *.md|*.markdown|*.rst|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.bmp|*.ico|LICENSE|LICENSE.txt|COPYING|COPYING.txt|NOTICE|NOTICE.txt|.github/ISSUE_TEMPLATE/*) ;;
                  *) code=true ;;
                esac
                case "$changed_path" in
                  requirements*.txt|*/requirements*.txt|pyproject.toml|*/pyproject.toml|uv.lock|*/uv.lock|pylock.*.toml|*/pylock.*.toml|package.json|*/package.json|package-lock.json|*/package-lock.json|pnpm-lock.yaml|*/pnpm-lock.yaml|yarn.lock|*/yarn.lock|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|go.mod|*/go.mod|go.sum|*/go.sum|pom.xml|*/pom.xml|build.gradle|*/build.gradle|build.gradle.kts|*/build.gradle.kts|DESCRIPTION|*/DESCRIPTION) deps=true ;;
                esac
              done <<<"$changed"
            else
              echo "::notice::changed-scope could not read a complete PR file list; scanning everything."
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "deps=${deps}" >> "$GITHUB_OUTPUT"
          echo "changed-scope code=${code} deps=${deps}"

  osv-scan:
    needs: changed-scope
    if: github.event.action != 'closed' && needs.changed-scope.outputs.deps == 'true'
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Explain OSV scan mode and timeout budget
        run: |
          echo "::notice::OSV hard gate scans direct manifest and lockfile evidence with --no-resolve so external transitive registry resolver stalls cannot hold the required-check queue indefinitely. The job is capped at 25 minutes; if this budget is exceeded, rerun after the upstream registry/service recovers or inspect the uploaded debug artifacts."
      - name: Prepare observable OSV lifecycle
        id: osv_prepare
        shell: bash
        env:
          OSV_RUN: ${{ github.run_id }}:${{ github.run_attempt }}
          OSV_BASE_REV: ${{ github.event.pull_request.base.sha }}
          OSV_HEAD_REV: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'INIT'
          import os, pathlib, tempfile, secrets, json
          parent = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          runner = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          root = pathlib.Path(tempfile.mkdtemp(prefix='osv-observable-', dir=parent))
          control = pathlib.Path(tempfile.mkdtemp(prefix='osv-control-', dir=runner))
          root.chmod(0o700)
          control.chmod(0o700)
          st = root.stat()
          identity = f'{st.st_dev}:{st.st_ino}'
          nonce = secrets.token_hex(32)
          record = {'schema': 1, 'root': str(root), 'parent': str(parent), 'identity': identity, 'nonce': nonce, 'uid': os.getuid(), 'run': os.environ['OSV_RUN'], 'base': os.environ['OSV_BASE_REV'], 'head': os.environ['OSV_HEAD_REV']}
          for path in (control / 'creation.json', root / 'identity.json'):
              path.write_text(json.dumps(record))
              path.chmod(0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in {'root': root, 'relative': root.name, 'identity': identity, 'nonce': nonce, 'control': control, 'wrapper': control / 'scan.sh'}.items():
                  out.write(f'{key}={value}\n')
          (control / 'validate.py').write_text(r'''
          import os, sys, json, pathlib, shutil, stat, hashlib, subprocess, signal

          def require(value, message='OSV admission rejected'):
              if not value:
                  raise ValueError(message)

          def regular(path, mode=None):
              st = path.lstat()
              require(stat.S_ISREG(st.st_mode) and st.st_uid == os.getuid())
              if mode is not None:
                  require(stat.S_IMODE(st.st_mode) == mode)
              return path.read_bytes()

          def atomic(path, data):
              temporary = path.with_name(path.name + '.pending')
              with temporary.open('xb') as output:
                  output.write(data)
                  output.flush()
                  os.fsync(output.fileno())
              os.replace(temporary, path)

          control = pathlib.Path(__file__).parent
          cs = control.lstat()
          require(control == control.resolve(strict=True) and stat.S_ISDIR(cs.st_mode))
          require(cs.st_uid == os.getuid() and stat.S_IMODE(cs.st_mode) == 0o700)
          record = json.loads(regular(control / 'creation.json', 0o600))
          require(type(record) is dict and set(record) == {'schema','root','parent','identity','nonce','uid','run','base','head'})
          require(type(record['schema']) is int and record['schema'] == 1)
          require(type(record['uid']) is int and record['uid'] == os.getuid())
          require(all(type(record[k]) is str and record[k] for k in ('root','parent','identity','nonce','run','base','head')))
          root = pathlib.Path(record['root'])
          require(str(root) == os.environ['OSV_ROOT'] and record['identity'] == os.environ['OSV_IDENTITY'] and record['nonce'] == os.environ['OSV_NONCE'])
          require(root == root.resolve(strict=True) and root.parent == pathlib.Path(record['parent']))
          require(root.parent == pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True))
          st = root.lstat()
          require(stat.S_ISDIR(st.st_mode) and st.st_uid == record['uid'] and stat.S_IMODE(st.st_mode) == 0o700)
          require(f'{st.st_dev}:{st.st_ino}' == record['identity'])
          require(json.loads(regular(root / 'identity.json', 0o600)) == record)

          pairs = {'base-first':'old-results.json','base-retry':'old-results.json','head-first':'new-results.json','head-retry':'new-results.json'}

          def binding(attempt):
              require(attempt in pairs)
              revision = record['base' if attempt.startswith('base') else 'head']
              return {'schema':1,'attempt':attempt,'nonce':record['nonce'],'run':record['run'],'revision':revision}

          def completed(receipt, attempt):
              require(type(receipt) is dict and set(receipt) == set(binding(attempt)) | {'completed','exit','transport_exit','digest','settled','cid'})
              require(all(type(receipt[k]) is type(v) and receipt[k] == v for k,v in binding(attempt).items()))
              require(type(receipt['completed']) is bool and receipt['completed'] is True)
              require(type(receipt['settled']) is bool and receipt['settled'] is True)
              require(type(receipt['exit']) is int and receipt['exit'] in (0,1))
              require(type(receipt['transport_exit']) is int and receipt['transport_exit'] == receipt['exit'])
              require(type(receipt['digest']) is str and len(receipt['digest']) == 64)
              require(type(receipt['cid']) is str and len(receipt['cid']) == 64)


          def verify_final(target):
              receipt = json.loads(regular(control / (target+'.receipt.json')))
              attempt = receipt.get('attempt')
              require(pairs.get(attempt) == target)
              completed(receipt, attempt)
              prefix = 'OSV_BASE' if attempt.startswith('base') else 'OSV_HEAD'
              first, retry = os.environ[prefix+'_OUTCOME'], os.environ[prefix+'_RETRY_OUTCOME']
              selected = prefix.lower().removeprefix('osv_') + ('-first' if first == 'success' and retry == 'skipped' else '-retry' if first == 'failure' and retry == 'success' else '-invalid')
              require(attempt == selected, 'No successful current attempt')
              raw = regular(root / target)
              require(hashlib.sha256(raw).hexdigest() == receipt['digest'])
              data = json.loads(raw)
              require(type(data) is dict and 'results' in data and (data['results'] is None or type(data['results']) is list))
              return receipt


          def comparison():
              receipts = [verify_final(name) for name in ('old-results.json','new-results.json')]
              witness = {'schema':1,'run':record['run'],'nonce':record['nonce'],'base':record['base'],'head':record['head'],'digests':[r['digest'] for r in receipts]}
              return witness

          mode = sys.argv[1]
          def docker(*args):
              return subprocess.run(['docker', *args], text=True, capture_output=True, timeout=15)


          def absence(name, cid=''):
              for key, value in [('name', '^/'+name+'$')] + ([('id',cid)] if cid else []):
                  result = docker('ps','-aq','--no-trunc','--filter',key+'='+value)
                  require(result.returncode == 0 and not result.stdout.strip(), 'Owned container absence not established')


          def settle(owned, path):
              require(set(owned) == {'schema','attempt','nonce','name','cid','settled','absence_verified','cid_slot_identity'})
              require(owned['schema'] == 1 and type(owned['schema']) is int)
              require(owned['nonce'] == record['nonce'] and owned['attempt'] in pairs)
              require(owned['name'] == 'osv-'+record['nonce']+'-'+owned['attempt'])
              require(type(owned['settled']) is bool and type(owned['cid']) is str)
              require(owned['absence_verified'] is True, 'Creation name absence was not verified')
              slot = control / (owned['attempt']+'.cid-slot')
              ss = slot.lstat()
              require(slot == slot.resolve(strict=True) and stat.S_ISDIR(ss.st_mode))
              require(ss.st_uid == os.getuid() and stat.S_IMODE(ss.st_mode) == 0o700)
              require(owned['cid_slot_identity'] == f'{ss.st_dev}:{ss.st_ino}')
              # Docker creates this previously absent file in the exclusive trusted slot.
              # Recover its CID after client failure/timeout; name lookup is never authority.
              descriptor = os.open(slot / 'container.cid', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  fs = os.fstat(descriptor)
                  require(stat.S_ISREG(fs.st_mode) and fs.st_uid == os.getuid() and fs.st_nlink == 1)
                  raw = os.read(descriptor, 66)
              finally:
                  os.close(descriptor)
              cid = raw.decode().strip()
              require(len(cid) == 64 and all(c in '0123456789abcdef' for c in cid), 'Creation CID unavailable')
              require(not owned['cid'] or owned['cid'] == cid, 'Creation CID changed')
              owned['cid'] = cid
              atomic(path, json.dumps(owned).encode())
              inspection = docker('inspect','--format','[{{json .Id}},{{json .Name}},{{json .State}}]',cid)
              if inspection.returncode == 0:
                  cid_value, name_value, state_value = json.loads(inspection.stdout)
                  data = {'Id':cid_value,'Name':name_value,'State':state_value}
                  cid = data.get('Id')
                  require(type(cid) is str and len(cid) == 64 and data.get('Name') == '/'+owned['name'])
                  require(owned['cid'] == cid)
                  require(type(data['State']['Running']) is bool)
                  if data['State']['Running'] is True:
                      require(docker('stop','--time','5',cid).returncode == 0)
                  require(docker('rm',cid).returncode == 0)
              absence(owned['name'],owned['cid'])
              owned['settled'] = True
              atomic(path, json.dumps(owned).encode())


          if mode == 'scan':
              attempt, target = sys.argv[2:4]
              require(pairs.get(attempt) == target)
              for path in (root / target, control / (target+'.receipt.json'), control / 'comparison.json', control / 'sarif.receipt.json'):
                  if path.is_symlink():
                      raise ValueError('Refusing alias destination')
                  path.unlink(missing_ok=True)
              directory = root / attempt
              directory.mkdir(mode=0o700)
              owned_path = control / (attempt+'-owned.json')
              owned = {'schema':1,'attempt':attempt,'nonce':record['nonce'],'name':'osv-'+record['nonce']+'-'+attempt,'cid':'','settled':False,'absence_verified':False,'cid_slot_identity':''}
              atomic(owned_path,json.dumps(owned).encode())
              slot = control / (attempt+'.cid-slot')
              slot.mkdir(mode=0o700)
              ss = slot.stat()
              owned['cid_slot_identity'] = f'{ss.st_dev}:{ss.st_ino}'
              cidfile = slot / 'container.cid'
              require(not cidfile.exists() and not cidfile.is_symlink())
              absence(owned['name'])
              owned['absence_verified'] = True
              atomic(owned_path,json.dumps(owned).encode())
              command = ['docker','run','--name',owned['name'],'--cidfile',str(cidfile),'--entrypoint','/root/osv-scanner','--volume',os.environ['GITHUB_WORKSPACE']+':/github/workspace:ro','--volume',str(root)+':/evidence','--workdir','/github/workspace','ghcr.io/google/osv-scanner-action:v2.5.1@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc','--verbosity=error','--format=json','--output-file=/evidence/'+attempt+'/results.json',*sys.argv[4:]]
              interrupted = False
              process = None
              transport = None
              child = None
              def stop_signal(signum, frame):
                  raise InterruptedError('scanner signal '+str(signum))
              previous = {signum: signal.signal(signum,stop_signal) for signum in (signal.SIGTERM,signal.SIGINT)}
              try:
                  with (directory / 'stderr').open('xb') as errors:
                      process = subprocess.Popen(command,stderr=errors)
                      transport = process.wait(timeout=float(os.environ.get('OSV_SCAN_DEADLINE','420' if attempt.endswith('first') else '180')))
                  owned['cid'] = regular(cidfile).decode().strip()
                  require(len(owned['cid']) == 64 and all(c in '0123456789abcdef' for c in owned['cid']))
                  inspection = docker('inspect','--format','[{{json .Id}},{{json .Name}},{{json .State}}]',owned['cid'])
                  require(inspection.returncode == 0)
                  cid_value, name_value, state_value = json.loads(inspection.stdout)
                  data = {'Id':cid_value,'Name':name_value,'State':state_value}
                  require(data['Id'] == owned['cid'] and data['Name'] == '/'+owned['name'])
                  require(type(data['State']['Running']) is bool and data['State']['Running'] is False)
                  child = data['State']['ExitCode']
                  require(type(child) is int)
              except (subprocess.TimeoutExpired, InterruptedError):
                  interrupted = True
              finally:
                  for signum in previous:
                      signal.signal(signum,signal.SIG_IGN)
                  if process is not None and process.poll() is None:
                      process.terminate()
                      try:
                          transport = process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          transport = process.wait(timeout=5)
                  try:
                      settle(owned,owned_path)
                  finally:
                      for signum,handler in previous.items():
                          signal.signal(signum,handler)
                  receipt = {**binding(attempt),'completed':not interrupted and child is not None,'exit':child,'transport_exit':transport,'digest':hashlib.sha256(regular(directory / 'results.json')).hexdigest() if (directory / 'results.json').is_file() and not (directory / 'results.json').is_symlink() else '', 'settled':owned['settled'],'cid':owned['cid']}
                  atomic(control / (attempt+'.json'),json.dumps(receipt).encode())
                  atomic(directory / 'receipt.json',json.dumps(receipt).encode())
              completed(receipt,attempt)
              subprocess.run([sys.executable,__file__,'admit',attempt,target],check=True)

          elif mode == 'admit':
              attempt,target = sys.argv[2:4]
              require(pairs.get(attempt) == target)
              directory = root / attempt
              require(directory == directory.resolve(strict=True) and directory.parent == root and not directory.is_symlink())
              receipt = json.loads(regular(control / (attempt+'.json')))
              completed(receipt, attempt)
              require(regular(directory / 'stderr') == b'')
              raw = regular(directory / 'results.json')
              require(hashlib.sha256(raw).hexdigest() == receipt['digest'])
              data = json.loads(raw)
              require(type(data) is dict and 'results' in data and (data['results'] is None or type(data['results']) is list))
              require(not (root / target).is_symlink())
              atomic(root / target, raw)
              atomic(control / (target+'.receipt.json'), json.dumps(receipt).encode())
          elif mode == 'require':
              atomic(control / 'comparison.json', json.dumps(comparison()).encode())
          elif mode == 'sarif':
              require(json.loads(regular(control / 'comparison.json')) == comparison())
              outcome = os.environ['OSV_REPORTER_OUTCOME']
              require(outcome in ('success','failure'))
              raw = regular(root / 'results.sarif')
              require(bool(raw))
              data = json.loads(raw)
              require(type(data) is dict and data.get('version') == '2.1.0')
              runs = data.get('runs')
              require(type(runs) is list and bool(runs))
              total = 0
              for run in runs:
                  require(type(run) is dict and type(run.get('tool')) is dict)
                  driver = run['tool'].get('driver')
                  require(type(driver) is dict and type(driver.get('name')) is str and bool(driver['name']))
                  results = run.get('results')
                  require(type(results) is list and all(type(r) is dict and type(r.get('message')) is dict and type(r['message'].get('text')) is str and bool(r['message']['text']) for r in results))
                  total += len(results)
                  driver['isComprehensive'] = outcome == 'success'
              require(outcome == 'success' or total > 0, 'Failed clean reporter is not admissible evidence')
              raw = json.dumps(data).encode()
              atomic(root / 'results.sarif', raw)
              atomic(control / 'sarif.receipt.json', json.dumps({'schema':1,'run':record['run'],'revision':record['head'],'nonce':record['nonce'],'digest':hashlib.sha256(raw).hexdigest(),'diagnostic':outcome == 'failure'}).encode())
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:
                  output.write('admitted=true\n')
              print(f'OSV SARIF {total} results; comprehensive={outcome == "success"}')
          elif mode == 'cleanup':
              for path in control.glob('*-owned.json'):
                  owned = json.loads(regular(path))
                  if owned.get('settled') is not True:
                      settle(owned,path)
                  require(owned.get('settled') is True, 'Scanner settlement required before evidence deletion')
              shutil.rmtree(root)
              shutil.rmtree(control)
          elif mode == 'check':
              pass
          else:
              raise ValueError('Unknown operation')
          ''')
          (control / 'scan.sh').write_text(r'''
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 "$OSV_CONTROL/validate.py" scan "$@"
          ''')
          (control / 'scan.sh').chmod(0o700)
          INIT
      - name: Checkout base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify OSV base checkout
        env:
          EXPECTED_CHECKOUT_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C source rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::OSV base checkout identity mismatch for ${EXPECTED_CHECKOUT_REPOSITORY}: expected ${EXPECTED_CHECKOUT_SHA}, actual ${actual_sha}."
            exit 1
          fi
          echo "SECURITY_CHECKOUT scanner=osv revision=base repository=${EXPECTED_CHECKOUT_REPOSITORY} expected_sha=${EXPECTED_CHECKOUT_SHA} actual_sha=${actual_sha}"
      - name: Scan base with OSV
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
        id: osv_base
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          export OSV_CONTROL="${{ steps.osv_prepare.outputs.control }}"
          bash "$OSV_CONTROL/scan.sh" base-first old-results.json --maven-registry=https://maven-central.storage-download.googleapis.com/maven2 --no-resolve --allow-no-lockfiles -r source/
      - name: Explain base OSV resolver fallback
        if: steps.osv_base.outcome == 'failure'
        run: |
          echo "::warning::OSV base scan failed or timed out before reporter output was trusted; retrying the --no-resolve direct manifest/lockfile scan. Direct manifest and lockfile vulnerability evidence remains enforced while external transitive registry resolution is intentionally avoided."
      - name: Retry base OSV without transitive resolution
        id: osv_base_retry
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
        if: steps.osv_base.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          export OSV_CONTROL="${{ steps.osv_prepare.outputs.control }}"
          bash "$OSV_CONTROL/scan.sh" base-retry old-results.json --no-resolve --allow-no-lockfiles -r source/
      - name: Checkout head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify OSV head checkout
        env:
          EXPECTED_CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C source rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::OSV head checkout identity mismatch for ${EXPECTED_CHECKOUT_REPOSITORY}: expected ${EXPECTED_CHECKOUT_SHA}, actual ${actual_sha}."
            exit 1
          fi
          echo "SECURITY_CHECKOUT scanner=osv revision=head repository=${EXPECTED_CHECKOUT_REPOSITORY} expected_sha=${EXPECTED_CHECKOUT_SHA} actual_sha=${actual_sha}"
      - name: Scan head with OSV
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
        id: osv_head
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          export OSV_CONTROL="${{ steps.osv_prepare.outputs.control }}"
          bash "$OSV_CONTROL/scan.sh" head-first new-results.json --maven-registry=https://maven-central.storage-download.googleapis.com/maven2 --no-resolve --allow-no-lockfiles -r source/
      - name: Explain head OSV resolver fallback
        if: steps.osv_head.outcome == 'failure'
        run: |
          echo "::warning::OSV head scan failed or timed out before reporter output was trusted; retrying the --no-resolve direct manifest/lockfile scan. Direct manifest and lockfile vulnerability evidence remains enforced while external transitive registry resolution is intentionally avoided."
      - name: Retry head OSV without transitive resolution
        id: osv_head_retry
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
        if: steps.osv_head.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          export OSV_CONTROL="${{ steps.osv_prepare.outputs.control }}"
          bash "$OSV_CONTROL/scan.sh" head-retry new-results.json --no-resolve --allow-no-lockfiles -r source/
      - name: Require OSV scan output
        id: osv_require
        if: always() && steps.osv_prepare.outcome == 'success'
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
          OSV_BASE_OUTCOME: ${{ steps.osv_base.outcome }}
          OSV_BASE_RETRY_OUTCOME: ${{ steps.osv_base_retry.outcome }}
          OSV_HEAD_OUTCOME: ${{ steps.osv_head.outcome }}
          OSV_HEAD_RETRY_OUTCOME: ${{ steps.osv_head_retry.outcome }}
        run: |
          set -euo pipefail
          python3 "${{ steps.osv_prepare.outputs.control }}/validate.py" require
      - name: Print OSV findings being compared
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
        shell: python3 {0}
        run: |
          import json, os
          from pathlib import Path

          def iter_findings(path):
              data = json.loads((Path(os.environ["OSV_ROOT"]) / path).read_text(encoding="utf-8"))
              for result in data.get("results") or []:
                  source = result.get("source", {})
                  source_name = source.get("path") or source.get("name") or "unknown"
                  for package in result.get("packages", []):
                      package_info = package.get("package", {})
                      package_name = package_info.get("name") or "unknown"
                      package_version = package_info.get("version") or "unknown"
                      for vulnerability in package.get("vulnerabilities", []):
                          aliases = ", ".join(vulnerability.get("aliases") or [])
                          summary = (vulnerability.get("summary") or "").replace("\n", " ").strip()
                          yield {
                              "source": source_name,
                              "package": package_name,
                              "version": package_version,
                              "id": vulnerability.get("id") or "unknown",
                              "aliases": aliases,
                              "summary": summary,
                          }

          for label, path in (("base", "old-results.json"), ("head", "new-results.json")):
              findings = list(iter_findings(path))
              print(f"OSV {label} scan produced {len(findings)} finding(s) in {path}.")
              for finding in findings[:50]:
                  alias_text = f" aliases={finding['aliases']}" if finding["aliases"] else ""
                  summary_text = f" - {finding['summary']}" if finding["summary"] else ""
                  print(
                      f"- {finding['source']}: {finding['package']}@{finding['version']} "
                      f"{finding['id']}{alias_text}{summary_text}"
                  )
              if len(findings) > 50:
                  print(f"... {len(findings) - 50} additional {label} OSV finding(s) omitted from the log summary.")
      - name: Revalidate OSV reporter inputs
        if: success() && steps.osv_require.outcome == 'success'
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
          OSV_BASE_OUTCOME: ${{ steps.osv_base.outcome }}
          OSV_BASE_RETRY_OUTCOME: ${{ steps.osv_base_retry.outcome }}
          OSV_HEAD_OUTCOME: ${{ steps.osv_head.outcome }}
          OSV_HEAD_RETRY_OUTCOME: ${{ steps.osv_head_retry.outcome }}
        run: |
          set -euo pipefail
          python3 "${{ steps.osv_prepare.outputs.control }}/validate.py" require
      - name: Report PR-introduced OSV findings
        id: osv_reporter
        uses: google/osv-scanner-action/osv-reporter-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.3.8
        with:
          scan-args: |
            --output-files=${{ steps.osv_prepare.outputs.relative }}/results.sarif
            --old=${{ steps.osv_prepare.outputs.relative }}/old-results.json
            --new=${{ steps.osv_prepare.outputs.relative }}/new-results.json
            --gh-annotations=true
            --fail-on-vuln=true
      - name: Mark clean OSV SARIF as comprehensive
        id: osv_sarif_admission
        if: always() && steps.osv_prepare.outcome == 'success' && steps.osv_require.outcome == 'success' && (steps.osv_reporter.outcome == 'success' || steps.osv_reporter.outcome == 'failure')
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
          OSV_BASE_OUTCOME: ${{ steps.osv_base.outcome }}
          OSV_BASE_RETRY_OUTCOME: ${{ steps.osv_base_retry.outcome }}
          OSV_HEAD_OUTCOME: ${{ steps.osv_head.outcome }}
          OSV_HEAD_RETRY_OUTCOME: ${{ steps.osv_head_retry.outcome }}
          OSV_REPORTER_OUTCOME: ${{ steps.osv_reporter.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ steps.osv_prepare.outputs.control }}/validate.py" sarif
      - name: Upload OSV SARIF to code scanning
        id: upload_osv_sarif
        if: always() && steps.osv_prepare.outcome == 'success' && steps.osv_sarif_admission.outcome == 'success' && steps.osv_sarif_admission.outputs.admitted == 'true'
        # The reporter above is the vulnerability gate. Preserve an upload
        # quota failure in this step's log without reclassifying it as a CVE.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.osv_prepare.outputs.root }}/results.sarif
          # The exact head checkout lives in `source`, not the workspace root;
          # without this binding upload-sarif logs "does not appear to be a git
          # repository" twice and falls back to server-derived commit identity.
          checkout_path: ${{ github.workspace }}/source
          # results.sarif is produced after checkout of the pull request head.
          # Uploading it against refs/pull/*/merge can race GitHub's synthetic
          # merge ref and fail with "commit_oid is not a merge commit".
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}
          wait-for-processing: false
      - name: Report OSV SARIF upload failure
        if: steps.upload_osv_sarif.outcome == 'failure'
        run: |
          echo "::warning::OSV SARIF upload to code scanning failed after the base/head comparison. The PR-introduced vulnerability reporter above remains the hard gate, so upload rate limits cannot hide OSV findings."
      - name: Upload OSV debug artifacts
        if: always() && steps.osv_prepare.outcome == 'success' && steps.osv_prepare.outputs.root != '' && steps.osv_require.outcome == 'success'
        # The reporter and SARIF upload above preserve the security verdict.
        # Debug retention quota is observability only and must not turn a clean
        # comparison into a failed security gate.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: osv-scan-debug
          path: |
            ${{ steps.osv_prepare.outputs.root }}/old-results.json
            ${{ steps.osv_prepare.outputs.root }}/new-results.json
            ${{ steps.osv_prepare.outputs.root }}/results.sarif
          if-no-files-found: ignore
          retention-days: 5

      - name: Cleanup observable OSV lifecycle
        if: always() && steps.osv_prepare.outcome == 'success'
        env:
          OSV_ROOT: ${{ steps.osv_prepare.outputs.root }}
          OSV_IDENTITY: ${{ steps.osv_prepare.outputs.identity }}
          OSV_NONCE: ${{ steps.osv_prepare.outputs.nonce }}
          OSV_CONTROL: ${{ steps.osv_prepare.outputs.control }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${{ steps.osv_prepare.outputs.control }}/validate.py" cleanup

  dependency-review:
    needs: changed-scope
    if: github.event.action != 'closed' && needs.changed-scope.outputs.deps == 'true'
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact dependency-review head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify Dependency Review head checkout
        env:
          EXPECTED_CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::Dependency Review checkout identity mismatch for ${EXPECTED_CHECKOUT_REPOSITORY}: expected ${EXPECTED_CHECKOUT_SHA}, actual ${actual_sha}."
            exit 1
          fi
          echo "SECURITY_CHECKOUT scanner=dependency-review revision=head repository=${EXPECTED_CHECKOUT_REPOSITORY} expected_sha=${EXPECTED_CHECKOUT_SHA} actual_sha=${actual_sha}"
      - name: Check dependency review support
        id: dependency_review_support
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail

          api_url="${GITHUB_API_URL:-https://api.github.com}"
          git_object_id='^[0-9a-f]{40}([0-9a-f]{24})?$'
          repository_identity='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          if ! [[ "${BASE_SHA}" =~ $git_object_id ]] || ! [[ "${HEAD_SHA}" =~ $git_object_id ]]; then
            echo "::error::Dependency review evidence unavailable: exact 40- or 64-character hexadecimal base and head revisions are required before any compare request. Named refs are not evidence. Verify the pull-request event SHAs, then rerun. Failing closed."
            exit 1
          fi
          if ! [[ "${REPOSITORY}" =~ $repository_identity ]]; then
            echo "::error::Dependency review evidence unavailable: owner/name repository identity is required before any compare request. Verify the pull-request repository, then rerun. Failing closed."
            exit 1
          fi
          repository_owner="${REPOSITORY%%/*}"
          repository_name="${REPOSITORY#*/}"
          if [ "${repository_owner}" = "." ] || [ "${repository_owner}" = ".." ] || [ "${repository_name}" = "." ] || [ "${repository_name}" = ".." ]; then
            echo "::error::Dependency review evidence unavailable: owner/name repository identity is required before any compare request. Dot or parent-directory path components are not evidence. Verify the pull-request repository, then rerun. Failing closed."
            exit 1
          fi

          set +e
          status="$(
            curl -sS --connect-timeout 10 --max-time 30 \
              -o /dev/null \
              -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          )"
          curl_status=$?
          set -e

          case "$status" in
            [0-9][0-9][0-9]) http_status="$status" ;;
            "") http_status="unavailable" ;;
            *) http_status="malformed" ;;
          esac

          case "${REPOSITORY_VISIBILITY:-}" in
            public | private | internal) repository_visibility="$REPOSITORY_VISIBILITY" ;;
            *) repository_visibility="unknown" ;;
          esac

          echo "DEPENDENCY_REVIEW_SUPPORT repository=${REPOSITORY} visibility=${repository_visibility} base_sha=${BASE_SHA} head_sha=${HEAD_SHA} http_status=${http_status} curl_exit=${curl_status}"

          if [ "$curl_status" -ne 0 ] || [ "$http_status" != "200" ]; then
            echo "::error::Dependency review evidence unavailable for ${REPOSITORY} at exact base ${BASE_SHA} and head ${HEAD_SHA}: HTTP ${http_status}; curl exit ${curl_status}. Verify dependency-graph/security configuration and GitHub service behavior, then rerun. Failing closed."
            exit 1
          fi

          echo "supported=true" >>"$GITHUB_OUTPUT"
      - name: Dependency review
        if: steps.dependency_review_support.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # Keep the existing central-repository Gitleaks PR gate inside the required
  # security bundle. It deliberately does not depend on changed-scope: secrets
  # in Markdown or other document-only changes must still fail the PR. The
  # repository condition preserves the standalone workflow's previous scope;
  # push, schedule, and manual backstops remain in secret-scan.yml.
  gitleaks:
    name: gitleaks (secret scan)
    if: github.event.action != 'closed' && github.repository == 'ContextualWisdomLab/.github'
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout PR commit range
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: Run gitleaks on PR commit range
        id: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          config_args=()
          if [ -f .gitleaks.toml ]; then
            config_args=(--config .gitleaks.toml)
          fi
          log_opts="${BASE_SHA}..${HEAD_SHA}"
          echo "::notice::gitleaks scanning pull request commit range ${log_opts}."
          ./gitleaks git . \
            "${config_args[@]}" \
            --log-opts="${log_opts}" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --exit-code 2
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          set -e
      - name: Summarize redacted gitleaks findings
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        run: |
          set -euo pipefail
          count="$(jq '[.runs[].results[]?] | length' gitleaks-results.sarif)"
          if [ "$count" = "0" ]; then
            echo "::notice::gitleaks completed with no findings."
            exit 0
          fi
          echo "::error::gitleaks reported ${count} redacted finding(s). Rule, path, and line summary follows; secret values are not printed."
          jq -r '
            .runs[].results[]?
            | "- rule: `" + (.ruleId // "unknown") + "`"
              + ", path: `" + (.locations[0].physicalLocation.artifactLocation.uri // "unknown") + "`"
              + ", line: `" + ((.locations[0].physicalLocation.region.startLine // "unknown") | tostring) + "`"
          ' gitleaks-results.sarif | sort | uniq -c
      - name: Filter test-classified Gitleaks SARIF results
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        run: |
          python3 scripts/ci/filter_gitleaks_sarif.py \
            gitleaks-results.sarif \
            gitleaks-results.upload.sarif
      - name: Upload gitleaks SARIF to code scanning
        if: always() && hashFiles('gitleaks-results.upload.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gitleaks-results.upload.sarif
          category: gitleaks
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}
          wait-for-processing: false
      - name: Enforce secret-scan gate
        if: steps.gitleaks.outputs.rc != '0'
        run: |
          echo "::error::gitleaks detected potential secrets (exit ${{ steps.gitleaks.outputs.rc }}). Rotate any exposed credential and scrub history."
          exit 1

  trivy-fs:
    needs: changed-scope
    if: github.event.action != 'closed' && needs.changed-scope.outputs.code == 'true'
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout exact Trivy head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify Trivy head checkout
        env:
          EXPECTED_CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::Trivy checkout identity mismatch for ${EXPECTED_CHECKOUT_REPOSITORY}: expected ${EXPECTED_CHECKOUT_SHA}, actual ${actual_sha}."
            exit 1
          fi
          echo "SECURITY_CHECKOUT scanner=trivy-fs revision=head repository=${EXPECTED_CHECKOUT_REPOSITORY} expected_sha=${EXPECTED_CHECKOUT_SHA} actual_sha=${actual_sha}"
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          # Runner groups can schedule onto different hosts. Reinstall the
          # pinned binary instead of trusting a cache entry whose path or
          # executable bit belongs to a previous runner.
          cache: false
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          # Without this, trivy-action rebuilds the SARIF scan with ALL
          # severities and the parser below would gate LOW findings too,
          # contradicting the documented MEDIUM-or-higher gate above.
          limit-severities-for-sarif: true
      - name: Require Trivy SARIF output
        run: |
          set -euo pipefail
          if [ ! -s trivy-results.sarif ]; then
            echo "::error::Trivy did not produce trivy-results.sarif; inspect the Trivy filesystem scan logs above."
            exit 1
          fi
      - name: Print Trivy findings that failed the gate
        # SARIF-only output otherwise leaves failures as just "exit code 1".
        shell: python3 {0}
        run: |
          import json, pathlib

          sarif = json.loads(pathlib.Path("trivy-results.sarif").read_text(encoding="utf-8"))
          findings = []
          for run in sarif.get("runs", []):
              rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  rule = rules.get(result.get("ruleId", ""), {})
                  severity = rule.get("properties", {}).get("security-severity", "?")
                  lines = (result.get("message", {}).get("text") or "").strip().splitlines()
                  fields = {}
                  for entry in lines:
                      key, sep, value = entry.partition(":")
                      if sep:
                          fields[key.strip().lower()] = value.strip()
                  if fields.get("severity"):
                      severity = f"{fields['severity']} (security-severity={severity})"
                  message = fields.get("message") or (lines[0] if lines else result.get("ruleId", ""))
                  locations = result.get("locations", [])
                  if locations:
                      phys = locations[0].get("physicalLocation", {})
                      uri = phys.get("artifactLocation", {}).get("uri", "?")
                      line = phys.get("region", {}).get("startLine", "?")
                      where = f"{uri}:{line}"
                  else:
                      where = "-"
                  findings.append((severity, result.get("ruleId", "?"), where, message))

          if not findings:
              print("Trivy filesystem scan completed with 0 CRITICAL/HIGH/MEDIUM findings in trivy-results.sarif.")
          else:
              print(f"Trivy filesystem scan reported {len(findings)} finding(s):")
              for severity, rule_id, where, message in findings:
                  print(f"  [{severity}] {rule_id} {where} - {message}")
              print("")
              print("Remediate each finding at the shared base branch so open PRs inherit the fix.")
              raise SystemExit(1)
      - name: Upload Trivy SARIF to code scanning
        id: upload_trivy_sarif
        if: always() && hashFiles('trivy-results.sarif') != ''
        # The parser above fails on every fixable Medium+ finding independently.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}
          wait-for-processing: false
      - name: Report Trivy SARIF upload failure
        if: steps.upload_trivy_sarif.outcome == 'failure'
        run: |
          echo "::warning::Trivy SARIF upload to code scanning failed after the filesystem scan. The Trivy finding log above remains the hard gate, so upload rate limits cannot hide CRITICAL/HIGH/MEDIUM findings."

  scorecard:
    needs: changed-scope
    if: github.event.action != 'closed' && needs.changed-scope.outputs.code == 'true'
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    # SOFT: posture findings are unrelated to the PR diff, so never block merge.
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout exact Scorecard head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify Scorecard head checkout
        env:
          EXPECTED_CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::Scorecard checkout identity mismatch for ${EXPECTED_CHECKOUT_REPOSITORY}: expected ${EXPECTED_CHECKOUT_SHA}, actual ${actual_sha}."
            exit 1
          fi
          echo "SECURITY_CHECKOUT scanner=scorecard revision=head repository=${EXPECTED_CHECKOUT_REPOSITORY} expected_sha=${EXPECTED_CHECKOUT_SHA} actual_sha=${actual_sha}"
      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Filter delegated PR-only Scorecard SARIF findings
        run: |
          python3 <<'PY'
          import json
          import pathlib

          PR_HARD_GATE_RULE_IDS = {"SASTID", "VulnerabilitiesID"}
          PR_GOVERNANCE_RULE_IDS = {"FuzzingID"}
          PR_DELEGATED_RULE_IDS = PR_HARD_GATE_RULE_IDS | PR_GOVERNANCE_RULE_IDS

          sarif_path = pathlib.Path("results.sarif")
          sarif = json.loads(sarif_path.read_text(encoding="utf-8"))
          hard_gate_delegated = 0
          governance_delegated = 0
          for run in sarif.get("runs", []):
              kept = []
              for result in run.get("results", []):
                  rule_id = result.get("ruleId")
                  if rule_id in PR_DELEGATED_RULE_IDS:
                      if rule_id in PR_HARD_GATE_RULE_IDS:
                          hard_gate_delegated += 1
                      if rule_id in PR_GOVERNANCE_RULE_IDS:
                          governance_delegated += 1
                      continue
                  kept.append(result)
              run["results"] = kept
          filtered_path = sarif_path.with_name(f"{sarif_path.name}.filtered")
          filtered_path.write_text(json.dumps(sarif, indent=2), encoding="utf-8")
          filtered_path.replace(sarif_path)
          print(
              "Delegated "
              f"{hard_gate_delegated} PR-only Scorecard SAST/vulnerability finding(s) to "
              "CodeQL, OSV, Trivy, and dependency-review hard gates."
          )
          print(
              "Delegated "
              f"{governance_delegated} PR-only Scorecard fuzzing posture finding(s) "
              "to default-branch governance tracking."
          )
          PY
      - name: Upload Scorecard SARIF to code scanning
        id: upload_scorecard_sarif
        # Scorecard is soft repository-posture evidence; upload quota is external.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: scorecard
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}
          wait-for-processing: false
      - name: Report Scorecard SARIF upload failure
        if: steps.upload_scorecard_sarif.outcome == 'failure'
        run: |
          echo "::warning::Scorecard SARIF upload to code scanning failed after delegated PR-only findings were filtered. Scorecard is PR posture evidence only; CodeQL, OSV, Trivy, and dependency-review remain the hard gates."
