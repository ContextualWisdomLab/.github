name: Repair central runner image selection

on:
  push:
    branches: [fix/central-explicit-ubuntu2404-20260901]
    paths: [.github/repair-central-runner-image.trigger]

permissions:
  contents: write

jobs:
  repair-central-runner-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/central-explicit-ubuntu2404-20260901
          fetch-depth: 0
      - name: Prove RED then migrate central workflows to explicit Ubuntu 24.04
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/central-explicit-ubuntu2404-20260901'
          starting_head="$GITHUB_SHA"
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$remote_head" = "$starting_head"

          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          git merge --no-edit origin/main

          cat > tests/test_central_runner_image_contract.py <<'PY'
          """Protect the central control plane from floating runner-image starvation."""

          from __future__ import annotations

          from pathlib import Path
          import unittest


          WORKFLOW_DIRECTORY = Path('.github/workflows')
          FLOATING_SELECTOR = 'runs-on: ubuntu-latest'
          EXPLICIT_SELECTOR = 'runs-on: ubuntu-24.04'


          class CentralRunnerImageContract(unittest.TestCase):
              """Require executable central Ubuntu jobs to use the proven explicit image."""

              def test_no_central_workflow_uses_floating_ubuntu_latest(self) -> None:
                  """Reject floating Ubuntu selectors while the explicit 24.04 pool is healthy."""
                  offenders: list[str] = []
                  explicit_count = 0
                  for workflow_path in sorted(WORKFLOW_DIRECTORY.glob('*.yml')):
                      workflow = workflow_path.read_text(encoding='utf-8')
                      if FLOATING_SELECTOR in workflow:
                          offenders.append(str(workflow_path))
                      explicit_count += workflow.count(EXPLICIT_SELECTOR)
                  self.assertFalse(
                      offenders,
                      'floating ubuntu-latest selectors remain in: ' + ', '.join(offenders),
                  )
                  self.assertGreater(explicit_count, 0, 'no explicit Ubuntu 24.04 jobs found')


          if __name__ == '__main__':
              unittest.main()
          PY

          set +e
          python3 tests/test_central_runner_image_contract.py
          red_rc=$?
          set -e
          if [ "$red_rc" -eq 0 ]; then
            echo '::error::Central runner-image regression did not reproduce RED.'
            exit 1
          fi
          printf 'Observed expected RED central runner-image contract (rc=%s).\n' "$red_rc"

          python3 <<'PY'
          from pathlib import Path

          workflow_directory = Path('.github/workflows')
          floating = 'runs-on: ubuntu-latest'
          explicit = 'runs-on: ubuntu-24.04'
          changed_files: list[str] = []
          replacement_count = 0
          for workflow_path in sorted(workflow_directory.glob('*.yml')):
              text = workflow_path.read_text(encoding='utf-8')
              count = text.count(floating)
              if count == 0:
                  continue
              workflow_path.write_text(text.replace(floating, explicit), encoding='utf-8')
              changed_files.append(str(workflow_path))
              replacement_count += count
          if replacement_count == 0:
              raise SystemExit('expected at least one floating central runner selector')
          print(f'replaced {replacement_count} selectors across {len(changed_files)} workflows')
          for changed_file in changed_files:
              print(changed_file)
          PY

          python3 tests/test_central_runner_image_contract.py
          python3 tests/test_merge_scheduler_runner_image_contract.py
          python3 scripts/ci/pr_review_merge_scheduler.py --self-test
          git diff --check

          latest_remote="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          test "$latest_remote" = "$starting_head"

          rm -f \
            .github/workflows/repair-central-runner-image.yml \
            .github/repair-central-runner-image.trigger
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): pin central Ubuntu jobs to 24.04'
          git push origin "HEAD:${branch}"
