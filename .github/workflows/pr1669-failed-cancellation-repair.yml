name: Temporary PR1669 Failed Cancellation Repair

on:
  push:
    branches:
      - fix/scheduler-stale-headrefoid-cancellation

permissions:
  contents: write

concurrency:
  group: pr1669-failed-cancellation-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize exact branch head without credentials
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/ContextualWisdomLab/.github.git
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Apply bounded production repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/pr_review_merge_scheduler.py")
          source = path.read_text()
          replacements = [
              (
                  "        force_cancel_workflow_runs(repo, [run_id])\n        return run_id\n",
                  "        failures = force_cancel_workflow_runs(repo, [run_id])\n        return None if run_id in failures else run_id\n",
              ),
              (
                  "        force_cancel_workflow_runs(run_repo, [run_id])\n        return run_id\n",
                  "        failures = force_cancel_workflow_runs(run_repo, [run_id])\n        return None if run_id in failures else run_id\n",
              ),
              (
                  "        force_cancel_workflow_runs(run_repo, [run_id])\n        return \"cancelled\", run_ref\n",
                  "        failures = force_cancel_workflow_runs(run_repo, [run_id])\n        return (\"preserved\" if run_id in failures else \"cancelled\"), run_ref\n",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one production replacement target; found {count}: {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Verify bounded contract before publication
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/pr_review_merge_scheduler.py tests/test_pr1669_cancel_stale_opencode_runs.py
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/ci/pr_review_merge_scheduler.py").read_text()
          tests = Path("tests/test_pr1669_cancel_stale_opencode_runs.py").read_text()
          required_source = (
              "return None if run_id in failures else run_id",
              "return (\"preserved\" if run_id in failures else \"cancelled\"), run_ref",
          )
          for contract in required_source:
              if contract not in source:
                  raise SystemExit(f"missing repaired contract: {contract}")
          required_tests = (
              "test_cancel_stale_opencode_runs_preserves_failed_cancellation",
              "test_cancel_stale_pr_runs_preserves_failed_cancellation",
              "test_cancel_revalidated_review_run_refs_preserves_failed_cancellation",
          )
          for test_name in required_tests:
              if test_name not in tests:
                  raise SystemExit(f"missing RED regression: {test_name}")
          PY
          git diff --check

      - name: Publish successor and remove temporary workflow
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUSH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/scheduler-stale-headrefoid-cancellation
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote https://github.com/ContextualWisdomLab/.github.git "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Writer branch advanced concurrently; refusing to overwrite ${remote_sha}."
            exit 1
          fi
          git rm .github/workflows/pr1669-failed-cancellation-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/pr_review_merge_scheduler.py tests/test_pr1669_cancel_stale_opencode_runs.py
          git diff --cached --check
          git commit -m 'fix(scheduler): preserve runs when cancellation fails'
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/ContextualWisdomLab/.github.git" "HEAD:refs/heads/${TARGET_BRANCH}"
