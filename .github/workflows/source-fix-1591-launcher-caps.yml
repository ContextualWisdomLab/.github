name: One-shot PR 1591 launcher admission repair

on:
  push:
    branches:
      - fix/no-heuristic-free-review-admission
    paths:
      - .github/workflows/source-fix-1591-launcher-caps.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: RED, GREEN, full verification, and self-removal
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/no-heuristic-free-review-admission
          TEMP_WORKFLOW: .github/workflows/source-fix-1591-launcher-caps.yml
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          branch_head="$(git rev-parse HEAD)"

          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

          cat >> tests/test_contextual_orchestrator_no_heuristic_admission.py <<'PY'


def test_legacy_ignored_inputs_accept_arbitrary_values() -> None:
    """Ignored compatibility inputs cannot become an accidental admission contract."""
    rows = [_free_row(index) for index in range(3)]
    sentinel = object()

    result = policy.build_zdr_prioritized_catalog(
        rows,
        pool="free",
        limit="retired-limit",
        account_cap=sentinel,
    )

    assert [entry["model"] for entry in result["agents"]] == [
        row["model"] for row in rows
    ]
    assert result["report"]["legacy_limit_ignored"] is True
    assert result["report"]["legacy_account_cap_ignored"] is True
PY

          cat >> tests/test_contextual_orchestrator_review_runtime_preflight.py <<'PY'


