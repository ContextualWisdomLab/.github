name: One-shot PR 1591 launcher admission repair

on:
  push:
    branches:
      - fix/no-heuristic-free-review-admission
    paths:
      - .github/workflows/source-fix-1591-launcher-caps.yml
      - scripts/ci/source_fix_1591_launcher_caps.py
      - scripts/ci/source_fix_1591_resume.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Reconcile current main and resume RED-GREEN repair
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/no-heuristic-free-review-admission
          RESUME_DRIVER: scripts/ci/source_fix_1591_resume.py
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          branch_head="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
          PYTHONPATH=. python3 "$RESUME_DRIVER"

          git add scripts/ci/contextual_orchestrator_review_policy.py
          git add scripts/ci/contextual_orchestrator_review_launcher.py
          git add scripts/ci/contextual_orchestrator_review_sidecar.sh
          git add tests/test_contextual_orchestrator_no_heuristic_admission.py
          git add tests/test_contextual_orchestrator_review_policy.py
          git add tests/test_contextual_orchestrator_review_runtime_preflight.py
          git add CHANGELOG.md docs/product-technical-gap-baseline.md
          git diff --cached --check

          remote_branch="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_branch" = "$branch_head"

          if ! git diff --cached --quiet; then
            git commit -m "fix(review): remove launcher catalog admission caps"
          fi
          git push origin "HEAD:${TARGET_BRANCH}"
