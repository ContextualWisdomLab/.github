name: Export live PR 782 test dependencies

on:
  push:
    branches:
      - tmp/export-pr782-rca-live-20260808
    paths:
      - .github/workflows/export-pr782-live-deps.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize dependency bundle
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          bundle="$RUNNER_TEMP/pr782-live-deps"
          mkdir -p "$bundle/scripts/ci" "$bundle/tests"
          cp scripts/ci/pr_review_merge_scheduler.py "$bundle/scripts/ci/pr_review_merge_scheduler.py"
          cp requirements-opencode-review-ci-hashes.txt "$bundle/requirements-opencode-review-ci-hashes.txt"
          for file in tests/test_pr_review_merge_scheduler.py tests/test_pr_review_merge_scheduler_*.py; do
            if [ -f "$file" ]; then cp "$file" "$bundle/tests/$(basename "$file")"; fi
          done
          sha256sum "$bundle"/scripts/ci/pr_review_merge_scheduler.py "$bundle"/requirements-opencode-review-ci-hashes.txt >"$bundle/MANIFEST.sha256"
      - name: Upload dependency bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr782-live-deps-${{ github.sha }}
          path: ${{ runner.temp }}/pr782-live-deps
          if-no-files-found: error
          retention-days: 1
