name: One-shot PR759 exact merge head

on:
  push:
    branches: [fix/opencode-coverage-failure-diagnostics]
    paths:
      - .github/workflows/one-shot-pr759-final-merge.yml

concurrency:
  group: one-shot-pr759-exact-merge-head
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-verify-publish:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact workflow trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Materialize reviewed exact-main patch
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_MAIN_SHA: f070c504c1cb06891b800d7ab0cf6ac7d3cf8eae
          EXPECTED_PATCH_SHA256: 746baa2f75677a0da4aebc8136c7365623e96243333ae0764df549ac2e8839aa
          EXPECTED_GZIP_SHA256: f35bac2f0b789ce9391980b960b8301909693962294911b026db35d9774c3871
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          for part in 00 01 02 03 04; do
            test -s ".github/pr759-final-patch/part-${part}.b64"
          done
          cat .github/pr759-final-patch/part-*.b64 >"$RUNNER_TEMP/pr759.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/pr759.patch.gz.b64" >"$RUNNER_TEMP/pr759.patch.gz"
          printf '%s  %s\n' "$EXPECTED_GZIP_SHA256" "$RUNNER_TEMP/pr759.patch.gz" | sha256sum -c -
          gzip --decompress --stdout "$RUNNER_TEMP/pr759.patch.gz" >"$RUNNER_TEMP/pr759.patch"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$RUNNER_TEMP/pr759.patch" | sha256sum -c -
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git switch --detach "$EXPECTED_MAIN_SHA"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/pr759.patch"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          test ! -e .github/workflows/one-shot-pr759-final-merge.yml
          test ! -e .github/pr759-final-patch
          test ! -e .github/workflows/one-shot-pr759-libclang-finalize.yml
          test ! -e .github/workflows/opencode-coverage-diagnostics-ci.yml.tmp
          test ! -e scripts/ci/pr759_reconcile.py

      - name: Verify production coverage and realistic regression contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_coverage_native_fuzz_lock_boundary.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_opencode_libclang_toolchain_contract.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_strix_dependency_security_floor.py \
            --cov=scripts.ci.coverage_failure_summary \
            --cov=scripts.ci.materialize_base_javascript_packages \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov=scripts.ci.sanitize_github_output_summary \
            --cov-branch \
            --cov-fail-under=100 \
            -q
          python -m pytest -q \
            tests/test_strix_model_utils_source_dirs.py \
            tests/test_opencode_agent_contract.py

      - name: Verify complete repository test suite
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: timeout --kill-after=30 3600 python -m pytest -q tests

      - name: Verify docstrings syntax and Strix contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m interrogate --fail-under 100 \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m compileall -q scripts/ci tests
          bash -n \
            scripts/ci/strix_model_utils.sh \
            scripts/ci/strix_quick_gate.sh \
            scripts/ci/test_strix_quick_gate.sh
          timeout --kill-after=30 3600 bash scripts/ci/test_strix_quick_gate.sh
          git diff --cached --check
          test -z "$(git diff --name-only)"

      - name: Verify real libclang and LLVM package availability
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          probe_dir="$(mktemp -d)"
          cat >"$probe_dir/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/library/python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update \
            && apt-get install --no-install-recommends -y libclang-19-dev llvm-19 \
            && rm -rf /var/lib/apt/lists/*
          ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib
          ENV LLVM_COV=/usr/bin/llvm-cov-19
          ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19
          RUN test -d "$LIBCLANG_PATH" \
            && find "$LIBCLANG_PATH" -maxdepth 1 \( -type f -o -type l \) -name 'libclang.so*' -print -quit | grep -q . \
            && test -x "$LLVM_COV" \
            && test -x "$LLVM_PROFDATA"
          DOCKERFILE
          docker build --pull --no-cache --tag pr759-libclang-probe "$probe_dir"
          rm -rf "$probe_dir"

      - name: Publish exact two-parent merge head
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_MAIN_SHA: f070c504c1cb06891b800d7ab0cf6ac7d3cf8eae
          HEAD_BRANCH: fix/opencode-coverage-failure-diagnostics
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || github.token }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          test -n "$PUSH_TOKEN"
          test "$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')" = "$TRIGGER_SHA"
          tree_sha="$(git write-tree)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merge_sha="$(printf '%s\n' 'merge(main): reconcile PR 759 with trusted uv baseline' | \
            git commit-tree "$tree_sha" -p "$TRIGGER_SHA" -p "$EXPECTED_MAIN_SHA")"
          test "$(git rev-parse "${merge_sha}^{tree}")" = "$tree_sha"
          test "$(git rev-list --parents -n 1 "$merge_sha")" = "$merge_sha $TRIGGER_SHA $EXPECTED_MAIN_SHA"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "${merge_sha}:refs/heads/${HEAD_BRANCH}"
