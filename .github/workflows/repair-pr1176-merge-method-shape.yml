name: Repair PR1176 merge-method shape audit

on:
  push:
    branches: [fix/stacked-pr-central-required-workflows]
    paths:
      - ".github/workflows/repair-pr1176-merge-method-shape.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/stacked-pr-central-required-workflows
          fetch-depth: 0

      - name: Fail closed on malformed allowed_merge_methods payloads
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          audit_path = Path("scripts/ci/audit_central_required_workflows.py")
          text = audit_path.read_text(encoding="utf-8")
          old = '        allowed_methods = set(parameters.get("allowed_merge_methods") or [])\n'
          new = '''        raw_allowed_methods = parameters.get("allowed_merge_methods")\n        allowed_methods = (\n            set(raw_allowed_methods)\n            if isinstance(raw_allowed_methods, list)\n            and all(isinstance(method, str) for method in raw_allowed_methods)\n            else set()\n        )\n'''
          if text.count(old) != 2:
              raise SystemExit(
                  f"expected exactly two merge-method parsers at the exact writer head; found {text.count(old)}"
              )
          audit_path.write_text(text.replace(old, new), encoding="utf-8")

          workflow_path = Path(".github/workflows/solo-maintainer-ruleset-contract.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          trigger_anchor = '      - "tests/test_solo_maintainer_ruleset_policy.py"\n'
          test_anchor = '            tests/test_solo_maintainer_ruleset_policy.py \\\n'
          new_test = "tests/test_ruleset_merge_method_shape_regression.py"
          if new_test not in workflow:
              if trigger_anchor not in workflow or test_anchor not in workflow:
                  raise SystemExit("focused workflow anchors changed; refusing a stale patch")
              workflow = workflow.replace(
                  trigger_anchor,
                  trigger_anchor + f'      - "{new_test}"\n',
                  1,
              )
              workflow = workflow.replace(
                  test_anchor,
                  test_anchor + f"            {new_test} \\\n",
                  1,
              )
              workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify malformed-shape regression and focused governance suites
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/ruleset-repair-requirements.txt" <<'EOF'
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          EOF
          python -m pip install --only-binary=:all: --require-hashes -r "${RUNNER_TEMP}/ruleset-repair-requirements.txt"
          python -m pytest -q \
            tests/test_ruleset_merge_method_shape_regression.py \
            tests/test_central_required_workflow_ruleset_audit.py \
            tests/test_solo_maintainer_ruleset_policy.py \
            tests/test_ruleset_audit_completeness_regression.py \
            tests/test_pr_governance_audit_contract.py

      - name: Commit verified repair and retire helper
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/workflows/repair-pr1176-merge-method-shape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/audit_central_required_workflows.py \
            .github/workflows/solo-maintainer-ruleset-contract.yml \
            tests/test_ruleset_merge_method_shape_regression.py \
            .github/workflows/repair-pr1176-merge-method-shape.yml
          git commit -m "fix(governance): reject malformed merge-method payloads"
          git push origin HEAD:fix/stacked-pr-central-required-workflows
