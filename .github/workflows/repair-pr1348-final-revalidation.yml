name: Repair PR 1348 final queue revalidation

on:
  push:
    branches:
      - fix/queue-hygiene-live-ref-race

permissions:
  contents: write

concurrency:
  group: repair-pr1348-final-revalidation
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact writer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/queue-hygiene-live-ref-race
          fetch-depth: 0
      - name: Apply exact source and traceability repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow_path = Path('.github/workflows/pr-review-merge-scheduler.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old1 = '              if [ "$DRY_RUN" != "true" ]; then\n                while IFS= read -r run_id; do\n                  if ! gh api -X POST "/repos/${repo_full_name}/actions/runs/${run_id}/cancel" >/dev/null; then\n                    echo "Could not cancel superseded run ${run_id} in ${repo_full_name}; it may have finished already."\n                  fi\n                done < <(jq -r \' .[].id \' <<<"$superseded_runs_json")\n              fi\n'.replace("\\' .[].id \\'", "'.[].id'")
          new1 = '              if [ "$DRY_RUN" != "true" ]; then\n                while IFS= read -r run_id; do\n                  bash scripts/ci/revalidate_queue_cancellation.sh "$repo_full_name" "$run_id" "$default_branch" "$current_default_sha" "$open_pr_heads_json"\n                done < <(jq -r \' .[].id \' <<<"$superseded_runs_json")\n              fi\n'.replace("\\' .[].id \\'", "'.[].id'")
          old2 = '              if [ "$DRY_RUN" != "true" ]; then\n                while IFS= read -r run_id; do\n                  if ! gh api -X POST "/repos/${repo_full_name}/actions/runs/${run_id}/cancel" >/dev/null; then\n                    echo "Could not cancel run ${run_id} in ${repo_full_name}; it may have started or finished already."\n                  fi\n                done < <(jq -r \' .[].id \' <<<"$stale_runs_json")\n              fi\n'.replace("\\' .[].id \\'", "'.[].id'")
          new2 = '              if [ "$DRY_RUN" != "true" ]; then\n                while IFS= read -r run_id; do\n                  bash scripts/ci/revalidate_queue_cancellation.sh "$repo_full_name" "$run_id" "$default_branch" "$current_default_sha" "$open_pr_heads_json"\n                done < <(jq -r \' .[].id \' <<<"$stale_runs_json")\n              fi\n'.replace("\\' .[].id \\'", "'.[].id'")
          if old1 not in workflow:
              raise SystemExit('superseded cancellation block changed; refusing stale repair')
          workflow = workflow.replace(old1, new1, 1)
          if old2 not in workflow:
              raise SystemExit('aged cancellation block changed; refusing stale repair')
          workflow = workflow.replace(old2, new2, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          baseline_path = Path('docs/product-technical-gap-baseline.md')
          baseline = baseline_path.read_text(encoding='utf-8')
          doc = '\n\n### PR #1348 final cancellation revalidation (2026-09-02)\n\n- **Root cause:** exact head `af519b7927225588d437fed6ee30f20e76291c3e` classified Actions runs from an initial live-ref snapshot, but destructive cancellation occurred later without a second authoritative lookup. A synchronize event between classification and cancellation could therefore turn the snapshot stale and cancel newly current exact-head evidence.\n- **Repair:** immediately before either superseded-run or aged-run cancellation, the scheduler now executes `scripts/ci/revalidate_queue_cancellation.sh`, which re-fetches live run metadata plus the PR and its final head ref (or the default-branch HEAD for push/schedule), requires the final live state to remain consistent with the classification snapshot, fails closed on unavailable/malformed/moved state, preserves current-head evidence, and only then cancels a proven predecessor.\n- **Executable evidence:** `tests/test_queue_cancellation_revalidation.py` executes the production helper against deterministic GitHub API doubles for head movement, PR/ref lookup failure, current-head preservation, and proven predecessor cancellation. Existing queue-contract tests continue to cover discovery bounds and fail-closed initial snapshot construction.\n'
          if 'PR #1348 final cancellation revalidation' not in baseline:
              baseline_path.write_text(baseline + doc, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          change = '\n- Revalidate queue-hygiene cancellation candidates immediately before destructive cancellation, failing closed on moved or unavailable live PR/ref state and preserving exact-head evidence (`#1348`).\n'
          if 'Revalidate queue-hygiene cancellation candidates immediately before destructive cancellation' not in changelog:
              changelog_path.write_text(changelog + change, encoding='utf-8')
          PY
          python3 -m pytest -q tests/test_queue_cancellation_revalidation.py tests/test_required_workflow_queue_contract.py
          if command -v actionlint >/dev/null 2>&1; then
            actionlint .github/workflows/pr-review-merge-scheduler.yml
          fi
          git diff --check
      - name: Commit verified repair and remove temporary driver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr-review-merge-scheduler.yml docs/product-technical-gap-baseline.md CHANGELOG.md
          git rm -f .github/workflows/repair-pr1348-final-revalidation.yml .github/pr1348-repair.trigger
          git diff --cached --check
          git commit -m 'fix(scheduler): revalidate live state before cancellation [pr1348-repair]'
          git push origin HEAD:fix/queue-hygiene-live-ref-race
