# Reusable Dependency Review (workflow_call), consolidating the near-
# identical dependency-review.yml files argos, mightyETL, naruon, newsdom-api,
# and scopeweave each carried independently. See
# docs/adr/0024-dependency-review-reusable-workflow-consolidation.md and
# docs/doctoring/dependency-review-reusable-workflow-consolidation.md for the
# per-repo field audit behind these inputs.
#
# The `on: pull_request` trigger (and any branch restriction) stays in each
# calling repo's own thin workflow file -- a workflow_call target cannot also
# be the thing GitHub triggers directly on pull_request.
#
# Dependency Review requires a successful Dependency Graph comparison for the
# exact pull-request base/head. Repository visibility is not a sufficient
# capability signal, and HTTP 403/404 are not safe availability signals:
# GitHub can use those statuses for authorization/policy denials as well as
# unavailable resources. For a pull_request, only HTTP 200 authorizes running
# the pinned action; every non-200 comparison fails closed. Non-pull_request
# triggers may skip because they do not carry the exact PR base/head identity.
#
# Reusable-workflow permissions can only be maintained or reduced through the
# call chain. Every thin caller therefore must declare at least `contents:
# read` and `pull-requests: read`; this workflow cannot elevate a caller token
# that omitted those scopes.
#
# Example caller (.github/workflows/dependency-review.yml in a product repo).
# Pin `uses:` to the exact protected-main commit SHA carrying this workflow,
# never `@main`: a mutable central ref could run an unreviewed workflow change
# against the caller's PR checks. If branch protection requires the old
# standalone job name, note that reusable workflow adoption publishes the
# combined check name `<calling job> / dependency-review`; update the required
# check name to the exact published context without weakening the gate.
#
#   name: Dependency Review
#   on:
#     pull_request:
#   permissions:
#     contents: read
#     pull-requests: read
#   concurrency:
#     group: dependency-review-${{ github.event.pull_request.number || github.ref }}
#     cancel-in-progress: true
#   jobs:
#     dependency-review:
#       uses: ContextualWisdomLab/.github/.github/workflows/dependency-review.yml@<protected-main-commit-sha>
#       with:
#         fail_on_severity: high
#         allow_ghsas: "GHSA-69w3-r845-3855"

name: Reusable Dependency Review

on:
  workflow_call:
    inputs:
      fail_on_severity:
        description: "Value forwarded to dependency-review-action's fail-on-severity input."
        required: false
        type: string
        default: "moderate"
      allow_ghsas:
        description: >-
          Comma-or-newline-separated GHSA IDs forwarded to
          dependency-review-action's allow-ghsas input. Empty (the default)
          allows none.
        required: false
        type: string
        default: ""
      continue_on_error:
        description: >-
          Whether the dependency-review step itself is allowed to fail
          without failing the job (argos's original behavior, which relies
          on a separate blocking OSV-Scanner gate instead of this one).
          Default false makes the dependency-review step itself blocking.
        required: false
        type: boolean
        default: false
      comment_summary_in_pr:
        description: >-
          Value forwarded to dependency-review-action's comment-summary-in-pr
          input. Default "on-failure" (scopeweave's original choice, applied
          uniformly when this input was still hardcoded); naruon explicitly
          opts out with "never" -- an explicit per-repo choice, not
          accidental drift, so it must stay an input rather than being
          flattened to one value.
        required: false
        type: string
        default: "on-failure"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    env:
      # Opts every JS action this job runs (checkout, dependency-review-action)
      # into the Node 24 actions runtime ahead of GitHub's default cutover,
      # matching newsdom-api's original workflow -- applied uniformly here
      # since it is a forward-compatibility setting, not a per-repo policy.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check dependency graph availability
        id: dependency_graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "Dependency review only runs as a hard gate for pull_request events."
            exit 0
          fi

          api_url="${GITHUB_API_URL:-https://api.github.com}"
          response_file="$(mktemp)"
          status="$(
            curl -fsS -o "$response_file" -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" \
              || true
          )"

          if [ "$status" = "200" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Dependency graph comparison failed with HTTP ${status}. For a pull_request, non-200 responses are ambiguous between feature availability and authorization/policy/transport failure, so Dependency Review fails closed instead of being skipped."
          if [ -s "$response_file" ]; then
            cat "$response_file"
          fi
          exit 1

      - name: Dependency review
        if: steps.dependency_graph.outputs.available == 'true'
        continue-on-error: ${{ inputs.continue_on_error }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail_on_severity }}
          allow-ghsas: ${{ inputs.allow_ghsas }}
          comment-summary-in-pr: ${{ inputs.comment_summary_in_pr }}
