name: Product Performance Attestation Quality CI

on:
  pull_request:
    branches: [main, fix/reusable-attestation-workflow-identity]
    paths:
      - ".github/workflows/product-performance-attestation.yml"
      - ".github/workflows/product-performance-attestation-quality.yml"
      - "scripts/ci/verify_product_performance_evidence.py"
      - "tests/test_product_performance_attestation_contract.py"
      - "tests/test_product_performance_evidence_verifier.py"
      - "docs/doctoring/product-performance-attestation.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.d/20260913-product-performance-attestation.md"

concurrency:
  group: product-performance-attestation-quality-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  product-performance-attestation-quality:
    name: product-performance-attestation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Compile production verifier and contracts on Python 3.10
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m compileall -q \
            scripts/ci/verify_product_performance_evidence.py \
            tests/test_product_performance_attestation_contract.py \
            tests/test_product_performance_evidence_verifier.py

      - name: Set up current quality Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install exact quality dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/performance-attestation-quality.txt" <<'EOF'
          coverage==7.15.2 --hash=sha256:b9a6367e4aff723e8ee8190836836124284e8fcd4265e307c844010cfa074f3f
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          interrogate==1.7.0 --hash=sha256:337334c2f599b61f9b12ef8a548be0cd4eae4ca251d0d95568c611fac1d0023d
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          EOF
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r "${RUNNER_TEMP}/performance-attestation-quality.txt"

      - name: Verify exact-head performance attestation contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python -m coverage erase
          python -m coverage run --branch -m pytest -q \
            tests/test_product_performance_attestation_contract.py \
            tests/test_product_performance_evidence_verifier.py
          python -m coverage report \
            --include=scripts/ci/verify_product_performance_evidence.py \
            --show-missing \
            --fail-under=100
          python -m interrogate --fail-under 100 \
            scripts/ci/verify_product_performance_evidence.py
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
