name: Trigger nested npm metadata materializer

on:
  push:
    branches: [fix/npm-nested-metadata-lock-validation]
    paths:
      - ".github/npm-nested-metadata.trigger"

permissions:
  contents: read

jobs:
  trigger:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/npm-nested-metadata-lock-validation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Retrigger the reviewed materializer through a workflow-scoped token
        env:
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          TARGET_BRANCH: fix/npm-nested-metadata-lock-validation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test -n "${PUSH_TOKEN:-}"
          printf '\n# exact-head retrigger %s\n' "$GITHUB_SHA" >> \
            .github/workflows/materialize-npm-nested-metadata-validation.yml
          rm -f \
            .github/workflows/trigger-npm-nested-metadata-materializer.yml \
            .github/npm-nested-metadata.trigger
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: retrigger nested npm metadata materializer"
          echo "::add-mask::$PUSH_TOKEN"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
