name: NVIDIA NIM PR Review Autofix
run-name: >-
  NVIDIA NIM Autofix ${{ github.event.client_payload.target_repository || github.repository }}#${{
  github.event.client_payload.pr_number || 'event' }}@${{
  github.event.client_payload.pr_head_sha || github.sha }}

on:
  repository_dispatch:
    types: [nvidia-nim-pr-review-autofix]

concurrency:
  group: >-
    nvidia-nim-pr-review-autofix-${{ github.event.client_payload.target_repository }}-${{
    github.event.client_payload.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      PR_BASE_REF: ${{ github.event.client_payload.pr_base_ref }}
      PR_BASE_SHA: ${{ github.event.client_payload.pr_base_sha }}
      PR_HEAD_REF: ${{ github.event.client_payload.pr_head_ref }}
      PR_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha }}
      RESOLVE_CONFLICT: ${{ github.event.client_payload.resolve_conflict || 'false' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve immutable worker source
        id: trusted_source
        env:
          OIDC_AUDIENCE: cwl-nvidia-nim-pr-autofix-source
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          token="$(jq -r '.value // empty' <<<"$response")"
          [ -n "$token" ] || { echo "::error::OIDC token response was empty."; exit 1; }
          payload_segment="$(cut -d. -f2 <<<"$token")"
          case $((${#payload_segment} % 4)) in
            2) payload_segment="${payload_segment}==" ;;
            3) payload_segment="${payload_segment}=" ;;
          esac
          payload="$(printf '%s' "$payload_segment" | tr '_-' '/+' | base64 -d)"
          source_sha="$(jq -r '.workflow_sha // empty' <<<"$payload")"
          source_ref="$(jq -r '.workflow_ref // empty' <<<"$payload")"
          if ! [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Worker source did not resolve to an immutable SHA."
            exit 1
          fi
          case "$source_ref" in
            ContextualWisdomLab/.github/.github/workflows/nvidia-nim-pr-review-autofix.yml@*) ;;
            *) echo "::error::Unexpected worker source: ${source_ref:-missing}."; exit 1 ;;
          esac
          echo "sha=$source_sha" >>"$GITHUB_OUTPUT"

      - name: Checkout immutable autofix source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ steps.trusted_source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-autofix-source

      - name: Require NVIDIA NIM credential
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::NVIDIA_NIM_API_KEY is required; no alternate model provider is permitted for this scheduler."
            exit 1
          fi
          echo "::add-mask::$NVIDIA_API_KEY"

      - name: Exchange OpenCode app token for target repository writes
        id: target_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )" || true
          oidc_token="$(jq -r '.value // empty' <<<"${oidc_response:-{}}")"
          if [ -z "$oidc_token" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )" || true
          app_token="$(jq -r '.token // empty' <<<"${token_response:-{}}")"
          if [ -z "$app_token" ]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Fetch and checkout exact pull request head
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.target_app_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::target_repository must be in owner/name form."; exit 1;
          }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::PR number must be numeric."; exit 1; }
          [[ "$PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Invalid PR base SHA."; exit 1; }
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Invalid PR head SHA."; exit 1; }
          [ "$RESOLVE_CONFLICT" = "true" ] || [ "$RESOLVE_CONFLICT" = "false" ] || {
            echo "::error::resolve_conflict must be true or false."; exit 1;
          }

          live_pr_json="$(gh api -X GET "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_state="$(jq -r '.state // empty' <<<"$live_pr_json")"
          live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr_json")"
          live_base_sha="$(jq -r '.base.sha // empty' <<<"$live_pr_json")"
          live_head_ref="$(jq -r '.head.ref // empty' <<<"$live_pr_json")"
          live_head_sha="$(jq -r '.head.sha // empty' <<<"$live_pr_json")"
          live_head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$live_pr_json")"
          [ "$live_state" = "open" ] || { echo "::error::Autofix requires an open PR."; exit 1; }
          [ "$live_head_repo" = "$TARGET_REPOSITORY" ] || {
            echo "::error::Autofix supports only same-repository heads."; exit 1;
          }
          [ "$live_base_ref" = "$PR_BASE_REF" ] && [ "$live_base_sha" = "$PR_BASE_SHA" ] || {
            echo "::error::PR base metadata moved before autofix."; exit 1;
          }
          [ "$live_head_ref" = "$PR_HEAD_REF" ] && [ "$live_head_sha" = "$PR_HEAD_SHA" ] || {
            echo "::error::PR head moved before autofix."; exit 1;
          }

          target_workspace="$RUNNER_TEMP/autofix-target"
          mkdir -p "$target_workspace"
          git init -q "$target_workspace"
          gh auth setup-git
          git -C "$target_workspace" remote add origin "${GITHUB_SERVER_URL}/${TARGET_REPOSITORY}.git"
          git -C "$target_workspace" fetch --no-tags origin \
            "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" \
            "+refs/heads/${PR_HEAD_REF}:refs/remotes/origin/${PR_HEAD_REF}"
          [ "$(git -C "$target_workspace" rev-parse "refs/remotes/origin/${PR_HEAD_REF}")" = "$PR_HEAD_SHA" ] || {
            echo "::error::Fetched head differs from the validated head."; exit 1;
          }
          git -C "$target_workspace" switch --detach "$PR_HEAD_SHA"
          git -C "$target_workspace" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target_workspace" config user.name "github-actions[bot]"
          echo "TARGET_WORKSPACE=$target_workspace" >>"$GITHUB_ENV"

      - name: Install pinned OpenCode CLI
        env:
          OPENCODE_VERSION: "1.17.13"
          OPENCODE_SHA256: 157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          install_dir="$HOME/.opencode/bin"
          mkdir -p "$install_dir"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/opencode" "$install_dir/opencode"
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Prepare scoped repair context
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.target_app_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          allowed_paths_file="$RUNNER_TEMP/autofix-allowed-paths.txt"
          prompt_file="$RUNNER_TEMP/autofix-prompt.md"
          if [ "$RESOLVE_CONFLICT" = "true" ]; then
            cd "$TARGET_WORKSPACE"
            git merge --no-commit --no-ff "$PR_BASE_SHA" || true
            git diff --name-only --diff-filter=U | sort -u >"$allowed_paths_file"
            if [ ! -s "$allowed_paths_file" ]; then
              if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
                git commit -m "merge(${PR_BASE_REF}): refresh PR head"
                echo "SKIP_MODEL=true" >>"$GITHUB_ENV"
                exit 0
              fi
              echo "::error::Conflict-repair dispatch found no merge conflict or merge commit."
              exit 1
            fi
            {
              echo "Resolve only the in-progress merge conflicts in these files:"
              sed 's/^/- `/' "$allowed_paths_file" | sed 's/$/`/'
              echo
              echo "Preserve both sides where compatible, remove every conflict marker, and do not edit any other path."
            } >"$prompt_file"
          else
            python3 "$GITHUB_WORKSPACE/trusted-autofix-source/scripts/ci/pr_review_autofix_context.py" \
              --repo "$TARGET_REPOSITORY" \
              --pr-number "$PR_NUMBER" \
              --head-sha "$PR_HEAD_SHA" \
              --output "$RUNNER_TEMP/pr-review-autofix-context.md"
            awk '
              /^## Autofix Allowed Paths[[:space:]]*$/ { in_section=1; next }
              /^## / { in_section=0 }
              in_section && /^- `/ {
                line=$0
                sub(/^- `/, "", line)
                sub(/`[[:space:]]*$/, "", line)
                if (line != "") print line
              }
            ' "$RUNNER_TEMP/pr-review-autofix-context.md" | sort -u >"$allowed_paths_file"
            [ -s "$allowed_paths_file" ] || {
              echo "::error::No file-scoped actionable review paths were found."; exit 1;
            }
            {
              echo "Fix the smallest current-head review issues described below."
              echo "Edit only the authoritative allowed paths and do not execute shell commands."
              echo
              echo "Allowed paths:"
              sed 's/^/- `/' "$allowed_paths_file" | sed 's/$/`/'
              echo
              echo "Untrusted review context:"
              sed -n '1,260p' "$RUNNER_TEMP/pr-review-autofix-context.md"
            } >"$prompt_file"
          fi
          echo "ALLOWED_PATHS_FILE=$allowed_paths_file" >>"$GITHUB_ENV"
          echo "AUTOFIX_PROMPT_FILE=$prompt_file" >>"$GITHUB_ENV"

      - name: Run NVIDIA NIM OpenCode repair
        if: env.SKIP_MODEL != 'true'
        env:
          SHARE: "false"
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          NO_COLOR: "1"
          MODEL: nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
        run: |
          set -euo pipefail
          config_backup="$RUNNER_TEMP/opencode.jsonc.backup"
          had_config=0
          if [ -f "$TARGET_WORKSPACE/opencode.jsonc" ]; then
            cp "$TARGET_WORKSPACE/opencode.jsonc" "$config_backup"
            had_config=1
          fi
          restore_config() {
            if [ "$had_config" = "1" ]; then
              cp "$config_backup" "$TARGET_WORKSPACE/opencode.jsonc"
            else
              rm -f "$TARGET_WORKSPACE/opencode.jsonc"
            fi
          }
          trap restore_config EXIT
          cat >"$TARGET_WORKSPACE/opencode.jsonc" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "nvidia-nim/nvidia/llama-3.3-nemotron-super-49b-v1.5",
            "small_model": "nvidia-nim/meta/llama-3.3-70b-instruct",
            "enabled_providers": ["nvidia-nim"],
            "permission": {
              "edit": "allow",
              "bash": "deny",
              "read": "allow",
              "grep": "allow",
              "glob": "allow",
              "list": "allow",
              "task": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "lsp": "deny",
              "external_directory": "deny"
            },
            "agent": {
              "ci-autofix": {
                "description": "Conservative NVIDIA NIM PR review repair agent",
                "mode": "primary",
                "steps": 16,
                "permission": {
                  "edit": "allow",
                  "bash": "deny",
                  "read": "allow",
                  "grep": "allow",
                  "glob": "allow",
                  "list": "allow",
                  "task": "deny",
                  "webfetch": "deny",
                  "websearch": "deny",
                  "lsp": "deny",
                  "external_directory": "deny"
                }
              }
            },
            "provider": {
              "nvidia-nim": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {
                    "name": "Llama 3.3 Nemotron Super 49B v1.5",
                    "tool_call": true,
                    "reasoning": true,
                    "limit": {"context": 131072, "output": 16384}
                  },
                  "meta/llama-3.3-70b-instruct": {
                    "name": "Llama 3.3 70B Instruct",
                    "tool_call": true,
                    "limit": {"context": 131072, "output": 8192}
                  }
                }
              }
            }
          }
          JSON
          cd "$TARGET_WORKSPACE"
          timeout 18000 opencode run "$(cat "$AUTOFIX_PROMPT_FILE")" \
            --pure \
            --agent ci-autofix \
            --model "$MODEL" \
            --title "PR #${PR_NUMBER} NVIDIA NIM review repair"
          restore_config
          trap - EXIT

      - name: Validate repair scope and syntax
        if: env.SKIP_MODEL != 'true'
        run: |
          set -euo pipefail
          cd "$TARGET_WORKSPACE"
          git diff --check
          mapfile -t changed_files < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          [ "${#changed_files[@]}" -gt 0 ] || { echo "No safe repair change was produced."; exit 0; }
          for changed_file in "${changed_files[@]}"; do
            grep -Fxq -- "$changed_file" "$ALLOWED_PATHS_FILE" || {
              echo "::error::OpenCode modified disallowed path ${changed_file}."; exit 1;
            }
          done
          if [ "$RESOLVE_CONFLICT" = "true" ]; then
            [ -z "$(git diff --name-only --diff-filter=U)" ] || {
              echo "::error::Merge conflicts remain unresolved."; exit 1;
            }
            if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- $(cat "$ALLOWED_PATHS_FILE"); then
              echo "::error::Conflict markers remain in repaired files."
              exit 1
            fi
          fi
          mapfile -t changed_python < <(printf '%s\n' "${changed_files[@]}" | grep -E '\.py$' || true)
          if [ "${#changed_python[@]}" -gt 0 ]; then
            python3 -m py_compile "${changed_python[@]}"
          fi

      - name: Commit and push exact-head repair
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.target_app_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          cd "$TARGET_WORKSPACE"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No repair commit required."
            exit 0
          fi
          live_head_sha="$(gh api -X GET "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          [ "$live_head_sha" = "$PR_HEAD_SHA" ] || {
            echo "::error::PR head moved during repair; refusing to push."; exit 1;
          }
          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            git commit -m "merge(${PR_BASE_REF}): resolve PR #${PR_NUMBER} conflicts"
          else
            git commit -m "fix(pr-${PR_NUMBER}): address review feedback with NVIDIA NIM"
          fi
          git push origin "HEAD:${PR_HEAD_REF}"
