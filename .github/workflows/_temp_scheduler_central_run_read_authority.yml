name: Temporary Scheduler Central Run Read Authority
# Restaged after protected-main advancement; this one-shot file self-retires on the verified successor.

on:
  push:
    branches:
      - fix/scheduler-central-run-read-authority-20260902
    paths:
      - .github/workflows/_temp_scheduler_central_run_read_authority.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-scheduler-central-run-read-authority
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-slim
    outputs:
      patch_sha256: ${{ steps.seal.outputs.patch_sha256 }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
    steps:
      - name: Checkout exact writer head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind unchanged protected-main authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/scheduler-central-run-read-authority-20260902
          remote_head="$(git rev-parse origin/fix/scheduler-central-run-read-authority-20260902)"
          test "$remote_head" = "$GITHUB_SHA"
          main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$main_sha" "$GITHUB_SHA"
          echo "main_sha=$main_sha" >>"$GITHUB_OUTPUT"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install hash-locked scheduler test toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Prove central credential regression is RED for the intended reason
        shell: bash
        run: |
          set -euo pipefail
          set +e
          red_output="$(PYTHONPATH=. python -m pytest -q tests/test_scheduler_central_run_read_authority.py 2>&1)"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -eq 1
          grep -Eq '1 failed, 2 passed|1 failed.*2 passed|2 passed.*1 failed' <<<"$red_output"
          grep -Fq 'target credential must not read central Actions evidence' <<<"$red_output"

      - name: Materialize production repair and retire one-shot source
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/ci/temp_scheduler_central_run_read_authority.py
          git diff --check

      - name: Remove obsolete source-fix drivers from production coverage scope
        shell: bash
        run: |
          set -euo pipefail
          # PR #1714 and PR #1715 are already integrated on protected main.
          # Their original writer branches are gone and code search shows these
          # drivers are called only by the corresponding one-shot workflows.
          # The dedicated PR #1720 lane owns permanent retirement; this scheduler
          # verifier removes only the dead Python drivers while measuring the
          # production scripts, then restores them before sealing its own patch.
          test -e scripts/ci/source_fix_pr1714_no_model_job_timeout.py
          test -e scripts/ci/source_fix_pr1715_no_model_job_timeout.py
          test -z "$(git ls-remote origin refs/heads/fix/autofix-job-timeout | cut -f1)"
          test -z "$(git ls-remote origin refs/heads/fix/noema-review-job-timeout-minutes | cut -f1)"
          rm scripts/ci/source_fix_pr1714_no_model_job_timeout.py
          rm scripts/ci/source_fix_pr1715_no_model_job_timeout.py

      - name: Verify focused and repository GREEN
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_scheduler_central_run_read_authority.py \
            tests/test_pr1669_cancel_stale_opencode_runs.py \
            tests/test_pr_review_merge_scheduler.py
          PYTHONPATH=. python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate -c pyproject.toml scripts/ci
          python -m compileall -q scripts tests
          git diff --check

      - name: Restore separately owned obsolete-driver cleanup before sealing
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- \
            scripts/ci/source_fix_pr1714_no_model_job_timeout.py \
            scripts/ci/source_fix_pr1715_no_model_job_timeout.py
          git diff --check

      - name: Verify successor working-tree scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/ci/temp_scheduler_central_run_read_authority.py
          test ! -e .github/workflows/_temp_scheduler_central_run_read_authority.yml
          allowed='^(CHANGELOG.md|scripts/ci/pr_review_merge_scheduler.py|scripts/ci/temp_scheduler_central_run_read_authority.py|.github/workflows/_temp_scheduler_central_run_read_authority.yml)$'
          bad="$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$bad"

      - name: Seal verified patch artifact
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary HEAD > successor.patch
          test -s successor.patch
          sha="$(sha256sum successor.patch | awk '{print $1}')"
          echo "patch_sha256=$sha" >>"$GITHUB_OUTPUT"

      - name: Upload sealed successor patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduler-central-read-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: successor.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout unchanged writer head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download sealed patch without executing repository code
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scheduler-central-read-authority-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Revalidate immutable authorities and apply sealed patch
        env:
          EXPECTED_MAIN_SHA: ${{ needs.verify.outputs.main_sha }}
          EXPECTED_PATCH_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/scheduler-central-run-read-authority-20260902
          remote_head="$(git rev-parse origin/fix/scheduler-central-run-read-authority-20260902)"
          live_main="$(git rev-parse origin/main)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$live_main" = "$EXPECTED_MAIN_SHA"
          actual_sha="$(sha256sum successor.patch | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_PATCH_SHA256"
          git apply --index successor.patch
          test ! -e scripts/ci/temp_scheduler_central_run_read_authority.py
          test ! -e .github/workflows/_temp_scheduler_central_run_read_authority.yml
          git diff --cached --check
          allowed='^(CHANGELOG.md|scripts/ci/pr_review_merge_scheduler.py|scripts/ci/temp_scheduler_central_run_read_authority.py|.github/workflows/_temp_scheduler_central_run_read_authority.yml)$'
          bad="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          test -z "$bad"
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git commit -m "fix(scheduler): use central authority for central run reads"

      - name: Publish verified fast-forward successor with available mutation credential
        env:
          PRIMARY_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          FALLBACK_PUSH_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
          BUILTIN_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_push_token="${PRIMARY_PUSH_TOKEN:-${FALLBACK_PUSH_TOKEN:-${BUILTIN_PUSH_TOKEN:-}}}"
          if [ -z "$workflow_push_token" ]; then
            echo "::error::No mutation credential is configured."
            exit 1
          fi
          git fetch origin fix/scheduler-central-run-read-authority-20260902
          remote_head="$(git rev-parse origin/fix/scheduler-central-run-read-authority-20260902)"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git remote set-url origin "https://x-access-token:${workflow_push_token}@github.com/ContextualWisdomLab/.github.git"
          git push origin HEAD:fix/scheduler-central-run-read-authority-20260902
