name: TEMP PR1672 remove caller fixed model timeout

on:
  push:
    branches: [fix/noema-repair-attempt-telemetry]

permissions:
  contents: write

concurrency:
  group: temp-pr1672-remove-fixed-model-timeout
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/noema-repair-attempt-telemetry
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Revalidate writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/noema-repair-attempt-telemetry
          live_head="$(git rev-parse origin/fix/noema-repair-attempt-telemetry)"
          test "$live_head" = "$EXPECTED_HEAD" || {
            echo "::notice::Writer branch advanced to $live_head; predecessor repair is obsolete."
            exit 0
          }

      - name: Install exact hash-verified test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Apply ADR-0003 timeout-owner repair
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          gate_path = Path("scripts/ci/noema_review_gate.py")
          gate = gate_path.read_text(encoding="utf-8")

          constant_pattern = re.compile(
              r"# NOT DATA-DERIVED -- UNRESOLVED, flagged for an explicit owner decision\.\n"
              r".*?NOEMA_REPAIR_DEADLINE_SECONDS = 15 \* 60\n\n",
              re.S,
          )
          gate, count = constant_pattern.subn(
              "# ADR-0003 assigns model-call timeout and provider failover to contextual-orchestrator.\n"
              "# Noema bounds repair by cardinality (one corrective request), never elapsed wall time.\n\n",
              gate,
              count=1,
          )
          if count != 1:
              raise SystemExit("fixed repair deadline constant block shape drifted")

          class_block = '''class NoemaRepairDeadlineExceeded(TimeoutError):\n    """Raised when the corrective attempt exceeds its total wall-clock budget."""\n\n\n'''
          if gate.count(class_block) != 1:
              raise SystemExit("deadline exception class shape drifted")
          gate = gate.replace(class_block, "", 1)

          helper_pattern = re.compile(
              r"@contextlib\.contextmanager\n"
              r"def _repair_wall_clock_deadline\(seconds: float\):\n"
              r".*?\n\nclass StaleHeadDuringRepairRetryError",
              re.S,
          )
          gate, count = helper_pattern.subn("class StaleHeadDuringRepairRetryError", gate, count=1)
          if count != 1:
              raise SystemExit("repair deadline helper shape drifted")

          deadline_block = '''        deadline_context = (\n            _repair_wall_clock_deadline(NOEMA_REPAIR_DEADLINE_SECONDS)\n            if is_retry\n            else contextlib.nullcontext()\n        )\n        with deadline_context:\n'''
          replacement_block = '''        # Retry cardinality remains bounded to one corrective request. ADR-0003\n        # forbids a repository-authored fixed inference wall-clock deadline;\n        # contextual-orchestrator owns provider timeout/failover policy.\n        with contextlib.nullcontext():\n'''
          if gate.count(deadline_block) != 1:
              raise SystemExit("repair deadline call-site shape drifted")
          gate = gate.replace(deadline_block, replacement_block, 1)

          classifier_pattern = re.compile(
              r"def _classify_attempt_outcome\(exc: BaseException\) -> str:\n"
              r"    \"\"\"Return a short, stable outcome class name for attempt telemetry\.\n\n"
              r".*?    if isinstance\(exc, NoemaRepairDeadlineExceeded\):\n"
              r"        return \"deadline_exceeded\"\n"
              r"    if isinstance\(exc, NoemaModelOutputError\):",
              re.S,
          )
          gate, count = classifier_pattern.subn(
              'def _classify_attempt_outcome(exc: BaseException) -> str:\n'
              '    """Return a short, stable outcome class name for attempt telemetry."""\n'
              '    if isinstance(exc, NoemaModelOutputError):',
              gate,
              count=1,
          )
          if count != 1:
              raise SystemExit("attempt classifier deadline branch shape drifted")

          gate = gate.replace("import signal\n", "", 1)
          gate_path.write_text(gate, encoding="utf-8")

          failure_path = Path("tests/test_noema_model_output_failure_classification.py")
          failure = failure_path.read_text(encoding="utf-8")
          for function_name in (
              "test_total_repair_wall_clock_deadline_interrupts_slow_read",
              "test_repair_wall_clock_deadline_defensive_fail_closed_paths",
              "test_repair_wall_clock_deadline_refuses_existing_process_alarm",
              "test_repair_wall_clock_deadline_rejects_non_main_thread_signal_context",
          ):
              pattern = re.compile(
                  rf"\ndef {re.escape(function_name)}\([^\n]*\) -> None:\n.*?(?=\n\ndef |\Z)",
                  re.S,
              )
              failure, removed = pattern.subn("", failure, count=1)
              if removed != 1:
                  raise SystemExit(f"legacy deadline regression missing: {function_name}")
          failure_path.write_text(failure, encoding="utf-8")

          telemetry_path = Path("tests/test_noema_repair_attempt_telemetry.py")
          telemetry = telemetry_path.read_text(encoding="utf-8")
          telemetry = telemetry.replace("import signal\n", "", 1)
          telemetry = telemetry.replace("import time\n", "", 1)
          classifier_test = re.compile(
              r"\n@pytest\.mark\.parametrize\(\n"
              r"    \(\"exc\", \"expected\"\),\n"
              r"    \[\n"
              r"        \(gate\.NoemaRepairDeadlineExceeded.*?"
              r"(?=\n\ndef test_classify_attempt_outcome_detects_transport_family)",
              re.S,
          )
          telemetry, removed = classifier_test.subn("", telemetry, count=1)
          if removed != 1:
              raise SystemExit("deadline classifier regression shape drifted")
          deadline_test = re.compile(
              r"\ndef test_repair_deadline_exceeded_emits_full_attempt_breakdown\([^\n]*\):\n"
              r".*?(?=\n\ndef |\Z)",
              re.S,
          )
          telemetry, removed = deadline_test.subn("", telemetry, count=1)
          if removed != 1:
              raise SystemExit("deadline telemetry regression shape drifted")
          telemetry_path.write_text(telemetry, encoding="utf-8")

          alarm_path = Path("tests/test_noema_repair_deadline_alarm_safety.py")
          if alarm_path.exists():
              alarm_path.unlink()

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          note = "- Noema repair inference no longer applies a repository-authored 900-second wall-clock cap; retry stays cardinality-bounded while contextual-orchestrator owns model timeout and failover under ADR-0003.\n"
          if note not in changelog:
              lines = changelog.splitlines(keepends=True)
              lines.insert(1 if lines else 0, note)
              changelog_path.write_text("".join(lines), encoding="utf-8")

          doctoring_path = Path("docs/doctoring/noema-repair-attempt-telemetry.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          section = """\n## 2026-09-02 causal-owner correction\n\nThe caller-authored 900-second repair wall-clock cap is removed. Repair remains bounded to one corrective inference request; contextual-orchestrator owns provider timeout/failover under ADR-0003. Telemetry is observational evidence and does not authorize a replacement heuristic deadline.\n"""
          if "## 2026-09-02 causal-owner correction" not in doctoring:
              doctoring_path.write_text(doctoring.rstrip() + section + "\n", encoding="utf-8")

          baseline_path = Path("docs/product-technical-gap-baseline.md")
          if baseline_path.exists():
              baseline = baseline_path.read_text(encoding="utf-8")
              marker = "NOEMA-FIXED-MODEL-TIMEOUT-2026-09-02"
              if marker not in baseline:
                  baseline += (
                      "\n\n### NOEMA-FIXED-MODEL-TIMEOUT-2026-09-02\n"
                      "- Owner: `ContextualWisdomLab/.github` / PR #1672.\n"
                      "- Root cause: caller-owned 900-second repair deadline contradicted ADR-0003 and could terminate `orchestrator/free` reasoning by elapsed time.\n"
                      "- Action: remove the wall-clock cap and signal machinery, preserve exactly one corrective request, retain attempt telemetry, and verify with an executable no-fixed-timeout contract.\n"
                      "- Status: repaired on the PR writer branch; exact-head CI must be regenerated after publication.\n"
                  )
                  baseline_path.write_text(baseline, encoding="utf-8")
          PY

      - name: Verify owner contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest \
            tests/test_noema_model_output_failure_classification.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_noema_repair_has_no_fixed_wall_clock_deadline.py -q
          PYTHONPATH=. python3 -m pytest tests -q
          python3 -m compileall -q scripts tests
          git diff --check
          ! grep -R "NOEMA_REPAIR_DEADLINE_SECONDS\|_repair_wall_clock_deadline(\|NoemaRepairDeadlineExceeded\|signal.setitimer" -n scripts/ci/noema_review_gate.py tests/test_noema_repair_has_no_fixed_wall_clock_deadline.py

      - name: Publish exact repair and self-retire
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/noema-repair-attempt-telemetry
          live_head="$(git rev-parse origin/fix/noema-repair-attempt-telemetry)"
          test "$live_head" = "$EXPECTED_HEAD" || {
            echo "::notice::Writer branch advanced to $live_head; refusing stale publication."
            exit 0
          }
          git rm -- .github/workflows/repair-pr1672-remove-fixed-timeout.yml
          git rm --ignore-unmatch tests/test_noema_repair_deadline_alarm_safety.py
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git add scripts/ci/noema_review_gate.py tests/test_noema_model_output_failure_classification.py tests/test_noema_repair_attempt_telemetry.py tests/test_noema_repair_has_no_fixed_wall_clock_deadline.py CHANGELOG.md docs/doctoring/noema-repair-attempt-telemetry.md docs/product-technical-gap-baseline.md
          git diff --cached --check
          git commit -m "fix(noema): remove caller fixed repair timeout"
          git push origin HEAD:fix/noema-repair-attempt-telemetry
