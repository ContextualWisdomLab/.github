name: Apply Strix contextual-orchestrator follow-up v2

on:
  push:
    branches:
      - feat/strix-orchestrator-free-zdr

permissions:
  contents: write

concurrency:
  group: apply-strix-orchestrator-free-zdr-v2
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci(strix): retry gateway patch after duplicate anchor' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-file-monitoring: true

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/strix-orchestrator-free-zdr
          fetch-depth: 0
          persist-credentials: true

      - name: Repair duplicate anchor and execute RED-GREEN patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/ci/apply_strix_orchestrator_followup.py')
          text = path.read_text(encoding='utf-8')

          function_pattern = re.compile(
              r"def replace_once\(path: Path, old: str, new: str\) -> None:\n"
              r".*?"
              r"(?=\n\ndef regex_once)",
              re.DOTALL,
          )
          replacement = '''def replace_once(path: Path, old: str, new: str) -> None:
              """Replace one tracked fragment, with one explicit two-site exception."""

              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if count == 2 and "STRIX_LLM must select NVIDIA NIM Nemotron" in old:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  return
              raise SystemExit(
                  f"{path.relative_to(ROOT)}: expected one replacement anchor, found {count}: {old[:120]!r}"
              )'''
          text, count = function_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'could not replace replace_once implementation: matches={count}')

          cleanup_anchor = '    BOOTSTRAP_SCRIPT.unlink()\n'
          cleanup_replacement = '''    BOOTSTRAP_SCRIPT.unlink()
              followup_v2 = ROOT / ".github/workflows/apply-strix-orchestrator-followup-v2.yml"
              if followup_v2.exists():
                  followup_v2.unlink()
          '''
          if cleanup_anchor not in text:
              raise SystemExit('could not locate bootstrap cleanup anchor')
          text = text.replace(cleanup_anchor, cleanup_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile scripts/ci/apply_strix_orchestrator_followup.py
          python3 scripts/ci/apply_strix_orchestrator_followup.py
