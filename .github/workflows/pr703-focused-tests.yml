name: PR 703 Focused Resolver Tests

on:
  push:
    branches: [fix/npm-workspace-coverage-root]
    paths:
      - scripts/ci/npm_workspace_install_root.py
      - tests/test_npm_workspace_install_root.py
      - tests/test_npm_workspace_install_root_hardening.py
      - .github/workflows/pr703-focused-tests.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/ci/npm_workspace_install_root.py
      - tests/test_npm_workspace_install_root.py
      - tests/test_npm_workspace_install_root_hardening.py
      - .github/workflows/pr703-focused-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr703-focused-resolver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolver-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install hash-pinned review test tools
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --require-hashes
          --only-binary=:all:
          -r requirements-opencode-review-ci-hashes.txt

      - name: Run resolver behavior tests
        run: >-
          python3 -m pytest -q
          tests/test_npm_workspace_install_root.py
          tests/test_npm_workspace_install_root_hardening.py

      - name: Enforce resolver line coverage
        run: |
          python3 -m coverage erase
          python3 -m coverage run --source=scripts.ci.npm_workspace_install_root -m pytest -q \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py
          python3 -m coverage report --fail-under=100 --show-missing

      - name: Enforce resolver docstring coverage
        run: >-
          python3 -m interrogate
          --fail-under=100
          scripts/ci/npm_workspace_install_root.py
