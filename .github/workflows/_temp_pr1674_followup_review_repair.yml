name: PR 1674 Exact-Head Follow-up Repair

on:
  push:
    branches:
      - fix/noema-closed-not-stale

permissions:
  contents: write

concurrency:
  group: pr1674-exact-head-followup-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: fix/noema-closed-not-stale
          persist-credentials: true

      - name: Revalidate remote writer ownership
        id: ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/noema-closed-not-stale
          remote_head="$(git rev-parse origin/fix/noema-closed-not-stale)"
          local_head="$(git rev-parse HEAD)"
          if [ "$remote_head" != "$local_head" ]; then
            echo "owned=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Writer branch advanced; obsolete repair run will not mutate it."
            exit 0
          fi
          echo "owned=true" >>"$GITHUB_OUTPUT"

      - name: Materialize reviewed source and regression repairs
        if: steps.ownership.outputs.owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/pr1674_exact_head_followup_repair.py
          python3 -m py_compile scripts/ci/pr1674_exact_head_followup_repair.py tests/test_strix_repository_dispatch_live_state.py tests/test_noema_private_target_live_admission.py
          grep -Fq "needs.strix.outputs.should_scan != 'false'" .github/workflows/strix.yml
          grep -Fq "noema_github_app_publication_token.outputs.token" .github/workflows/noema-review.yml
          grep -Fq "noema_oidc_publication_token.outputs.token" .github/workflows/noema-review.yml
          if sed -n '/Revalidate live Noema target before publication/,/Publish prepared Noema verdict/p' .github/workflows/noema-review.yml | grep -Fq 'github.token'; then
            echo "::error::Central token remains at the private-sibling publication boundary."
            exit 1
          fi
          git diff --check

      - name: Remove one-shot repair machinery
        if: steps.ownership.outputs.owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/ci/pr1674_exact_head_followup_repair.py .github/workflows/_temp_pr1674_followup_review_repair.yml
          git diff --check

      - name: Publish only onto the unchanged writer head
        if: steps.ownership.outputs.owned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/noema-closed-not-stale
          remote_head="$(git rev-parse origin/fix/noema-closed-not-stale)"
          local_head="$(git rev-parse HEAD)"
          if [ "$remote_head" != "$local_head" ]; then
            echo "::error::Writer branch advanced during verification; refusing stale publication."
            exit 1
          fi
          changed="$(git status --short)"
          test -n "$changed"
          git config user.name "ContextualWisdomLab repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/noema-review.yml .github/workflows/strix.yml tests/test_strix_repository_dispatch_live_state.py
          git add -u scripts/ci/pr1674_exact_head_followup_repair.py .github/workflows/_temp_pr1674_followup_review_repair.yml
          git commit -m "fix(review): close exact-head publication and status races"
          git push origin HEAD:fix/noema-closed-not-stale
