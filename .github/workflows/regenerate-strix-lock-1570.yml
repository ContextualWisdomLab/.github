name: Regenerate Strix lock 1570

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/regenerate-strix-lock-1570.yml"
      - "requirements-strix-ci.txt"
      - "requirements-strix-ci-overrides.txt"
      - "requirements-strix-ci-hashes.txt"

permissions:
  contents: read

concurrency:
  group: regenerate-strix-lock-1570-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.event.pull_request.number == 1570 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/graphql-core-3.2.12-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_ARCHIVE_URL: https://github.com/astral-sh/uv/releases/download/0.12.1/uv-x86_64-unknown-linux-gnu.tar.gz
      UV_ARCHIVE_SHA256: 90b2f223fb69d19db49e117da601f64978593417988530aa733d456141b4bcbb
      EXPECTED_UV_VERSION: uv 0.12.1 (x86_64-unknown-linux-gnu)
      COMPILE_COMMAND: uv pip compile --generate-hashes --python-version 3.13 --python-platform x86_64-manylinux_2_28 --override requirements-strix-ci-overrides.txt --output-file requirements-strix-ci-hashes.txt requirements-strix-ci.txt
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the repository-pinned uv toolchain
        id: uv
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/uv-0.12.1.tar.gz"
          install_dir="$RUNNER_TEMP/uv-0.12.1"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$UV_ARCHIVE_URL" -o "$archive"
          printf '%s  %s\n' "$UV_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          uv_bin="$install_dir/uv"
          test -x "$uv_bin"
          actual_version="$($uv_bin --version)"
          test "$actual_version" = "$EXPECTED_UV_VERSION"
          printf 'bin=%s\nversion=%s\n' "$uv_bin" "$actual_version" >>"$GITHUB_OUTPUT"

      - name: Regenerate the Strix hash lock from declared inputs
        id: compile
        shell: bash
        env:
          UV_BIN: ${{ steps.uv.outputs.bin }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/requirements-strix-ci-hashes.before.txt"
          cp requirements-strix-ci-hashes.txt "$before"
          "$UV_BIN" pip compile \
            --generate-hashes \
            --python-version 3.13 \
            --python-platform x86_64-manylinux_2_28 \
            --override requirements-strix-ci-overrides.txt \
            --output-file requirements-strix-ci-hashes.txt \
            requirements-strix-ci.txt
          output_sha="$(sha256sum requirements-strix-ci-hashes.txt | awk '{print $1}')"
          input_sha="$(cat requirements-strix-ci.txt requirements-strix-ci-overrides.txt | sha256sum | awk '{print $1}')"
          if cmp -s "$before" requirements-strix-ci-hashes.txt; then
            byte_identical=true
          else
            byte_identical=false
          fi
          git diff --no-ext-diff -- requirements-strix-ci-hashes.txt >"$RUNNER_TEMP/requirements-strix-ci-hashes.diff"
          cp requirements-strix-ci-hashes.txt "$RUNNER_TEMP/requirements-strix-ci-hashes.regenerated.txt"
          cat >"$RUNNER_TEMP/lock-regeneration-provenance.json" <<JSON
          {
            "schema": 1,
            "repository": "$GITHUB_REPOSITORY",
            "pull_request": 1570,
            "base_sha": "$BASE_SHA",
            "head_sha": "$HEAD_SHA",
            "uv_version": "${{ steps.uv.outputs.version }}",
            "command": "$COMPILE_COMMAND",
            "combined_input_sha256": "$input_sha",
            "output_sha256": "$output_sha",
            "byte_identical_to_preexisting_pr_lock": $byte_identical
          }
          JSON
          printf 'byte_identical=%s\noutput_sha=%s\n' "$byte_identical" "$output_sha" >>"$GITHUB_OUTPUT"

      - name: Validate the regenerated dependency delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lock = Path('requirements-strix-ci-hashes.txt').read_text(encoding='utf-8')
          assert 'graphql-core==3.2.12 \\\n' in lock
          assert 'graphql-core==3.2.11 \\\n' not in lock
          PY
          diff="$RUNNER_TEMP/base-lock.diff"
          git diff --no-ext-diff "$BASE_SHA" -- requirements-strix-ci-hashes.txt >"$diff"
          grep -F 'graphql-core==3.2.11' "$diff"
          grep -F 'graphql-core==3.2.12' "$diff"

      - name: Preserve exact regeneration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strix-lock-regeneration-1570-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/requirements-strix-ci-hashes.regenerated.txt
            ${{ runner.temp }}/requirements-strix-ci-hashes.diff
            ${{ runner.temp }}/lock-regeneration-provenance.json
            ${{ runner.temp }}/base-lock.diff
          if-no-files-found: error
          retention-days: 7

      - name: Require a reproducible byte-identical regeneration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.compile.outputs.byte_identical }}" = true
