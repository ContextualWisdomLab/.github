name: Materialize rerun-safe coverage artifact handoff

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: materialize-opencode-attempt-scoped-coverage-artifact
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  materialize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.number == 812 &&
      github.event.pull_request.head.ref == 'fix/opencode-attempt-scoped-coverage-artifact'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove the attempt-scoped contract is red
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          python -m pytest -q tests/test_opencode_coverage_artifact_rerun_contract.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Attempt-scoped artifact contract passed before production repair."
            exit 1
          fi
          test "$status" -eq 1

      - name: Apply reviewed workflow and doctoring repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/opencode-review-dispatch.yml')
          source = workflow_path.read_text(encoding='utf-8')

          old_header = '''  coverage-source-tree:
    name: coverage-source-tree
    needs: [validate-pr-metadata]
    if: >-
      needs.validate-pr-metadata.result == 'success'
      && github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
'''
          new_header = '''  coverage-source-tree:
    name: coverage-source-tree
    needs: [validate-pr-metadata]
    if: >-
      needs.validate-pr-metadata.result == 'success'
      && github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      coverage_source_artifact_id: ${{ steps.coverage_source_upload.outputs.artifact-id }}
    env:
'''
          if source.count(old_header) != 1:
              raise SystemExit('coverage-source-tree header anchor changed')
          source = source.replace(old_header, new_header, 1)

          old_upload = '''      - name: Upload materialized pull request merge tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-coverage-source
          path: ${{ runner.temp }}/opencode-coverage-source.tar
          if-no-files-found: error
          retention-days: 1
'''
          new_upload = '''      - name: Upload materialized pull request merge tree
        id: coverage_source_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-coverage-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opencode-coverage-source.tar
          if-no-files-found: error
          retention-days: 1
'''
          if source.count(old_upload) != 1:
              raise SystemExit('coverage artifact upload anchor changed')
          source = source.replace(old_upload, new_upload, 1)

          old_download = '''      - name: Download materialized pull request merge tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-coverage-source
          path: ${{ runner.temp }}/opencode-coverage-artifact
'''
          new_download = '''      - name: Download materialized pull request merge tree
        id: coverage_source_download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.coverage-source-tree.outputs.coverage_source_artifact_id }}
          path: ${{ runner.temp }}/opencode-coverage-artifact

      - name: Reject missing current-attempt coverage source evidence
        if: steps.coverage_source_download.outcome != 'success'
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          echo "::error::Coverage source evidence is unavailable for workflow attempt ${GITHUB_RUN_ATTEMPT}. A failed-jobs-only rerun cannot reuse an expired or prior-attempt artifact; start a full rerun or a fresh repository dispatch."
          exit 1
'''
          if source.count(old_download) != 1:
              raise SystemExit('coverage artifact download anchor changed')
          workflow_path.write_text(source.replace(old_download, new_download, 1), encoding='utf-8')

          doctoring = Path('docs/doctoring/opencode-coverage-artifact-reruns.md')
          doctoring.write_text(
              '''# OpenCode coverage artifact reruns

## Decision

The credentialed `coverage-source-tree` producer uploads one immutable source archive for each workflow attempt. The artifact name includes `github.run_attempt`, and the producer exports the exact upload `artifact-id`. The credential-free `coverage-evidence` consumer downloads only that ID.

A failed-jobs-only rerun does not rerun a producer that already succeeded. If its one-day source artifact has expired or the current attempt has no producer output, the consumer fails closed with guidance to start a full rerun or a fresh repository dispatch. It never falls back to a static name, an earlier attempt, or an expired artifact.

## Trust and retention boundary

The source producer retains target-repository read and OIDC authority needed to materialize the exact base/head merge tree. The untrusted-test consumer retains only `actions: read`; it receives no repository-content token, OIDC credential, model secret, or write permission. Source evidence remains limited to one-day retention.

## Incident recovery

1. Confirm the failure occurred before coverage tests at the immutable artifact download.
2. Do not rerun failed jobs only when the source producer must run again.
3. Start a full workflow rerun or send a fresh repository dispatch for the unchanged exact head.
4. Verify the new producer and consumer share the same run attempt and artifact ID.
5. Preserve prior failure evidence for audit; do not extend private-source retention as a workaround.

## Rollback

Rollback is safe only to another implementation that preserves immutable producer/consumer binding and credential separation. Restoring a static artifact name or cross-attempt fallback is prohibited.

## References

GitHub. (2026). *Re-running workflows and jobs*. GitHub Docs. https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs

GitHub. (2026). *Store and share data with workflow artifacts*. GitHub Docs. https://docs.github.com/en/actions/tutorials/store-and-share-data

GitHub. (2026). *REST API endpoints for GitHub Actions artifacts*. GitHub Docs. https://docs.github.com/en/rest/actions/artifacts
''',
              encoding='utf-8',
          )

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = (
              '- Bind OpenCode coverage source archives to the producing workflow attempt and immutable artifact ID, failing closed with full-rerun guidance when failed-jobs-only retries no longer have current evidence.\n'
          )
          if entry not in changelog:
              marker = '### Fixed\n\n'
              if marker not in changelog:
                  raise SystemExit('CHANGELOG Unreleased Fixed marker is absent')
              changelog = changelog.replace(marker, marker + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY
          rm -f \
            .github/workflows/materialize-opencode-attempt-scoped-coverage-artifact.yml \
            .github/opencode-attempt-scoped-coverage-artifact.trigger
          git diff --check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify focused and complete central contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q tests/test_opencode_coverage_artifact_rerun_contract.py
          python -m pytest -q tests
          python -m compileall -q tests/test_opencode_coverage_artifact_rerun_contract.py
          git diff --check

      - name: Build immutable workflow-free implementation commit
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr812-implementation.txt"
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = 'ContextualWisdomLab/.github'
          parent_sha = os.environ['EXPECTED_HEAD']
          token = os.environ['API_TOKEN']
          api_root = f'https://api.github.com/repos/{repository}'
          expected_paths = {
              '.github/workflows/opencode-review-dispatch.yml',
              '.github/workflows/materialize-opencode-attempt-scoped-coverage-artifact.yml',
              '.github/opencode-attempt-scoped-coverage-artifact.trigger',
              'CHANGELOG.md',
              'docs/doctoring/opencode-coverage-artifact-reruns.md',
          }

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cwl-pr812-materializer',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          raw = subprocess.check_output(['git', 'diff', '--name-status', '-z', 'HEAD'])
          parts = raw.decode('utf-8').split('\0')
          changes = []
          index = 0
          while index < len(parts) - 1:
              status = parts[index]
              path = parts[index + 1]
              index += 2
              changes.append((status, path))
          actual_paths = {path for _, path in changes}
          if actual_paths != expected_paths:
              raise SystemExit(
                  f'implementation path mismatch: missing={sorted(expected_paths - actual_paths)} '
                  f'extra={sorted(actual_paths - expected_paths)}'
              )

          parent = request('GET', f'/git/commits/{parent_sha}')
          tree_entries = []
          for status, path in changes:
              if status == 'D':
                  tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              encoded = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = request('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = request('POST', '/git/trees', {'base_tree': parent['tree']['sha'], 'tree': tree_entries})
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'fix(opencode): bind coverage artifacts to workflow attempts',
                  'tree': tree['sha'],
                  'parents': [parent_sha],
              },
          )
          print(f"PR812_IMPLEMENTATION_PARENT_SHA={parent_sha}")
          print(f"PR812_IMPLEMENTATION_COMMIT_SHA={commit['sha']}")
          PY

      - name: Publish implementation pointer
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          commit_sha="$(sed -n 's/^PR812_IMPLEMENTATION_COMMIT_SHA=//p' "${RUNNER_TEMP}/pr812-implementation.txt")"
          test "${#commit_sha}" -eq 40
          body="PR812_IMPLEMENTATION_PARENT_SHA=${EXPECTED_HEAD}%0APR812_IMPLEMENTATION_COMMIT_SHA=${commit_sha}"
          gh api --method POST repos/ContextualWisdomLab/.github/issues/812/comments -f "body=${body}"

      - name: Upload implementation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr812-attempt-scoped-coverage-artifact
          path: ${{ runner.temp }}/pr812-implementation.txt
          if-no-files-found: error
          retention-days: 5
