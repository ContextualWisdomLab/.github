name: Repair embedded Strix traversal materialization

on:
  push:
    branches:
      - fix/strix-legal-packrat-paths

permissions:
  contents: read

concurrency:
  group: repair-strix-embedded-traversal-v2
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/strix-legal-packrat-paths'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      EXPECTED_PARENT_SHA: 1449836fefb53846a0d793862e7aed41f551abee
      REPAIR_BRANCH: fix/strix-legal-packrat-paths
      FIRST_WORKFLOW: .github/workflows/repair-strix-embedded-traversal.yml
      REPAIR_WORKFLOW: .github/workflows/repair-strix-embedded-traversal-v2.yml
    steps:
      - name: Materialize exact repair branch without persisted credentials
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" diff --name-only HEAD^ HEAD)" = "$REPAIR_WORKFLOW"

      - name: Apply GREEN repair and publish verified product commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          gate_path = Path("scripts/ci/strix_quick_gate.sh")
          source = gate_path.read_text(encoding="utf-8")
          old = '''if "\\\\" in relative_path_str:
              raise SystemExit(1)
          normalized = posixpath.normpath(relative_path_str)'''
          new = '''if "\\\\" in relative_path_str:
              raise SystemExit(1)
          if any(component == ".." for component in relative_path_str.split("/")):
              raise SystemExit(1)
          normalized = posixpath.normpath(relative_path_str)'''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one changed-path normalization boundary")
          gate_path.write_text(source.replace(old, new), encoding="utf-8")
          PY

          cat > .github/workflows/strix-changed-path-quality-ci.yml <<'YAML'
          name: Strix Changed Path Quality CI

          on:
            pull_request:
              branches: [main]
              paths:
                - ".github/workflows/strix-changed-path-quality-ci.yml"
                - "CHANGELOG.md"
                - "docs/doctoring/strix-legal-git-paths.md"
                - "scripts/ci/strix_quick_gate.sh"
                - "tests/test_strix_changed_path_policy.py"

          permissions:
            contents: read

          concurrency:
            group: strix-changed-path-quality-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            exact-head-path-policy:
              if: github.event_name != 'pull_request' || github.event.action != 'closed'
              runs-on: ubuntu-24.04
              timeout-minutes: 10
              steps:
                - name: Checkout exact source revision
                  uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    persist-credentials: false

                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                  with:
                    python-version: "3.14"

                - name: Install exact test runner dependencies
                  env:
                    PIP_DISABLE_PIP_VERSION_CHECK: "1"
                    PIP_NO_INPUT: "1"
                  run: >-
                    python -m pip install --only-binary=:all:
                    coverage==7.15.2
                    iniconfig==2.1.0
                    packaging==26.2
                    pluggy==1.6.0
                    pygments==2.20.0
                    pytest==9.1.1

                - name: Verify exact-head path policy and syntax
                  shell: bash --noprofile --norc -e -o pipefail {0}
                  run: |
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
                    python -m coverage run -m pytest tests -q
                    python -m compileall -q tests/test_strix_changed_path_policy.py
                    bash -n scripts/ci/strix_quick_gate.sh
                    git diff --exit-code
          YAML

          python3 - <<'PY'
          from pathlib import Path

          documentation_path = Path("docs/doctoring/strix-legal-git-paths.md")
          source = documentation_path.read_text(encoding="utf-8")
          old = '''- empty, dot, absolute, traversal, leading/trailing-whitespace, NUL, CR, LF,
            and backslash forms are rejected;'''
          new = '''- empty, dot, absolute, leading/trailing-whitespace, NUL, CR, LF, and
            backslash forms are rejected;
          - raw `..` components are rejected before `posixpath.normpath()` can collapse
            an embedded traversal such as `safe/../target.txt`;'''
          if source.count(old) != 1:
              raise SystemExit("expected one documented path boundary")
          source = source.replace(old, new)
          old_evidence = '''Permanent tests also preserve established punctuation and reject traversal,
          absolute paths, controls, whitespace ambiguity, backslashes, and representative
          shell punctuation.'''
          new_evidence = '''A test-only exact-head commit first demonstrated that `safe/../target.txt`
          passed after normalization; the production repair now rejects its raw `..`
          component before normalization. Permanent tests preserve established punctuation
          and reject traversal, absolute paths, controls, whitespace ambiguity, backslashes,
          and representative shell punctuation. The dedicated workflow runs the complete
          repository test suite through coverage.py and pytest whenever code or either
          authoritative contract document changes.'''
          if source.count(old_evidence) != 1:
              raise SystemExit("expected one test-first evidence paragraph")
          source = source.replace(old_evidence, new_evidence)
          references = '''

          Batchelder, N., & contributors. (2026). *coverage.py 7.15.2* [Computer
          software]. Python Package Index. https://pypi.org/project/coverage/7.15.2/

          pytest development team. (2026). *pytest 9.1.1* [Computer software]. Python
          Package Index. https://pypi.org/project/pytest/9.1.1/
          '''
          documentation_path.write_text(source.rstrip() + references, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          source = changelog_path.read_text(encoding="utf-8")
          old = '''- Allowed commas and ASCII parentheses in the bounded Strix changed-file path policy so legal tracked Packrat fixtures can receive exact-head security analysis while traversal, controls, backslashes, whitespace ambiguity, and shell punctuation remain fail-closed.'''
          new = '''- Allowed commas and ASCII parentheses in the bounded Strix changed-file path policy so legal tracked Packrat fixtures can receive exact-head security analysis, while rejecting raw `..` components before normalization and keeping controls, backslashes, whitespace ambiguity, and shell punctuation fail-closed.'''
          if source.count(old) != 1:
              raise SystemExit("expected one Strix path changelog entry")
          changelog_path.write_text(source.replace(old, new), encoding="utf-8")
          PY

          rm -- "$FIRST_WORKFLOW" "$REPAIR_WORKFLOW"

          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            coverage==7.15.2 iniconfig==2.1.0 packaging==26.2 pluggy==1.6.0 \
            pygments==2.20.0 pytest==9.1.1
          python3 -m coverage run -m pytest tests -q
          python3 -m compileall -q tests/test_strix_changed_path_policy.py
          bash -n scripts/ci/strix_quick_gate.sh
          git diff --check

          git config user.name "CWL Autonomous Development"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/strix-changed-path-quality-ci.yml CHANGELOG.md \
            docs/doctoring/strix-legal-git-paths.md scripts/ci/strix_quick_gate.sh \
            tests/test_strix_changed_path_policy.py "$FIRST_WORKFLOW" "$REPAIR_WORKFLOW"
          git diff --cached --check
          git commit -m "fix(strix): reject raw traversal components"

          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/$REPAIR_BRANCH"
