name: One-shot PR 1589 probe evidence repair v3

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-probe-evidence-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Apply reviewed GREEN, full-suite fixes, and self-retire
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

          # Reuse the already-reviewed v2 transformation deterministically, but suppress its
          # final full-suite/commit phase so this driver can close the full-suite regressions first.
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/source-fix-1589-probe-evidence-v2.yml").read_text(encoding="utf-8")
          marker = "        run: |\n"
          if workflow.count(marker) != 1:
              raise SystemExit("v2 repair run block changed unexpectedly")
          script = textwrap.dedent(workflow.split(marker, 1)[1])
          setup = '''set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

          '''
          if not script.startswith(setup):
              raise SystemExit("v2 repair setup changed unexpectedly")
          script = "set -euo pipefail\n" + script[len(setup):]
          full_suite = "PYTHONPATH=. python3 -m pytest -q tests\n"
          if script.count(full_suite) != 1:
              raise SystemExit("v2 full-suite marker changed unexpectedly")
          script = script.replace(full_suite, "echo 'full suite deferred to v3 after edge-contract repair'\n", 1)
          final_marker = "git rm .github/workflows/source-fix-1589-probe-evidence.yml .github/workflows/source-fix-1589-probe-evidence-v2.yml\n"
          if script.count(final_marker) != 1:
              raise SystemExit("v2 finalization marker changed unexpectedly")
          script = script.split(final_marker, 1)[0]
          Path("/tmp/apply-v2-green.sh").write_text(script, encoding="utf-8")
          PY
          bash /tmp/apply-v2-green.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_repository_branch_coverage_javascript_and_noema.py")
          text = path.read_text(encoding="utf-8")
          old = '''    monkeypatch.setattr(noema, "load_codegraph_context", lambda: "graph")
              monkeypatch.setattr(noema, "changed_file_context", lambda *_args: "files")
              context = noema.build_review_context("owner/repo", 1, pr)
              assert "CodeGraph context" in context
              assert "Prior review threads" in context
              assert "Changed file context" in context
          '''
          new = '''    monkeypatch.setattr(noema, "changed_file_context", lambda *_args: "files")
              context = noema.build_review_context("owner/repo", 1, pr)
              assert "CodeGraph context" not in context
              assert "Prior review threads" in context
              assert "Changed file context" in context
          '''
          if text.count(old) != 1:
              raise SystemExit("Noema all-sections coverage fixture changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("tests/test_repository_branch_coverage_reporting_edges.py")
          text = path.read_text(encoding="utf-8")
          old = '''    monkeypatch.setattr(noema, "load_codegraph_context", lambda: "")
              monkeypatch.setattr(noema, "review_thread_context", lambda _pr: "")
          '''
          new = '''    monkeypatch.setattr(noema, "review_thread_context", lambda _pr: "")
          '''
          if text.count(old) != 1:
              raise SystemExit("Noema empty-context coverage fixture changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path(".github/workflows/noema-observed-probe-quality-ci.yml")
          text = path.read_text(encoding="utf-8")
          old = "  workflow_dispatch:\n\n"
          if text.count(old) != 1:
              raise SystemExit("Noema quality manual-dispatch contract changed unexpectedly")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY

          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_observed_defect_probe_taxonomy.py \
            tests/test_noema_observed_probe_doctoring.py \
            tests/test_noema_review_gate.py \
            tests/test_repository_branch_coverage_javascript_and_noema.py \
            tests/test_repository_branch_coverage_reporting_edges.py \
            tests/test_required_workflow_queue_contract.py
          PYTHONPATH=. python3 -m pytest -q tests
          interrogate --fail-under=100 scripts/ci/noema_review_gate.py
          python3 -m compileall -q scripts/ci tests
          git diff --check

          git rm \
            .github/workflows/source-fix-1589-probe-evidence.yml \
            .github/workflows/source-fix-1589-probe-evidence-v2.yml \
            .github/workflows/source-fix-1589-probe-evidence-v3.yml
          git add \
            scripts/ci/noema_review_gate.py \
            tests/test_noema_observed_defect_probe_taxonomy.py \
            tests/test_noema_review_gate.py \
            tests/test_repository_branch_coverage_javascript_and_noema.py \
            tests/test_repository_branch_coverage_reporting_edges.py \
            .github/workflows/noema-observed-probe-quality-ci.yml \
            docs/doctoring/noema-observed-defect-probe-taxonomy.md \
            docs/product-technical-gap-baseline.md \
            CHANGELOG.md
          git diff --cached --check
          if git grep -n "NOEMA_CODEGRAPH_CONTEXT_PATH\|Review the PR diff plus the additional changed-file, review-thread, and CodeGraph context" -- scripts/ci/noema_review_gate.py tests; then
            echo "stale CodeGraph capability claim remains" >&2
            exit 1
          fi
          if grep -q "workflow_dispatch:" .github/workflows/noema-observed-probe-quality-ci.yml; then
            echo "branch-selected manual dispatch remains on Noema quality workflow" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(noema): bind probe classes to structured evidence"
          git push origin "HEAD:${TARGET_BRANCH}"