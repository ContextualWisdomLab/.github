name: Repair PR 794 Git isolation v3

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: repair-pr794-git-isolation-v3
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.number == 794 &&
      github.event.pull_request.head.ref == 'fix/opencode-llvm-coverage-current-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull-request head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore the three low-privilege Git isolation boundaries
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/opencode-review-dispatch.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          repaired = []
          insertions = 0
          for index, line in enumerate(lines):
              repaired.append(line)
              if not line.strip().startswith('UV_NO_BUILD=1'):
                  continue
              if index + 1 >= len(lines) or not lines[index + 1].strip().startswith('GIT_CONFIG_COUNT=1'):
                  continue
              indentation = line[: len(line) - len(line.lstrip())]
              slash = chr(92)
              repaired.append(f'{indentation}GIT_CONFIG_NOSYSTEM=1 {slash}\n')
              repaired.append(f'{indentation}GIT_CONFIG_GLOBAL=/dev/null {slash}\n')
              insertions += 1
          if insertions != 3:
              raise SystemExit(f'expected exactly three repair anchors, found {insertions}')
          path.write_text(''.join(repaired), encoding='utf-8')

          doctoring_path = Path('docs/doctoring/opencode-llvm-coverage-toolchain.md')
          doctoring = doctoring_path.read_text(encoding='utf-8')
          boundary = '- Every low-privilege coverage wrapper disables ambient system and global Git configuration before applying the single bounded `/work` safe-directory overlay.\n'
          if boundary not in doctoring:
              anchor = '- Missing executables fail the image build before any pull-request coverage measurement starts.\n'
              if doctoring.count(anchor) != 1:
                  raise SystemExit('doctoring security anchor is not unique')
              doctoring = doctoring.replace(anchor, anchor + boundary, 1)
          regression = '6. all three low-privilege wrapper processes isolate system and global Git configuration before the safe-directory overlay.\n'
          if regression not in doctoring:
              anchor = '5. the OpenCode approval path remains fail-closed when Rust coverage cannot run.\n'
              if doctoring.count(anchor) != 1:
                  raise SystemExit('doctoring regression anchor is not unique')
              doctoring = doctoring.replace(
                  anchor,
                  '5. the OpenCode approval path remains fail-closed when Rust coverage cannot run; and\n' + regression,
                  1,
              )
          doctoring_path.write_text(doctoring, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          old = "- Restored the default-branch OpenCode Rust coverage image's Debian LLVM 19 tools, explicit `LLVM_COV` and `LLVM_PROFDATA` bindings, pre-install executable validation, and a permanent ordering regression contract after DiskSage exact-head coverage exposed the missing system-toolchain boundary.\n"
          new = "- Restored the default-branch OpenCode Rust coverage image's Debian LLVM 19 tools, explicit `LLVM_COV` and `LLVM_PROFDATA` bindings, pre-install executable validation, and permanent ordering and low-privilege Git-configuration-isolation regressions after DiskSage exact-head coverage exposed the missing system-toolchain boundary.\n"
          if new not in changelog:
              if changelog.count(old) != 1:
                  raise SystemExit('changelog anchor is not unique')
              changelog = changelog.replace(old, new, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY
          git diff --check

      - name: Execute focused LLVM and Git-isolation contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          test_path = Path('tests/test_opencode_llvm_coverage_current_main.py')
          spec = importlib.util.spec_from_file_location('pr794_contract', test_path)
          if spec is None or spec.loader is None:
              raise SystemExit('unable to load focused contract module')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.test_opencode_coverage_image_provisions_compatible_llvm_tools_before_cargo_llvm_cov()
          module.test_low_privilege_coverage_wrappers_isolate_ambient_git_configuration()

          workflow = Path('.github/workflows/opencode-review-dispatch.yml').read_text(encoding='utf-8')
          assert workflow.count('GIT_CONFIG_NOSYSTEM=1') == 4
          assert workflow.count('GIT_CONFIG_GLOBAL=/dev/null') == 4
          assert workflow.count('GIT_CONFIG_COUNT=1') == 3
          assert workflow.count('ENV LLVM_COV=/usr/bin/llvm-cov-19') == 1
          assert workflow.count('ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19') == 1
          PY
          python3 -m compileall -q tests/test_opencode_llvm_coverage_current_main.py
          git diff --check

      - name: Commit the exact-parent repair and delete this one-shot workflow
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: fix/opencode-llvm-coverage-current-main
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = 'ContextualWisdomLab/.github'
          expected_head = os.environ['EXPECTED_HEAD']
          source_branch = os.environ['SOURCE_BRANCH']
          token = os.environ['API_TOKEN']
          api_root = f'https://api.github.com/repos/{repository}'

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cwl-pr794-exact-head-repair',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          parent = request('GET', f'/git/commits/{expected_head}')
          entries = []
          for path in (
              '.github/workflows/opencode-review-dispatch.yml',
              'docs/doctoring/opencode-llvm-coverage-toolchain.md',
              'CHANGELOG.md',
          ):
              encoded = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = request('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({
              'path': '.github/workflows/repair-pr794-git-isolation-v3.yml',
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          })
          tree = request('POST', '/git/trees', {
              'base_tree': parent['tree']['sha'],
              'tree': entries,
          })
          commit = request('POST', '/git/commits', {
              'message': 'fix(coverage): isolate low-privilege Git configuration',
              'tree': tree['sha'],
              'parents': [expected_head],
          })

          encoded_branch = urllib.parse.quote(source_branch, safe='/')
          live_ref = request('GET', f'/git/ref/heads/{encoded_branch}')
          live_sha = live_ref.get('object', {}).get('sha')
          if live_sha != expected_head:
              raise SystemExit(
                  f'stale exact-head repair refused: expected {expected_head}, found {live_sha}'
              )
          updated_ref = request(
              'PATCH',
              f'/git/refs/heads/{encoded_branch}',
              {'sha': commit['sha'], 'force': False},
          )
          if updated_ref.get('object', {}).get('sha') != commit['sha']:
              raise SystemExit('branch ref update did not bind to the candidate commit')
          print(f"UPDATED_HEAD_SHA={commit['sha']}")
          print(f"UPDATED_PARENT_SHA={expected_head}")
          PY
