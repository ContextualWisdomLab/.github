name: Temporary PR1588 Writer Permission Fix

on:
  push:
    branches:
      - fix/strix-control-plane-supersession-20260901
    paths:
      - .github/workflows/tmp-pr1588-writer-permission-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/strix-control-plane-supersession-20260901
          fetch-depth: 1
          persist-credentials: true
      - name: Use repository token for workflow-source write
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/repair-pr1588-exact-head.yml')
          text = path.read_text(encoding='utf-8')
          old = '          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}\n'
          new = '          GH_TOKEN: ${{ github.token }}\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale guarded-writer credential expression')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-pr1588-writer-permission-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(strix): use repository token for workflow-source repair'
          git push origin HEAD:fix/strix-control-plane-supersession-20260901
