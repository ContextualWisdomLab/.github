name: Repair PR 787 payload binding push

on:
  push:
    branches:
      - feat/review-agent-mention-router-main
    paths:
      - .github/workflows/repair-pr787-payload-binding-push.yml

permissions:
  contents: read

concurrency:
  group: repair-pr787-payload-binding-push
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/feat/review-agent-mention-router-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact push head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply reviewed payload-binding repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 scripts/ci/apply_pr787_payload_binding.py
          git diff --check

      - name: Install exact hash-locked quality tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes \
            -r requirements-opencode-review-ci-hashes.txt

      - name: Verify complete exact-head router quality
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/agent_mention_router.py
              scripts/ci/agent_mention_sweep.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
          python3 -m coverage erase
          python3 -m coverage run -m pytest -q \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py \
            tests/test_agent_mention_idempotency.py \
            tests/test_agent_mention_downstream_idempotency.py \
            tests/test_agent_mention_receipt_authority.py
          python3 -m coverage report --fail-under=100
          python3 -m interrogate --fail-under=100 \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py
          python3 -m compileall -q \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py \
            tests/test_agent_mention_idempotency.py \
            tests/test_agent_mention_downstream_idempotency.py \
            tests/test_agent_mention_receipt_authority.py
          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-noema-dispatch.yml)" -eq 1
          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-opencode-dispatch.yml)" -eq 1
          test "$(grep -c 'base_branch: request.pull_request_base_branch' scripts/ci/agent_mention_router.py)" -eq 2
          git diff --check

      - name: Publish verified exact-parent commit and remove transient files
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: feat/review-agent-mention-router-main
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = "ContextualWisdomLab/.github"
          expected_head = os.environ["EXPECTED_HEAD"]
          source_branch = os.environ["SOURCE_BRANCH"]
          token = os.environ["API_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "cwl-pr787-payload-binding-push",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(source_branch, safe="/")
          live_ref = request("GET", f"/git/ref/heads/{encoded_branch}")
          if live_ref.get("object", {}).get("sha") != expected_head:
              raise SystemExit("remote branch moved before publication")
          parent = request("GET", f"/git/commits/{expected_head}")
          entries = []
          for path in (
              "scripts/ci/agent_mention_router.py",
              ".github/workflows/agent-mention-noema-dispatch.yml",
              ".github/workflows/agent-mention-opencode-dispatch.yml",
              "tests/test_agent_mention_idempotency.py",
              "tests/test_agent_mention_downstream_idempotency.py",
              "docs/automation/review-agent-comment-invocation.md",
              "CHANGELOG.md",
          ):
              encoded = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              blob = request(
                  "POST",
                  "/git/blobs",
                  {"content": encoded, "encoding": "base64"},
              )
              entries.append(
                  {"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]}
              )
          for path in (
              ".github/workflows/repair-pr787-payload-bound-invocation.yml",
              ".github/workflows/repair-pr787-payload-binding-push.yml",
              "scripts/ci/apply_pr787_payload_binding.py",
          ):
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": parent["tree"]["sha"], "tree": entries},
          )
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "fix(automation): bind invocation keys to complete payloads",
                  "tree": tree["sha"],
                  "parents": [expected_head],
              },
          )
          updated = request(
              "PATCH",
              f"/git/refs/heads/{encoded_branch}",
              {"sha": commit["sha"], "force": False},
          )
          if updated.get("object", {}).get("sha") != commit["sha"]:
              raise SystemExit("verified branch update did not land")
          print(f"Published {commit['sha']} from exact parent {expected_head}")
          PY
