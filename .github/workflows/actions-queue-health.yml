name: GitHub Actions queue health

on:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: github-actions-queue-health
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Collect exact-head queue evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout trusted queue-health source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Scope observer token to the reviewed repositories
        id: repository_scope
        run: |
          repositories=$(jq -er '.repositories | map(split("/")[1]) | join(",") | select(length > 0)' config/actions_queue_health_repositories.json)
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

      - name: Mint read-only observer token
        id: observer_token
        if: vars.NOEMA_GITHUB_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NOEMA_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.NOEMA_GITHUB_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ steps.repository_scope.outputs.repositories }}
          permission-actions: read
          permission-pull-requests: read

      - name: Collect read-only repository and runner evidence
        env:
          GH_TOKEN: ${{ steps.observer_token.outputs.token || secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PR_REVIEW_MERGE_TOKEN or OPENCODE_APPROVE_TOKEN is required for cross-repository queue reads."
            python3 scripts/ci/actions_queue_health.py \
              --allowlist config/actions_queue_health_repositories.json \
              --credential-unavailable \
              --output-json "$RUNNER_TEMP/actions-queue-health.json" \
              --output-html "$RUNNER_TEMP/actions-queue-health.html"
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"
          python3 scripts/ci/actions_queue_health.py \
            --allowlist config/actions_queue_health_repositories.json \
            --output-json "$RUNNER_TEMP/actions-queue-health.json" \
            --output-html "$RUNNER_TEMP/actions-queue-health.html"

      - name: Upload queue-health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-actions-queue-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/actions-queue-health.json
            ${{ runner.temp }}/actions-queue-health.html
          if-no-files-found: error
