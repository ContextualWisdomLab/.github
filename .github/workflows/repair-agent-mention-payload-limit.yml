name: One-shot agent mention payload-limit repair

on:
  push:
    branches:
      - fix/required-review-fail-closed-without-verdict

permissions:
  contents: read

concurrency:
  group: one-shot-agent-mention-payload-limit-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair agent mention payload contract
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/required-review-fail-closed-without-verdict
          fetch-depth: 0

      - name: Install test tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'pytest>=8.0.0' \
            'pytest-cov>=7.1.0' \
            'coverage[toml]>=7.8.0' \
            'interrogate>=1.7.0'

      - name: Add failing wire-contract and allowlist tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          router_tests = Path("tests/test_agent_mention_router.py")
          router_text = router_tests.read_text(encoding="utf-8")
          old_router_assertions = '''    assert opencode["client_payload"]["merge_mode"] == "disabled"
              assert opencode["client_payload"]["enable_auto_merge"] is False
              assert opencode["client_payload"]["update_branches"] is False
          '''
          new_router_assertions = '''    wire_payload = opencode["client_payload"]
              assert len(wire_payload) == 10
              assert wire_payload["review_policy"] == {
                  "trigger_reviews": True,
                  "review_dispatch_limit": "1",
                  "enable_auto_merge": False,
                  "update_branches": False,
                  "merge_mode": "disabled",
              }
              for forbidden_flat_field in (
                  "trigger_reviews",
                  "review_dispatch_limit",
                  "enable_auto_merge",
                  "update_branches",
                  "merge_mode",
              ):
                  assert forbidden_flat_field not in wire_payload
          '''
          if old_router_assertions not in router_text:
              raise SystemExit("router payload assertion marker changed")
          router_tests.write_text(
              router_text.replace(old_router_assertions, new_router_assertions, 1),
              encoding="utf-8",
          )

          binding_tests = Path("tests/test_agent_mention_complete_payload_binding.py")
          binding_text = binding_tests.read_text(encoding="utf-8")
          marker = "\ndef test_wrappers_recompute_complete_claim_before_ledger_access() -> None:\n"
          new_tests = '''
          def test_opencode_wire_payload_and_forwarding_respect_github_limit() -> None:
              """Both repository_dispatch hops use at most ten top-level properties."""

              router = _load_router()
              request = router.parse_event(_event())
              assert request is not None
              payload = router.opencode_payload(request)["client_payload"]
              assert len(payload) == 10
              assert payload["review_policy"] == {
                  "trigger_reviews": True,
                  "review_dispatch_limit": "1",
                  "enable_auto_merge": False,
                  "update_branches": False,
                  "merge_mode": "disabled",
              }

              wrapper = OPENCODE_WORKFLOW.read_text(encoding="utf-8")
              for field in (
                  "trigger_reviews",
                  "review_dispatch_limit",
                  "enable_auto_merge",
                  "update_branches",
                  "merge_mode",
              ):
                  assert f"github.event.client_payload.review_policy.{field}" in wrapper
              assert "review_policy: {" in wrapper
              assert "trigger_reviews: true" in wrapper
              assert "review_dispatch_limit: \"1\"" in wrapper
              assert "enable_auto_merge: false" in wrapper
              assert "update_branches: false" in wrapper
              assert "merge_mode: \"disabled\"" in wrapper

              scheduler = (
                  ROOT / ".github" / "workflows" / "pr-review-merge-scheduler.yml"
              ).read_text(encoding="utf-8")
              assert "github.event.client_payload.review_policy.trigger_reviews" in scheduler
              assert (
                  "github.event.client_payload.review_policy.review_dispatch_limit"
                  in scheduler
              )
              assert "github.event.client_payload.review_policy.enable_auto_merge" in scheduler
              assert "github.event.client_payload.review_policy.update_branches" in scheduler
              assert "github.event.client_payload.review_policy.merge_mode" in scheduler


          def test_lineageweave_is_in_source_controlled_dispatch_baseline() -> None:
              """The incident repository remains routable even if the UI variable drifts."""

              router_workflow = (
                  ROOT / ".github" / "workflows" / "agent-mention-router.yml"
              ).read_text(encoding="utf-8")
              scheduler_workflow = (
                  ROOT / ".github" / "workflows" / "pr-review-merge-scheduler.yml"
              ).read_text(encoding="utf-8")
              baseline = ",ContextualWisdomLab/LineageWeave"
              assert router_workflow.count(
                  "${{ vars.OPENCODE_REPOSITORY_DISPATCH_TARGETS }}" + baseline
              ) == 2
              assert (
                  "ALLOWED_TARGET_REPOSITORIES: "
                  "${{ vars.OPENCODE_REPOSITORY_DISPATCH_TARGETS }}" + baseline
              ) in scheduler_workflow


          '''
          if marker not in binding_text:
              raise SystemExit("binding test marker changed")
          binding_tests.write_text(
              binding_text.replace(marker, "\n" + new_tests + marker.lstrip("\n"), 1),
              encoding="utf-8",
          )
          PY

      - name: Prove the incident contracts are RED
        run: |
          set -euo pipefail
          set +e
          python -m pytest \
            tests/test_agent_mention_router.py::test_eligible_agents_and_payloads \
            tests/test_agent_mention_complete_payload_binding.py::test_opencode_wire_payload_and_forwarding_respect_github_limit \
            tests/test_agent_mention_complete_payload_binding.py::test_lineageweave_is_in_source_controlled_dispatch_baseline \
            >/tmp/agent-mention-red.log 2>&1
          status=$?
          set -e
          cat /tmp/agent-mention-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::The repository_dispatch overflow and allowlist regressions unexpectedly passed before implementation."
            exit 1
          fi

      - name: Compact review policy and restore LineageWeave routing
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          router_path = Path("scripts/ci/agent_mention_router.py")
          router = router_path.read_text(encoding="utf-8")
          old_payload = '''            "trigger_reviews": claim["trigger_reviews"],
                      "review_dispatch_limit": claim["review_dispatch_limit"],
                      "enable_auto_merge": claim["enable_auto_merge"],
                      "update_branches": claim["update_branches"],
                      "merge_mode": claim["merge_mode"],
          '''
          new_payload = '''            "review_policy": {
                          "trigger_reviews": claim["trigger_reviews"],
                          "review_dispatch_limit": claim["review_dispatch_limit"],
                          "enable_auto_merge": claim["enable_auto_merge"],
                          "update_branches": claim["update_branches"],
                          "merge_mode": claim["merge_mode"],
                      },
          '''
          if old_payload not in router:
              raise SystemExit("OpenCode wire payload marker changed")
          router_path.write_text(router.replace(old_payload, new_payload, 1), encoding="utf-8")

          wrapper_path = Path(".github/workflows/agent-mention-opencode-dispatch.yml")
          wrapper = wrapper_path.read_text(encoding="utf-8")
          env_replacements = {
              "github.event.client_payload.trigger_reviews": "github.event.client_payload.review_policy.trigger_reviews",
              "github.event.client_payload.review_dispatch_limit": "github.event.client_payload.review_policy.review_dispatch_limit",
              "github.event.client_payload.enable_auto_merge": "github.event.client_payload.review_policy.enable_auto_merge",
              "github.event.client_payload.update_branches": "github.event.client_payload.review_policy.update_branches",
              "github.event.client_payload.merge_mode": "github.event.client_payload.review_policy.merge_mode",
          }
          for old, new in env_replacements.items():
              if old not in wrapper:
                  raise SystemExit(f"wrapper payload marker changed: {old}")
              wrapper = wrapper.replace(old, new)
          old_forward = '''                trigger_reviews: true,
                          review_dispatch_limit: "1",
                          enable_auto_merge: false,
                          update_branches: false,
                          merge_mode: "disabled",
          '''
          new_forward = '''                review_policy: {
                              trigger_reviews: true,
                              review_dispatch_limit: "1",
                              enable_auto_merge: false,
                              update_branches: false,
                              merge_mode: "disabled"
                            },
          '''
          if old_forward not in wrapper:
              raise SystemExit("wrapper scheduler-forward marker changed")
          wrapper_path.write_text(wrapper.replace(old_forward, new_forward, 1), encoding="utf-8")

          scheduler_path = Path(".github/workflows/pr-review-merge-scheduler.yml")
          scheduler = scheduler_path.read_text(encoding="utf-8")
          scheduler_replacements = {
              "github.event.client_payload.trigger_reviews != false": "github.event.client_payload.review_policy.trigger_reviews != false && github.event.client_payload.trigger_reviews != false",
              "github.event.client_payload.review_dispatch_limit || inputs.review_dispatch_limit": "github.event.client_payload.review_policy.review_dispatch_limit || github.event.client_payload.review_dispatch_limit || inputs.review_dispatch_limit",
              "github.event.client_payload.enable_auto_merge != false": "github.event.client_payload.review_policy.enable_auto_merge != false && github.event.client_payload.enable_auto_merge != false",
              "github.event.client_payload.merge_mode || inputs.merge_mode": "github.event.client_payload.review_policy.merge_mode || github.event.client_payload.merge_mode || inputs.merge_mode",
              "github.event.client_payload.update_branches != false": "github.event.client_payload.review_policy.update_branches != false && github.event.client_payload.update_branches != false",
          }
          for old, new in scheduler_replacements.items():
              if old not in scheduler:
                  raise SystemExit(f"scheduler payload marker changed: {old}")
              scheduler = scheduler.replace(old, new, 1)
          old_allowlist = "ALLOWED_TARGET_REPOSITORIES: ${{ vars.OPENCODE_REPOSITORY_DISPATCH_TARGETS }}"
          new_allowlist = old_allowlist + ",ContextualWisdomLab/LineageWeave"
          if old_allowlist not in scheduler:
              raise SystemExit("scheduler allowlist marker changed")
          scheduler_path.write_text(
              scheduler.replace(old_allowlist, new_allowlist, 1),
              encoding="utf-8",
          )

          router_workflow_path = Path(".github/workflows/agent-mention-router.yml")
          router_workflow = router_workflow_path.read_text(encoding="utf-8")
          old_router_allowlist = (
              "OPENCODE_REPOSITORY_DISPATCH_TARGETS: "
              "${{ vars.OPENCODE_REPOSITORY_DISPATCH_TARGETS }}"
          )
          if router_workflow.count(old_router_allowlist) != 2:
              raise SystemExit("router allowlist markers changed")
          router_workflow_path.write_text(
              router_workflow.replace(
                  old_router_allowlist,
                  old_router_allowlist + ",ContextualWisdomLab/LineageWeave",
              ),
              encoding="utf-8",
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Fixed\n\n"
          entry = (
              "- OpenCode agent-mention dispatch now packs its fixed review-only controls "
              "under one `review_policy` object so both repository-dispatch hops stay within "
              "GitHub's ten-property `client_payload` limit, and LineageWeave is retained in "
              "the source-controlled exact repository allowlist baseline.\n"
          )
          if marker not in changelog:
              raise SystemExit("CHANGELOG Fixed marker changed")
          if entry not in changelog:
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          doctoring_path = Path("docs/doctoring/required-review-check-is-not-a-verdict.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          marker = "## Verification contract\n"
          section = '''## Agent-mention transport contract

          GitHub accepts at most ten top-level properties in a
          `repository_dispatch.client_payload`. The review-only OpenCode route keeps the
          immutable PR and invocation identity fields at the top level and nests its five
          fixed controls under `review_policy`. Both the comment router and the wrapper's
          scheduler forward use this compact contract. LineageWeave is also appended to a
          source-controlled exact allowlist baseline so a missing UI variable entry cannot
          silently suppress review for the incident repository.

          '''
          if marker not in doctoring:
              raise SystemExit("doctoring marker changed")
          if section not in doctoring:
              doctoring = doctoring.replace(marker, section + marker, 1)
          doctoring_path.write_text(doctoring, encoding="utf-8")
          PY

      - name: Verify focused and repository-wide quality gates
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_complete_payload_binding.py \
            tests/test_agent_mention_downstream_idempotency.py \
            tests/test_agent_mention_review_regressions.py
          python -m coverage erase
          python -m coverage run -m pytest tests
          python -m coverage report --show-missing
          python -m interrogate -c pyproject.toml scripts/ci
          python -m compileall -q scripts tests

      - name: Remove one-shot workflow and publish verified repair
        run: |
          set -euo pipefail
          rm .github/workflows/repair-agent-mention-payload-limit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/agent_mention_router.py \
            .github/workflows/agent-mention-opencode-dispatch.yml \
            .github/workflows/agent-mention-router.yml \
            .github/workflows/pr-review-merge-scheduler.yml \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_complete_payload_binding.py \
            docs/doctoring/required-review-check-is-not-a-verdict.md \
            CHANGELOG.md \
            .github/workflows/repair-agent-mention-payload-limit.yml
          git diff --cached --check
          git commit -m "fix(review): compact agent mention dispatch payload"
          git push origin HEAD:fix/required-review-fail-closed-without-verdict
