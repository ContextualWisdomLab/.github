name: Source Fix 1700 Exact Changed Path Evidence

on:
  push:
    branches:
      - fix/noema-evidence-completeness-no-heuristics
    paths:
      - .github/workflows/_temp_pr1700_exact_changed_path_repair.yml
      - scripts/ci/_temp_pr1700_exact_changed_path_repair.py

permissions:
  contents: write

concurrency:
  group: source-fix-1700-exact-changed-path-evidence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/noema-evidence-completeness-no-heuristics
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact protected-main reconciliation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          REQUIRED_BASE: a28fc2f4e185df7847e2f2f5f6ec561d1e84805d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$REQUIRED_BASE" HEAD

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-verified test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove no-heuristics contract is RED
        run: |
          set -euo pipefail
          if PYTHONPATH=. python3 -m pytest -q tests/test_noema_no_heuristic_evidence_allocation.py; then
            echo '::error::Expected PR #1700 contract to be RED before repair.'
            exit 1
          fi

      - name: Apply owner repair
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci/_temp_pr1700_exact_changed_path_repair.py

      - name: Verify focused and repository GREEN
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_no_heuristic_evidence_allocation.py \
            tests/test_noema_review_gate.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_repository_branch_coverage_javascript_and_noema.py
          PYTHONPATH=. coverage run --branch -m pytest tests -q
          coverage report --fail-under=100 --show-missing
          python3 -m interrogate --fail-under 100 --ignore-init-method scripts/ci
          python3 -m compileall -q scripts tests
          git diff --check

      - name: Self-retire and publish from unchanged writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/noema-evidence-completeness-no-heuristics
          live_head="$(git rev-parse origin/fix/noema-evidence-completeness-no-heuristics)"
          if [ "$live_head" != "$EXPECTED_HEAD" ]; then
            echo "::notice::Writer advanced to $live_head; refusing stale publication."
            exit 0
          fi
          git rm -- \
            .github/workflows/_temp_pr1700_exact_changed_path_repair.yml \
            scripts/ci/_temp_pr1700_exact_changed_path_repair.py
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git add scripts/ci/noema_review_gate.py \
            tests/test_noema_no_heuristic_evidence_allocation.py \
            tests/test_noema_review_gate.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_repository_branch_coverage_javascript_and_noema.py \
            docs/doctoring/noema-repair-attempt-telemetry.md \
            CHANGELOG.md
          git diff --cached --check
          git commit -m "fix(noema): require exact changed-path evidence"
          git push origin HEAD:fix/noema-evidence-completeness-no-heuristics
