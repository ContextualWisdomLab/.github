name: Temporary Hourly DDD Development Contract Repair

on:
  push:
    branches:
      - fix/hourly-ddd-development-contract-20260901
    paths:
      - .github/workflows/tmp-hourly-ddd-development-contract.yml
      - scripts/ci/tmp_apply_hourly_ddd_contract.py

concurrency:
  group: tmp-hourly-ddd-development-contract-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/hourly-ddd-development-contract-20260901
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Apply exact bounded repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: python scripts/ci/tmp_apply_hourly_ddd_contract.py

      - name: Install exact focused-test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/requirements.txt" <<'EOF'
          coverage==7.15.2 --hash=sha256:b9a6367e4aff723e8ee8190836836124284e8fcd4265e307c844010cfa074f3f
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          EOF
          python -m pip install --only-binary=:all: --require-hashes -r "${RUNNER_TEMP}/requirements.txt"

      - name: Verify policy, branch coverage, and source hygiene
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage run --branch -m pytest --import-mode=importlib \
            tests/test_organization_commercial_readiness_loop*.py -q
          python -m coverage report \
            --include='scripts/ci/organization_commercial_readiness_loop.py' \
            --show-missing \
            --fail-under=100
          python -m compileall -q \
            scripts/ci/organization_commercial_readiness_loop.py \
            organization_commercial_readiness_fixtures.py \
            tests/test_organization_commercial_readiness_loop*.py
          git diff --check
          test "$(grep -c '# cwl-ddd-architecture-audit: required' organization_commercial_readiness_fixtures.py)" -eq 1
          test "$(grep -c 'api.opencode.ai:443' .github/workflows/organization-commercial-readiness-loop.yml)" -eq 1

      - name: Remove bootstrap and publish verified branch commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-hourly-ddd-development-contract.yml
          rm scripts/ci/tmp_apply_hourly_ddd_contract.py
          git diff --check
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(automation): enforce hourly DDD development contract'
          git push origin HEAD:fix/hourly-ddd-development-contract-20260901
