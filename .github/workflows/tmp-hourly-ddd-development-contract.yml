name: Temporary Hourly DDD Development Contract Repair

on:
  push:
    branches:
      - fix/hourly-ddd-development-contract-20260901
    paths:
      - .github/workflows/tmp-hourly-ddd-development-contract.yml

concurrency:
  group: tmp-hourly-ddd-development-contract-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/hourly-ddd-development-contract-20260901
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Apply exact bounded repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path.cwd()


          def replace_once(path: str, old: str, new: str) -> None:
              """Replace one exact repository fragment or fail closed."""
              target = ROOT / path
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact fragment, found {count}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")


          replace_once(
              ".github/workflows/organization-commercial-readiness-loop.yml",
              """    runs-on: ubuntu-24.04
              timeout-minutes: 25
              env:
          """,
              """    runs-on: ubuntu-24.04
              timeout-minutes: 25
              permissions:
                contents: read
                id-token: write
              env:
          """,
          )
          replace_once(
              ".github/workflows/organization-commercial-readiness-loop.yml",
              """            api.github.com:443
              github.com:443
          """,
              """            api.github.com:443
              api.opencode.ai:443
              github.com:443
          """,
          )
          replace_once(
              ".github/workflows/organization-commercial-readiness-loop.yml",
              """      - name: Coordinate one bounded fleet pass
                env:
                  GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
                shell: bash --noprofile --norc -e -o pipefail {0}
                run: |
                  if [ -z "${GH_TOKEN:-}" ]; then
                    echo "::error::PR_REVIEW_MERGE_TOKEN is required; neither the reviewer credential nor repository-scoped GITHUB_TOKEN is accepted."
                    exit 1
                  fi
                  echo "::add-mask::$GH_TOKEN"
                  test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

                  python scripts/ci/organization_commercial_readiness_loop.py \\
                    --organization "$ORGANIZATION" \\
                    --rotation-seed "$ROTATION_SEED" \\
                    --max-repositories "$MAX_REPOSITORIES" \\
                    --max-review-dispatches "$MAX_REVIEW_DISPATCHES" \\
                    --max-development-dispatches "$MAX_DEVELOPMENT_DISPATCHES" \\
                    --json-output "$RUNNER_TEMP/organization-commercial-readiness-loop.json"
                  python -m json.tool "$RUNNER_TEMP/organization-commercial-readiness-loop.json" >/dev/null
          """,
              """      - name: Coordinate one bounded fleet pass
                env:
                  GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
                  OIDC_AUDIENCE: opencode-github-action
                  OPENCODE_API_BASE_URL: https://api.opencode.ai
                shell: bash --noprofile --norc -e -o pipefail {0}
                run: |
                  set -euo pipefail

                  exchange_unavailable() {
                    echo "::error::OpenCode app token exchange unavailable: $1"
                    exit 1
                  }

                  if [ -z "${GH_TOKEN:-}" ]; then
                    if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
                      exchange_unavailable "OIDC request environment is missing."
                    fi

                    request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
                    separator="&"
                    case "$request_url" in
                      *\?*) ;;
                      *) separator="?" ;;
                    esac

                    if ! oidc_response="$(
                      curl -fsS \\
                        --connect-timeout 10 \\
                        --max-time 30 \\
                        -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \\
                        "${request_url}${separator}audience=${OIDC_AUDIENCE}"
                    )"; then
                      exchange_unavailable "OIDC token request did not complete."
                    fi
                    if ! oidc_token="$(
                      jq -er '.value | select(type == "string" and length > 0)' \\
                        <<<"$oidc_response" 2>/dev/null
                    )"; then
                      exchange_unavailable "OIDC token response was malformed or empty."
                    fi
                    echo "::add-mask::$oidc_token"

                    if ! token_response="$(
                      curl -fsS \\
                        --connect-timeout 10 \\
                        --max-time 30 \\
                        -X POST \\
                        -H "Authorization: Bearer ${oidc_token}" \\
                        "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
                    )"; then
                      exchange_unavailable "app token request did not complete."
                    fi
                    if ! app_token="$(
                      jq -er '.token | select(type == "string" and length > 0)' \\
                        <<<"$token_response" 2>/dev/null
                    )"; then
                      exchange_unavailable "app token response was malformed or empty."
                    fi
                    echo "::add-mask::$app_token"
                    export GH_TOKEN="$app_token"
                  fi

                  if [ -z "${GH_TOKEN:-}" ]; then
                    echo "::error::PR_REVIEW_MERGE_TOKEN or the job-bound OpenCode App token exchange is required; neither reviewer credentials nor repository-scoped GITHUB_TOKEN are accepted."
                    exit 1
                  fi
                  echo "::add-mask::$GH_TOKEN"
                  test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

                  python scripts/ci/organization_commercial_readiness_loop.py \\
                    --organization "$ORGANIZATION" \\
                    --rotation-seed "$ROTATION_SEED" \\
                    --max-repositories "$MAX_REPOSITORIES" \\
                    --max-review-dispatches "$MAX_REVIEW_DISPATCHES" \\
                    --max-development-dispatches "$MAX_DEVELOPMENT_DISPATCHES" \\
                    --json-output "$RUNNER_TEMP/organization-commercial-readiness-loop.json"
                  python -m json.tool "$RUNNER_TEMP/organization-commercial-readiness-loop.json" >/dev/null
          """,
          )

          replace_once(
              "scripts/ci/organization_commercial_readiness_loop.py",
              """ENTRYPOINT_MARKER = "# cwl-org-commercial-entrypoint: v1"
              CENTRAL_REPOSITORY = f"{DEFAULT_ORGANIZATION}/.github"
          """,
              """ENTRYPOINT_MARKER = "# cwl-org-commercial-entrypoint: v1"
              DDD_ENTRYPOINT_MARKER = "# cwl-ddd-architecture-audit: required"
              DDD_CONTRACT_TERMS = (
                  "Domain-Driven Design",
                  "core, supporting, and generic subdomains",
                  "Bounded Context",
                  "Context Map",
                  "Ubiquitous Language",
                  "Aggregate",
                  "Entity",
                  "Value Object",
                  "Domain Service",
                  "Repository",
                  "Domain Event",
                  "Invariant",
                  "Anti-Corruption Layer",
                  "Shared Kernel",
                  "directory paths",
                  "docs/product-technical-gap-baseline.md",
              )
              CENTRAL_REPOSITORY = f"{DEFAULT_ORGANIZATION}/.github"
          """,
          )
          replace_once(
              "scripts/ci/organization_commercial_readiness_loop.py",
              """def is_manual_product_entrypoint(workflow: WorkflowRecord) -> bool:
                  \"\"\"Return whether a workflow explicitly opts in to central product dispatch.\"\"\"
                  source = workflow.content
                  if workflow.state != "active" or source is None:
                      return False
                  return all(
                      (
                          ENTRYPOINT_MARKER in source,
                          bool(WORKFLOW_DISPATCH_RE.search(source)),
          """,
              """def has_domain_driven_development_contract(source: str) -> bool:
                  \"\"\"Return whether one entrypoint accepts the complete DDD repair contract.\"\"\"
                  return DDD_ENTRYPOINT_MARKER in source and all(
                      term in source for term in DDD_CONTRACT_TERMS
                  )


              def is_manual_product_entrypoint(workflow: WorkflowRecord) -> bool:
                  \"\"\"Return whether a workflow safely opts in to central product development.\"\"\"
                  source = workflow.content
                  if workflow.state != "active" or source is None:
                      return False
                  return all(
                      (
                          ENTRYPOINT_MARKER in source,
                          has_domain_driven_development_contract(source),
                          bool(WORKFLOW_DISPATCH_RE.search(source)),
          """,
          )

          replace_once(
              "organization_commercial_readiness_fixtures.py",
              """            "# cwl-org-commercial-entrypoint: v1\\n"
                          "on:\\n  workflow_dispatch:\\n"
                          "concurrency:\\n  group: product-development\\n"
                          "permissions:\\n  contents: write\\n"
                          "NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}\\n"
          """,
              """            "# cwl-org-commercial-entrypoint: v1\\n"
                          "# cwl-ddd-architecture-audit: required\\n"
                          "on:\\n  workflow_dispatch:\\n"
                          "concurrency:\\n  group: product-development\\n"
                          "permissions:\\n  contents: write\\n"
                          "NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}\\n"
                          "prompt: |\\n"
                          "  Apply Domain-Driven Design before and during every increment.\\n"
                          "  Classify core, supporting, and generic subdomains; define each Bounded Context, Context Map, and Ubiquitous Language.\\n"
                          "  Keep Aggregate, Entity, Value Object, Domain Service, Repository, Domain Event, and Invariant names aligned across code, API, database, and tests.\\n"
                          "  Isolate external systems behind an Anti-Corruption Layer and keep the Shared Kernel minimal.\\n"
                          "  Audit and correct misleading directory paths with imports, packaging, callers, tests, and architecture documents in the same bounded change.\\n"
                          "  Update docs/product-technical-gap-baseline.md with detected and repaired architecture drift.\\n"
          """,
          )

          replace_once(
              "tests/test_organization_commercial_readiness_loop_policy.py",
              """    ActionKind,
                  ActionResult,
                  RunRecord,
          """,
              """    ActionKind,
                  ActionResult,
                  DDD_CONTRACT_TERMS,
                  RunRecord,
          """,
          )
          replace_once(
              "tests/test_organization_commercial_readiness_loop_policy.py",
              """def test_product_entrypoint_requires_manual_nvidia_opt_in() -> None:
                  \"\"\"Product dispatch requires a marked, unscheduled, credential-isolated workflow.\"\"\"
                  safe = manual_workflow()
                  assert is_manual_product_entrypoint(safe)
                  assert not is_manual_product_entrypoint(workflow(state="disabled_manually", content="x"))
                  assert not is_manual_product_entrypoint(workflow(content=None))
                  for changed in (
                      (safe.content or "") + 'schedule:\\n  - cron: "1 * * * *"\\n',
                      (safe.content or "") + "COPILOT_GITHUB_TOKEN: forbidden\\n",
                      (safe.content or "").replace("# cwl-org-commercial-entrypoint: v1\\n", ""),
                      (safe.content or "").replace("concurrency:\\n", ""),
                  ):
                      assert not is_manual_product_entrypoint(workflow(content=changed))
          """,
              """def test_product_entrypoint_requires_manual_nvidia_and_ddd_opt_in() -> None:
                  \"\"\"Product dispatch requires a manual credential-isolated DDD contract.\"\"\"
                  safe = manual_workflow()
                  assert is_manual_product_entrypoint(safe)
                  assert not is_manual_product_entrypoint(workflow(state="disabled_manually", content="x"))
                  assert not is_manual_product_entrypoint(workflow(content=None))
                  mutations = [
                      (safe.content or "") + 'schedule:\\n  - cron: "1 * * * *"\\n',
                      (safe.content or "") + "COPILOT_GITHUB_TOKEN: forbidden\\n",
                      (safe.content or "").replace("# cwl-org-commercial-entrypoint: v1\\n", ""),
                      (safe.content or "").replace(
                          "# cwl-ddd-architecture-audit: required\\n", ""
                      ),
                      (safe.content or "").replace("concurrency:\\n", ""),
                  ]
                  mutations.extend(
                      (safe.content or "").replace(term, f"missing-{index}", 1)
                      for index, term in enumerate(DDD_CONTRACT_TERMS)
                  )
                  for changed in mutations:
                      assert not is_manual_product_entrypoint(workflow(content=changed))
          """,
          )
          replace_once(
              "tests/test_organization_commercial_readiness_loop_policy.py",
              """    assert "GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}" in workflow_source
                  assert "OPENCODE_APPROVE_TOKEN" not in workflow_source
          """,
              """    assert "GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}" in workflow_source
                  assert 'export GH_TOKEN="$app_token"' in workflow_source
                  assert "id-token: write" in workflow_source
                  assert "OIDC_AUDIENCE: opencode-github-action" in workflow_source
                  assert "OPENCODE_APPROVE_TOKEN" not in workflow_source
          """,
          )
          replace_once(
              "tests/test_organization_commercial_readiness_loop_policy.py",
              """    assert "manual-only, explicitly marked" in doctoring
                  assert "does not make every repository directly writable" in doctoring
          """,
              """    assert "manual-only, explicitly marked" in doctoring
                  assert "# cwl-ddd-architecture-audit: required" in doctoring
                  assert "misleading directory paths" in doctoring
                  assert "does not make every repository directly writable" in doctoring
          """,
          )

          replace_once(
              "tests/test_organization_commercial_readiness_loop_credential_contract.py",
              """def test_central_schedule_has_no_branch_selected_or_reviewer_credential_path() -> None:
                  \"\"\"The fleet coordinator must be schedule-only and use maintainer authority.\"\"\"
                  source = WORKFLOW_PATH.read_text(encoding="utf-8")

                  assert "workflow_dispatch:" not in source
                  assert "GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}" in source
                  assert "persist-credentials: false" in source
                  assert "OPENCODE_APPROVE_TOKEN" not in source
                  assert "DRY_RUN" not in source
                  assert "inputs.dry_run" not in source
          """,
              """def test_central_schedule_has_no_branch_selected_or_reviewer_credential_path() -> None:
                  \"\"\"The fleet coordinator uses schedule-bound maintainer or App authority.\"\"\"
                  source = WORKFLOW_PATH.read_text(encoding="utf-8")

                  assert "workflow_dispatch:" not in source
                  assert "GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}" in source
                  assert "id-token: write" in source
                  assert "OIDC_AUDIENCE: opencode-github-action" in source
                  assert '"${OPENCODE_API_BASE_URL}/exchange_github_app_token"' in source
                  assert "persist-credentials: false" in source
                  assert "OPENCODE_APPROVE_TOKEN" not in source
                  assert "|| github.token" not in source
                  assert "DRY_RUN" not in source
                  assert "inputs.dry_run" not in source


              def test_opencode_exchange_fails_closed_and_masks_both_tokens() -> None:
                  \"\"\"Malformed exchanges remain bounded and never expose either token.\"\"\"
                  source = WORKFLOW_PATH.read_text(encoding="utf-8")
                  coordinate = source.split(
                      "      - name: Coordinate one bounded fleet pass\\n", maxsplit=1
                  )[1]

                  assert 'if [ -z "${GH_TOKEN:-}" ]; then' in coordinate
                  assert 'export GH_TOKEN="$app_token"' in coordinate
                  assert "OIDC token response was malformed or empty" in coordinate
                  assert "app token response was malformed or empty" in coordinate
                  assert 'echo "::add-mask::$oidc_token"' in coordinate
                  assert 'echo "::add-mask::$app_token"' in coordinate
                  assert coordinate.count("--connect-timeout 10") == 2
                  assert coordinate.count("--max-time 30") == 2
          """,
          )

          doctoring_path = ROOT / "docs/doctoring/organization-commercial-readiness-loop.md"
          doctoring = doctoring_path.read_text(encoding="utf-8")
          old_credential = (
              "The central job therefore refuses both repository-scoped and reviewer-scoped token fallbacks. "
              "It requires the maintainer-scoped `PR_REVIEW_MERGE_TOKEN`; `OPENCODE_APPROVE_TOKEN` remains isolated "
              "to the reviewer credential chain and `GITHUB_TOKEN` is not accepted for cross-repository coordination. "
              "The maintainer token is exposed only to the final dispatch shell step, not checkout, setup, artifact "
              "upload, or other third-party actions. The coordinator itself receives neither `NVIDIA_NIM_API_KEY` nor "
              "`COPILOT_GITHUB_TOKEN`. Model credentials remain inside separately reviewed repository-local or central workers."
          )
          new_credential = (
              "The central job therefore refuses repository-scoped and reviewer-scoped token fallbacks. It prefers the "
              "maintainer-scoped `PR_REVIEW_MERGE_TOKEN`; when that credential is absent, the scheduled default-branch job "
              "may exchange its job-bound GitHub OIDC identity for the existing short-lived OpenCode App installation token. "
              "Both exchange calls have bounded connection and total timeouts, both returned tokens are masked before reuse, "
              "and malformed or empty responses fail closed. `OPENCODE_APPROVE_TOKEN` remains isolated to the reviewer "
              "credential chain and `GITHUB_TOKEN` is never accepted for cross-repository coordination. The resulting "
              "maintainer credential is exposed only to the final dispatch shell step, not checkout, setup, artifact upload, "
              "or other third-party actions. The coordinator itself receives neither `NVIDIA_NIM_API_KEY` nor "
              "`COPILOT_GITHUB_TOKEN`. Model credentials remain inside separately reviewed repository-local or central workers."
          )
          if doctoring.count(old_credential) != 1:
              raise SystemExit("doctoring credential paragraph drifted")
          doctoring = doctoring.replace(old_credential, new_credential, 1)
          start = doctoring.index("## Product-development boundary")
          end = doctoring.index("## Failure, evidence, and operations")
          product_section = """## Product-development boundary

          Product development is dispatched only when a repository has zero open pull requests and exposes one active, manual-only, explicitly marked workflow:

          ```yaml
          # cwl-org-commercial-entrypoint: v1
          # cwl-ddd-architecture-audit: required
          on:
            workflow_dispatch:
          ```

          The entrypoint must contain an explicit `concurrency` contract, use `NVIDIA_NIM_API_KEY`, omit `COPILOT_GITHUB_TOKEN`, have no schedule of its own, and carry a commercial/product-development identity. It must also embed the complete Domain-Driven Design repair contract rather than merely mention DDD. The machine-checked contract requires core, supporting, and generic subdomains; Bounded Context; Context Map; Ubiquitous Language; Aggregate; Entity; Value Object; Domain Service; Repository; Domain Event; Invariant; Anti-Corruption Layer; Shared Kernel; directory paths; and `docs/product-technical-gap-baseline.md`.

          Each hourly product increment must identify the owning product responsibility before selecting a repository, then compare the live directory tree, module/package names, API, database objects, tests, and documentation with that responsibility. Misleading directory paths, generic `utils`/`common` dumping grounds that own domain behavior, infrastructure imports inside the domain model, cross-context database access, obsolete product names, or customer-visible implementation boundaries are architecture defects, not cosmetic debt. When one can be corrected safely in the bounded increment, the agent moves the code and updates imports, package manifests, call sites, migrations, tests, ADRs, diagrams, and compatibility adapters in the same pull request.

          The contract does not impose one universal folder template. A move is justified by domain ownership and dependency direction, not by directory aesthetics. Aggregate boundaries remain the smallest consistency boundary; external and legacy systems are isolated behind an Anti-Corruption Layer; the Shared Kernel remains minimal; and cross-context integration uses explicit versioned contracts. If a coherent move exceeds the current pull request's safe scope, the agent must record the exact owner, callers, target context, migration sequence, and acceptance evidence in `docs/product-technical-gap-baseline.md` and select it as the next bounded architecture increment rather than silently leaving the drift unresolved.

          This opt-in prevents the central coordinator from guessing that an unrelated manual workflow can safely modify product source. Repositories with an existing hourly or more frequent dedicated writer keep their own lease and are never double-dispatched; those schedules may share the same DDD contract and should adopt it without adding another cron.

          The repository-local entrypoint remains responsible for bounded editable paths, tests, 100% production statement and branch coverage, public docstrings, package and security verification, exact-head publication, and pull-request creation. A missing compliant entrypoint is a deliberate no-op, not permission to inject a generic writer into that repository.

          """
          doctoring = doctoring[:start] + product_section + doctoring[end:]
          references_marker = "## APA 7 references\n\n"
          ddd_references = (
              "Evans, E. (2004). *Domain-driven design: Tackling complexity in the heart of software*. Addison-Wesley.\n\n"
              "Evans, E. (2015). *Domain-driven design reference: Definitions and pattern summaries*. Domain Language. https://www.domainlanguage.com/ddd/reference/\n\n"
              "International Organization for Standardization, International Electrotechnical Commission, & Institute of Electrical and Electronics Engineers. (2022). *Software, systems and enterprise—Architecture description* (ISO/IEC/IEEE Standard 42010:2022). https://www.iso.org/standard/74393.html\n\n"
          )
          if references_marker not in doctoring:
              raise SystemExit("doctoring references heading missing")
          doctoring = doctoring.replace(
              references_marker, references_marker + ddd_references, 1
          )
          doctoring_path.write_text(doctoring, encoding="utf-8")

          baseline_path = ROOT / "docs/product-technical-gap-baseline.md"
          baseline = baseline_path.read_text(encoding="utf-8")
          baseline_marker = "## 1. 근거와 범위\n"
          baseline_addendum = """## 2026-09-01 시간별 DDD 실행 계약 보강

          - **관측:** 조직 상용화 루프는 매시 7분 실행되고 기존 전용 writer 예약을 존중하지만, 중앙 제품개발 opt-in은 DDD 및 디렉터리 소유권 감사를 요구하지 않았다. 또한 maintainer secret이 없는 예약 환경에서는 cross-repository dispatch 전에 중단될 수 있었다.
          - **Gap `G-DDD-01`:** Bounded Context와 실제 디렉터리·패키지·API·DB 소유권이 어긋나도 시간별 Agent가 이를 필수 결함으로 선택한다는 기계 검증 계약이 없었다.
          - **조치:** 수동 제품개발 진입점에 `# cwl-ddd-architecture-audit: required`와 전략·전술 DDD 용어, directory-path repair, `docs/product-technical-gap-baseline.md` 갱신을 요구한다. 기존 전용 예약은 writer lease를 유지해 중복 실행하지 않는다.
          - **가용성 조치:** `PR_REVIEW_MERGE_TOKEN`을 우선 사용하되 없으면 protected-default-branch job의 OIDC identity를 short-lived OpenCode App installation token으로 교환한다. repository `GITHUB_TOKEN`, reviewer credential, model provider key는 fallback으로 사용하지 않는다.
          - **완료 증거:** exact-head focused policy tests, statement/branch coverage 100%, Python docstring 100%, workflow security checks, independent review, protected merge. 병합 전 상태는 구현 중이며 운영 완료로 간주하지 않는다.

          """
          if baseline_marker not in baseline:
              raise SystemExit("gap baseline insertion point missing")
          baseline = baseline.replace(
              baseline_marker, baseline_addendum + baseline_marker, 1
          )
          baseline_path.write_text(baseline, encoding="utf-8")

          changelog_path = ROOT / "CHANGELOG.md"
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_marker = "## [Unreleased]\n"
          changelog_entry = (
              "- Restore the hourly organization commercial-readiness coordinator when the dedicated maintainer secret is absent by exchanging the protected scheduled job's OIDC identity for a short-lived OpenCode App installation token; retain bounded network calls, token masking, and fail-closed parsing. Require every centrally dispatched product-development entrypoint to accept a machine-checked Domain-Driven Design contract, continuously repairing misleading directory ownership and recording larger bounded-context migrations in `docs/product-technical-gap-baseline.md` without duplicating repository-owned schedules.\n"
          )
          if changelog_marker not in changelog:
              raise SystemExit("changelog insertion point missing")
          changelog = changelog.replace(
              changelog_marker, changelog_marker + changelog_entry, 1
          )
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Install exact focused-test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/requirements.txt" <<'EOF'
          coverage==7.15.2 --hash=sha256:b9a6367e4aff723e8ee8190836836124284e8fcd4265e307c844010cfa074f3f
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
