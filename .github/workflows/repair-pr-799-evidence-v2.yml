name: Repair PR 799 exact-head evidence v2

on:
  push:
    branches:
      - fix/security-scan-exact-head
    paths:
      - .github/repairs/pr799-repair-v2.patch.gz.b64
      - .github/workflows/repair-pr-799-evidence-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-799-exact-head-evidence-v2
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/security-scan-exact-head
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded repair and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/repairs/pr799-repair-v2.patch.gz.b64 | gzip --decompress > /tmp/pr799-repair.patch
          git apply --check /tmp/pr799-repair.patch
          git apply /tmp/pr799-repair.patch
          rm -f .github/repairs/pr799-repair-v2.patch.gz.b64
          rm -f .github/workflows/repair-pr-799-evidence-v2.yml
          rmdir .github/repairs 2>/dev/null || true
          bash -n scripts/ci/run_opencode_review_model_pool.sh
          git diff --check

      - name: Install trusted test toolchain
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Verify focused regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python3 -m pytest -q \
            tests/test_required_workflow_queue_contract.py::test_security_scan_fails_closed_when_dependency_review_is_unavailable \
            tests/test_sandboxed_verify.py::test_main_reports_allowed_env_network_stderr_timeout_and_kept_sandbox \
            tests/test_opencode_model_pool_runner.py::test_fatal_provider_error_kills_hung_opencode_run_early

      - name: Verify complete Python evidence
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          timeout --kill-after=30s 900 python3 -m coverage run -m pytest -q tests
          python3 -m coverage report --show-missing --fail-under=100
          python3 -m interrogate scripts/ci --fail-under=100

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --check
          git commit -m "fix(ci): reap fatal review process groups"
          git push origin HEAD:fix/security-scan-exact-head
