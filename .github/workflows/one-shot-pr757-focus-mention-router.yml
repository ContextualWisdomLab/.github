name: One-shot PR 757 focused agent mention router

on:
  push:
    branches:
      - feat/comment-agent-mention-dispatch
    paths:
      - .github/workflows/one-shot-pr757-focus-mention-router.yml

permissions:
  contents: read

concurrency:
  group: one-shot-pr757-focused-mention-router
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  focus-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.ref == 'refs/heads/feat/comment-agent-mention-dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact legacy head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Rebuild the focused slice on protected main
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          legacy_tree="$EXPECTED_HEAD"
          git checkout --detach origin/main
          git checkout "$legacy_tree" -- \
            .github/workflows/agent-mention-router.yml \
            docs/automation/review-agent-comment-invocation.md \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py

          cat >.github/workflows/agent-mention-router-quality-ci.yml <<'YAML'
          name: Agent Mention Router Quality CI

          on:
            pull_request:
              branches: [main]
              paths:
                - ".github/workflows/agent-mention-router.yml"
                - ".github/workflows/agent-mention-router-quality-ci.yml"
                - "scripts/ci/agent_mention_router.py"
                - "scripts/ci/agent_mention_sweep.py"
                - "tests/test_agent_mention_*.py"
                - "requirements-opencode-review-ci-hashes.txt"
            push:
              branches: [main]
              paths:
                - ".github/workflows/agent-mention-router.yml"
                - ".github/workflows/agent-mention-router-quality-ci.yml"
                - "scripts/ci/agent_mention_router.py"
                - "scripts/ci/agent_mention_sweep.py"
                - "tests/test_agent_mention_*.py"
                - "requirements-opencode-review-ci-hashes.txt"

          concurrency:
            group: agent-mention-router-quality-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read

          env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

          jobs:
            quality:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - name: Harden runner
                  uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
                  with:
                    egress-policy: audit
                - name: Checkout exact head
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    persist-credentials: false
                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                  with:
                    python-version: "3.14"
                    cache: pip
                    cache-dependency-path: requirements-opencode-review-ci-hashes.txt
                - name: Install exact hash-locked tooling
                  run: >-
                    python -m pip install --disable-pip-version-check --require-hashes
                    -r requirements-opencode-review-ci-hashes.txt
                - name: Run complete focused branch coverage
                  shell: bash --noprofile --norc -e -o pipefail {0}
                  run: |
                    cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
                    [run]
                    branch = True
                    source =
                        scripts/ci/agent_mention_router.py
                        scripts/ci/agent_mention_sweep.py
                    [report]
                    fail_under = 100
                    show_missing = True
                    EOF
                    export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
                    python -m coverage erase
                    python -m coverage run -m pytest -q \
                      tests/test_agent_mention_router.py \
                      tests/test_agent_mention_sweep.py \
                      tests/test_agent_mention_workflow_contract.py
                    python -m coverage report --fail-under=100
                    python -m interrogate --fail-under=100 \
                      scripts/ci/agent_mention_router.py \
                      scripts/ci/agent_mention_sweep.py
                    python -m compileall -q \
                      scripts/ci/agent_mention_router.py \
                      scripts/ci/agent_mention_sweep.py \
                      tests/test_agent_mention_router.py \
                      tests/test_agent_mention_sweep.py \
                      tests/test_agent_mention_workflow_contract.py
                    git diff --check
          YAML

          python3 - <<'PY'
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          source = changelog.read_text(encoding="utf-8")
          entry = (
              "- Add a trusted pull-request comment router for `@cwl-noema-review` "
              "and review-only `@opencode-agent` dispatches, with organization sweep, "
              "exact-head receipts, repository allowlisting, and a permanent 100% "
              "statement/branch/docstring quality gate.\n"
          )
          if entry not in source:
              marker = "## [Unreleased]\n"
              if marker not in source:
                  raise SystemExit("CHANGELOG is missing the Unreleased section")
              source = source.replace(marker, marker + "\n" + entry, 1)
              changelog.write_text(source, encoding="utf-8")
          PY
          rm -f .github/workflows/one-shot-pr757-focus-mention-router.yml
          git diff --check

      - name: Install exact hash-locked tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify focused production contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
          [run]
          branch = True
          source =
              scripts/ci/agent_mention_router.py
              scripts/ci/agent_mention_sweep.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py
          python -m coverage report --fail-under=100
          python -m interrogate --fail-under=100 \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py
          python -m compileall -q \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py
          git diff --check

      - name: Publish focused current-main replacement
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && { echo "No focused replacement generated" >&2; exit 1; }
          git commit -m "feat(automation): route trusted review-agent mentions"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${HEAD_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_BRANCH}"
