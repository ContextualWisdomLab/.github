name: Repair PR 787 export workflow files

on:
  push:
    branches:
      - feat/review-agent-mention-router-main
    paths:
      - .github/workflows/repair-pr787-export-workflows.yml

permissions:
  contents: read

concurrency:
  group: repair-pr787-export-workflows
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/feat/review-agent-mention-router-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply reviewed repair and verify workflow digest contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/ci/repair_pr787_payload_bound_once.py
          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-noema-dispatch.yml)" -eq 1
          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-opencode-dispatch.yml)" -eq 1
          python -m compileall -q scripts/ci/agent_mention_router.py tests/test_agent_mention_idempotency.py
          git diff --check

      - name: Materialize workflow exports outside hidden paths
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          bundle="$RUNNER_TEMP/pr787-workflow-files"
          mkdir -p "$bundle/workflow_exports"
          cp .github/workflows/agent-mention-noema-dispatch.yml "$bundle/workflow_exports/agent-mention-noema-dispatch.yml"
          cp .github/workflows/agent-mention-opencode-dispatch.yml "$bundle/workflow_exports/agent-mention-opencode-dispatch.yml"
          {
            printf 'source_head=%s\n' "$GITHUB_SHA"
            sha256sum "$bundle"/workflow_exports/*.yml
          } >"$bundle/MANIFEST.sha256"

      - name: Upload reviewed workflow bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr787-workflow-files-${{ github.sha }}
          path: ${{ runner.temp }}/pr787-workflow-files
          if-no-files-found: error
          retention-days: 1
