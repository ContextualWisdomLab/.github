name: Temporary PR 1706 formal-verdict reconciliation repair

on:
  push:
    branches:
      - fix/opencode-poll-wall-clock-bound
    paths:
      - .github/workflows/_temp_pr1706_reconcile_formal_verdict_v2.yml

permissions:
  contents: read

concurrency:
  group: temp-pr1706-formal-verdict-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github' && github.ref == 'refs/heads/fix/opencode-poll-wall-clock-bound'
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact writer head and publication credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo 'workflow-starting mutation credential is required' >&2; exit 1; }
          git fetch origin fix/opencode-poll-wall-clock-bound
          test "$(git rev-parse origin/fix/opencode-poll-wall-clock-bound)" = "$GITHUB_SHA"
      - name: Apply permanent formal-verdict repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          driver = Path("scripts/ci/source_fix_pr1706_formal_verdict.py")
          text = driver.read_text(encoding="utf-8")
          old = '''    if TEST.exists():
              raise SystemExit(f"refusing to overwrite existing {TEST}")
          TEST.write_text(TEST_CONTENT, encoding="utf-8")'''
          new = '''    if TEST.exists():
              if TEST.read_text(encoding="utf-8") != TEST_CONTENT:
                  raise SystemExit(f"existing {TEST} drifted from the expected RED regression")
          else:
              TEST.write_text(TEST_CONTENT, encoding="utf-8")'''
          if text.count(old) != 1:
              raise SystemExit("transition driver test-existence guard drifted; refusing to patch")
          driver.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          PYTHONPATH=. python3 scripts/ci/source_fix_pr1706_formal_verdict.py
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_opencode_required_verdict_reconciliation_contract.py \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_event_driven_required_wake.py \
            tests/test_opencode_formal_verdict_authority_contract.py
          git diff --check
      - name: Publish repaired exact-head tree and retire temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/ci/source_fix_pr1706_formal_verdict.py
          rm .github/workflows/_temp_pr1706_reconcile_formal_verdict_v2.yml
          git add \
            .github/workflows/opencode-review.yml \
            .github/workflows/pr-review-merge-scheduler.yml \
            docs/product-technical-gap-baseline.md \
            tests/test_opencode_required_verdict_reconciliation_contract.py \
            scripts/ci/source_fix_pr1706_formal_verdict.py \
            .github/workflows/_temp_pr1706_reconcile_formal_verdict_v2.yml
          git diff --cached --check
          git config user.name 'ContextualWisdomLab repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(opencode): reconcile exact-head formal verdict authority'
          git fetch origin fix/opencode-poll-wall-clock-bound
          test "$(git rev-parse origin/fix/opencode-poll-wall-clock-bound)" = "$GITHUB_SHA"
          auth_header="Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: $auth_header" push origin HEAD:fix/opencode-poll-wall-clock-bound
