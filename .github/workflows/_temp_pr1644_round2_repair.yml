name: One-shot PR1644 review round-two repair

on:
  push:
    branches:
      - fix/ruleset-owner-plane-reconciler
    paths:
      - .github/_temp_pr1644_round2.trigger

permissions:
  contents: write

concurrency:
  group: pr1644-round2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove historical editable-identity regression is RED
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          p = Path('scripts/ci/reconcile_ruleset_governance.py')
          s = importlib.util.spec_from_file_location('r', p)
          m = importlib.util.module_from_spec(s); sys.modules[s.name] = m; s.loader.exec_module(m)
          t = m.RulesetTarget('repository', 'ContextualWisdomLab', '.github', 17921150, 'Lock default branch')
          state = {'id': 17921150, 'name': 'Admin renamed', 'target': 'branch', 'source_type': 'Repository', 'source': 'ContextualWisdomLab/.github', 'enforcement': 'evaluate', 'bypass_actors': [], 'conditions': {}, 'rules': []}
          m._gh_api = lambda *_a, **_k: {'state': state}
          m._history_version_state(t, 7)
          PY
          then
            echo '::error::historical editable-identity regression was not RED'
            exit 1
          fi

      - name: Apply exact source/test/docs repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/_temp_repair_pr1644_round2.py

      - name: Verify focused GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/reconcile_ruleset_governance.py tests/test_ruleset_governance_review_round2.py
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          p = Path('scripts/ci/reconcile_ruleset_governance.py')
          s = importlib.util.spec_from_file_location('r', p)
          m = importlib.util.module_from_spec(s); sys.modules[s.name] = m; s.loader.exec_module(m)
          t = m.RulesetTarget('repository', 'ContextualWisdomLab', '.github', 17921150, 'Lock default branch')
          state = {'id': 17921150, 'name': 'Admin renamed', 'target': 'branch', 'source_type': 'Repository', 'source': 'ContextualWisdomLab/.github', 'enforcement': 'evaluate', 'bypass_actors': [], 'conditions': {}, 'rules': []}
          m._gh_api = lambda *_a, **_k: {'state': state}
          assert m._history_version_state(t, 7) == state
          workflow = Path('.github/workflows/ruleset-governance-reconcile.yml').read_text()
          assert "cancel-in-progress: ${{ github.event_name == 'pull_request' }}" in workflow
          fixture = Path('tests/test_central_required_workflow_ruleset_audit.py').read_text()
          assert '"require_code_owner_review": False' in fixture
          assert 'tests/test_ruleset_governance_review_round2.py' in workflow
          PY
          git diff --check

      - name: Remove one-shot artifacts and publish only on unchanged writer lineage
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/_temp_pr1644_round2_repair.yml .github/_temp_pr1644_round2.trigger scripts/ci/_temp_repair_pr1644_round2.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(governance): recover concurrent editable identity safely'
          git fetch origin fix/ruleset-owner-plane-reconciler
          remote_head="$(git rev-parse FETCH_HEAD)"
          parent="$(git rev-parse HEAD^)"
          if [ "$remote_head" != "$parent" ]; then
            echo "Remote writer moved from $parent to $remote_head; refusing overwrite." >&2
            exit 1
          fi
          git push origin HEAD:fix/ruleset-owner-plane-reconciler
