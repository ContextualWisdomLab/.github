name: One-shot PR 782 token-permission hardening

on:
  push:
    branches: [fix/hourly-nvidia-nim-review-repair-main]
    paths:
      - .github/workflows/one-shot-pr782-token-permissions.yml

permissions:
  contents: write

concurrency:
  group: one-shot-pr782-token-permissions
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/hourly-nvidia-nim-review-repair-main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Remove GitHub-token write fallback and narrow permissions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          caller_path = Path(".github/workflows/clearfolio-hourly-review-repair.yml")
          caller_permissions = '''    permissions:
              actions: write
              contents: read
              issues: write
              pull-requests: read
              statuses: read
          '''.replace("          ", "")
          replace_once(
              caller_path,
              caller_permissions,
              "",
              "Clearfolio reusable-job write permissions",
          )

          scheduler_path = Path(".github/workflows/pr-review-fix-scheduler.yml")
          scheduler_permissions = '''    permissions:
              actions: write
              contents: read
              issues: write
              pull-requests: read
              statuses: read
          '''.replace("          ", "")
          replace_once(
              scheduler_path,
              scheduler_permissions,
              "",
              "central scheduler job write permissions",
          )
          replace_once(
              scheduler_path,
              "      GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}\n",
              "      GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}\n",
              "scheduler credential fallback",
          )
          scheduler = scheduler_path.read_text(encoding="utf-8")
          dispatch_anchor = '''      - name: Dispatch review-feedback autofix
                  run: |
                    set -euo pipefail
          '''.replace("          ", "")
          dispatch_guard = '''      - name: Dispatch review-feedback autofix
                  run: |
                    set -euo pipefail
                    if [ -z "${GH_TOKEN:-}" ]; then
                      echo "::error::PR_REVIEW_MERGE_TOKEN or OPENCODE_APPROVE_TOKEN is required; the scheduler never elevates github.token."
                      exit 1
                    fi
          '''.replace("          ", "")
          if scheduler.count(dispatch_anchor) != 1:
              raise SystemExit(
                  "scheduler credential guard: expected one dispatch anchor, found "
                  f"{scheduler.count(dispatch_anchor)}"
              )
          scheduler_path.write_text(
              scheduler.replace(dispatch_anchor, dispatch_guard, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/test_pr_review_fix_hourly_contract.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = '''def test_clearfolio_caller_scopes_write_permissions_to_reusable_job() -> None:
              """Only the reusable scheduler job receives its required write permissions."""
              text = _read(_CLEARFOLIO_CALLER)
              workflow_scope, jobs_scope = text.split("\njobs:\n", maxsplit=1)

              assert "actions: write" not in workflow_scope
              assert "issues: write" not in workflow_scope
              assert "contents: write" not in workflow_scope
              assert "pull-requests: write" not in workflow_scope
              assert "statuses: write" not in workflow_scope
              assert "\npermissions:\n  contents: read\n" in workflow_scope
              assert "\n    permissions:\n" in jobs_scope
              assert "      actions: write\n" in jobs_scope
              assert "      contents: read\n" in jobs_scope
              assert "      issues: write\n" in jobs_scope
              assert "      pull-requests: read\n" in jobs_scope
              assert "      statuses: read\n" in jobs_scope
          '''.replace("          ", "")
          new_test = '''def test_clearfolio_caller_keeps_github_token_read_only() -> None:
              """The hourly caller delegates with explicit secrets and no token elevation."""
              text = _read(_CLEARFOLIO_CALLER)
              workflow_scope, jobs_scope = text.split("\njobs:\n", maxsplit=1)

              assert "\npermissions:\n  contents: read\n" in workflow_scope
              for permission in (
                  "actions: write",
                  "issues: write",
                  "contents: write",
                  "pull-requests: write",
                  "statuses: write",
              ):
                  assert permission not in text
              assert "\n    permissions:\n" not in jobs_scope
          '''.replace("          ", "")
          if tests.count(old_test) != 1:
              raise SystemExit(
                  f"hourly permission test: expected one legacy block, found {tests.count(old_test)}"
              )
          tests = tests.replace(old_test, new_test, 1)
          secret_anchor = '''    assert "secrets: inherit" not in caller
          '''.replace("          ", "")
          secret_assertions = '''    assert "secrets: inherit" not in caller
              assert (
                  "GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}"
                  in reusable
              )
              assert "|| github.token" not in reusable
              assert "the scheduler never elevates github.token" in reusable
          '''.replace("          ", "")
          if tests.count(secret_anchor) != 1:
              raise SystemExit(
                  f"scheduler secret test anchor: expected one match, found {tests.count(secret_anchor)}"
              )
          test_path.write_text(
              tests.replace(secret_anchor, secret_assertions, 1),
              encoding="utf-8",
          )

          automation_path = Path("docs/automation/hourly-review-repair.md")
          automation = automation_path.read_text(encoding="utf-8")
          automation_marker = "## GitHub token permission boundary"
          if automation_marker not in automation:
              automation += '''

          ## GitHub token permission boundary

          The scheduled caller and reusable scheduler keep the workflow-generated
          `github.token` at `contents: read`. Cross-repository issue comments and the
          central repository dispatch require one of the two established explicitly
          mapped credentials: `PR_REVIEW_MERGE_TOKEN` or `OPENCODE_APPROVE_TOKEN`.
          If both are absent, the scheduler fails before queue mutation. It never
          elevates or falls back to `github.token`, and it does not change the
          independent review workflow's credential chain.
          '''.replace("          ", "")
              automation_path.write_text(automation, encoding="utf-8")

          doctoring_path = Path("docs/doctoring/clearfolio-hourly-review-caller.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          doctoring_marker = "## Least-privilege GitHub token amendment"
          if doctoring_marker not in doctoring:
              doctoring += '''

          ## Least-privilege GitHub token amendment

          The caller and reusable scheduler deliberately retain a read-only
          workflow-generated token. Repository dispatch and marker writes use only
          the pre-existing explicitly forwarded scheduler credentials. Missing
          credentials produce a fail-closed error before mutation; `github.token`
          is not a write-capable fallback. This removes an unnecessary Actions write
          permission while preserving the established reviewer identities and
          credential ownership.
          '''.replace("          ", "")
              doctoring_path.write_text(doctoring, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          entry = (
              "- Kept the hourly review-repair caller and reusable scheduler GitHub "
              "token read-only, requiring explicitly mapped established scheduler "
              "credentials instead of an elevated `github.token` fallback.\n"
          )
          if entry not in changelog:
              heading = "## [Unreleased]\n"
              if changelog.count(heading) != 1:
                  raise SystemExit("expected one Unreleased changelog heading")
              changelog = changelog.replace(heading, heading + "\n" + entry, 1)
              changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Verify focused and complete quality contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            tests/test_opencode_agent_contract.py::test_autofix_worker_resolves_merge_conflicts_fail_closed
          python -m pytest -q \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov=scripts.ci.pr_review_autofix_context \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate \
            --fail-under 100 \
            scripts/ci/pr_review_conflict_scope.py \
            scripts/ci/pr_review_autofix_context.py
          python -m compileall -q scripts tests
          git diff --check

      - name: Publish verified hardening and remove this workflow
        env:
          BRANCH_NAME: fix/hourly-nvidia-nim-review-repair-main
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-pr782-token-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/clearfolio-hourly-review-repair.yml \
            .github/workflows/pr-review-fix-scheduler.yml \
            tests/test_pr_review_fix_hourly_contract.py \
            docs/automation/hourly-review-repair.md \
            docs/doctoring/clearfolio-hourly-review-caller.md \
            CHANGELOG.md \
            .github/workflows/one-shot-pr782-token-permissions.yml
          git diff --cached --quiet && { echo "No token-permission hardening generated" >&2; exit 1; }
          git commit -m "fix(automation): keep scheduler GitHub token read-only"
          git push origin "HEAD:${BRANCH_NAME}"
