name: One-shot refresh Strix security lock

on:
  push:
    branches:
      - fix/codeql-action-consistent-4-37-4
    paths:
      - .github/workflows/one-shot-refresh-strix-lock.yml

permissions:
  contents: write

concurrency:
  group: one-shot-refresh-strix-lock
  cancel-in-progress: false

jobs:
  refresh-lock:
    if: github.repository == 'ContextualWisdomLab/.github' && github.ref_name == 'fix/codeql-action-consistent-4-37-4'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/codeql-action-consistent-4-37-4
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install hash-locked maintenance toolchain
        run: python -m pip install --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Refresh vulnerable Strix dependencies and hash lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("requirements-strix-ci.txt")
          lines = path.read_text(encoding="utf-8").splitlines()
          replacements = {
              "cryptography": "cryptography==50.0.0",
              "aiohttp": "aiohttp==3.14.3",
          }
          updated: list[str] = []
          seen: set[str] = set()
          for line in lines:
              stripped = line.strip()
              name = stripped.split("==", 1)[0].split("<", 1)[0].split(">", 1)[0].strip().lower()
              if name in replacements:
                  if name not in seen:
                      updated.append(replacements[name])
                      seen.add(name)
                  continue
              updated.append(line)
          for name in ("aiohttp", "cryptography"):
              if name not in seen:
                  updated.append(replacements[name])
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY
          uv pip compile \
            --generate-hashes \
            --python-version 3.13 \
            --python-platform x86_64-manylinux_2_28 \
            --output-file requirements-strix-ci-hashes.txt \
            requirements-strix-ci.txt

      - name: Verify lock installation, vulnerability gate, and repository tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-strix-ci-hashes.txt
          python -m pip install --require-hashes -r requirements-pip-audit-ci-hashes.txt
          pip-audit --strict --desc=on -r requirements-strix-ci.txt
          pip-audit --strict --desc=on -r requirements-strix-ci-hashes.txt
          python -m pytest -q
          git diff --check

      - name: Commit verified lock refresh and remove one-shot workflow
        shell: bash
        env:
          BRANCH_NAME: fix/codeql-action-consistent-4-37-4
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ContextualWisdomLab/.github"
          test "$GITHUB_REF_NAME" = "$BRANCH_NAME"
          rm .github/workflows/one-shot-refresh-strix-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-strix-ci.txt requirements-strix-ci-hashes.txt .github/workflows/one-shot-refresh-strix-lock.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No verified lock changes to commit."; exit 1; }
          git commit -m "fix(security): update Strix CI dependencies"
          git push origin "HEAD:${BRANCH_NAME}"
