          root_stat = root.lstat()
          artifact = root / ("branch-coverage.json" if lane == "branch-coverage" else "coverage.json")
          command = ["cargo"]
          if lane == "branch-coverage":
              command += ["+nightly-2026-07-01"]
          command += ["llvm-cov"]
          if lane == "branch-coverage":
              command += ["--branch"]
          command += ["--workspace", "--lib", "--tests", "--json", "--output-path", str(artifact)]
          completed = subprocess.run(command)
          if completed.returncode:
              raise SystemExit(completed.returncode)
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != head:
              raise SystemExit("SRC03-EVIDENCE-001: checkout drift")
          with os.fdopen(os.open(artifact, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK), "rb") as handle:
              metadata = os.fstat(handle.fileno())
