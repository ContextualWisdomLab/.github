                      stable = ("st_dev", "st_ino", "st_mode", "st_uid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns")
                      if len(data) != info.st_size or any(getattr(after, key) != getattr(info, key) for key in stable):
                          raise SystemExit("SRC03-EVIDENCE-001: evidence changed while reading")
                      return data
                  hasher = hashlib.sha256()
                  counted = 0
                  while chunk := handle.read(min(65536, info.st_size - counted + 1)):
                      counted += len(chunk)
                      if counted > info.st_size:
                          raise SystemExit("SRC03-EVIDENCE-001: evidence changed while reading")
                      hasher.update(chunk)
                  after = os.fstat(handle.fileno())
                  stable = ("st_dev", "st_ino", "st_mode", "st_uid", "st_nlink", "st_size", "st_mtime_ns", "st_ctime_ns")
                  if counted != info.st_size or any(getattr(after, key) != getattr(info, key) for key in stable):
                      raise SystemExit("SRC03-EVIDENCE-001: evidence changed while reading")
                  return counted, hasher.hexdigest()
          def unique_fields(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("SRC03-EVIDENCE-001: duplicate binding field")
                  result[key] = value
              return result
          receipt = json.loads(regular_bytes(root / "binding.json"), object_pairs_hook=unique_fields)
          name = "branch-coverage.json" if identity["QSR_EVIDENCE_JOB"] == "branch-coverage" else "coverage.json"
          counted, digest = regular_bytes(root / name)
          expected = {**identity, "artifact": name, "bytes": counted,
                      "sha256": digest, "producer_exit": 0,
                      "root_device": metadata.st_dev, "root_inode": metadata.st_ino}
          if type(receipt) is not dict or any(type(receipt.get(key)) is not type(value) for key, value in expected.items()) or receipt != expected:
              raise SystemExit("SRC03-EVIDENCE-001: stale or mismatched evidence binding")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != identity["QSR_EXPECTED_HEAD"]:
              raise SystemExit("SRC03-EVIDENCE-001: checkout drift")
          PY
      - name: Upload branch coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-coverage-json-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qsr-evidence-${{ github.run_id }}-${{ github.run_attempt }}-branch-coverage-${{ github.event.pull_request.head.sha || github.sha }}/branch-coverage.json
            ${{ runner.temp }}/qsr-evidence-${{ github.run_id }}-${{ github.run_attempt }}-branch-coverage-${{ github.event.pull_request.head.sha || github.sha }}/binding.json
          if-no-files-found: error
      - name: Enforce complete production branch coverage
        env:
          QSR_EVIDENCE_ROOT: ${{ runner.temp }}/qsr-evidence-${{ github.run_id }}-${{ github.run_attempt }}-branch-coverage-${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_coverage.py --require-branches "$QSR_EVIDENCE_ROOT/branch-coverage.json"

  podman-e2e-positive-lsm:
    needs: admission
    if: >-
      github.repository == 'ContextualWisdomLab/quarantine-sandbox-runtime' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on:
      group: CWL QSR hostile workload
      labels: [self-hosted, linux, x64, cwl-hostile-workload, selinux]
    env:
      # Required profile only: NOT_PROVISIONED pending .github#1590; no custody claim.
      QSR_PODMAN_E2E_IMAGE: docker.io/library/python@sha256:94457973ea8a27a799f0b8ea1fe3e3147fcbebaed63497a8af63b28195a08108
      QSR_HOST_SECRET_CANARY: must-not-enter-the-isolated-application
    steps:
      - name: Verify caller and event before checkout
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$CALLER_REPOSITORY" = "ContextualWisdomLab/quarantine-sandbox-runtime" || exit 1
          case "$EVENT_NAME" in
            push)
              [[ "$PUSH_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
              test "$EXPECTED_HEAD_SHA" = "$PUSH_SHA" || exit 1
              ;;
            pull_request)
              test "$PR_HEAD_REPOSITORY" = "$CALLER_REPOSITORY" || exit 1
              [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
              test "$EXPECTED_HEAD_SHA" = "$PR_HEAD_SHA" || exit 1
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
      - name: Verify dedicated positive LSM runner contract
        run: |
          test -n "$RUNNER_NAME"
          test "$(podman --version)" = "podman version 5.8.4"
          podman info --format json > podman-info.json
          python3 - <<'PY'
          import json
          with open("podman-info.json", encoding="utf-8") as handle:
              security = json.load(handle)["host"]["security"]
          assert security["rootless"] is True
          assert security["selinuxEnabled"] is True
          print(f"selinuxEnabled={security['selinuxEnabled']}")
          PY
      - name: Pre-pull immutable fixture outside the application launch path
        run: |
          podman pull --quiet "$QSR_PODMAN_E2E_IMAGE"
          podman image inspect "$QSR_PODMAN_E2E_IMAGE" >/dev/null
      - name: Execute real positive LSM isolation and cleanup acceptance
        run: |
          RUST_TEST_NOCAPTURE=0 python3 -I - <<'PY'
          import re
          import subprocess
          import sys

          test_name = "rootless_podman_effective_isolation_and_cleanup"
          command = [
              "cargo", "test", "--locked", "--test", "podman_rootless_e2e", "--",
              "--ignored", "--exact", test_name, "--color", "never", "--format", "pretty",
              "--test-threads=1",
          ]
          completed = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          output = completed.stdout.decode("utf-8", errors="replace")
          print(output, end="", flush=True)
          if completed.returncode:
              raise SystemExit(completed.returncode)
          lines = output.splitlines()
          expected_result = re.compile(
              r"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; "
              r"[0-9]+ filtered out; finished in [0-9.]+s"
          )
          observed = [
              line for line in lines
              if line.startswith("running ")
              or line.startswith("test ")
              or line.startswith("test result:")
          ]
          expected = [
              "running 1 test",
              f"test {test_name} ... ok",
          ]
          if len(observed) != 3 or observed[:2] != expected or not expected_result.fullmatch(observed[2]):
              print("LSM-TEST-001: expected exactly one passing isolation test", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Reject leaked runtime-owned resources
        if: always()
        run: |
          leaked_containers="$(podman ps -a --filter label=org.contextualwisdomlab.sandbox.identity --format '{{.ID}}')"
          test -z "$leaked_containers"
          networks="$(podman network ls --format '{{.Name}}')"
          while IFS= read -r network; do
            case "$network" in
              qsr-net-*) exit 1 ;;
            esac
          done <<< "$networks"

  acceptance:
    if: always()
    needs: [admission, verify, coverage, branch-coverage, podman-e2e-positive-lsm]
    runs-on:
      group: CWL QSR hostile workload
      labels: [self-hosted, linux, x64, cwl-hostile-workload]
    permissions:
      contents: read
    steps:
      - name: Require every current-head evidence lane to pass
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BRANCH_RESULT: ${{ needs.branch-coverage.result }}
          LSM_RESULT: ${{ needs.podman-e2e-positive-lsm.result }}
        run: |
          test "$ADMISSION_RESULT" = "success"
          test "$VERIFY_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
          test "$BRANCH_RESULT" = "success"
          test "$LSM_RESULT" = "success"
