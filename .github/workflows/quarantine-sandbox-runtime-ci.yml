        run: |
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess

          identity = {key: os.environ[key] for key in (
              "QSR_RUN_ID", "QSR_RUN_ATTEMPT", "QSR_EVIDENCE_JOB", "QSR_EXPECTED_HEAD",
          )}
          for key in ("QSR_RUN_ID", "QSR_RUN_ATTEMPT"):
              if not re.fullmatch(r"[1-9][0-9]*", identity[key]):
                  raise SystemExit("SRC03-EVIDENCE-001: invalid run identity")
          if not re.fullmatch(r"[0-9a-f]{40}", identity["QSR_EXPECTED_HEAD"]):
              raise SystemExit("SRC03-EVIDENCE-001: invalid head identity")
          lane = identity["QSR_EVIDENCE_JOB"]
          if lane not in ("coverage", "branch-coverage"):
              raise SystemExit("SRC03-EVIDENCE-001: invalid evidence lane")
          parent = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
