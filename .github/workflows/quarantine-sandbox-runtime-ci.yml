          leaf = "qsr-evidence-{QSR_RUN_ID}-{QSR_RUN_ATTEMPT}-{QSR_EVIDENCE_JOB}-{QSR_EXPECTED_HEAD}".format(**identity)
          if not parent.is_dir() or root != parent / leaf:
              raise SystemExit("SRC03-EVIDENCE-001: invalid evidence root")
