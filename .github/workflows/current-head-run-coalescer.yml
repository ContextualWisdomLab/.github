name: Current Head Run Coalescer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# cancel-in-progress: false is deliberate, not a default left unconsidered.
# current_head_run_coalescer.py re-fetches live PR/association/sibling state
# immediately before cancelling anything (see its own module docstring) --
# it never trusts the head SHA it was triggered with, so an older, still-
# queued coalescer instance is exactly as correct as a fresh one once it
# finally runs. Under near-zero Actions admission, rapid same-PR pushes
# were cancelling each queued coalescer instance before it ever got a
# runner (verified 2026-09-03: PR #1741's own required-review checks sat
# stuck queued because the coalescer never once executed for it), so this
# job -- alone among this repo's PR-scoped workflows -- must be allowed to
# survive a superseding push rather than evicted by one.
concurrency:
  group: current-head-run-coalescer-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  coalesce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control-plane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Retire redundant queued exact-head runs
        env:
          GH_TOKEN: ${{ github.token }}
          COALESCE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/current_head_run_coalescer.py \
            --repo "$COALESCE_REPO" \
            --pr-number "$PR_NUMBER" \
            --expected-head-repo "$EXPECTED_HEAD_REPO" \
            --expected-head-ref "$EXPECTED_HEAD_REF" \
            --expected-head "$EXPECTED_HEAD"
