name: Current Head Run Coalescer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  coalesce:
    # A plain cancel-in-progress:false only protects a RUNNING job; GitHub
    # concurrency groups still retain just one PENDING (queued) run and
    # silently replace it whenever another run enters the same group --
    # regardless of cancel-in-progress (Devin Review on this PR caught that
    # the first fix here didn't actually cover this). Under near-zero
    # Actions admission, rapid same-PR pushes were replacing each queued
    # coalescer instance before it ever got a runner (verified 2026-09-03:
    # PR #1741's own required-review checks sat stuck queued because the
    # coalescer never once executed for it). queue: max is the GitHub
    # Actions feature that actually fixes this -- up to 100 pending runs
    # are kept and run in order instead of only the latest surviving, so at
    # least one eventually gets a runner rather than being repeatedly
    # evicted while still queued (already used the same way by this repo's
    # own agent-mention-router.yml:29-31). current_head_run_coalescer.py
    # re-fetches live PR state before cancelling anything and refuses
    # (CoalescingRefused, a safe no-op) rather than acting whenever the head
    # it was triggered with no longer matches the live head -- so a stale
    # queued instance can never wrongly cancel the wrong run, but it also
    # does not itself do useful cleanup for whatever the live head has since
    # become; only a queued instance whose own trigger SHA still matches the
    # live head performs real coalescing. Devin Review (this PR) correctly
    # found the residual gap this leaves: queue: max's own retention cap is
    # 100, a GitHub-imposed ceiling this workflow cannot raise, so an
    # extreme burst exceeding 100 pushes to one PR while runner admission
    # stays near zero could still evict the current head's own triggering
    # run before it ever queues, leaving no surviving instance whose
    # remembered head matches live -- not fixed here (a redesign that lets
    # a stale instance act on the live head instead of refusing needs its
    # own careful correctness review of the cancellation-candidate selection
    # this refusal currently protects); the incident this fix responds to
    # (PR #1741) involved far fewer than 100 pushes, so this is a real but
    # substantially narrower residual risk than the bug just closed.
    concurrency:
      group: current-head-run-coalescer-${{ github.repository }}-${{ github.event.pull_request.number }}
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control-plane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Retire redundant queued exact-head runs
        env:
          GH_TOKEN: ${{ github.token }}
          COALESCE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/current_head_run_coalescer.py \
            --repo "$COALESCE_REPO" \
            --pr-number "$PR_NUMBER" \
            --expected-head-repo "$EXPECTED_HEAD_REPO" \
            --expected-head-ref "$EXPECTED_HEAD_REF" \
            --expected-head "$EXPECTED_HEAD"
