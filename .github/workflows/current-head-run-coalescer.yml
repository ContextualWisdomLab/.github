name: Current Head Run Coalescer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: current-head-run-coalescer-${{ github.repository }}-${{ github.event.pull_request.number }}
  # The active worker must finish because it retires redundant runs that consume
  # the shared Actions ceiling. A later synchronize event must not kill it.
  cancel-in-progress: false
  # Keep exactly one pending successor. GitHub replaces that pending run when a
  # newer event enters the group, so the retained successor always represents
  # the latest head instead of accumulating up to 100 stale-head invocations.
  # The script still verifies the event-bound expected head against the live PR
  # before any mutation and fails closed if the head moved again.
  queue: single

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  coalesce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control-plane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Retire redundant queued exact-head runs
        env:
          GH_TOKEN: ${{ github.token }}
          COALESCE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/current_head_run_coalescer.py \
            --repo "$COALESCE_REPO" \
            --pr-number "$PR_NUMBER" \
            --expected-head-repo "$EXPECTED_HEAD_REPO" \
            --expected-head-ref "$EXPECTED_HEAD_REF" \
            --expected-head "$EXPECTED_HEAD"
