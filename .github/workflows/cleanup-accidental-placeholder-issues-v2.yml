name: Clean exact accidental placeholder issues v2

on:
  push:
    branches:
      - feat/review-agent-mention-router-main
    paths:
      - .github/workflows/cleanup-accidental-placeholder-issues-v2.yml

permissions:
  contents: read

concurrency:
  group: cleanup-accidental-placeholder-issues-v2
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/feat/review-agent-mention-router-main'
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Close only exact accidental placeholders and remove accidental assignee
        env:
          API_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "ContextualWisdomLab/.github"
          token = os.environ["API_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=24)

          def request(method: str, endpoint: str, payload: dict[str, object] | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              call = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "cwl-exact-placeholder-cleanup-v2",
                  },
              )
              try:
                  with urllib.request.urlopen(call, timeout=30) as response:
                      raw = response.read()
                      return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as error:
                  if method == "DELETE" and error.code in {404, 422}:
                      return None
                  raise

          query = urllib.parse.urlencode(
              {
                  "state": "open",
                  "creator": "seonghobae",
                  "sort": "created",
                  "direction": "desc",
                  "per_page": "100",
              }
          )
          issues = request("GET", f"/issues?{query}") or []
          closed: list[int] = []
          for issue in issues:
              if "pull_request" in issue:
                  continue
              created_at = dt.datetime.fromisoformat(issue["created_at"].replace("Z", "+00:00"))
              if created_at < cutoff:
                  continue
              if issue.get("title") != "dummy":
                  continue
              if (issue.get("body") or "").strip() != "dummy":
                  continue
              if issue.get("user", {}).get("login") != "seonghobae":
                  continue
              number = int(issue["number"])
              request(
                  "PATCH",
                  f"/issues/{number}",
                  {"state": "closed", "state_reason": "not_planned"},
              )
              closed.append(number)

          request(
              "DELETE",
              "/issues/794/assignees",
              {"assignees": ["coderabbitai"]},
          )
          print(f"closed_exact_placeholder_issues={len(closed)}")
          PY

      - name: Remove the cleanup workflow and publish exact tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: feat/review-agent-mention-router-main
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm -f .github/workflows/cleanup-accidental-placeholder-issues-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::Cleanup workflow was not removed.'; exit 1; }
          git commit -m "chore: remove exact placeholder cleanup workflow"
          test -n "$PUSH_TOKEN"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
