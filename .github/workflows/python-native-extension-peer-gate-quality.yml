name: Python Native Extension Peer Gate Quality

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/python-native-extension-peer-gate-quality.yml"
      - "scripts/ci/python_native_extension_peer_gate.py"
      - "tests/test_python_native_extension_peer_gate.py"
      - "tests/test_python_native_extension_peer_gate_workflow_contract.py"
      - "requirements-opencode-review-ci-hashes.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-native-extension-peer-gate-quality.yml"
      - "scripts/ci/python_native_extension_peer_gate.py"
      - "tests/test_python_native_extension_peer_gate.py"
      - "tests/test_python_native_extension_peer_gate_workflow_contract.py"
      - "requirements-opencode-review-ci-hashes.txt"

concurrency:
  group: python-native-extension-peer-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-310-compatibility:
    name: Python 3.10 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Compile production and contracts
        run: python -m py_compile scripts/ci/python_native_extension_peer_gate.py tests/test_python_native_extension_peer_gate.py tests/test_python_native_extension_peer_gate_workflow_contract.py

  python-314-quality:
    name: Python 3.14 tests, coverage, and docstrings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact workflow source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt
      - name: Install exact hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt
      - name: Run focused behavior and workflow contracts
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q tests/test_python_native_extension_peer_gate.py tests/test_python_native_extension_peer_gate_workflow_contract.py
          python -m coverage report --include=scripts/ci/python_native_extension_peer_gate.py --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci/python_native_extension_peer_gate.py
          python -m compileall -q scripts/ci/python_native_extension_peer_gate.py tests/test_python_native_extension_peer_gate.py tests/test_python_native_extension_peer_gate_workflow_contract.py
          git diff --check
