name: Apply OpenCode draft review handoff fix

on:
  push:
    branches: [fix/opencode-draft-review-handoff-911]
    paths: [.github/workflows/apply-opencode-draft-review-handoff-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/opencode-draft-review-handoff-911
          fetch-depth: 0
          persist-credentials: true

      - name: Establish RED and apply the causal repair
        env:
          PACKED_TEST: 
          PACKED_JOB: 
          PACKED_HANDOFF: 
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import subprocess
          import sys
          import zlib

          def unpack(name: str) -> str:
              return zlib.decompress(base64.b64decode(name)).decode("utf-8")

          root = Path.cwd()
          test_path = root / "tests/test_required_opencode_draft_review_dispatch.py"
          test_path.write_text(unpack(__import__("os").environ["PACKED_TEST"]), encoding="utf-8")
          red = subprocess.run(
              [sys.executable, str(test_path)],
              cwd=root,
              text=True,
              capture_output=True,
              check=False,
          )
          print(red.stdout, end="")
          print(red.stderr, end="", file=sys.stderr)
          if red.returncode == 0:
              raise SystemExit("regression test unexpectedly passed before repair")
          print(f"Expected RED established with return code {red.returncode}.")

          required_path = root / ".github/workflows/opencode-review.yml"
          required = required_path.read_text(encoding="utf-8")
          insert_before = "  opencode-review-target:\n"
          if "  request-draft-opencode-review:\n" in required:
              raise SystemExit("draft handoff job already exists")
          if required.count(insert_before) != 1:
              raise SystemExit("required workflow insertion marker is missing or ambiguous")
          required_path.write_text(
              required.replace(
                  insert_before,
                  unpack(__import__("os").environ["PACKED_JOB"]) + insert_before,
                  1,
              ),
              encoding="utf-8",
          )

          handoff_path = root / ".github/workflows/required-opencode-review.yml"
          if handoff_path.exists():
              raise SystemExit("central draft handoff workflow already exists")
          handoff_path.write_text(
              unpack(__import__("os").environ["PACKED_HANDOFF"]),
              encoding="utf-8",
          )
          PY

      - name: Verify focused regression and unchanged adjacent contracts
        run: |
          set -euo pipefail
          python3 tests/test_required_opencode_draft_review_dispatch.py
          python3 -m compileall -q tests/test_required_opencode_draft_review_dispatch.py
          python3 - <<'PY'
          from pathlib import Path
          required = Path(".github/workflows/opencode-review.yml").read_text(encoding="utf-8")
          assert required.count("  request-draft-opencode-review:") == 1
          assert required.count("  opencode-review-target:") == 1
          assert "a current-head OpenCode verdict is not required until it is marked ready for review" in required
          central = Path(".github/workflows/required-opencode-review.yml").read_text(encoding="utf-8")
          assert central.count('event_type: "merge-scheduler"') == 1
          PY
          git diff --check

      - name: Commit tested production files and remove the temporary writer
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-opencode-draft-review-handoff-fix.yml
          git add .github/workflows/opencode-review.yml             .github/workflows/required-opencode-review.yml             tests/test_required_opencode_draft_review_dispatch.py             .github/workflows/apply-opencode-draft-review-handoff-fix.yml
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git commit -m "fix(opencode): dispatch substantive reviews for draft heads"
          git push origin HEAD:fix/opencode-draft-review-handoff-911
