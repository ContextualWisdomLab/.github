name: Repair PR 939 Strix Scope Guidance

on:
  push:
    branches:
      - codex/fix-cross-repo-opencode-evidence
    paths:
      - .github/workflows/repair-pr939-strix-scope.yml

permissions:
  contents: write

concurrency:
  group: repair-pr939-strix-scope
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: codex/fix-cross-repo-opencode-evidence
          fetch-depth: 0

      - name: Add bounded-scope guidance and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          script_path = Path("scripts/ci/strix_quick_gate.sh")
          script = script_path.read_text(encoding="utf-8")

          replacements = (
              (
                  'LAST_PULL_REQUEST_SCOPE_DIR=""\n'
                  'TARGET_PATH_IS_INTERNAL_PR_SCOPE=0\n\n'
                  'resolve_trusted_input_file() {',
                  'LAST_PULL_REQUEST_SCOPE_DIR=""\n'
                  'TARGET_PATH_IS_INTERNAL_PR_SCOPE=0\n'
                  'INTERNAL_PR_SCOPE_INSTRUCTION="This target is a deliberately bounded pull-request changed-file scope mounted by Strix under /workspace/<workspace_subdir>. The original GitHub Actions runner host path is intentionally absent inside the sandbox, and that absence is not a vulnerability. Treat the files in the current working directory as the complete authorized target for this quick changed-path scan. Inspect the available workflow, shell, Python, and configuration files for actionable content vulnerabilities. Do not report the missing host path or intentional scope bounding as a target-code vulnerability."\n\n'
                  'resolve_trusted_input_file() {',
              ),
              (
                  '\tlocal llm_api_base_value\n'
                  '\tlocal child_model\n'
                  '\tlocal resolved_target_path\n',
                  '\tlocal llm_api_base_value\n'
                  '\tlocal child_model\n'
                  '\tlocal child_instruction=""\n'
                  '\tlocal resolved_target_path\n',
              ),
              (
                  '\tif ! resolved_target_path="$(resolve_current_target_path "$TARGET_PATH")"; then\n'
                  '\t\treturn 1\n'
                  '\tfi\n'
                  '\tlocal start_epoch\n',
                  '\tif ! resolved_target_path="$(resolve_current_target_path "$TARGET_PATH")"; then\n'
                  '\t\treturn 1\n'
                  '\tfi\n'
                  '\tif [ "$TARGET_PATH_IS_INTERNAL_PR_SCOPE" -eq 1 ]; then\n'
                  '\t\tchild_instruction="$INTERNAL_PR_SCOPE_INSTRUCTION"\n'
                  '\tfi\n'
                  '\tlocal start_epoch\n',
              ),
              (
                  '\tSTRIX_CHILD_REQUIRE_EXECUTABLE_INTEGRITY="${IS_PR_EVIDENCE_RUN:-false}" \\\n'
                  '\tpython3 - "$timeout_seconds" "$resolved_target_path" "$SCAN_MODE" "$STRIX_LOG" <<\'PY\'\n',
                  '\tSTRIX_CHILD_REQUIRE_EXECUTABLE_INTEGRITY="${IS_PR_EVIDENCE_RUN:-false}" \\\n'
                  '\tSTRIX_CHILD_INSTRUCTION="$child_instruction" \\\n'
                  '\tpython3 - "$timeout_seconds" "$resolved_target_path" "$SCAN_MODE" "$STRIX_LOG" <<\'PY\'\n',
              ),
              (
                  'command = [resolved_strix_bin, "-n", "-t", ".", "--scan-mode", scan_mode]\n\n'
                  'try:\n',
                  'command = [resolved_strix_bin, "-n", "-t", ".", "--scan-mode", scan_mode]\n'
                  'instruction = os.environ.get("STRIX_CHILD_INSTRUCTION", "").strip()\n'
                  'if instruction:\n'
                  '    command.extend(["--instruction", instruction])\n\n'
                  'try:\n',
              ),
          )

          for old, new in replacements:
              count = script.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one patch anchor, found {count}: {old[:120]!r}"
                  )
              script = script.replace(old, new, 1)

          script_path.write_text(script, encoding="utf-8")

          test_source = dedent(
              '''\
              """Protect Strix's interpretation of bounded pull-request scan targets."""

              from pathlib import Path
              import unittest


              SCRIPT_PATH = Path("scripts/ci/strix_quick_gate.sh")


              class InternalScopeInstructionContractTests(unittest.TestCase):
                  """Keep static sandbox guidance scoped to trusted PR materialization."""

                  @classmethod
                  def setUpClass(cls) -> None:
                      """Load the gate implementation once for contract assertions."""
                      cls.script = SCRIPT_PATH.read_text(encoding="utf-8")

                  def test_guidance_explains_the_sandbox_mount_contract(self) -> None:
                      """Tell Strix why the runner host path is absent without hiding code."""
                      self.assertIn(
                          "deliberately bounded pull-request changed-file scope",
                          self.script,
                      )
                      self.assertIn("/workspace/<workspace_subdir>", self.script)
                      self.assertIn("host path is intentionally absent", self.script)
                      self.assertIn("complete authorized target", self.script)
                      self.assertIn("actionable content vulnerabilities", self.script)

                  def test_guidance_is_only_selected_for_internal_pr_scope(self) -> None:
                      """Never relay caller-controlled instructions to the security agent."""
                      self.assertIn(
                          'if [ "$TARGET_PATH_IS_INTERNAL_PR_SCOPE" -eq 1 ]; then',
                          self.script,
                      )
                      self.assertIn(
                          'child_instruction="$INTERNAL_PR_SCOPE_INSTRUCTION"',
                          self.script,
                      )
                      self.assertIn('local child_instruction=""', self.script)
                      self.assertNotIn(
                          'STRIX_CHILD_INSTRUCTION="${STRIX_INSTRUCTION',
                          self.script,
                      )

                  def test_child_process_receives_the_static_cli_instruction(self) -> None:
                      """Forward the trusted guidance through the stripped child environment."""
                      self.assertIn(
                          'STRIX_CHILD_INSTRUCTION="$child_instruction"',
                          self.script,
                      )
                      self.assertIn(
                          'instruction = os.environ.get("STRIX_CHILD_INSTRUCTION", "").strip()',
                          self.script,
                      )
                      self.assertIn(
                          'command.extend(["--instruction", instruction])',
                          self.script,
                      )


              if __name__ == "__main__":
                  unittest.main()
              '''
          )
          Path("tests/test_strix_internal_scope_instruction_contract.py").write_text(
              test_source,
              encoding="utf-8",
          )
          PY

      - name: Verify the Strix gate repair
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/strix_quick_gate.sh
          python3 -m unittest discover \
            --start-directory tests \
            --pattern 'test_strix_internal_scope_instruction_contract.py' \
            --verbose
          bash scripts/ci/test_strix_quick_gate.sh

      - name: Commit the verified repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/repair-pr939-strix-scope.yml
          git config user.name "opencode-agent[bot]"
          git config user.email "219766164+opencode-agent[bot]@users.noreply.github.com"
          git add scripts/ci/strix_quick_gate.sh \
            tests/test_strix_internal_scope_instruction_contract.py \
            .github/workflows/repair-pr939-strix-scope.yml
          git commit -m "fix(strix): orient bounded CI scope inside sandbox"
          git push origin HEAD:codex/fix-cross-repo-opencode-evidence
