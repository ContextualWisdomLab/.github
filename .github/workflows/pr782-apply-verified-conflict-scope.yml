name: Apply verified PR 782 conflict scope

on:
  push:
    branches:
      - fix/hourly-nvidia-nim-review-repair-main
    paths:
      - .github/workflows/pr782-apply-verified-conflict-scope.yml

permissions:
  contents: read

concurrency:
  group: pr782-apply-verified-conflict-scope
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/hourly-nvidia-nim-review-repair-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact branch state and repair source
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m py_compile scripts/ci/pr782_apply_verified_conflict_scope.py

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply permanent reviewed changes
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/ci/pr782_apply_verified_conflict_scope.py
          git diff --check

      - name: Verify behavior, branch coverage, docstrings, and workflow order
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate --fail-under 100 scripts/ci/pr_review_conflict_scope.py
          python -m compileall -q \
            scripts/ci/pr_review_conflict_scope.py \
            tests/test_pr_review_conflict_scope.py
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr-review-autofix.yml').read_text(encoding='utf-8')
          merge = workflow.index('git merge --no-commit --no-ff "$PR_BASE_SHA"')
          snapshot = workflow.index('pr_review_conflict_scope.py" snapshot')
          model = workflow.index('title "PR #${PR_NUMBER} merge conflict resolution"')
          verify = workflow.index('pr_review_conflict_scope.py" verify')
          staging = workflow.index('# Fail closed: never push unresolved conflict markers.')
          if not merge < snapshot < model < verify < staging:
              raise SystemExit('conflict-scope workflow order is invalid')
          PY
          git diff --check

      - name: Remove every one-time PR 782 repair artifact
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -f \
            .github/workflows/export-pr782-source.yml \
            .github/workflows/finalize-pr782-conflict-scope.yml \
            .github/workflows/one-shot-pr782-conflict-scope-repair.yml \
            .github/workflows/pr782-apply-verified-conflict-scope.yml \
            .github/workflows/reopen-finalize-pr782.yml \
            .github/workflows/repair-pr782-conflict-scope.yml \
            scripts/ci/pr782_apply_verified_conflict_scope.py \
            scripts/ci/repair_pr782_conflict_scope_once.py
          git diff --check

      - name: Publish exact verified tree with a lease
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/hourly-nvidia-nim-review-repair-main
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No verified PR 782 repair generated.' >&2; exit 1; }
          git commit -m "fix(automation): enforce conflict repair write scope"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
