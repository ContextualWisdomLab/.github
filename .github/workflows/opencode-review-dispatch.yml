              local byte_limit="$2"
              local section_file
              local section_bytes
              section_file="$(mktemp)"
              awk -v wanted="## ${section_title}" '
                $0 == wanted { emit = 1; print; next }
                emit && /^## / { exit }
                emit { print }
              ' "$OPENCODE_EVIDENCE_FILE" >"$section_file"
