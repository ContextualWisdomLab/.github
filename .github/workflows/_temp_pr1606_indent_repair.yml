name: Temporary PR1606 generator indentation repair

on:
  push:
    branches:
      - fix/noema-truncated-completion-contract-20260901

concurrency:
  group: temp-pr1606-indent-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Repair generated call_llm block indentation
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${WORKFLOW_PUSH_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/reconcile-pr1606-current-main.yml')
          text = path.read_text()
          start_marker = "          parse_block = '''"
          end_marker = "\n          '''\n          text = text[:parse_start] + parse_block + text[parse_end:]"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = block.splitlines(keepends=True)
          if not lines or 'raw = decode_llm_response_body(raw_bytes)' not in lines[0]:
              raise SystemExit('unexpected parse_block anchor')
          repaired = [lines[0]]
          for line in lines[1:]:
              if line.strip() and not line.startswith('  '):
                  raise SystemExit(f'unexpected generated indentation: {line!r}')
              repaired.append(line[2:] if line.startswith('  ') else line)
          repaired_block = ''.join(repaired)
          if repaired_block == block:
              raise SystemExit('parse_block indentation was already repaired')
          text = text[:start] + repaired_block + text[end:]
          if "\n  workflow_dispatch:\n" not in text:
              trigger_anchor = "on:\n  push:\n"
              if text.count(trigger_anchor) != 1:
                  raise SystemExit('unexpected reconcile workflow trigger shape')
              text = text.replace(
                  trigger_anchor,
                  "on:\n  workflow_dispatch:\n  push:\n",
                  1,
              )
          path.write_text(text)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/reconcile-pr1606-current-main.yml
          git rm .github/workflows/_temp_pr1606_indent_repair.yml
          git diff --cached --check
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git commit -m "ci: fix PR 1606 generated source indentation"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WORKFLOW_PUSH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/reconcile-pr1606-current-main.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
