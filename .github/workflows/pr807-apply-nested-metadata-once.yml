name: PR 807 Apply Nested npm Metadata Once

on:
  push:
    branches:
      - fix/npm-nested-metadata-lock-validation
    paths:
      - .github/workflows/pr807-apply-nested-metadata-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/npm-nested-metadata-lock-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Refuse concurrent branch movement
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: fix/npm-nested-metadata-lock-validation
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply reviewed implementation
        run: |
          python scripts/ci/apply_pr807_nested_metadata.py
          rm -- scripts/ci/apply_pr807_nested_metadata.py
          git diff --check

      - name: Verify focused and complete quality evidence
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_npm_nested_metadata_lock_validation.py
          python -m coverage report \
            --include=scripts/ci/materialize_base_javascript_packages.py \
            --show-missing \
            --fail-under=100
          python -m interrogate --fail-under 100 scripts/ci/materialize_base_javascript_packages.py
          python -m compileall -q \
            scripts/ci/materialize_base_javascript_packages.py \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_npm_nested_metadata_lock_validation.py
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing --fail-under=100
          git diff --check

      - name: Commit permanent non-workflow implementation
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: fix/npm-nested-metadata-lock-validation
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
          expected="$(printf '%s\n' \
            'CHANGELOG.md' \
            'docs/doctoring/npm-nested-metadata-canonical-pins.md' \
            'scripts/ci/apply_pr807_nested_metadata.py' \
            'scripts/ci/materialize_base_javascript_packages.py' | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CHANGELOG.md \
            docs/doctoring/npm-nested-metadata-canonical-pins.md \
            scripts/ci/apply_pr807_nested_metadata.py \
            scripts/ci/materialize_base_javascript_packages.py
          git commit -m "fix(coverage): validate nested npm metadata through canonical pins"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
