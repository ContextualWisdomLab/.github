name: Repair PR 790 nested lock discovery

on:
  push:
    branches:
      - fix/trusted-uv-transient-download-retry
    paths:
      - .github/workflows/repair-pr790-nested-lock.yml

permissions:
  contents: write

concurrency:
  group: repair-pr790-nested-lock
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github' && github.ref == 'refs/heads/fix/trusted-uv-transient-download-retry'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/trusted-uv-transient-download-retry
          fetch-depth: 1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply bounded production repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/materialize_base_python_requirements.py')
          text = path.read_text(encoding='utf-8')
          old = '        if _is_candidate_lock_name(candidate.name):\n'
          new = '        if _is_candidate_lock_path(candidate):\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy candidate-name predicate')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify focused regression
        run: |
          python -m pytest \
            tests/test_nested_requirements_lock_discovery.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_trusted_git_executable.py \
            tests/test_materialize_output_directory_security.py \
            tests/test_materialize_fifo_output_security.py \
            -q

      - name: Verify complete central suite and coverage
        run: |
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report --fail-under=100
          python -m interrogate -vv --fail-under 100 scripts/ci
          python -m compileall -q scripts/ci tests
          git diff --check

      - name: Commit verified repair and remove one-shot workflow
        run: |
          rm .github/workflows/repair-pr790-nested-lock.yml
          git add scripts/ci/materialize_base_python_requirements.py .github/workflows/repair-pr790-nested-lock.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(coverage): collect requirements-directory locks'
          git push origin HEAD:fix/trusted-uv-transient-download-retry
