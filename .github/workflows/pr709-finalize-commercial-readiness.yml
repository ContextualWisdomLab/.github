name: PR 709 finalize commercial readiness

on:
  push:
    branches:
      - ops/naruon-hourly-commercial-readiness-20260803

permissions:
  contents: read

concurrency:
  group: pr-709-finalize-commercial-readiness
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ops/naruon-hourly-commercial-readiness-20260803
          fetch-depth: 0

      - name: Materialize final least-privilege workflows and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          HOURLY = ROOT / '.github/workflows/naruon-commercial-readiness-hourly.yml'
          DEVELOPMENT = ROOT / '.github/workflows/naruon-commercial-readiness-development.yml'
          CONTRACT = ROOT / 'tests/test_naruon_commercial_readiness_hourly_contract.py'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one source block, found {text.count(old)}')
              return text.replace(old, new, 1)

          def remove_once(text: str, value: str, label: str) -> str:
              if value not in text:
                  return text
              if text.count(value) != 1:
                  raise SystemExit(f'{label}: expected one removable block, found {text.count(value)}')
              return text.replace(value, '', 1)

          hourly = HOURLY.read_text(encoding='utf-8')
          hourly = replace_once(hourly, '  orchestrate:\n    runs-on: ubuntu-latest\n    permissions:\n', '  orchestrate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    permissions:\n', 'hourly timeout')
          hourly = replace_once(hourly, '      actions: write\n      contents: write\n      pull-requests: read\n', '      actions: write\n      contents: read\n      pull-requests: read\n', 'hourly permissions')
          hourly = remove_once(hourly, '      GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}\n', 'hourly job credential')
          hourly = replace_once(hourly, '      - name: Read live pull request queue\n        id: queue\n        run: |\n', '      - name: Read live pull request queue\n        id: queue\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n', 'queue read token')
          hourly = replace_once(hourly, '      - name: Dispatch review feedback fixes\n        run: |\n', '      - name: Dispatch review feedback fixes\n        env:\n          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || \'\' }}\n        run: |\n', 'fix dispatch token')
          hourly = replace_once(hourly, '      - name: Dispatch current-head review and merge processing\n        run: |\n', '      - name: Dispatch current-head review and merge processing\n        env:\n          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || \'\' }}\n        run: |\n', 'merge dispatch token')
          hourly = replace_once(hourly, '        env:\n          OPEN_PR_COUNT: ${{ steps.queue.outputs.count }}\n        run: |\n', '        env:\n          GH_TOKEN: ${{ github.token }}\n          OPEN_PR_COUNT: ${{ steps.queue.outputs.count }}\n        run: |\n', 'development decision token')
          hourly = replace_once(hourly, "      - name: Dispatch one buyer-visible product gap\n        if: steps.development.outputs.decision == 'dispatch'\n        run: |\n", "      - name: Dispatch one buyer-visible product gap\n        if: steps.development.outputs.decision == 'dispatch'\n        env:\n          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || '' }}\n        run: |\n", 'development dispatch token')
          for marker in ('fix-payload.json', 'merge-payload.json', 'development-payload.json'):
              anchor = f'          set -euo pipefail\n          cat >"$RUNNER_TEMP/{marker}"'
              replacement = '          set -euo pipefail\n          if [ -z "${GH_TOKEN:-}" ]; then\n            echo "::error::No central dispatch credential is available."\n            exit 1\n          fi\n' + f'          cat >"$RUNNER_TEMP/{marker}"'
              hourly = replace_once(hourly, anchor, replacement, f'{marker} credential gate')
          HOURLY.write_text(hourly, encoding='utf-8')

          development = DEVELOPMENT.read_text(encoding='utf-8')
          development = replace_once(development, '    permissions:\n      actions: write\n      contents: write\n      id-token: write\n', '    permissions:\n      contents: read\n      id-token: write\n', 'development permissions')
          development = replace_once(development, '          target_token="$PAT_TOKEN"\n          if [ -z "$target_token" ]; then\n            target_token="$APP_TOKEN"\n          fi\n', '          target_token="$APP_TOKEN"\n          if [ -z "$target_token" ]; then\n            target_token="$PAT_TOKEN"\n          fi\n', 'app-token priority')
          development = remove_once(development, '          GITHUB_TOKEN: ${{ steps.target_credential.outputs.token }}\n', 'agent target credential')
          development = remove_once(development, '          USE_GITHUB_TOKEN: "true"\n', 'agent GitHub integration flag')
          old_guard = '''          git add -N -- .
          mapfile -t changed_files < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } \
              | sort -u
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "has_changes=false" >>"$GITHUB_OUTPUT"
            echo "Agent produced no safe repository change."
            exit 0
          fi
          echo "has_changes=true" >>"$GITHUB_OUTPUT"

          changed_file_count="${#changed_files[@]}"
          changed_lines="$(
            git diff --numstat \
              | awk '{added += $1; deleted += $2} END {print added + deleted + 0}'
          )"
'''
          new_guard = '''          git add -A -N
          git add -A
          mapfile -t changed_files < <(
            git diff --cached --name-only | sort -u
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "has_changes=false" >>"$GITHUB_OUTPUT"
            echo "Agent produced no safe repository change."
            exit 0
          fi
          echo "has_changes=true" >>"$GITHUB_OUTPUT"

          if git diff --cached --numstat \
            | awk '$1 == "-" || $2 == "-" {found=1} END {exit !found}'; then
            echo "::error::Binary changes are outside the bounded autonomous product-edit contract."
            exit 1
          fi
          changed_file_count="${#changed_files[@]}"
          new_file_count="$(
            git diff --cached --name-only --diff-filter=A \
              | awk 'NF {count += 1} END {print count + 0}'
          )"
          changed_lines="$(
            git diff --cached --numstat \
              | awk '{added += $1; deleted += $2} END {print added + deleted + 0}'
          )"
'''
          development = replace_once(development, old_guard, new_guard, 'bounded change accounting')
          old_regex = '''          if grep -Eq \
            '(^\\.github/workflows/|^\\.env|(^|/)(AGENTS|CLAUDE)\\.md$|(^|/)opencode\\.jsonc$|(^|/)agent-prompt\\.md$|\\.(pem|key|p12|pfx)$|(^|/)(package\\.json|pnpm-lock\\.yaml|pyproject\\.toml|uv\\.lock|requirements[^/]*)$)' \
            "$RUNNER_TEMP/changed-files.txt"; then
'''
          new_regex = '''          if grep -Eq \
            '(^\\.github/|^\\.env|^infra/|^deploy/|^k8s/|^SECURITY\\.md$|^\\.gitmodules$|(^|/)CODEOWNERS$|(^|/)(AGENTS|CLAUDE)\\.md$|(^|/)opencode\\.jsonc$|(^|/)agent-prompt\\.md$|(^|/)(Dockerfile|Containerfile)(\\..*)?$|(^|/)docker-compose.*\\.ya?ml$|^render\\.yaml$|\\.(pem|key|p12|pfx)$|(^|/)(package(-lock)?\\.json|pnpm-lock\\.yaml|yarn\\.lock|bun\\.lockb|pyproject\\.toml|uv\\.lock|requirements[^/]*|Cargo\\.toml|Cargo\\.lock|go\\.mod|go\\.sum|pom\\.xml|build\\.gradle(\\.kts)?)$)' \
            "$RUNNER_TEMP/changed-files.txt"; then
'''
          development = replace_once(development, old_regex, new_regex, 'control-plane exclusion')
          development = replace_once(development, '          if git diff --unified=0 | grep -Eqi \\\n', '          if git diff --cached --unified=0 | grep -Eqi \\\n', 'cached secret scan')
          development = replace_once(development, '          git diff --check\n', '          git diff --cached --check\n', 'cached diff check')
          development = replace_once(development, '            echo "changed_file_count=$changed_file_count"\n            echo "changed_lines=$changed_lines"\n', '            echo "changed_file_count=$changed_file_count"\n            echo "new_file_count=$new_file_count"\n            echo "changed_lines=$changed_lines"\n', 'new-file evidence')
          development = replace_once(development, '          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}\n          PR_NUMBER:', '          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || \'\' }}\n          PR_NUMBER:', 'trusted central dispatch token')
          development = replace_once(development, '          set -euo pipefail\n          jq -n \\\n', '          set -euo pipefail\n          if [ -z "${GH_TOKEN:-}" ]; then\n            echo "::error::No central review-dispatch credential is available."\n            exit 1\n          fi\n          jq -n \\\n', 'central dispatch credential gate')
          DEVELOPMENT.write_text(development, encoding='utf-8')

          contract = CONTRACT.read_text(encoding='utf-8')
          replacements = {
              "assert 'review_dispatch_limit: \"-1\"' in workflow": "assert '\"review_dispatch_limit\": \"-1\"' in workflow",
              "assert 'stale_opencode_minutes: \"60\"' in workflow": "assert '\"stale_opencode_minutes\": \"60\"' in workflow",
              "assert 'merge_mode: \"direct_or_auto\"' in workflow": "assert '\"merge_mode\": \"direct_or_auto\"' in workflow",
          }
          for old, new in replacements.items():
              contract = contract.replace(old, new)
          CONTRACT.write_text(contract, encoding='utf-8')

          for relative in (
              '.github/workflows/pr709-commercial-readiness-hardening-v2.yml',
              '.github/workflows/pr709-least-privilege-repair.yml',
              'scripts/ci/bootstrap_naruon_commercial_readiness_hardening_v2.py',
              '.github/workflows/pr709-finalize-commercial-readiness.yml',
          ):
              (ROOT / relative).unlink(missing_ok=True)
          PY

      - name: Validate final workflow syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.safe_load(File.read(path), aliases: true) }' \
            .github/workflows/naruon-commercial-readiness-hourly.yml \
            .github/workflows/naruon-commercial-readiness-development.yml
          python -m pytest -q \
            tests/test_naruon_commercial_readiness_hourly_contract.py \
            tests/test_required_workflow_queue_contract.py
          python -m pytest -q
          git diff --check
          test ! -e .github/workflows/pr709-commercial-readiness-hardening-v2.yml
          test ! -e .github/workflows/pr709-least-privilege-repair.yml
          test ! -e scripts/ci/bootstrap_naruon_commercial_readiness_hardening_v2.py
          test ! -e .github/workflows/pr709-finalize-commercial-readiness.yml
          agent_block="$(sed -n '/name: Run one commercial-readiness implementation slice/,/name: Validate bounded changed-file/p' .github/workflows/naruon-commercial-readiness-development.yml)"
          ! grep -q 'GITHUB_TOKEN:' <<<"$agent_block"
          ! grep -q 'USE_GITHUB_TOKEN:' <<<"$agent_block"

      - name: Commit verified finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(automation): enforce least-privilege hourly loop"
          git push origin HEAD:ops/naruon-hourly-commercial-readiness-20260803
