name: Repair PR1588 runner bootstrap

on:
  push:
    branches: [fix/strix-control-plane-supersession-20260901]
    paths: [.github/repair-pr1588.trigger]

permissions:
  contents: write
  pull-requests: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/strix-control-plane-supersession-20260901
          fetch-depth: 0
      - name: Rebind the exact-head repair helper and remove this bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_branch='fix/strix-control-plane-supersession-20260901'
          starting_head="$(git rev-parse HEAD)"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1588" --jq '.head.sha')"
          test "$live_head" = "$starting_head"

          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'

          python3 <<'PY'
          import os
          from pathlib import Path

          helper = Path('.github/workflows/repair-pr1588-exact-head.yml')
          text = helper.read_text(encoding='utf-8')
          old = '    runs-on: ubuntu-latest\n'
          new = '    runs-on: ubuntu-24.04\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('unexpected repair helper runner selector')
          helper.write_text(text, encoding='utf-8')

          trigger = Path('.github/repair-pr1588.trigger')
          trigger.write_text(
              trigger.read_text(encoding='utf-8')
              + f'bootstrap_run={os.environ["GITHUB_RUN_ID"]}\n',
              encoding='utf-8',
          )
          Path('.github/workflows/repair-pr1588-runner-bootstrap.yml').unlink()
          PY

          git diff --check
          latest_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1588" --jq '.head.sha')"
          test "$latest_head" = "$starting_head"
          git add -A
          git commit -m 'ci: move PR1588 repair helper to ubuntu-24.04'
          git push origin "HEAD:${target_branch}"

          for branch in \
            tmp-pr1588-runner-bootstrap \
            tmp-pr1588-runner-bootstrap-2 \
            tmp-pr1588-runner-bootstrap-3 \
            tmp-pr1588-runner-bootstrap-4 \
            tmp-pr1588-runner-bootstrap-5 \
            tmp-pr1588-runner-bootstrap-6 \
            tmp-pr1588-runner-bootstrap-7 \
            tmp-pr1588-runner-bootstrap-8
          do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
