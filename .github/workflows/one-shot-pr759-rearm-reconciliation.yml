name: One-shot PR759 reconciliation rearm

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/one-shot-pr759-rearm-reconciliation.yml

permissions:
  contents: read

concurrency:
  group: one-shot-pr759-reconciliation-rearm
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rearm:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.actor == 'seonghobae'
      && github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind reconciliation to this exact parent and remove rearm workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: fix/opencode-coverage-failure-diagnostics
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -I - "$EXPECTED_HEAD" <<'PY'
          from pathlib import Path
          import re
          import sys

          head = sys.argv[1]
          path = Path('.github/workflows/export-pr759-merge-workspaces.yml')
          source = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'(?m)^(\s*EXPECTED_PARENT_SHA:) [0-9a-f]{40}$',
              rf'\1 {head}',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('expected one reconciliation parent binding')
          path.write_text(updated, encoding='utf-8')
          PY
          rm .github/workflows/one-shot-pr759-rearm-reconciliation.yml
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: rearm PR 759 merge reconciliation'
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:${HEAD_BRANCH}"
