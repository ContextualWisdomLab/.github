name: One-shot PR 921 OSV version comment repair

on:
  push:
    branches:
      - dependabot/github_actions/main/google/osv-scanner-action/osv-scanner-action-f4cfcc01edc9c8b756a9b873b7a623ca674da51e

permissions:
  contents: write

concurrency:
  group: one-shot-pr921-osv-version-comments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'seonghobae'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Repair and verify OSV version traceability
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_head="$(
            git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${BRANCH_NAME}" | cut -f1
          )"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "::notice::Branch advanced from ${EXPECTED_HEAD} to ${remote_head}; a newer repair owns publication."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/security-scan.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          action_sha = 'f4cfcc01edc9c8b756a9b873b7a623ca674da51e'
          old = (
              'uses: google/osv-scanner-action/osv-scanner-action@'
              f'{action_sha} # v2.3.8'
          )
          new = (
              'uses: google/osv-scanner-action/osv-scanner-action@'
              f'{action_sha} # v2.5.0'
          )
          if workflow.count(old) != 4:
              raise SystemExit(
                  f'expected exactly four stale OSV action comments, found {workflow.count(old)}'
              )
          repaired = workflow.replace(old, new)
          if repaired.count(new) != 4 or old in repaired:
              raise SystemExit('OSV action version-comment replacement was incomplete')
          workflow_path.write_text(repaired, encoding='utf-8')

          test_path = Path('tests/test_osv_scanner_action_version_comment.py')
          test_path.write_text(
              '''"""Contract tests for OSV scanner action version traceability."""\n\n'
              'from pathlib import Path\n\n\n'
              '_REPOSITORY_ROOT = Path(__file__).resolve().parents[1]\n'
              '_WORKFLOW_PATH = _REPOSITORY_ROOT / ".github" / "workflows" / "security-scan.yml"\n'
              '_ACTION_SHA = "f4cfcc01edc9c8b756a9b873b7a623ca674da51e"\n\n\n'
              'def test_osv_scanner_action_pin_reports_embedded_release() -> None:\n'
              '    """Every pinned scanner invocation identifies upstream release v2.5.0."""\n'
              '    workflow = _WORKFLOW_PATH.read_text(encoding="utf-8")\n'
              '    pinned_lines = [\n'
              '        line.strip()\n'
              '        for line in workflow.splitlines()\n'
              '        if f"google/osv-scanner-action/osv-scanner-action@{_ACTION_SHA}" in line\n'
              '    ]\n\n'
              '    assert len(pinned_lines) == 4\n'
              '    assert all(line.endswith("# v2.5.0") for line in pinned_lines)\n'
              '    assert f"@{_ACTION_SHA} # v2.3.8" not in workflow\n''',
              encoding='utf-8',
          )
          PY

          rm -f .github/workflows/one-shot-pr921-osv-version-comments.yml
          python3 -m compileall -q tests/test_osv_scanner_action_version_comment.py
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/security-scan.yml').read_text(encoding='utf-8')
          action_sha = 'f4cfcc01edc9c8b756a9b873b7a623ca674da51e'
          lines = [
              line.strip()
              for line in workflow.splitlines()
              if f'google/osv-scanner-action/osv-scanner-action@{action_sha}' in line
          ]
          assert len(lines) == 4
          assert all(line.endswith('# v2.5.0') for line in lines)
          assert f'@{action_sha} # v2.3.8' not in workflow
          PY
          git diff --check

      - name: Publish only the verified bounded repair
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "::notice::No repair remains to publish."
            exit 0
          fi
          remote_head="$(
            git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${BRANCH_NAME}" | cut -f1
          )"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "::notice::Branch advanced before publication; refusing to overwrite newer work."
            exit 0
          fi
          git config user.name 'seonghobae'
          git config user.email '8172694+seonghobae@users.noreply.github.com'
          git add .github/workflows/security-scan.yml \
            tests/test_osv_scanner_action_version_comment.py \
            .github/workflows/one-shot-pr921-osv-version-comments.yml
          git commit -m 'docs(security): align OSV action version traceability'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${BRANCH_NAME}"
