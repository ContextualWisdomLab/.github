# One-shot owner-branch repair; self-deletes after verified fast-forward publication.
name: Temporary PR1674 Strix publication authority repair

on:
  push:
    branches:
      - fix/noema-closed-not-stale
    paths:
      - .github/workflows/_temp_pr1674_status_publication_repair.yml
      - scripts/ci/pr1674_status_publication_repair.py
      - .github/workflows/strix.yml
      - tests/test_strix_repository_dispatch_live_state.py

concurrency:
  group: temp-pr1674-status-publication-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/noema-closed-not-stale'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install hash-locked review dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Revalidate exact writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          test -f scripts/ci/pr1674_status_publication_repair.py
          test -f .github/workflows/_temp_pr1674_status_publication_repair.yml

      - name: Materialize late-bound Strix publication authority
        run: |
          set -euo pipefail
          python scripts/ci/pr1674_status_publication_repair.py
          test ! -e scripts/ci/pr1674_status_publication_repair.py
          test ! -e .github/workflows/_temp_pr1674_status_publication_repair.yml
          git diff --check

      - name: Verify executable Strix live-state contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest \
            tests/test_strix_repository_dispatch_live_state.py \
            tests/test_required_workflow_queue_contract.py \
            -q
          python -m compileall -q tests/test_strix_repository_dispatch_live_state.py
          git diff --check

  publish:
    needs: verify
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/noema-closed-not-stale'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact verified writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate and materialize canonical successor
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 scripts/ci/pr1674_status_publication_repair.py
          test ! -e scripts/ci/pr1674_status_publication_repair.py
          test ! -e .github/workflows/_temp_pr1674_status_publication_repair.yml
          git diff --check

      - name: Publish one non-force canonical successor
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_PUSH_TOKEN"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(strix): revalidate live target before status publication"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
