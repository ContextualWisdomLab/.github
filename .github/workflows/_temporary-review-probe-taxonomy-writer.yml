name: Temporary observed review probe taxonomy writer

on:
  push:
    branches:
      - fix/opencode-observed-defect-probe-taxonomy-20260902

permissions:
  contents: write

jobs:
  red-green-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact writer head without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale writer head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Writer head moved before execution: expected $GITHUB_SHA, observed $remote_head."
            exit 1
          fi

      - name: Install repository-declared hash-locked test toolchain
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Verify RED regression against current production code
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python3 -m pytest tests/test_review_observed_defect_probe_taxonomy.py -q >"$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::Observed-defect taxonomy regression unexpectedly passed before the production repair."
            exit 1
          fi
          if ! grep -Eq 'AssertionError|DID NOT RAISE|requires probe_kind|distinct probe_kind|canonical positive integer line' "$RUNNER_TEMP/red.log"; then
            echo "::error::RED failed for an unrelated setup or toolchain reason."
            exit 1
          fi
          echo "RED verified: current Noema/OpenCode admission accepts at least one observed-defect regression that the new corpus rejects."

      - name: Apply central production repair
        run: PYTHONPATH=. python3 scripts/ci/_temporary_apply_review_probe_taxonomy.py

      - name: Remove temporary mutation machinery before verification
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temporary-review-probe-taxonomy-writer.yml
          rm -f scripts/ci/_temporary_apply_review_probe_taxonomy.py
          if find .github/workflows scripts/ci -maxdepth 1 -type f \
            \( -name '*temporary*probe*taxonomy*' -o -name '_temporary_apply_review_probe_taxonomy.py' \) \
            -print -quit | grep -q .; then
            echo "::error::Temporary review taxonomy mutation machinery remains after transformation."
            exit 1
          fi

      - name: Verify focused GREEN review contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_review_observed_defect_probe_taxonomy.py \
            tests/test_review_probe_taxonomy.py \
            tests/test_noema_review_gate.py \
            tests/test_opencode_review_normalize_output.py \
            tests/test_opencode_agent_contract.py
          python3 -m compileall -q \
            scripts/ci/noema_review_gate.py \
            scripts/ci/opencode_review_normalize_output.py \
            scripts/ci/review_probe_taxonomy.py \
            tests/test_review_observed_defect_probe_taxonomy.py \
            tests/test_review_probe_taxonomy.py
          git diff --check

      - name: Verify broader repository regression suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest tests -q
          git diff --check

      - name: Commit exact GREEN tree and push only if writer head stayed unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Writer head moved during verification: expected $GITHUB_SHA, observed $remote_head."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(review): require semantic observed defect probes'
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat >"$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          rm -f "$askpass"
