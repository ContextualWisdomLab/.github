name: Temporary observed review probe taxonomy writer

on:
  push:
    branches:
      - fix/opencode-observed-defect-probe-taxonomy-20260902

permissions:
  contents: write

jobs:
  red-green-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install declared test runner
        run: python3 -m pip install --disable-pip-version-check 'pytest>=8.0.0'

      - name: Verify RED regression against current production code
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -m pytest tests/test_review_observed_defect_probe_taxonomy.py -q >"$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::Observed-defect taxonomy regression unexpectedly passed before the production repair."
            exit 1
          fi
          if ! grep -Eq 'requires probe_kind|distinct probe_kind|DID NOT RAISE|AssertionError' "$RUNNER_TEMP/red.log"; then
            echo "::error::RED failed for an unrelated setup/toolchain reason."
            exit 1
          fi
          echo "RED verified: current Noema/OpenCode admission accepts a regression fixture that the observed-defect corpus must reject."

      - name: Apply smallest central production repair
        run: python3 scripts/ci/_temporary_apply_review_probe_taxonomy.py

      - name: Verify GREEN focused and connected review gates
        run: |
          python3 -m pytest \
            tests/test_review_observed_defect_probe_taxonomy.py \
            tests/test_noema_review_gate.py \
            tests/test_opencode_review_normalize_output.py \
            tests/test_opencode_agent_contract.py \
            -q
          python3 -m compileall -q scripts/ci
          git diff --check

      - name: Commit product repair and remove one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temporary-review-probe-taxonomy-writer.yml
          rm -f scripts/ci/_temporary_apply_review_probe_taxonomy.py
          git diff --check
          if git status --short | grep -E '_temporary-review-probe-taxonomy-writer|_temporary_apply_review_probe_taxonomy'; then
            :
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): require observed defect probe classes'
          git push origin HEAD:"${GITHUB_REF_NAME}"
