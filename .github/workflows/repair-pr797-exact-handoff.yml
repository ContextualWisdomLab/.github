name: Repair PR 797 exact handoff contracts
run-name: Repair PR 797 exact handoff at ${{ github.sha }}

on:
  push:
    branches:
      - release/exact-artifact-sbom-attestation
    paths:
      - .github/workflows/repair-pr797-exact-handoff.yml

permissions:
  contents: read

concurrency:
  group: repair-pr797-exact-handoff
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/release/exact-artifact-sbom-attestation'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the two reviewed test-contract repairs
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          contract = Path('tests/test_exact_artifact_sbom_attestation_contract.py')
          source = contract.read_text(encoding='utf-8')
          old = '    assert "' + '$' + '{{ github.run_id }}" in intake\n'
          new = '    assert "GITHUB_RUN_ID" in intake\n'
          if source.count(old) != 1:
              raise SystemExit('exact artifact contract: expected one run-ID repair anchor')
          contract.write_text(source.replace(old, new, 1), encoding='utf-8')

          hostile = Path('tests/test_verify_exact_artifact_sbom_handoff.py')
          source = hostile.read_text(encoding='utf-8')
          old = '    root.mkdir()\n'
          new = '    root.mkdir(parents=True)\n'
          if source.count(old) != 1:
              raise SystemExit('handoff verifier tests: expected one nested-root repair anchor')
          hostile.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify exact contract and complete verifier coverage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q \
            tests/test_exact_artifact_sbom_attestation_contract.py \
            tests/test_verify_exact_artifact_sbom_handoff.py
          python -m coverage report \
            --include=scripts/ci/verify_exact_artifact_sbom_handoff.py \
            --show-missing \
            --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci/verify_exact_artifact_sbom_handoff.py
          python -m compileall -q \
            scripts/ci/verify_exact_artifact_sbom_handoff.py \
            tests/test_exact_artifact_sbom_attestation_contract.py \
            tests/test_verify_exact_artifact_sbom_handoff.py
          git diff --check

      - name: Build immutable verified repair commit object
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: release/exact-artifact-sbom-attestation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr797-repair-receipt.txt"
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = 'ContextualWisdomLab/.github'
          parent_sha = os.environ['EXPECTED_HEAD']
          token = os.environ['API_TOKEN']
          api_root = f'https://api.github.com/repos/{repository}'

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cwl-pr797-repair',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          parent = request('GET', f'/git/commits/{parent_sha}')
          tree_entries = []
          for path in (
              'tests/test_exact_artifact_sbom_attestation_contract.py',
              'tests/test_verify_exact_artifact_sbom_handoff.py',
          ):
              encoded = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = request('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              print(f"BLOB {blob['sha']} {path}")
          tree_entries.append(
              {
                  'path': '.github/workflows/repair-pr797-exact-handoff.yml',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': None,
              }
          )
          tree = request(
              'POST',
              '/git/trees',
              {'base_tree': parent['tree']['sha'], 'tree': tree_entries},
          )
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'test: repair exact artifact handoff contracts',
                  'tree': tree['sha'],
                  'parents': [parent_sha],
              },
          )
          print(f"PR797_REPAIR_PARENT_SHA={parent_sha}")
          print(f"PR797_REPAIR_TREE_SHA={tree['sha']}")
          print(f"PR797_REPAIR_COMMIT_SHA={commit['sha']}")
          PY

      - name: Publish exact-head repair pointer
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          commit_sha="$(sed -n 's/^PR797_REPAIR_COMMIT_SHA=//p' "${RUNNER_TEMP}/pr797-repair-receipt.txt")"
          test "${#commit_sha}" -eq 40
          case "$commit_sha" in (*[!0-9a-f]*) exit 1;; esac
          body="PR797_REPAIR_PARENT_SHA=${EXPECTED_HEAD}%0APR797_REPAIR_COMMIT_SHA=${commit_sha}"
          gh api \
            --method POST \
            repos/ContextualWisdomLab/.github/issues/797/comments \
            -f "body=${body}"

      - name: Upload exact-head repair receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr797-exact-head-repair
          path: ${{ runner.temp }}/pr797-repair-receipt.txt
          if-no-files-found: error
          retention-days: 5
