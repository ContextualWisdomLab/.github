name: TEMP PR1674 Strix live-state repair

on:
  push:
    branches: [fix/noema-closed-not-stale]

permissions:
  contents: read
  id-token: write

concurrency:
  group: temp-pr1674-strix-live-state-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate remote writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin fix/noema-closed-not-stale
          live_head="$(git rev-parse origin/fix/noema-closed-not-stale)"
          if [ "$live_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::Writer branch advanced from $EXPECTED_HEAD to $live_head; refusing stale repair execution."
            exit 1
          fi

      - name: Install hash-locked test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('requirements-strix-ci-hashes.txt').read_text(encoding='utf-8')
          match = re.search(r'(?ms)^pyyaml==.*?(?=^[A-Za-z0-9_.-]+==|\Z)', source)
          if match is None:
              raise SystemExit('hash-locked PyYAML requirement is missing')
          Path('/tmp/pyyaml-requirement.txt').write_text(match.group(0), encoding='utf-8')
          PY
          python3 -m pip install --disable-pip-version-check --require-hashes -r /tmp/pyyaml-requirement.txt
          python3 -m pytest --version
          python3 -c 'import yaml; print(yaml.__version__)'

      - name: Apply live-authority repair
        run: |
          set -euo pipefail
          python3 scripts/ci/_temp_pr1674_strix_live_state_repair.py

      - name: Verify exact repair
        run: |
          set -euo pipefail
          python3 -m pytest \
            tests/test_strix_repository_dispatch_live_state.py \
            tests/test_opencode_workflow_shell_syntax.py \
            tests/test_noema_private_target_live_admission.py \
            tests/test_required_workflow_queue_contract.py \
            -q
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          strix = yaml.safe_load(Path('.github/workflows/strix.yml').read_text(encoding='utf-8'))
          noema = yaml.safe_load(Path('.github/workflows/noema-review.yml').read_text(encoding='utf-8'))
          assert 'strix' in strix['jobs']
          assert 'noema-review' in noema['jobs']
          PY
          git diff --check

      - name: Exchange OpenCode app token for writer publication
        id: repair_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          mark_unavailable() {
            echo "available=false" >>"$GITHUB_OUTPUT"
          }
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OpenCode app token exchange unavailable: OIDC request environment is missing."
            mark_unavailable
            exit 0
          fi
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          if ! oidc_response="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}${separator}audience=${OIDC_AUDIENCE}")"; then
            echo "OpenCode app token exchange unavailable: OIDC token request did not complete."
            mark_unavailable
            exit 0
          fi
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "OpenCode app token exchange unavailable: OIDC token response was empty."
            mark_unavailable
            exit 0
          fi
          if ! token_response="$(curl -fsS -X POST -H "Authorization: Bearer ${oidc_token}" "${OPENCODE_API_BASE_URL}/exchange_github_app_token")"; then
            echo "OpenCode app token exchange unavailable: app token request did not complete."
            mark_unavailable
            exit 0
          fi
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "OpenCode app token exchange unavailable: app token response was empty."
            mark_unavailable
            exit 0
          fi
          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Publish only onto unchanged writer head and self-retire
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.repair_app_token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_PUSH_TOKEN"
          git fetch origin fix/noema-closed-not-stale
          live_head="$(git rev-parse origin/fix/noema-closed-not-stale)"
          if [ "$live_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::Writer branch advanced from $EXPECTED_HEAD to $live_head; refusing stale publication."
            exit 1
          fi
          git rm -- .github/workflows/_temp_pr1674_strix_live_state_repair.yml scripts/ci/_temp_pr1674_strix_live_state_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/strix.yml \
            .github/workflows/noema-review.yml \
            tests/test_strix_repository_dispatch_live_state.py \
            tests/test_opencode_workflow_shell_syntax.py \
            tests/test_noema_private_target_live_admission.py
          git diff --cached --check
          git commit -m "fix(review): revalidate live dispatch targets before admission"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/noema-closed-not-stale
