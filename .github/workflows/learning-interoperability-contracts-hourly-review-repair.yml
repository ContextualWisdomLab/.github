name: Learning Interoperability Contracts Hourly Review Repair

on:
  schedule:
    # Minute 18 is unused on protected central main and avoids minute-zero load.
    - cron: "18 * * * *"

concurrency:
  group: learning-interoperability-contracts-hourly-review-repair
  # Preserve legitimate standards, rights, and cross-repository RCA work.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-review-repair:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-review-fix-scheduler.yml
    with:
      target_repository: ContextualWisdomLab/learning-interoperability-contracts
      # Contract changes are intentionally stacked before their bootstrap parent.
      base_branch: "*"
      max_prs: "50"
      max_dispatches: "1"
      # Do not duplicate a legitimate OpenCode, Strix, Noema, or conformance run.
      retry_hours: "2"
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
