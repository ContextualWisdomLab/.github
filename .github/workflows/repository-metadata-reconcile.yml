name: Repository Metadata Reconcile

on:
  pull_request:
    paths:
      - "config/repository-metadata.json"
      - "scripts/ci/reconcile_repository_metadata.py"
      - "tests/test_repository_metadata_reconciliation.py"
      - ".github/workflows/repository-metadata-reconcile.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: repository-metadata-reconcile-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Validate desired state
        run: python3 scripts/ci/reconcile_repository_metadata.py --manifest config/repository-metadata.json --validate-only
      - name: Run metadata contract tests
        run: python3 -m pytest -q tests/test_repository_metadata_reconciliation.py

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: repository-metadata-maintenance
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Reconcile repository metadata
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
        run: python3 scripts/ci/reconcile_repository_metadata.py --manifest config/repository-metadata.json
