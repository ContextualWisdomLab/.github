name: Materialize ScopeWeave PR 506 calendar-stack automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: scopeweave-pr506-materializer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/scopeweave-pr506-merge-event-calendar-stack'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize the sealed final tree
        shell: bash
        env:
          BASE_SHA: 885f2cd251999f21cf562cab3e2d9cc3cc3ec737
          BASE_WORKFLOW_BLOB: 7f1ad6d00678663ed22f5050fe9c7a93955f4950
          B64_SHA256: 1e4893f00c59b8e369ca69fce10595e165366f239a2048d86437fa5268d9aa13
          ARCHIVE_SHA256: 63eb77c30661a1b59def17bc2f4e201f52d05695007a14bd2cb9a95fb85548fc
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          [[ -f .bootstrap/ready ]] || exit 0
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD_SHA" ]]
          [[ "$(git hash-object .github/workflows/opencode-review.yml)" == \
             "$BASE_WORKFLOW_BLOB" ]]
          git merge-base --is-ancestor "$BASE_SHA" HEAD

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .bootstrap/*|.github/workflows/scopeweave-pr506-bootstrap.yml) ;;
              *)
                echo "unexpected pre-materialization path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)

          cat .bootstrap/payload.* > /tmp/scopeweave-payload.b64
          printf '%s  %s\n' "$B64_SHA256" /tmp/scopeweave-payload.b64 | sha256sum -c -
          base64 --decode /tmp/scopeweave-payload.b64 > /tmp/scopeweave-payload.tar.gz
          printf '%s  %s\n' "$ARCHIVE_SHA256" /tmp/scopeweave-payload.tar.gz | \
            sha256sum -c -

          rm -rf /tmp/scopeweave-materialized
          mkdir -p /tmp/scopeweave-materialized
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/scopeweave-payload.tar.gz')
          target = pathlib.Path('/tmp/scopeweave-materialized')
          expected_files = {
              '.github/workflows/opencode-review.yml',
              'scripts/ci/scopeweave_pr506_calendar_stack.py',
              'tests/test_scopeweave_pr506_calendar_stack.py',
              'docs/doctoring/scopeweave-pr506-calendar-stack-audit.md',
              'SHA256SUMS',
          }
          expected_dirs = {
              '.github',
              '.github/workflows',
              'scripts',
              'scripts/ci',
              'tests',
              'docs',
              'docs/doctoring',
          }
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              names = {member.name.rstrip('/') for member in members}
              if names != expected_files | expected_dirs:
                  raise SystemExit(f'unexpected archive members: {sorted(names)}')
              for member in members:
                  relative = pathlib.PurePosixPath(member.name.rstrip('/'))
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  destination = target.joinpath(*relative.parts)
                  if member.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                      continue
                  if not member.isfile():
                      raise SystemExit(f'non-regular archive member: {member.name}')
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'missing archive bytes: {member.name}')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(source.read())
          PY

          (cd /tmp/scopeweave-materialized && sha256sum -c SHA256SUMS)
          install -D -m 0644 \
            /tmp/scopeweave-materialized/.github/workflows/opencode-review.yml \
            .github/workflows/opencode-review.yml
          install -D -m 0644 \
            /tmp/scopeweave-materialized/scripts/ci/scopeweave_pr506_calendar_stack.py \
            scripts/ci/scopeweave_pr506_calendar_stack.py
          install -D -m 0644 \
            /tmp/scopeweave-materialized/tests/test_scopeweave_pr506_calendar_stack.py \
            tests/test_scopeweave_pr506_calendar_stack.py
          install -D -m 0644 \
            /tmp/scopeweave-materialized/docs/doctoring/scopeweave-pr506-calendar-stack-audit.md \
            docs/doctoring/scopeweave-pr506-calendar-stack-audit.md

          rm -rf .bootstrap .github/workflows/scopeweave-pr506-bootstrap.yml
          python3 -m compileall -q \
            scripts/ci/scopeweave_pr506_calendar_stack.py \
            tests/test_scopeweave_pr506_calendar_stack.py

          git add -A
          mapfile -t final_paths < <(git diff --cached --name-only "$BASE_SHA" | sort)
          expected_paths=(
            .github/workflows/opencode-review.yml
            docs/doctoring/scopeweave-pr506-calendar-stack-audit.md
            scripts/ci/scopeweave_pr506_calendar_stack.py
            tests/test_scopeweave_pr506_calendar_stack.py
          )
          [[ "${final_paths[*]}" == "${expected_paths[*]}" ]]

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && {
            echo 'sealed payload produced no final changes' >&2
            exit 1
          }
          git commit -m 'feat(opencode): audit ScopeWeave calendar stack after #506 merge'
          git push origin "HEAD:${HEAD_REF}"
