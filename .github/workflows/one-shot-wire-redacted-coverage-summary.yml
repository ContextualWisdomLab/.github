name: One-shot wire redacted coverage summary

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/one-shot-wire-redacted-coverage-summary.yml

concurrency:
  group: one-shot-wire-redacted-coverage-summary
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Confirm redaction regression fails before wiring the shared publisher
        run: |
          set +e
          python -m pytest \
            tests/test_coverage_materializer_failure_diagnostics.py::test_materializer_failure_summary_redacts_mixed_credentials \
            -q >"${RUNNER_TEMP}/red-phase.txt" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/red-phase.txt"
          test "$status" -ne 0

      - name: Wire both materializers to the trusted shared publisher
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          function_pattern = re.compile(
              r"\ndef _publish_coverage_failure_summary\(\n"
              r"    stage: str, error: BaseException, remediation: str\n"
              r"\) -> None:\n.*?"
              r"(?=\n\ndef main\()",
              re.DOTALL,
          )
          replacement = '''

def _publish_coverage_failure_summary(
    stage: str, error: BaseException, remediation: str
) -> None:
    """Publish bounded redacted setup evidence through the trusted helper."""

    _PUBLISH_COVERAGE_FAILURE_SUMMARY(stage, error, remediation)
'''

          for relative_path, constant_marker in (
              (
                  "scripts/ci/materialize_base_javascript_packages.py",
                  'SHA512_SRI_RE = re.compile(r"^sha512-[A-Za-z0-9+/]{86}==$")\n',
              ),
              (
                  "scripts/ci/materialize_base_python_requirements.py",
                  "UV_EXPORT_TIMEOUT_SECONDS = 120\n",
              ),
          ):
              path = Path(relative_path)
              text = path.read_text(encoding="utf-8")
              if "import runpy\n" not in text:
                  text = text.replace("import re\n", "import re\nimport runpy\n", 1)
              text = text.replace("import html\n", "", 1)
              binding = (
                  constant_marker
                  + "_PUBLISH_COVERAGE_FAILURE_SUMMARY = runpy.run_path(\n"
                  + "    str(pathlib.Path(__file__).with_name(\"coverage_failure_summary.py\")),\n"
                  + "    run_name=\"cwl_coverage_failure_summary\",\n"
                  + ")[\"publish_coverage_failure_summary\"]\n"
              )
              if "_PUBLISH_COVERAGE_FAILURE_SUMMARY = runpy.run_path(" not in text:
                  if text.count(constant_marker) != 1:
                      raise SystemExit(
                          f"expected one binding marker in {relative_path}"
                      )
                  text = text.replace(constant_marker, binding, 1)
              text, substitutions = function_pattern.subn(replacement, text, count=1)
              if substitutions != 1:
                  raise SystemExit(
                      f"expected one publisher function in {relative_path}, got {substitutions}"
                  )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused and complete quality evidence
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_strix_dependency_security_floor.py \
            --cov=scripts.ci.coverage_failure_summary \
            --cov=scripts.ci.materialize_base_javascript_packages \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov=scripts.ci.sanitize_github_output_summary \
            --cov-branch \
            --cov-fail-under=100 \
            -q
          python -m interrogate \
            --fail-under 100 \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m compileall -q \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py
          python -m pytest tests -q
          git diff --check

      - name: Commit verified repair and remove this workflow
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -f .github/workflows/one-shot-wire-redacted-coverage-summary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(opencode): redact materializer diagnostics before output"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
