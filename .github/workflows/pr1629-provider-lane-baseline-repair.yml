name: PR 1629 provider-lane baseline repair

on:
  push:
    branches:
      - fix/no-heuristic-review-admission-current-main
    paths:
      - .github/workflows/pr1629-provider-lane-baseline-repair.yml

permissions:
  contents: write

concurrency:
  group: pr1629-provider-lane-baseline-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair provider-account lane wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text(encoding="utf-8")
          old = """The repair keeps evidence admission complete, starts
          per-route readiness probes concurrently with no provider preference, preserves
          input-order/source evidence, and keeps each candidate's budget escalation local.
          `tests/test_contextual_orchestrator_review_preflight_concurrency.py` is the durable
          barrier-based regression: the old sequential implementation cannot pass it, while
          the GREEN implementation proves all admitted routes can enter transport before any
          route completes."""
          new = """The repair keeps evidence admission complete, starts independent
          provider-account lanes concurrently, serializes routes sharing one provider account,
          preserves input-order/source evidence, and keeps each candidate's budget escalation
          local. `tests/test_contextual_orchestrator_review_preflight_concurrency.py` is the
          durable barrier-based regression: the old globally sequential implementation cannot
          pass it, while the GREEN implementation proves every independent provider-account lane
          can enter transport before either lane completes. It deliberately does not claim that
          routes sharing one provider account start simultaneously."""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"baseline anchor count={count}; refusing stale rewrite")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/pr1629-provider-lane-baseline-repair.yml
          git diff --check
          ! grep -F "all admitted routes can enter transport before any" docs/product-technical-gap-baseline.md
          grep -F "every independent provider-account lane" docs/product-technical-gap-baseline.md

      - name: Publish source-only repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/fix/no-heuristic-review-admission-current-main | cut -f1)"
          test "$current" = "${GITHUB_SHA}"
          git config user.name "Seongho Bae"
          git config user.email "me@seonghobae.me"
          git add docs/product-technical-gap-baseline.md .github/workflows/pr1629-provider-lane-baseline-repair.yml
          git commit -m "docs(review): scope readiness concurrency to provider accounts"
          git push origin HEAD:refs/heads/fix/no-heuristic-review-admission-current-main
