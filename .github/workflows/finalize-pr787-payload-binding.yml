name: Finalize PR 787 payload binding

on:
  push:
    branches:
      - feat/review-agent-mention-router-main
    paths:
      - .github/workflows/finalize-pr787-payload-binding.yml

permissions:
  contents: read

concurrency:
  group: finalize-pr787-payload-binding
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/feat/review-agent-mention-router-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify or apply the bounded payload repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          run_focused() {
            cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/agent_mention_router.py
              scripts/ci/agent_mention_sweep.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
            export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
            python -m coverage erase
            python -m coverage run -m pytest -q \
              tests/test_agent_mention_router.py \
              tests/test_agent_mention_sweep.py \
              tests/test_agent_mention_workflow_contract.py \
              tests/test_agent_mention_idempotency.py \
              tests/test_agent_mention_downstream_idempotency.py \
              tests/test_agent_mention_receipt_authority.py
            python -m coverage report --fail-under=100
            python -m interrogate --fail-under=100 \
              scripts/ci/agent_mention_router.py \
              scripts/ci/agent_mention_sweep.py
            python -m compileall -q scripts/ci/agent_mention_router.py scripts/ci/agent_mention_sweep.py tests
          }

          if ! run_focused; then
            test -f scripts/ci/repair_pr787_payload_bound_once.py
            python scripts/ci/repair_pr787_payload_bound_once.py
            run_focused
          fi

          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-noema-dispatch.yml)" -eq 1
          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-opencode-dispatch.yml)" -eq 1
          grep -F '"base_branch": request.pull_request_base_branch' scripts/ci/agent_mention_router.py
          grep -F 'BASE_BRANCH: ${{ github.event.client_payload.base_branch || '\''\'' }}' .github/workflows/agent-mention-noema-dispatch.yml
          git diff --check

      - name: Remove every one-shot repair artifact
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -f \
            .github/pr787-payload-repair.trigger \
            .github/workflows/repair-pr787-payload-binding-push.yml \
            .github/workflows/repair-pr787-payload-bound-invocation.yml \
            .github/workflows/repair-pr787-payload-bound-v2.yml \
            .github/workflows/repair-pr787-payload-candidate.yml \
            .github/workflows/finalize-pr787-payload-binding.yml \
            scripts/ci/apply_pr787_payload_binding.py \
            scripts/ci/repair_pr787_payload_bound_once.py
          git diff --check

      - name: Verify the durable final tree
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test ! -e .github/pr787-payload-repair.trigger
          test ! -e .github/workflows/repair-pr787-payload-binding-push.yml
          test ! -e .github/workflows/repair-pr787-payload-bound-invocation.yml
          test ! -e .github/workflows/repair-pr787-payload-bound-v2.yml
          test ! -e .github/workflows/repair-pr787-payload-candidate.yml
          test ! -e .github/workflows/finalize-pr787-payload-binding.yml
          test ! -e scripts/ci/apply_pr787_payload_binding.py
          test ! -e scripts/ci/repair_pr787_payload_bound_once.py
          python -m pytest -q \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py \
            tests/test_agent_mention_idempotency.py \
            tests/test_agent_mention_downstream_idempotency.py \
            tests/test_agent_mention_receipt_authority.py
          git diff --check

      - name: Publish exact verified final tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: feat/review-agent-mention-router-main
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No final-tree change was produced.'; exit 1; }
          git commit -m "fix(automation): bind invocation keys to complete payloads"
          test -n "$PUSH_TOKEN"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
