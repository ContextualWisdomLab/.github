name: Repair PR 759 early coverage diagnostic redaction

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics

permissions:
  contents: read

concurrency:
  group: repair-pr759-early-redaction
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact audited inputs
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object scripts/ci/materialize_base_javascript_packages.py)" = "99802d6b62496d9e3791c9a50ca39562b0307f35"
          test "$(git hash-object scripts/ci/materialize_base_python_requirements.py)" = "4d37759621c2370ffccbcc9388ede71b38be1f15"
          test "$(git hash-object scripts/ci/sanitize_github_output_summary.py)" = "1a7036f755ef1d9c37ec4d7956c22b994c9e7915"
          test "$(git hash-object tests/test_coverage_materializer_failure_diagnostics.py)" = "d612c13c3abb4fece211a4de4a06300b4cac445f"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Add the regression before production repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_coverage_materializer_failure_diagnostics.py")
          text = path.read_text(encoding="utf-8")
          if "test_failure_diagnostics_redact_secret_like_values_before_github_output" in text:
              raise SystemExit("regression test already exists")
          text = text.replace("import json\n", "import html\nimport json\n", 1)
          import_anchor = "from scripts.ci import materialize_base_python_requirements as python_materializer\n"
          if text.count(import_anchor) != 1:
              raise SystemExit("unexpected sanitizer import anchor")
          text = text.replace(
              import_anchor,
              import_anchor
              + "from scripts.ci import sanitize_github_output_summary as summary_sanitizer\n",
              1,
          )
          insertion_anchor = '''

@pytest.mark.parametrize(
    "module",
    [javascript_materializer, python_materializer],
    ids=["javascript", "python"],
)
def test_failure_diagnostics_are_optional_outside_github_actions(
'''
          regression = '''

@pytest.mark.parametrize(
    ("unsafe_reason", "secret_value"),
    [
        (
            "current-head lock contains unsafe package path "
            "node_modules/NPM_TOKEN=ghp_materializer_secret/package.json",
            "ghp_materializer_secret",
        ),
        (
            "registry URL https://alice:registry-password@example.com/archive.tgz",
            "registry-password",
        ),
        (
            "Authorization: Bearer coverage-diagnostic-token",
            "coverage-diagnostic-token",
        ),
    ],
)
@pytest.mark.parametrize(
    "module",
    [javascript_materializer, python_materializer],
    ids=["javascript", "python"],
)
def test_failure_diagnostics_redact_secret_like_values_before_github_output(
    module: ModuleType,
    unsafe_reason: str,
    secret_value: str,
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    """Early failure evidence applies the shared redaction contract before publication."""
    output_file = tmp_path / "github-output"
    monkeypatch.setenv("GITHUB_OUTPUT", str(output_file))
    monkeypatch.setattr(
        module,
        "materialize",
        _failing_materializer(ValueError(unsafe_reason)),
    )

    assert _run_main(module, tmp_path) == 1

    published = output_file.read_text(encoding="utf-8")
    normalized = f"ValueError: {' '.join(unsafe_reason.split())}"
    expected = html.escape(summary_sanitizer.sanitize_text(normalized), quote=True)
    assert expected in published
    assert secret_value not in published
    assert "&lt;redacted&gt;" in published
'''
          if text.count(insertion_anchor) != 1:
              raise SystemExit("unexpected regression insertion anchor")
          path.write_text(
              text.replace(insertion_anchor, regression + insertion_anchor, 1),
              encoding="utf-8",
          )
          PY

      - name: Prove the regression is red
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          python -m pytest \
            tests/test_coverage_materializer_failure_diagnostics.py \
            -k redact_secret_like_values_before_github_output \
            > /tmp/pr759-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pr759-red.log
          test "$status" -ne 0

      - name: Apply the bounded production repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = '''

_COVERAGE_SECRET_KEY_RE = re.compile(
    r"(?i)(?P<key>\\b[A-Z0-9_.-]*(?:"
    r"AUTH[_-]?SESSION[_-]?HMAC[_-]?SECRET|"
    r"DATABASE[_-]?URL|DB[_-]?URL|CONNECTION[_-]?STRING|"
    r"SECRET|TOKEN|PASSWORD|PASSWD|"
    r"API[_-]?KEY|PRIVATE[_-]?KEY|ACCESS[_-]?KEY|ENCRYPTION[_-]?KEY"
    r")[A-Z0-9_.-]*\\b)(?P<sep>\\s*[:=]\\s*)"
)
_COVERAGE_URL_CREDENTIAL_RE = re.compile(
    r"(?i)\\b([a-z][a-z0-9+.-]*://)([^/\\s:@]+):([^@\\s/]+)@"
)
_COVERAGE_AUTH_HEADER_RE = re.compile(
    r"(?i)\\b(Authorization\\s*[:=]\\s*)(Bearer|Basic)\\s+[^\\s,;]+"
)


def _redact_coverage_failure_reason(reason: str) -> str:
    """Redact secret-like values before publishing early coverage evidence."""
    match = _COVERAGE_SECRET_KEY_RE.search(reason)
    if match:
        return f"{reason[: match.end()]}<redacted>"
    reason = _COVERAGE_URL_CREDENTIAL_RE.sub(r"\\1<redacted>@", reason)
    return _COVERAGE_AUTH_HEADER_RE.sub(r"\\1\\2 <redacted>", reason)
'''
          helper_anchors = {
              Path("scripts/ci/materialize_base_javascript_packages.py"): 'SHA512_SRI_RE = re.compile(r"^sha512-[A-Za-z0-9+/]{86}==$")\n',
              Path("scripts/ci/materialize_base_python_requirements.py"): "UV_EXPORT_TIMEOUT_SECONDS = 120\n",
          }
          old_reason = '''    safe_reason = html.escape(
        f"{error.__class__.__name__}: {' '.join(str(error).split())}"[:4096],
        quote=True,
    ).replace(delimiter, "CWL_COVERAGE_SUMMARY_END")
'''
          new_reason = '''    redacted_reason = _redact_coverage_failure_reason(
        f"{error.__class__.__name__}: {' '.join(str(error).split())}"
    )
    safe_reason = html.escape(redacted_reason[:4096], quote=True).replace(
        delimiter, "CWL_COVERAGE_SUMMARY_END"
    )
'''
          for path, anchor in helper_anchors.items():
              text = path.read_text(encoding="utf-8")
              if text.count(anchor) != 1 or text.count(old_reason) != 1:
                  raise SystemExit(f"unexpected audited repair anchor in {path}")
              text = text.replace(anchor, anchor + helper, 1)
              text = text.replace(old_reason, new_reason, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python -m compileall -q \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py
          git diff --check

      - name: Verify focused behavior, production coverage, and docstrings
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py
          python -m coverage erase
          python -m coverage run --branch -m pytest \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_materialize_base_javascript_packages.py \
            tests/test_materialize_base_python_requirements.py \
            tests/test_sanitize_github_output_summary.py
          python -m coverage report --fail-under=100 \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m interrogate --fail-under 100 \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py

      - name: Commit exact validated repair and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/opencode-coverage-failure-diagnostics
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm .github/workflows/repair-pr759-early-redaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            .github/workflows/repair-pr759-early-redaction.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' \
            .github/workflows/repair-pr759-early-redaction.yml \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_coverage_materializer_failure_diagnostics.py | sort)"
          git diff --cached --check
          git commit -m "fix(opencode-review): redact early coverage diagnostics"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
