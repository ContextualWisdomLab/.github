name: One-shot PR 1589 current-main validation v6

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-current-main-v6.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Execute reviewed v5 repair with merge identity
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/source-fix-1589-current-main-v5.yml").read_text(encoding="utf-8")
          marker = "        run: |\n"
          if workflow.count(marker) != 1:
              raise SystemExit("v5 run block changed unexpectedly")
          script = textwrap.dedent(workflow.split(marker, 1)[1])
          merge = "git merge --no-commit --no-ff -X ours refs/remotes/origin/main\n"
          if script.count(merge) != 1:
              raise SystemExit("v5 merge marker changed unexpectedly")
          script = script.replace(
              merge,
              'git config user.name "github-actions[bot]"\n'
              'git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n'
              + merge,
              1,
          )
          script = script.replace(
              "  .github/workflows/source-fix-1589-current-main-v5.yml\n",
              "  .github/workflows/source-fix-1589-current-main-v5.yml \\\n  .github/workflows/source-fix-1589-current-main-v6.yml\n",
              1,
          )
          Path("/tmp/run-v5.sh").write_text(script, encoding="utf-8")
          PY
          cd ..
          rm -rf source
          bash /tmp/run-v5.sh