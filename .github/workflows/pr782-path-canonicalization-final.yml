name: Finalize PR 782 path canonicalization

on:
  push:
    branches:
      - fix/hourly-nvidia-nim-review-repair-main
    paths:
      - .github/workflows/pr782-path-canonicalization-final.yml

permissions:
  contents: read

concurrency:
  group: pr782-path-canonicalization-final
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/hourly-nvidia-nim-review-repair-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Add failing canonical-path regressions and implementation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              if new in source:
                  return
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/ci/pr_review_conflict_scope.py",
              '''    path = Path(raw_path)
              if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts):
                  raise ValueError("repository path must be a normalized relative path")
              return raw_path
          ''',
              '''    path = Path(raw_path)
              normalized_path = path.as_posix()
              if (
                  path.is_absolute()
                  or normalized_path != raw_path
                  or any(part in {"", ".", ".."} for part in path.parts)
              ):
                  raise ValueError("repository path must be a normalized relative path")
              return raw_path
          ''',
          )
          replace_once(
              "tests/test_pr_review_conflict_scope.py",
              '''    ["", "/absolute", "../escape", "nested/../escape"],
          ''',
              '''    [
                  "",
                  "/absolute",
                  "../escape",
                  "nested/../escape",
                  "./relative",
                  "a//b",
              ],
          ''',
          )
          PY
          git diff --check

      - name: Verify focused behavior, branch coverage, docstrings, and syntax
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate --fail-under 100 scripts/ci/pr_review_conflict_scope.py
          python -m compileall -q \
            scripts/ci/pr_review_conflict_scope.py \
            tests/test_pr_review_conflict_scope.py
          git diff --check

      - name: Publish only the permanent Python and test changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/hourly-nvidia-nim-review-repair-main
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            scripts/ci/pr_review_conflict_scope.py \
            tests/test_pr_review_conflict_scope.py | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/pr_review_conflict_scope.py tests/test_pr_review_conflict_scope.py
          git diff --cached --check
          git commit -m "fix(automation): reject alternate conflict path spellings"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${SOURCE_BRANCH}"
