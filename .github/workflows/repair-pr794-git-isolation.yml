name: Repair PR 794 coverage Git isolation

on:
  push:
    branches:
      - fix/opencode-llvm-coverage-current-main
    paths:
      - .github/workflows/repair-pr794-git-isolation.yml

concurrency:
  group: repair-pr794-git-isolation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/opencode-llvm-coverage-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact contributor head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false

      - name: Validate bounded repair ancestry and scope
        env:
          RED_HEAD: 748bc5d5d733ddea93b592bd4091ea5a8005d55c
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git merge-base --is-ancestor "$RED_HEAD" HEAD
          mapfile -t delta < <(git diff --name-only "$RED_HEAD" HEAD)
          test "${#delta[@]}" -eq 1
          test "${delta[0]}" = ".github/workflows/repair-pr794-git-isolation.yml"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Preserve exact RED evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          red_output="$(python -m pytest -q \
            tests/test_opencode_llvm_coverage_current_main.py::test_low_privilege_coverage_wrappers_isolate_ambient_git_configuration \
            2>&1)"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -eq 1
          printf '%s\n' "$red_output" | grep -F 'ValueError: substring not found'

      - name: Restore complete Git isolation in all three wrappers
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/opencode-review-dispatch.yml')
          source = path.read_text(encoding='utf-8')
          old = '''              UV_NO_BUILD=1 \\
              GIT_CONFIG_COUNT=1 \\
'''
          new = '''              UV_NO_BUILD=1 \\
              GIT_CONFIG_NOSYSTEM=1 \\
              GIT_CONFIG_GLOBAL=/dev/null \\
              GIT_CONFIG_COUNT=1 \\
'''
          if source.count(old) != 3:
              raise SystemExit(
                  f'expected exactly three low-privilege Git isolation anchors, found {source.count(old)}'
              )
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/repair-pr794-git-isolation.yml
          git diff --check

      - name: Verify GREEN focused contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q tests/test_opencode_llvm_coverage_current_main.py
          python -m compileall -q tests/test_opencode_llvm_coverage_current_main.py
          git diff --check

      - name: Publish verified repair with workflow-capable credential
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(coverage): restore sandbox Git isolation"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
