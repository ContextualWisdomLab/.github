name: Temporary Mark PR 1717 Ready

on:
  push:
    branches:
      - fix/scheduler-central-run-read-authority-20260902
    paths:
      - .github/workflows/_temp_mark_ready_pr1717.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: temp-mark-ready-pr1717
  cancel-in-progress: true

jobs:
  mark-ready:
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-slim
    steps:
      - name: Revalidate exact head and mark canonical source-complete PR ready
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh pr view 1717 --repo ContextualWisdomLab/.github --json state,isDraft,headRefOid)"
          test "$(jq -r '.state' <<<"$pr_json")" = "OPEN"
          test "$(jq -r '.isDraft' <<<"$pr_json")" = "true"
          test "$(jq -r '.headRefOid' <<<"$pr_json")" = "$EXPECTED_HEAD"
          gh pr ready 1717 --repo ContextualWisdomLab/.github
