name: Temporary PR 1619 causal repair

on:
  push:
    branches:
      - fix/current-main-remove-opencode-dispatch-bootstrap-20260902
    paths:
      - .github/workflows/tmp-pr1619-causal-repair.yml

permissions:
  contents: write

concurrency:
  group: tmp-pr1619-causal-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Repair same-repository credential contract and remove helper
        shell: bash
        env:
          EXPECTED_REF: fix/current-main-remove-opencode-dispatch-bootstrap-20260902
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_REF}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          python - <<'PY'
          from pathlib import Path

          expr = '$' + '{{'
          workflow_path = Path('.github/workflows/opencode-review-dispatch.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_token = f"GH_TOKEN: {expr} secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.opencode_app_token.outputs.token || github.token }}}}"
          new_token = f"GH_TOKEN: {expr} needs.validate-pr-metadata.outputs.target_repository == github.repository && github.token || secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || steps.opencode_app_token.outputs.token || github.token }}}}"
          old_source = f"OPENCODE_STATUS_TOKEN_SOURCE: {expr} secrets.PR_REVIEW_MERGE_TOKEN != '' && 'PR_REVIEW_MERGE_TOKEN' || secrets.OPENCODE_APPROVE_TOKEN != '' && 'OPENCODE_APPROVE_TOKEN' || steps.opencode_app_token.outputs.available == 'true' && 'opencode-app' || 'github-token' }}}}"
          new_source = f"OPENCODE_STATUS_TOKEN_SOURCE: {expr} needs.validate-pr-metadata.outputs.target_repository == github.repository && 'github-token' || secrets.PR_REVIEW_MERGE_TOKEN != '' && 'PR_REVIEW_MERGE_TOKEN' || secrets.OPENCODE_APPROVE_TOKEN != '' && 'OPENCODE_APPROVE_TOKEN' || steps.opencode_app_token.outputs.available == 'true' && 'opencode-app' || 'github-token' }}}}"
          if workflow.count(old_token) != 1 or workflow.count(old_source) != 1:
              raise SystemExit('unexpected dispatch workflow credential shape; refusing mutation')
          workflow = workflow.replace(old_token, new_token, 1).replace(old_source, new_source, 1)
          if 'required-workflow-bootstrap:' in workflow:
              raise SystemExit('orphaned dispatch bootstrap unexpectedly present')
          workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('tests/test_opencode_agent_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_assert = '''    assert (\n        "GH_TOKEN: __OPEN__ secrets.PR_REVIEW_MERGE_TOKEN || "\n        "secrets.OPENCODE_APPROVE_TOKEN || steps.opencode_app_token.outputs.token || "\n        "github.token }}"\n    ) in status_step\n    assert "OPENCODE_STATUS_TOKEN_SOURCE" in status_step\n'''.replace('__OPEN__', expr)
          new_assert = '''    assert (\n        "GH_TOKEN: __OPEN__ needs.validate-pr-metadata.outputs.target_repository == "\n        "github.repository && github.token || secrets.PR_REVIEW_MERGE_TOKEN || "\n        "secrets.OPENCODE_APPROVE_TOKEN || steps.opencode_app_token.outputs.token || "\n        "github.token }}"\n    ) in status_step\n    assert (\n        "OPENCODE_STATUS_TOKEN_SOURCE: __OPEN__ "\n        "needs.validate-pr-metadata.outputs.target_repository == github.repository && "\n        "'github-token' || secrets.PR_REVIEW_MERGE_TOKEN != '' && "\n        "'PR_REVIEW_MERGE_TOKEN'"\n    ) in status_step\n'''.replace('__OPEN__', expr)
          if test_text.count(old_assert) != 1:
              raise SystemExit('unexpected OpenCode contract assertion shape; refusing mutation')
          test_path.write_text(test_text.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY

          workflow_blob="$(git hash-object .github/workflows/opencode-review-dispatch.yml)"
          python - "$workflow_blob" <<'PY'
          import re
          import sys
          from pathlib import Path

          blob = sys.argv[1]
          path = Path('tests/test_pr_review_autofix_nvidia_nim_contract.py')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'REVIEW_DISPATCH_BLOB_SHA = "[0-9a-f]{40}"',
              f'REVIEW_DISPATCH_BLOB_SHA = "{blob}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('unable to update exact dispatch blob contract')
          path.write_text(text, encoding='utf-8')
          PY

          PYTHONPATH=. python -m pytest -q \
            tests/test_opencode_agent_contract.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py
          git diff --check

          rm .github/workflows/tmp-pr1619-causal-repair.yml
          test ! -e .github/workflows/tmp-pr1619-causal-repair.yml
          git diff --check

          git config user.name 'contextualwisdomlab-automation'
          git config user.email 'contextualwisdomlab-automation@users.noreply.github.com'
          git add .github/workflows/opencode-review-dispatch.yml \
            tests/test_opencode_agent_contract.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            .github/workflows/tmp-pr1619-causal-repair.yml
          git commit -m 'fix(opencode): preserve same-repo status authority'
          git fetch origin "${EXPECTED_REF}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git push origin "HEAD:${EXPECTED_REF}"
