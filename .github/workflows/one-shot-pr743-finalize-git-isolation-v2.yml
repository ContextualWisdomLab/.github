name: One-shot PR 743 finalize Git isolation v2

on:
  push:
    branches:
      - fix/trusted-uv-lock-coverage-clean
    paths:
      - .github/workflows/one-shot-pr743-finalize-git-isolation-v2.yml

permissions:
  contents: read

concurrency:
  group: one-shot-pr743-finalize-git-isolation-v2
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/trusted-uv-lock-coverage-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked test tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply, verify, and publish the canonical repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/opencode-review-dispatch.yml")
          content = workflow.read_text(encoding="utf-8")
          marker = "          trusted_git() {"
          if content.count(marker) != 1:
              raise SystemExit("trusted_git boundary is missing or duplicated")
          runtime, helper = content.split(marker, 1)
          old = (
              "              GIT_CONFIG_COUNT=1 \\\n"
              "              GIT_CONFIG_KEY_0=safe.directory \\\n"
          )
          new = (
              "              GIT_CONFIG_NOSYSTEM=1 \\\n"
              "              GIT_CONFIG_GLOBAL=/dev/null \\\n"
              + old
          )
          if runtime.count(old) != 3:
              raise SystemExit(
                  f"expected three unisolated runtime Git blocks, found {runtime.count(old)}"
              )
          if runtime.count("              GIT_CONFIG_NOSYSTEM=1 \\\n") != 0:
              raise SystemExit("runtime Git blocks were partially isolated before repair")
          repaired_runtime = runtime.replace(old, new)
          if repaired_runtime.count("              GIT_CONFIG_NOSYSTEM=1 \\\n") != 3:
              raise SystemExit("runtime Git system-config isolation was not applied three times")
          if repaired_runtime.count("              GIT_CONFIG_GLOBAL=/dev/null \\\n") != 3:
              raise SystemExit("runtime Git global-config isolation was not applied three times")
          workflow.write_text(repaired_runtime + marker + helper, encoding="utf-8")
          for temporary in (
              ".github/workflows/one-shot-pr743-apply-git-isolation.yml",
              ".github/workflows/one-shot-pr743-finalize-git-isolation.yml",
              ".github/workflows/one-shot-pr743-finalize-git-isolation-v2.yml",
          ):
              Path(temporary).unlink()
          PY
          python -m pytest -q tests/test_repository_branch_coverage_pr743_cleanup.py
          python -m pytest -q tests
          python -m compileall -q tests scripts/ci
          git diff --check
          test ! -e .github/workflows/one-shot-pr743-apply-git-isolation.yml
          test ! -e .github/workflows/one-shot-pr743-finalize-git-isolation.yml
          test ! -e .github/workflows/one-shot-pr743-finalize-git-isolation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(opencode-review): isolate runtime Git configuration"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
