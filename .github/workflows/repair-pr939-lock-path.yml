name: Repair PR 939 nested requirements lock discovery

on:
  push:
    branches:
      - codex/fix-cross-repo-opencode-evidence
    paths:
      - .github/workflows/repair-pr939-lock-path.yml

permissions:
  contents: write

concurrency:
  group: repair-pr939-lock-path
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/fix-cross-repo-opencode-evidence
          fetch-depth: 0

      - name: Write the failing nested-path regression contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat > tests/test_materialize_base_python_requirement_paths.py <<'PY'
          """Regression contracts for repository-relative requirements lock discovery."""

          from __future__ import annotations

          import subprocess
          import tempfile
          import unittest
          from pathlib import Path

          from scripts.ci import materialize_base_python_requirements as materializer


          def _git(repo: Path, *args: str) -> str:
              """Run one deterministic Git command in the fixture repository."""
              return subprocess.run(
                  ["git", "-C", str(repo), *args],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip()


          class BaseHashLockPathTests(unittest.TestCase):
              """Protect direct ``requirements`` directory child discovery."""

              def test_collects_hash_locks_under_any_requirements_directory(self) -> None:
                  """Use the complete repository-relative path, not only the basename."""
                  with tempfile.TemporaryDirectory() as temporary_directory:
                      repo = Path(temporary_directory)
                      _git(repo, "init")
                      _git(repo, "config", "user.name", "Test")
                      _git(repo, "config", "user.email", "test@example.invalid")

                      root_requirements = repo / "requirements"
                      nested_requirements = repo / "service" / "requirements"
                      root_requirements.mkdir()
                      nested_requirements.mkdir(parents=True)
                      (root_requirements / "ci.txt").write_text(
                          "ci-demo==1 --hash=sha256:" + ("a" * 64) + "\n",
                          encoding="utf-8",
                      )
                      (nested_requirements / "package.txt").write_text(
                          "service-demo==1 --hash=sha256:" + ("b" * 64) + "\n",
                          encoding="utf-8",
                      )
                      _git(repo, "add", ".")
                      _git(repo, "commit", "-m", "base")
                      base_sha = _git(repo, "rev-parse", "HEAD")

                      locks = materializer.base_hash_locks(repo, base_sha)

                      self.assertEqual(
                          [path for path, _content in locks],
                          [
                              "requirements/ci.txt",
                              "service/requirements/package.txt",
                          ],
                      )


          if __name__ == "__main__":
              unittest.main()
          PY

          if python3 tests/test_materialize_base_python_requirement_paths.py; then
            echo "ERROR: nested requirements path contract unexpectedly passed before the fix." >&2
            exit 1
          fi

      - name: Use the repository-relative candidate path
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/materialize_base_python_requirements.py")
          source = path.read_text(encoding="utf-8")
          old = "        if _is_candidate_lock_name(candidate.name):\n"
          new = "        if _is_candidate_lock_path(candidate):\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one base lock discovery anchor, found {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify the focused repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 tests/test_materialize_base_python_requirement_paths.py
          python3 -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirement_paths.py
          git diff --check

      - name: Commit the verified repair and remove this workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git fetch origin codex/fix-cross-repo-opencode-evidence
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/fix-cross-repo-opencode-evidence)"
          rm -- .github/workflows/repair-pr939-lock-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirement_paths.py \
            .github/workflows/repair-pr939-lock-path.yml
          git commit -m "fix(ci): discover nested requirements lock paths"
          git push origin HEAD:codex/fix-cross-repo-opencode-evidence
