name: One-shot trusted Git executable repair

on:
  push:
    branches:
      - fix/trusted-uv-transient-download-retry
    paths:
      - .github/workflows/one-shot-fix-trusted-git-executable.yml

concurrency:
  group: one-shot-trusted-git-executable-repair
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_PARENT_SHA: e694e0727d98a9c81f656c706d78ce7cee9f536a
  TARGET_BRANCH: fix/trusted-uv-transient-download-retry
  TEMP_WORKFLOW: .github/workflows/one-shot-fix-trusted-git-executable.yml

jobs:
  repair:
    name: Test, repair, verify, and self-remove
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Refuse stale or competing trigger state
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${TARGET_BRANCH}"
          test "${{ github.event.before }}" = "${EXPECTED_PARENT_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_SHA}"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "${changed}" = "${TEMP_WORKFLOW}"

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install immutable quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply the bounded GREEN implementation and permanent gate contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/ci/materialize_base_python_requirements.py")
          source = source_path.read_text(encoding="utf-8")
          old_git = '''def _git(repo_root: pathlib.Path, *args: str) -> bytes:
              """Run one read-only git command in the materialized repository."""
              completed = subprocess.run(
                  ["git", "-C", str(repo_root), *args],
          '''.replace("          ", "")
          new_git = '''@functools.cache
          def _trusted_git_executable() -> str:
              """Return Git resolved only from the operating system's default path."""
              resolved = shutil.which("git", path=os.defpath)
              if resolved is None or not os.path.isabs(resolved):
                  raise RuntimeError("trusted Git executable could not be resolved absolutely")
              return resolved


          def _git(repo_root: pathlib.Path, *args: str) -> bytes:
              """Run one read-only git command in the materialized repository."""
              completed = subprocess.run(
                  [_trusted_git_executable(), "-C", str(repo_root), *args],
          '''.replace("          ", "")
          if source.count(old_git) != 1:
              raise SystemExit("stale source: expected one ambient Git invocation")
          source_path.write_text(source.replace(old_git, new_git), encoding="utf-8")

          quality_path = Path(".github/workflows/trusted-uv-materializer-quality-ci.yml")
          quality = quality_path.read_text(encoding="utf-8")
          coverage_marker = "            tests/test_trusted_uv_download_contract.py \\\n"
          if quality.count(coverage_marker) != 2:
              raise SystemExit("stale quality workflow: expected two trusted-uv test lists")
          quality = quality.replace(
              coverage_marker,
              coverage_marker + "            tests/test_trusted_git_executable.py \\\n",
          )
          quality_path.write_text(quality, encoding="utf-8")

          contract_path = Path("tests/test_trusted_uv_materializer_quality_workflow_contract.py")
          contract = contract_path.read_text(encoding="utf-8")
          contract_marker = '        "tests/test_trusted_uv_download_contract.py",\n'
          if contract.count(contract_marker) != 1:
              raise SystemExit("stale workflow contract: expected one required-test anchor")
          contract_path.write_text(
              contract.replace(
                  contract_marker,
                  contract_marker + '        "tests/test_trusted_git_executable.py",\n',
              ),
              encoding="utf-8",
          )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_anchor = "### Fixed\n\n"
          changelog_entry = (
              "- Resolved Git only through the operating system default executable path "
              "and rejected missing or relative results before trusted base-lock "
              "materialization, preventing pull-request-controlled `PATH` selection.\n"
          )
          if changelog.count(changelog_anchor) != 1:
              raise SystemExit("stale changelog: expected one Fixed heading")
          if changelog_entry not in changelog:
              changelog = changelog.replace(
                  changelog_anchor,
                  changelog_anchor + changelog_entry,
              )
          changelog_path.write_text(changelog, encoding="utf-8")

          doctoring_path = Path("docs/doctoring/trusted-uv-transient-download-retry.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          doctoring_anchor = "## Incident evidence\n"
          doctoring_text = (
              "The base-commit reader resolves `git` with `shutil.which(\"git\", "
              "path=os.defpath)` and accepts only an absolute result. The ambient process "
              "`PATH` cannot select the executable; missing or relative resolution fails "
              "before any repository command runs.\n\n"
          )
          if doctoring.count(doctoring_anchor) != 1:
              raise SystemExit("stale doctoring: expected one incident heading")
          if doctoring_text not in doctoring:
              doctoring = doctoring.replace(
                  doctoring_anchor,
                  doctoring_text + doctoring_anchor,
              )
          doctoring_path.write_text(doctoring, encoding="utf-8")
          PY

      - name: Verify targeted production branch coverage
        shell: bash
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/trusted-uv-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/trusted-uv-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_git_executable.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            -q
          python -m coverage report

      - name: Verify full tests, branch coverage, docstrings, and compilation
        shell: bash
        run: |
          set -euo pipefail
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q scripts/ci/materialize_base_python_requirements.py tests

      - name: Remove generated evidence and prove the bounded final diff
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage erase
          rm -rf .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm "${TEMP_WORKFLOW}"
          git diff --check
          actual="$(git status --porcelain=v1 | sed 's/^...//' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/one-shot-fix-trusted-git-executable.yml \
            .github/workflows/trusted-uv-materializer-quality-ci.yml \
            CHANGELOG.md \
            docs/doctoring/trusted-uv-transient-download-retry.md \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Recheck live head, commit without credentials in the tree, and push
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote_head="$(python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          branch = urllib.parse.quote(os.environ["TARGET_BRANCH"], safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/ContextualWisdomLab/.github/git/ref/heads/{branch}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          print(payload["object"]["sha"])
          PY
          )"
          test "${remote_head}" = "${GITHUB_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/trusted-uv-materializer-quality-ci.yml \
            CHANGELOG.md \
            docs/doctoring/trusted-uv-transient-download-retry.md \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py
          git add -u -- "${TEMP_WORKFLOW}"
          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/one-shot-fix-trusted-git-executable.yml \
            .github/workflows/trusted-uv-materializer-quality-ci.yml \
            CHANGELOG.md \
            docs/doctoring/trusted-uv-transient-download-retry.md \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            | LC_ALL=C sort)"
          test "${staged}" = "${expected}"
          git commit -m "fix(security): resolve Git outside ambient PATH"

          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${TARGET_BRANCH}"
