name: One-shot PR 757 coverage diagnosis

on:
  push:
    branches:
      - feat/comment-agent-mention-dispatch
    paths:
      - .github/workflows/one-shot-pr757-coverage-diagnose.yml

concurrency:
  group: one-shot-pr757-coverage-diagnose
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact diagnostic head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Measure exact-head full-suite coverage without publishing logs
        run: |
          set +e
          python -m coverage erase
          env -u GITHUB_EVENT_PATH python -m coverage run -m pytest tests -q \
            >"${RUNNER_TEMP}/pytest-output.txt" 2>&1
          test_status=$?
          python -m coverage json --pretty-print -o "${RUNNER_TEMP}/coverage.json"
          coverage_status=$?
          set -e
          TEST_STATUS="$test_status" COVERAGE_STATUS="$coverage_status" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          coverage_path = Path(os.environ["RUNNER_TEMP"]) / "coverage.json"
          pytest_path = Path(os.environ["RUNNER_TEMP"]) / "pytest-output.txt"
          coverage = json.loads(coverage_path.read_text(encoding="utf-8"))
          pytest_text = pytest_path.read_text(encoding="utf-8", errors="replace")

          files = {}
          for path, entry in sorted(coverage.get("files", {}).items()):
              summary = entry.get("summary", {})
              missing_lines = entry.get("missing_lines", [])
              missing_branches = entry.get("missing_branches", [])
              if missing_lines or missing_branches:
                  files[path] = {
                      "summary": summary,
                      "missing_lines": missing_lines,
                      "missing_branches": missing_branches,
                  }

          failure_nodes = []
          for line in pytest_text.splitlines():
              match = re.match(r"FAILED\s+([^\s]+)", line)
              if match:
                  failure_nodes.append(match.group(1))

          report = {
              "head_sha": os.environ["GITHUB_SHA"],
              "pytest_exit_code": int(os.environ["TEST_STATUS"]),
              "coverage_json_exit_code": int(os.environ["COVERAGE_STATUS"]),
              "coverage_totals": coverage.get("totals", {}),
              "failed_test_nodes": sorted(set(failure_nodes)),
              "files_with_missing_evidence": files,
          }
          output = Path("docs/validation/pr757-coverage-diagnostics.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Commit bounded diagnostic evidence and remove one-shot workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-pr757-coverage-diagnose.yml
          git add docs/validation/pr757-coverage-diagnostics.json
          git commit -m "test(control-plane): capture exact-head coverage gaps"
          git push origin "HEAD:${GITHUB_REF_NAME}"
