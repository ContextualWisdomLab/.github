name: Pingora Edge EgressWeave Opener Quality CI

# Gates scripts/ci/pingora_edge_egress_opener.py: the EgressWeave-backed
# adapter prepared for scripts/ci/pingora_edge_policy.py's GitHub REST calls
# (see docs/adr/0021-pingora-edge-policy-egressweave-migration.md). This
# module depends on the vendor/egressweave git submodule and on
# requirements-pingora-egress-ci-hashes.txt, neither of which the general
# coverage-evidence pipeline (which fetches with --no-recurse-submodules)
# provides — so this file is omitted from the root pyproject.toml coverage
# config and instead gated here, in a job that always initializes the
# submodule.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pingora-edge-egress-opener-quality-ci.yml"
      - "scripts/ci/pingora_edge_egress_opener.py"
      - "tests/test_pingora_edge_egress_opener.py"
      - "vendor/egressweave"
      - ".gitmodules"
      - "requirements-pingora-egress-ci.txt"
      - "requirements-pingora-egress-ci-hashes.txt"
      - "requirements-opencode-review-ci-hashes.txt"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pingora-edge-egress-opener-quality-ci.yml"
      - "scripts/ci/pingora_edge_egress_opener.py"
      - "tests/test_pingora_edge_egress_opener.py"
      - "vendor/egressweave"
      - ".gitmodules"
      - "requirements-pingora-egress-ci.txt"
      - "requirements-pingora-egress-ci-hashes.txt"
      - "requirements-opencode-review-ci-hashes.txt"
      - "pyproject.toml"

concurrency:
  group: pingora-edge-egress-opener-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  full-quality-gate:
    name: Python 3.14 full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout with submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Verify the EgressWeave submodule pin resolved to real source
        run: |
          set -euo pipefail
          if [ ! -f vendor/egressweave/src/egressweave/__init__.py ]; then
            echo "::error::vendor/egressweave submodule did not check out; is .gitmodules correct?"
            exit 1
          fi

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-opencode-review-ci-hashes.txt
            requirements-pingora-egress-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked EgressWeave runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-pingora-egress-ci-hashes.txt

      - name: Run the opener tests with complete branch coverage
        run: |
          cat >"${RUNNER_TEMP}/pingora-egress-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/pingora_edge_egress_opener.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/pingora-egress-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest tests/test_pingora_edge_egress_opener.py -q
          python -m coverage report

      - name: Run complete central test and branch coverage gate
        run: |
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report

      - name: Enforce complete production docstrings
        run: python -m interrogate --fail-under 100 scripts/ci/pingora_edge_egress_opener.py

      - name: Compile production and test contracts
        run: |
          python -m compileall -q \
            scripts/ci/pingora_edge_egress_opener.py \
            tests/test_pingora_edge_egress_opener.py
