name: Repair PR 1120 contextual sidecar

on:
  push:
    branches: [add-contextual-orchestrator-sidecar]
    paths:
      - '.github/workflows/repair-pr-1120-contextual-sidecar.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: add-contextual-orchestrator-sidecar
          fetch-depth: 0

      - name: Apply bounded review fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          noema = Path('.github/workflows/noema-review.yml')
          text = noema.read_text(encoding='utf-8')
          old = 'if [ -z "${NOEMA_LLM_API_URL:-}" ] && [ -z "${NOEMA_LLM_MODEL:-}" ] && [ -n "${CONTEXTUAL_ORCHESTRATOR_BASE_URL:-}" ]; then'
          new = 'if [ "$TARGET_REPOSITORY_PRIVATE" = "false" ] && [ -z "${NOEMA_LLM_API_URL:-}" ] && [ -z "${NOEMA_LLM_MODEL:-}" ] && [ -n "${CONTEXTUAL_ORCHESTRATOR_BASE_URL:-}" ]; then'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one Noema sidecar auto-route condition')
          noema.write_text(text.replace(old, new), encoding='utf-8')

          opencode = Path('.github/workflows/opencode-review-dispatch.yml')
          text = opencode.read_text(encoding='utf-8')
          pattern = re.compile(r'("enabled_providers"\s*:\s*\[)([^\]]+)(\])')
          matches = list(pattern.finditer(text))
          candidates = [m for m in matches if '"nvidia-nim"' in m.group(2) and '"github-models"' in m.group(2)]
          if len(candidates) != 1:
              raise SystemExit(f'expected exactly one generated OpenCode provider allowlist, found {len(candidates)}')
          match = candidates[0]
          if '"contextual-orchestrator"' not in match.group(2):
              replacement = match.group(1) + match.group(2).rstrip() + ', "contextual-orchestrator"' + match.group(3)
              text = text[:match.start()] + replacement + text[match.end():]
          opencode.write_text(text, encoding='utf-8')
          PY

      - name: Verify focused contracts
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_contextual_orchestrator_sidecar_contract.py \
            tests/test_noema_review_gate.py \
            tests/test_opencode_agent_contract.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path('.github/workflows/noema-review.yml'),
              Path('.github/workflows/opencode-review-dispatch.yml'),
          ]:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY

      - name: Commit verified repair and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-pr-1120-contextual-sidecar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/noema-review.yml .github/workflows/opencode-review-dispatch.yml tests/test_contextual_orchestrator_sidecar_contract.py
          git commit -m 'fix: honor contextual sidecar review boundaries'
          git push origin HEAD:add-contextual-orchestrator-sidecar
