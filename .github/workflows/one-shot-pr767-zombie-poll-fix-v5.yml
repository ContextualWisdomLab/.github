name: One-shot PR 767 polling repair final verification

on:
  push:
    branches: [fix/sandboxed-output-resource-bounds]
    paths:
      - .github/workflows/one-shot-pr767-zombie-poll-fix-v5.yml

permissions:
  contents: write

concurrency:
  group: one-shot-pr767-zombie-poll-fix-v5
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout contributor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/sandboxed-output-resource-bounds
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply polling and hermetic Git repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/ci/run_opencode_review_model_pool.sh")
          script = script_path.read_text(encoding="utf-8")
          old_loop = 'while kill -0 "$opencode_pid" 2>/dev/null; do\n'
          new_loop = 'while jobs -pr | grep -Fxq "$opencode_pid"; do\n'
          if old_loop in script:
              if script.count(old_loop) != 1:
                  raise SystemExit(
                      f"expected one kill-zero polling loop, found {script.count(old_loop)}"
                  )
              script = script.replace(old_loop, new_loop, 1)
          elif new_loop not in script:
              raise SystemExit("completed-process polling loop has an unexpected shape")
          script_path.write_text(script, encoding="utf-8")

          model_test_path = Path("tests/test_opencode_model_pool_runner.py")
          model_tests = model_test_path.read_text(encoding="utf-8")
          model_start_marker = (
              "def test_model_text_quoting_error_signatures_does_not_kill_run("
              "tmp_path: Path) -> None:\n"
          )
          model_end_marker = (
              "\n\ndef test_delisted_openrouter_model_error_kills_hung_run_early"
          )
          model_start = model_tests.index(model_start_marker)
          model_end = model_tests.index(model_end_marker, model_start)
          model_replacement = (
              "def test_model_text_quoting_error_signatures_does_not_kill_run(tmp_path: Path) -> None:\n"
              "    \"\"\"Model prose mentioning fatal signatures never kills or strands a healthy run.\"\"\"\n"
              "    start = time.monotonic()\n"
              "    result = run_failed_model(\n"
              "        tmp_path,\n"
              "        json_line=(\n"
              "            '{\"type\":\"text\",\"text\":\"This PR hardens ContextOverflowError and '\n"
              "            'context window handling in the model pool.\"}'\n"
              "        ),\n"
              "        extra_env={\"FAKE_OPENCODE_HANG_SECONDS\": \"4\"},\n"
              "    )\n"
              "    elapsed = time.monotonic() - start\n"
              "\n"
              "    assert result.returncode == 1\n"
              "    assert \"logged a fatal provider error while still running\" not in result.stdout\n"
              "    assert elapsed < 15\n"
          )
          model_test_path.write_text(
              model_tests[:model_start] + model_replacement + model_tests[model_end:],
              encoding="utf-8",
          )

          contract_path = Path("tests/test_opencode_agent_contract.py")
          contracts = contract_path.read_text(encoding="utf-8")
          function_marker = (
              "def test_sandbox_git_config_env_marks_only_the_validated_worktree_safe("
              "tmp_path):\n"
          )
          function_start = contracts.index(function_marker)
          env_start = contracts.index("    base_env = {\n", function_start)
          env_end = contracts.index("    refused = subprocess.run(\n", env_start)
          env_replacement = (
              "    base_env = {\n"
              "        **os.environ,\n"
              "        \"GIT_TEST_ASSUME_DIFFERENT_OWNER\": \"1\",\n"
              "        \"GIT_CONFIG_NOSYSTEM\": \"1\",\n"
              "        \"GIT_CONFIG_GLOBAL\": \"/dev/null\",\n"
              "    }\n"
          )
          contracts = contracts[:env_start] + env_replacement + contracts[env_end:]
          contract_path.write_text(contracts, encoding="utf-8")
          PY

      - name: Verify focused regressions and complete quality contract
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_opencode_model_pool_runner.py::test_fatal_provider_error_kills_hung_opencode_run_early \
            tests/test_opencode_model_pool_runner.py::test_model_text_quoting_error_signatures_does_not_kill_run \
            tests/test_opencode_model_pool_runner.py::test_delisted_openrouter_model_error_kills_hung_run_early \
            tests/test_opencode_agent_contract.py::test_sandbox_git_config_env_marks_only_the_validated_worktree_safe
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci
          python -m compileall -q scripts tests
          bash -n scripts/ci/run_opencode_review_model_pool.sh
          git diff --check

      - name: Publish verified repair and remove one-shot workflows
        env:
          BRANCH_NAME: fix/sandboxed-output-resource-bounds
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-shot-pr767-zombie-poll-fix.yml \
            .github/workflows/one-shot-pr767-zombie-poll-fix-v2.yml \
            .github/workflows/one-shot-pr767-zombie-poll-fix-v3.yml \
            .github/workflows/one-shot-pr767-zombie-poll-fix-v4.yml \
            .github/workflows/one-shot-pr767-zombie-poll-fix-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No polling and Git isolation repair generated" >&2; exit 1; }
          git commit -m "fix(opencode): reap completed model attempts"
          git push origin "HEAD:${BRANCH_NAME}"
