name: TEMP PR1669 cancellation authority repair

on:
  push:
    branches: [fix/scheduler-stale-headrefoid-cancellation]
    paths:
      - .github/workflows/_temp_pr1669_failed_cancel_result_repair.yml
      - scripts/ci/pr_review_merge_scheduler.py
      - tests/test_pr1669_cancel_stale_opencode_runs.py
      - tests/test_pr1669_central_run_revalidation_credential.py
      - tests/test_pr_review_merge_scheduler.py

concurrency:
  group: temp-pr1669-cancellation-authority-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/scheduler-stale-headrefoid-cancellation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact writer head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact writer head before any branch-controlled work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$EXPECTED_HEAD"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install hash-locked review dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove failed-cancellation regressions are RED
        run: |
          set -euo pipefail
          set +e
          output="$(PYTHONPATH=. python -m pytest -q \
            tests/test_pr1669_cancel_stale_opencode_runs.py::test_cancel_stale_opencode_runs_preserves_failed_cancellation \
            tests/test_pr1669_cancel_stale_opencode_runs.py::test_cancel_stale_pr_runs_preserves_failed_cancellation \
            tests/test_pr1669_cancel_stale_opencode_runs.py::test_cancel_revalidated_review_run_refs_preserves_failed_cancellation 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -Eq '3 failed'

      - name: Prove central-run credential regression is RED
        run: |
          set -euo pipefail
          set +e
          output="$(PYTHONPATH=. python -m pytest -q \
            tests/test_pr1669_central_run_revalidation_credential.py::test_central_run_revalidation_uses_dispatch_credential 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -Eq '1 failed'

      - name: Apply cancellation-result and credential-owner repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/pr_review_merge_scheduler.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '        force_cancel_workflow_runs(repo, [run_id])\n        return run_id\n',
                  '        failures = force_cancel_workflow_runs(repo, [run_id])\n        return None if run_id in failures else run_id\n',
                  'direct cancellation result',
              ),
              (
                  '        force_cancel_workflow_runs(run_repo, [run_id])\n        return run_id\n',
                  '        failures = force_cancel_workflow_runs(run_repo, [run_id])\n        return None if run_id in failures else run_id\n',
                  'review cancellation result',
              ),
              (
                  '        force_cancel_workflow_runs(run_repo, [run_id])\n        return "cancelled", run_ref\n',
                  '        failures = force_cancel_workflow_runs(run_repo, [run_id])\n        return ("preserved" if run_id in failures else "cancelled"), run_ref\n',
                  'dispatch cancellation result',
              ),
              (
                  '    payload = gh_api_json(f"repos/{run_repo}/actions/runs/{run_id}")\n',
                  '    run_path = f"repos/{run_repo}/actions/runs/{run_id}"\n'
                  '    central_repo = (os.environ.get("SCHEDULER_REQUIRED_WORKFLOW_REPOSITORY") or "").strip()\n'
                  '    if central_repo and run_repo == validate_github_repository(central_repo):\n'
                  '        payload = gh_api_json_via_dispatch_token(run_path)\n'
                  '    else:\n'
                  '        payload = gh_api_json(run_path)\n',
                  'run-host credential selection',
              ),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Repair successful-cancellation test doubles to the production return contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repairs = {
              Path('tests/test_pr1669_cancel_stale_opencode_runs.py'): (
                  (
                      'lambda repo, run_ids: cancelled.append((repo, list(run_ids))),',
                      'lambda repo, run_ids: (cancelled.append((repo, list(run_ids))), {})[1],',
                  ),
              ),
              Path('tests/test_pr_review_merge_scheduler.py'): (
                  (
                      'lambda repo, run_ids: cancelled.append((repo, run_ids)),',
                      'lambda repo, run_ids: (cancelled.append((repo, run_ids)), {})[1],',
                  ),
                  (
                      'lambda repo, run_ids: cancelled.append((repo, list(run_ids))),',
                      'lambda repo, run_ids: (cancelled.append((repo, list(run_ids))), {})[1],',
                  ),
              ),
          }
          for path, replacements in repairs.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Verify focused cancellation authority
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_pr1669_cancel_stale_opencode_runs.py \
            tests/test_pr1669_central_run_revalidation_credential.py \
            tests/test_pr_review_merge_scheduler.py
          git diff --check

      - name: Verify repository quality
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate scripts/ci
          python -m compileall -q scripts tests
          git diff --check

      - name: Publish verified exact successor and retire the only writer
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKFLOW_PUSH_TOKEN"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git rm .github/workflows/_temp_pr1669_failed_cancel_result_repair.yml
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/_temp_pr1669_failed_cancel_result_repair.yml \
            scripts/ci/pr_review_merge_scheduler.py \
            tests/test_pr1669_cancel_stale_opencode_runs.py \
            tests/test_pr_review_merge_scheduler.py | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(scheduler): preserve and revalidate stale review authority"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
