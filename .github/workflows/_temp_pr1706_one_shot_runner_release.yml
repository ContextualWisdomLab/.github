name: Temporary PR1706 One-shot Runner Release Repair

on:
  push:
    branches:
      - fix/opencode-poll-wall-clock-bound
    paths:
      - .github/workflows/_temp_pr1706_one_shot_runner_release.yml

permissions:
  contents: write

concurrency:
  group: temp-pr1706-one-shot-runner-release
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked repository test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove runner-release regression is RED
        run: |
          set -euo pipefail
          if PYTHONPATH=. python3 -m pytest -q tests/test_opencode_required_verdict_runner_release.py; then
            echo '::error::Expected one-shot runner-release regression to be RED before production repair.'
            exit 1
          fi

      - name: Apply deterministic owner repair
        env:
          STEP_B64: 
          RATE_B64: 
          SELF_B64: 
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          workflow_path = Path('.github/workflows/opencode-review.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start = '      - name: Fail closed without a current-head OpenCode verdict\n'
          end = '\n  cancel-superseded-opencode-review-runs:\n'
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              raise SystemExit('OpenCode required-verdict step boundaries drifted')
          before, rest = workflow.split(start, 1)
          _old, after = rest.split(end, 1)
          replacement = base64.b64decode(os.environ['STEP_B64']).decode()
          workflow_path.write_text(before + replacement + end + after, encoding='utf-8')

          Path('tests/test_opencode_poll_rate_budget.py').write_text(
              base64.b64decode(os.environ['RATE_B64']).decode(), encoding='utf-8'
          )
          Path('tests/test_opencode_poll_self_retirement.py').write_text(
              base64.b64decode(os.environ['SELF_B64']).decode(), encoding='utf-8'
          )

          regression_path = Path('tests/test_opencode_required_verdict_regression.py')
          regression = regression_path.read_text(encoding='utf-8')
          old = '    assert "while :; do" in target_job\n    assert \'sleep "$poll_interval_seconds"\' in target_job\n'
          new = '    assert "while :; do" not in target_job\n    assert "poll_interval_seconds" not in target_job\n    assert "poll_deadline_epoch" not in target_job\n    assert \'sleep "$poll_interval_seconds"\' not in target_job\n'
          count = regression.count(old)
          if count != 1:
              raise SystemExit(f'obsolete polling assertions drifted: {count}')
          regression_path.write_text(regression.replace(old, new, 1), encoding='utf-8')

          doctoring_path = Path('docs/doctoring/opencode-stale-poll-self-retirement.md')
          doctoring = doctoring_path.read_text(encoding='utf-8')
          marker = '## 2026-09-02 one-shot runner-release supersession'
          if marker not in doctoring:
              doctoring += '\n\n' + marker + '\n\nThe required-verdict job no longer polls while model review continues. It performs one authoritative live-PR read followed by at most one paginated Reviews read. Missing or unavailable exact-head verdict evidence fails closed immediately and releases the runner. The authenticated `opencode-review-dispatch.yml` path remains responsible for waking the exact failed required run via `rerun-failed-jobs` when the formal verdict arrives. This removes repository-authored polling interval, retry-count, and wall-clock allocations from the review waiting path without imposing an inference timeout on contextual-orchestrator or the serving model.\n'
          doctoring_path.write_text(doctoring, encoding='utf-8')

          baseline_path = Path('docs/product-technical-gap-baseline.md')
          baseline = baseline_path.read_text(encoding='utf-8')
          marker = '### OPENCODE-ONE-SHOT-RUNNER-RELEASE-2026-09-02'
          if marker not in baseline:
              baseline += '\n\n' + marker + '\n- Owner: `ContextualWisdomLab/.github` Required OpenCode Review control plane.\n- RCA: the required-verdict job occupied a runner while waiting for asynchronous model work, using repository-authored poll interval, transport retry count, and wall-clock deadline despite an existing authenticated exact-run wake contract in the dispatch workflow.\n- GREEN contract: one live PR read + one Reviews read; absence/transport failure is immediately non-passing, and the dispatch owner wakes the exact failed run after a verdict. Model reasoning/streaming receives no caller wall-clock timeout.\n- Regression: `tests/test_opencode_required_verdict_runner_release.py`, one-shot request-budget/state tests, and the existing exact-run dispatch validation.\n'
          baseline_path.write_text(baseline, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          note = '- Required OpenCode Review now releases its runner after one exact-head verdict admission read and relies on the authenticated exact-run dispatch wake instead of repository-authored polling, retry-count, or waiting deadlines.\n'
          if note not in changelog:
              changelog_path.write_text(note + changelog, encoding='utf-8')
          PY

      - name: Verify GREEN focused contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_poll_rate_budget.py \
            tests/test_opencode_poll_self_retirement.py \
            tests/test_opencode_required_verdict_regression.py
          python3 -m compileall -q scripts tests
          git diff --check

      - name: Verify broader repository suite
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest tests -q
          git diff --check

      - name: Publish only from unchanged writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/opencode-poll-wall-clock-bound
          live_head="$(git rev-parse origin/fix/opencode-poll-wall-clock-bound)"
          if [ "$live_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::Writer branch advanced to $live_head; refusing stale publication."
            exit 1
          fi
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git add .github/workflows/opencode-review.yml \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_poll_rate_budget.py \
            tests/test_opencode_poll_self_retirement.py \
            tests/test_opencode_required_verdict_regression.py \
            docs/doctoring/opencode-stale-poll-self-retirement.md \
            docs/product-technical-gap-baseline.md CHANGELOG.md
          git diff --cached --check
          git commit -m "fix(opencode): release required runner after one verdict read"
          git push origin HEAD:fix/opencode-poll-wall-clock-bound
