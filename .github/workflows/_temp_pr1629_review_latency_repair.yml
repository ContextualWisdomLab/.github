name: One-shot PR1629 review latency repair

on:
  push:
    branches:
      - fix/no-heuristic-review-admission-current-main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install declared hash-verified quality toolchain
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Apply causal source and contract repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          launcher_path = Path("scripts/ci/contextual_orchestrator_review_launcher.py")
          text = launcher_path.read_text(encoding="utf-8")
          old_import = "import argparse\nimport json"
          if old_import not in text and "from concurrent.futures import ThreadPoolExecutor" not in text:
              raise SystemExit("launcher import anchor missing")
          text = text.replace(
              old_import,
              "import argparse\nfrom concurrent.futures import ThreadPoolExecutor\nimport json",
              1,
          )

          start = text.index("def _preflight_review_agents(")
          end = text.index("\ndef _preflight_with_fallback(", start)
          replacement = r'''def _preflight_review_agent(
              agent: object, *, client: Any
          ) -> tuple[object | None, dict[str, object], int]:
              """Probe one admitted route without sharing retry state with another route."""
              row: dict[str, object] = {
                  "agent_id": str(getattr(agent, "id", "")),
                  "provider": str(getattr(agent, "provider_name", "") or "unknown"),
                  "model": str(getattr(agent, "model", "")),
                  "attempts": 1,
              }
              base_payload: dict[str, object] = {
                  "model": getattr(agent, "model", ""),
                  "messages": [
                      {"role": "system", "content": "You are a helpful assistant."},
                      {"role": "user", "content": "Reply with just 'OK'."},
                  ],
                  "temperature": REVIEW_TEMPERATURE,
                  "max_tokens": REVIEW_PREFLIGHT_BASE_TOKENS,
                  "stream": False,
              }
              try:
                  response = client.proxy_send_once(agent, "chat/completions", base_payload)
              except Exception as exc:  # noqa: BLE001 - sanitize at the provider boundary
                  _record_provider_exception(row, exc)
                  return None, row, 0
              if _chat_response_has_text(response):
                  row["status"] = "ready"
                  row["finish_reason"] = _response_finish_reason(response) or "unknown"
                  row["reasoning_without_content"] = _response_has_reasoning_without_content(response)
                  return agent, row, 0

              finish_reason = _response_finish_reason(response)
              row["finish_reason"] = finish_reason or "unknown"
              reasoning_without_content = _response_has_reasoning_without_content(response)
              row["reasoning_without_content"] = reasoning_without_content
              budget_signature = finish_reason == "length" or reasoning_without_content
              if not budget_signature:
                  row["status"] = "rejected"
                  row["error_type"] = "invalid_chat_response"
                  return None, row, 0

              row["attempts"] = 2
              escalated_payload = dict(base_payload)
              escalated_payload["max_tokens"] = REVIEW_PREFLIGHT_ESCALATED_TOKENS
              try:
                  escalated_response = client.proxy_send_once(
                      agent, "chat/completions", escalated_payload
                  )
              except Exception as exc:  # noqa: BLE001 - sanitize at the provider boundary
                  _record_provider_exception(row, exc)
                  return None, row, 1
              if _chat_response_has_text(escalated_response):
                  row["status"] = "ready"
                  row["escalated"] = True
                  row["finish_reason"] = _response_finish_reason(escalated_response) or "unknown"
                  row["reasoning_without_content"] = _response_has_reasoning_without_content(
                      escalated_response
                  )
                  return agent, row, 1

              row["status"] = "rejected"
              row["error_type"] = "invalid_chat_response"
              row["finish_reason"] = _response_finish_reason(escalated_response) or "unknown"
              row["reasoning_without_content"] = _response_has_reasoning_without_content(
                  escalated_response
              )
              return None, row, 1


          def _preflight_review_agents(
              agents: list[object], *, client: Any
          ) -> tuple[list[object], dict[str, object]]:
              """Probe all admitted routes concurrently while preserving evidence order.

              Admission and startup readiness are separate contracts.  Every evidence-
              eligible route stays in the catalog; this probe only determines which
              routes are immediately usable by the sidecar.  Provider calls start in
              one concurrent wave, so one slow route cannot make startup latency equal
              the sum of every route's latency.  There is no provider/model preference,
              first-come quota, or membership cap: each admitted route receives the
              same one base attempt and only its own explicit budget-starvation signal
              can trigger its one escalated attempt.

              ``ModelClient`` keeps per-call usage state in thread-local storage and its
              provider concurrency guard is already thread-safe, so sharing the client
              preserves the vendored transport contract without cross-route telemetry
              aliasing.  Results are gathered in input order to keep exact catalog-to-
              evidence provenance deterministic even when providers finish out of order.
              """
              if not agents:
                  report: dict[str, object] = {
                      "contract": "strix-plain-chat-preflight-v2",
                      "probed_count": 0,
                      "ready_count": 0,
                      "rejected_count": 0,
                      "escalations_used": 0,
                      "routes": [],
                  }
                  raise ReviewPreflightError(
                      "no provider route passed the Strix plain-chat preflight", report
                  )

              with ThreadPoolExecutor(
                  max_workers=len(agents), thread_name_prefix="review-preflight"
              ) as executor:
                  futures = [
                      executor.submit(_preflight_review_agent, agent, client=client)
                      for agent in agents
                  ]
                  outcomes = [future.result() for future in futures]

              viable: list[object] = []
              routes: list[dict[str, object]] = []
              escalations_used = 0
              for ready_agent, row, escalations in outcomes:
                  routes.append(row)
                  escalations_used += escalations
                  if ready_agent is not None:
                      viable.append(ready_agent)

              report = {
                  "contract": "strix-plain-chat-preflight-v2",
                  "probed_count": len(agents),
                  "ready_count": len(viable),
                  "rejected_count": len(agents) - len(viable),
                  "escalations_used": escalations_used,
                  "routes": routes,
              }
              if not viable:
                  raise ReviewPreflightError(
                      "no provider route passed the Strix plain-chat preflight", report
                  )
              return viable, report

'''
          text = text[:start] + replacement + text[end + 1:]

          # The central launcher is free-only. Keep _preflight_with_fallback as a
          # policy-library compatibility seam exercised by historical regression
          # tests, but remove its unreachable auto-pool production plumbing.
          text = text.replace(
              '        PolicyError,\n        _load_zdr_endpoints,',
              '        _load_zdr_endpoints,',
              1,
          )
          free_start = text.index("    free_rows = [\n", text.index("normalized_rows ="))
          result_anchor = "    result = build_zdr_prioritized_catalog(\n        primary_rows,"
          result_at = text.index(result_anchor, free_start)
          text = (
              text[:free_start]
              + "    result = build_zdr_prioritized_catalog(\n        normalized_rows,"
              + text[result_at + len(result_anchor):]
          )
          agents_at = text.index("    agents = load_agents(args.catalog_out)\n")
          client_at = text.index("    client = ModelClient(\n", agents_at)
          text = text[: agents_at + len("    agents = load_agents(args.catalog_out)\n")] + text[client_at:]
          old_call = '''    try:
              agents, preflight_report, fallback_used = _preflight_with_fallback(
                  agents, fallback_agents, client=client
              )
          except ReviewPreflightError as exc:
              _write_json(args.preflight_out, exc.report)
              _log_preflight_rejections(exc.report)
              raise SystemExit(f"review sidecar preflight failed: {exc}") from None
          if fallback_used and fallback_result is not None:
              Path(args.catalog_out).write_text(
                  json.dumps({"agents": fallback_result["agents"]}, indent=2, sort_keys=True)
                  + "\\n",
                  encoding="utf-8",
              )
              result = fallback_result
              result["report"]["fallback_reason"] = "primary_routes_unavailable"
              _write_json(args.report_out, result["report"])
          _write_json(args.preflight_out, preflight_report)
'''
          new_call = '''    try:
              agents, preflight_report = _preflight_review_agents(agents, client=client)
          except ReviewPreflightError as exc:
              _write_json(args.preflight_out, exc.report)
              _log_preflight_rejections(exc.report)
              raise SystemExit(f"review sidecar preflight failed: {exc}") from None
          _write_json(args.preflight_out, preflight_report)
'''
          if old_call not in text:
              raise SystemExit("launcher production preflight anchor missing")
          text = text.replace(old_call, new_call, 1)
          launcher_path.write_text(text, encoding="utf-8")

          policy_path = Path("scripts/ci/contextual_orchestrator_review_policy.py")
          policy = policy_path.read_text(encoding="utf-8")
          parser_anchor = "\ndef _build_parser() -> argparse.ArgumentParser:\n"
          helper = r'''
          def _warn_explicit_legacy_options(argv: list[str]) -> None:
              """Surface stale cardinality configuration without restoring its authority."""
              for option in ("--limit", "--account-cap"):
                  if any(argument == option or argument.startswith(f"{option}=") for argument in argv):
                      print(
                          f"contextual-orchestrator review policy: {option} is deprecated and ignored",
                          file=sys.stderr,
                      )

'''
          if "def _warn_explicit_legacy_options" not in policy:
              if parser_anchor not in policy:
                  raise SystemExit("policy parser anchor missing")
              policy = policy.replace(parser_anchor, "\n" + helper + "def _build_parser() -> argparse.ArgumentParser:\n", 1)
          old_main = '''def main(argv: list[str] | None = None) -> int:
              """Run the catalog CLI and return one on policy or input failure."""
              args = _build_parser().parse_args(argv)
'''
          new_main = '''def main(argv: list[str] | None = None) -> int:
              """Run the catalog CLI and return one on policy or input failure."""
              effective_argv = list(sys.argv[1:] if argv is None else argv)
              args = _build_parser().parse_args(effective_argv)
              _warn_explicit_legacy_options(effective_argv)
'''
          if old_main not in policy:
              raise SystemExit("policy main anchor missing")
          policy = policy.replace(old_main, new_main, 1)
          policy_path.write_text(policy, encoding="utf-8")

          adr3 = Path("docs/adr/0003-contextual-orchestrator-vendored-free-zdr.md")
          doc = adr3.read_text(encoding="utf-8")
          old = '''  that gate. The evidence itself remains useful regardless: it is exactly
          the live signal for when "the free-catalog's stale-model and
          provider-diversity gaps documented alongside this amendment" (above) are
          closed, without requiring a manual re-audit.
'''
          new = '''  that gate. The evidence itself remains useful as an account-level
          diagnostic, but it is not an exact provider/outage-domain diversity signal:
          multiple credentialed accounts can share one provider or outage domain.
          Closing the reliability risk therefore requires separately modeled provider/
          outage-domain evidence rather than treating account cardinality as routing
          authority or as proof that the earlier diversity gap is closed.
'''
          if old not in doc:
              raise SystemExit("ADR-0003 monitoring contradiction anchor missing")
          adr3.write_text(doc.replace(old, new, 1), encoding="utf-8")

          adr5 = Path("docs/adr/0005-contextual-orchestrator-review-preflight-budget.md")
          doc5 = adr5.read_text(encoding="utf-8")
          appendix = '''\n\n## 2026-09-02 startup-latency amendment\n\nAdmission evidence and runtime readiness are distinct. The central free-only\ncatalog retains every evidence-eligible route. Startup probes those admitted\nroutes concurrently, with identical per-route base/escalation semantics and\ndeterministic input-order evidence, so one slow provider cannot serialize the\nwhole catalog and consume the review workflow deadline. Concurrency changes no\nroute membership, priority, cost/ZDR decision, or provider preference; it only\nremoves additive startup latency. The regression uses a synchronization barrier\nrather than a wall-clock threshold, proving that all admitted routes enter the\nprobe before any one route is allowed to complete.\n'''
          if "## 2026-09-02 startup-latency amendment" not in doc5:
              adr5.write_text(doc5.rstrip() + appendix + "\n", encoding="utf-8")

          doctor = Path("docs/doctoring/contextual-orchestrator-strix-free-diversity-evidence.md")
          doctor_text = doctor.read_text(encoding="utf-8")
          marker = "PR #1629 restores that contract on current protected-main lineage"
          note = '''Startup readiness follows the same separation: complete admission evidence\nremains durable, while all admitted routes are probed concurrently and reported\nin catalog order. This removes additive provider latency without turning probe\ncompletion order into routing authority.\n\n'''
          if note not in doctor_text:
              doctor_text = doctor_text.replace(marker, note + marker, 1)
              doctor.write_text(doctor_text, encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text(encoding="utf-8")
          baseline_note = '''\n\n### 2026-09-02 Noema/OpenCode reviewer readiness false-negative regression\n\nExternal review on `.github#1629` demonstrated a real operational false negative:\nfull evidence admission had been coupled to sequential startup probing, so a large\nset of individually slow provider routes could consume the review deadline before\nNoema/OpenCode began serving. The repair keeps evidence admission complete, starts\nper-route readiness probes concurrently with no provider preference, preserves\ninput-order/source evidence, and keeps each candidate's budget escalation local.\n`tests/test_contextual_orchestrator_review_preflight_concurrency.py` is the durable\nbarrier-based regression: the old sequential implementation cannot pass it, while\nthe GREEN implementation proves all admitted routes can enter transport before any\nroute completes. Explicit legacy `--limit`/`--account-cap` CLI configuration now\nemits diagnostics while remaining decision-inert. The pinned contextual-orchestrator\nranking contract was also re-audited: `_static_rank_key` ends in `agent.id`, so equal\nneutral priorities do not inherit discovery/list order as a routing tiebreak.\n'''
          if "### 2026-09-02 Noema/OpenCode reviewer readiness false-negative regression" not in baseline_text:
              baseline.write_text(baseline_text.rstrip() + baseline_note + "\n", encoding="utf-8")
          PY

      - name: Verify focused RED-to-GREEN regressions
        run: |
          python -m pytest -q \
            tests/test_contextual_orchestrator_review_preflight_concurrency.py \
            tests/test_contextual_orchestrator_review_policy_deprecation.py \
            tests/test_contextual_orchestrator_review_runtime_preflight.py \
            tests/test_contextual_orchestrator_review_policy.py \
            tests/test_contextual_orchestrator_central_free_only.py
          python -m py_compile scripts/ci/contextual_orchestrator_review_launcher.py scripts/ci/contextual_orchestrator_review_policy.py

      - name: Verify repository quality contract
        run: |
          python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing
          python -m interrogate

      - name: Commit source/tests/docs and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git rm .github/workflows/_temp_pr1629_review_latency_repair.yml
          git add scripts/ci/contextual_orchestrator_review_launcher.py \
                  scripts/ci/contextual_orchestrator_review_policy.py \
                  docs/adr/0003-contextual-orchestrator-vendored-free-zdr.md \
                  docs/adr/0005-contextual-orchestrator-review-preflight-budget.md \
                  docs/doctoring/contextual-orchestrator-strix-free-diversity-evidence.md \
                  docs/product-technical-gap-baseline.md \
                  tests/test_contextual_orchestrator_review_preflight_concurrency.py \
                  tests/test_contextual_orchestrator_review_policy_deprecation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(review): bound full-catalog startup latency"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
