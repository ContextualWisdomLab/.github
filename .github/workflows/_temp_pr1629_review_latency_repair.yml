name: One-shot PR1629 review latency repair

on:
  push:
    branches:
      - fix/no-heuristic-review-admission-current-main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install declared hash-verified quality toolchain
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Apply causal source and contract repair
        run: python scripts/ci/_temp_pr1629_review_latency_repair.py

      - name: Verify focused RED-to-GREEN regressions
        run: |
          python -m pytest -q tests/test_contextual_orchestrator_review_preflight_concurrency.py tests/test_contextual_orchestrator_review_policy_deprecation.py tests/test_contextual_orchestrator_review_runtime_preflight.py tests/test_contextual_orchestrator_review_policy.py tests/test_contextual_orchestrator_central_free_only.py
          python -m py_compile scripts/ci/contextual_orchestrator_review_launcher.py scripts/ci/contextual_orchestrator_review_policy.py

      - name: Verify repository quality contract
        run: |
          python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing
          python -m interrogate

      - name: Commit repair and delete all temporary repair surfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/_temp_pr1629_review_latency_repair.yml
          git rm .github/_temp_pr1629_trigger.txt
          git rm scripts/ci/_temp_pr1629_review_latency_repair.py
          git add scripts/ci/contextual_orchestrator_review_launcher.py scripts/ci/contextual_orchestrator_review_policy.py docs/adr/0003-contextual-orchestrator-vendored-free-zdr.md docs/adr/0005-contextual-orchestrator-review-preflight-budget.md docs/doctoring/contextual-orchestrator-strix-free-diversity-evidence.md docs/product-technical-gap-baseline.md tests/test_contextual_orchestrator_review_preflight_concurrency.py tests/test_contextual_orchestrator_review_policy_deprecation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(review): bound full-catalog startup latency"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
