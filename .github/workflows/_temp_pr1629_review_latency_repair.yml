name: One-shot PR1629 workflow probe

on:
  push:
    branches:
      - fix/no-heuristic-review-admission-current-main

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - name: Prove job creation
        run: echo workflow-job-started
