name: Source Fix 1700 Noema Evidence Allocation

on:
  push:
    branches:
      - fix/noema-evidence-completeness-no-heuristics
    paths:
      - .github/workflows/source-fix-1700-noema-evidence-allocation.yml

permissions:
  contents: write

concurrency:
  group: source-fix-1700-noema-evidence-allocation
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/noema-evidence-completeness-no-heuristics
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-verified repository test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove exact-head evidence-allocation contract is RED
        run: |
          set -euo pipefail
          if PYTHONPATH=. python3 -m pytest -q tests/test_noema_no_heuristic_evidence_allocation.py; then
            echo '::error::Expected the no-heuristic evidence-allocation regression to be RED before repair.'
            exit 1
          fi

      - name: Apply deterministic owner repair
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)


          gate_path = Path("scripts/ci/noema_review_gate.py")
          gate = gate_path.read_text(encoding="utf-8")

          gate = replace_once(
              gate,
              "from scripts.ci.opencode_review_normalize_output import changed_file_is_material\n",
              "",
              "retire filename-derived materiality import",
          )

          constants = (
              "MAX_DIFF_CHARS = 60000\n",
              "MAX_CONTEXT_FILES = 12\n",
              "MAX_FILE_CONTEXT_CHARS = 4000\n",
              "MAX_REVIEW_CONTEXT_CHARS = 24000\n",
              "MAX_THREAD_BODY_CHARS = 1200\n",
          )
          for constant in constants:
              gate = replace_once(gate, constant, "", f"retire {constant.strip()}")

          schema_pattern = re.compile(
              r"def _noema_verdict_json_schema\(required_probes: int\) -> dict\[str, Any\]:\n.*?(?=\n\nclass NoemaModelOutputError)",
              re.S,
          )
          schema_replacement = '''def _noema_verdict_json_schema() -> dict[str, Any]:
              """Build the verdict JSON Schema without inventing an evidence-count floor.

              JSON Schema constrains the shape of each evidence item.  Completeness of a
              formal verdict is a relational invariant over the exact Git/GitHub changed
              path set and is therefore checked by ``validate_substantive_verdict`` rather
              than approximated by a caller-authored ``minItems`` count.
              """
              return {
                  "type": "object",
                  "additionalProperties": False,
                  "properties": {
                      "decision": {
                          "type": "string",
                          "enum": ["approve", "request_changes", "comment"],
                      },
                      "summary": {"type": "string"},
                      "reviewed_lines": {
                          "type": ["array", "null"],
                          "items": _NOEMA_REVIEWED_LINE_SCHEMA,
                      },
                      "adversarial_validation": {
                          "type": ["object", "null"],
                          "additionalProperties": False,
                          "properties": {
                              "status": {"type": "string", "enum": ["passed", "failed"]},
                              "residual_risk": {"type": "string"},
                              "probes": {
                                  "type": "array",
                                  "items": _NOEMA_PROBE_SCHEMA,
                              },
                          },
                          "required": ["status", "residual_risk", "probes"],
                      },
                      "findings": {"type": "array", "items": _NOEMA_FINDING_SCHEMA},
                  },
                  "required": [
                      "decision",
                      "summary",
                      "reviewed_lines",
                      "adversarial_validation",
                      "findings",
                  ],
              }


          def _noema_verdict_response_format() -> dict[str, Any]:
              """Build the OpenAI structured-output envelope for the verdict schema."""
              return {
                  "type": "json_schema",
                  "json_schema": {
                      "name": "noema_review_verdict",
                      "strict": True,
                      "schema": _noema_verdict_json_schema(),
                  },
              }


          def _schema_max_container_depth(schema: dict[str, Any]) -> int:
              """Derive the maximum JSON object/array depth admitted by ``schema``.

              This is a structural property of the exact declared verdict contract, not a
              guessed parser budget.  It is used before decoding untrusted model output so
              Python-version recursion behavior cannot widen the accepted shape.
              """
              schema_type = schema.get("type")
              type_values = {schema_type} if isinstance(schema_type, str) else set(schema_type or ())
              own_depth = 1 if type_values.intersection({"object", "array"}) else 0
              children: list[dict[str, Any]] = []
              properties = schema.get("properties")
              if isinstance(properties, dict):
                  children.extend(
                      child for child in properties.values() if isinstance(child, dict)
                  )
              items = schema.get("items")
              if isinstance(items, dict):
                  children.append(items)
              child_depth = max(
                  (_schema_max_container_depth(child) for child in children),
                  default=0,
              )
              return own_depth + child_depth
          '''
          gate, count = schema_pattern.subn(schema_replacement, gate, count=1)
          if count != 1:
              raise SystemExit(f"verdict schema block drifted: {count} matches")

          fetch_diff_pattern = re.compile(
              r"def fetch_diff\(repo: str, number: int\) -> tuple\[str, bool\]:\n.*?(?=\n\ndef changed_diff_locations)",
              re.S,
          )
          fetch_diff_replacement = '''def fetch_diff(repo: str, number: int) -> tuple[str, bool]:
              """Fetch the complete immutable PR diff without caller-side evidence sampling.

              contextual-orchestrator and the selected provider own model/context capability.
              If the complete request cannot be served, that boundary must fail closed rather
              than Noema silently dropping changed evidence.
              """
              diff = run(
                  [
                      "gh",
                      "api",
                      f"repos/{repo}/pulls/{number}",
                      "-H",
                      "Accept: application/vnd.github.v3.diff",
                  ]
              )
              return diff, False
          '''
          gate, count = fetch_diff_pattern.subn(fetch_diff_replacement, gate, count=1)
          if count != 1:
              raise SystemExit(f"fetch_diff block drifted: {count} matches")

          required_pattern = re.compile(
              r"def _required_probe_count\(diff: str, changed_paths: Sequence\[str\] = \(\)\) -> int:\n.*?(?=\n\ndef validate_substantive_verdict)",
              re.S,
          )
          required_replacement = '''def _required_changed_paths(
              diff: str, changed_paths: Sequence[str] = ()
          ) -> set[str]:
              """Return the exact changed-path universe a formal verdict must cover."""
              locations = changed_diff_locations(diff)
              supplied = {str(path) for path in changed_paths if str(path)}
              return supplied or {path for path, _line, _side in locations}
          '''
          gate, count = required_pattern.subn(required_replacement, gate, count=1)
          if count != 1:
              raise SystemExit(f"probe-count block drifted: {count} matches")

          validator_pattern = re.compile(
              r"def validate_substantive_verdict\(\n    verdict: dict\[str, Any\], diff: str, changed_paths: Sequence\[str\] = \(\)\n\) -> None:\n.*?(?=\n\ndef truncate_text)",
              re.S,
          )
          validator_replacement = '''def validate_substantive_verdict(
              verdict: dict[str, Any], diff: str, changed_paths: Sequence[str] = ()
          ) -> None:
              """Reject formal verdicts without exact changed-path evidence coverage."""
              decision = str(verdict.get("decision") or "").lower()
              if decision == "comment":
                  return
              locations = changed_diff_locations(diff)
              if not locations:
                  raise RuntimeError("Noema formal verdict requires parseable changed-line evidence")
              required_paths = _required_changed_paths(diff, changed_paths)
              location_paths = {path for path, _line, _side in locations}
              if not required_paths or not required_paths.issubset(location_paths):
                  raise NoemaModelOutputError(
                      "Noema formal verdict cannot cover every changed path with exact changed-side evidence"
                  )

              reviewed_lines = verdict.get("reviewed_lines")
              if not isinstance(reviewed_lines, list) or not reviewed_lines:
                  raise NoemaModelOutputError("Noema formal verdict requires reviewed changed-line evidence")
              reviewed_paths: set[str] = set()
              for index, reviewed in enumerate(reviewed_lines, start=1):
                  if not isinstance(reviewed, dict):
                      raise NoemaModelOutputError(f"Noema reviewed line {index} must be an object")
                  location = (reviewed.get("path"), reviewed.get("line"), reviewed.get("side"))
                  if location not in locations:
                      raise NoemaModelOutputError(f"Noema reviewed line {index} is not an exact changed-side line")
                  analysis = reviewed.get("analysis")
                  if not isinstance(analysis, str) or not analysis.strip():
                      raise NoemaModelOutputError(f"Noema reviewed line {index} requires concrete analysis")
                  reviewed_paths.add(str(reviewed["path"]))
              if not required_paths.issubset(reviewed_paths):
                  raise NoemaModelOutputError(
                      "Noema reviewed-line evidence must cover every changed path"
                  )

              validation = verdict.get("adversarial_validation")
              if not isinstance(validation, dict):
                  raise NoemaModelOutputError("Noema formal verdict requires adversarial_validation")
              status = validation.get("status")
              expected_status = "passed" if decision == "approve" else "failed"
              if status != expected_status:
                  raise NoemaModelOutputError(
                      f"Noema {decision} requires adversarial_validation.status={expected_status}"
                  )
              residual_risk = validation.get("residual_risk")
              if not isinstance(residual_risk, str) or not residual_risk.strip():
                  raise NoemaModelOutputError("Noema adversarial validation requires residual_risk")
              probes = validation.get("probes")
              if not isinstance(probes, list):
                  raise NoemaModelOutputError("Noema adversarial validation probes must be a list")

              confirmed: set[tuple[str, int, str]] = set()
              identities: set[tuple[Any, ...]] = set()
              probe_paths: set[str] = set()
              for index, probe in enumerate(probes, start=1):
                  if not isinstance(probe, dict):
                      raise NoemaModelOutputError(f"Noema adversarial probe {index} must be an object")
                  location = (probe.get("path"), probe.get("line"), probe.get("side"))
                  if location not in locations:
                      raise NoemaModelOutputError(f"Noema adversarial probe {index} is not an exact changed-side line")
                  for field in ("hypothesis", "attack_or_counterexample", "evidence"):
                      value = probe.get(field)
                      if not isinstance(value, str) or not value.strip():
                          raise NoemaModelOutputError(f"Noema adversarial probe {index} requires {field}")
                  outcome = probe.get("outcome")
                  if outcome not in {"falsified", "confirmed"}:
                      raise NoemaModelOutputError(
                          f"Noema adversarial probe {index} outcome must be falsified or confirmed"
                      )
                  identity = (
                      *location,
                      probe["hypothesis"].strip().casefold(),
                      probe["attack_or_counterexample"].strip().casefold(),
                  )
                  if identity in identities:
                      raise NoemaModelOutputError(
                          f"Noema adversarial probe {index} duplicates an earlier probe"
                      )
                  identities.add(identity)
                  probe_paths.add(str(probe["path"]))
                  if outcome == "confirmed":
                      confirmed.add(
                          (str(probe["path"]), int(probe["line"]), str(probe["side"]))
                      )
              if not required_paths.issubset(probe_paths):
                  raise NoemaModelOutputError(
                      "Noema adversarial probe evidence must cover every changed path"
                  )

              if decision == "approve" and confirmed:
                  raise NoemaModelOutputError(
                      "Noema approve cannot contain a confirmed adversarial probe"
                  )
              if decision == "request_changes":
                  finding_locations = {
                      (
                          str(finding.get("file") or ""),
                          finding.get("line"),
                          str(finding.get("side") or ""),
                      )
                      for finding in verdict.get("findings") or []
                      if isinstance(finding, dict)
                  }
                  if not confirmed or not confirmed.intersection(finding_locations):
                      raise NoemaModelOutputError(
                          "Noema request_changes requires a confirmed probe on a published finding"
                      )
          '''
          gate, count = validator_pattern.subn(validator_replacement, gate, count=1)
          if count != 1:
              raise SystemExit(f"validator block drifted: {count} matches")

          truncate_pattern = re.compile(
              r"\n\ndef truncate_text\(text: str, limit: int\) -> str:\n.*?(?=\n\ndef fetch_changed_files)",
              re.S,
          )
          gate, count = truncate_pattern.subn("", gate, count=1)
          if count != 1:
              raise SystemExit(f"truncate_text block drifted: {count} matches")

          gate = replace_once(
              gate,
              '        f"`{merge_base_sha}`:]\\n{truncate_text(content, MAX_FILE_CONTEXT_CHARS)}"\n',
              '        f"`{merge_base_sha}`:]\\n{content}"\n',
              "removed-file full context",
          )
          gate = replace_once(
              gate,
              '    if any(status == "removed" for _path, status in files[:MAX_CONTEXT_FILES]):\n',
              '    if any(status == "removed" for _path, status in files):\n',
              "removed-file scan coverage",
          )
          gate = replace_once(
              gate,
              '    for path, status in files[:MAX_CONTEXT_FILES]:\n',
              '    for path, status in files:\n',
              "changed-file full path coverage",
          )
          gate = replace_once(
              gate,
              '        sections.append(f"### {path}\\n{truncate_text(content, MAX_FILE_CONTEXT_CHARS)}")\n',
              '        sections.append(f"### {path}\\n{content}")\n',
              "changed-file full content",
          )
          omitted_pattern = re.compile(
              r"    if len\(files\) > MAX_CONTEXT_FILES:\n        sections\.append\(f\"\[\{len\(files\) - MAX_CONTEXT_FILES\} changed files omitted from context budget\]\"\)\n"
          )
          gate, count = omitted_pattern.subn("", gate, count=1)
          if count != 1:
              raise SystemExit(f"omitted-file marker block drifted: {count} matches")
          gate = replace_once(
              gate,
              '            body = truncate_text(str(comment.get("body") or "").strip(), MAX_THREAD_BODY_CHARS)\n',
              '            body = str(comment.get("body") or "").strip()\n',
              "full review-thread body",
          )
          gate = replace_once(
              gate,
              '    return truncate_text("\\n\\n".join(sections), MAX_REVIEW_CONTEXT_CHARS)\n',
              '    return "\\n\\n".join(sections)\n',
              "full review context",
          )

          gate = replace_once(
              gate,
              "\nMAX_JSON_NESTING_DEPTH = 100\n",
              "\n",
              "retire arbitrary JSON depth",
          )
          gate = gate.replace(
              "``MAX_JSON_NESTING_DEPTH`` (100 — generously above the\n    verdict schema's own real maximum of roughly 5 levels: object ->",
              "the container depth derived from ``_noema_verdict_json_schema()``. The\n    accepted depth therefore follows the exact verdict schema: object ->",
          )
          gate = replace_once(
              gate,
              "if not _json_nesting_within_bound(stripped, start, MAX_JSON_NESTING_DEPTH):",
              "if not _json_nesting_within_bound(\n            stripped, start, _schema_max_container_depth(_noema_verdict_json_schema())\n        ):",
              "schema-derived preparse depth",
          )
          gate = gate.replace(
              'f"JSON nesting exceeds the bounded limit ({MAX_JSON_NESTING_DEPTH} levels)",',
              '"JSON nesting exceeds the declared verdict schema container depth",',
          )

          old_prompt = (
              '                "Every formal verdict must cite exact changed-side lines. APPROVE requires falsifying concrete regression hypotheses; source or test/workflow changes require at least two distinct probes and other changes require at least one. REQUEST_CHANGES requires a confirmed probe at a finding location.",\n'
          )
          new_prompt = (
              '                "Every formal verdict must cite exact changed-side lines. APPROVE and REQUEST_CHANGES must include reviewed-line analysis and adversarial probes covering every changed path supplied by Git/GitHub; do not infer review effort from file names or extensions. REQUEST_CHANGES requires a confirmed probe at a finding location.",\n'
          )
          gate = replace_once(gate, old_prompt, new_prompt, "review prompt coverage contract")

          response_call_pattern = re.compile(
              r'        "response_format": _noema_verdict_response_format\(\n            _required_probe_count\(diff, changed_paths\)\n        \),\n'
          )
          gate, count = response_call_pattern.subn(
              '        "response_format": _noema_verdict_response_format(),\n', gate, count=1
          )
          if count != 1:
              raise SystemExit(f"response-format probe-count call drifted: {count} matches")

          gate = gate.replace("for finding in findings[:20]:", "for finding in findings:")
          gate = gate.replace(
              'for reviewed in (verdict.get("reviewed_lines") or [])[:20]:',
              'for reviewed in (verdict.get("reviewed_lines") or []):',
          )
          gate = gate.replace(
              'for probe in (validation.get("probes") or [])[:20]:',
              'for probe in (validation.get("probes") or []):',
          )
          gate = gate.replace(
              "return scrub_sensitive_data(served.strip()[:200])",
              "return scrub_sensitive_data(served.strip())",
          )

          forbidden = (
              "MAX_DIFF_CHARS",
              "MAX_CONTEXT_FILES",
              "MAX_FILE_CONTEXT_CHARS",
              "MAX_REVIEW_CONTEXT_CHARS",
              "MAX_THREAD_BODY_CHARS",
              "changed_file_is_material",
              "_required_probe_count",
              "[:20]",
              "MAX_JSON_NESTING_DEPTH = 100",
          )
          remaining = [token for token in forbidden if token in gate]
          if remaining:
              raise SystemExit(f"Noema evidence-allocation heuristics remain: {remaining}")
          gate_path.write_text(gate, encoding="utf-8")

          def remove_tests_containing(path: str, needles: tuple[str, ...]) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              pattern = re.compile(
                  r"(?ms)^((?:@pytest[^\n]*\n|@pytest\.mark\.parametrize\(.*?\)\n)*)def (test_[A-Za-z0-9_]+)\([^\n]*\).*?(?=^(?:@pytest|def test_|class )|\Z)"
              )
              text = pattern.sub(
                  lambda match: ""
                  if any(needle in match.group(0) for needle in needles)
                  else match.group(0),
                  text,
              )
              target.write_text(text, encoding="utf-8")

          remove_tests_containing(
              "tests/test_noema_review_gate.py",
              (
                  "MAX_DIFF_CHARS",
                  "MAX_CONTEXT_FILES",
                  "MAX_FILE_CONTEXT_CHARS",
                  "MAX_REVIEW_CONTEXT_CHARS",
                  "MAX_THREAD_BODY_CHARS",
                  "_required_probe_count",
                  "changed_file_is_material",
                  "at least 2 concrete probe",
                  "minItems",
              ),
          )
          remove_tests_containing(
              "tests/test_repository_branch_coverage_javascript_and_noema.py",
              ("MAX_DIFF_CHARS",),
          )
          remove_tests_containing(
              "tests/test_noema_repair_attempt_telemetry.py",
              ("_required_probe_count", "minItems", "probe_floor"),
          )

          for test_path in (
              Path("tests/test_noema_review_gate.py"),
              Path("tests/test_noema_repair_attempt_telemetry.py"),
          ):
              if not test_path.exists():
                  continue
              text = test_path.read_text(encoding="utf-8")
              text = re.sub(
                  r"noema\._noema_verdict_json_schema\([^\n)]*\)",
                  "noema._noema_verdict_json_schema()",
                  text,
              )
              text = re.sub(
                  r"noema\._noema_verdict_response_format\([^\n)]*\)",
                  "noema._noema_verdict_response_format()",
                  text,
              )
              text = text.replace(
                  "noema.MAX_JSON_NESTING_DEPTH",
                  "noema._schema_max_container_depth(noema._noema_verdict_json_schema())",
              )
              test_path.write_text(text, encoding="utf-8")

          doctoring_path = Path("docs/doctoring/noema-repair-attempt-telemetry.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          marker = "## 2026-09-02 exact changed-path evidence allocation correction"
          if marker not in doctoring:
              doctoring += '''

          ## 2026-09-02 exact changed-path evidence allocation correction

          The earlier one-versus-two adversarial-probe rule and the fixed diff/file/thread
          context caps were not derived from a statistical model, provider capability
          contract, GitHub standard, or cited review-quality experiment. They are therefore
          superseded. Noema now preserves the complete Git diff, changed-file text, and
          review-thread evidence it retrieves. A formal `approve` or `request_changes`
          verdict is admissible only when reviewed-line analysis and adversarial probes cover
          the exact changed-path set supplied by Git/GitHub. This is set coverage over the
          immutable PR evidence universe; file names and extensions do not alter the required
          effort. If contextual-orchestrator/the serving provider cannot accept the complete
          request, the request fails closed rather than being silently sampled.

          The pre-decode JSON nesting guard remains, but its depth is computed from the
          declared verdict JSON Schema's object/array structure instead of the former
          hand-picked depth of 100. Finding and evidence rendering no longer drops entries
          through fixed display slices.
          '''
              doctoring_path.write_text(doctoring, encoding="utf-8")

          baseline_path = Path("docs/product-technical-gap-baseline.md")
          baseline = baseline_path.read_text(encoding="utf-8")
          baseline = baseline.replace(
              "`MAX_JSON_NESTING_DEPTH = 100`",
              "a JSON nesting bound derived from the declared Noema verdict schema",
          )
          marker = "NOEMA-EVIDENCE-COVERAGE-2026-09-02"
          if marker not in baseline:
              baseline += '''

          ### NOEMA-EVIDENCE-COVERAGE-2026-09-02
          - Owner: `ContextualWisdomLab/.github` / stacked PR #1700 on #1672.
          - Gap/RCA: Noema sampled review evidence with repository-authored character/file/body caps, inferred one-versus-two probe effort from filenames, and truncated published evidence with fixed slices. None had executable statistical/standard/research authority.
          - Repair: preserve complete fetched PR evidence; define formal-verdict completeness as exact changed-path set coverage; derive JSON pre-parse depth from the declared schema; render all returned findings/evidence. contextual-orchestrator/provider capability remains the model-context owner and insufficiency fails closed.
          - Verification: RED `tests/test_noema_no_heuristic_evidence_allocation.py`, focused Noema regressions, repository suite excluding the parent #1672 intentionally-RED timeout contract until that parent repair lands, then ordinary exact-head checks after stack reconciliation.
          '''
          baseline_path.write_text(baseline, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog = changelog.replace(
              "`MAX_JSON_NESTING_DEPTH = 100`",
              "a pre-parse depth derived from the declared Noema verdict schema",
          )
          note = "- Noema review evidence allocation no longer uses fixed diff/file/thread caps, filename-derived probe counts, or fixed evidence-display slices; formal verdicts require exact changed-path set coverage and JSON pre-parse depth follows the declared verdict schema.\n"
          if note not in changelog:
              changelog_path.write_text(note + changelog, encoding="utf-8")
          elif changelog != changelog_path.read_text(encoding="utf-8"):
              changelog_path.write_text(changelog, encoding="utf-8")
          PY

      - name: Verify focused GREEN contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_no_heuristic_evidence_allocation.py \
            tests/test_noema_review_gate.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_repository_branch_coverage_javascript_and_noema.py
          python3 -m compileall -q scripts tests
          git diff --check

      - name: Verify repository suite except the parent PR1672 intentional RED contract
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest tests -q \
            --ignore=tests/test_noema_repair_has_no_fixed_wall_clock_deadline.py
          git diff --check

      - name: Self-retire and publish only from unchanged exact writer head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin fix/noema-evidence-completeness-no-heuristics
          live_head="$(git rev-parse origin/fix/noema-evidence-completeness-no-heuristics)"
          if [ "$live_head" != "$EXPECTED_HEAD" ]; then
            echo "::notice::Writer branch advanced to $live_head; refusing stale publication."
            exit 0
          fi
          git rm -- .github/workflows/source-fix-1700-noema-evidence-allocation.yml
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git add scripts/ci/noema_review_gate.py \
            tests/test_noema_review_gate.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_repository_branch_coverage_javascript_and_noema.py \
            docs/doctoring/noema-repair-attempt-telemetry.md \
            docs/product-technical-gap-baseline.md \
            CHANGELOG.md \
            tests/test_noema_no_heuristic_evidence_allocation.py
          git diff --cached --check
