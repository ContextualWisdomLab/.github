name: One-shot Flat Lock Publication Repair

on:
  push:
    branches:
      - fix/trusted-uv-flat-publication-current-main
    paths:
      - .github/workflows/one-shot-flat-lock-publication-repair.yml

permissions:
  contents: write

concurrency:
  group: one-shot-flat-lock-publication-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_PARENT_SHA: 37d1125b62efa2ec7802ef2ce5707d47896011e4
      TARGET_BRANCH: fix/trusted-uv-flat-publication-current-main
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify bounded repair ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --count HEAD^..HEAD)" = "1"

      - name: Apply the minimal GREEN correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/ci/materialize_base_python_requirements.py")
          script = script_path.read_text(encoding="utf-8")
          old_policy_boundary = '''    return all(
              _is_fully_hash_pinned_requirement(line)
              or _is_bounded_requirement_include(line)
              for line in requirement_lines
          )
          def _is_fully_hash_pinned_requirement(line: str) -> bool:
          '''
          new_policy_boundary = '''    return all(
              _is_fully_hash_pinned_requirement(line)
              or _is_bounded_requirement_include(line)
              for line in requirement_lines
          )


          def _is_flat_materializable_lock(content: bytes) -> bool:
              """Return whether content is one standalone exact SHA-256 lock.

              The materializer publishes selected sources under generated flat names.
              Relative ``-r`` and ``--requirement`` edges are therefore not portable:
              pip would resolve them relative to the generated output rather than the
              source directory. Only independent package pins cross this boundary until
              a complete immutable include graph can be reconstructed and rewritten.
              """
              lines = _requirement_lines(content)
              requirement_lines = [line for line in lines if line != "--require-hashes"]
              return bool(requirement_lines) and all(
                  _is_fully_hash_pinned_requirement(line) for line in requirement_lines
              )


          def _is_fully_hash_pinned_requirement(line: str) -> bool:
          '''
          if script.count(old_policy_boundary) != 1:
              raise SystemExit("flat publication policy insertion point drifted")
          script = script.replace(old_policy_boundary, new_policy_boundary, 1)

          old_selection = '''        if _is_candidate_lock_name(candidate.name):
                      content = _git(repo_root, "show", f"{base_sha}:{path}")
                      if _is_hash_pinned(content):
                          locks.append((path, content))
          '''
          new_selection = '''        if _is_candidate_lock_path(candidate):
                      content = _git(repo_root, "show", f"{base_sha}:{path}")
                      if _is_flat_materializable_lock(content):
                          locks.append((path, content))
          '''
          if script.count(old_selection) != 1:
              raise SystemExit("base-lock selection boundary drifted")
          script = script.replace(old_selection, new_selection, 1)
          script_path.write_text(script, encoding="utf-8")

          old_test = Path("tests/test_flat_lock_publication_boundary.py")
          new_test = Path("tests/test_uv_flat_lock_publication_boundary.py")
          if not old_test.is_file() or new_test.exists():
              raise SystemExit("flat-lock RED fixture path drifted")
          old_test.replace(new_test)

          quality_path = Path(".github/workflows/trusted-uv-materializer-quality-ci.yml")
          quality = quality_path.read_text(encoding="utf-8")
          quality_anchor = "            tests/test_uv_export_isolation_contract.py \\\n"
          if quality.count(quality_anchor) != 2:
              raise SystemExit("trusted-uv focused test list drifted")
          quality = quality.replace(
              quality_anchor,
              quality_anchor + "            tests/test_uv_flat_lock_publication_boundary.py \\\n",
          )
          quality_path.write_text(quality, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          old_changelog = "- Materialized base Python locks only when every package line is an exact SHA-256 pin or a bounded relative `-r`/`--requirement` include. A lone `--require-hashes` directive, a dotted include such as `./lock.txt`, or `-r other-hashes.txt` no longer enters the trusted build context."
          new_changelog = "- Excluded relative `-r` and `--requirement` referrers from generated flat base-lock publication while retaining bounded include syntax diagnostics and discovering independently complete direct `.txt` children of `requirements` directories."
          if changelog.count(old_changelog) != 1:
              raise SystemExit("trusted-uv changelog entry drifted")
          changelog_path.write_text(
              changelog.replace(old_changelog, new_changelog, 1),
              encoding="utf-8",
          )

          doctoring = Path("docs/doctoring/trusted-uv-flat-include-isolation.md")
          if doctoring.exists():
              raise SystemExit("doctoring target unexpectedly exists")
          doctoring.write_text(
              """# Trusted uv flat-include isolation

## Status

Accepted on 2026-08-18 for generated base Python lock publication.

## Buyer-facing failure

The central coverage lane renames every selected source lock to a generated flat
name such as `requirements-000.txt`. A source file containing a relative `-r` or
`--requirement` directive is valid pip syntax, but the target is resolved relative
to the generated output location. Publishing only the referrer can therefore
break a downstream repository before its own tests or docstring checks execute.

## Root cause and decision

Syntax recognition and publication authority were conflated. The bounded
`_is_hash_pinned` diagnostic continues to recognize safe relative include syntax,
but `_is_flat_materializable_lock` now admits only non-empty standalone exact
SHA-256 package pins. `base_hash_locks` uses the existing path-aware candidate
predicate so complete `requirements/ci.txt` and
`service/requirements/package.txt` locks remain eligible.

No URL, proxy, redirect, package index, caller-controlled header, output path,
review authority, or repository write scope is expanded. Relative include
publication remains fail-closed until the materializer can reconstruct an entire
immutable include graph, preserve source-directory identity, rewrite every edge,
and prove the resulting closure.

## Verification and operator action

The RED regression proves that both include spellings previously crossed the
flat boundary and that path-aware nested locks were omitted. GREEN requires the
focused trusted-uv suite, complete central test suite, 100% production statement
and branch coverage, complete production docstrings, compilation, and exact-head
protected checks. A downstream repository that uses nested requirements should
publish one standalone hash-locked closure or wait for a separately reviewed
graph-aware materializer; operators must not copy or rename an unresolved
include manually.

## Rollback

Do not restore relative include publication. A rollback would reintroduce a
source-relative edge into a namespace that no longer preserves its source
location. Restore only after a graph-aware implementation has equivalent RED
fixtures, immutable edge rewriting, and full closure verification.

## APA 7th references

Python Packaging Authority. (2026). *Requirements file format*. pip
documentation. https://pip.pypa.io/en/stable/reference/requirements-file-format/

Python Packaging Authority. (2026). *Secure installs*. pip documentation.
https://pip.pypa.io/en/stable/topics/secure-installs/
""",
              encoding="utf-8",
          )
          PY

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify GREEN with complete trusted-uv and central gates
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/trusted-uv-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/trusted-uv-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_flat_lock_publication_boundary.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            -q
          python -m coverage report
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 \
            scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_uv_flat_lock_publication_boundary.py
          git diff --check

      - name: Publish verified repair and remove one-shot authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-flat-lock-publication-repair.yml
          git add \
            CHANGELOG.md \
            .github/workflows/trusted-uv-materializer-quality-ci.yml \
            docs/doctoring/trusted-uv-flat-include-isolation.md \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_flat_lock_publication_boundary.py \
            tests/test_uv_flat_lock_publication_boundary.py \
            .github/workflows/one-shot-flat-lock-publication-repair.yml
          git config user.name "CWL One-shot Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): isolate relative includes from flat locks"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
