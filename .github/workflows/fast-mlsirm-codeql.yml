name: CodeQL

on:
  workflow_call:

concurrency:
  group: central-fast-mlsirm-codeql-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze-actions:
    # Branch protection requires a deterministic Actions-language CodeQL check
    # on PRs. Default setup is disabled; this reusable workflow uploads SARIF.
    name: Analyze (actions)
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: actions
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          output: codeql-results/actions
      - name: Keep CodeQL diagnostics local to the job
        run: test -s codeql-results/actions/actions.sarif

  analyze-python:
    # Python analysis and code-scanning upload require an explicit operator run.
    if: github.event_name == 'workflow_dispatch'
    name: Analyze (python)
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: python
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          output: codeql-results/python
      - name: Keep CodeQL diagnostics local to the job
        run: test -s codeql-results/python/python.sarif
