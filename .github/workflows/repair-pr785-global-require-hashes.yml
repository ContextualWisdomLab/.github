name: Repair PR 785 global hash directive boundary

on:
  push:
    branches: [fix/coverage-materialize-requirements-directory-locks]
    paths:
      - ".github/pr785-global-hash.trigger"

permissions:
  contents: read

concurrency:
  group: repair-pr785-global-hash-directive
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/coverage-materialize-requirements-directory-locks'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact test-first head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the new regression is red
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          python -m pytest -q \
            tests/test_requirements_directory_lock_materialization.py::test_rejects_global_hash_directive_with_unpinned_requirement
          status=$?
          set -e
          test "$status" -eq 1

      - name: Require every non-directive logical requirement to carry trust evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/materialize_base_python_requirements.py')
          source = path.read_text(encoding='utf-8')
          old = '''    lines = _requirement_lines(content)
    if not lines:
        return False
    return any(line == "--require-hashes" for line in lines) or all(
        "--hash=" in line or line.startswith(("-r ", "--requirement "))
        for line in lines
    )
'''
          new = '''    lines = _requirement_lines(content)
    requirement_lines = [line for line in lines if line != "--require-hashes"]
    if not requirement_lines:
        return False
    return all(
        "--hash=" in line or line.startswith(("-r ", "--requirement "))
        for line in requirement_lines
    )
'''
          if source.count(old) != 1:
              raise SystemExit('expected one hash-pinned requirement classifier anchor')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          doctoring = Path('docs/doctoring/trusted-requirements-directory-lock-discovery.md')
          text = doctoring.read_text(encoding='utf-8')
          marker = 'The path rule grants candidate status only. The existing content boundary still\n'
          addition = (
              'A global `--require-hashes` directive is not evidence by itself: every non-directive '
              'logical requirement must still carry an inline hash or a bounded requirement include.\n\n'
          )
          if addition not in text:
              if marker not in text:
                  raise SystemExit('doctoring trust-boundary anchor is absent')
              text = text.replace(marker, addition + marker, 1)
              doctoring.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = (
              '- Reject `requirements/*.txt` candidates where a global `--require-hashes` directive '
              'coexists with an unpinned logical requirement.\n'
          )
          if entry not in text:
              marker = '### Fixed\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG Fixed anchor is absent')
              changelog.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')
          PY
          rm -f \
            .github/workflows/repair-pr785-global-require-hashes.yml \
            .github/pr785-global-hash.trigger
          git diff --check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify focused and complete quality
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/pr785-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/pr785-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_requirements_directory_lock_materialization.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py
          python -m coverage report --fail-under=100
          unset COVERAGE_RCFILE
          python -m pytest -q tests
          python -m interrogate --fail-under=100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q scripts/ci/materialize_base_python_requirements.py tests/test_requirements_directory_lock_materialization.py
          git diff --check

      - name: Publish verified workflow-free repair
        env:
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          TARGET_BRANCH: fix/coverage-materialize-requirements-directory-locks
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test -n "${PUSH_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(coverage): reject unpinned global-hash locks"
          echo "::add-mask::$PUSH_TOKEN"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
