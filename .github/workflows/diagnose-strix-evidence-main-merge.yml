name: Diagnose Strix evidence main reconciliation

on:
  push:
    branches:
      - codex/strix-evidence-minimal
    paths:
      - .github/workflows/diagnose-strix-evidence-main-merge.yml

concurrency:
  group: diagnose-strix-evidence-main-reconciliation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: codex/strix-evidence-minimal
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce merge and report exact conflict set
        shell: bash
        run: |
          set -euo pipefail
          expected_feature=37fbf9924c4585f98e8de6dade400a067efd1b78
          expected_main=c47afc2dc68488292c1db7c9d6f82dcd5360f181
          git merge-base --is-ancestor "$expected_feature" HEAD
          unexpected="$({ git diff --name-only "$expected_feature"...HEAD || true; } | grep -v '^\.github/workflows/diagnose-strix-evidence-main-merge\.yml$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected branch changes after reviewed head:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          if [ "$actual_main" != "$expected_main" ]; then
            echo "Protected main moved from $expected_main to $actual_main." >&2
            exit 1
          fi
          git config user.name 'cwl-merge-diagnostics[bot]'
          git config user.email 'cwl-merge-diagnostics[bot]@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff "$expected_main"
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
          printf 'merge_status=%s\n' "$merge_status"
          printf 'conflict_count=%s\n' "$(printf '%s\n' "$conflicts" | sed '/^$/d' | wc -l)"
          printf 'conflicts_begin\n%s\nconflicts_end\n' "$conflicts"
          exit 1
