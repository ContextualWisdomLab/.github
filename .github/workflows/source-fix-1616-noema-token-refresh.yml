          Path('docs/doctoring/noema-review-token-lifetime.md').write_text('''# Noema reviewer credential lifetime

## Incident and root cause

On 2026-09-01, the trusted central Noema review for `ContextualWisdomLab/naruon#1497@152d1998c4e8024be9dc7026c8789d343c884fd0` minted the repository-scoped `cwl-noema-review` GitHub App installation token before model work. Contextual-orchestrator review then exceeded the installation token lifetime; the first later GitHub operation failed with HTTP 401 and cleanup independently reported that the token had expired. Repository-owned deterministic checks on that Naruon head were otherwise green. The defect belongs to the central reviewer credential lifecycle, not to Naruon product code.

## Closed operating contract

Noema now separates model verdict preparation from GitHub publication. Preparation remains bound to the trigger's canonical exact head and stores only a bounded, owner-only, single-link runner-local envelope. If preparation intentionally skips because the PR is stale, draft, or already reviewed, the workflow records `prepared=false` and performs no publication.

For the GitHub App path, a second repository-scoped installation token is minted only after model work and only when a publishable envelope exists. The publication step never reuses the predecessor App token, never falls back to `github.token` or the PR author, and independently re-fetches the live PR/head and reviewer actor before submitting evidence. PAT and OIDC sources remain explicit: publication uses only the originally selected source and fails closed if it is absent; this repair does not silently convert those paths into a different authority.

The envelope is deleted after every publication attempt, including malformed-envelope validation failures. Executable regressions cover preparation-without-publication, exact-head/actor rebinding, stale-head rejection, draft skip behavior, private-file cleanup, and hard-link alias rejection. Step-scoped workflow regressions prove that the second App mint sits between preparation and publication and that the publication step references the fresh token rather than the predecessor token.

## Verification and downstream replay

Focused CI runs `tests/test_noema_reviewer_token_lifetime.py` and `tests/test_noema_two_phase_handoff.py` whenever the workflow/helper/contracts or this record change, using the repository's hash-pinned review CI dependencies. After protected-main merge, the operational replay target is unchanged `naruon#1497@152d1998c4e8024be9dc7026c8789d343c884fd0`: Required Noema Review must finish with current-head schema-valid review evidence or a typed review-unavailable result, never an opaque expired-token 401 and never stale-head publication. A hosted replay is intentionally not treated as proven until the merged central workflow is the source GitHub executes.
''', encoding='utf-8')

