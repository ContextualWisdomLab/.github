name: Source Fix 1616 Noema Token Refresh

on:
  push:
    branches:
      - fix/noema-review-token-expiry-20260901
    paths:
      - .github/workflows/source-fix-1616-noema-token-refresh.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Apply deterministic transform and self-remove temporary sources
        run: |
          set -euo pipefail
          python3 scripts/ci/source_fix_1616.py
          test ! -e scripts/ci/source_fix_1616.py
          test ! -e .github/workflows/source-fix-1616-noema-token-refresh.yml
          git diff --check

      - name: Install repository-declared review test dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Verify focused GREEN before publication
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_reviewer_token_lifetime.py \
            tests/test_noema_two_phase_handoff.py
          python3 -m compileall -q \
            .github/actions/noema-review/two_phase.py \
            tests/test_noema_reviewer_token_lifetime.py \
            tests/test_noema_two_phase_handoff.py
          test ! -e scripts/ci/source_fix_1616.py
          test ! -e .github/workflows/source-fix-1616-noema-token-refresh.yml
          git diff --check

      - name: Commit verified repair and self-removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '::notice::No verified source changes remain to publish.'
            exit 0
          fi
          git commit -m 'fix(noema): refresh reviewer authority before publication'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
