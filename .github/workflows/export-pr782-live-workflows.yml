name: Export live PR 782 workflow sources

on:
  push:
    branches:
      - tmp/export-pr782-rca-live-20260808
    paths:
      - .github/workflows/export-pr782-live-workflows.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize workflow exports
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          bundle="$RUNNER_TEMP/pr782-live-workflows"
          mkdir -p "$bundle/workflow_exports"
          cp .github/workflows/pr-review-autofix.yml "$bundle/workflow_exports/pr-review-autofix.yml"
          cp .github/workflows/pr-review-fix-scheduler.yml "$bundle/workflow_exports/pr-review-fix-scheduler.yml"
          cp .github/workflows/hourly-nvidia-nim-review-repair.yml "$bundle/workflow_exports/hourly-nvidia-nim-review-repair.yml"
          cp .github/workflows/clearfolio-hourly-review-repair.yml "$bundle/workflow_exports/clearfolio-hourly-review-repair.yml"
          sha256sum "$bundle"/workflow_exports/*.yml >"$bundle/MANIFEST.sha256"
      - name: Upload workflow exports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr782-live-workflows-${{ github.sha }}
          path: ${{ runner.temp }}/pr782-live-workflows
          if-no-files-found: error
          retention-days: 1
