name: Repair PR 1008 Git environment boundary

on:
  push:
    branches:
      - codex/coverage-uv-retry
    paths:
      - .github/workflows/repair-pr-1008-git-environment.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: codex/coverage-uv-retry

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply the minimal trusted Git environment repair
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("scripts/ci/materialize_base_python_requirements.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''def _git(repo_root: pathlib.Path, *args: str) -> bytes:
              """Run one read-only git command in the materialized repository."""
              completed = subprocess.run(
                  ["git", "-C", str(repo_root), *args],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if completed.returncode != 0:
                  stderr = completed.stderr.decode("utf-8", errors="replace").strip()
                  raise RuntimeError(f"git {args[0]} failed: {stderr}")
              return completed.stdout
          '''.replace("          ", "")
          new = '''def _trusted_git_environment() -> dict[str, str]:
              """Return the fixed environment allowed to influence read-only Git calls."""
              return {
                  "GIT_CONFIG_GLOBAL": os.devnull,
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_OPTIONAL_LOCKS": "0",
                  "GIT_TERMINAL_PROMPT": "0",
                  "PATH": os.defpath,
              }


          def _git(repo_root: pathlib.Path, *args: str) -> bytes:
              """Run one read-only Git command without ambient repository redirection."""
              completed = subprocess.run(
                  ["git", "-C", str(repo_root), *args],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env=_trusted_git_environment(),
              )
              if completed.returncode != 0:
                  stderr = completed.stderr.decode("utf-8", errors="replace").strip()
                  raise RuntimeError(f"git {args[0]} failed: {stderr}")
              return completed.stdout
          '''.replace("          ", "")
          if source.count(old) != 1:
              raise SystemExit("expected one unchanged _git implementation")
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          workflow_path = Path(".github/workflows/trusted-uv-materializer-quality-ci.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          needle = "            tests/test_materialize_base_python_requirements.py \\\n"
          replacement = needle + "            tests/test_materialize_git_environment.py \\\n"
          if workflow.count(needle) != 2:
              raise SystemExit("expected the materializer test in two quality-gate lists")
          workflow_path.write_text(
              workflow.replace(needle, replacement),
              encoding="utf-8",
          )
          PY

      - name: Verify the focused security regression
        run: python -m pytest tests/test_materialize_git_environment.py -q

      - name: Run trusted uv tests with complete branch coverage
        run: |
          cat >"${RUNNER_TEMP}/trusted-uv-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/trusted-uv-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_git_environment.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            -q
          python -m coverage report

      - name: Run complete central test and branch coverage gate
        run: |
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report

      - name: Enforce production docstrings and compilation
        run: |
          python -m interrogate --fail-under 100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q scripts/ci/materialize_base_python_requirements.py tests/test_materialize_git_environment.py

      - name: Commit the verified repair and remove this one-shot workflow
        run: |
          rm .github/workflows/repair-pr-1008-git-environment.yml
          git config user.name "Seongho Bae"
          git config user.email "me@seonghobae.me"
          git add \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_git_environment.py \
            .github/workflows/trusted-uv-materializer-quality-ci.yml \
            .github/workflows/repair-pr-1008-git-environment.yml
          git commit -m "fix(ci): isolate trusted Git subprocess environment"
          git push origin HEAD:codex/coverage-uv-retry
