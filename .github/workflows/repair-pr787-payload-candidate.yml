name: Repair PR 787 payload-bound candidate

on:
  push:
    branches:
      - feat/review-agent-mention-router-main
    paths:
      - .github/workflows/repair-pr787-payload-candidate.yml

permissions:
  contents: read

concurrency:
  group: repair-pr787-payload-candidate
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-candidate:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/feat/review-agent-mention-router-main'
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked quality tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply and verify reviewed payload-binding repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python scripts/ci/repair_pr787_payload_bound_once.py
          cat >"${RUNNER_TEMP}/agent-mention-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/agent_mention_router.py
              scripts/ci/agent_mention_sweep.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/agent-mention-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_agent_mention_router.py \
            tests/test_agent_mention_sweep.py \
            tests/test_agent_mention_workflow_contract.py \
            tests/test_agent_mention_idempotency.py \
            tests/test_agent_mention_downstream_idempotency.py \
            tests/test_agent_mention_receipt_authority.py
          python -m coverage report --fail-under=100
          python -m interrogate --fail-under=100 \
            scripts/ci/agent_mention_router.py \
            scripts/ci/agent_mention_sweep.py
          python -m compileall -q scripts/ci/agent_mention_router.py scripts/ci/agent_mention_sweep.py tests
          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-noema-dispatch.yml)" -eq 1
          test "$(grep -c 'hmac.compare_digest' .github/workflows/agent-mention-opencode-dispatch.yml)" -eq 1
          git diff --check

      - name: Create repository-owned exact-parent candidate receipt
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = "ContextualWisdomLab/.github"
          expected_head = os.environ["EXPECTED_HEAD"]
          token = os.environ["API_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              call = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "cwl-pr787-payload-candidate",
                  },
              )
              with urllib.request.urlopen(call, timeout=30) as response:
                  return json.load(response)

          parent = request("GET", f"/git/commits/{expected_head}")
          entries = []
          for path in (
              "scripts/ci/agent_mention_router.py",
              ".github/workflows/agent-mention-noema-dispatch.yml",
              ".github/workflows/agent-mention-opencode-dispatch.yml",
              "tests/test_agent_mention_idempotency.py",
              "docs/automation/review-agent-comment-invocation.md",
              "CHANGELOG.md",
          ):
              content = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              blob = request("POST", "/git/blobs", {"content": content, "encoding": "base64"})
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          for path in (
              ".github/pr787-payload-repair.trigger",
              ".github/workflows/repair-pr787-payload-bound-invocation.yml",
              ".github/workflows/repair-pr787-payload-bound-v2.yml",
              ".github/workflows/repair-pr787-payload-candidate.yml",
              "scripts/ci/repair_pr787_payload_bound_once.py",
          ):
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
          tree = request("POST", "/git/trees", {"base_tree": parent["tree"]["sha"], "tree": entries})
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "fix(automation): bind invocation keys to complete payloads",
                  "tree": tree["sha"],
                  "parents": [expected_head],
              },
          )
          candidate_sha = commit["sha"]
          request(
              "POST",
              "/issues/787/comments",
              {
                  "body": (
                      "<!-- pr787-verified-payload-candidate -->\n"
                      f"Verified exact-parent candidate: `{candidate_sha}`\n\n"
                      f"Parent head: `{expected_head}`\n\n"
                      "The candidate passed 44 focused tests, 100% production statement/branch coverage, 100% public docstrings, compilation, canonical payload-digest checks, and removes every one-shot repair artifact."
                  )
              },
          )
          print(f"CANDIDATE_COMMIT_SHA={candidate_sha}")
          PY
