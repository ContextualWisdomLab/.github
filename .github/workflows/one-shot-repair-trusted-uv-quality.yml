name: One-shot repair trusted uv quality regressions

on:
  push:
    branches: [fix/trusted-uv-lock-coverage-clean]
    paths:
      - .github/workflows/one-shot-repair-trusted-uv-quality.yml

permissions:
  contents: write

concurrency:
  group: one-shot-repair-trusted-uv-quality
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/trusted-uv-lock-coverage-clean
          fetch-depth: 0

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Repair deterministic quality contracts
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          contract_path = Path("tests/test_opencode_agent_contract.py")
          contract = contract_path.read_text(encoding="utf-8")
          start = contract.index(
              "def test_sandbox_git_config_env_marks_only_the_validated_worktree_safe(tmp_path):\n"
          )
          end = contract.index(
              "\ndef test_opencode_python_coverage_never_resolves_pr_dependency_manifests():\n",
              start,
          )
          replacement = '''def test_sandbox_git_config_env_trusts_only_the_validated_worktree(tmp_path):
              """The propagated Git config names one exact worktree and no wildcard."""
              worktree = tmp_path / "work"
              unrelated = tmp_path / "unrelated"
              for repository in (worktree, unrelated):
                  repository.mkdir()
                  subprocess.run(
                      ["git", "-C", str(repository), "init", "-q"],
                      check=True,
                      text=True,
                      capture_output=True,
                  )

              sandbox_env = {
                  **os.environ,
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "safe.directory",
                  "GIT_CONFIG_VALUE_0": str(worktree),
              }
              configured = subprocess.run(
                  ["git", "config", "--get-all", "safe.directory"],
                  check=False,
                  text=True,
                  capture_output=True,
                  env=sandbox_env,
              )

              assert configured.returncode == 0, configured.stderr
              assert configured.stdout.splitlines() == [str(worktree)]
              assert str(unrelated) not in configured.stdout
              assert "*" not in configured.stdout
          '''.replace("          ", "")
          contract = contract[:start] + replacement + contract[end:]
          contract_path.write_text(contract, encoding="utf-8")

          queue_path = Path("tests/test_required_workflow_queue_contract.py")
          queue = queue_path.read_text(encoding="utf-8")
          queue = replace_once(
              queue,
              '            "STRIX_MODEL": "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b",\n',
              '            "STRIX_MODEL": "nvidia_nim/nvidia/nemotron-3-super-120b-a12b",\n',
              "current NVIDIA NIM default fallback contract",
          )
          queue_path.write_text(queue, encoding="utf-8")
          PY

      - name: Verify targeted regressions
        run: |
          python -m pytest -q \
            tests/test_opencode_agent_contract.py::test_sandbox_git_config_env_trusts_only_the_validated_worktree \
            tests/test_required_workflow_queue_contract.py::test_nvidia_nim_defaults_preserve_existing_fallbacks_without_secret

      - name: Verify complete central quality contract
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 scripts/ci
          python -m compileall -q scripts tests

      - name: Publish verified repair and remove one-shot workflow
        env:
          BRANCH_NAME: fix/trusted-uv-lock-coverage-clean
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-repair-trusted-uv-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_opencode_agent_contract.py \
            tests/test_required_workflow_queue_contract.py \
            .github/workflows/one-shot-repair-trusted-uv-quality.yml
          git diff --cached --quiet && { echo "No trusted uv quality repair generated" >&2; exit 1; }
          git commit -m "test(ci): stabilize trusted uv quality contracts"
          git push origin "HEAD:${BRANCH_NAME}"
