          cd "$TARGET_WORKSPACE"; trap restore EXIT
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL opencode run "$(cat "$prompt")" --pure --agent ci-source-fix --model "$MODEL" --title "PR #${PR_NUMBER} source fix"
          restore; trap - EXIT
