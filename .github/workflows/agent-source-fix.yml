          [ "${#changed[@]}" -gt 0 ] || { echo "No safe source change was produced."; exit 0; }
          for path in "${changed[@]}"; do ok=0; for candidate in "${allowed_paths[@]}"; do [ "$path" != "$candidate" ] || { ok=1; break; }; done; [ "$ok" = 1 ] || { echo "::error::Source fix escaped sealed PR scope: $path"; exit 1; }; done
