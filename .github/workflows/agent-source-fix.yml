          [ "${#python_files[@]}" = 0 ] || python3 -m py_compile "${python_files[@]}"; if [ "${#workflow_files[@]}" -gt 0 ] && command -v actionlint >/dev/null; then actionlint "${workflow_files[@]}"; fi
