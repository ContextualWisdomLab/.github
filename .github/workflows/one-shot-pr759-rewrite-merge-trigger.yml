name: One-shot PR759 rewrite merge trigger

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/one-shot-pr759-rewrite-merge-trigger.yml

permissions:
  contents: read

concurrency:
  group: one-shot-pr759-rewrite-merge-trigger
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rewrite:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.actor == 'seonghobae'
      && github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pushed head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind merge workflow to its triggering head and remove export helpers
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: fix/opencode-coverage-failure-diagnostics
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -I - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-pr759-merge-main.yml')
          source = path.read_text(encoding='utf-8')
          parent_line = '          EXPECTED_PARENT_SHA: 27f7e3bc58bb99563f38acd569105f657c227b13\n'
          parent_check = '          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"\n'
          head_check = '          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"\n'
          if source.count(parent_line) != 1 or source.count(parent_check) != 1:
              raise SystemExit('merge workflow trigger contract drifted')
          source = source.replace(parent_line, '', 1).replace(parent_check, head_check, 1)
          path.write_text(source, encoding='utf-8')
          PY
          rm .github/workflows/one-shot-pr759-rewrite-merge-trigger.yml
          rm -f .github/workflows/export-pr759-current-three-way.yml
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: bind PR 759 merge reconciliation to trigger head'
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:${HEAD_BRANCH}"
