name: One-shot PR 782 conflict scope repair

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

concurrency:
  group: one-shot-pr782-conflict-scope-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.number == 782 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/hourly-nvidia-nim-review-repair-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact contributor head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 50
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Preserve exact RED workflow evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          red_output="$(python -m pytest -q \
            tests/test_pr_review_conflict_scope.py::test_workflow_snapshots_after_merge_and_verifies_before_staging \
            2>&1)"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -ne 0
          printf '%s\n' "$red_output" | grep -F 'substring not found'

      - name: Apply permanent conflict scope, evidence, and cleanup
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow_path = Path(".github/workflows/pr-review-autofix.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_entry = '''          if [ -n "$conflicted_files" ]; then
            prompt_file="${RUNNER_TEMP}/opencode-conflict-prompt.md"
'''
          new_entry = '''          if [ -n "$conflicted_files" ]; then
            conflicted_paths_file="${RUNNER_TEMP}/opencode-conflicted-files.zlist"
            conflict_scope_snapshot="${RUNNER_TEMP}/opencode-conflict-workspace-before.json"
            git diff --name-only -z --diff-filter=U >"$conflicted_paths_file"
            python3 "$GITHUB_WORKSPACE/trusted-autofix-source/scripts/ci/pr_review_conflict_scope.py" snapshot \\
              --root "$TARGET_WORKSPACE" \\
              --output "$conflict_scope_snapshot"
            prompt_file="${RUNNER_TEMP}/opencode-conflict-prompt.md"
'''
          if new_entry not in workflow:
              if workflow.count(old_entry) != 1:
                  raise SystemExit("conflict-model entry anchor drifted")
              workflow = workflow.replace(old_entry, new_entry, 1)

          old_exit = '''            restore_workspace_config
            trap - EXIT
          fi

          # Fail closed: never push unresolved conflict markers.
'''
          new_exit = '''            restore_workspace_config
            trap - EXIT
            python3 "$GITHUB_WORKSPACE/trusted-autofix-source/scripts/ci/pr_review_conflict_scope.py" verify \\
              --root "$TARGET_WORKSPACE" \\
              --snapshot "$conflict_scope_snapshot" \\
              --allowed-paths "$conflicted_paths_file"
          fi

          # Fail closed: never push unresolved conflict markers.
'''
          if new_exit not in workflow:
              if workflow.count(old_exit) != 1:
                  raise SystemExit("conflict-model completion anchor drifted")
              workflow = workflow.replace(old_exit, new_exit, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          scope_path = Path("scripts/ci/pr_review_conflict_scope.py")
          scope_source = scope_path.read_text(encoding="utf-8")
          old_path_guard = '''    path = Path(raw_path)
    if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts):
        raise ValueError("repository path must be a normalized relative path")
    return raw_path
'''
          new_path_guard = '''    path = Path(raw_path)
    normalized_path = path.as_posix()
    if (
        path.is_absolute()
        or normalized_path != raw_path
        or any(part in {"", ".", ".."} for part in path.parts)
    ):
        raise ValueError("repository path must be a normalized relative path")
    return raw_path
'''
          if new_path_guard not in scope_source:
              if scope_source.count(old_path_guard) != 1:
                  raise SystemExit("relative-path validator drifted")
              scope_path.write_text(
                  scope_source.replace(old_path_guard, new_path_guard, 1),
                  encoding="utf-8",
              )

          test_path = Path("tests/test_pr_review_conflict_scope.py")
          test_source = test_path.read_text(encoding="utf-8")
          old_invalid_paths = '''    ["", "/absolute", "../escape", "nested/../escape"],
'''
          new_invalid_paths = '''    [
        "",
        "/absolute",
        "../escape",
        "nested/../escape",
        "./relative",
        "a//b",
    ],
'''
          if new_invalid_paths not in test_source:
              if test_source.count(old_invalid_paths) != 1:
                  raise SystemExit("invalid-path regression table drifted")
              test_path.write_text(
                  test_source.replace(old_invalid_paths, new_invalid_paths, 1),
                  encoding="utf-8",
              )

          doctoring_path = Path("docs/doctoring/hourly-nvidia-nim-autofix.md")
          doctoring = doctoring_path.read_text(encoding="utf-8")
          if "## Conflict-resolution model write boundary" not in doctoring:
              marker = "\n## GitHub write boundary\n"
              section = dedent(
                  '''
                  ## Conflict-resolution model write boundary

                  A merge-conflict repair begins by merging the exact validated base SHA
                  into the exact PR head. Immediately after Git records unresolved paths,
                  the worker writes a NUL-delimited allowlist from `git diff --name-only
                  -z --diff-filter=U` and a deterministic snapshot of every tracked and
                  non-ignored untracked worktree path before OpenCode receives the task.

                  The snapshot fingerprints regular files with SHA-256 and records size,
                  mode, symbolic-link target, deletion, and other entry types. After the
                  model exits and temporary OpenCode configuration is restored, only the
                  exact Git conflict paths may differ. A model-created, deleted, modified,
                  mode-changed, or retargeted path outside that set fails before staging,
                  commit, or push. Inventories and path byte lengths are bounded, malformed
                  evidence fails closed, and diagnostics JSON-escape path names.

                  This is a file-publication boundary, not an operating-system sandbox.
                  The model process separately receives no shell, GitHub token, or Actions
                  OIDC credential. Live-head, unresolved-marker, merge-tree, syntax, and
                  protected-push checks remain independent defenses.
                  '''
              )
              if doctoring.count(marker) != 1:
                  raise SystemExit("GitHub write-boundary heading drifted")
              doctoring_path.write_text(
                  doctoring.replace(marker, "\n" + section + marker, 1),
                  encoding="utf-8",
              )

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          bullet = (
              "- Snapshot the post-merge worktree before OpenCode conflict repair "
              "and reject every model-caused changed, created, deleted, or "
              "retargeted path outside Git's exact conflict allowlist before "
              "staging or push.\n"
          )
          if bullet not in changelog:
              anchor = "### Security\n\n"
              if changelog.count(anchor) != 1:
                  raise SystemExit("changelog Security heading drifted")
              changelog_path.write_text(
                  changelog.replace(anchor, anchor + bullet, 1),
                  encoding="utf-8",
              )

          for temporary_path in (
              Path(".github/workflows/repair-pr782-conflict-scope.yml"),
              Path("scripts/ci/repair_pr782_conflict_scope_once.py"),
          ):
              if temporary_path.exists():
                  temporary_path.unlink()
          PY
          git diff --check

      - name: Verify GREEN behavior, coverage, docstrings, and workflow order
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py \
            --cov=scripts.ci.pr_review_conflict_scope \
            --cov-branch \
            --cov-fail-under=100
          python -m interrogate \
            --fail-under 100 \
            scripts/ci/pr_review_conflict_scope.py
          python -m compileall -q \
            scripts/ci/pr_review_conflict_scope.py \
            tests/test_pr_review_conflict_scope.py \
            tests/test_pr_review_fix_hourly_contract.py \
            tests/test_pr_review_fix_scheduler_source_pin.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py
          git diff --check

      - name: Publish verified repair and remove this workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm .github/workflows/one-shot-pr782-conflict-scope-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(automation): enforce conflict repair write scope"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
