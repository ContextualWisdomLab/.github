name: One-shot repair PR 757 exact-head quality

on:
  push:
    branches:
      - feat/comment-agent-mention-dispatch
    paths:
      - .github/workflows/one-shot-repair-pr757-exact-head.yml

concurrency:
  group: one-shot-repair-pr757-exact-head
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply bounded source and contract repair
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one marker in {path}, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          redactor = Path("scripts/ci/redact_sensitive_log.py")
          replace_once(redactor, "import shlex\n", "import shlex\nimport sys\n")
          replace_once(
              redactor,
              '''            elif character == quote:
                return prefix + quote + REDACTED + quote, value_end + 1
            value_end += 1
        return prefix + quote + REDACTED, len(text)

    value_end = value_start
    while value_end < len(text) and not text[value_end].isspace() and text[value_end] not in ",;}":
        value_end += 1
    return prefix + REDACTED, value_end
''',
              '''            elif character == quote:
                return prefix + REDACTED, value_end + 1
            value_end += 1
        return prefix + REDACTED, len(text)

    if text[value_start] in ",;}":
        return None, cursor

    scheme_match = re.match(r"(?i)(Bearer|Basic)(?=\\s)", text[value_start:])
    if scheme_match is not None:
        credential_start = value_start + scheme_match.end()
        while credential_start < len(text) and text[credential_start].isspace():
            credential_start += 1
        if credential_start >= len(text) or text[credential_start] in ",;}":
            return None, cursor
        value_end = credential_start
        while (
            value_end < len(text)
            and not text[value_end].isspace()
            and text[value_end] not in ",;}"
        ):
            value_end += 1
        return prefix + scheme_match.group(1) + " " + REDACTED, value_end

    value_end = value_start
    while value_end < len(text) and not text[value_end].isspace() and text[value_end] not in ",;}":
        value_end += 1
    return prefix + REDACTED, value_end
''',
          )
          append_marker = '''def redact_shell_command(command: str) -> str:
    """Return a printable shell command while preserving the command execution."""
    try:
        arguments = shlex.split(command, posix=True)
    except ValueError:
        return _redact_unstructured(command)
    return shlex.join(redact_command_arguments(arguments))
'''
          replace_once(
              redactor,
              append_marker,
              append_marker
              + '''


def main() -> int:
    """Redact standard input to standard output for workflow pipelines."""

    sys.stdout.write(redact_text(sys.stdin.read()))
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
''',
          )

          closure = Path("tests/test_control_plane_coverage_closure.py")
          replace_once(
              closure,
              '''    assert escaped_replacement == 'password="[REDACTED]"'
''',
              '''    assert escaped_replacement == "password=[REDACTED]"
''',
          )
          replace_once(
              closure,
              '''    assert unterminated_replacement == "password='[REDACTED]"
''',
              '''    assert unterminated_replacement == "password=[REDACTED]"
''',
          )
          import_test_marker = '''
def test_installer_skips_deferable_candidate_without_empty_diagnostic(
'''
          import_test = '''
def test_fix_scheduler_supports_package_import_fallback(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    """Direct-module absence loads the reviewed package-qualified scheduler."""

    import builtins

    real_import = builtins.__import__

    def guarded_import(name: str, *args: object, **kwargs: object) -> object:
        if name == "pr_review_merge_scheduler":
            raise ModuleNotFoundError(name)
        return real_import(name, *args, **kwargs)

    monkeypatch.setattr(builtins, "__import__", guarded_import)
    namespace = runpy.run_path(
        "scripts/ci/pr_review_fix_scheduler.py",
        run_name="pr_review_fix_scheduler_package_fallback_probe",
    )

    assert callable(namespace["fetch_open_prs"])
    assert callable(namespace["run"])
    assert callable(namespace["unresolved_thread_count"])


def test_installer_skips_deferable_candidate_without_empty_diagnostic(
'''
          replace_once(closure, import_test_marker, import_test)

          agent_test = Path("tests/test_opencode_agent_contract.py")
          text = agent_test.read_text(encoding="utf-8")
          pattern = re.compile(
              r"\ndef test_sandbox_git_config_env_marks_only_the_validated_worktree_safe\(tmp_path\):\n.*?"
              r"(?=\n\ndef test_opencode_python_coverage_never_resolves_pr_dependency_manifests)",
              re.DOTALL,
          )
          replacement = '''
def test_sandbox_git_config_env_trusts_only_the_validated_worktree(tmp_path):
    """The propagated Git config names one exact worktree and no wildcard."""
    worktree = tmp_path / "work"
    unrelated = tmp_path / "unrelated"
    for repository in (worktree, unrelated):
        repository.mkdir()
        subprocess.run(
            ["git", "-C", str(repository), "init", "-q"],
            check=True,
            text=True,
            capture_output=True,
        )

    sandbox_env = {
        **os.environ,
        "GIT_CONFIG_NOSYSTEM": "1",
        "GIT_CONFIG_GLOBAL": "/dev/null",
        "GIT_CONFIG_COUNT": "1",
        "GIT_CONFIG_KEY_0": "safe.directory",
        "GIT_CONFIG_VALUE_0": str(worktree),
    }
    configured = subprocess.run(
        ["git", "config", "--get-all", "safe.directory"],
        check=False,
        text=True,
        capture_output=True,
        env=sandbox_env,
    )

    assert configured.returncode == 0, configured.stderr
    assert configured.stdout.splitlines() == [str(worktree)]
    assert str(unrelated) not in configured.stdout
    assert "*" not in configured.stdout
'''
          text, substitutions = pattern.subn(replacement, text, count=1)
          if substitutions != 1:
              raise SystemExit(f"expected one Git ownership test, found {substitutions}")
          agent_test.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/agent-mention-router.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          dispatch_pattern = re.compile(
              r"  workflow_dispatch:\n    inputs:\n.*?        type: boolean\n",
              re.DOTALL,
          )
          workflow_text, substitutions = dispatch_pattern.subn("", workflow_text, count=1)
          if substitutions != 1:
              raise SystemExit(f"expected one manual-dispatch block, found {substitutions}")
          workflow_text = workflow_text.replace(
              "      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')",
              "      && github.event_name == 'schedule'",
              1,
          )
          workflow_text = workflow_text.replace(
              "      LOOKBACK_HOURS: ${{ inputs.lookback_hours || vars.AGENT_MENTION_LOOKBACK_HOURS || '168' }}",
              "      LOOKBACK_HOURS: ${{ vars.AGENT_MENTION_LOOKBACK_HOURS || '168' }}",
              1,
          )
          workflow_text = workflow_text.replace(
              "      MAX_DISPATCHES: ${{ inputs.max_dispatches || vars.AGENT_MENTION_MAX_DISPATCHES || '20' }}",
              "      MAX_DISPATCHES: ${{ vars.AGENT_MENTION_MAX_DISPATCHES || '20' }}",
              1,
          )
          workflow_text = workflow_text.replace(
              "      DRY_RUN: ${{ inputs.dry_run == true }}",
              '      DRY_RUN: "false"',
              1,
          )
          if "workflow_dispatch:" in workflow_text or "inputs." in workflow_text:
              raise SystemExit("manual branch-selected workflow input remains")
          workflow.write_text(workflow_text, encoding="utf-8")

          report = Path("docs/validation/pr757-coverage-diagnostics.json")
          if report.exists():
              report.unlink()
          PY

      - name: Run exact previously failing regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_opencode_agent_contract.py::test_sandbox_git_config_env_trusts_only_the_validated_worktree \
            tests/test_opencode_security_boundaries.py::test_sensitive_log_redaction_assignment_parser_edges_remain_auditable \
            tests/test_opencode_security_boundaries.py::test_sensitive_log_redaction_handles_adversarial_quoted_values \
            tests/test_opencode_security_boundaries.py::test_sensitive_log_redaction_handles_lists_empty_input_and_cli \
            tests/test_opencode_security_boundaries.py::test_sensitive_log_redaction_preserves_normal_diagnostics \
            tests/test_required_workflow_queue_contract.py::test_no_central_workflow_exposes_branch_selected_manual_dispatch \
            tests/test_control_plane_coverage_closure.py::test_fix_scheduler_supports_package_import_fallback

      - name: Run complete exact-head test and coverage gate
        run: |
          set -euo pipefail
          python -m coverage erase
          env -u GITHUB_EVENT_PATH python -m coverage run -m pytest tests -q
          python -m coverage report

      - name: Enforce documentation, syntax, and clean diff
        run: |
          set -euo pipefail
          python -m interrogate --fail-under 100 scripts/ci
          python -m compileall -q scripts/ci tests
          git diff --check

      - name: Commit verified repair and remove one-shot workflow
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -f .github/workflows/one-shot-repair-pr757-exact-head.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(control-plane): close exact-head quality gaps"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
