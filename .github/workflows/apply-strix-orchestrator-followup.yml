name: Apply Strix contextual-orchestrator follow-up

on:
  push:
    branches:
      - feat/strix-orchestrator-free-zdr

permissions:
  contents: write

concurrency:
  group: apply-strix-orchestrator-free-zdr
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci(strix): rerun orchestrator gateway patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-file-monitoring: true

      - name: Checkout exact feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/strix-orchestrator-free-zdr
          fetch-depth: 0
          persist-credentials: true

      - name: Repair bootstrap anchor structurally
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/apply_strix_orchestrator_followup.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          start = None
          for index in range(len(lines) - 2):
              if (
                  lines[index] == "    replace_once(\n"
                  and lines[index + 1].strip() == "SIDECAR,"
                  and "ORCHESTRATOR_TOKEN=" in lines[index + 2]
              ):
                  start = index
                  break
          if start is None:
              raise SystemExit("could not locate the bootstrap-only ORCHESTRATOR_TOKEN replacement block")

          end = None
          for index in range(start + 1, len(lines)):
              if lines[index] == "    replace_once(\n":
                  end = index
                  break
          if end is None:
              raise SystemExit("could not locate the next sidecar replacement boundary")

          replacement = r'''    regex_once(
              SIDECAR,
              r"^ORCHESTRATOR_TOKEN=.*$",
              """ORCHESTRATOR_TOKEN="${ORCHESTRATOR_TOKEN:-$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')}"
          case "$ORCHESTRATOR_TOKEN" in
            *$'\\r'*|*$'\\n'*) fail "ORCHESTRATOR_TOKEN must not contain carriage returns or newlines" ;;
          esac""",
          )
          replace_once(
              SIDECAR,
              """mkdir -p "$ORCHESTRATOR_WORK"
          rm -rf "$ORCHESTRATOR_SOURCE"
          """,
              """mkdir -p "$ORCHESTRATOR_WORK"
          rm -rf "$ORCHESTRATOR_SOURCE" "$ORCHESTRATOR_SITE_PACKAGES"
          mkdir -p "$ORCHESTRATOR_SITE_PACKAGES"
          """,
          )
          '''
          path.write_text(
              "".join(lines[:start]) + replacement + "".join(lines[end:]),
              encoding="utf-8",
          )
          PY
          python3 -m compileall -q scripts/ci/apply_strix_orchestrator_followup.py

      - name: Apply RED-GREEN patch, verify, and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/apply_strix_orchestrator_followup.py
