name: One-shot preflight timeout confirmation repair

on:
  push:
    branches:
      - fix/preflight-timeout-confirmation

permissions:
  contents: write

concurrency:
  group: one-shot-preflight-timeout-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    # History: ubuntu-latest -> macos-latest -> windows-latest (commits
    # 1c8bbdb/0d2014e), both hops made 27s apart purely to dodge a saturated
    # Actions queue. macos-latest was never actually exercised -- run
    # 33501365496 shows it was cancelled 28s after starting, by the very next
    # push, before it could provision. windows-latest turned out to be
    # actively wrong, not just slow to queue: its bash resolves to a WSL
    # launcher stub that always wins over PATH (fixed in prior commits on
    # this branch), and its NTFS/Git-Bash `stat` emulation cannot reliably
    # report POSIX mode 600 for the token-loader security test
    # (scripts/ci/load_contextual_orchestrator_token.sh), which is a real,
    # load-bearing check protecting a bearer token on disk -- not something
    # to weaken or skip to make Windows CI green. Reverting to ubuntu-latest
    # (rather than macos-latest, which was abandoned without ever running,
    # not because it failed) restores a runner where every check in this
    # job's test suite -- including that permission check -- is POSIX-correct
    # by construction. A queued-but-eventually-running job on a saturated
    # Linux runner is an accepted cost, not a defect to route around.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/preflight-timeout-confirmation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install hash-pinned test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Run RED-to-GREEN repair and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/run_one_shot_preflight_timeout_confirmation.py
