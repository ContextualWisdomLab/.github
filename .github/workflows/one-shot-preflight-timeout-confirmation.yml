name: One-shot preflight timeout confirmation repair

on:
  push:
    branches:
      - fix/preflight-timeout-confirmation

permissions:
  contents: write

concurrency:
  group: one-shot-preflight-timeout-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/preflight-timeout-confirmation
          fetch-depth: 0
          persist-credentials: true

      - name: Prefer Git Bash over the WSL bash.exe launcher stub
        shell: pwsh
        run: |
          # windows-latest resolves an unqualified "bash" on PATH to the WSL
          # launcher stub at C:\Windows\System32\bash.exe ahead of Git Bash,
          # and that stub fails closed with a UTF-16 "no installed
          # distributions" error because these runners carry no WSL distro.
          # The repaired launcher's own pytest suite shells out to bare
          # "bash" (tests/test_contextual_orchestrator_review_sidecar_contract.py,
          # tests/test_contextual_orchestrator_review_runtime_preflight.py,
          # tests/test_strix_contextual_orchestrator_contract.py), so prepend
          # Git for Windows' bin directory to PATH for the rest of this job.
          echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install hash-pinned test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Run RED-to-GREEN repair and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/run_one_shot_preflight_timeout_confirmation.py
