name: One-shot preflight timeout confirmation repair

on:
  push:
    branches:
      - fix/preflight-timeout-confirmation

permissions:
  contents: write

concurrency:
  group: one-shot-preflight-timeout-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/preflight-timeout-confirmation
          fetch-depth: 0
          persist-credentials: true

      - name: Prefer Git Bash over the WSL bash.exe launcher stub
        shell: pwsh
        run: |
          # Prepending Git's bin directory to PATH is NOT sufficient on its
          # own: Win32 CreateProcess resolves an unqualified executable name
          # (e.g. the bare "bash" every affected test invokes) by searching,
          # in order, the calling application's own directory, the current
          # directory, THEN the Windows system directory
          # (C:\Windows\System32), and only after that the PATH environment
          # variable -- see CreateProcessW's documented search sequence. The
          # WSL launcher stub windows-latest preinstalls at
          # C:\Windows\System32\bash.exe therefore always wins over any PATH
          # entry, and it fails closed with a UTF-16 "Windows Subsystem for
          # Linux has no installed distributions" message because these
          # hosted runners carry no WSL distro. That is exactly what broke
          # every bash-invoking pytest case in run 33605637974 / job
          # 100169014077, and reproduced identically in this branch's next
          # push (run 33607270329 / job 100174015506) with only the PATH
          # prepend in place: tests/test_contextual_orchestrator_review_sidecar_contract.py,
          # tests/test_contextual_orchestrator_review_runtime_preflight.py,
          # and tests/test_strix_contextual_orchestrator_contract.py all
          # shell out to a bare "bash".
          #
          # This VM is disposable and this job has no use for WSL, so remove
          # the stub outright; keep the PATH prepend too so Git Bash is also
          # the first match once nothing shadows it in System32.
          $stub = "C:\Windows\System32\bash.exe"
          if (Test-Path -LiteralPath $stub) {
            try {
              Remove-Item -LiteralPath $stub -Force -ErrorAction Stop
            } catch {
              Write-Host "Direct removal of $stub failed ($_); retrying after taking ownership"
              takeown /F $stub /A | Out-Null
              icacls $stub /grant "*S-1-5-32-544:F" | Out-Null
              Remove-Item -LiteralPath $stub -Force -ErrorAction Stop
            }
          }
          if (Test-Path -LiteralPath $stub) {
            throw "Failed to remove the WSL bash.exe launcher stub at $stub"
          }
          echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install hash-pinned test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Run RED-to-GREEN repair and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/run_one_shot_preflight_timeout_confirmation.py
