name: One-shot Strix timeout self-test contract repair

on:
  push:
    branches:
      - fix/strix-timeout-selftest-contract
    paths:
      - .github/workflows/source-fix-strix-timeout-selftest.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reproduce stale assertion, repair, and verify GREEN
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/strix-timeout-selftest-contract
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          branch_head="$(git rev-parse HEAD)"

          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

          set +e
          bash scripts/ci/test_strix_quick_gate.sh >"${RUNNER_TEMP}/strix-selftest-red.log" 2>&1
          red_status=$?
          set -e
          cat "${RUNNER_TEMP}/strix-selftest-red.log"
          test "$red_status" -ne 0
          grep -Fq "strix disables the model client inference timeout (missing 'export LLM_TIMEOUT=0')" "${RUNNER_TEMP}/strix-selftest-red.log"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/test_strix_quick_gate.sh")
          text = path.read_text(encoding="utf-8")
          old = '''\tassert_file_contains "$workflow_file" 'export LLM_TIMEOUT=0' "strix disables the model client inference timeout"\n'''
          new = '''\tassert_file_contains "$workflow_file" 'export LLM_TIMEOUT=300' "strix keeps the Strix 1.5.3 parser bootstrap timeout positive"\n\tassert_file_contains "$REPO_ROOT/tests/test_strix_llm_timeout_contract.py" "test_compat_launcher_disables_request_and_stream_idle_deadlines" "strix self-test delegates unbounded model inference semantics to the version-gated compatibility contract"\n\tassert_file_contains "$REPO_ROOT/scripts/ci/load_contextual_orchestrator_token.sh" "install_strix_timeout_compat.py" "strix installs the version-gated inference-timeout compatibility layer after runtime identity validation"\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale LLM_TIMEOUT=0 self-test assertion")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          PYTHONPATH=. python3 -m pytest -q tests/test_strix_llm_timeout_contract.py
          bash scripts/ci/test_strix_quick_gate.sh
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/test_strix_quick_gate.sh
          git diff --cached --check
          remote_branch="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_branch" = "$branch_head"
          git commit -m "test(strix): align self-test with unbounded inference shim"
          git push origin "HEAD:${TARGET_BRANCH}"
