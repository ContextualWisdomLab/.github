name: Temporary PR1706 One-shot Runner Release v5

on:
  push:
    branches:
      - fix/opencode-poll-wall-clock-bound
    paths:
      - .github/workflows/_temp_pr1706_one_shot_runner_release_v5.yml

permissions:
  contents: write

concurrency:
  group: temp-pr1706-one-shot-runner-release-v5
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate writer and reconcile current protected main
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/opencode-poll-wall-clock-bound | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git fetch origin main fix/opencode-poll-wall-clock-bound
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-verified repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove runner-holding admission is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          red_output="$(PYTHONPATH=. python3 -m pytest -q tests/test_opencode_required_verdict_runner_release.py 2>&1)"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          if [ "$red_status" -ne 1 ] || ! grep -Eq '(^|[[:space:]])[1-9][0-9]* failed([,[:space:]]|$)' <<<"$red_output"; then
            echo "::error::Expected an assertion RED proving the current runner-holding loop."
            exit 1
          fi

      - name: Apply deterministic exact-run wake repair and rebind trusted blob
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci/temp_pr1706_one_shot_runner_release.py
          python3 - <<'PY'
          from pathlib import Path

          driver = Path("scripts/ci/temp_pr1706_one_shot_runner_release_v3.py")
          text = driver.read_text(encoding="utf-8")
          start_token = 'workflow = WORKFLOW.read_text(encoding="utf-8")\n'
          end_token = 'WORKFLOW.write_text(workflow, encoding="utf-8")\n'
          start = text.find(start_token)
          end_start = text.find(end_token, start + len(start_token))
          if start < 0 or end_start < 0:
              raise SystemExit("v3 bounded-transport block drifted")
          end = end_start + len(end_token)
          replacement = '''workflow = WORKFLOW.read_text(encoding="utf-8")
          step_start = "      - name: Fail closed without a current-head OpenCode verdict\\n"
          step_end = "\\n  cancel-superseded-opencode-review-runs:\\n"
          if workflow.count(step_start) != 1 or workflow.count(step_end) != 1:
              raise SystemExit("OpenCode required-verdict step boundaries drifted before bounded transport repair")
          before, rest = workflow.split(step_start, 1)
          target, after = rest.split(step_end, 1)
          target = replace_once(
              target,
              '          live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"\\n',
              '          if ! live_pr="$(timeout 30s gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"; then\\n'
              '            echo "::error::Live pull request API read failed during one-shot current-head verdict admission; failing closed and releasing the runner."\\n'
              '            exit 1\\n'
              '          fi\\n',
              "bounded live PR read",
          )
          target = replace_once(
              target,
              '          if ! reviews="$(gh api --paginate "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then\\n',
              '          if ! reviews="$(timeout 30s gh api --paginate "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then\\n',
              "bounded Reviews read",
          )
          WORKFLOW.write_text(before + step_start + target + step_end + after, encoding="utf-8")
          '''
          text = text[:start] + replacement + text[end:]
          brittle = '''regression = replace_once(regression, '            "PR_HEAD_SHA": HEAD,\\n            "REQUIRED_RUN_ID": "42",\\n', '            "PR_NUMBER": "1437",\\n            "PR_HEAD_SHA": HEAD,\\n            "REQUIRED_RUN_ID": "42",\\n', "formal wake PR identity fixture")
          '''
          robust = '''wake_env = '            "PR_HEAD_SHA": HEAD,\\n            "REQUIRED_RUN_ID": "42",\\n'
          wake_env_with_pr = '            "PR_NUMBER": "1437",\\n            "PR_HEAD_SHA": HEAD,\\n            "REQUIRED_RUN_ID": "42",\\n'
          wake_env_count = regression.count(wake_env)
          if wake_env_count != 2:
              raise SystemExit(f"formal wake PR identity fixtures drifted: expected 2 exact matches, found {wake_env_count}")
          regression = regression.replace(wake_env, wake_env_with_pr)
          '''
          if text.count(brittle) != 1:
              raise SystemExit("v3 formal wake PR identity repair block drifted")
          driver.write_text(text.replace(brittle, robust, 1), encoding="utf-8")
          PY
          PYTHONPATH=. python3 scripts/ci/temp_pr1706_one_shot_runner_release_v3.py
          git restore --source=HEAD -- docs/product-technical-gap-baseline.md
          dispatch_blob="$(git hash-object .github/workflows/opencode-review-dispatch.yml)"
          python3 - "$dispatch_blob" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path("tests/test_pr_review_autofix_nvidia_nim_contract.py")
          text = path.read_text(encoding="utf-8")
          pattern = r'REVIEW_DISPATCH_BLOB_SHA = "[0-9a-f]{40}"'
          matches = re.findall(pattern, text)
          if len(matches) != 1:
              raise SystemExit(f"review-dispatch blob pin drifted: expected one assignment, found {len(matches)}")
          text = re.sub(pattern, f'REVIEW_DISPATCH_BLOB_SHA = "{sys.argv[1]}"', text, count=1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Verify focused GREEN and trusted-blob identity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_poll_rate_budget.py \
            tests/test_opencode_poll_self_retirement.py \
            tests/test_opencode_required_verdict_regression.py \
            tests/test_opencode_live_draft_state_regression.py \
            tests/test_opencode_rust_coverage_toolchain_contract.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py
          python3 -m compileall -q scripts tests
          git diff --check

      - name: Verify broader repository suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest tests -q
          interrogate -c pyproject.toml scripts tests
          git diff --check

      - name: Remove completed one-shot machinery and verify publication scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml \
            .github/workflows/_temp_pr1706_one_shot_runner_release_v5.yml \
            scripts/ci/temp_pr1706_one_shot_runner_release.py \
            scripts/ci/temp_pr1706_one_shot_runner_release_v2.py \
            scripts/ci/temp_pr1706_one_shot_runner_release_v3.py
          git diff --check
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/opencode-review.yml|\
              .github/workflows/opencode-review-dispatch.yml|\
              .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml|\
              .github/workflows/_temp_pr1706_one_shot_runner_release_v5.yml|\
              scripts/ci/temp_pr1706_one_shot_runner_release.py|\
              scripts/ci/temp_pr1706_one_shot_runner_release_v2.py|\
              scripts/ci/temp_pr1706_one_shot_runner_release_v3.py|\
              tests/test_opencode_required_verdict_runner_release.py|\
              tests/test_opencode_poll_rate_budget.py|\
              tests/test_opencode_poll_self_retirement.py|\
              tests/test_opencode_required_verdict_regression.py|\
              tests/test_opencode_live_draft_state_regression.py|\
              tests/test_pr_review_autofix_nvidia_nim_contract.py|\
              docs/doctoring/opencode-stale-poll-self-retirement.md|\
              ARCHITECTURE.md|CHANGELOG.md) ;;
              *) echo "::error::Unexpected publication path: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD)

      - name: Publish only from unchanged exact writer head
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
          # Prefer a workflow-triggering PAT when configured. The temporary
          # materializer may use its scoped contents:write GITHUB_TOKEN only to
          # publish the already-verified repair; the automation then makes the
          # required traceability commit through the owner connector so fresh
          # exact-head required workflows are generated before any merge.
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/opencode-poll-wall-clock-bound | cut -f1)"
          test "$remote_head" = "$EXPECTED_REMOTE_HEAD"
          git add -A
          git diff --cached --check
          git commit -m "fix(opencode): release required runner after one verdict read"
          remote_head="$(git ls-remote origin refs/heads/fix/opencode-poll-wall-clock-bound | cut -f1)"
          test "$remote_head" = "$EXPECTED_REMOTE_HEAD"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/opencode-poll-wall-clock-bound
