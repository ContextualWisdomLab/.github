name: Source Fix PR 1672 Single Request

on:
  push:
    branches:
      - fix/noema-repair-attempt-telemetry
    paths:
      - scripts/ci/source_fix_pr1672_single_request.py
      - .github/workflows/source-fix-pr1672-single-request.yml

concurrency:
  group: source-fix-pr1672-single-request-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate writer head and detect retired one-shot
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/noema-repair-attempt-telemetry | cut -f1)"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          if [ ! -e scripts/ci/source_fix_pr1672_single_request.py ]; then
            echo "active=false" >>"$GITHUB_OUTPUT"
            echo "One-shot PR1672 repair is already retired; successor push needs no materialization."
            exit 0
          fi
          echo "active=true" >>"$GITHUB_OUTPUT"

      - name: Set up Python 3.14
        if: steps.owner.outputs.active == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Repair exact-head materializer semantics before execution
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/source_fix_pr1672_single_request.py')
          text = path.read_text(encoding='utf-8')

          helper_old = "updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)"
          helper_new = "updated, count = re.subn(pattern, lambda match: match.expand(replacement), text, count=1, flags=flags)"
          if text.count(helper_old) != 1:
              raise SystemExit('PR1672 replace_once helper moved; refusing an unverified rewrite')
          text = text.replace(helper_old, helper_new, 1)

          def replace_labeled_call(source: str, label: str, replacement: str) -> str:
              marker = f"        '{label}',\n    )"
              marker_pos = source.find(marker)
              if marker_pos < 0 or source.find(marker, marker_pos + 1) >= 0:
                  raise SystemExit(f'PR1672 {label} marker moved or duplicated; refusing rewrite')
              start = source.rfind('    source = replace_once(\n', 0, marker_pos)
              if start < 0:
                  raise SystemExit(f'PR1672 {label} replace_once start missing')
              end = marker_pos + len(marker)
              return source[:start] + replacement + source[end:]

          gate_call = '''    source = replace_once(
              source,
              r'    try:\\n        verdict = call_llm\\(repo, number, pr, diff, truncated, expected_head, review_context, changed_paths\\)\\n    except StaleHeadDuringRepairRetryError:\\n        print\\("Pull request head changed during review; Noema review skipped before repair retry\\."\\)\\n        return 0\\n',
              '    verdict = call_llm(repo, number, pr, diff, truncated, expected_head, review_context, changed_paths)\\n',
              'inspect_and_review retry catch',
          )'''
          text = replace_labeled_call(text, 'inspect_and_review retry catch', gate_call)

          two_phase_call = '''    source = replace_once(
              source,
              r'    try:\\n        verdict = gate\\.call_llm\\(\\n            repo,\\n            number,\\n            pull_request,\\n            diff,\\n            truncated,\\n            expected,\\n            review_context,\\n            changed_paths,\\n        \\)\\n    except gate\\.StaleHeadDuringRepairRetryError:\\n        print\\("Pull request head changed during model repair retry; verdict was not sealed\\."\\)\\n        return 0\\n',
              '    verdict = gate.call_llm(\\n        repo,\\n        number,\\n        pull_request,\\n        diff,\\n        truncated,\\n        expected,\\n        review_context,\\n        changed_paths,\\n    )\\n',
              'two-phase retry catch',
          )'''
          text = replace_labeled_call(text, 'two-phase retry catch', two_phase_call)

          forbidden_anchor = "    forbidden = (\n"
          class_removal = '''    source = replace_once(
              source,
              r'class StaleHeadDuringRepairRetryError\\(RuntimeError\\):\\n    """[^"\\n]*"""\\n\\n',
              '',
              'stale repair retry exception',
          )

'''
          if text.count(forbidden_anchor) != 1:
              raise SystemExit('PR1672 forbidden-token anchor moved; refusing an unverified rewrite')
          text = text.replace(forbidden_anchor, class_removal + forbidden_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/ci/source_fix_pr1672_single_request.py
          git diff --check

      - name: Install exact hash-verified review test toolchain
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Materialize causal-owner repair without credentials in the script environment
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/ci/source_fix_pr1672_single_request.py

      - name: Verify permanent single-request contract and focused regressions
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/noema_review_gate.py .github/actions/noema-review/two_phase.py
          python -m pytest \
            tests/test_noema_repair_has_no_fixed_wall_clock_deadline.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_noema_model_output_failure_classification.py \
            tests/test_noema_review_gate.py \
            tests/test_noema_review_orchestrator_ssrf.py \
            -q
          git diff --check

      - name: Verify full repository Python contract
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing
          python -m interrogate -c pyproject.toml scripts/ci
          python -m compileall -q scripts tests .github/actions/noema-review

      - name: Verify exact intended scope cleanup and unchanged remote head
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github/actions/noema-review/two_phase.py|.github/workflows/source-fix-pr1672-single-request.yml|CHANGELOG.md|docs/doctoring/noema-repair-attempt-telemetry.md|docs/product-technical-gap-baseline.md|scripts/ci/noema_review_gate.py|scripts/ci/source_fix_pr1672_single_request.py|tests/test_noema_model_output_failure_classification.py|tests/test_noema_repair_attempt_telemetry.py|tests/test_noema_repair_deadline_alarm_safety.py|tests/test_noema_review_gate.py)$'
          bad="$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$bad"
          test ! -e .github/workflows/source-fix-pr1672-single-request.yml
          test ! -e scripts/ci/source_fix_pr1672_single_request.py
          remote_head="$(git ls-remote origin refs/heads/fix/noema-repair-attempt-telemetry | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Publish normal non-force repair commit with workflow-starting credential
        if: steps.owner.outputs.active == 'true'
        env:
          PRIMARY_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          FALLBACK_PUSH_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_push_token="${PRIMARY_PUSH_TOKEN:-${FALLBACK_PUSH_TOKEN:-}}"
          if [ -z "$workflow_push_token" ]; then
            echo "::error::No workflow-starting mutation credential is configured; refusing github.token publication."
            exit 1
          fi
          remote_head="$(git ls-remote origin refs/heads/fix/noema-repair-attempt-telemetry | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(noema): delegate structured repair to orchestrator"
          git remote set-url origin "https://x-access-token:${workflow_push_token}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/noema-repair-attempt-telemetry
