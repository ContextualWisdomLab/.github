name: Source Fix PR 1672 Single Request

on:
  push:
    branches:
      - fix/noema-repair-attempt-telemetry
    paths:
      - scripts/ci/source_fix_pr1672_single_request.py
      - .github/workflows/source-fix-pr1672-single-request.yml

concurrency:
  group: source-fix-pr1672-single-request-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate writer head and detect retired one-shot
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/noema-repair-attempt-telemetry | cut -f1)"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          if [ ! -e scripts/ci/source_fix_pr1672_single_request.py ]; then
            echo "active=false" >>"$GITHUB_OUTPUT"
            echo "One-shot PR1672 repair is already retired; successor push needs no materialization."
            exit 0
          fi
          echo "active=true" >>"$GITHUB_OUTPUT"

      - name: Set up Python 3.14
        if: steps.owner.outputs.active == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Repair exact-head materializer semantics before execution
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/source_fix_pr1672_single_request.py')
          text = path.read_text(encoding='utf-8')

          def replace_labeled_call(source: str, label: str, replacement: str) -> str:
              marker = f"        '{label}',\n    )"
              marker_pos = source.find(marker)
              if marker_pos < 0 or source.find(marker, marker_pos + 1) >= 0:
                  raise SystemExit(f'PR1672 {label} marker moved or duplicated; refusing rewrite')
              start = source.rfind('    source = replace_once(\n', 0, marker_pos)
              if start < 0:
                  raise SystemExit(f'PR1672 {label} replace_once start missing')
              end = marker_pos + len(marker)
              return source[:start] + replacement + source[end:]

          def insert_after_labeled_call(source: str, label: str, addition: str) -> str:
              marker = f"        '{label}',\n    )"
              marker_pos = source.find(marker)
              if marker_pos < 0 or source.find(marker, marker_pos + 1) >= 0:
                  raise SystemExit(f'PR1672 {label} marker moved or duplicated; refusing insertion')
              end = marker_pos + len(marker)
              return source[:end] + "\n" + addition + source[end:]

          old_span = "        start = node.lineno - 1\n        end = node.end_lineno or node.lineno\n"
          new_span = (
              "        decorator_lines = [decorator.lineno for decorator in node.decorator_list]\n"
              "        start = min([node.lineno, *decorator_lines]) - 1\n"
              "        end = node.end_lineno or node.lineno\n"
          )
          if text.count(old_span) != 1:
              raise SystemExit('PR1672 remove_functions span contract moved; refusing rewrite')
          text = text.replace(old_span, new_span, 1)

          gate_call = '''    source = replace_once(
              source,
              r'    try:\\n        verdict = call_llm\\(repo, number, pr, diff, truncated, expected_head, review_context, changed_paths\\)\\n    except StaleHeadDuringRepairRetryError:\\n        print\\("Pull request head changed during review; Noema review skipped before repair retry\\."\\)\\n        return 0\\n',
              '    verdict = call_llm(repo, number, pr, diff, truncated, expected_head, review_context, changed_paths)\\n',
              'inspect_and_review retry catch',
          )
              source = source.replace(
                  '    comparisons below, and before the one ``call_llm`` performs on its own\\n'
                  '    repair-retry path (see ``StaleHeadDuringRepairRetryError``). The CLI and\\n',
                  '    comparisons below and the post-model publication check. The CLI and\\n',
              )'''
          text = replace_labeled_call(text, 'inspect_and_review retry catch', gate_call)

          two_phase_call = '''    source = replace_once(
              source,
              r'    try:\\n        verdict = gate\\.call_llm\\(\\n            repo,\\n            number,\\n            pull_request,\\n            diff,\\n            truncated,\\n            expected,\\n            review_context,\\n            changed_paths,\\n        \\)\\n    except gate\\.StaleHeadDuringRepairRetryError:\\n        print\\("Pull request head changed during model repair retry; verdict was not sealed\\."\\)\\n        return 0\\n',
              '    verdict = gate.call_llm(\\n        repo,\\n        number,\\n        pull_request,\\n        diff,\\n        truncated,\\n        expected,\\n        review_context,\\n        changed_paths,\\n    )\\n',
              'two-phase retry catch',
          )'''
          text = replace_labeled_call(text, 'two-phase retry catch', two_phase_call)

          stale_exception_call = '''    source = replace_once(
              source,
              r'class StaleHeadDuringRepairRetryError\\(RuntimeError\\):\\n    """Raised when the PR head moves before ``call_llm``.s repair-retry request fires\\."""\\n\\n'.replace('``.s', "``'s"),
              '',
              'stale repair exception',
          )'''
          text = insert_after_labeled_call(text, 'deadline exception', stale_exception_call)

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/ci/source_fix_pr1672_single_request.py
          git diff --check

      - name: Install exact hash-verified review test toolchain
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Materialize causal-owner repair without credentials in the script environment
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/ci/source_fix_pr1672_single_request.py

      - name: Replace obsolete local-retry regressions with single-request failure contracts
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          review_test = Path('tests/test_noema_review_gate.py')
          source = review_test.read_text(encoding='utf-8')
          names = {
              'test_call_llm_repairs_one_malformed_envelope_before_failing_closed',
              'test_call_llm_still_repairs_once_when_head_has_not_moved',
              'test_call_llm_fails_closed_after_repeated_malformed_envelope',
              'test_call_llm_fails_closed_after_repeated_invalid_utf8_response',
              'test_call_llm_repairs_once_after_a_transport_error_then_succeeds',
              'test_call_llm_fails_closed_after_a_repeated_transport_error',
              'test_call_llm_repairs_once_after_a_truncated_response_then_succeeds',
              'test_call_llm_fails_closed_after_a_repeated_truncated_response',
              'test_call_llm_repairs_once_after_a_socket_timeout_then_succeeds',
              'test_call_llm_fails_closed_after_a_repeated_socket_timeout',
              'test_call_llm_repairs_one_malformed_json_response',
              'test_call_llm_repairs_one_rejected_changed_line_verdict',
          }
          tree = ast.parse(source)
          lines = source.splitlines(keepends=True)
          spans = []
          found = set()
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names:
                  decorator_lines = [decorator.lineno for decorator in node.decorator_list]
                  start = min([node.lineno, *decorator_lines]) - 1
                  end = node.end_lineno or node.lineno
                  spans.append((start, end))
                  found.add(node.name)
          missing = names - found
          if missing:
              raise SystemExit(f'PR1672 stale retry tests moved or disappeared unexpectedly: {sorted(missing)}')
          for start, end in sorted(spans, reverse=True):
              del lines[start:end]
          review_test.write_text(''.join(lines), encoding='utf-8')

          telemetry = Path('tests/test_noema_repair_attempt_telemetry.py')
          extra = r'''


def _call_with_transport(monkeypatch, *, open_error=None, read_error=None, raw=None):
    monkeypatch.setenv("NOEMA_LLM_API_URL", "https://llm.example/v1/chat/completions")
    monkeypatch.setenv("NOEMA_LLM_API_KEY", "test-key")
    calls = []

    class Response:
        def __enter__(self):
            return self

        def __exit__(self, *_args):
            return None

        def read(self):
            if read_error is not None:
                raise read_error
            assert raw is not None
            return raw

    def open_response(_opener, request, **kwargs):
        calls.append(request)
        assert kwargs == {}
        if open_error is not None:
            raise open_error(request) if callable(open_error) else open_error
        return Response()

    monkeypatch.setattr(gate.urllib.request.OpenerDirector, "open", open_response)
    return calls


def test_malformed_gateway_envelope_is_one_request_fail_closed(monkeypatch) -> None:
    calls = _call_with_transport(monkeypatch, raw=b"[]")
    with pytest.raises(gate.NoemaModelOutputError, match="caller attempts=1"):
        gate.call_llm("owner/repo", 7, {"title": "t", "headRefOid": "c" * 40}, DIFF, False, "c" * 40, changed_paths=("README.md",))
    assert len(calls) == 1


def test_invalid_utf8_is_one_request_fail_closed(monkeypatch) -> None:
    calls = _call_with_transport(monkeypatch, raw=b"invalid: \x80\x81\xfe")
    with pytest.raises(gate.NoemaModelOutputError, match="caller attempts=1"):
        gate.call_llm("owner/repo", 7, {"title": "t", "headRefOid": "d" * 40}, DIFF, False, "d" * 40, changed_paths=("README.md",))
    assert len(calls) == 1


@pytest.mark.parametrize(
    "failure",
    [
        lambda request: gate.urllib.error.HTTPError(request.full_url, 502, "Bad Gateway", {}, None),
        OSError("socket timeout"),
    ],
)
def test_connect_failures_are_one_request_and_typed(monkeypatch, failure) -> None:
    calls = _call_with_transport(monkeypatch, open_error=failure)
    with pytest.raises(gate.NoemaTransportError, match="caller attempts=1"):
        gate.call_llm("owner/repo", 7, {"title": "t", "headRefOid": "e" * 40}, DIFF, False, "e" * 40, changed_paths=("README.md",))
    assert len(calls) == 1


def test_truncated_read_is_one_request_and_typed(monkeypatch) -> None:
    calls = _call_with_transport(monkeypatch, read_error=gate.http.client.IncompleteRead(b"", 10))
    with pytest.raises(gate.NoemaTransportError, match="caller attempts=1"):
        gate.call_llm("owner/repo", 7, {"title": "t", "headRefOid": "f" * 40}, DIFF, False, "f" * 40, changed_paths=("README.md",))
    assert len(calls) == 1


def test_rejected_changed_line_verdict_is_not_retried(monkeypatch) -> None:
    verdict = _verdict()
    verdict["decision"] = "request_changes"
    verdict["findings"] = [{
        "severity": "high",
        "file": "README.md",
        "line": 99,
        "side": "RIGHT",
        "message": "Outside the changed hunk.",
    }]
    raw = json.dumps({"model": "provider/model", "choices": [{"message": {"content": json.dumps(verdict)}}]}).encode()
    calls = _call_with_transport(monkeypatch, raw=raw)
    with pytest.raises(gate.NoemaModelOutputError, match="caller attempts=1"):
        gate.call_llm("owner/repo", 7, {"title": "t", "headRefOid": "1" * 40}, DIFF, False, "1" * 40, changed_paths=("README.md",))
    assert len(calls) == 1
'''
          current = telemetry.read_text(encoding='utf-8')
          marker = 'def _call_with_transport('
          if marker not in current:
              telemetry.write_text(current.rstrip() + extra + '\n', encoding='utf-8')
          PY
          python -m py_compile tests/test_noema_review_gate.py tests/test_noema_repair_attempt_telemetry.py
          git diff --check

      - name: Verify permanent single-request contract and focused regressions
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/ci/noema_review_gate.py .github/actions/noema-review/two_phase.py
          python -m pytest \
            tests/test_noema_repair_has_no_fixed_wall_clock_deadline.py \
            tests/test_noema_repair_attempt_telemetry.py \
            tests/test_noema_model_output_failure_classification.py \
            tests/test_noema_review_gate.py \
            tests/test_noema_review_orchestrator_ssrf.py \
            -q
          git diff --check

      - name: Verify full repository Python contract
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage run -m pytest tests -q
          python -m coverage report --show-missing
          python -m interrogate -c pyproject.toml scripts/ci
          python -m compileall -q scripts tests .github/actions/noema-review

      - name: Verify exact intended scope cleanup and unchanged remote head
        if: steps.owner.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(.github/actions/noema-review/two_phase.py|.github/workflows/source-fix-pr1672-single-request.yml|CHANGELOG.md|docs/doctoring/noema-repair-attempt-telemetry.md|docs/product-technical-gap-baseline.md|scripts/ci/noema_review_gate.py|scripts/ci/source_fix_pr1672_single_request.py|tests/test_noema_model_output_failure_classification.py|tests/test_noema_repair_attempt_telemetry.py|tests/test_noema_repair_deadline_alarm_safety.py|tests/test_noema_review_gate.py)$'
          bad="$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$bad"
          test ! -e .github/workflows/source-fix-pr1672-single-request.yml
          test ! -e scripts/ci/source_fix_pr1672_single_request.py
          remote_head="$(git ls-remote origin refs/heads/fix/noema-repair-attempt-telemetry | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Publish normal non-force repair commit with workflow-starting credential
        if: steps.owner.outputs.active == 'true'
        env:
          PRIMARY_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          FALLBACK_PUSH_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_push_token="${PRIMARY_PUSH_TOKEN:-${FALLBACK_PUSH_TOKEN:-}}"
          if [ -z "$workflow_push_token" ]; then
            echo "::error::No workflow-starting mutation credential is configured; refusing github.token publication."
            exit 1
          fi
          remote_head="$(git ls-remote origin refs/heads/fix/noema-repair-attempt-telemetry | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(noema): delegate structured repair to orchestrator"
          git remote set-url origin "https://x-access-token:${workflow_push_token}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/noema-repair-attempt-telemetry
