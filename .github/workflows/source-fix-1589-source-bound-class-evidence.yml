name: One-shot PR 1589 source-bound class evidence repair

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-source-bound-class-evidence.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.sha == 'cdfcf4001033bcf521cc67dcfda0bab047e7ef36'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply exact source-binding repair and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "cdfcf4001033bcf521cc67dcfda0bab047e7ef36"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re

          source = Path("scripts/ci/noema_review_gate.py")
          text = source.read_text(encoding="utf-8")
          old = '''def _validate_observed_probe_class_evidence(
              probe: dict[str, Any], probe_kind: str, index: int
          ) -> None:
              """Require the exact deterministic witness schema for a claimed defect class."""
              class_evidence = probe.get("class_evidence")
              required_fields = OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS[probe_kind]
              if not isinstance(class_evidence, dict) or set(class_evidence) != set(required_fields):
                  expected = ", ".join(required_fields)
                  raise RuntimeError(
                      f"Noema adversarial probe {index} class_evidence for {probe_kind} "
                      f"must contain exactly: {expected}"
                  )
              for field in required_fields:
                  value = class_evidence.get(field)
                  if not isinstance(value, str) or not value.strip():
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} "
                          "requires source-traced witness text"
                      )
          '''
          new = '''def _validate_observed_probe_class_evidence(
              probe: dict[str, Any], probe_kind: str, index: int, location: tuple[Any, ...]
          ) -> None:
              """Require every defect-class witness to bind to the probe's exact changed line."""
              class_evidence = probe.get("class_evidence")
              required_fields = OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS[probe_kind]
              if not isinstance(class_evidence, dict) or set(class_evidence) != set(required_fields):
                  expected = ", ".join(required_fields)
                  raise RuntimeError(
                      f"Noema adversarial probe {index} class_evidence for {probe_kind} "
                      f"must contain exactly: {expected}"
                  )
              expected_ref = {"path": location[0], "line": location[1], "side": location[2]}
              for field in required_fields:
                  source_ref = class_evidence.get(field)
                  if not isinstance(source_ref, dict) or set(source_ref) != {"path", "line", "side"}:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} requires a "
                          "source-bound changed-line reference"
                      )
                  if source_ref != expected_ref:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} must bind to "
                          "the probe location"
                      )
          '''
          if text.count(old) != 1:
              raise SystemExit("class-evidence validator changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''        probe_kind = probe.get("probe_kind")
                  if not isinstance(probe_kind, str) or probe_kind not in OBSERVED_REVIEW_PROBE_KINDS:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} requires probe_kind from the observed defect taxonomy"
                      )
                  _validate_observed_probe_class_evidence(probe, probe_kind, index)
                  probe_kinds.add(probe_kind)
                  location = (probe.get("path"), probe.get("line"), probe.get("side"))
                  if location not in locations:
                      raise RuntimeError(f"Noema adversarial probe {index} is not an exact changed-side line")
          '''
          new = '''        probe_kind = probe.get("probe_kind")
                  if not isinstance(probe_kind, str) or probe_kind not in OBSERVED_REVIEW_PROBE_KINDS:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} requires probe_kind from the observed defect taxonomy"
                      )
                  location = (probe.get("path"), probe.get("line"), probe.get("side"))
                  if location not in locations:
                      raise RuntimeError(f"Noema adversarial probe {index} is not an exact changed-side line")
                  _validate_observed_probe_class_evidence(probe, probe_kind, index, location)
                  probe_kinds.add(probe_kind)
          '''
          if text.count(old) != 1:
              raise SystemExit("probe validation loop changed unexpectedly")
          text = text.replace(old, new, 1)
          text = text.replace(
              '"class_evidence": {"exact_fields_for_selected_probe_kind": "source-traced witness text"},',
              '"class_evidence": {"exact_fields_for_selected_probe_kind": {**location_example}},',
              1,
          )
          old_instruction = '"A probe_kind label is not evidence by itself. class_evidence must use exactly the class-specific source-traced witness fields in this schema: " + json.dumps(OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS, separators=(",", ":")) + ".",'
          new_instruction = '"A probe_kind label is not evidence by itself. class_evidence must use exactly the class-specific fields in this schema: " + json.dumps(OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS, separators=(",", ":")) + ". Every field value must be the exact {path,line,side} changed-line reference of that probe; free-form witness prose or another changed line does not count toward class diversity.",'
          if text.count(old_instruction) != 1:
              raise SystemExit("prompt class-evidence instruction changed unexpectedly")
          text = text.replace(old_instruction, new_instruction, 1)
          source.write_text(text, encoding="utf-8")

          taxonomy = Path("tests/test_noema_observed_defect_probe_taxonomy.py")
          text = taxonomy.read_text(encoding="utf-8")
          old = '''def _class_evidence(probe_kind: str) -> dict[str, str]:
              """Build the exact class-specific witness schema expected for one probe kind."""
              return {
                  field: f"source-traced {field.replace('_', ' ')} witness"
                  for field in CLASS_EVIDENCE_FIELDS[probe_kind]
              }
          '''
          new = '''def _class_evidence(probe_kind: str) -> dict[str, dict[str, object]]:
              """Bind every class-specific witness field to the exact changed probe line."""
              source_ref = {"path": "tool.py", "line": 1, "side": "RIGHT"}
              return {field: dict(source_ref) for field in CLASS_EVIDENCE_FIELDS[probe_kind]}
          '''
          if text.count(old) != 1:
              raise SystemExit("taxonomy evidence helper changed unexpectedly")
          taxonomy.write_text(text.replace(old, new, 1), encoding="utf-8")

          binding = Path("tests/test_noema_probe_source_binding.py")
          text = binding.read_text(encoding="utf-8")
          text = text.replace(
              'def _source_ref(line: int, excerpt: str) -> dict[str, object]:\n    return {"path": "tool.py", "line": line, "side": "RIGHT", "source_excerpt": excerpt}\n',
              'def _source_ref(line: int) -> dict[str, object]:\n    return {"path": "tool.py", "line": line, "side": "RIGHT"}\n',
              1,
          )
          text = re.sub(r'_source_ref\((\d+), "[^"]+"\)', r'_source_ref(\1)', text)
          binding.write_text(text, encoding="utf-8")

          review_tests = Path("tests/test_noema_review_gate.py")
          text = review_tests.read_text(encoding="utf-8")
          pattern = re.compile(
              r'("path":\s*"(?P<path>[^"]+)",\s*"line":\s*(?P<line>\d+),\s*"side":\s*"(?P<side>LEFT|RIGHT)",\s*"probe_kind":\s*"[^"]+",\s*"class_evidence":\s*)(?P<evidence>\{[^{}]*\})'
          )
          count = 0
          def replace(match: re.Match[str]) -> str:
              nonlocal_count = None
              evidence = ast.literal_eval(match.group("evidence"))
              ref = {"path": match.group("path"), "line": int(match.group("line")), "side": match.group("side")}
              rebound = {field: dict(ref) for field in evidence}
              return match.group(1) + repr(rebound)
          text, count = pattern.subn(replace, text)
          if count != 8:
              raise SystemExit(f"expected to migrate 8 class-evidence fixtures, migrated {count}")
          review_tests.write_text(text, encoding="utf-8")

          docs = Path("docs/doctoring/noema-observed-defect-probe-taxonomy.md")
          text = docs.read_text(encoding="utf-8")
          text += "\n\n### Source-bound class witnesses\n\nA probe class is not admitted from prose. Every class-specific witness field must now be the exact `{path, line, side}` reference of the probe's changed-side source location. The validator rejects free-form boilerplate and rejects borrowing another changed line, so class diversity cannot be manufactured by relabeling generic text. The class name remains an audit taxonomy; the machine-enforced evidence is the exact source binding plus the existing concrete hypothesis, counterexample, outcome, and changed-line checks.\n"
          docs.write_text(text, encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          text = baseline.read_text(encoding="utf-8")
          text += "\n\n- Noema observed-defect probe admission now binds every class-specific witness field to the probe's exact changed-side `{path,line,side}` location. Free-form boilerplate and evidence borrowed from another changed line fail closed; distinct class labels no longer manufacture source evidence.\n"
          baseline.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = "- Noema observed-defect probe classes now require exact changed-line source references for every class witness, rejecting boilerplate or unrelated-line evidence before class diversity can authorize a formal verdict.\n"
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git add scripts/ci/noema_review_gate.py tests/test_noema_observed_defect_probe_taxonomy.py tests/test_noema_probe_source_binding.py tests/test_noema_review_gate.py docs/doctoring/noema-observed-defect-probe-taxonomy.md docs/product-technical-gap-baseline.md CHANGELOG.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(noema): bind defect-class witnesses to changed source"
          git push origin "HEAD:${TARGET_BRANCH}"