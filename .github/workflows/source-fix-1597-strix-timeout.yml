name: One-shot PR 1597 Strix timeout repair

on:
  push:
    branches:
      - fix/strix-orchestrator-zero-llm-timeout
    paths:
      - .github/workflows/source-fix-1597-strix-timeout.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Repair timeout, verify GREEN, and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/strix-orchestrator-zero-llm-timeout
          TEMP_WORKFLOW: .github/workflows/source-fix-1597-strix-timeout.yml
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          branch_head="$(git rev-parse HEAD)"

          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/strix.yml')
          text = path.read_text(encoding='utf-8')
          old = '          export LLM_TIMEOUT=0\n'
          new = '          export LLM_TIMEOUT=300\n'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one zero Strix LLM timeout')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          PYTHONPATH=. python3 -m pytest -q tests/test_strix_llm_timeout_contract.py
          git diff --check
          grep -Fq 'export LLM_TIMEOUT=300' .github/workflows/strix.yml
          ! grep -Fq 'export LLM_TIMEOUT=0' .github/workflows/strix.yml

          git rm "$TEMP_WORKFLOW"
          git add .github/workflows/strix.yml tests/test_strix_llm_timeout_contract.py
          git diff --cached --check

          remote_branch="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_branch" = "$branch_head"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'fix(strix): keep model preflight timeout positive'
          git push origin "HEAD:${TARGET_BRANCH}"
