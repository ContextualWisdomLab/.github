name: Bounded Capture Startup CI

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/bounded_subprocess.py"
      - "tests/test_bounded_subprocess_capture_startup.py"
      - ".github/workflows/bounded-capture-startup-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ci/bounded_subprocess.py"
      - "tests/test_bounded_subprocess_capture_startup.py"
      - ".github/workflows/bounded-capture-startup-ci.yml"

concurrency:
  group: bounded-capture-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-startup-contract:
    name: Capture startup cleanup contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install exact test tools
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1
          coverage==7.14.3
          interrogate==1.7.0

      - name: Run capture-startup regression and branch coverage
        run: |
          python -m coverage run --branch -m pytest -q \
            tests/test_bounded_subprocess_capture_startup.py
          python -m coverage report \
            --include='scripts/ci/bounded_subprocess.py' \
            --show-missing

      - name: Enforce production docstrings
        run: >-
          python -m interrogate --fail-under 100
          scripts/ci/bounded_subprocess.py

      - name: Compile exact surfaces
        run: >-
          python -m py_compile
          scripts/ci/bounded_subprocess.py
          tests/test_bounded_subprocess_capture_startup.py
