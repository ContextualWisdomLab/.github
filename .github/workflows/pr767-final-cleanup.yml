name: Finalize PR 767 sandbox evidence repairs

on:
  push:
    branches: [fix/sandboxed-output-resource-bounds]
    paths:
      - .github/workflows/pr767-final-cleanup.yml

permissions:
  contents: read

concurrency:
  group: pr767-final-cleanup
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  repair-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/sandboxed-output-resource-bounds'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact locked quality tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply bounded review repairs
        env:
          PATCH_SCRIPT_B64: ''
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > "$RUNNER_TEMP/pr767_patch.py"
          python "$RUNNER_TEMP/pr767_patch.py"
          git diff --check

      - name: Verify exact-head quality contract
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci
          python -m compileall -q scripts tests
          bash -n scripts/ci/run_opencode_review_model_pool.sh
          git diff --check

      - name: Publish verified repair and remove finalizer
        env:
          BRANCH_NAME: fix/sandboxed-output-resource-bounds
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head="$(git ls-remote "$remote_url" "refs/heads/$BRANCH_NAME" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm -f .github/workflows/pr767-final-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No final repair generated' >&2; exit 1; }
          git commit -m 'fix(ci): close sandbox evidence review gaps'
          git push \
            --force-with-lease="refs/heads/${BRANCH_NAME}:${EXPECTED_HEAD}" \
            "$remote_url" "HEAD:refs/heads/$BRANCH_NAME"
