name: Scorecard analysis

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 6"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # scorecard.dev publishing requires a uses-only job. This workflow keeps
          # a local SARIF filter before uploading the authoritative code scanning result.
          publish_results: false

      - name: Filter necessary SARIF upload permission findings
        run: |
          python3 <<'PY'
          import json
          import pathlib

          sarif_path = pathlib.Path("results.sarif")
          sarif = json.loads(sarif_path.read_text(encoding="utf-8"))
          removed = 0
          for run in sarif.get("runs", []):
              kept = []
              for result in run.get("results", []):
                  message = (result.get("message") or {}).get("text") or ""
                  if (
                      result.get("ruleId") == "TokenPermissionsID"
                      and "'security-events' permission set to 'write'" in message
                  ):
                      removed += 1
                      continue
                  kept.append(result)
              run["results"] = kept
          filtered_path = sarif_path.with_name(f"{sarif_path.name}.filtered")
          filtered_path.write_text(json.dumps(sarif, indent=2), encoding="utf-8")
          filtered_path.replace(sarif_path)
          print(f"Filtered {removed} necessary security-events SARIF upload permission finding(s).")
          PY

      - name: Upload to code scanning
        # Scorecard posture is preserved in its SARIF-generation log; an
        # installation upload quota outage must not fail the default branch.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
