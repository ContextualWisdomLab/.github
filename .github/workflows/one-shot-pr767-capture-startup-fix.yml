name: One-shot PR 767 bounded capture startup repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-pr767-capture-startup-fix.yml"

concurrency:
  group: one-shot-pr767-bounded-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/sandboxed-output-resource-bounds'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact pull-request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-locked review toolchain
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply, verify, and materialize bounded repair commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -I - <<'PY'
          from pathlib import Path


          source_path = Path("scripts/ci/bounded_subprocess.py")
          source = source_path.read_text(encoding="utf-8")

          suppress_import = "from contextlib import suppress\n"
          if suppress_import not in source:
              import_anchor = "import threading\n"
              if source.count(import_anchor) != 1:
                  raise SystemExit(f"{source_path}: invalid threading import anchor")
              source = source.replace(
                  import_anchor,
                  import_anchor + suppress_import,
                  1,
              )
          elif source.count(suppress_import) != 1:
              raise SystemExit(f"{source_path}: duplicate suppress import")

          helper_marker = "def _cleanup_capture_startup_failure("
          helper = '''def _cleanup_capture_startup_failure(
              process: subprocess.Popen[bytes],
              captures: Sequence[BoundedOutputCapture],
              streams: Sequence[BinaryIO],
          ) -> None:
              """Best-effort terminate, reap, finalize, and close partial startup state."""

              with suppress(BaseException):
                  kill_process_group(process)
              with suppress(BaseException):
                  process.wait(timeout=10)
              for capture in captures:
                  with suppress(BaseException):
                      capture.join(timeout=10)
              for stream in streams:
                  with suppress(BaseException):
                      stream.close()
              for capture in captures:
                  with suppress(BaseException):
                      capture.join(timeout=10)


          '''
          if helper_marker not in source:
              function_anchor = "def run_bounded_command(\n"
              if source.count(function_anchor) != 1:
                  raise SystemExit(f"{source_path}: invalid command-function anchor")
              function_offset = source.index(function_anchor)
              source = source[:function_offset] + helper + source[function_offset:]
          elif source.count(helper_marker) != 1:
              raise SystemExit(f"{source_path}: duplicate cleanup helper")

          startup_marker = "    captures: list[BoundedOutputCapture] = []\n"
          if startup_marker not in source:
              function_offset = source.index("def run_bounded_command(\n")
              startup_offset = source.index(
                  "    stdout_capture = start_bounded_capture(\n",
                  function_offset,
              )
              timed_out_offset = source.index(
                  "    timed_out = False\n",
                  startup_offset,
              )
              startup = '''    captures: list[BoundedOutputCapture] = []
              streams = (process.stdout, process.stderr)
              try:
                  stdout_capture = start_bounded_capture(
                      process.stdout,
                      evidence_limit_bytes=evidence_limit,
                      on_limit=stop_for_limit,
                  )
                  captures.append(stdout_capture)
                  stderr_capture = start_bounded_capture(
                      process.stderr,
                      evidence_limit_bytes=evidence_limit,
                      on_limit=stop_for_limit,
                  )
                  captures.append(stderr_capture)
              except BaseException:  # noqa: BLE001 - preserve the startup root cause
                  _cleanup_capture_startup_failure(process, captures, streams)
                  raise
          '''
              source = source[:startup_offset] + startup + source[timed_out_offset:]
          elif source.count(startup_marker) != 1:
              raise SystemExit(f"{source_path}: duplicate startup cleanup block")

          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_bounded_subprocess_capture_startup.py")
          test_source = test_path.read_text(encoding="utf-8")
          replacements = (
              (
                  "assert all(capture.join_calls == 1 for capture in captures)",
                  "assert all(capture.join_calls == 2 for capture in captures)",
              ),
              ("assert capture.join_calls == 1", "assert capture.join_calls == 2"),
          )
          for old, new in replacements:
              old_count = test_source.count(old)
              new_count = test_source.count(new)
              if old_count == 1 and new_count == 0:
                  test_source = test_source.replace(old, new, 1)
              elif old_count != 0 or new_count != 1:
                  raise SystemExit(
                      f"{test_path}: invalid assertion state old={old_count} new={new_count}"
                  )
          test_path.write_text(test_source, encoding="utf-8")

          Path(".github/workflows/bounded-capture-startup-ci.yml").unlink()
          Path(".github/workflows/one-shot-pr767-capture-startup-fix.yml").unlink()
          PY

          python -m pytest -q tests/test_bounded_subprocess_capture_startup.py
          python -m py_compile \
            scripts/ci/bounded_subprocess.py \
            tests/test_bounded_subprocess_capture_startup.py
          python -m interrogate --fail-under 100 scripts/ci/bounded_subprocess.py
          git diff --check
          test ! -e .github/workflows/bounded-capture-startup-ci.yml
          test ! -e .github/workflows/one-shot-pr767-capture-startup-fix.yml

          base_tree="$(
            gh api -X GET "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_HEAD}" \
              --jq '.tree.sha'
          )"
          source_blob="$(
            jq -Rs '{content: ., encoding: "utf-8"}' \
              <scripts/ci/bounded_subprocess.py \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - --jq '.sha'
          )"
          test_blob="$(
            jq -Rs '{content: ., encoding: "utf-8"}' \
              <tests/test_bounded_subprocess_capture_startup.py \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - --jq '.sha'
          )"
          tree_sha="$(
            jq -n \
              --arg base_tree "$base_tree" \
              --arg source_blob "$source_blob" \
              --arg test_blob "$test_blob" \
              '{
                base_tree: $base_tree,
                tree: [
                  {
                    path: "scripts/ci/bounded_subprocess.py",
                    mode: "100644",
                    type: "blob",
                    sha: $source_blob
                  },
                  {
                    path: "tests/test_bounded_subprocess_capture_startup.py",
                    mode: "100644",
                    type: "blob",
                    sha: $test_blob
                  },
                  {
                    path: ".github/workflows/bounded-capture-startup-ci.yml",
                    mode: "100644",
                    type: "blob",
                    sha: null
                  },
                  {
                    path: ".github/workflows/one-shot-pr767-capture-startup-fix.yml",
                    mode: "100644",
                    type: "blob",
                    sha: null
                  }
                ]
              }' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/trees" \
                  --input - --jq '.sha'
          )"
          commit_sha="$(
            jq -n \
              --arg message "fix(ci): reap partial bounded capture startup" \
              --arg tree "$tree_sha" \
              --arg parent "$EXPECTED_HEAD" \
              '{message: $message, tree: $tree, parents: [$parent]}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/commits" \
                  --input - --jq '.sha'
          )"
          test -n "$commit_sha"
          echo "BOUNDED_REPAIR_COMMIT_SHA=$commit_sha"
