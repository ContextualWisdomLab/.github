name: Export current PR759 three-way workspaces

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/export-pr759-current-three-way.yml

permissions:
  contents: read

concurrency:
  group: export-current-pr759-three-way
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: pull_request_head
          persist-credentials: false

      - name: Checkout current protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: protected_main
          persist-credentials: false

      - name: Checkout immutable merge base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 3f65dbee6672b78802e7d71d49c390f3817bb03b
          path: merge_base
          persist-credentials: false

      - name: Remove Git metadata from exported workspaces
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -rf pull_request_head/.git protected_main/.git merge_base/.git

      - name: Upload read-only three-way workspaces
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pr759-current-three-way-${{ github.sha }}
          path: |
            pull_request_head/
            protected_main/
            merge_base/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
