name: Inkspan Hourly Review Repair

on:
  schedule:
    # Minute 47 avoids the other product-specific review-repair heartbeats.
    - cron: "47 * * * *"

concurrency:
  group: inkspan-hourly-review-repair
  # A later heartbeat must not cancel an in-flight editor-safety RCA.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-review-repair:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-review-fix-scheduler.yml
    with:
      target_repository: ContextualWisdomLab/inkspan
      base_branch: main
      max_prs: "50"
      max_dispatches: "1"
      retry_hours: "2"
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
