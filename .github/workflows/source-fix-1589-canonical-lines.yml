name: One-shot PR 1589 canonical line repair

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-canonical-lines.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply canonical coordinate validator without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/noema_review_gate.py")
          text = path.read_text(encoding="utf-8")

          marker = "\ndef _validate_observed_probe_class_evidence(\n"
          helper = '''
          def _canonical_changed_location(record: dict[str, Any], label: str) -> tuple[str, int, str]:
              """Return a canonical changed-side location without bool/int coercion."""
              path_value = record.get("path")
              line_value = record.get("line")
              side_value = record.get("side")
              if not isinstance(path_value, str) or not path_value.strip():
                  raise RuntimeError(f"{label} requires a canonical changed-side path")
              if type(line_value) is not int or line_value <= 0:
                  raise RuntimeError(f"{label} requires a canonical positive integer line")
              if side_value not in {"LEFT", "RIGHT"}:
                  raise RuntimeError(f"{label} requires canonical LEFT/RIGHT side")
              return (path_value, line_value, side_value)

          '''
          if text.count(marker) != 1:
              raise SystemExit("class-evidence helper marker changed unexpectedly")
          text = text.replace(marker, "\n" + helper + "def _validate_observed_probe_class_evidence(\n", 1)

          old = '''    expected_ref = {"path": location[0], "line": location[1], "side": location[2]}
              for field in required_fields:
                  source_ref = class_evidence.get(field)
                  if not isinstance(source_ref, dict) or set(source_ref) != {"path", "line", "side"}:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} requires a "
                          "source-bound changed-line reference"
                      )
                  if source_ref != expected_ref:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} must bind to "
                          "the probe location"
                      )
          '''
          new = '''    for field in required_fields:
                  source_ref = class_evidence.get(field)
                  if not isinstance(source_ref, dict) or set(source_ref) != {"path", "line", "side"}:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} requires a "
                          "source-bound changed-line reference"
                      )
                  source_location = _canonical_changed_location(
                      source_ref, f"Noema adversarial probe {index} class_evidence.{field}"
                  )
                  if source_location != location:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} must bind to "
                          "the probe location"
                      )
          '''
          if text.count(old) != 1:
              raise SystemExit("class-evidence comparison block changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''        location = (reviewed.get("path"), reviewed.get("line"), reviewed.get("side"))
                  if location not in locations:
                      raise RuntimeError(f"Noema reviewed line {index} is not an exact changed-side line")
          '''
          new = '''        location = _canonical_changed_location(reviewed, f"Noema reviewed line {index}")
                  if location not in locations:
                      raise RuntimeError(f"Noema reviewed line {index} is not an exact changed-side line")
          '''
          if text.count(old) != 1:
              raise SystemExit("reviewed-line location block changed unexpectedly")
          text = text.replace(old, new, 1)

          old = '''        location = (probe.get("path"), probe.get("line"), probe.get("side"))
                  if location not in locations:
                      raise RuntimeError(f"Noema adversarial probe {index} is not an exact changed-side line")
          '''
          new = '''        location = _canonical_changed_location(probe, f"Noema adversarial probe {index}")
                  if location not in locations:
                      raise RuntimeError(f"Noema adversarial probe {index} is not an exact changed-side line")
          '''
          if text.count(old) != 1:
              raise SystemExit("probe location block changed unexpectedly")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git add scripts/ci/noema_review_gate.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(noema): reject non-canonical line coordinates"
          git push origin "HEAD:${TARGET_BRANCH}"