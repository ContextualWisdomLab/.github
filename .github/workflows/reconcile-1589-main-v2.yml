name: One-shot PR 1589 exact-main reconciliation v2

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/reconcile-1589-main-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Execute reviewed reconciliation with robust insertion anchor
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
          TEMP_WORKFLOW: .github/workflows/reconcile-1589-main.yml
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path(".github/workflows/reconcile-1589-main.yml").read_text(encoding="utf-8")
          marker = "        run: |\n"
          if text.count(marker) != 1:
              raise SystemExit("reconciliation run block changed unexpectedly")
          script = textwrap.dedent(text.split(marker, 1)[1])
          old = '''marker = ''' + "'''" + '''    if decision == \"approve\" and confirmed:\n    raise RuntimeError(\"Noema approve cannot contain a confirmed adversarial probe\")\n''' + "'''" + '''
insertion = ''' + "'''" + '''    if len(probe_kinds) < required_probes:\n    raise RuntimeError(\n        f\"Noema {decision} requires at least {required_probes} distinct probe_kind values\"\n    )\n\n''' + "'''" + '''
if text.count(marker) != 1:
    raise SystemExit(\"Noema post-probe validator anchor changed unexpectedly\")
text = text.replace(marker, insertion + marker, 1)
'''
          new = '''marker = '    if decision == "approve" and confirmed:\\n'
insertion = ''' + "'''" + '''    if len(probe_kinds) < required_probes:\n    raise RuntimeError(\n        f\"Noema {decision} requires at least {required_probes} distinct probe_kind values\"\n    )\n\n''' + "'''" + '''
if text.count(marker) != 1:
    raise SystemExit(\"Noema post-probe validator anchor changed unexpectedly\")
text = text.replace(marker, insertion + marker, 1)
'''
          if old not in script:
              raise SystemExit("reviewed post-probe transform was not found")
          script = script.replace(old, new, 1)
          Path("/tmp/reconcile-1589.sh").write_text(script, encoding="utf-8")
          PY
          cd ..
          rm -rf source
          bash /tmp/reconcile-1589.sh