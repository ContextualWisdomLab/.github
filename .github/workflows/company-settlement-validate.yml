# Source-only fixed-pool candidate. Caller-context group admission remains separate.
name: Company settlement validate
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, Linux, X64, cwlab-ci-isolated]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install locked test dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Start isolated PostgreSQL without a TCP listener
        shell: bash
        run: |
          set -Eeuo pipefail
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          "$pg_bin/postgres" --version
          data_dir="$RUNNER_TEMP/settlement-verify-postgres"
          socket_dir="$RUNNER_TEMP/settlement-verify-socket"
          mkdir -m 700 "$data_dir" "$socket_dir"
          printf 'SETTLEMENT_VERIFY_PG_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
          printf 'SETTLEMENT_VERIFY_PG_DATA=%s\n' "$data_dir" >> "$GITHUB_ENV"
          "$pg_bin/initdb" -D "$data_dir" --no-locale --encoding=UTF8 \
            --auth-local=trust --auth-host=reject
          "$pg_bin/pg_ctl" -D "$data_dir" \
            -o "-F -h '' -k $socket_dir" -l "$RUNNER_TEMP/settlement-verify-postgres.log" -w start
          printf 'SETTLEMENT_VERIFY_TEST_DSN=host=%s dbname=postgres\n' "$socket_dir" >> "$GITHUB_ENV"
      - name: Verify exact-head PgCat and lock regressions
        env:
          SETTLEMENT_VERIFY_REQUIRE_POSTGRES: "1"
        run: >-
          python -m pytest -q tests/test_issue119_pgcat_endpoint_resolver.py
          tests/test_issue119_settlement_live_verify.py
          tests/test_issue119_settlement_replica_routing.py
          tests/test_issue119_settlement_review_regressions.py
          tests/test_multi_instance_runtime_contract.py
      - name: Stop isolated test database
        if: always()
        shell: bash
        run: |
          if test -f "${SETTLEMENT_VERIFY_PG_DATA:-}/postmaster.pid"; then
            "$SETTLEMENT_VERIFY_PG_BIN/pg_ctl" -D "$SETTLEMENT_VERIFY_PG_DATA" -m fast -w stop
          fi
