name: Temporary Noema Model Timeout Authority Repair

on:
  push:
    branches:
      - fix/noema-model-timeout-authority-20260902
    paths:
      - .github/workflows/_temp_noema_model_timeout_authority.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-noema-model-timeout-authority
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-slim
    outputs:
      patch_sha256: ${{ steps.seal.outputs.patch_sha256 }}
    steps:
      - name: Checkout exact repair head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/noema-model-timeout-authority-20260902
          remote_head="$(git rev-parse origin/fix/noema-model-timeout-authority-20260902)"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor 5935c8153722fe6b53bafd579b74f8f097303959 "$GITHUB_SHA"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install hash-locked repository test toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Prove model timeout regression is RED for the intended reason
        shell: bash
        run: |
          set -euo pipefail
          set +e
          red_output="$(PYTHONPATH=. python -m pytest -q tests/test_noema_model_timeout_policy.py 2>&1)"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          test "$red_status" -eq 1
          grep -Eq '1 failed' <<<"$red_output"
          grep -Fq 'Noema model execution must not be terminated by elapsed time' <<<"$red_output"

      - name: Materialize production, contract, and governance repair
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/ci/temp_noema_model_timeout_authority.py
          git diff --check

      - name: Verify focused and full repository GREEN
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_noema_model_timeout_policy.py \
            tests/test_noema_orchestrator_workflow_contract.py \
            tests/test_required_workflow_queue_contract.py
          PYTHONPATH=. python -m coverage run --branch -m pytest tests -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate -c pyproject.toml scripts/ci
          python -m compileall -q scripts tests
          git diff --check

      - name: Verify self-retired successor scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/ci/temp_noema_model_timeout_authority.py
          test ! -e .github/workflows/_temp_noema_model_timeout_authority.yml
          allowed='^(.github/workflows/noema-review.yml|tests/test_noema_orchestrator_workflow_contract.py|tests/test_noema_model_timeout_policy.py|CHANGELOG.md|ARCHITECTURE.md|docs/adr/0003-contextual-orchestrator-vendored-free-zdr.md|docs/doctoring/noema-model-timeout-authority-2026-09-02.md|docs/product-technical-gap-baseline.md|scripts/ci/temp_noema_model_timeout_authority.py|.github/workflows/_temp_noema_model_timeout_authority.yml)$'
          bad="$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$bad"

      - name: Seal verified successor patch
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary HEAD > successor.patch
          test -s successor.patch
          patch_sha256="$(sha256sum successor.patch | awk '{print $1}')"
          echo "patch_sha256=$patch_sha256" >>"$GITHUB_OUTPUT"

      - name: Upload sealed successor patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noema-timeout-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: successor.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout unchanged repair head without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download sealed patch without executing repository code
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: noema-timeout-authority-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Revalidate exact writer identity and commit verified patch
        env:
          EXPECTED_PATCH_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/noema-model-timeout-authority-20260902
          remote_head="$(git rev-parse origin/fix/noema-model-timeout-authority-20260902)"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor 5935c8153722fe6b53bafd579b74f8f097303959 "$GITHUB_SHA"
          actual_patch_sha256="$(sha256sum successor.patch | awk '{print $1}')"
          test "$actual_patch_sha256" = "$EXPECTED_PATCH_SHA256"
          git apply --index successor.patch
          test ! -e scripts/ci/temp_noema_model_timeout_authority.py
          test ! -e .github/workflows/_temp_noema_model_timeout_authority.yml
          git diff --cached --check
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git commit -m "fix(noema-review): restore null model timeout authority"

      - name: Publish verified fast-forward successor
        env:
          WORKFLOW_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/noema-model-timeout-authority-20260902
          remote_head="$(git rev-parse origin/fix/noema-model-timeout-authority-20260902)"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/ContextualWisdomLab/.github.git"
          git push origin HEAD:fix/noema-model-timeout-authority-20260902
