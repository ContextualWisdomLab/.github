name: Repair PR 759 LLVM toolchain
run-name: Repair PR 759 LLVM toolchain at ${{ github.sha }}

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/repair-pr759-llvm-toolchain.yml

permissions:
  contents: read

concurrency:
  group: repair-pr759-llvm-toolchain
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact trigger head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: false

      - name: Verify bounded repair lineage
        env:
          EXPECTED_PARENT: c727e2a659e57f6d632e11cb95dc400142a1d760
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed_paths < <(git diff --name-only "$EXPECTED_PARENT" "$GITHUB_SHA")
          test "${#changed_paths[@]}" -eq 1
          test "${changed_paths[0]}" = ".github/workflows/repair-pr759-llvm-toolchain.yml"

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked verification tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Preserve exact RED evidence
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          python -m pytest -q \
            tests/test_opencode_llvm_toolchain_contract.py::test_opencode_coverage_image_provisions_versioned_llvm_tools \
            >"${RUNNER_TEMP}/pr759-llvm-red.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/pr759-llvm-red.log"
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected the exact LLVM contract regression, observed exit ${status}."
            exit 1
          fi
          grep -F 'test_opencode_coverage_image_provisions_versioned_llvm_tools' \
            "${RUNNER_TEMP}/pr759-llvm-red.log"

      - name: Restore deterministic LLVM 19 coverage executables
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/opencode-review-dispatch.yml")
          source = workflow_path.read_text(encoding="utf-8")

          package_anchor = (
              "              r-cran-testthat \\\n"
              "              rustc \\\n"
          )
          package_replacement = (
              "              r-cran-testthat \\\n"
              "              llvm-19 \\\n"
              "              rustc \\\n"
          )
          if source.count(package_anchor) != 1:
              raise SystemExit(
                  "LLVM package anchor must occur exactly once before repair"
              )
          source = source.replace(package_anchor, package_replacement)

          executable_anchor = (
              "            && rm -rf /var/lib/apt/lists/*\n"
              "          RUN curl --proto '=https' --tlsv1.2 -fsSLo "
              "/tmp/node-linux-x64.tar.xz \\\n"
          )
          executable_replacement = (
              "            && rm -rf /var/lib/apt/lists/*\n"
              "          ENV LLVM_COV=/usr/bin/llvm-cov-19\n"
              "          ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19\n"
              "          RUN test -x \"$LLVM_COV\" && test -x \"$LLVM_PROFDATA\"\n"
              "          RUN curl --proto '=https' --tlsv1.2 -fsSLo "
              "/tmp/node-linux-x64.tar.xz \\\n"
          )
          if source.count(executable_anchor) != 1:
              raise SystemExit(
                  "LLVM executable-preflight anchor must occur exactly once before repair"
              )
          source = source.replace(executable_anchor, executable_replacement)
          workflow_path.write_text(source, encoding="utf-8")
          PY
          rm -f .github/workflows/repair-pr759-llvm-toolchain.yml
          git diff --check

      - name: Verify focused and complete quality gates
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q \
            tests/test_opencode_llvm_toolchain_contract.py
          python -m coverage erase
          python -m coverage run --branch -m pytest tests -q
          python -m coverage report --show-missing --fail-under=100
          python -m interrogate --fail-under=100 scripts/ci
          python -m compileall -q scripts tests
          bash -n scripts/ci/strix_quick_gate.sh
          git diff --check

      - name: Publish verified workflow-free repair
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
          PUSH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No verified repair generated" >&2; exit 1; }
          git commit -m "fix(opencode): restore deterministic LLVM coverage tools"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push --force-with-lease="refs/heads/${HEAD_BRANCH}:${EXPECTED_HEAD}" \
            origin "HEAD:refs/heads/${HEAD_BRANCH}"
