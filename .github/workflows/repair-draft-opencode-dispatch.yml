name: One-shot draft OpenCode dispatch repair

on:
  push:
    branches:
      - fix/required-review-fail-closed-without-verdict

permissions:
  contents: write

concurrency:
  group: one-shot-draft-opencode-dispatch-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair draft review dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/required-review-fail-closed-without-verdict
          fetch-depth: 0

      - name: Install test tooling
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'pytest>=8.0.0' \
            'pytest-cov>=7.1.0' \
            'coverage[toml]>=7.8.0' \
            'interrogate>=1.7.0'

      - name: Add failing draft-review contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_pr_review_merge_scheduler.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_inspect_pr_blocks_and_waits_for_policy_states(monkeypatch):
              assert inspect(make_pr(isDraft=True)).action == "skip"
          '''
          new = '''def test_draft_pr_review_path_never_mutates_branch_or_merge_state(monkeypatch):
              mutations = []
              dispatches = []
              for name in ("update_branch", "enable_auto_merge", "merge_pr", "disable_auto_merge"):
                  monkeypatch.setattr(
                      sched,
                      name,
                      lambda *args, _name=name, **kwargs: mutations.append(_name),
                  )
              monkeypatch.setattr(
                  sched,
                  "repository_dispatch_wait_reason",
                  lambda *args, **kwargs: "",
              )
              monkeypatch.setattr(
                  sched,
                  "dispatch_strix_evidence",
                  lambda repo, workflow, pr, dry_run: dispatches.append(
                      ("strix", pr["number"], dry_run)
                  )
                  or "dispatched",
              )
              monkeypatch.setattr(
                  sched,
                  "dispatch_opencode_review",
                  lambda repo, workflow, pr, dry_run: dispatches.append(
                      ("opencode", pr["number"], dry_run)
                  )
                  or "dispatched",
              )

              missing_strix = inspect(make_pr(isDraft=True), dry_run=False)
              assert missing_strix.action == "security_dispatch"
              assert missing_strix.reason == (
                  "draft PR; current head has no completed Strix evidence; same-head Strix dispatched"
              )

              completed_strix = inspect(
                  make_pr(
                      isDraft=True,
                      statusCheckRollup={"contexts": {"nodes": [strix_check()]}},
                  ),
                  dry_run=False,
              )
              assert completed_strix.action == "review_dispatch"
              assert completed_strix.reason == (
                  "draft PR; current head has completed Strix evidence; same-head OpenCode dispatched"
              )

              approved = inspect(
                  make_pr(
                      isDraft=True,
                      autoMergeRequest={"enabledAt": "now"},
                      reviews={"nodes": [opencode_review("APPROVED", "head")]},
                      statusCheckRollup={"contexts": {"nodes": [strix_check()]}},
                  ),
                  dry_run=False,
              )
              assert approved.action == "skip"
              assert approved.reason == "draft PR; current-head OpenCode approval recorded"

              changes_requested = inspect(
                  make_pr(
                      isDraft=True,
                      autoMergeRequest={"enabledAt": "now"},
                      reviews={"nodes": [opencode_review("CHANGES_REQUESTED", "head")]},
                  ),
                  dry_run=False,
              )
              assert changes_requested.action == "skip"
              assert changes_requested.reason == (
                  "draft PR; current-head OpenCode review requested changes"
              )

              assert dispatches == [("strix", 1, False), ("opencode", 1, False)]
              assert mutations == []


          def test_draft_pr_review_wait_states_are_read_only(monkeypatch):
              dispatches = []
              monkeypatch.setattr(
                  sched,
                  "dispatch_strix_evidence",
                  lambda *args, **kwargs: dispatches.append("strix") or "dispatched",
              )
              monkeypatch.setattr(
                  sched,
                  "dispatch_opencode_review",
                  lambda *args, **kwargs: dispatches.append("opencode") or "dispatched",
              )

              disabled = inspect(make_pr(isDraft=True), trigger_reviews=False)
              assert disabled.action == "skip"
              assert disabled.reason == "draft PR; review dispatch disabled"

              running = inspect(
                  make_pr(
                      isDraft=True,
                      statusCheckRollup={
                          "contexts": {"nodes": [opencode_check(status="IN_PROGRESS")]}
                      },
                  )
              )
              assert running.action == "wait"
              assert running.reason == "draft PR; OpenCode review is already in progress"

              limited = inspect(make_pr(isDraft=True), review_dispatch_allowed=False)
              assert limited.action == "wait"
              assert limited.reason == "draft PR; review dispatch limit reached"

              strix_running = inspect(
                  make_pr(
                      isDraft=True,
                      statusCheckRollup={
                          "contexts": {
                              "nodes": [strix_check(status="IN_PROGRESS", conclusion=None)]
                          }
                      },
                  )
              )
              assert strix_running.action == "wait"
              assert strix_running.reason == "draft PR; same-head Strix evidence is still running"
              assert dispatches == []


          def test_draft_pr_review_dispatch_failures_are_wait_states(monkeypatch):
              missing_reason = "central Strix dispatch workflow unavailable"
              monkeypatch.setattr(
                  sched,
                  "repository_dispatch_wait_reason",
                  lambda repo, workflow: missing_reason
                  if workflow == "Strix Security Scan"
                  else "",
              )
              missing = inspect(make_pr(isDraft=True))
              assert missing.action == "wait"
              assert missing.reason == (
                  "draft PR; current head has no completed Strix evidence; " + missing_reason
              )

              opencode_reason = "central OpenCode dispatch workflow unavailable"
              monkeypatch.setattr(
                  sched,
                  "repository_dispatch_wait_reason",
                  lambda repo, workflow: opencode_reason
                  if workflow == "OpenCode Review"
                  else "",
              )
              completed = make_pr(
                  isDraft=True,
                  statusCheckRollup={"contexts": {"nodes": [strix_check()]}},
              )
              unavailable = inspect(completed)
              assert unavailable.action == "wait"
              assert unavailable.reason == (
                  "draft PR; current head has completed Strix evidence; " + opencode_reason
              )

              monkeypatch.setattr(
                  sched,
                  "repository_dispatch_wait_reason",
                  lambda *args, **kwargs: "",
              )
              monkeypatch.setattr(
                  sched,
                  "dispatch_opencode_review",
                  lambda *args, **kwargs: "already_running",
              )
              already_running = inspect(completed)
              assert already_running.action == "wait"
              assert already_running.reason == (
                  "draft PR; current head has completed Strix evidence; "
                  "same-head OpenCode workflow run is already active"
              )


          def test_inspect_pr_blocks_and_waits_for_policy_states(monkeypatch):
              draft = inspect(make_pr(isDraft=True))
              assert draft.action == "security_dispatch"
              assert draft.reason == (
                  "draft PR; current head has no completed Strix evidence; same-head Strix dispatched"
              )
          '''
          if old not in text:
              raise SystemExit("draft test marker changed; refusing an unreviewed patch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prove the new contract is RED
        run: |
          set -euo pipefail
          set +e
          python -m pytest \
            tests/test_pr_review_merge_scheduler.py::test_draft_pr_review_path_never_mutates_branch_or_merge_state \
            >/tmp/draft-review-red.log 2>&1
          status=$?
          set -e
          cat /tmp/draft-review-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::The draft-review regression test unexpectedly passed before the implementation change."
            exit 1
          fi

      - name: Implement review-only dispatch for draft pull requests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scheduler_path = Path("scripts/ci/pr_review_merge_scheduler.py")
          scheduler = scheduler_path.read_text(encoding="utf-8")
          marker = "\ndef inspect_pr(\n"
          helper = '''
          def inspect_draft_pr_for_review(
              repo: str,
              pr: dict[str, Any],
              *,
              dry_run: bool,
              trigger_reviews: bool,
              review_dispatch_allowed: bool,
              workflow: str,
              security_workflow: str,
              stale_opencode_minutes: int,
          ) -> Decision:
              """Dispatch current-head review evidence without mutating a draft PR branch.

              Draft pull requests remain excluded from branch updates, auto-merge,
              direct merge, stale-review dismissal, and review-thread mutation. They
              still need early Strix and OpenCode feedback so authors can finish the
              implementation before marking the pull request ready for review.
              """
              number = pr["number"]
              if has_current_head_changes_requested(pr):
                  return Decision(
                      number,
                      "skip",
                      "draft PR; current-head OpenCode review requested changes",
                  )
              if has_current_head_approval(pr):
                  return Decision(
                      number,
                      "skip",
                      "draft PR; current-head OpenCode approval recorded",
                  )
              if not trigger_reviews:
                  return Decision(number, "skip", "draft PR; review dispatch disabled")

              opencode_state = opencode_progress_state(
                  pr,
                  stale_after_minutes=stale_opencode_minutes,
              )
              if opencode_state == "running":
                  return Decision(
                      number,
                      "wait",
                      "draft PR; OpenCode review is already in progress",
                  )
              if not review_dispatch_allowed:
                  return Decision(number, "wait", "draft PR; review dispatch limit reached")

              strix_state = strix_evidence_state(pr)
              if strix_state == "missing":
                  wait_reason = repository_dispatch_wait_reason(repo, security_workflow)
                  if wait_reason:
                      return Decision(
                          number,
                          "wait",
                          "draft PR; current head has no completed Strix evidence; "
                          f"{wait_reason}",
                      )
                  dispatch_strix_evidence(
                      repo,
                      security_workflow,
                      pr,
                      dry_run=dry_run,
                  )
                  return Decision(
                      number,
                      "security_dispatch",
                      "draft PR; current head has no completed Strix evidence; "
                      "same-head Strix dispatched",
                  )
              if strix_state == "running":
                  return Decision(
                      number,
                      "wait",
                      "draft PR; same-head Strix evidence is still running",
                  )

              wait_reason = repository_dispatch_wait_reason(repo, workflow)
              if wait_reason:
                  return Decision(
                      number,
                      "wait",
                      "draft PR; current head has completed Strix evidence; "
                      f"{wait_reason}",
                  )
              dispatch_result = dispatch_opencode_review(
                  repo,
                  workflow,
                  pr,
                  dry_run=dry_run,
              )
              if dispatch_result == "already_running":
                  return Decision(
                      number,
                      "wait",
                      "draft PR; current head has completed Strix evidence; "
                      "same-head OpenCode workflow run is already active",
                  )
              return Decision(
                  number,
                  "review_dispatch",
                  "draft PR; current head has completed Strix evidence; "
                  "same-head OpenCode dispatched",
              )


          '''
          if marker not in scheduler:
              raise SystemExit("inspect_pr marker changed; refusing an unreviewed patch")
          scheduler = scheduler.replace(marker, "\n" + helper + "def inspect_pr(\n", 1)

          old = '''    if pr.get("isDraft"):
                  return Decision(number, "skip", "draft PR")
              cancel_stale_pr_runs(repo, pr, dry_run=dry_run)
          '''
          new = '''    if pr.get("isDraft"):
                  return inspect_draft_pr_for_review(
                      repo,
                      pr,
                      dry_run=dry_run,
                      trigger_reviews=trigger_reviews,
                      review_dispatch_allowed=review_dispatch_allowed,
                      workflow=workflow,
                      security_workflow=security_workflow,
                      stale_opencode_minutes=stale_opencode_minutes,
                  )
              cancel_stale_pr_runs(repo, pr, dry_run=dry_run)
          '''
          if old not in scheduler:
              raise SystemExit("draft skip implementation changed; refusing an unreviewed patch")
          scheduler_path.write_text(scheduler.replace(old, new, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          changelog_marker = "### Fixed\n\n"
          changelog_entry = (
              "- Draft pull requests now receive same-head Strix and OpenCode review dispatches "
              "while remaining excluded from branch updates, auto-merge changes, direct merge, "
              "and review-state cleanup.\n"
          )
          if changelog_marker not in changelog:
              raise SystemExit("CHANGELOG Fixed marker changed; refusing an unreviewed patch")
          if changelog_entry not in changelog:
              changelog = changelog.replace(
                  changelog_marker,
                  changelog_marker + changelog_entry,
                  1,
              )
          changelog_path.write_text(changelog, encoding="utf-8")

          doc_path = Path("docs/doctoring/required-review-check-is-not-a-verdict.md")
          doc = doc_path.read_text(encoding="utf-8")
          doc_marker = "## Verification contract\n"
          doc_section = '''## Draft pull-request review contract

          Draft status is a merge-readiness signal, not a request to suppress early
          feedback. The central scheduler therefore dispatches same-head Strix first
          and then authenticated OpenCode review for draft pull requests. The draft
          path is deliberately review-only: it cannot update the head branch, enable
          or disable auto-merge, merge, dismiss reviews, or resolve review threads.
          Marking a pull request ready remains the explicit boundary for merge
          automation.

          '''
          if doc_marker not in doc:
              raise SystemExit("doctoring verification marker changed; refusing an unreviewed patch")
          if doc_section not in doc:
              doc = doc.replace(doc_marker, doc_section + doc_marker, 1)
          doc_path.write_text(doc, encoding="utf-8")
          PY

      - name: Verify focused and repository-wide quality gates
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_pr_review_merge_scheduler.py::test_draft_pr_review_path_never_mutates_branch_or_merge_state \
            tests/test_pr_review_merge_scheduler.py::test_draft_pr_review_wait_states_are_read_only \
            tests/test_pr_review_merge_scheduler.py::test_draft_pr_review_dispatch_failures_are_wait_states
          python -m coverage erase
          python -m coverage run -m pytest tests
          python -m coverage report --show-missing
          python -m interrogate -c pyproject.toml scripts/ci
          python -m compileall -q scripts tests

      - name: Remove one-shot workflow and publish verified repair
        run: |
          set -euo pipefail
          rm .github/workflows/repair-draft-opencode-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/pr_review_merge_scheduler.py \
            tests/test_pr_review_merge_scheduler.py \
            docs/doctoring/required-review-check-is-not-a-verdict.md \
            CHANGELOG.md \
            .github/workflows/repair-draft-opencode-dispatch.yml
          git diff --cached --check
          git commit -m "fix(review): dispatch OpenCode for draft pull requests"
          git push origin HEAD:fix/required-review-fail-closed-without-verdict
