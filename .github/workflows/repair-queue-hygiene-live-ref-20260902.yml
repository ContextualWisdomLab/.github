name: Repair queue hygiene live-ref race

on:
  push:
    branches:
      - fix/queue-hygiene-live-ref-race-20260902
    paths:
      - .github/workflows/repair-queue-hygiene-live-ref-20260902.yml

permissions:
  contents: read

concurrency:
  group: repair-queue-hygiene-live-ref-20260902
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Apply and verify live-ref repair
        shell: bash
        env:
          WRITER_BRANCH: fix/queue-hygiene-live-ref-race-20260902
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ContextualWisdomLab/.github"
          test "$GITHUB_ACTOR" = "seonghobae"
          test "$GITHUB_TRIGGERING_ACTOR" = "seonghobae"
          test "$GITHUB_REF_NAME" = "$WRITER_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          python3 scripts/ci/repair_queue_hygiene_live_ref_20260902.py
          rm .github/workflows/repair-queue-hygiene-live-ref-20260902.yml
          rm scripts/ci/repair_queue_hygiene_live_ref_20260902.py
          python3 -m pytest -q tests/test_queue_hygiene_live_ref_current_head.py
          git diff --check
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/pr-review-merge-scheduler.yml .github/workflows/repair-queue-hygiene-live-ref-20260902.yml CHANGELOG.md docs/doctoring/queue-hygiene-live-ref-race.md docs/product-technical-gap-baseline.md scripts/ci/repair_queue_hygiene_live_ref_20260902.py tests/test_queue_hygiene_live_ref_current_head.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Commit and push exact verified tree
        shell: bash
        env:
          WRITER_BRANCH: fix/queue-hygiene-live-ref-race-20260902
          EXPECTED_HEAD: ${{ github.sha }}
          WRITER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name contextualwisdomlab-automation
          git config user.email contextualwisdomlab-automation@users.noreply.github.com
          git commit -m "fix(scheduler): resolve live refs before cancelling runs"
          git remote set-url origin "https://x-access-token:${WRITER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${WRITER_BRANCH}"
