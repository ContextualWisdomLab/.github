# Central SBOM generation for every ContextualWisdomLab repo.
#
# This is a REQUIRED-style org workflow (mirrors security-scan.yml):
# least-privilege permissions, SHA-pinned actions. It complements the
# Security Scan by producing a Software Bill of Materials for every repo's
# dependencies on each push to a protected branch and each release.
#
# NOTE: this used to also run on every PR, but nothing gated on the PR-scoped
# artifact and `dependency-snapshot: true` (below) submits its snapshot to the
# repository dependency graph -- the only feeder of the graph that
# `sbom-inventory-scheduler.yml` (cron: 0 * * * *) reads org-wide. A PR-head
# snapshot briefly pollutes that graph with dependencies from unmerged
# branches, so this now runs only on `push`/`release`, which is also required
# so the hourly inventory keeps a feeder at all.
#
# What it does per repo:
#   - Generates BOTH a CycloneDX and an SPDX SBOM with anchore/syft (via the
#     anchore/sbom-action wrapper; Apache-2.0, permissive tooling only), scanning
#     the whole filesystem so every present ecosystem is covered
#     (npm / pyproject / uv / cargo / go / maven).
#   - Uploads each SBOM as a build artifact.
#   - Attaches both SBOMs to GitHub releases (on release: published).
#   - Submits the SPDX snapshot to the GitHub dependency submission API so the
#     components show up in the repo's dependency graph. That graph is the source
#     the central SBOM inventory aggregator reads back out org-wide.
#
# NOTE: contents: write is required for release-asset upload and for the
# dependency submission API.
name: SBOM Generation

on:
  push:
    branches: [main, master, develop]
  release:
    types: [published]

concurrency:
  group: >-
    sbom-generation-${{ github.repository }}-${{
    github.event_name == 'release' &&
    format('release-{0}', github.event.release.id) ||
    format('run-{0}', github.run_id) }}
  # GitHub's native queue serializes release writes by immutable release ID.
  # The queue is bounded at 100; later arrivals are rejected once it is full.
  # https://docs.github.com/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  queue: max

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    concurrency:
      group: >-
        sbom-generation-job-${{ github.repository }}-${{
        github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    permissions:
      # Write is needed for release-asset upload and dependency submission.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM and submit dependency snapshot
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx-json
          upload-artifact: true
          upload-release-assets: false
          # Feeds the repo dependency graph -> read back by the org aggregator.
          # Release runs do not race protected-branch snapshots for this correlator.
          dependency-snapshot: ${{ github.event_name == 'push' }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx-json
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false

      - name: Verify current release revision
        if: github.event_name == 'release'
        # A release may remain mutable. This checks its live release ID, tag,
        # and peeled tag commit immediately before publishing, but the GitHub
        # API does not make this check and the following upload atomic.
        # https://docs.github.com/rest/releases/releases#update-a-release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_ID: ${{ github.event.release.id }}
          EXPECTED_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          fail_release_revision() {
            echo "::error::Current release revision could not be verified."
            exit 1
          }

          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
            || fail_release_revision
          [[ "$EXPECTED_RELEASE_ID" =~ ^[0-9]+$ ]] || fail_release_revision
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail_release_revision
          git check-ref-format "refs/tags/${EXPECTED_RELEASE_TAG}" >/dev/null \
            2>&1 || fail_release_revision

          if ! release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" \
              2>/dev/null
          )"; then
            fail_release_revision
          fi
          actual_release_id="$(jq -er '.id | select(type == "number") | tostring' <<<"$release_json")" \
            || fail_release_revision
          actual_release_tag="$(jq -er '.tag_name | select(type == "string" and length > 0)' <<<"$release_json")" \
            || fail_release_revision
          release_immutable="$(jq -er '.immutable | select(type == "boolean") | tostring' <<<"$release_json")" \
            || fail_release_revision
          [[ "$actual_release_id" == "$EXPECTED_RELEASE_ID" ]] || fail_release_revision
          [[ "$actual_release_tag" == "$EXPECTED_RELEASE_TAG" ]] || fail_release_revision

          encoded_tag="$(jq -rn --arg tag "$EXPECTED_RELEASE_TAG" '$tag | @uri')" \
            || fail_release_revision
          # The commits endpoint resolves both lightweight and annotated tags
          # to their commit without duplicating Git tag-peeling logic here.
          # https://docs.github.com/rest/commits/commits#get-a-commit
          if ! tag_commit_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${encoded_tag}" \
              2>/dev/null
          )"; then
            fail_release_revision
          fi
          tag_commit_sha="$(jq -er '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<<"$tag_commit_json")" \
            || fail_release_revision
          [[ "$tag_commit_sha" == "$EXPECTED_RELEASE_SHA" ]] \
            || fail_release_revision
          printf 'RELEASE_REVISION_VERIFIED release_id=%s sha=%s immutable=%s\n' \
            "$EXPECTED_RELEASE_ID" "$EXPECTED_RELEASE_SHA" "$release_immutable"

      - name: Publish verified release SBOM assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          for sbom_file in sbom.spdx.json sbom.cyclonedx.json; do
            test ! -L "$sbom_file"
            test -f "$sbom_file"
            test -s "$sbom_file"
          done
          jq -e 'type == "object" and (.spdxVersion | type == "string" and startswith("SPDX-"))' \
            sbom.spdx.json >/dev/null
          jq -e 'type == "object" and .bomFormat == "CycloneDX"' \
            sbom.cyclonedx.json >/dev/null

          gh release upload \
            --clobber \
            --repo "$GITHUB_REPOSITORY" \
            -- "$EXPECTED_RELEASE_TAG" \
            "sbom.spdx.json" \
            "sbom.cyclonedx.json"
