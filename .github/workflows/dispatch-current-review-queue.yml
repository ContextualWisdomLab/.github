name: Dispatch current exact-head review queue

on:
  push:
    branches:
      - ops/review-dispatch-20260805
    paths:
      - .github/workflows/dispatch-current-review-queue.yml

permissions:
  contents: write

concurrency:
  group: dispatch-current-exact-head-review-queue
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/ops/review-dispatch-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch OpenCode and Noema exact-head reviews
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          dispatch() {
            local event_type="$1"
            local target_repository="$2"
            local pr_number="$3"
            local pr_head_sha="$4"
            local payload_file="${RUNNER_TEMP}/${event_type}-${pr_number}.json"
            jq -cn \
              --arg event_type "$event_type" \
              --arg target_repository "$target_repository" \
              --argjson pr_number "$pr_number" \
              --arg pr_head_sha "$pr_head_sha" \
              '{event_type:$event_type,client_payload:{target_repository:$target_repository,pr_number:$pr_number,pr_head_sha:$pr_head_sha}}' \
              >"$payload_file"
            curl --fail-with-body --silent --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/ContextualWisdomLab/.github/dispatches" \
              --data-binary "@${payload_file}"
          }

          review() {
            local repository="$1"
            local number="$2"
            local sha="$3"
            dispatch opencode-review "$repository" "$number" "$sha"
            dispatch noema-review "$repository" "$number" "$sha"
          }

          review ContextualWisdomLab/naruon 1244 cdf4ceaaa9136629b098c675e749c116b2c7258a
          review ContextualWisdomLab/naruon 1239 07b4bf267cf2f10bd4664652807ec981b7f180aa
          review ContextualWisdomLab/naruon 1211 35f9dd4e32038ad82d8fb9b484216e6a819ae59a
          review ContextualWisdomLab/naruon 1206 aa26b2266b180d1b094f78cb29655abc71d99ea0
          review ContextualWisdomLab/naruon 1203 cd1cfd8a42ffa18099aa412301851413a7c1f5e4
          review ContextualWisdomLab/naruon 1241 0dbf41f44e5a6ebf06428dfb9d3358836fc091a0
          review ContextualWisdomLab/naruon 1231 c10aecd86999a5374a89d23e6563382f8d1015a6
