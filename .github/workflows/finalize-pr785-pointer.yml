name: Finalize PR 785 by immutable pointer

on:
  push:
    branches: [fix/coverage-materialize-requirements-directory-locks]
    paths:
      - ".github/pr785-pointer.trigger"

permissions:
  contents: read

jobs:
  finalize:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Check out exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reconcile legacy test and remove transient files
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_materialize_base_python_requirements.py')
          source = path.read_text(encoding='utf-8')
          old = 'assert materializer._is_hash_pinned(b"--require-hashes\\ndemo==1\\n")'
          new = 'assert not materializer._is_hash_pinned(b"--require-hashes\\ndemo==1\\n")'
          if source.count(old) != 1:
              raise SystemExit(f'legacy hash-directive assertion count={source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f \
            .github/pr785-pointer.trigger \
            .github/workflows/finalize-pr785-pointer.yml
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Verify full materializer quality
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/pr785-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py
          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/pr785-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest -q tests/test_materialize_base_python_requirements.py tests/test_materialize_uv_export_hash_contract.py tests/test_requirements_directory_lock_materialization.py tests/test_trusted_uv_download_contract.py tests/test_trusted_uv_portability_and_streaming.py tests/test_uv_export_isolation_contract.py tests/test_uv_redirect_and_coverage_contract.py tests/test_uv_redirect_boundary.py tests/test_uv_workspace_fail_closed.py tests/test_trusted_uv_materializer_quality_workflow_contract.py
          python -m coverage report --fail-under=100
          unset COVERAGE_RCFILE
          python -m pytest -q tests
          python -m interrogate --fail-under=100 scripts/ci/materialize_base_python_requirements.py
          git diff --check

      - name: Create immutable workflow-free commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr785-final.txt"
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          repo='ContextualWisdomLab/.github'
          parent=os.environ['EXPECTED_HEAD']
          token=os.environ['API_TOKEN']
          root=f'https://api.github.com/repos/{repo}'
          expected={'.github/pr785-pointer.trigger','.github/workflows/finalize-pr785-pointer.yml','tests/test_materialize_base_python_requirements.py'}
          def request(method, endpoint, payload=None):
              req=urllib.request.Request(root+endpoint,data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'cwl-pr785-finalizer'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.load(response)
          raw=subprocess.check_output(['git','diff','--name-status','-z','HEAD']).decode().split('\0')
          changes=[]; i=0
          while i < len(raw)-1:
              changes.append((raw[i],raw[i+1])); i += 2
          actual={p for _,p in changes}
          if actual != expected:
              raise SystemExit(f'path mismatch missing={sorted(expected-actual)} extra={sorted(actual-expected)}')
          parent_obj=request('GET',f'/git/commits/{parent}')
          entries=[]
          for status,path in changes:
              if status == 'D':
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
              else:
                  blob=request('POST','/git/blobs',{'content':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'})
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('POST','/git/trees',{'base_tree':parent_obj['tree']['sha'],'tree':entries})
          commit=request('POST','/git/commits',{'message':'test(coverage): reject unpinned global-hash requirements','tree':tree['sha'],'parents':[parent]})
          print('PR785_FINAL_PARENT_SHA='+parent)
          print('PR785_FINAL_COMMIT_SHA='+commit['sha'])
          PY

      - name: Publish final pointer
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          commit_sha="$(sed -n 's/^PR785_FINAL_COMMIT_SHA=//p' "${RUNNER_TEMP}/pr785-final.txt")"
          test "${#commit_sha}" -eq 40
          gh api --method POST repos/ContextualWisdomLab/.github/issues/785/comments -f "body=PR785_FINAL_PARENT_SHA=${EXPECTED_HEAD}%0APR785_FINAL_COMMIT_SHA=${commit_sha}"
