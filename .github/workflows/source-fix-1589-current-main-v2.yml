name: One-shot PR 1589 current-main validation v2

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-current-main-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Execute current-main validation with robust formatter transform
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
          TEMP_WORKFLOW: .github/workflows/source-fix-1589-current-main-v2.yml
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/source-fix-1589-current-main.yml").read_text(encoding="utf-8")
          marker = "        run: |\n"
          if workflow.count(marker) != 1:
              raise SystemExit("source validation run block changed")
          script = textwrap.dedent(workflow.split(marker, 1)[1])
          start = script.index("old = '''                f\"- `{probe.get('path')}:{probe.get('line')} ({probe.get('side')})` \"")
          end_marker = 'path.write_text(text.replace(old, new, 1), encoding="utf-8")\n'
          end = script.index(end_marker, start) + len(end_marker)
          replacement = '''needle = "f\\\"{probe.get('outcome')}: {str(probe.get('hypothesis') or '').strip()} — \\""
          if text.count(needle) != 1:
              raise SystemExit("evidence formatter outcome line changed")
          text = text.replace(
              needle,
              "f\\\"[{probe.get('probe_kind')}] {probe.get('outcome')}: {str(probe.get('hypothesis') or '').strip()} — \\"",
              1,
          )
          path.write_text(text, encoding="utf-8")
          '''
          script = script[:start] + replacement + script[end:]
          script = script.replace(
              'rm "$TEMP_WORKFLOW"\n',
              'rm "$TEMP_WORKFLOW" .github/workflows/source-fix-1589-current-main.yml\n',
              1,
          )
          Path("/tmp/validate-current-main.sh").write_text(script, encoding="utf-8")
          PY
          cd ..
          rm -rf source
          bash /tmp/validate-current-main.sh