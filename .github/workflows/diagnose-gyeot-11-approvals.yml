name: Diagnose Gyeot PR 11 approvals

on:
  push:
    branches:
      - ops/diagnose-gyeot-11

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  diagnose:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exchange OpenCode app token
        id: app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] ||
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC request environment is unavailable."
            exit 1
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac
          oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"
          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          test -n "$oidc_token"

          token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"
          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          test -n "$app_token"
          echo "::add-mask::$app_token"
          echo "token=$app_token" >>"$GITHUB_OUTPUT"

      - name: Report bounded current-head approval metadata
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET_REPOSITORY: ContextualWisdomLab/gyeot
          PR_NUMBER: "11"
          EXPECTED_HEAD_SHA: 54129babea5a5bc8f36317ec5fbb76dd962115b7
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_head="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          test "$live_head" = "$EXPECTED_HEAD_SHA"

          rest_mergeable_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"
          auto_merge_actor="$(jq -r '.auto_merge.enabled_by.login // "none"' <<<"$pr_json")"
          printf '::notice::pr_state head=%s mergeable_state=%s auto_merge_actor=%s\n' \
            "$live_head" "$rest_mergeable_state" "$auto_merge_actor"

          # shellcheck disable=SC2016
          graph_json="$(
            gh api graphql \
              -f owner=ContextualWisdomLab \
              -f name=gyeot \
              -F number="$PR_NUMBER" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  viewer { login }
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      reviewDecision
                      mergeable
                      mergeStateStatus
                      autoMergeRequest {
                        enabledAt
                        enabledBy { login }
                      }
                    }
                  }
                }
              '
          )"
          token_actor="$(jq -r '.data.viewer.login // "unknown"' <<<"$graph_json")"
          review_decision="$(
            jq -r '.data.repository.pullRequest.reviewDecision // "none"' <<<"$graph_json"
          )"
          mergeable="$(jq -r '.data.repository.pullRequest.mergeable // "unknown"' <<<"$graph_json")"
          merge_state="$(
            jq -r '.data.repository.pullRequest.mergeStateStatus // "unknown"' <<<"$graph_json"
          )"
          printf '::notice::graphql_state token_actor=%s review_decision=%s mergeable=%s merge_state=%s\n' \
            "$token_actor" "$review_decision" "$mergeable" "$merge_state"

          reviews_json="$(gh api --paginate "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          current_review_count="$(
            jq -s --arg head "$EXPECTED_HEAD_SHA" '
              add
              | [.[] | select(.commit_id == $head)]
              | length
            ' <<<"$reviews_json"
          )"
          current_approval_count="$(
            jq -s --arg head "$EXPECTED_HEAD_SHA" '
              add
              | [.[] | select(.commit_id == $head and .state == "APPROVED")]
              | length
            ' <<<"$reviews_json"
          )"
          printf '::notice::current_head_review_counts total=%s approvals=%s\n' \
            "$current_review_count" "$current_approval_count"

          while IFS=$'\t' read -r author state commit_id submitted_at; do
            test "$commit_id" = "$EXPECTED_HEAD_SHA"
            [[ "$author" =~ ^[A-Za-z0-9_.-]+(\[bot\])?$ ]]
            [[ "$state" =~ ^[A-Z_]+$ ]]
            [[ "$submitted_at" =~ ^[0-9TZ:.-]+$ ]]
            printf '::notice::current_head_review author=%s state=%s commit=%s submitted_at=%s\n' \
              "$author" "$state" "$commit_id" "$submitted_at"
          done < <(
            jq -rs --arg head "$EXPECTED_HEAD_SHA" '
              add
              | .[]
              | select(.commit_id == $head)
              | [.user.login, .state, .commit_id, .submitted_at]
              | @tsv
            ' <<<"$reviews_json"
          )

          commit_json="$(gh api "repos/${TARGET_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}")"
          commit_author="$(jq -r '.author.login // "none"' <<<"$commit_json")"
          commit_committer="$(jq -r '.committer.login // "none"' <<<"$commit_json")"
          printf '::notice::head_commit author=%s committer=%s\n' \
            "$commit_author" "$commit_committer"

      - name: Merge exact-head central pipeline fix
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SCHEDULER_ACTIONS_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ContextualWisdomLab/.github
          PR_NUMBER: "676"
          EXPECTED_BASE_REF: main
          EXPECTED_BASE_SHA: 32973e9c1364169253c2f82ca526f930df3de1d3
          EXPECTED_HEAD_REF: fix/org-sweep-timeout
          EXPECTED_HEAD_SHA: 7b6c41c1aa4d2c03f6ca5c553b5fe30e6336b403
          EXPECTED_MERGE_SHA: d337ad6a3b291f433da1c6b8b67804aa7f835d98
          ACTIVE_REVIEW_RUN_ID: "30548954941"
          EXPECTED_REVIEW_RUN_NAME: OpenCode Review Dispatch ContextualWisdomLab/.github#676@7b6c41c1aa4d2c03f6ca5c553b5fe30e6336b403
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state // empty' <<<"$pr_json")" = open
          test "$(jq -r '.base.ref // empty' <<<"$pr_json")" = "$EXPECTED_BASE_REF"
          test "$(jq -r '.base.sha // empty' <<<"$pr_json")" = "$EXPECTED_BASE_SHA"
          test "$(jq -r '.head.ref // empty' <<<"$pr_json")" = "$EXPECTED_HEAD_REF"
          test "$(jq -r '.head.sha // empty' <<<"$pr_json")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")" = "$EXPECTED_MERGE_SHA"
          test "$(jq -r '.mergeable // false' <<<"$pr_json")" = true
          test "$(jq -r '.mergeable_state // empty' <<<"$pr_json")" = clean

          preview_json="$(gh api "repos/${TARGET_REPOSITORY}/git/commits/${EXPECTED_MERGE_SHA}")"
          preview_tree="$(jq -r '.tree.sha // empty' <<<"$preview_json")"
          preview_parents="$(jq -r '[.parents[].sha] | join(" ")' <<<"$preview_json")"
          test "$preview_parents" = "$EXPECTED_BASE_SHA $EXPECTED_HEAD_SHA"
          test -n "$preview_tree"

          check_runs_json="$(
            GH_TOKEN="$SCHEDULER_ACTIONS_TOKEN" \
              gh api "repos/${TARGET_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/check-runs?per_page=100"
          )"
          test "$(jq -r '.total_count // 0' <<<"$check_runs_json")" -gt 0
          blocking_check_count="$(
            jq '
              [
                .check_runs[]
                | select(
                    .status != "completed"
                    or ((.conclusion // "") as $conclusion
                      | ["success", "neutral", "skipped"]
                      | index($conclusion)
                      | not)
                  )
              ]
              | length
            ' <<<"$check_runs_json"
          )"
          test "$blocking_check_count" -eq 0

          review_run_json="$(
            GH_TOKEN="$SCHEDULER_ACTIONS_TOKEN" \
              gh api "repos/${TARGET_REPOSITORY}/actions/runs/${ACTIVE_REVIEW_RUN_ID}"
          )"
          test "$(jq -r '.event // empty' <<<"$review_run_json")" = repository_dispatch
          test "$(jq -r '.name // empty' <<<"$review_run_json")" = "$EXPECTED_REVIEW_RUN_NAME"
          if [ "$(jq -r '.status // empty' <<<"$review_run_json")" != completed ]; then
            GH_TOKEN="$SCHEDULER_ACTIONS_TOKEN" \
              gh api -X POST \
                "repos/${TARGET_REPOSITORY}/actions/runs/${ACTIVE_REVIEW_RUN_ID}/force-cancel"
            printf '::notice::Force-cancelled exact current-head review run %s before pipeline-defect merge.\n' \
              "$ACTIVE_REVIEW_RUN_ID"
          fi

          response_file="$(mktemp)"
          http_code="$(
            curl -sS \
              -o "$response_file" \
              -w '%{http_code}' \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              --data "$(jq -cn --arg sha "$EXPECTED_HEAD_SHA" '{sha: $sha, merge_method: "merge"}')"
          )"
          if [ "$http_code" != 200 ]; then
            message="$(jq -r '.message // "GitHub rejected the exact-head merge request."' "$response_file")"
            message="${message//$'\r'/ }"
            message="${message//$'\n'/ }"
            message="${message//%/percent}"
            printf '::error::Central PR #%s exact-head merge rejected with HTTP %s: %s\n' \
              "$PR_NUMBER" "$http_code" "$message"
            exit 1
          fi

          merged_sha="$(jq -r '.sha // empty' "$response_file")"
          test "$(jq -r '.merged // false' "$response_file")" = true
          test -n "$merged_sha"
          merged_json="$(gh api "repos/${TARGET_REPOSITORY}/git/commits/${merged_sha}")"
          test "$(jq -r '[.parents[].sha] | join(" ")' <<<"$merged_json")" = \
            "$EXPECTED_BASE_SHA $EXPECTED_HEAD_SHA"
          test "$(jq -r '.tree.sha // empty' <<<"$merged_json")" = "$preview_tree"
          printf '::notice::Merged central PR #%s at structurally verified SHA %s.\n' \
            "$PR_NUMBER" "$merged_sha"
