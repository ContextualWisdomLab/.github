name: One-shot repair LineageWeave stack scheduler

on:
  push:
    branches:
      - feat/lineageweave-hourly-nvidia-nim-review-repair
    paths:
      - .github/workflows/one-shot-repair-lineageweave-stack.yml

permissions:
  contents: write

concurrency:
  group: one-shot-repair-lineageweave-stack
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify branch and parent
        env:
          EXPECTED_BRANCH: feat/lineageweave-hourly-nvidia-nim-review-repair
          EXPECTED_PARENT: a633d2af97adf148f1df9f31812d1143bbaa583d
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
      - name: Apply ordered-stack RED to GREEN repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          scheduler = ".github/workflows/pr-review-fix-scheduler.yml"
          replace_once(
              scheduler,
              '''      base_branch:
                description: Base branch to scan; defaults to the caller repository default branch
                required: false
                default: ""
                type: string
              canonical_ref:''',
              '''      base_branch:
                description: Base branch to scan; defaults to the caller repository default branch
                required: false
                default: ""
                type: string
              pull_request_numbers:
                description: Optional comma-separated PR numbers inspected in the supplied dependency order
                required: false
                default: ""
                type: string
              canonical_ref:''',
          )
          expression = "$" + "{{ github.event.client_payload.pull_request_numbers || inputs.pull_request_numbers || '' }}"
          replace_once(
              scheduler,
              '      DEFAULT_BRANCH: ${{ github.event.client_payload.base_branch || inputs.base_branch || vars.PR_REVIEW_FIX_BASE_BRANCH || github.event.repository.default_branch }}\n      DRY_RUN:',
              '      DEFAULT_BRANCH: ${{ github.event.client_payload.base_branch || inputs.base_branch || vars.PR_REVIEW_FIX_BASE_BRANCH || github.event.repository.default_branch }}\n'
              f'      PULL_REQUEST_NUMBERS: {expression}\n'
              '      DRY_RUN:',
          )
          replace_once(
              scheduler,
              '      - name: Self-test fix scheduler contract\n        run: python3 scripts/ci/pr_review_fix_scheduler.py --self-test',
              '      - name: Self-test fix scheduler contracts\n        run: |\n          python3 scripts/ci/pr_review_fix_scheduler.py --self-test\n          python3 scripts/ci/pr_review_fix_stack_scheduler.py --self-test',
          )
          replace_once(
              scheduler,
              '''          if [ "$RESOLVE_UNREVIEWED_CONFLICTS" = "true" ]; then
                    args+=(--resolve-unreviewed-conflicts)
                  fi
                  if [ "$DRY_RUN" = "true" ]; then
                    args+=(--dry-run)
                  fi
                  python3 scripts/ci/pr_review_fix_scheduler.py "${args[@]}"''',
              '''          scheduler_script="scripts/ci/pr_review_fix_scheduler.py"
                  if [ -n "$PULL_REQUEST_NUMBERS" ]; then
                    scheduler_script="scripts/ci/pr_review_fix_stack_scheduler.py"
                    args+=(--pull-request-numbers "$PULL_REQUEST_NUMBERS")
                  fi
                  if [ "$RESOLVE_UNREVIEWED_CONFLICTS" = "true" ]; then
                    args+=(--resolve-unreviewed-conflicts)
                  fi
                  if [ "$DRY_RUN" = "true" ]; then
                    args+=(--dry-run)
                  fi
                  python3 "$scheduler_script" "${args[@]}"''',
          )

          Path("scripts/ci/pr_review_fix_stack_scheduler.py").write_text(r'''#!/usr/bin/env python3
          """Dispatch at most one repair across an explicitly ordered pull-request stack."""

          from __future__ import annotations

          import argparse
          import json
          import os
          import re
          from typing import Any

          try:
              from pr_review_fix_scheduler import (
                  DEFAULT_AUTOFIX_REPOSITORY,
                  DEFAULT_AUTOFIX_WORKFLOW,
                  REPO_RE,
                  fetch_pr,
                  inspect_pr,
              )
          except ModuleNotFoundError:
              from scripts.ci.pr_review_fix_scheduler import (
                  DEFAULT_AUTOFIX_REPOSITORY,
                  DEFAULT_AUTOFIX_WORKFLOW,
                  REPO_RE,
                  fetch_pr,
                  inspect_pr,
              )

          BRANCH_RE = re.compile(r"^(?!-)[A-Za-z0-9._/-]+$")
          SHA_RE = re.compile(r"^[0-9a-fA-F]{40}$")
          NUMBER_RE = re.compile(r"^[1-9][0-9]*$")
          NO_REPAIR_REASON = (
              "no current-head autofixable review, failed-check RCA, or approved merge conflict"
          )


          def parse_pull_request_numbers(raw: str, *, maximum: int) -> tuple[int, ...]:
              """Return unique positive PR numbers while preserving caller order."""

              if maximum < 1:
                  raise ValueError("maximum must be positive")
              tokens = tuple(part.strip() for part in raw.split(",") if part.strip())
              if not tokens:
                  raise ValueError("at least one pull request number is required")
              numbers: list[int] = []
              seen: set[int] = set()
              for token in tokens:
                  if not NUMBER_RE.fullmatch(token):
                      raise ValueError(f"invalid pull request number: {token!r}")
                  number = int(token)
                  if number in seen:
                      raise ValueError(f"duplicate pull request number: {number}")
                  seen.add(number)
                  numbers.append(number)
              if len(numbers) > maximum:
                  raise ValueError(
                      f"pull request stack has {len(numbers)} entries; maximum is {maximum}"
                  )
              return tuple(numbers)


          def _single_pull_request(repo: str, number: int) -> dict[str, Any]:
              """Fetch exactly one live pull request or fail closed."""

              records = fetch_pr(repo, number)
              if len(records) != 1:
                  raise RuntimeError(
                      f"expected one live pull request for #{number}; received {len(records)}"
                  )
              return records[0]


          def _validate_stack_edge(
              pr: dict[str, Any],
              *,
              expected_base_name: str,
              expected_base_oid: str | None,
          ) -> None:
              """Require the current child base to equal the declared parent branch and head."""

              actual_name = str(pr.get("baseRefName") or "")
              actual_oid = str(pr.get("baseRefOid") or "")
              if actual_name != expected_base_name:
                  raise RuntimeError(
                      f"PR #{pr.get('number')} base branch is {actual_name!r}; "
                      f"expected {expected_base_name!r}"
                  )
              if expected_base_oid is not None and actual_oid.lower() != expected_base_oid.lower():
                  raise RuntimeError(
                      f"PR #{pr.get('number')} base SHA is {actual_oid or '<missing>'}; "
                      f"expected parent head {expected_base_oid}"
                  )


          def process_stack(args: argparse.Namespace) -> int:
              """Inspect the stack in order and stop after one dispatch or blocker."""

              previous: dict[str, Any] | None = None
              inspected = 0
              dispatched = 0
              failed = False
              decisions: list[dict[str, Any]] = []
              for number in args.pull_request_numbers:
                  if dispatched:
                      break
                  try:
                      pr = _single_pull_request(args.repo, number)
                      expected_name = (
                          args.base_branch
                          if previous is None
                          else str(previous.get("headRefName") or "")
                      )
                      expected_oid = (
                          None
                          if previous is None
                          else str(previous.get("headRefOid") or "")
                      )
                      _validate_stack_edge(
                          pr,
                          expected_base_name=expected_name,
                          expected_base_oid=expected_oid,
                      )
                      local_args = argparse.Namespace(**vars(args))
                      local_args.base_branch = expected_name
                      action, reasons = inspect_pr(args.repo, pr, local_args)
                  except (RuntimeError, ValueError) as exc:
                      action, reasons = "error", (str(exc),)
                  inspected += 1
                  decisions.append(
                      {"pr": number, "action": action, "reasons": list(reasons)}
                  )
                  print(f"PR #{number}: {action}: {'; '.join(reasons)}")
                  if action == "dispatch":
                      dispatched = 1
                      break
                  if action == "error":
                      failed = True
                      break
                  if action == "wait":
                      break
                  if action != "skip" or tuple(reasons) != (NO_REPAIR_REASON,):
                      break
                  previous = pr
              print(
                  json.dumps(
                      {
                          "inspected": inspected,
                          "autofix_dispatches": dispatched,
                          "stack_prs": list(args.pull_request_numbers),
                          "decisions": decisions,
                      },
                      sort_keys=True,
                  )
              )
              return 1 if failed else 0


          def self_test() -> int:
              """Exercise parser invariants without network or repository mutation."""

              assert parse_pull_request_numbers("258,260,261", maximum=3) == (
                  258,
                  260,
                  261,
              )
              try:
                  parse_pull_request_numbers("258,258", maximum=3)
              except ValueError:
                  pass
              else:  # pragma: no cover - defensive contract
                  raise AssertionError("duplicate PR numbers must fail")
              print("stack self-test passed")
              return 0


          def parse_args(argv: list[str]) -> argparse.Namespace:
              """Parse the ordered-stack scheduler CLI contract."""

              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--repo", default=os.environ.get("GITHUB_REPOSITORY", ""))
              parser.add_argument("--base-branch", default=os.environ.get("DEFAULT_BRANCH", ""))
              parser.add_argument(
                  "--pull-request-numbers",
                  default=os.environ.get("PULL_REQUEST_NUMBERS", ""),
              )
              parser.add_argument("--max-prs", type=int, default=50)
              parser.add_argument("--max-dispatches", type=int, default=1)
              parser.add_argument("--retry-hours", type=int, default=24)
              parser.add_argument("--resolve-unreviewed-conflicts", action="store_true")
              parser.add_argument("--autofix-workflow", default=DEFAULT_AUTOFIX_WORKFLOW)
              parser.add_argument("--autofix-repository", default=DEFAULT_AUTOFIX_REPOSITORY)
              parser.add_argument("--dry-run", action="store_true")
              parser.add_argument("--self-test", action="store_true")
              args = parser.parse_args(argv)
              if args.self_test:
                  return args
              if not REPO_RE.fullmatch(args.repo):
                  parser.error("--repo must be in OWNER/NAME form")
              if not BRANCH_RE.fullmatch(args.base_branch):
                  parser.error("--base-branch is required and must be a safe branch name")
              if args.max_prs < 1:
                  parser.error("--max-prs must be positive")
              if args.max_dispatches != 1:
                  parser.error("ordered stack scheduling requires --max-dispatches 1")
              if args.retry_hours < 1:
                  parser.error("--retry-hours must be positive")
              try:
                  args.pull_request_numbers = parse_pull_request_numbers(
                      args.pull_request_numbers,
                      maximum=args.max_prs,
                  )
              except ValueError as exc:
                  parser.error(str(exc))
              return args


          def main(argv: list[str] | None = None) -> int:
              """Run the self-test or process one ordered stack."""

              args = parse_args(list(argv or []))
              if args.self_test:
                  return self_test()
              return process_stack(args)


          if __name__ == "__main__":  # pragma: no cover
              raise SystemExit(main())
          ''').replace("          ", ""), encoding="utf-8")

          Path("tests/test_pr_review_fix_stack_scheduler.py").write_text(r'''"""Tests for exact ordered-stack review repair selection."""

          from __future__ import annotations

          import argparse
          import json

          import pytest

          from scripts.ci import pr_review_fix_stack_scheduler as stack


          def make_pr(
              number: int,
              *,
              base_name: str,
              base_oid: str,
              head_name: str,
              head_oid: str,
          ) -> dict:
              """Return one minimal scheduler-shaped pull request."""

              return {
                  "number": number,
                  "baseRefName": base_name,
                  "baseRefOid": base_oid,
                  "headRefName": head_name,
                  "headRefOid": head_oid,
              }


          def arguments(numbers: tuple[int, ...]) -> argparse.Namespace:
              """Return the runtime arguments consumed by the stack driver."""

              return argparse.Namespace(
                  repo="ContextualWisdomLab/LineageWeave",
                  base_branch="main",
                  pull_request_numbers=numbers,
                  max_prs=6,
                  max_dispatches=1,
                  retry_hours=2,
                  resolve_unreviewed_conflicts=True,
                  autofix_workflow="pr-review-autofix.yml",
                  autofix_repository="ContextualWisdomLab/.github",
                  dry_run=False,
              )


          def test_parse_pull_request_numbers_preserves_order_and_rejects_ambiguity() -> None:
              """The explicit queue is positive, unique, bounded, and ordered."""

              assert stack.parse_pull_request_numbers("258, 260,261", maximum=3) == (
                  258,
                  260,
                  261,
              )
              for raw, maximum in (("", 3), ("0", 3), ("x", 3), ("258,258", 3), ("1,2", 1)):
                  with pytest.raises(ValueError):
                      stack.parse_pull_request_numbers(raw, maximum=maximum)
              with pytest.raises(ValueError):
                  stack.parse_pull_request_numbers("1", maximum=0)


          def test_stack_dispatches_once_in_declared_dependency_order(
              monkeypatch,
              capsys,
          ) -> None:
              """A clean parent advances to the first actionable child and then stops."""

              root = make_pr(
                  258,
                  base_name="main",
                  base_oid="0" * 40,
                  head_name="feat/root",
                  head_oid="1" * 40,
              )
              child = make_pr(
                  260,
                  base_name="feat/root",
                  base_oid="1" * 40,
                  head_name="feat/child",
                  head_oid="2" * 40,
              )
              grandchild = make_pr(
                  261,
                  base_name="feat/child",
                  base_oid="2" * 40,
                  head_name="feat/grandchild",
                  head_oid="3" * 40,
              )
              records = {258: root, 260: child, 261: grandchild}
              fetched: list[int] = []
              inspected: list[tuple[int, str]] = []

              def fake_fetch(repo: str, number: int) -> list[dict]:
                  assert repo == "ContextualWisdomLab/LineageWeave"
                  fetched.append(number)
                  return [records[number]]

              def fake_inspect(repo: str, pr: dict, args: argparse.Namespace):
                  assert repo == "ContextualWisdomLab/LineageWeave"
                  inspected.append((pr["number"], args.base_branch))
                  if pr["number"] == 258:
                      return "skip", (stack.NO_REPAIR_REASON,)
                  return "dispatch", ("current-head OpenCode requested changes",)

              monkeypatch.setattr(stack, "fetch_pr", fake_fetch)
              monkeypatch.setattr(stack, "inspect_pr", fake_inspect)

              assert stack.process_stack(arguments((258, 260, 261))) == 0
              assert fetched == [258, 260]
              assert inspected == [(258, "main"), (260, "feat/root")]
              payload = json.loads(capsys.readouterr().out.strip().splitlines()[-1])
              assert payload["autofix_dispatches"] == 1
              assert [decision["pr"] for decision in payload["decisions"]] == [258, 260]


          def test_stack_fails_closed_when_child_is_not_on_exact_parent_head(
              monkeypatch,
              capsys,
          ) -> None:
              """A stale descendant cannot be repaired using ancestor evidence."""

              root = make_pr(
                  258,
                  base_name="main",
                  base_oid="0" * 40,
                  head_name="feat/root",
                  head_oid="1" * 40,
              )
              stale_child = make_pr(
                  260,
                  base_name="feat/root",
                  base_oid="9" * 40,
                  head_name="feat/child",
                  head_oid="2" * 40,
              )
              records = {258: root, 260: stale_child}
              inspected: list[int] = []
              monkeypatch.setattr(stack, "fetch_pr", lambda repo, number: [records[number]])

              def fake_inspect(repo: str, pr: dict, args: argparse.Namespace):
                  inspected.append(pr["number"])
                  return "skip", (stack.NO_REPAIR_REASON,)

              monkeypatch.setattr(stack, "inspect_pr", fake_inspect)

              assert stack.process_stack(arguments((258, 260))) == 1
              assert inspected == [258]
              payload = json.loads(capsys.readouterr().out.strip().splitlines()[-1])
              assert payload["decisions"][-1]["action"] == "error"
              assert "expected parent head" in payload["decisions"][-1]["reasons"][0]


          def test_stack_stops_on_wait_and_nonrepair_skip(monkeypatch) -> None:
              """An in-flight or structurally blocked parent prevents child mutation."""

              pr = make_pr(
                  258,
                  base_name="main",
                  base_oid="0" * 40,
                  head_name="feat/root",
                  head_oid="1" * 40,
              )
              monkeypatch.setattr(stack, "fetch_pr", lambda repo, number: [pr])
              monkeypatch.setattr(
                  stack,
                  "inspect_pr",
                  lambda repo, item, args: ("wait", ("recent autofix marker exists",)),
              )
              assert stack.process_stack(arguments((258, 260))) == 0

              monkeypatch.setattr(
                  stack,
                  "inspect_pr",
                  lambda repo, item, args: ("skip", ("draft PR",)),
              )
              assert stack.process_stack(arguments((258, 260))) == 0


          def test_stack_handles_missing_pr_and_cli_contract(monkeypatch) -> None:
              """Missing records and unsafe CLI values fail before descendant mutation."""

              monkeypatch.setattr(stack, "fetch_pr", lambda repo, number: [])
              assert stack.process_stack(arguments((258,))) == 1
              assert stack.main(["--self-test"]) == 0
              parsed = stack.parse_args(
                  [
                      "--repo",
                      "ContextualWisdomLab/LineageWeave",
                      "--base-branch",
                      "main",
                      "--pull-request-numbers",
                      "258,260",
                      "--max-prs",
                      "2",
                      "--max-dispatches",
                      "1",
                  ]
              )
              assert parsed.pull_request_numbers == (258, 260)
              for bad in (
                  ["--repo", "bad repo", "--base-branch", "main", "--pull-request-numbers", "258"],
                  ["--repo", "owner/repo", "--base-branch", "-bad", "--pull-request-numbers", "258"],
                  ["--repo", "owner/repo", "--base-branch", "main", "--pull-request-numbers", "258", "--max-prs", "0"],
                  ["--repo", "owner/repo", "--base-branch", "main", "--pull-request-numbers", "258", "--max-dispatches", "2"],
                  ["--repo", "owner/repo", "--base-branch", "main", "--pull-request-numbers", "258", "--retry-hours", "0"],
              ):
                  with pytest.raises(SystemExit):
                      stack.parse_args(bad)
          ''').replace("          ", ""), encoding="utf-8")

          caller = ".github/workflows/lineageweave-hourly-review-repair.yml"
          replace_once(
              caller,
              '      base_branch: main\n      max_prs: "50"',
              '      base_branch: main\n      pull_request_numbers: "258,260,261,262,263,264"\n      max_prs: "6"',
          )

          caller_test = "tests/test_lineageweave_hourly_review_caller.py"
          replace_once(
              caller_test,
              '    assert "base_branch: main" in caller\n    assert \'max_prs: "50"\' in caller',
              '    assert "base_branch: main" in caller\n    assert \'pull_request_numbers: "258,260,261,262,263,264"\' in caller\n    assert \'max_prs: "6"\' in caller',
          )
          replace_once(
              caller_test,
              '        ".github/workflows/lineageweave-hourly-review-repair-quality.yml",\n        "tests/test_lineageweave_hourly_review_caller.py",',
              '        ".github/workflows/lineageweave-hourly-review-repair-quality.yml",\n        ".github/workflows/pr-review-fix-scheduler.yml",\n        "scripts/ci/pr_review_fix_stack_scheduler.py",\n        "tests/test_pr_review_fix_stack_scheduler.py",\n        "tests/test_lineageweave_hourly_review_caller.py",',
          )

          quality = ".github/workflows/lineageweave-hourly-review-repair-quality.yml"
          for section in ("pull_request", "push"):
              marker = f"  {section}:\n    paths:\n"
              text = Path(quality).read_text(encoding="utf-8")
              if text.count(marker) != 1:
                  raise SystemExit(f"missing {section} path marker")
              addition = (
                  marker
                  + "      - .github/workflows/pr-review-fix-scheduler.yml\n"
                  + "      - scripts/ci/pr_review_fix_stack_scheduler.py\n"
                  + "      - tests/test_pr_review_fix_stack_scheduler.py\n"
              )
              Path(quality).write_text(text.replace(marker, addition), encoding="utf-8")
          replace_once(
              quality,
              '          python -m pytest -q tests/test_lineageweave_hourly_review_caller.py\n          python -m compileall -q \\\n            tests/test_lineageweave_hourly_review_caller.py',
              '          python -m pytest -q \\\n            tests/test_lineageweave_hourly_review_caller.py \\\n            tests/test_pr_review_fix_stack_scheduler.py \\\n            tests/test_pr_review_fix_scheduler.py\n          python -m compileall -q \\\n            scripts/ci/pr_review_fix_stack_scheduler.py \\\n            tests/test_lineageweave_hourly_review_caller.py \\\n            tests/test_pr_review_fix_stack_scheduler.py',
          )

          doctor = Path("docs/doctoring/lineageweave-hourly-review-caller.md")
          text = doctor.read_text(encoding="utf-8")
          anchor = "The caller runs at minute 4 of every hour and also exposes `workflow_dispatch`\n"
          paragraph = (
              "The caller supplies the explicit ordered queue `258,260,261,262,263,264`. "
              "The shared scheduler validates every child base branch and base SHA against "
              "the immediately preceding parent head, continues only when the parent has no "
              "repairable exact-head evidence, and stops after the first dispatch, wait, or "
              "structural blocker.\n\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("doctoring insertion anchor missing")
          doctor.write_text(text.replace(anchor, paragraph + anchor), encoding="utf-8")
          PY
      - name: Run focused regression suite
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_lineageweave_hourly_review_caller.py \
            tests/test_pr_review_fix_stack_scheduler.py \
            tests/test_pr_review_fix_scheduler.py
          python -m compileall -q \
            scripts/ci/pr_review_fix_stack_scheduler.py \
            tests/test_lineageweave_hourly_review_caller.py \
            tests/test_pr_review_fix_stack_scheduler.py
          git diff --check
      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-repair-lineageweave-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/pr-review-fix-scheduler.yml \
            .github/workflows/lineageweave-hourly-review-repair.yml \
            .github/workflows/lineageweave-hourly-review-repair-quality.yml \
            scripts/ci/pr_review_fix_stack_scheduler.py \
            tests/test_pr_review_fix_stack_scheduler.py \
            tests/test_lineageweave_hourly_review_caller.py \
            docs/doctoring/lineageweave-hourly-review-caller.md \
            .github/workflows/one-shot-repair-lineageweave-stack.yml
          git commit -m "fix(automation): traverse LineageWeave stack in dependency order"
          git push origin HEAD:feat/lineageweave-hourly-nvidia-nim-review-repair
