name: One-shot apply trusted uv retry

on:
  push:
    branches: [fix/trusted-uv-transient-download-retry]

concurrency:
  group: one-shot-apply-trusted-uv-retry
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/trusted-uv-transient-download-retry
          fetch-depth: 0
          persist-credentials: false

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Confirm retry regressions are red before production repair
        run: |
          set -euo pipefail
          if python -m pytest \
            tests/test_trusted_uv_portability_and_streaming.py \
            -k 'retries_transient or retries_transport or exhausts_bounded or does_not_retry_permanent' \
            -q; then
            echo "::error::Retry regressions unexpectedly passed before implementation."
            exit 1
          fi

      - name: Implement bounded transient retry
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/materialize_base_python_requirements.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "import tempfile\nimport urllib.parse\nimport urllib.request\n",
              "import tempfile\nimport time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\n",
              1,
          )
          constant_anchor = "TRUSTED_UV_DOWNLOAD_TIMEOUT_SECONDS = 120\n"
          constants = (
              "TRUSTED_UV_DOWNLOAD_TIMEOUT_SECONDS = 120\n"
              "TRUSTED_UV_DOWNLOAD_RETRY_DELAYS_SECONDS = (1.0, 2.0)\n"
              "TRUSTED_UV_RETRYABLE_HTTP_STATUS = frozenset(\n"
              "    {408, 429, 500, 502, 503, 504}\n"
              ")\n"
          )
          if text.count(constant_anchor) != 1:
              raise SystemExit("trusted uv timeout constant anchor drifted")
          text = text.replace(constant_anchor, constants, 1)

          start = text.index("def _download_trusted_uv_archive() -> bytes:\n")
          end = text.index("\n\ndef _verified_uv_binary", start)
          replacement = '''def _download_trusted_uv_archive() -> bytes:
    """Download the fixed archive with bounded transient transport retries."""
    _install_trusted_uv_url_opener()
    attempt_limit = len(TRUSTED_UV_DOWNLOAD_RETRY_DELAYS_SECONDS) + 1
    for attempt in range(1, attempt_limit + 1):
        try:
            # Keep the audited URL literal at the network sink so static analysis can
            # prove that neither user data nor repository content selects a scheme,
            # host, path, query, fragment, method, or request header.
            with urllib.request.urlopen(  # nosemgrep: python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected  # nosec B310
                "https://releases.astral.sh/github/uv/releases/download/0.12.1/"
                "uv-x86_64-unknown-linux-gnu.tar.gz",
                timeout=TRUSTED_UV_DOWNLOAD_TIMEOUT_SECONDS,
            ) as response:
                final_url = urllib.parse.urlparse(response.geturl())
                try:
                    final_port = final_url.port
                except ValueError as exc:
                    raise RuntimeError(
                        "trusted uv archive redirected outside the fixed "
                        "releases.astral.sh HTTPS origin"
                    ) from exc
                if (
                    (final_url.scheme, final_url.hostname)
                    != ("https", "releases.astral.sh")
                    or final_port not in (None, 443)
                ):
                    raise RuntimeError(
                        "trusted uv archive redirected outside the fixed "
                        "releases.astral.sh HTTPS origin"
                    )
                payload = bytearray()
                while len(payload) <= TRUSTED_UV_DOWNLOAD_MAX_BYTES:
                    chunk = response.read(
                        TRUSTED_UV_DOWNLOAD_MAX_BYTES + 1 - len(payload)
                    )
                    if not chunk:
                        break
                    payload.extend(chunk)

            if len(payload) > TRUSTED_UV_DOWNLOAD_MAX_BYTES:
                raise RuntimeError(
                    "trusted uv archive exceeded the bounded download size"
                )
            return bytes(payload)
        except urllib.error.HTTPError as exc:
            if exc.code not in TRUSTED_UV_RETRYABLE_HTTP_STATUS:
                raise RuntimeError(
                    f"trusted uv archive download failed: HTTP {exc.code}"
                ) from exc
            failure_label = f"HTTP {exc.code}"
            failure: BaseException = exc
        except (urllib.error.URLError, OSError) as exc:
            failure_label = type(exc).__name__
            failure = exc

        if attempt == attempt_limit:
            raise RuntimeError(
                "trusted uv archive download failed: "
                f"{failure_label} after {attempt} attempts"
            ) from failure
        time.sleep(TRUSTED_UV_DOWNLOAD_RETRY_DELAYS_SECONDS[attempt - 1])

    raise AssertionError("trusted uv retry loop must return or raise")  # pragma: no cover
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          fixed_anchor = "### Fixed\n\n"
          bullet = (
              "- Retried the fixed, checksum-pinned trusted uv archive download at "
              "most twice after transient transport, 408, 429, or 5xx availability "
              "failures while keeping redirects, permanent 4xx responses, origin "
              "drift, size, checksum, archive, and version failures immediately "
              "fail-closed.\n"
          )
          if changelog_text.count(fixed_anchor) != 1:
              raise SystemExit("CHANGELOG Fixed anchor drifted")
          if bullet not in changelog_text:
              changelog_text = changelog_text.replace(
                  fixed_anchor, fixed_anchor + bullet, 1
              )
          changelog.write_text(changelog_text, encoding="utf-8")
          PY
          git diff --check

      - name: Run focused trusted uv coverage gate
        run: |
          set -euo pipefail
          cat >"${RUNNER_TEMP}/trusted-uv-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/trusted-uv-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            -q
          python -m coverage report

      - name: Run full central quality gate
        run: |
          set -euo pipefail
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_trusted_uv_portability_and_streaming.py

      - name: Publish verified repair and remove this one-shot workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: fix/trusted-uv-transient-download-retry
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-apply-trusted-uv-retry.yml
          git add \
            CHANGELOG.md \
            docs/doctoring/trusted-uv-transient-download-retry.md \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_trusted_uv_portability_and_streaming.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(coverage): retry transient trusted uv downloads"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH_NAME}"
