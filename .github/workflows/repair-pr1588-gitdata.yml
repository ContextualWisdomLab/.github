name: Repair PR1588 through Git data

on:
  push:
    branches: [fix/strix-control-plane-supersession-20260901]
    paths: [.github/repair-pr1588.gitdata-trigger]

permissions:
  contents: write
  pull-requests: read

jobs:
  repair-pr1588-gitdata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/strix-control-plane-supersession-20260901
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Reconstruct verified source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          starting_head="$GITHUB_SHA"
          writer_ref='refs/heads/fix/strix-control-plane-supersession-20260901'
          remote_head="$(git ls-remote origin "$writer_ref" | awk '{print $1}')"
          test "$remote_head" = "$starting_head"

          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/repair-pr1588-exact-head.yml').read_text(encoding='utf-8')
          step = '      - name: Reconcile current main and patch exact-head Strix admission contract\n'
          start = source.index(step)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Push repaired head with guarded branch credential', start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/repair-pr1588.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/repair-pr1588.sh

          rm -f .github/workflows/repair-pr1588-gitdata.yml .github/repair-pr1588.gitdata-trigger
          git add -A
          git diff --cached --check
          git commit --amend --no-edit

          main_head="$(git rev-parse origin/main)"
          base_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${main_head}" --jq '.tree.sha')"
          tree_entries='[]'
          for path in \
            '.github/workflows/strix.yml' \
            'scripts/ci/test_strix_quick_gate.sh' \
            'tests/test_required_workflow_queue_contract.py' \
            'tests/test_strix_control_plane_supersession.py'
          do
            test -f "$path"
            mode="$(git ls-tree HEAD -- "$path" | awk '{print $1}')"
            blob_sha="$(jq -Rs '{content: ., encoding: "utf-8"}' <"$path" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')"
            echo "remote_blob ${path} ${mode} ${blob_sha}"
            tree_entries="$(jq --arg path "$path" --arg mode "$mode" --arg sha "$blob_sha" '. + [{path: $path, mode: $mode, type: "blob", sha: $sha}]' <<<"$tree_entries")"
          done

          tree_sha="$(jq -n --arg base_tree "$base_tree" --argjson tree "$tree_entries" '{base_tree: $base_tree, tree: $tree}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq '.sha')"
          commit_sha="$(jq -n \
            --arg message 'fix(strix): revalidate live PR state before expensive evidence' \
            --arg tree "$tree_sha" \
            --arg parent "$starting_head" \
            --arg main "$main_head" \
            '{message: $message, tree: $tree, parents: [$parent, $main]}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq '.sha')"
          echo "reconciliation_tree=${tree_sha}"
          echo "reconciliation_commit=${commit_sha}"
          echo "starting_head=${starting_head}"
          echo "main_head=${main_head}"
