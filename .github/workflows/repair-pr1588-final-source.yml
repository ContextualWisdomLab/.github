name: Repair PR 1588 final source
# Retrigger exact-head source materialization after stale contract failures surfaced.

on:
  push:
    branches:
      - fix/strix-control-plane-supersession-20260901
    paths:
      - .github/workflows/repair-pr1588-final-source.yml

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          disable-file-monitoring: true

      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Materialize and verify the source fix
        shell: bash
        env:
          WRITER_BRANCH: fix/strix-control-plane-supersession-20260901
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          python3 -m py_compile scripts/ci/repair_pr1588_final_source.py
          python3 scripts/ci/repair_pr1588_final_source.py

          # The permanent quick gate already defines the canonical publication
          # receipt as live_publication.outputs.current. Keep the source repair
          # on that contract instead of introducing a duplicate synonym.
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              Path('.github/workflows/strix.yml'),
              Path('tests/test_strix_control_plane_supersession.py'),
          ):
              text = path.read_text(encoding='utf-8')
              text = text.replace('publication_revalidation', 'live_publication')
              text = text.replace('echo "valid=true" >> "$GITHUB_OUTPUT"', 'echo "current=true" >> "$GITHUB_OUTPUT"')
              text = text.replace('.outputs.valid', '.outputs.current')
              path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          import runpy
          scope = runpy.run_path('tests/test_strix_control_plane_supersession.py')
          for name, value in sorted(scope.items()):
              if name.startswith('test_') and callable(value):
                  value()
                  print(f'PASS {name}')
          PY
          bash scripts/ci/test_strix_quick_gate.sh
          git diff --check

          rm scripts/ci/repair_pr1588_final_source.py
          rm .github/workflows/repair-pr1588-final-source.yml
          git add .github/workflows/strix.yml tests/test_strix_control_plane_supersession.py scripts/ci/repair_pr1588_final_source.py .github/workflows/repair-pr1588-final-source.yml
          git diff --cached --check

          remote_head="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(strix): enforce live PR state at admission boundaries"
          git push origin "HEAD:${WRITER_BRANCH}"
