name: Reusable company default-head trust gate

on:
  workflow_call:
    inputs:
      target_runner_label:
        required: true
        type: string
      trusted_ref_sha:
        required: false
        type: string
        default: ""
      trusted_ref_ack:
        required: false
        type: string
        default: ""
    outputs:
      runner_matrix:
        value: ${{ jobs.validate.outputs.runner_matrix }}

permissions:
  contents: read

jobs:
  validate:
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, Linux, X64, cwlab-ci-isolated]
    timeout-minutes: 5
    outputs:
      runner_matrix: ${{ steps.runner.outputs.runner_matrix }}
    steps:
      - id: runner
        shell: bash
        env:
          TARGET: ${{ inputs.target_runner_label }}
        run: |
          case "$TARGET" in
            all) matrix='["itxllmpgw01","itxllmpgw02","xtrmsales-llmgw1","xtrmsales-llmgw2"]' ;;
            itxllmpgw01|itxllmpgw02|itxllmpgw03|itxllmpgw04|xtrmsales-llmgw1|xtrmsales-llmgw2|llm-gateway-dev|itx-llm-operation-1|itx-llm-operation-2)
              matrix="[\"$TARGET\"]"
              ;;
            *) echo "unsupported target_runner_label=$TARGET" >&2; exit 2 ;;
          esac
          echo "runner_matrix=$matrix" >> "$GITHUB_OUTPUT"
      - shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "self-hosted failure diagnostics require the protected default branch" >&2
            exit 2
          fi
          current_sha="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [ "$SHA" != "$current_sha" ]; then
            echo "refusing stale default-branch run sha=$SHA current_sha=$current_sha" >&2
            exit 2
          fi
          echo "trusted_ref_status=current_default_head sha=$SHA"
