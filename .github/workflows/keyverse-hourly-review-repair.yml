name: Keyverse Hourly Review Repair

on:
  schedule:
    # Minute 29 avoids Clearfolio (23), DiskSage (37), fast-mlsirm (49),
    # BandScope (53), naruon (11), Inkspan (47), orchestrator (17), and
    # Wardnet (7).
    - cron: "29 * * * *"

concurrency:
  group: keyverse-hourly-review-repair
  # A later heartbeat must not cancel an in-flight IdP RCA or repair.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-review-repair:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-review-fix-scheduler.yml
    with:
      target_repository: ContextualWisdomLab/keyverse
      base_branch: main
      max_prs: "50"
      max_dispatches: "1"
      retry_hours: "2"
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
