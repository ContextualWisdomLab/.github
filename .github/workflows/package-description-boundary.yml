# Reusable gate (workflow_call) for what a package's registry page will show.
#
# A repository README is developer-facing; links to internal design records and
# working notes belong there. The same file becomes the package description on
# PyPI, npm, or crates.io, where only the distribution's own files exist and the
# reader is installing rather than developing. A repo-relative link that works on
# GitHub is a 404 on the registry page, and internal go-to-market framing, a
# hard-coded deal value, or a quoted module path is plumbing on a product page.
#
# Motivated by a live finding: fast-mlsirm 0.11.3's published description carried
# 68 of these, including a KRW-denominated readiness gate and 16 dead links.
#
# This checks the BUILT description (PKG-INFO from an sdist, METADATA from a
# wheel) rather than the README on disk, because that is what a registry renders.
# Repositories with no release yet can point `readme` at their README instead.
#
# The `on:` trigger stays in each calling repo: a workflow_call target cannot
# also be triggered directly. Pin `uses:` to this file's commit SHA, never @main.
#
#   name: Package description boundary
#   on:
#     pull_request:
#   jobs:
#     package-description-boundary:
#       uses: ContextualWisdomLab/.github/.github/workflows/package-description-boundary.yml@<commit-sha>
#       with:
#         build: sdist
#         dist-path: dist
#
# Converting an existing standalone check to this renames the published context
# to "<calling job> / package-description-boundary"; update branch protection in
# the same window (ADR 0024).
name: Package description boundary

on:
  workflow_call:
    inputs:
      build:
        description: "What to build before checking: sdist, wheel, or none to check the README instead"
        type: string
        default: "sdist"
      dist-path:
        description: "Directory holding the built sdist or wheel"
        type: string
        default: "dist"
      readme-path:
        description: "README to check when no distribution is built yet"
        type: string
        default: "README.md"
      python-version:
        description: "CPython used to build the distribution"
        type: string
        default: "3.12"
      allow:
        description: "Space-separated rule names to report without failing, for a staged migration"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-distribution:
    # Caller-controlled build backends run only on the disposable isolated pool.
    # Never fall back to a GitHub-hosted runner for untrusted package code.
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    timeout-minutes: 10
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: .caller-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: ${{ inputs.build != 'none' }}
        with:
          python-version: ${{ inputs.python-version }}
      - name: Set up pinned uv build frontend
        if: ${{ inputs.build != 'none' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: false
      # `build` is a bounded choice, never a command. An earlier revision took a
      # free-form `build-command` and interpolated it into this `run:` block,
      # which is template injection (a caller could pass arbitrary shell) and is
      # also what ADR 0023 forbids: reusable inputs are data and capability
      # flags, not shell source. Semgrep's run-shell-injection rule caught it
      # before this shipped.
      - name: Build the distribution
        if: ${{ inputs.build != 'none' }}
        working-directory: .caller-source
        env:
          BUILD: ${{ inputs.build }}
          DIST_PATH: ${{ inputs.dist-path }}
        run: |
          set -euo pipefail
          case "$BUILD" in
            sdist) target=--sdist ;;
            wheel) target=--wheel ;;
            *) echo "build must be one of: sdist, wheel, none (got: $BUILD)" >&2; exit 2 ;;
          esac
          uv build "$target" --out-dir "$DIST_PATH"
          mkdir -p ../package-description-input/dist
          find "$DIST_PATH" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.whl' \) \
            -exec cp -- '{}' ../package-description-input/dist/ \;
      - name: Stage README before a first release
        if: ${{ inputs.build == 'none' }}
        env:
          README_PATH: ${{ inputs.readme-path }}
        run: |
          set -euo pipefail
          caller_root="$(realpath .caller-source)"
          readme_source="$(realpath -e ".caller-source/$README_PATH")"
          case "$readme_source" in
            "$caller_root"/*) ;;
            *) echo "readme-path must stay inside the calling repository" >&2; exit 2 ;;
          esac
          mkdir -p package-description-input
          cp -- "$readme_source" package-description-input/README.md
      - name: Upload the immutable inspection input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: package-description-input
          path: package-description-input
          if-no-files-found: error
          retention-days: 1

  package-description-boundary:
    needs: build-distribution
    if: ${{ always() }}
    # The trusted inspector also stays on the isolated pool. Missing capacity
    # must remain an incomplete check, never a hosted fallback or silent pass.
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, linux, x64, cwlab-ci-isolated]
    timeout-minutes: 10
    steps:
      - name: Reject a failed input producer
        env:
          PRODUCER_RESULT: ${{ needs.build-distribution.result }}
        run: |
          set -euo pipefail
          if [ "$PRODUCER_RESULT" != "success" ]; then
            echo "package description input producer did not succeed: $PRODUCER_RESULT" >&2
            exit 2
          fi
      - name: Validate called workflow identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REPOSITORY" != "ContextualWisdomLab/.github" ]; then
            echo "called workflow repository mismatch: $WORKFLOW_REPOSITORY" >&2
            exit 2
          fi
          if [[ ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "called workflow SHA is not an exact commit: $WORKFLOW_SHA" >&2
            exit 2
          fi
      - name: Check out the central gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .central-gate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python-version }}
      - name: Download the immutable inspection input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-description-input
          path: package-description-input
      - name: Check the description a registry will render
        env:
          BUILD: ${{ inputs.build }}
          ALLOW: ${{ inputs.allow }}
        run: |
          set -euo pipefail
          allow_args=()
          for rule in $ALLOW; do allow_args+=(--allow "$rule"); done
          if [ "$BUILD" = "none" ]; then
            source_args=(--readme "package-description-input/README.md")
          else
            source_args=(--dist "package-description-input/dist")
          fi
          python -I .central-gate/scripts/ci/package_description_boundary.py \
            "${source_args[@]}" \
            --json package-description-boundary.json \
            "${allow_args[@]}"
      - name: Upload the boundary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: package-description-boundary
          path: package-description-boundary.json
          if-no-files-found: ignore
