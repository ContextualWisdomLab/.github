name: Isolated PR 1589 main reconciliation

on:
  push:
    branches:
      - automation/repair-1589-red-20260901-2120
    paths:
      - .github/workflows/repair-1589-red.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reconcile protected main without executing target code
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
          EXPECTED_HEAD: 8a72d6033fa101a05fa5e2b29d95abfb2c24bee6
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch origin "$TARGET_BRANCH" main
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -X theirs origin/main
          git merge-base --is-ancestor origin/main HEAD
          git grep -q 'OBSERVED_REVIEW_PROBE_KINDS' -- scripts/ci/noema_review_gate.py
          git grep -q '_validate_observed_probe_class_evidence' -- scripts/ci/noema_review_gate.py
          git grep -q 'Classify every adversarial probe with one observed defect class' -- scripts/ci/noema_review_gate.py
          git grep -q 'def fetch_merge_base_sha' -- scripts/ci/noema_review_gate.py
          git grep -q 'removed_file_context_section' -- scripts/ci/noema_review_gate.py
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'source-fix-1589*.yml' -print -quit)"
          git diff --check HEAD^1 HEAD
          git push origin "HEAD:${TARGET_BRANCH}"
