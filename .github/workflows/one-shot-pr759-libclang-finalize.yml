name: One-shot PR 759 libclang finalize

on:
  push:
    branches: [fix/opencode-coverage-failure-diagnostics]
    paths:
      - .github/workflows/one-shot-pr759-libclang-finalize.yml

concurrency:
  group: one-shot-pr759-libclang-finalize
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out exact contributor head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          persist-credentials: false

      - name: Verify exact RED contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          python3 -I - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/opencode-review-dispatch.yml').read_text(encoding='utf-8')
          assert '              libclang-19-dev ' + chr(92) in workflow
          assert 'ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib' in workflow
          assert 'find "$LIBCLANG_PATH" -maxdepth 1' in workflow
          assert "-name 'libclang.so*'" in workflow
          PY
          status=$?
          set -e
          test "$status" -ne 0

      - name: Implement version-aligned libclang prerequisite
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/opencode-review-dispatch.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          package_old = '              llvm-19 ' + chr(92) + '\n'
          package_new = '              libclang-19-dev ' + chr(92) + '\n' + package_old
          if package_new not in workflow:
              if workflow.count(package_old) != 1:
                  raise SystemExit('expected one llvm-19 package declaration')
              workflow = workflow.replace(package_old, package_new, 1)
          env_old = '          ENV LLVM_COV=/usr/bin/llvm-cov-19\n'
          env_new = '          ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib\n' + env_old
          if env_new not in workflow:
              if workflow.count(env_old) != 1:
                  raise SystemExit('expected one LLVM_COV declaration')
              workflow = workflow.replace(env_old, env_new, 1)
          probe_old = '          RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"\n'
          probe_new = (
              '          RUN test -d "$LIBCLANG_PATH" ' + chr(92) + '\n'
              '            && find "$LIBCLANG_PATH" -maxdepth 1 '
              + chr(92) + '( -type f -o -type l ' + chr(92) + ") -name 'libclang.so*' -print -quit | grep -q . "
              + chr(92) + '\n'
              '            && test -x "$LLVM_COV" ' + chr(92) + '\n'
              '            && test -x "$LLVM_PROFDATA"\n'
          )
          if probe_new not in workflow:
              if workflow.count(probe_old) != 1:
                  raise SystemExit('expected one LLVM executable probe')
              workflow = workflow.replace(probe_old, probe_new, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('tests/test_opencode_agent_contract.py')
          test_source = test_path.read_text(encoding='utf-8')
          old = '''    assert "              llvm-19 " + chr(92) in workflow
    assert "ENV LLVM_COV=/usr/bin/llvm-cov-19" in workflow
    assert "ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19" in workflow
    assert 'RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"' in workflow
'''
          new = '''    assert "              libclang-19-dev " + chr(92) in workflow
    assert "              llvm-19 " + chr(92) in workflow
    assert "ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib" in workflow
    assert "ENV LLVM_COV=/usr/bin/llvm-cov-19" in workflow
    assert "ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19" in workflow
    assert 'find "$LIBCLANG_PATH" -maxdepth 1' in workflow
    assert "-name 'libclang.so*'" in workflow
'''
          if new not in test_source:
              if test_source.count(old) != 1:
                  raise SystemExit('LLVM contract test anchor drifted')
              test_path.write_text(test_source.replace(old, new, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '- Install version-aligned `libclang-19-dev` and export `LIBCLANG_PATH` so bindgen-backed Rust crates can execute in the central coverage image.\n'
          if entry not in changelog:
              anchor = '### Fixed\n\n'
              if changelog.count(anchor) != 1:
                  raise SystemExit('changelog Fixed heading drifted')
              changelog_path.write_text(changelog.replace(anchor, anchor + entry, 1), encoding='utf-8')

          doctoring_path = Path('docs/doctoring/opencode-llvm-coverage-toolchain.md')
          doctoring = doctoring_path.read_text(encoding='utf-8')
          section = '''

## Bindgen and libclang compatibility boundary

`llvm-19` supplies the versioned coverage executables, while Rust crates that
use `bindgen` also require the Clang C interface at build time. The central
image therefore installs the matching `libclang-19-dev` package, exports
`LIBCLANG_PATH=/usr/lib/llvm-19/lib`, and fails image construction unless a
regular file or symbolic link matching `libclang.so*` exists. This is an
infrastructure prerequisite only; repository fuzz and package-specific native
validation remain separate required gates.

Debian Project. (2026). *libclang-19-dev: Clang library—Development package*.
Debian Packages. Retrieved August 5, 2026, from
https://packages.debian.org/trixie/libclang-19-dev

Ubuntu. (2026). *libclang-19-dev in noble-updates*. Ubuntu Packages. Retrieved
August 5, 2026, from https://packages.ubuntu.com/noble-updates/libclang-19-dev
'''
          if '## Bindgen and libclang compatibility boundary' not in doctoring:
              doctoring_path.write_text(doctoring.rstrip() + section + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Verify GREEN and real package availability
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -m pytest -q tests/test_opencode_agent_contract.py
          python3 -m compileall -q tests/test_opencode_agent_contract.py
          probe_dir="$(mktemp -d)"
          cat >"$probe_dir/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/library/python:3.14-slim@sha256:b877e50bd90de10af8d82c57a022fc2e0dc731c5320d762a27986facfc3355c1
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update \
            && apt-get install --no-install-recommends -y libclang-19-dev llvm-19 \
            && rm -rf /var/lib/apt/lists/*
          ENV LIBCLANG_PATH=/usr/lib/llvm-19/lib
          ENV LLVM_COV=/usr/bin/llvm-cov-19
          ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19
          RUN test -d "$LIBCLANG_PATH" \
            && find "$LIBCLANG_PATH" -maxdepth 1 \( -type f -o -type l \) -name 'libclang.so*' -print -quit | grep -q . \
            && test -x "$LLVM_COV" \
            && test -x "$LLVM_PROFDATA"
          DOCKERFILE
          docker build --pull --no-cache --tag pr759-libclang-probe "$probe_dir"
          rm -rf "$probe_dir"
          git diff --check

      - name: Publish verified implementation and remove this workflow
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          HEAD_BRANCH: fix/opencode-coverage-failure-diagnostics
          PUSH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/one-shot-pr759-libclang-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m 'fix(coverage): provision libclang for Rust bindgen'
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${HEAD_BRANCH}"
