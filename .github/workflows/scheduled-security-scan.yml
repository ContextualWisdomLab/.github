# Central PERIODIC full-repo security scan for every ContextualWisdomLab repo.
#
# Fills a governance gap left when the duplicate LOCAL codeql/trivy workflows
# were removed: those ran on push + schedule, but the central CodeQL PR and
# Security Scan workflows fire on pull_request ONLY. Without this, code that
# lands via non-PR paths (direct push, admin merge) or newly-disclosed CVEs on
# already-merged code get no periodic re-scan.
#
# scorecard already has periodic coverage (scorecard-analysis.yml runs on
# push + schedule), and bandit/semgrep/gitleaks carry their own schedule
# triggers, so this workflow only needs to restore periodic CodeQL and
# trivy-fs.
#
#   codeql    full-repo SAST (default branch) -> category "/language:X-scheduled"
#   trivy-fs  repo-wide vuln/secret/misconfig -> category "trivy-fs-scheduled"
#
# All SARIF uploads are best-effort (continue-on-error) so a repo that has not
# enabled code scanning does not fail this workflow with a
# JOB_STATUS_CONFIGURATION_ERROR. This is not a required workflow; it provides
# periodic visibility, not a merge gate.
name: Scheduled Security Scan

on:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: "7 2 * * 1"
  repository_dispatch:
    types: [scheduled-security-scan]

concurrency:
  group: scheduled-security-scan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-languages:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build language matrix
        id: detect
        run: |
          matrix='[]'
          if [ -d .github/workflows ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"language":"actions","build-mode":"none"}]')
          fi
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path './.git/*' | head -1 | grep -q .; then
            matrix=$(echo "$matrix" | jq -c '. + [{"language":"javascript-typescript","build-mode":"none"}]')
          fi
          if find . -type f -name '*.py' -not -path './.git/*' | head -1 | grep -q .; then
            matrix=$(echo "$matrix" | jq -c '. + [{"language":"python","build-mode":"none"}]')
          fi
          if [ "$(echo "$matrix" | jq 'length')" -eq 0 ]; then
            matrix='[{"language":"actions","build-mode":"none"}]'
          fi
          {
            echo 'matrix<<EOF'
            jq -nc --argjson include "$matrix" '{include: $include}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL periodic (${{ matrix.language }})
    needs: detect-languages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-languages.outputs.matrix) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}-scheduled"

  trivy-fs:
    name: Trivy filesystem (periodic)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs-scheduled
