name: Bootstrap trusted uv materializer

on:
  push:
    branches:
      - fix/opencode-trusted-uv-lock-coverage
    paths:
      - .tmp/uv-materializer/READY
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - fix/npm-workspace-coverage-root
    paths:
      - .tmp/uv-materializer/READY

concurrency:
  group: bootstrap-trusted-uv-materializer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout guarded branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Reconstruct reviewed source and tests
        env:
          EXPECTED_STAGE_PARENT_SHA: fc12d1791ba07cf8a91401be20ac29e94435c887
          STACK_BASE_SHA: b824259d3503fd357bf38ec7ce5a855f67005e1b
          BOOTSTRAP_WORKFLOW: .github/workflows/bootstrap-trusted-uv-materializer.yml
          READY_SENTINEL: .tmp/uv-materializer/READY
          EXPECTED_SCRIPT_SHA256: e9bc07ffdf9f0832296e080b89cc1ae598eeddf97fde73d2569b4b2db070a0e9
          EXPECTED_TEST_SHA256: 6c7b06ab9dca4b54aad05f484c4fe90350d2e007b1c193bfb71a49064f1ed8a9
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$EXPECTED_STAGE_PARENT_SHA" HEAD
          stage_files="$(git diff --name-only "$EXPECTED_STAGE_PARENT_SHA"...HEAD | sort)"
          expected_stage_files="$(printf '%s\n' "$BOOTSTRAP_WORKFLOW" "$READY_SENTINEL" | sort)"
          test "$stage_files" = "$expected_stage_files"

          cat .tmp/uv-materializer/script.*.b64 \
            | tr -d '\n' \
            | base64 --decode \
            > scripts/ci/materialize_base_python_requirements.py
          cat .tmp/uv-materializer/tests.*.b64 \
            | tr -d '\n' \
            | base64 --decode \
            > tests/test_materialize_base_python_requirements.py
          chmod 0755 scripts/ci/materialize_base_python_requirements.py

          sha256sum \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirements.py
          printf '%s  %s\n' "$EXPECTED_SCRIPT_SHA256" scripts/ci/materialize_base_python_requirements.py \
            | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_TEST_SHA256" tests/test_materialize_base_python_requirements.py \
            | sha256sum --check --strict

          rm -rf .tmp/uv-materializer
          rm -f "$BOOTSTRAP_WORKFLOW"

          actual_files="$(git diff --name-only "$STACK_BASE_SHA" -- | sort)"
          expected_files="$(printf '%s\n' \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirements.py | sort)"
          test "$actual_files" = "$expected_files"
          git diff --check

      - name: Install hash-locked verification tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            -r requirements-opencode-review-ci-hashes.txt

      - name: Verify focused behavior and repository contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_materialize_base_python_requirements.py
          python -m pytest -q \
            tests/test_materialize_base_python_requirements.py \
            tests/test_opencode_agent_contract.py
          python -m pytest -q \
            --cov=scripts.ci.materialize_base_python_requirements \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            tests/test_materialize_base_python_requirements.py
          python -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirements.py
          interrogate -c pyproject.toml scripts/ci/materialize_base_python_requirements.py
          git diff --check

      - name: Commit verified implementation
        env:
          STACK_BASE_SHA: b824259d3503fd357bf38ec7ce5a855f67005e1b
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(coverage): materialize trusted uv lock dependencies"

          actual_files="$(git diff --name-only "$STACK_BASE_SHA"...HEAD | sort)"
          expected_files="$(printf '%s\n' \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirements.py | sort)"
          test "$actual_files" = "$expected_files"
          git push origin "HEAD:${TARGET_BRANCH}"
