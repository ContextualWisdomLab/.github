name: CGC central validation
on:
  workflow_call: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on:
      group: CWL CI isolated
      labels:
      - self-hosted
      - Linux
      - X64
      - cwlab-ci-isolated
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
    steps:
    - name: Admit candidate before checkout
      env:
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        if [[ "$REPOSITORY" != "ContextualWisdomLab/context-graph-contracts" || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "CGC repository or candidate SHA is not admitted" >&2
          exit 1
        fi
        case "$EVENT_NAME" in
          push) ;;
          pull_request)
            if [[ "$HEAD_REPOSITORY" != "ContextualWisdomLab/context-graph-contracts" ]]; then
              echo "fork or missing head repository is not admitted" >&2
              exit 1
            fi ;;
          *) echo "unsupported candidate event" >&2; exit 1 ;;
        esac
    - name: Remove job-owned stale outputs before checkout
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?}"
        # Delete only job-owned outputs, never a runner parent or another job's state.
        rm -rf -- dist .package-smoke .receipt-smoke .sbom-venv source-a source-b \
          build-a build-b reproducibility-evidence reproducibility-source \
          reproducibility-build package-reproducibility-evidence
    - name: Initialize private job state
      id: private
      run: |
        set -euo pipefail
        umask 077
        runner_root="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
        private_root="$(mktemp -d "$runner_root/cgc-ci.XXXXXXXX")"
        chmod 700 "$private_root"
        mkdir -m 700 "$private_root/home" "$private_root/config"
        printf 'PRIVATE_ROOT=%s\nHOME=%s/home\nXDG_CONFIG_HOME=%s/config\nUV_CACHE_DIR=%s/cache\nUV_PROJECT_ENVIRONMENT=%s/venv\nTMPDIR=%s\nXDG_CACHE_HOME=%s/cache\nPYTHONPATH=\nPYTHONHOME=\nPYTHONOPTIMIZE=\nPYTHONNOUSERSITE=1\n' \
          "$private_root" "$private_root" "$private_root" "$private_root" \
          "$private_root" "$private_root" "$private_root" >> "$GITHUB_ENV"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        repository: ContextualWisdomLab/context-graph-contracts
    - name: Verify exact source checkout
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: 0.11.32
        enable-cache: 'false'
    - run: uv lock --check
    - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
    - run: uv run --frozen --extra dev --python "${{ matrix.python-version }}" python -m compileall -q src
    - run: uv run --frozen --extra dev --python "${{ matrix.python-version }}" python -m ruff check . --output-format=github
    - run: uv run --frozen --extra dev --python "${{ matrix.python-version }}" python -m coverage run -m pytest
        -q tests .github/tests
    - run: uv run --frozen --extra dev --python "${{ matrix.python-version }}" python -m coverage report --fail-under=100
    - name: Clean private job outputs
      if: ${{ always() && steps.private.outcome == 'success' }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?}"
        # Delete only job-owned outputs, never a runner parent or another job's state.
        rm -rf -- dist .package-smoke .receipt-smoke .sbom-venv source-a source-b \
          build-a build-b reproducibility-evidence reproducibility-source \
          reproducibility-build package-reproducibility-evidence
        runner_root="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
        private_name="${PRIVATE_ROOT##*/}"
        if [[ ! "$private_name" =~ ^cgc-ci\.[A-Za-z0-9]{8}$ ||
              "$PRIVATE_ROOT" != "$runner_root/$private_name" ||
              -L "$PRIVATE_ROOT" || ! -d "$PRIVATE_ROOT" ]]; then
          echo "private cleanup root is not an owned direct directory" >&2
          exit 1
        fi
        rm -rf -- "$PRIVATE_ROOT"
  package:
    runs-on:
      group: CWL CI isolated
      labels:
      - self-hosted
      - Linux
      - X64
      - cwlab-ci-isolated
    timeout-minutes: 10
    steps:
    - name: Admit candidate before checkout
      env:
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        if [[ "$REPOSITORY" != "ContextualWisdomLab/context-graph-contracts" || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "CGC repository or candidate SHA is not admitted" >&2
          exit 1
        fi
        case "$EVENT_NAME" in
          push) ;;
          pull_request)
            if [[ "$HEAD_REPOSITORY" != "ContextualWisdomLab/context-graph-contracts" ]]; then
              echo "fork or missing head repository is not admitted" >&2
              exit 1
            fi ;;
          *) echo "unsupported candidate event" >&2; exit 1 ;;
        esac
    - name: Remove job-owned stale outputs before checkout
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?}"
        # Delete only job-owned outputs, never a runner parent or another job's state.
        rm -rf -- dist .package-smoke .receipt-smoke .sbom-venv source-a source-b \
          build-a build-b reproducibility-evidence reproducibility-source \
          reproducibility-build package-reproducibility-evidence
    - name: Initialize private job state
      id: private
      run: |
        set -euo pipefail
        umask 077
        runner_root="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
        private_root="$(mktemp -d "$runner_root/cgc-ci.XXXXXXXX")"
        chmod 700 "$private_root"
        mkdir -m 700 "$private_root/home" "$private_root/config"
        printf 'PRIVATE_ROOT=%s\nHOME=%s/home\nXDG_CONFIG_HOME=%s/config\nUV_CACHE_DIR=%s/cache\nUV_PROJECT_ENVIRONMENT=%s/venv\nTMPDIR=%s\nXDG_CACHE_HOME=%s/cache\nPYTHONPATH=\nPYTHONHOME=\nPYTHONOPTIMIZE=\nPYTHONNOUSERSITE=1\n' \
          "$private_root" "$private_root" "$private_root" "$private_root" \
          "$private_root" "$private_root" "$private_root" >> "$GITHUB_ENV"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: 'false'
        repository: ContextualWisdomLab/context-graph-contracts
    - name: Verify exact source checkout
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: 0.11.32
        enable-cache: 'false'
    - run: uv lock --check
    - name: Capture dependency lock for checked-out commit
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: uv-lock-${{ github.event.pull_request.head.sha || github.sha }}
        path: uv.lock
        if-no-files-found: error
        retention-days: '1'
      if: ${{ success() }}
    - run: uv sync --frozen --extra dev --python 3.14
    - run: uv build --wheel --sdist --out-dir dist
    - name: Inspect wheel and source distribution contract resources
      run: |
        python - <<'PY'
        from pathlib import Path
        import tarfile
        import zipfile

        wheel_path = next(Path("dist").glob("*.whl"))
        sdist_path = next(Path("dist").glob("*.tar.gz"))
        required_suffixes = {
            "cwl_context_contracts/py.typed",
            "cwl_context_contracts/contracts/context-fabric.asyncapi.json",
            "cwl_context_contracts/conformance/cwl-timestamp-profile.v1.json",
            "cwl_context_contracts/conformance/context-assertion-semantics.v1.json",
            "cwl_context_contracts/conformance/context-assertion-event-semantics.v1.json",
            "cwl_context_contracts/conformance/context-assertion-message-admission.v1.json",
            "cwl_context_contracts/conformance/cloudevent-semantics.v1.json",
            "cwl_context_contracts/conformance/cwl-json-interoperability.v1.json",
            "cwl_context_contracts/conformance/data-management-assessment-semantics.v1.json",
            "cwl_context_contracts/conformance/external-metadata-observation-semantics.v1.json",
            "cwl_context_contracts/schemas/canonical-authority-uri.schema.json",
            "cwl_context_contracts/schemas/canonical-asset-uri.schema.json",
            "cwl_context_contracts/schemas/truth-status.schema.json",
            "cwl_context_contracts/schemas/bitemporal-interval.schema.json",
            "cwl_context_contracts/schemas/provenance-reference.schema.json",
            "cwl_context_contracts/schemas/cloudevent-envelope.schema.json",
            "cwl_context_contracts/schemas/context-membership.schema.json",
            "cwl_context_contracts/schemas/context-assertion.schema.json",
            "cwl_context_contracts/schemas/data-management-framework.schema.json",
            "cwl_context_contracts/schemas/data-management-assessment.schema.json",
            "cwl_context_contracts/schemas/external-metadata-source.schema.json",
            "cwl_context_contracts/schemas/external-entity-reference.schema.json",
            "cwl_context_contracts/schemas/metadata-observation-envelope.schema.json",
            "cwl_context_contracts/schemas/metadata-projection-receipt.schema.json",
            "cwl_context_contracts/fixtures/valid-event.json",
            "cwl_context_contracts/fixtures/invalid-event.json",
            "cwl_context_contracts/fixtures/valid-assertion.json",
            "cwl_context_contracts/fixtures/invalid-assertion.json",
            "cwl_context_contracts/fixtures/data-management-contract.valid.json",
            "cwl_context_contracts/fixtures/data-management-assessment.valid.json",
            "cwl_context_contracts/fixtures/metadata-observation-envelope.valid.json",
            "cwl_context_contracts/fixtures/metadata-observation-envelope.invalid.json",
            "cwl_context_contracts/fixtures/metadata-projection-receipt.valid.json",
        }

        with zipfile.ZipFile(wheel_path) as wheel_file:
            wheel_names = set(wheel_file.namelist())
        for suffix in required_suffixes:
            assert any(name.endswith(suffix) for name in wheel_names), suffix
        assert any(name.endswith("/licenses/LICENSE") for name in wheel_names)

        with tarfile.open(sdist_path, "r:gz") as sdist_file:
            sdist_names = set(sdist_file.getnames())
        for suffix in required_suffixes:
            assert any(name.endswith(suffix) for name in sdist_names), suffix
        assert any(name.endswith("/LICENSE") for name in sdist_names)
        PY
    - run: uv venv .package-smoke --python 3.14
    - run: uv pip install --python .package-smoke/bin/python --no-index --find-links dist cwl-context-contracts
    - name: Smoke-test installed contracts, schemas, and conformance fixtures
      run: |
        .package-smoke/bin/python -I - <<'PY'
        from cwl_context_contracts import (
            CloudEventEnvelope,
            ContextAssertion,
            TruthStatus,
            available_conformance_profile_names,
            available_contract_names,
            available_fixture_names,
            available_schema_names,
            load_conformance_profile,
            load_contract,
            load_fixture,
            load_schema,
            parse_cwl_timestamp,
            admit_metadata_observation,
            validate_data_management_assessment_semantics,
        )

        assert TruthStatus.OBSERVED.value == "observed"
        for schema_name in available_schema_names():
            schema = load_schema(schema_name)
            assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
            assert schema["$id"].startswith("https://schemas.contextualwisdomlab.org/")

        assert available_contract_names() == ("context-fabric.asyncapi.json",)
        asyncapi = load_contract("context-fabric.asyncapi.json")
        assert asyncapi["asyncapi"] == "3.1.0"
        assert "servers" not in asyncapi
        assert "channels" not in asyncapi
        assert "operations" not in asyncapi

        assert available_conformance_profile_names() == (
            "cwl-timestamp-profile.v1.json",
            "context-assertion-semantics.v1.json",
            "context-assertion-event-semantics.v1.json",
            "context-assertion-message-admission.v1.json",
            "cloudevent-semantics.v1.json",
            "cwl-json-interoperability.v1.json",
            "data-management-assessment-semantics.v1.json",
            "external-metadata-observation-semantics.v1.json",
        )
        timestamp_profile = load_conformance_profile(
            "cwl-timestamp-profile.v1.json"
        )
        for timestamp_value in timestamp_profile["valid_values"]:
            parse_cwl_timestamp(timestamp_value)
        for timestamp_value in timestamp_profile["invalid_values"]:
            try:
                parse_cwl_timestamp(timestamp_value)
            except ValueError:
                pass
            else:
                raise AssertionError(
                    f"negative timestamp vector unexpectedly parsed: {timestamp_value}"
                )

        assertion_profile = load_conformance_profile(
            "context-assertion-semantics.v1.json"
        )
        for vector in assertion_profile["invalid_vectors"]:
            try:
                ContextAssertion.from_mapping(vector["value"])
            except ValueError as exc:
                assert vector["error_pattern"] in str(exc)
            else:
                raise AssertionError(
                    f"negative assertion vector unexpectedly parsed: {vector['case_id']}"
                )

        assertion_event_profile = load_conformance_profile(
            "context-assertion-event-semantics.v1.json"
        )
        for vector in assertion_event_profile["valid_vectors"]:
            event = CloudEventEnvelope.from_mapping(vector["value"])
            assertion = ContextAssertion.from_event(event)
            assert assertion.to_mapping() == vector["value"]["data"]
        for vector in assertion_event_profile["invalid_vectors"]:
            try:
                event = CloudEventEnvelope.from_mapping(vector["value"])
                ContextAssertion.from_event(event)
            except ValueError as exc:
                assert vector["error_pattern"] in str(exc)
            else:
                raise AssertionError(
                    "negative assertion-event vector unexpectedly admitted: "
                    f"{vector['case_id']}"
                )

        event_profile = load_conformance_profile("cloudevent-semantics.v1.json")
        for vector in event_profile["invalid_vectors"]:
            try:
                CloudEventEnvelope.from_mapping(vector["value"])
            except ValueError as exc:
                assert vector["error_pattern"] in str(exc)
            else:
                raise AssertionError(
                    f"negative event vector unexpectedly parsed: {vector['case_id']}"
                )
        for vector in event_profile["valid_vectors"]:
            assert CloudEventEnvelope.from_mapping(vector["value"]).to_mapping() == (
                vector["value"]
            )

        assessment_profile = load_conformance_profile(
            "data-management-assessment-semantics.v1.json"
        )
        for vector in assessment_profile["valid_vectors"]:
            validate_data_management_assessment_semantics(vector["value"])
        for vector in assessment_profile["invalid_vectors"]:
            try:
                validate_data_management_assessment_semantics(vector["value"])
            except ValueError as exc:
                assert vector["error_pattern"] in str(exc)
            else:
                raise AssertionError(
                    "negative assessment vector unexpectedly validated: "
                    f"{vector['case_id']}"
                )

        metadata_profile = load_conformance_profile(
            "external-metadata-observation-semantics.v1.json"
        )
        for vector in metadata_profile["valid_vectors"]:
            receipt = admit_metadata_observation(vector["value"])
            assert receipt.result.value == "admitted", vector["case_id"]
            assert receipt.reason_code == vector["expected_reason_code"]
        for vector in metadata_profile["rejected_vectors"]:
            receipt = admit_metadata_observation(vector["value"])
            assert receipt.result.value == "rejected", vector["case_id"]
            assert receipt.reason_code == vector["expected_reason_code"]
        assert admit_metadata_observation(
            load_fixture("metadata-observation-envelope.valid.json")
        ).to_mapping() == load_fixture("metadata-projection-receipt.valid.json")

        assert available_fixture_names() == (
            "valid-event.json",
            "invalid-event.json",
            "valid-assertion.json",
            "invalid-assertion.json",
            "data-management-contract.valid.json",
            "data-management-assessment.valid.json",
            "metadata-observation-envelope.valid.json",
            "metadata-observation-envelope.invalid.json",
            "metadata-projection-receipt.valid.json",
        )
        valid_event = load_fixture("valid-event.json")
        invalid_event = load_fixture("invalid-event.json")
        assert CloudEventEnvelope.from_mapping(valid_event).to_mapping() == valid_event
        try:
            CloudEventEnvelope.from_mapping(invalid_event)
        except ValueError as exc:
            assert "UUIDv7" in str(exc) or "RFC 9562" in str(exc)
        else:
            raise AssertionError("negative conformance fixture unexpectedly parsed")

        json_profile = load_conformance_profile(
            "cwl-json-interoperability.v1.json"
        )
        for integer_value in json_profile["valid_integer_values"]:
            event_mapping = {
                **valid_event,
                "data": {"nested": [{"count": integer_value}]},
            }
            assert (
                CloudEventEnvelope.from_mapping(event_mapping)
                .to_mapping()["data"]["nested"][0]["count"]
                == integer_value
            )
        for integer_value in json_profile["invalid_integer_values"]:
            event_mapping = {
                **valid_event,
                "data": {"nested": [{"count": integer_value}]},
            }
            try:
                CloudEventEnvelope.from_mapping(event_mapping)
            except ValueError as exc:
                assert "exact interoperable range" in str(exc)
            else:
                raise AssertionError(
                    f"out-of-range integer unexpectedly parsed: {integer_value}"
                )

        valid_assertion = load_fixture("valid-assertion.json")
        invalid_assertion = load_fixture("invalid-assertion.json")
        assert ContextAssertion.from_mapping(valid_assertion).to_mapping() == (
            valid_assertion
        )
        try:
            ContextAssertion.from_mapping(invalid_assertion)
        except ValueError as exc:
            assert "provenance" in str(exc)
        else:
            raise AssertionError("negative assertion fixture unexpectedly parsed")
        PY
    - name: Smoke-test installed conformance evidence commands
      run: |
        set -euo pipefail
        umask 077
        export SMOKE_ROOT
        SMOKE_ROOT="$(mktemp -d "${RUNNER_TEMP:?}/contracts-smoke.XXXXXX")"
        trap 'rm -rf -- "$SMOKE_ROOT"' EXIT
        .package-smoke/bin/python -I .package-smoke/bin/cwl-context-conformance > "$SMOKE_ROOT/conformance-report.json"
        .package-smoke/bin/python -I .package-smoke/bin/cwl-context-conformance-manifest > "$SMOKE_ROOT/approved-manifest.json"
        .package-smoke/bin/python -I .package-smoke/bin/cwl-context-conformance-verify \
          "$SMOKE_ROOT/approved-manifest.json" > "$SMOKE_ROOT/verification-report.json"
        .package-smoke/bin/python -I .package-smoke/bin/cwl-context-conformance-admit \
          "$SMOKE_ROOT/approved-manifest.json" > "$SMOKE_ROOT/admission-report.json"
        .package-smoke/bin/python -I - <<'PY'
        import json
        import os
        from pathlib import Path

        conformance = json.loads(
            (Path(os.environ["SMOKE_ROOT"]) / "conformance-report.json").read_text(encoding="utf-8")
        )
        verification = json.loads(
            (Path(os.environ["SMOKE_ROOT"]) / "verification-report.json").read_text(encoding="utf-8")
        )
        admission = json.loads(
            (Path(os.environ["SMOKE_ROOT"]) / "admission-report.json").read_text(encoding="utf-8")
        )
        assert conformance["status"] == "pass"
        assert conformance["failures"] == []
        assert verification["verified"] is True
        assert verification["mismatches"] == []
        assert verification["next_action"] == (
            "accept the installed conformance evidence"
        )
        assert admission["admitted"] is True
        assert admission["semantic_conformance"]["status"] == "pass"
        assert admission["manifest_verification"]["verified"] is True
        assert admission["next_action"] == (
            "verify artifact provenance and runtime authorization before enabling "
            "the integration"
        )
        PY
    - name: Clean private job outputs
      if: ${{ always() && steps.private.outcome == 'success' }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?}"
        # Delete only job-owned outputs, never a runner parent or another job's state.
        rm -rf -- dist .package-smoke .receipt-smoke .sbom-venv source-a source-b \
          build-a build-b reproducibility-evidence reproducibility-source \
          reproducibility-build package-reproducibility-evidence
        runner_root="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
        private_name="${PRIVATE_ROOT##*/}"
        if [[ ! "$private_name" =~ ^cgc-ci\.[A-Za-z0-9]{8}$ ||
              "$PRIVATE_ROOT" != "$runner_root/$private_name" ||
              -L "$PRIVATE_ROOT" || ! -d "$PRIVATE_ROOT" ]]; then
          echo "private cleanup root is not an owned direct directory" >&2
          exit 1
        fi
        rm -rf -- "$PRIVATE_ROOT"
  release-package-reproducibility:
    runs-on:
      group: CWL CI isolated
      labels:
      - self-hosted
      - Linux
      - X64
      - cwlab-ci-isolated
    timeout-minutes: 10
    steps:
    - name: Admit candidate before checkout
      env:
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        if [[ "$REPOSITORY" != "ContextualWisdomLab/context-graph-contracts" || ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "CGC repository or candidate SHA is not admitted" >&2
          exit 1
        fi
        case "$EVENT_NAME" in
          push) ;;
          pull_request)
            if [[ "$HEAD_REPOSITORY" != "ContextualWisdomLab/context-graph-contracts" ]]; then
              echo "fork or missing head repository is not admitted" >&2
              exit 1
            fi ;;
          *) echo "unsupported candidate event" >&2; exit 1 ;;
        esac
    - name: Remove job-owned stale outputs before checkout
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?}"
        # Delete only job-owned outputs, never a runner parent or another job's state.
        rm -rf -- dist .package-smoke .receipt-smoke .sbom-venv source-a source-b \
          build-a build-b reproducibility-evidence reproducibility-source \
          reproducibility-build package-reproducibility-evidence
    - name: Initialize private job state
      id: private
      run: |
        set -euo pipefail
        umask 077
        runner_root="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
        private_root="$(mktemp -d "$runner_root/cgc-ci.XXXXXXXX")"
        chmod 700 "$private_root"
        mkdir -m 700 "$private_root/home" "$private_root/config"
        printf 'PRIVATE_ROOT=%s\nHOME=%s/home\nXDG_CONFIG_HOME=%s/config\nUV_CACHE_DIR=%s/cache\nUV_PROJECT_ENVIRONMENT=%s/venv\nTMPDIR=%s\nXDG_CACHE_HOME=%s/cache\nPYTHONPATH=\nPYTHONHOME=\nPYTHONOPTIMIZE=\nPYTHONNOUSERSITE=1\n' \
          "$private_root" "$private_root" "$private_root" "$private_root" \
          "$private_root" "$private_root" "$private_root" >> "$GITHUB_ENV"
    - name: Checkout exact candidate into first clean tree
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
