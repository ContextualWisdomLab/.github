        assert receipt["installed_distribution_name"] == "cwl-context-contracts"
        assert len(receipt["approved_manifest_canonical_sha256"]) == 64
        assert len(receipt["admission_evidence_sha256"]) == 64
        assert receipt["next_action"] == (
            "verify artifact provenance and runtime authorization before enabling "
            "the integration"
        )
        assert bundle_manifest["manifest_format"] == (
            "cwl-context-bundle-manifest/v1"
        )
        assert bundle_manifest["distribution_name"] == "cwl-context-contracts"
        assert bundle_manifest["algorithm"] == "sha256"
        assert bundle_manifest["resource_count"] == len(bundle_manifest["resources"])
        resource_paths = {
            item["resource_path"] for item in bundle_manifest["resources"]
        }
        assert {
            "schemas/data-management-framework.schema.json",
            "schemas/data-management-assessment.schema.json",
            "fixtures/data-management-contract.valid.json",
            "fixtures/data-management-assessment.valid.json",
            "conformance/data-management-assessment-semantics.v1.json",
            "schemas/metadata-observation-envelope.schema.json",
            "schemas/metadata-projection-receipt.schema.json",
            "fixtures/metadata-observation-envelope.valid.json",
            "conformance/external-metadata-observation-semantics.v1.json",
        } <= resource_paths
        assert bundle_manifest["resources"] == sorted(
            bundle_manifest["resources"],
            key=lambda item: item["resource_path"],
        )
        assert all(len(item["sha256"]) == 64 for item in bundle_manifest["resources"])
        assert bundle_manifest["next_action"] == (
            "store this manifest with approved release evidence and verify semantic "
            "conformance, package provenance, and runtime authorization before "
            "enabling the integration"
        )
        assert bundle_verification == {
            "verification_format": "cwl-context-bundle-verification/v1",
            "verified": True,
            "installed_distribution_name": "cwl-context-contracts",
            "installed_distribution_version": bundle_manifest[
                "distribution_version"
            ],
            "mismatches": [],
            "next_action": "accept the installed contract bundle evidence",
        }
        assert release_admission["admission_format"] == (
            "cwl-context-contract-release-admission/v1"
        )
        assert release_admission["admitted"] is True
        assert release_admission["conformance_admission"]["admitted"] is True
        assert release_admission["bundle_verification"]["verified"] is True
        assert release_admission["next_action"] == (
            "obtain qualifying independent approval and verify artifact provenance, "
            "protected-release evidence, and runtime authorization before enabling "
            "the integration"
        )
        assert package_evidence["verification_format"] == (
            "cwl-context-package-evidence-verification/v1"
        )
        assert package_evidence["verified"] is True
        assert package_evidence["mismatches"] == []
        assert len(package_evidence["artifacts"]) == 3
        assert package_evidence["next_action"] == (
            "verify artifact attestations bind these exact package bytes to the "
            "intended protected main source commit before release"
        )
        assert complete_release_evidence["admission_format"] == (
            "cwl-context-complete-release-evidence-admission/v1"
        )
        assert complete_release_evidence["admitted"] is True
        assert complete_release_evidence["installed_distribution_version"] == (
            bundle_manifest["distribution_version"]
        )
        assert complete_release_evidence["package_distribution_version"] == (
            bundle_manifest["distribution_version"]
        )
        assert complete_release_evidence["release_mismatches"] == []
        assert complete_release_evidence["contract_release_admission"][
            "admitted"
        ] is True
        assert complete_release_evidence["package_evidence_verification"][
            "verified"
        ] is True
        assert complete_release_evidence["next_action"] == (
            "verify artifact attestations bind these exact package bytes to the "
            "intended protected main source commit, generate and independently verify "
            "the attested release-source manifest, then satisfy independent review "
            "and release authorization before publication"
        )
        PY
    - name: Clean private job outputs
      if: ${{ always() && steps.private.outcome == 'success' }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE:?}"
        # Delete only job-owned outputs, never a runner parent or another job's state.
        rm -rf -- dist .package-smoke .receipt-smoke .sbom-venv source-a source-b \
          build-a build-b reproducibility-evidence reproducibility-source \
          reproducibility-build package-reproducibility-evidence
        runner_root="$(cd -- "${RUNNER_TEMP:?}" && pwd -P)"
        private_name="${PRIVATE_ROOT##*/}"
        if [[ ! "$private_name" =~ ^cgc-ci\.[A-Za-z0-9]{8}$ ||
              "$PRIVATE_ROOT" != "$runner_root/$private_name" ||
              -L "$PRIVATE_ROOT" || ! -d "$PRIVATE_ROOT" ]]; then
          echo "private cleanup root is not an owned direct directory" >&2
          exit 1
        fi
        rm -rf -- "$PRIVATE_ROOT"

  required:
    name: CGC required validation
    if: ${{ always() }}
    needs: [test, package, installed-wheel, release-package-reproducibility, package-evidence]
    runs-on:
      group: CWL CI isolated
      labels: [self-hosted, Linux, X64, cwlab-ci-isolated]
    timeout-minutes: 2
    steps:
    - name: Require every producer gate to succeed
      env:
        TEST_RESULT: ${{ needs.test.result }}
        PACKAGE_RESULT: ${{ needs.package.result }}
        INSTALLED_WHEEL_RESULT: ${{ needs.installed-wheel.result }}
        RELEASE_PACKAGE_REPRODUCIBILITY_RESULT: ${{ needs.release-package-reproducibility.result }}
        PACKAGE_EVIDENCE_RESULT: ${{ needs.package-evidence.result }}
      run: |
        set -euo pipefail
        for result in "$TEST_RESULT" "$PACKAGE_RESULT" "$INSTALLED_WHEEL_RESULT" \
          "$RELEASE_PACKAGE_REPRODUCIBILITY_RESULT" "$PACKAGE_EVIDENCE_RESULT"; do
          if [[ "$result" != "success" ]]; then
            echo "a required CGC producer gate did not succeed" >&2
            exit 1
          fi
        done
