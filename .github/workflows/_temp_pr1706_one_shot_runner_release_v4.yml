name: Temporary PR1706 One-shot Runner Release v4

on:
  push:
    branches:
      - fix/opencode-poll-wall-clock-bound
    paths:
      - .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml
      - scripts/ci/temp_pr1706_one_shot_runner_release.py
      - scripts/ci/temp_pr1706_one_shot_runner_release_v2.py
      - tests/test_opencode_required_verdict_runner_release.py

permissions:
  contents: read

concurrency:
  group: temp-pr1706-one-shot-runner-release-v4
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact trigger head without persisted mutation credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile current protected main without rewriting writer history
        run: |
          set -euo pipefail
          git fetch origin main fix/opencode-poll-wall-clock-bound
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked repository test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove prerequisite regression is genuinely RED
        run: |
          set -euo pipefail
          set +e
          red_output="$(PYTHONPATH=. python3 -m pytest -q tests/test_opencode_required_verdict_runner_release.py 2>&1)"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          if [ "$red_status" -ne 1 ] || ! grep -Eq '(^|[[:space:]])[1-9][0-9]* failed([,[:space:]]|$)' <<<"$red_output"; then
            echo "::error::Expected a genuine pytest assertion RED (exit 1 with failed tests), not collection/setup failure or an already-GREEN prerequisite."
            exit 1
          fi

      - name: Apply deterministic causal repair
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci/temp_pr1706_one_shot_runner_release.py
          python3 - <<'PY'
          from pathlib import Path

          driver = Path("scripts/ci/temp_pr1706_one_shot_runner_release_v2.py")
          text = driver.read_text(encoding="utf-8")
          start_token = 'workflow = WORKFLOW.read_text(encoding="utf-8")\n'
          end_token = 'WORKFLOW.write_text(workflow, encoding="utf-8")\n'
          start = text.find(start_token)
          end_start = text.find(end_token, start + len(start_token))
          if start < 0 or end_start < 0:
              raise SystemExit("v2 bounded-transport repair block drifted")
          end = end_start + len(end_token)
          replacement = r'''workflow = WORKFLOW.read_text(encoding="utf-8")
          step_start = "      - name: Fail closed without a current-head OpenCode verdict\n"
          step_end = "\n  cancel-superseded-opencode-review-runs:\n"
          if workflow.count(step_start) != 1 or workflow.count(step_end) != 1:
              raise SystemExit("OpenCode required-verdict step boundaries drifted before bounded transport repair")
          before, rest = workflow.split(step_start, 1)
          target, after = rest.split(step_end, 1)
          target = replace_once(
              target,
              '          live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"\n',
              '          if ! live_pr="$(timeout 30s gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"; then\n'
              '            echo "::error::Live pull request API read failed during one-shot current-head verdict admission; failing closed and releasing the runner."\n'
              '            exit 1\n'
              '          fi\n',
              "bounded live PR read",
          )
          target = replace_once(
              target,
              '          if ! reviews="$(gh api --paginate "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then\n',
              '          if ! reviews="$(timeout 30s gh api --paginate "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then\n',
              "bounded Reviews read",
          )
          WORKFLOW.write_text(before + step_start + target + step_end + after, encoding="utf-8")
          '''
          text = text[:start] + replacement + text[end:]

          old_lookup = '''          for attempt in $(seq 1 12); do
            run="$(timeout 30s gh api "repos/${GH_REPOSITORY}/actions/runs/${REQUIRED_RUN_ID}")"
            required_run="$(printf '%s\\n' "$run" | jq -r --arg head "$PR_HEAD_SHA" --arg pr "$PR_NUMBER" --argjson run_id "$REQUIRED_RUN_ID" '\n'''
          new_lookup = '''          for attempt in $(seq 1 12); do
            if ! run="$(timeout 30s gh api "repos/${GH_REPOSITORY}/actions/runs/${REQUIRED_RUN_ID}")"; then
              echo "::warning::Exact required-run lookup attempt ${attempt}/12 failed; retrying before wake."
              if [ "$attempt" -lt 12 ]; then
                sleep 5
                continue
              fi
              break
            fi
            required_run="$(printf '%s\\n' "$run" | jq -r --arg head "$PR_HEAD_SHA" --arg pr "$PR_NUMBER" --argjson run_id "$REQUIRED_RUN_ID" '\n'''
          if text.count(old_lookup) != 1:
              raise SystemExit("v2 exact-run lookup boundary drifted")
          text = text.replace(old_lookup, new_lookup, 1)

          old_parse = '''            ')"
            IFS=$'\\t' read -r required_run_id required_status required_conclusion <<<"$required_run"
            if [ "$required_status" = "completed" ] && [ "$required_conclusion" = "failure" ]; then
'''
          new_parse = '''            ')" || required_run=""
            if [ -z "$required_run" ]; then
              echo "::warning::Exact required-run lookup attempt ${attempt}/12 returned malformed or nonmatching evidence; retrying before wake."
              if [ "$attempt" -lt 12 ]; then
                sleep 5
                continue
              fi
              break
            fi
            IFS=$'\\t' read -r required_run_id required_status required_conclusion <<<"$required_run"
            if [ "$required_status" = "completed" ] && [ "$required_conclusion" = "failure" ]; then
'''
          if text.count(old_parse) != 1:
              raise SystemExit("v2 exact-run parse boundary drifted")
          text = text.replace(old_parse, new_parse, 1)

          acceptance_marker = '''    assert len(calls) == 2
''', encoding="utf-8")
'''
          acceptance_replacement = r'''    assert len(calls) == 2


def _wake_script() -> str:
    """Extract the exact-run wake shell body from the production dispatch workflow."""
    workflow = DISPATCH_WORKFLOW.read_text(encoding="utf-8")
    step = workflow.split("      - name: Wake exact-head required OpenCode workflow\n", 1)[1]
    block = step.split("        run: |\n", 1)[1].split("\n      - name: Publish repository_dispatch OpenCode status\n", 1)[0]
    return textwrap.dedent(block)


def test_exact_run_wake_retries_transient_lookup_then_reruns_failed_job(tmp_path: Path) -> None:
    """A transient run lookup cannot permanently strand an already posted verdict."""
    bash = shutil.which("bash")
    jq = shutil.which("jq")
    if bash is None or jq is None:
        pytest.skip("bash and jq are required")
    fake_gh = tmp_path / "gh"
    calls = tmp_path / "wake-calls"
    attempts = tmp_path / "wake-attempts"
    fake_gh.write_text(
        "#!/usr/bin/env bash\nset -euo pipefail\nprintf '%s\\n' \"$*\" >>\"$CALLS\"\n"
        "if [[ \"$*\" == \"api repos/ContextualWisdomLab/example/actions/runs/42\" ]]; then\n"
        "  n=0; [[ -f \"$ATTEMPTS\" ]] && n=$(cat \"$ATTEMPTS\"); n=$((n+1)); printf '%s' \"$n\" >\"$ATTEMPTS\"\n"
        "  if [[ \"$n\" -eq 1 ]]; then exit 75; fi\n"
        "  printf '%s\\n' \"$RUN_JSON\"; exit 0\n"
        "fi\n"
        "if [[ \"$*\" == \"api -X POST repos/ContextualWisdomLab/example/actions/runs/42/rerun-failed-jobs\" ]]; then exit 0; fi\n"
        "exit 97\n",
        encoding="utf-8",
    )
    fake_gh.chmod(0o755)
    fake_timeout = tmp_path / "timeout"
    fake_timeout.write_text("#!/usr/bin/env bash\nset -euo pipefail\nshift\nexec \"$@\"\n", encoding="utf-8")
    fake_timeout.chmod(0o755)
    fake_sleep = tmp_path / "sleep"
    fake_sleep.write_text("#!/usr/bin/env bash\nexit 0\n", encoding="utf-8")
    fake_sleep.chmod(0o755)
    run_json = {
        "id": 42,
        "event": "pull_request_target",
        "path": ".github/workflows/opencode-review.yml",
        "pull_requests": [{"number": 1437, "head": {"sha": HEAD_SHA}}],
        "status": "completed",
        "conclusion": "failure",
    }
    result = subprocess.run(
        [bash, "-c", _wake_script()],
        env={
            **os.environ,
            "PATH": f"{tmp_path}{os.pathsep}{os.environ.get('PATH', '')}",
            "CALLS": str(calls),
            "ATTEMPTS": str(attempts),
            "RUN_JSON": json.dumps(run_json),
            "GH_TOKEN": "test-token",
            "GH_REPOSITORY": "ContextualWisdomLab/example",
            "PR_NUMBER": "1437",
            "PR_HEAD_SHA": HEAD_SHA,
            "REQUIRED_RUN_ID": "42",
            "WAKE_TOKEN_SOURCE": "github-token",
        },
        text=True,
        capture_output=True,
        check=False,
    )
    assert result.returncode == 0, result.stderr
    assert "Exact required-run lookup attempt 1/12 failed" in result.stdout
    assert "Re-ran failed jobs for exact-PR/head Required OpenCode Review run 42." in result.stdout
    assert calls.read_text(encoding="utf-8").splitlines() == [
        "api repos/ContextualWisdomLab/example/actions/runs/42",
        "api repos/ContextualWisdomLab/example/actions/runs/42",
        "api -X POST repos/ContextualWisdomLab/example/actions/runs/42/rerun-failed-jobs",
    ]
''', encoding="utf-8")
'''
          if text.count(acceptance_marker) != 1:
              raise SystemExit("v2 acceptance insertion boundary drifted")
          text = text.replace(acceptance_marker, acceptance_replacement, 1)
          driver.write_text(text, encoding="utf-8")
          PY
          PYTHONPATH=. python3 scripts/ci/temp_pr1706_one_shot_runner_release_v2.py
          # Product baseline has its own single-writer lane; do not compete with it here.
          git restore --source=HEAD -- docs/product-technical-gap-baseline.md

      - name: Verify focused GREEN and exact-run identity contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_poll_rate_budget.py \
            tests/test_opencode_poll_self_retirement.py \
            tests/test_opencode_required_verdict_regression.py \
            tests/test_opencode_live_draft_state_regression.py
          python3 -m compileall -q scripts tests
          git diff --check

      - name: Verify broader repository suite and documentation coverage
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest tests -q
          if command -v interrogate >/dev/null 2>&1; then
            interrogate -c pyproject.toml scripts tests
          fi
          git diff --check

      - name: Remove completed one-shot machinery and verify publication scope
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml \
            scripts/ci/temp_pr1706_one_shot_runner_release.py \
            scripts/ci/temp_pr1706_one_shot_runner_release_v2.py
          test ! -e .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml
          test ! -e scripts/ci/temp_pr1706_one_shot_runner_release.py
          test ! -e scripts/ci/temp_pr1706_one_shot_runner_release_v2.py
          git diff --check
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/opencode-review.yml|\
              .github/workflows/opencode-review-dispatch.yml|\
              .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml|\
              scripts/ci/temp_pr1706_one_shot_runner_release.py|\
              scripts/ci/temp_pr1706_one_shot_runner_release_v2.py|\
              tests/test_opencode_required_verdict_runner_release.py|\
              tests/test_opencode_poll_rate_budget.py|\
              tests/test_opencode_poll_self_retirement.py|\
              tests/test_opencode_required_verdict_regression.py|\
              tests/test_opencode_live_draft_state_regression.py|\
              docs/doctoring/opencode-stale-poll-self-retirement.md|\
              ARCHITECTURE.md|CHANGELOG.md) ;;
              *) echo "::error::Unexpected publication path: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD)

      - name: Publish only from unchanged exact writer head with a workflow-triggering credential
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::Publication requires PR_REVIEW_MERGE_TOKEN or OPENCODE_APPROVE_TOKEN so the new exact head can start required workflows; github.token fallback is intentionally refused."
            exit 1
          fi
          git fetch origin fix/opencode-poll-wall-clock-bound
          live_head="$(git rev-parse origin/fix/opencode-poll-wall-clock-bound)"
          if [ "$live_head" != "$EXPECTED_REMOTE_HEAD" ]; then
            echo "::error::Writer branch advanced to $live_head; refusing stale publication."
            exit 1
          fi
          git add -A \
            .github/workflows/opencode-review.yml \
            .github/workflows/opencode-review-dispatch.yml \
            .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml \
            scripts/ci/temp_pr1706_one_shot_runner_release.py \
            scripts/ci/temp_pr1706_one_shot_runner_release_v2.py \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_poll_rate_budget.py \
            tests/test_opencode_poll_self_retirement.py \
            tests/test_opencode_required_verdict_regression.py \
            tests/test_opencode_live_draft_state_regression.py \
            docs/doctoring/opencode-stale-poll-self-retirement.md \
            ARCHITECTURE.md CHANGELOG.md
          git diff --cached --check
          git commit -m "fix(opencode): release required runner after one verdict read"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/ContextualWisdomLab/.github.git"
          git push origin HEAD:fix/opencode-poll-wall-clock-bound