name: Temporary PR1706 One-shot Runner Release v4

on:
  push:
    branches:
      - fix/opencode-poll-wall-clock-bound
    paths:
      - .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml

permissions:
  contents: read

concurrency:
  group: temp-pr1706-one-shot-runner-release-v4
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github' && github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head without persisted mutation credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconcile current protected main without rewriting writer history
        run: |
          set -euo pipefail
          git fetch origin main fix/opencode-poll-wall-clock-bound
          git config user.name "ContextualWisdomLab automation"
          git config user.email "automation@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install locked repository test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove prerequisite regression is genuinely RED
        run: |
          set -euo pipefail
          set +e
          red_output="$(PYTHONPATH=. python3 -m pytest -q tests/test_opencode_required_verdict_runner_release.py 2>&1)"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          if [ "$red_status" -ne 1 ] || ! grep -Eq '(^|[[:space:]])[1-9][0-9]* failed([,[:space:]]|$)' <<<"$red_output"; then
            echo "::error::Expected a genuine pytest assertion RED (exit 1 with failed tests), not collection/setup failure or an already-GREEN prerequisite."
            exit 1
          fi

      - name: Apply deterministic causal repair
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci/temp_pr1706_one_shot_runner_release.py
          PYTHONPATH=. python3 scripts/ci/temp_pr1706_one_shot_runner_release_v2.py
          # Product baseline has its own single-writer lane; do not compete with it here.
          git restore --source=HEAD -- docs/product-technical-gap-baseline.md

      - name: Verify focused GREEN and exact-run identity contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_poll_rate_budget.py \
            tests/test_opencode_poll_self_retirement.py \
            tests/test_opencode_required_verdict_regression.py \
            tests/test_opencode_live_draft_state_regression.py
          python3 -m compileall -q scripts tests
          git diff --check

      - name: Verify broader repository suite and documentation coverage
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest tests -q
          if command -v interrogate >/dev/null 2>&1; then
            interrogate -c pyproject.toml scripts tests
          fi
          git diff --check

      - name: Remove completed one-shot machinery and verify publication scope
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml \
            scripts/ci/temp_pr1706_one_shot_runner_release.py \
            scripts/ci/temp_pr1706_one_shot_runner_release_v2.py
          test ! -e .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml
          test ! -e scripts/ci/temp_pr1706_one_shot_runner_release.py
          test ! -e scripts/ci/temp_pr1706_one_shot_runner_release_v2.py
          git diff --check
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/opencode-review.yml|\
              .github/workflows/opencode-review-dispatch.yml|\
              .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml|\
              scripts/ci/temp_pr1706_one_shot_runner_release.py|\
              scripts/ci/temp_pr1706_one_shot_runner_release_v2.py|\
              tests/test_opencode_required_verdict_runner_release.py|\
              tests/test_opencode_poll_rate_budget.py|\
              tests/test_opencode_poll_self_retirement.py|\
              tests/test_opencode_required_verdict_regression.py|\
              tests/test_opencode_live_draft_state_regression.py|\
              docs/doctoring/opencode-stale-poll-self-retirement.md|\
              ARCHITECTURE.md|CHANGELOG.md) ;;
              *) echo "::error::Unexpected publication path: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD)

      - name: Publish only from unchanged exact writer head with a workflow-triggering credential
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
          PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::Publication requires PR_REVIEW_MERGE_TOKEN or OPENCODE_APPROVE_TOKEN so the new exact head can start required workflows; github.token fallback is intentionally refused."
            exit 1
          fi
          git fetch origin fix/opencode-poll-wall-clock-bound
          live_head="$(git rev-parse origin/fix/opencode-poll-wall-clock-bound)"
          if [ "$live_head" != "$EXPECTED_REMOTE_HEAD" ]; then
            echo "::error::Writer branch advanced to $live_head; refusing stale publication."
            exit 1
          fi
          git add -A \
            .github/workflows/opencode-review.yml \
            .github/workflows/opencode-review-dispatch.yml \
            .github/workflows/_temp_pr1706_one_shot_runner_release_v4.yml \
            scripts/ci/temp_pr1706_one_shot_runner_release.py \
            scripts/ci/temp_pr1706_one_shot_runner_release_v2.py \
            tests/test_opencode_required_verdict_runner_release.py \
            tests/test_opencode_poll_rate_budget.py \
            tests/test_opencode_poll_self_retirement.py \
            tests/test_opencode_required_verdict_regression.py \
            tests/test_opencode_live_draft_state_regression.py \
            docs/doctoring/opencode-stale-poll-self-retirement.md \
            ARCHITECTURE.md CHANGELOG.md
          git diff --cached --check
          git commit -m "fix(opencode): release required runner after one verdict read"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/ContextualWisdomLab/.github.git"
          git push origin HEAD:fix/opencode-poll-wall-clock-bound
