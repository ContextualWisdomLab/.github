name: Temporary PR 1644 Settlement Repair

on:
  push:
    branches:
      - fix/ruleset-owner-plane-reconciler
    paths:
      - scripts/ci/_temp_pr1644_intervening_settlement_repair.py
      - .github/workflows/_temp_pr1644_intervening_settlement_repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false

      - name: Apply exact source repair
        run: python scripts/ci/_temp_pr1644_intervening_settlement_repair.py

      - name: Install hash-locked validation tooling
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Prove focused governance contract
        env:
          COVERAGE_RCFILE: /dev/null
        run: |
          set -euo pipefail
          python -m coverage run --branch --include=scripts/ci/reconcile_ruleset_governance.py -m pytest -q \
            tests/test_ruleset_governance_reconciliation.py \
            tests/test_ruleset_governance_review_regressions.py \
            tests/test_ruleset_governance_review_round2.py \
            tests/test_ruleset_governance_review_round3.py \
            tests/test_ruleset_governance_timeout_regression.py \
            tests/test_ruleset_governance_delayed_recovery_regression.py \
            tests/test_central_required_workflow_ruleset_audit.py \
            tests/test_ruleset_audit_completeness_regression.py \
            tests/test_ruleset_merge_method_shape_regression.py \
            tests/test_solo_maintainer_ruleset_policy.py
          python -m coverage report --fail-under=100 --show-missing --include=scripts/ci/reconcile_ruleset_governance.py
          python -m interrogate --fail-under 100 scripts/ci/reconcile_ruleset_governance.py
          git diff --check

      - name: Commit validated repair and self-retire
        env:
          WRITER_BRANCH: fix/ruleset-owner-plane-reconciler
        run: |
          set -euo pipefail
          git fetch origin "$WRITER_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git rm .github/workflows/_temp_pr1644_intervening_settlement_repair.yml
          git rm scripts/ci/_temp_pr1644_intervening_settlement_repair.py
          git add scripts/ci/reconcile_ruleset_governance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(governance): settle delayed writes across intervening versions'
          git push origin "HEAD:$WRITER_BRANCH"
