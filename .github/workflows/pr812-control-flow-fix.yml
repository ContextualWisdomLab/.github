name: PR 812 control-flow repair

on:
  push:
    branches: [fix/opencode-attempt-scoped-coverage-artifact]
    paths:
      - ".github/workflows/pr812-control-flow-fix.yml"

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github'
      && github.ref == 'refs/heads/fix/opencode-attempt-scoped-coverage-artifact'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/opencode-attempt-scoped-coverage-artifact
          fetch-depth: 1

      - name: Apply test-first control-flow repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git fetch --no-tags origin fix/opencode-attempt-scoped-coverage-artifact
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/opencode-review-dispatch.yml")
          workflow = workflow_path.read_text(encoding="utf-8")

          old_job = """  coverage-evidence:
              name: coverage-evidence
              needs: [validate-pr-metadata, coverage-source-tree]
              if: >-
                always()
                && needs.validate-pr-metadata.result == 'success'
                && needs.coverage-source-tree.result != 'cancelled'
                && github.event_name == 'repository_dispatch'
              runs-on: ubuntu-latest
          """.replace("          ", "")
          new_job = old_job.replace("runs-on: ubuntu-latest", "runs-on: ubuntu-24.04")
          if workflow.count(old_job) != 1:
              raise SystemExit("coverage-evidence runner block did not match exactly once")
          workflow = workflow.replace(old_job, new_job, 1)

          old_diagnostic = """      - name: Report coverage source materialization failure
                if: needs.coverage-source-tree.result != 'success'
                run: |
                  echo "::error::Coverage source tree could not be materialized; see the coverage-source-tree job log for the exact target repository, base SHA, head SHA, and fetch or merge failure."
                  exit 1
          """.replace("          ", "")
          new_diagnostic = """      - name: Diagnose coverage source materialization failure
                if: always() && needs.coverage-source-tree.result != 'success'
                run: |
                  echo "::error::Coverage source tree could not be materialized; see the coverage-source-tree job log for the exact target repository, base SHA, head SHA, and fetch or merge failure."
                  echo "::error::Use a full rerun or a fresh repository dispatch so coverage-source-tree can publish exact current-attempt evidence."
          """.replace("          ", "")
          if workflow.count(old_diagnostic) != 1:
              raise SystemExit("coverage-source diagnostic block did not match exactly once")
          workflow = workflow.replace(old_diagnostic, new_diagnostic, 1)

          old_identity = """      - name: Verify coverage source identity for current workflow attempt
                id: coverage_source_identity
                continue-on-error: true
          """.replace("          ", "")
          new_identity = """      - name: Verify coverage source identity for current workflow attempt
                id: coverage_source_identity
                if: always() && needs.coverage-source-tree.result == 'success'
                continue-on-error: true
          """.replace("          ", "")
          if workflow.count(old_identity) != 1:
              raise SystemExit("coverage-source identity block did not match exactly once")
          workflow = workflow.replace(old_identity, new_identity, 1)

          old_download = """      - name: Download current-attempt materialized pull request merge tree
                if: steps.coverage_source_identity.outcome == 'success'
                id: coverage_source_download
          """.replace("          ", "")
          new_download = """      - name: Download current-attempt materialized pull request merge tree
                if: >-
                  always()
                  && needs.coverage-source-tree.result == 'success'
                  && steps.coverage_source_identity.outcome == 'success'
                id: coverage_source_download
          """.replace("          ", "")
          if workflow.count(old_download) != 1:
              raise SystemExit("coverage-source download block did not match exactly once")
          workflow = workflow.replace(old_download, new_download, 1)

          old_report = """      - name: Report missing current-attempt coverage source
                if: steps.coverage_source_identity.outcome != 'success' || steps.coverage_source_download.outcome != 'success'
                env:
                  GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          """.replace("          ", "")
          new_report = """      - name: Report missing current-attempt coverage source
                if: >-
                  always()
                  && (
                    needs.coverage-source-tree.result != 'success'
                    || steps.coverage_source_identity.outcome != 'success'
                    || steps.coverage_source_download.outcome != 'success'
                  )
                env:
                  GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
                  COVERAGE_SOURCE_RESULT: ${{ needs.coverage-source-tree.result }}
          """.replace("          ", "")
          if workflow.count(old_report) != 1:
              raise SystemExit("missing-source report block did not match exactly once")
          workflow = workflow.replace(old_report, new_report, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          test_path = Path("tests/test_opencode_coverage_artifact_rerun_contract.py")
          test_text = test_path.read_text(encoding="utf-8")
          helper_anchor = """def test_coverage_source_artifact_is_attempt_scoped_and_downloaded_by_id() -> None:
          """
          helper = """def _step_block(job: str, step_name: str, next_step_name: str) -> str:
              \"\"\"Return one workflow step block bounded by its successor.\"\"\"
              start = job.index(f\"      - name: {step_name}\\n\")
              end = job.index(f\"\\n      - name: {next_step_name}\\n\", start)
              return job[start:end]


          """
          if test_text.count(helper_anchor) != 1 or "def _step_block(" in test_text:
              raise SystemExit("test helper insertion anchor was not unique")
          test_text = test_text.replace(helper_anchor, helper + helper_anchor, 1)

          old_test = """def test_missing_or_expired_artifact_fails_with_bounded_recovery_guidance() -> None:
              \"\"\"Fail closed on absent exact evidence without searching earlier attempts.\"\"\"
              workflow = _workflow_text()
              evidence_job = _job_block(workflow, \"coverage-evidence\", \"opencode-review-target\")

              assert \"id: coverage_source_identity\" in evidence_job
              assert \"continue-on-error: true\" in evidence_job
              assert \"id: coverage_source_download\" in evidence_job
              assert (
                  \"if: steps.coverage_source_identity.outcome == 'success'\" in evidence_job
              )
              assert (
                  \"if: steps.coverage_source_identity.outcome != 'success' || \"
                  \"steps.coverage_source_download.outcome != 'success'\"
                  in evidence_job
              )
              assert \"failed-jobs-only rerun\" in evidence_job
              assert \"full rerun or a fresh repository dispatch\" in evidence_job
              assert \"GITHUB_RUN_ATTEMPT\" in evidence_job
              assert \"exit 1\" in evidence_job
              assert \"list-artifacts\" not in evidence_job
              assert \"latest\" not in evidence_job.lower()
          """
          new_test = """def test_missing_or_expired_artifact_fails_with_bounded_recovery_guidance() -> None:
              \"\"\"Fail closed while preserving recovery guidance on every producer outcome.\"\"\"
              workflow = _workflow_text()
              evidence_job = _job_block(workflow, \"coverage-evidence\", \"opencode-review-target\")
              diagnostic = _step_block(
                  evidence_job,
                  \"Diagnose coverage source materialization failure\",
                  \"Verify coverage source identity for current workflow attempt\",
              )
              identity = _step_block(
                  evidence_job,
                  \"Verify coverage source identity for current workflow attempt\",
                  \"Download current-attempt materialized pull request merge tree\",
              )
              download = _step_block(
                  evidence_job,
                  \"Download current-attempt materialized pull request merge tree\",
                  \"Report missing current-attempt coverage source\",
              )
              report = _step_block(
                  evidence_job,
                  \"Report missing current-attempt coverage source\",
                  \"Prepare pull request merge tree for coverage measurement\",
              )

              assert \"if: always() && needs.coverage-source-tree.result != 'success'\" in diagnostic
              assert \"exit 1\" not in diagnostic
              assert \"if: always() && needs.coverage-source-tree.result == 'success'\" in identity
              assert \"continue-on-error: true\" in identity
              assert \"always()\" in download
              assert \"needs.coverage-source-tree.result == 'success'\" in download
              assert \"steps.coverage_source_identity.outcome == 'success'\" in download
              assert \"always()\" in report
              assert \"needs.coverage-source-tree.result != 'success'\" in report
              assert \"steps.coverage_source_identity.outcome != 'success'\" in report
              assert \"steps.coverage_source_download.outcome != 'success'\" in report
              assert \"failed-jobs-only rerun\" in report
              assert \"full rerun or a fresh repository dispatch\" in report
              assert \"GITHUB_RUN_ATTEMPT\" in report
              assert \"exit 1\" in report
              assert \"list-artifacts\" not in evidence_job
              for forbidden_fallback in (
                  \"latest successful artifact\",
                  \"latest coverage artifact\",
                  \"most recent artifact\",
              ):
                  assert forbidden_fallback not in evidence_job.casefold()
          """
          if test_text.count(old_test) != 1:
              raise SystemExit("focused recovery test did not match exactly once")
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding="utf-8")
          PY

          python3 -m venv "${RUNNER_TEMP}/pr812-venv"
          "${RUNNER_TEMP}/pr812-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r requirements-opencode-review-ci-hashes.txt
          "${RUNNER_TEMP}/pr812-venv/bin/python" -m pytest -q \
            tests/test_opencode_coverage_artifact_rerun_contract.py
          python3 -m compileall -q tests/test_opencode_coverage_artifact_rerun_contract.py

          rm .github/workflows/pr812-control-flow-fix.yml
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --check
          git status --short

          git fetch --no-tags origin fix/opencode-attempt-scoped-coverage-artifact
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/opencode-review-dispatch.yml \
            tests/test_opencode_coverage_artifact_rerun_contract.py \
            .github/workflows/pr812-control-flow-fix.yml
          git commit -m "fix(opencode): preserve rerun recovery guidance"
          git push origin HEAD:fix/opencode-attempt-scoped-coverage-artifact
