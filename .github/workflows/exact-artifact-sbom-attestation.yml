name: Exact Artifact SBOM Attestation

on:
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      evidence_artifact_id:
        required: true
        type: string
      evidence_artifact_name:
        required: true
        type: string
      evidence_artifact_digest:
        required: true
        type: string
      wheel_filename:
        required: true
        type: string
      wheel_sha256:
        required: true
        type: string
      wheel_sbom_filename:
        required: true
        type: string
      wheel_sbom_sha256:
        required: true
        type: string
      sdist_filename:
        required: true
        type: string
      sdist_sha256:
        required: true
        type: string
      sdist_sbom_filename:
        required: true
        type: string
      sdist_sbom_sha256:
        required: true
        type: string
      source_identity_sha256:
        required: true
        type: string
      checksum_sha256:
        required: true
        type: string
      predicate_type:
        required: true
        type: string
      cyclonedx_schema:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-evidence-artifact:
    name: Verify inert sealed evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve exact called reusable workflow identity
        id: workflow-identity
        env:
          EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com
          OIDC_AUDIENCE: https://github.com/ContextualWisdomLab/.github/reusable-workflow-source
          EXPECTED_WORKFLOW_PREFIX: ContextualWisdomLab/.github/.github/workflows/exact-artifact-sbom-attestation.yml@
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          oidc_response="${RUNNER_TEMP}/called-workflow-oidc.json"
          umask 077
          trap 'rm -f "$oidc_response"' EXIT
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${OIDC_AUDIENCE}" \
            --output "$oidc_response" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL"
          python3 -I - "$oidc_response" <<'PY'
          import base64
          import json
          import os
          import re
          import sys

          response_path = sys.argv[1]
          try:
              with open(response_path, encoding="utf-8") as handle:
                  token_response = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub OIDC response is not valid JSON") from exc

          token = token_response.get("value")
          if not isinstance(token, str) or not token:
              raise SystemExit("GitHub OIDC response is missing its token value")
          token_parts = token.split(".")
          if len(token_parts) != 3:
              raise SystemExit("GitHub OIDC token is not a JWT")
          encoded_payload = token_parts[1]
          encoded_payload += "=" * (-len(encoded_payload) % 4)
          try:
              payload_bytes = base64.urlsafe_b64decode(encoded_payload.encode("ascii"))
              claims = json.loads(payload_bytes.decode("utf-8"))
          except (UnicodeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub OIDC token payload is malformed") from exc
          if not isinstance(claims, dict):
              raise SystemExit("GitHub OIDC token payload must be an object")

          expected_issuer = os.environ["EXPECTED_OIDC_ISSUER"]
          expected_audience = os.environ["OIDC_AUDIENCE"]
          expected_prefix = os.environ["EXPECTED_WORKFLOW_PREFIX"]
          if claims.get("iss") != expected_issuer:
              raise SystemExit("GitHub OIDC issuer mismatch")
          audience = claims.get("aud")
          audiences = {audience} if isinstance(audience, str) else set(audience or [])
          if expected_audience not in audiences:
              raise SystemExit("GitHub OIDC audience mismatch")
          if claims.get("runner_environment") != "github-hosted":
              raise SystemExit("trusted verifier identity requires a github-hosted runner")

          workflow_ref = claims.get("job_workflow_ref")
          workflow_sha = claims.get("job_workflow_sha")
          if not isinstance(workflow_ref, str) or not workflow_ref.startswith(expected_prefix):
              raise SystemExit("job_workflow_ref does not identify the central reusable workflow")
          if not isinstance(workflow_sha, str) or re.fullmatch(r"[0-9a-f]{40}", workflow_sha) is None:
              raise SystemExit("job_workflow_sha must be a full 40-hex commit SHA")
          ref_sha = workflow_ref[len(expected_prefix):]
          if re.fullmatch(r"[0-9a-f]{40}", ref_sha) is None:
              raise SystemExit("job_workflow_ref must pin the called workflow to a full 40-hex commit SHA")
          if ref_sha != workflow_sha:
              raise SystemExit("job_workflow_ref and job_workflow_sha disagree")

          output_path = os.environ.get("GITHUB_OUTPUT")
          if not output_path:
              raise SystemExit("GITHUB_OUTPUT is unavailable")
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"workflow_sha={workflow_sha}\n")
          PY

      - name: Materialize immutable trusted verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ steps.workflow-identity.outputs.workflow_sha }}
          path: trusted-intake
          persist-credentials: false
          sparse-checkout: scripts/ci/verify_exact_artifact_sbom_handoff.py
          sparse-checkout-cone-mode: false

      - name: Verify immutable same-run artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.evidence_artifact_digest }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          artifact_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          jq -e \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$ARTIFACT_DIGEST" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.name == $name and .digest == $digest and .workflow_run.id == $run_id and .expired == false' \
            <<<"$artifact_json" >/dev/null

      - name: Download exact same-run evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.evidence_artifact_id }}
          path: sealed-evidence

      - name: Verify sealed evidence as inert bounded data
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.evidence_artifact_digest }}
          WHEEL_FILENAME: ${{ inputs.wheel_filename }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          WHEEL_SBOM_FILENAME: ${{ inputs.wheel_sbom_filename }}
          WHEEL_SBOM_SHA256: ${{ inputs.wheel_sbom_sha256 }}
          SDIST_FILENAME: ${{ inputs.sdist_filename }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
          SDIST_SBOM_FILENAME: ${{ inputs.sdist_sbom_filename }}
          SDIST_SBOM_SHA256: ${{ inputs.sdist_sbom_sha256 }}
          SOURCE_IDENTITY_SHA256: ${{ inputs.source_identity_sha256 }}
          CHECKSUM_SHA256: ${{ inputs.checksum_sha256 }}
          PREDICATE_TYPE: ${{ inputs.predicate_type }}
          CYCLONEDX_SCHEMA: ${{ inputs.cyclonedx_schema }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I trusted-intake/scripts/ci/verify_exact_artifact_sbom_handoff.py \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --evidence-artifact-name "$EVIDENCE_ARTIFACT_NAME" \
            --evidence-artifact-digest "$EVIDENCE_ARTIFACT_DIGEST" \
            --evidence-root sealed-evidence \
            --wheel-filename "$WHEEL_FILENAME" \
            --wheel-sha256 "$WHEEL_SHA256" \
            --wheel-sbom-filename "$WHEEL_SBOM_FILENAME" \
            --wheel-sbom-sha256 "$WHEEL_SBOM_SHA256" \
            --sdist-filename "$SDIST_FILENAME" \
            --sdist-sha256 "$SDIST_SHA256" \
            --sdist-sbom-filename "$SDIST_SBOM_FILENAME" \
            --sdist-sbom-sha256 "$SDIST_SBOM_SHA256" \
            --source-identity-sha256 "$SOURCE_IDENTITY_SHA256" \
            --checksum-sha256 "$CHECKSUM_SHA256" \
            --predicate-type "$PREDICATE_TYPE" \
            --cyclonedx-schema "$CYCLONEDX_SCHEMA" \
            --output-manifest "${RUNNER_TEMP}/verified-intake.json"

  attest-exact-artifacts:
    name: Attest exact wheel and sdist SBOMs
    needs: verify-evidence-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve exact called reusable workflow identity
        id: workflow-identity
        env:
          EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com
          OIDC_AUDIENCE: https://github.com/ContextualWisdomLab/.github/reusable-workflow-source
          EXPECTED_WORKFLOW_PREFIX: ContextualWisdomLab/.github/.github/workflows/exact-artifact-sbom-attestation.yml@
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          oidc_response="${RUNNER_TEMP}/called-workflow-oidc.json"
          umask 077
          trap 'rm -f "$oidc_response"' EXIT
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${OIDC_AUDIENCE}" \
            --output "$oidc_response" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL"
          python3 -I - "$oidc_response" <<'PY'
          import base64
          import json
          import os
          import re
          import sys

          response_path = sys.argv[1]
          try:
              with open(response_path, encoding="utf-8") as handle:
                  token_response = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub OIDC response is not valid JSON") from exc

          token = token_response.get("value")
          if not isinstance(token, str) or not token:
              raise SystemExit("GitHub OIDC response is missing its token value")
          token_parts = token.split(".")
          if len(token_parts) != 3:
              raise SystemExit("GitHub OIDC token is not a JWT")
          encoded_payload = token_parts[1]
          encoded_payload += "=" * (-len(encoded_payload) % 4)
          try:
              payload_bytes = base64.urlsafe_b64decode(encoded_payload.encode("ascii"))
              claims = json.loads(payload_bytes.decode("utf-8"))
          except (UnicodeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit("GitHub OIDC token payload is malformed") from exc
          if not isinstance(claims, dict):
              raise SystemExit("GitHub OIDC token payload must be an object")

          expected_issuer = os.environ["EXPECTED_OIDC_ISSUER"]
          expected_audience = os.environ["OIDC_AUDIENCE"]
          expected_prefix = os.environ["EXPECTED_WORKFLOW_PREFIX"]
          if claims.get("iss") != expected_issuer:
              raise SystemExit("GitHub OIDC issuer mismatch")
          audience = claims.get("aud")
          audiences = {audience} if isinstance(audience, str) else set(audience or [])
          if expected_audience not in audiences:
              raise SystemExit("GitHub OIDC audience mismatch")
          if claims.get("runner_environment") != "github-hosted":
              raise SystemExit("trusted verifier identity requires a github-hosted runner")

          workflow_ref = claims.get("job_workflow_ref")
          workflow_sha = claims.get("job_workflow_sha")
          if not isinstance(workflow_ref, str) or not workflow_ref.startswith(expected_prefix):
              raise SystemExit("job_workflow_ref does not identify the central reusable workflow")
          if not isinstance(workflow_sha, str) or re.fullmatch(r"[0-9a-f]{40}", workflow_sha) is None:
              raise SystemExit("job_workflow_sha must be a full 40-hex commit SHA")
          ref_sha = workflow_ref[len(expected_prefix):]
          if re.fullmatch(r"[0-9a-f]{40}", ref_sha) is None:
              raise SystemExit("job_workflow_ref must pin the called workflow to a full 40-hex commit SHA")
          if ref_sha != workflow_sha:
              raise SystemExit("job_workflow_ref and job_workflow_sha disagree")

          output_path = os.environ.get("GITHUB_OUTPUT")
          if not output_path:
              raise SystemExit("GITHUB_OUTPUT is unavailable")
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"workflow_sha={workflow_sha}\n")
          PY

      - name: Materialize immutable trusted verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ContextualWisdomLab/.github
          ref: ${{ steps.workflow-identity.outputs.workflow_sha }}
          path: trusted-signer
          persist-credentials: false
          sparse-checkout: scripts/ci/verify_exact_artifact_sbom_handoff.py
          sparse-checkout-cone-mode: false

      - name: Verify immutable same-run artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.evidence_artifact_digest }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          artifact_json="$(gh api "/repos/${SOURCE_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          jq -e \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$ARTIFACT_DIGEST" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.name == $name and .digest == $digest and .workflow_run.id == $run_id and .expired == false' \
            <<<"$artifact_json" >/dev/null

      - name: Download exact sealed evidence without executing it
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.evidence_artifact_id }}
          path: sealed-evidence

      - name: Reverify evidence inside the credentialed boundary
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.evidence_artifact_digest }}
          WHEEL_FILENAME: ${{ inputs.wheel_filename }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          WHEEL_SBOM_FILENAME: ${{ inputs.wheel_sbom_filename }}
          WHEEL_SBOM_SHA256: ${{ inputs.wheel_sbom_sha256 }}
          SDIST_FILENAME: ${{ inputs.sdist_filename }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
          SDIST_SBOM_FILENAME: ${{ inputs.sdist_sbom_filename }}
          SDIST_SBOM_SHA256: ${{ inputs.sdist_sbom_sha256 }}
          SOURCE_IDENTITY_SHA256: ${{ inputs.source_identity_sha256 }}
          CHECKSUM_SHA256: ${{ inputs.checksum_sha256 }}
          PREDICATE_TYPE: ${{ inputs.predicate_type }}
          CYCLONEDX_SCHEMA: ${{ inputs.cyclonedx_schema }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I trusted-signer/scripts/ci/verify_exact_artifact_sbom_handoff.py \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --evidence-artifact-name "$EVIDENCE_ARTIFACT_NAME" \
            --evidence-artifact-digest "$EVIDENCE_ARTIFACT_DIGEST" \
            --evidence-root sealed-evidence \
            --wheel-filename "$WHEEL_FILENAME" \
            --wheel-sha256 "$WHEEL_SHA256" \
            --wheel-sbom-filename "$WHEEL_SBOM_FILENAME" \
            --wheel-sbom-sha256 "$WHEEL_SBOM_SHA256" \
            --sdist-filename "$SDIST_FILENAME" \
            --sdist-sha256 "$SDIST_SHA256" \
            --sdist-sbom-filename "$SDIST_SBOM_FILENAME" \
            --sdist-sbom-sha256 "$SDIST_SBOM_SHA256" \
            --source-identity-sha256 "$SOURCE_IDENTITY_SHA256" \
            --checksum-sha256 "$CHECKSUM_SHA256" \
            --predicate-type "$PREDICATE_TYPE" \
            --cyclonedx-schema "$CYCLONEDX_SCHEMA" \
            --output-manifest "${RUNNER_TEMP}/verified-signer.json"

      - name: Attest exact wheel with its CycloneDX SBOM
        id: attest-wheel
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ inputs.wheel_filename }}
          subject-digest: sha256:${{ inputs.wheel_sha256 }}
          sbom-path: sealed-evidence/${{ inputs.wheel_sbom_filename }}

      - name: Attest exact source distribution with its CycloneDX SBOM
        id: attest-sdist
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ inputs.sdist_filename }}
          subject-digest: sha256:${{ inputs.sdist_sha256 }}
          sbom-path: sealed-evidence/${{ inputs.sdist_sbom_filename }}

      - name: Verify online and prepare offline bundles
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_REPOSITORY: ContextualWisdomLab/.github
          PREDICATE_TYPE: ${{ inputs.predicate_type }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WHEEL_FILENAME: ${{ inputs.wheel_filename }}
          SDIST_FILENAME: ${{ inputs.sdist_filename }}
          WHEEL_BUNDLE: ${{ steps.attest-wheel.outputs.bundle-path }}
          SDIST_BUNDLE: ${{ steps.attest-sdist.outputs.bundle-path }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          signer_workflow="${SIGNER_REPOSITORY}/.github/workflows/exact-artifact-sbom-attestation.yml"
          mkdir -p offline-attestation-evidence
          install -m 0444 "$WHEEL_BUNDLE" offline-attestation-evidence/wheel-sbom-attestation.json
          install -m 0444 "$SDIST_BUNDLE" offline-attestation-evidence/sdist-sbom-attestation.json
          gh attestation trusted-root > offline-attestation-evidence/trusted_root.jsonl
          for artifact in "$WHEEL_FILENAME" "$SDIST_FILENAME"; do
            gh attestation verify "sealed-evidence/${artifact}" \
              --repo "$SOURCE_REPOSITORY" \
              --signer-repo "$SIGNER_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$SOURCE_SHA" \
              --predicate-type "$PREDICATE_TYPE"
          done
          gh attestation verify "sealed-evidence/${WHEEL_FILENAME}" \
            --repo "$SOURCE_REPOSITORY" \
            --bundle offline-attestation-evidence/wheel-sbom-attestation.json \
            --custom-trusted-root offline-attestation-evidence/trusted_root.jsonl \
            --signer-repo "$SIGNER_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$SOURCE_SHA" \
            --predicate-type "$PREDICATE_TYPE"
          gh attestation verify "sealed-evidence/${SDIST_FILENAME}" \
            --repo "$SOURCE_REPOSITORY" \
            --bundle offline-attestation-evidence/sdist-sbom-attestation.json \
            --custom-trusted-root offline-attestation-evidence/trusted_root.jsonl \
            --signer-repo "$SIGNER_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$SOURCE_SHA" \
            --predicate-type "$PREDICATE_TYPE"
          install -m 0444 "${RUNNER_TEMP}/verified-signer.json" \
            offline-attestation-evidence/verified-handoff.json
          cat > offline-attestation-evidence/README.md <<'EOF'
          # Offline SBOM attestation verification

          This directory is data-only release evidence. It contains the exact
          wheel and source-distribution Sigstore bundles, the GitHub trusted
          root captured during signing, and the independently verified handoff
          manifest. Verify `SHA256SUMS` before using any member.

          A successful signature does not prove that the SBOM is complete or
          that the software is vulnerability-free. Use the exact commands below
          so repository, source, signer, workflow, predicate, bundle, and trust
          root identities remain explicit.
          EOF
          {
            printf '\n## Exact signed identity\n\n'
            printf -- '- Source repository: `%s`\n' "$SOURCE_REPOSITORY"
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Signer repository: `%s`\n' "$SIGNER_REPOSITORY"
            printf -- '- Signer workflow: `%s`\n' "$signer_workflow"
            printf -- '- Predicate type: `%s`\n' "$PREDICATE_TYPE"
            printf -- '- Wheel: `%s`\n' "$WHEEL_FILENAME"
            printf -- '- Source distribution: `%s`\n' "$SDIST_FILENAME"
            cat <<EOF

          ## Online verification commands

              gh attestation verify "sealed-evidence/${WHEEL_FILENAME}" \
                --repo "$SOURCE_REPOSITORY" \
                --signer-repo "$SIGNER_REPOSITORY" \
                --signer-workflow "$signer_workflow" \
                --source-digest "$SOURCE_SHA" \
                --predicate-type "$PREDICATE_TYPE"

              gh attestation verify "sealed-evidence/${SDIST_FILENAME}" \
                --repo "$SOURCE_REPOSITORY" \
                --signer-repo "$SIGNER_REPOSITORY" \
                --signer-workflow "$signer_workflow" \
                --source-digest "$SOURCE_SHA" \
                --predicate-type "$PREDICATE_TYPE"

          ## Offline verification commands

              gh attestation verify "sealed-evidence/${WHEEL_FILENAME}" \
                --repo "$SOURCE_REPOSITORY" \
                --bundle offline-attestation-evidence/wheel-sbom-attestation.json \
                --custom-trusted-root offline-attestation-evidence/trusted_root.jsonl \
                --signer-repo "$SIGNER_REPOSITORY" \
                --signer-workflow "$signer_workflow" \
                --source-digest "$SOURCE_SHA" \
                --predicate-type "$PREDICATE_TYPE"

              gh attestation verify "sealed-evidence/${SDIST_FILENAME}" \
                --repo "$SOURCE_REPOSITORY" \
                --bundle offline-attestation-evidence/sdist-sbom-attestation.json \
                --custom-trusted-root offline-attestation-evidence/trusted_root.jsonl \
                --signer-repo "$SIGNER_REPOSITORY" \
                --signer-workflow "$signer_workflow" \
                --source-digest "$SOURCE_SHA" \
                --predicate-type "$PREDICATE_TYPE"
          EOF
          } >> offline-attestation-evidence/README.md
          (
            cd offline-attestation-evidence
            LC_ALL=C find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | LC_ALL=C sort \
              | while IFS= read -r evidence_file; do
                  sha256sum "$evidence_file"
                done > SHA256SUMS
          )
          chmod 0444 \
            offline-attestation-evidence/README.md \
            offline-attestation-evidence/SHA256SUMS \
            offline-attestation-evidence/trusted_root.jsonl \
            offline-attestation-evidence/verified-handoff.json

      - name: Export beginner-readable offline verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: exact-artifact-sbom-offline-verification
          path: offline-attestation-evidence
          if-no-files-found: error
          retention-days: 90