name: One-shot observed-defect review repair

on:
  push:
    branches:
      - fix/review-observed-defect-corpus-20260902
    paths:
      - .github/workflows/review-observed-defect-writer.yml

permissions:
  contents: write

concurrency:
  group: one-shot-observed-defect-review-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current writer branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/review-observed-defect-corpus-20260902
          fetch-depth: 0

      - name: Converge with protected main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi

      - name: Install repository-declared review test dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Verify RED regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci/_tmp_review_observed_defect_repair.py red
          red_tests=(
            test_noema_rejects_boolean_line_alias
            test_noema_comment_cannot_bypass_required_evidence
            test_opencode_requires_distinct_observed_probe_classes
          )
          red_count=0
          for red_test in "${red_tests[@]}"; do
            echo "Expecting RED: ${red_test}"
            if PYTHONPATH=. python3 -m pytest -q "tests/test_review_observed_defect_corpus.py::${red_test}"; then
              echo "::notice::${red_test} is already GREEN on the converged writer branch."
            else
              red_count=$((red_count + 1))
            fi
          done
          if [ "$red_count" -eq 0 ]; then
            echo "::error::All targeted regressions were already GREEN before this repair; refusing duplicate mutation."
            exit 1
          fi

      - name: Apply causal GREEN repair
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci/_tmp_review_observed_defect_repair.py green

      - name: Remove temporary repair machinery
        run: |
          set -euo pipefail
          git rm .github/workflows/review-observed-defect-writer.yml
          git rm scripts/ci/_tmp_review_observed_defect_repair.py
          test ! -e .github/workflows/review-observed-defect-writer.yml
          test ! -e scripts/ci/_tmp_review_observed_defect_repair.py

      - name: Focused GREEN verification
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_review_observed_defect_corpus.py \
            tests/test_noema_review_gate.py \
            tests/test_opencode_review_normalize_output.py \
            tests/test_opencode_existing_approval_gate.py \
            tests/test_opencode_agent_contract.py \
            tests/test_required_workflow_queue_contract.py
          python3 -m compileall -q scripts/ci tests
          interrogate --fail-under=100 scripts/ci/review_probe_taxonomy.py
          git diff --check

      - name: Broader repository verification
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q tests
          test ! -e .github/workflows/review-observed-defect-writer.yml
          test ! -e scripts/ci/_tmp_review_observed_defect_repair.py
          git diff --check

      - name: Commit and push verified repair
        run: |
          set -euo pipefail
          test ! -e .github/workflows/review-observed-defect-writer.yml
          test ! -e scripts/ci/_tmp_review_observed_defect_repair.py
          git status --short
          git add -A
          git commit -m "fix(review): enforce observed defect probe diversity"
          git push origin HEAD:fix/review-observed-defect-corpus-20260902
