          def _class_evidence(kind: str, line: int, *, side: str | None = "RIGHT") -> dict[str, object]:
              evidence: dict[str, object] = {}
              for index, field in enumerate(OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS[kind], start=1):
