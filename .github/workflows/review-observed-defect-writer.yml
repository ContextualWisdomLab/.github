          # Observed-defect review corpus

          ## Decision

          Noema and OpenCode production review admission must attack independently observed
          defect shapes, not merely emit two differently worded generic probes. The shared
          taxonomy is executable policy in `scripts/ci/review_probe_taxonomy.py`; the corpus in
          `tests/fixtures/review_observed_defect_cases.json` records observable public cases and
          provenance without copying proprietary reviewer language or claiming benchmark
          superiority.

          ## Current classes

          The closed set covers mutable aliases, validation/use TOCTOU, execution identity,
          coercion/canonicality boundaries, weak test oracles, cross-contract contradictions,
          authority boundaries, omitted dependency context, and state-machine races. Material
          changes require two distinct classes when the trusted workflow enables the policy.

          Each class carries three named witnesses. Every witness repeats the exact probe source
          coordinate and adds a distinct concrete observation. These labels supplement, rather
          than replace, OpenCode's current-head changed-file manifest and SHA-256 source-line
          receipt or Noema's exact changed-side diff coordinate.

          ## Observable regression sources

          The initial corpus is grounded in public review evidence from
          `ContextualWisdomLab/noema#528`, `ContextualWisdomLab/.github#1589`, and
          `ContextualWisdomLab/.github#1623`. These sources demonstrated mutable aliasing,
          changing-getter/Proxy TOCTOU, execution identity confusion, a weak substring oracle,
          cross-document contradiction, bool/int line coercion, missing merge-base dependency
          context, reviewer/control-plane authority confusion, and workflow lifecycle races.
          The corpus means only that these defect shapes must be attacked; it does not assert
          that any reviewer is universally better than another.

          ## Failure semantics

          Missing/unknown classes, repeated classes on a material approval, malformed or bool
          line coordinates, vacuous/repeated class observations, or class witnesses detached
          from the exact probe location fail closed. Production Noema comment verdicts also pass
          the same completed-review evidence admission instead of bypassing it. A confirmed
          defect still requires a source-bound finding; labels never manufacture a finding.
          ''')
