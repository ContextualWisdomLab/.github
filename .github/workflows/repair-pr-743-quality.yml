name: Repair PR 743 exact-head quality regressions

on:
  push:
    branches:
      - fix/trusted-uv-lock-coverage-clean

concurrency:
  group: repair-pr-743-quality
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 3
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify repair ancestry and patch source
        run: |
          set -euo pipefail
          expected_parent="5e57877595e2f08014d265bce43064e4e51f250e"
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$expected_parent" ]; then
            printf '::error::Repair trigger parent moved: expected %s, got %s.\n' "$expected_parent" "$actual_parent"
            exit 1
          fi
          test -f scripts/ci/repair_pr_743_quality.py
          python3 scripts/ci/repair_pr_743_quality.py

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Run exact failing regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_opencode_agent_contract.py::test_sandbox_git_config_env_marks_only_the_validated_worktree_safe \
            tests/test_required_workflow_queue_contract.py::test_nvidia_nim_defaults_preserve_existing_fallbacks_without_secret

      - name: Run complete central test and branch coverage gate
        run: |
          set -euo pipefail
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report

      - name: Enforce production documentation and syntax
        run: |
          set -euo pipefail
          python -m interrogate --fail-under 100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_opencode_agent_contract.py \
            tests/test_required_workflow_queue_contract.py
          python -c 'from pathlib import Path; import yaml; [yaml.safe_load(Path(path).read_text(encoding="utf-8")) for path in (".github/workflows/strix.yml", ".github/workflows/repair-pr-743-quality.yml")]'
          git diff --check

      - name: Commit verified repair and remove temporary files
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/repair-pr-743-quality.yml \
            scripts/ci/repair_pr_743_quality.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): make exact-head quality checks hermetic"
          auth_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:fix/trusted-uv-lock-coverage-clean"
