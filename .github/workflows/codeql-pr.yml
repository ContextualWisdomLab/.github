# github/codeql-action cannot run inside a required workflow -- GitHub
# refuses to admit it, 0/43+ across every sampled repository
# (docs/doctoring/codeql-pr-required-workflow-always-fails.md). This file
# stays required-workflow-safe by never calling codeql-action itself: it
# detects languages, fails each analyze-head shard pending to release its
# runner, then one coordinator POSTs repository_dispatch to
# codeql-scan-dispatch.yml (native, unrestricted, in
# ContextualWisdomLab/.github) with the remaining language matrix. The
# handler publishes a base-bound codeql-dispatch/<language>/<base_sha>
# receipt and settles the exact failed language jobs. On rerun each shard
# reads only its authenticated current-base terminal status. Design:
# docs/adr/0025-codeql-required-workflow-dispatch-architecture.md. The
# merge-preview scan (analyze-merge) is required nowhere (PR #1766) and was
# dropped, not migrated.
name: CodeQL PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    # Do not restrict the base ref: the org required-workflow ruleset already
    # scopes this to each repository's actual default branch via
    # ref_name: ["~DEFAULT_BRANCH"], whatever it is named. A hardcoded
    # [main, master, develop] list silently produced zero CodeQL checks for
    # any repository with a different default branch name (confirmed live:
    # a repository defaulting to gh-pages received every other required
    # check but no CodeQL check at all) and would also block coverage for
    # stacked PRs targeting a non-default feature branch, matching
    # security-scan.yml's own "do not restrict the base ref" precedent.

concurrency:
  # NOT scoped by head SHA, unlike opencode-review.yml's group -- and that is
  # a deliberate, tested difference, not an oversight. This file has no
  # dedicated cancel-on-close cleanup job (see
  # tests/test_required_workflow_queue_contract.py::test_pull_request_close_events_cancel_superseded_runs_without_heavy_jobs),
  # so this group's own `cancel-in-progress: true` is the ONLY mechanism that
  # cancels a stale in-flight run when the PR closes. opencode-review.yml can
  # safely add head SHA to its group because it ALSO runs a separate
  # cancel-superseded-opencode-review-runs job that sweeps stale runs via
  # direct API calls regardless of head SHA; adding head SHA here without an
  # equivalent job would let an older, still-in-flight run for a since-
  # superseded head survive a close event indefinitely (it and the closing
  # run would land in different groups and never cancel each other). A
  # narrower risk remains -- a delayed dispatch for an older head could still
  # transiently evict a newer head's in-flight dispatch before that older run's
  # own live-head recheck self-aborts -- tracked as a follow-up requiring a
  # dedicated cleanup job, not a one-line group change.
  group: >-
    codeql-pr-${{
    github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-languages:
    name: Detect CodeQL languages
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      code: ${{ steps.scope.outputs.code }}
      base_sha: ${{ steps.capture-base.outputs.base_sha }}
    steps:
      - name: Capture CodeQL attempt base
        id: capture-base
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_state="$(jq -r '.state // empty' <<<"$live_pr")"
          live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
          live_base_repository="$(jq -r '.base.repo.full_name // empty' <<<"$live_pr")"
          live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr")"
          live_base_sha="$(jq -r '.base.sha // empty' <<<"$live_pr")"
          if [ "$live_state" != "open" ] ||
            [ "${live_head,,}" != "${PR_HEAD_SHA,,}" ] ||
            [ "$live_base_repository" != "$TARGET_REPOSITORY" ] ||
            [ "$live_base_ref" != "$PR_BASE_REF" ] ||
            ! [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::CodeQL attempt base capture rejected stale or malformed live PR metadata."
            exit 1
          fi
          echo "base_sha=${live_base_sha,,}" >>"$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build language matrix
        id: detect
        run: |
          matrix='[]'
          if [ -d .github/workflows ]; then
            matrix=$(echo "$matrix" | jq -c '. + [{"language":"actions","build-mode":"none"}]')
          fi
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path './.git/*' -print -quit | grep -q .; then
            matrix=$(echo "$matrix" | jq -c '. + [{"language":"javascript-typescript","build-mode":"none"}]')
          fi
          if find . -type f -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            matrix=$(echo "$matrix" | jq -c '. + [{"language":"python","build-mode":"none"}]')
          fi
          if find . -type f \( -name '*.java' -o -name '*.kt' -o -name '*.kts' \) \
            -not -path './.git/*' -print -quit | grep -q .; then
            matrix=$(echo "$matrix" | jq -c '. + [{"language":"java-kotlin","build-mode":"none"}]')
          fi
          if [ "$(echo "$matrix" | jq 'length')" -eq 0 ]; then
            matrix='[{"language":"actions","build-mode":"none"}]'
          fi
          {
            echo 'matrix<<EOF'
            jq -nc --argjson include "$matrix" '{include: $include}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -uo pipefail
          code=true
          if [ -n "${PR}" ] && [ -n "${EXPECTED_FILES}" ]; then
            changed=""
            for attempt in 1 2 3; do
              if changed="$(gh api --paginate "repos/${REPO}/pulls/${PR}/files?per_page=100" --jq '.[].filename')" && [ -n "$changed" ]; then
                break
              fi
              changed=""
              sleep $((attempt * 3))
            done
            # GitHub caps /pulls/N/files at 3000 entries; a short list would hide
            # source files behind a doc-only verdict, so require an exact count.
            if [ -n "$changed" ] && [ "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')" = "${EXPECTED_FILES}" ]; then
              code=false
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  *.md|*.markdown|*.rst|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.bmp|*.ico|LICENSE|LICENSE.txt|COPYING|COPYING.txt|NOTICE|NOTICE.txt|.github/ISSUE_TEMPLATE/*) ;;
                  *) code=true ;;
                esac
              done <<<"$changed"
            else
              echo "::notice::changed-scope could not read a complete PR file list; scanning everything."
            fi
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "changed-scope code=${code}"

  analyze-head:
    name: CodeQL compatibility analysis (${{ matrix.language }})
    needs: detect-languages
    # No job-level `if:` on purpose: a job-level condition referencing
    # needs.detect-languages.outputs.* skips this job before its
    # matrix-derived name is expanded, publishing the literal
    # `CodeQL compatibility analysis (${{ matrix.language }})` check-run name
    # instead of one per real language -- decisive live evidence in run
    # 33708209086, guarded by
    # tests/test_docs_only_pr_runner_admission.py::test_codeql_pr_gates_analyze_head_at_step_level_not_job_level.
    # `needs: detect-languages` (only) matches the original, proven-safe
    # dependency exactly; the only case where it's genuinely skipped is a
    # closed PR, where this job being implicitly skipped too is fine because
    # closed PRs need no required check.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-languages.outputs.matrix) }}
    steps:
      - name: Read current-head CodeQL dispatch verdict
        # Shards never dispatch. They re-check the live head, consume an
        # authenticated codeql-dispatch/<language> verdict when one exists,
        # and otherwise fail pending so the runner is released. One
        # coordinator job POSTs the remaining language matrix after every
        # shard has a job id.
        id: dispatch
        if: needs.detect-languages.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ needs.detect-languages.outputs.base_sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LANGUAGE: ${{ matrix.language }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUIRED_RUN_ID: ${{ github.run_id }}
          PRODUCER_SOURCE_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_head="$(printf '%s' "$live_pr" | jq -r '.head.sha // empty')"
          live_state="$(printf '%s' "$live_pr" | jq -r 'if (.state | type) == "string" then .state else empty end')"
          if [ -z "$live_head" ] || [ -z "$live_state" ]; then
            echo "::error::Could not validate live pull request state before CodeQL dispatch."
            exit 1
          fi
          if [ "$live_state" = "closed" ]; then
            echo "PR is closed on the live exact head; a current-head CodeQL scan is not requested."
            exit 0
          fi
          if [ "${live_head,,}" != "${PR_HEAD_SHA,,}" ]; then
            echo "Pull request head moved on the live open PR; a fresh dispatch will fire for the current head."
            exit 0
          fi

          live_base_repository="$(printf '%s' "$live_pr" | jq -r '.base.repo.full_name | select(type == "string")')"
          live_base_ref="$(printf '%s' "$live_pr" | jq -r '.base.ref | select(type == "string")')"
          live_base_sha="$(printf '%s' "$live_pr" | jq -r '.base.sha | select(type == "string")')"
          if [ "$live_base_repository" != "$TARGET_REPOSITORY" ] ||
            [ -z "$live_base_ref" ] || [ -z "${PR_BASE_REF:-}" ] ||
            ! [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
            ! [[ "${PR_BASE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] ||
            ! [[ "${PRODUCER_SOURCE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] ||
            [ "$live_base_ref" != "$PR_BASE_REF" ]; then
            echo "::error::CodeQL live base metadata is missing, malformed, or targets a different base ref; terminal verdict reuse is blocked."
            exit 1
          fi
          if [ "${live_base_sha,,}" != "${PR_BASE_SHA,,}" ]; then
            echo "::error::CodeQL live base advanced after the attempt base was captured; mixed-base evidence is blocked."
            exit 1
          fi

          handler_source_is_compatible() {
            handler_source_sha="$1"
            [[ "$handler_source_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            if [ "${handler_source_sha,,}" = "${PRODUCER_SOURCE_SHA,,}" ]; then
              return 0
            fi
            source_compare="$(gh api "repos/ContextualWisdomLab/.github/compare/${PRODUCER_SOURCE_SHA}...${handler_source_sha}" 2>/dev/null)" || return 1
            printf '%s' "$source_compare" | jq -e \
              --arg source "${PRODUCER_SOURCE_SHA,,}" '
              .status == "ahead"
              and .behind_by == 0
              and ((.base_commit.sha // "" | ascii_downcase) == $source)
              and ((.merge_base_commit.sha // "" | ascii_downcase) == $source)
            ' >/dev/null
          }

          statuses="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/commits/${PR_HEAD_SHA}/statuses?per_page=100")"
          trusted_verdict_state() {
            receipt_context="codeql-dispatch/${LANGUAGE}/${PR_BASE_SHA}"
            receipt_description="cwl1;h=${PR_HEAD_SHA};w=codeql-scan-dispatch;r=${REQUIRED_RUN_ID};s=${PRODUCER_SOURCE_SHA}"
            receipt_evidence='[]'
            while IFS= read -r candidate; do
              creator="$(printf '%s' "$candidate" | jq -r '.creator.login // "" | ascii_downcase')"
              state="$(printf '%s' "$candidate" | jq -r '.state // empty')"
              case "$creator" in
                opencode-agent|opencode-agent\[bot\]) ;;
                github-actions\[bot\])
                  # The default GITHUB_TOKEN can publish only to this workflow's
                  # own repository. Authenticate that narrow fallback through
                  # the exact protected repository_dispatch run, scan job, and
                  # preserved SARIF artifact instead of trusting creator or URL
                  # alone.
                  [ "${TARGET_REPOSITORY,,}" = "contextualwisdomlab/.github" ] || continue
                  [ "${GITHUB_REPOSITORY,,}" = "contextualwisdomlab/.github" ] || continue
                  ;;
                *) continue ;;
              esac
                  target_url="$(printf '%s' "$candidate" | jq -r '.target_url // empty')"
                  producer_run_id="${target_url##*/}"
                  [[ "$producer_run_id" =~ ^[1-9][0-9]*$ ]] || continue
                  if ! producer_run="$(gh api "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}" 2>/dev/null)"; then
                    continue
                  fi
                  handler_source_sha="$(printf '%s' "$producer_run" | jq -r '.head_sha // empty')"
                  handler_source_is_compatible "$handler_source_sha" || continue
                  expected_title="CodeQL Scan Dispatch ${TARGET_REPOSITORY}#${PR_NUMBER}@${PR_HEAD_SHA}/${PR_BASE_SHA}/${REQUIRED_RUN_ID}/${PRODUCER_SOURCE_SHA}"
                  if ! printf '%s' "$producer_run" | jq -e \
                    --argjson run_id "$producer_run_id" --arg title "$expected_title" \
                    --arg source "$PRODUCER_SOURCE_SHA" '
                    .id == $run_id
                    and .event == "repository_dispatch"
                    and .path == ".github/workflows/codeql-scan-dispatch.yml"
                    and .head_branch == "main"
                    and .display_title == $title
                    and .repository.full_name == "ContextualWisdomLab/.github"
                    and ((.actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
                    and ((.triggering_actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
                  ' >/dev/null; then
                    continue
                  fi
                  if ! producer_jobs="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/jobs?filter=latest&per_page=100" 2>/dev/null)"; then
                    continue
                  fi
                  if [ "$(printf '%s' "$producer_jobs" | jq '[.[]?.jobs[]? | select(.name == "validate-dispatch" and .status == "completed" and .conclusion == "success")] | length')" -ne 1 ]; then
                    continue
                  fi
                  expected_job="CodeQL dispatch scan (${LANGUAGE})"
                  job_attempt="$(printf '%s' "$producer_jobs" | jq -r \
                    --arg name "$expected_job" --arg state "$state" '
                    [
                      .[]?.jobs[]?
                      | select(.name == $name and .status == "completed")
                      | select(
                          ($state == "success" and .conclusion == "success")
                          or ($state != "success" and .conclusion == "failure")
                        )
                      | select([.steps[]? | select(.name == "Preserve CodeQL SARIF evidence" and .conclusion == "success")] | length == 1)
                      | select(
                          [.steps[]? | select(.name == "Enforce CodeQL Medium+ SARIF gate") | .conclusion] as $gate
                          | ($gate | length) == 1
                          and (
                            ($state == "success" and $gate[0] == "success")
                            or ($state == "failure" and $gate[0] == "failure")
                            or ($state == "error" and $gate[0] != "success" and $gate[0] != "failure")
                          )
                        )
                      | .run_attempt
                    ] | if length == 1 then .[0] | tostring else empty end
                  ')"
                  [[ "$job_attempt" =~ ^[1-9][0-9]*$ ]] || continue
                  artifact_name="codeql-dispatch-${LANGUAGE}-${producer_run_id}-${job_attempt}"
                  if ! artifacts="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/artifacts?name=${artifact_name}&per_page=100" 2>/dev/null)"; then
                    continue
                  fi
                  if printf '%s' "$artifacts" | jq -e --arg name "$artifact_name" '
                    [.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length == 1
                  ' >/dev/null; then
                    receipt_evidence="$(
                      jq -c --argjson run_id "$producer_run_id" --arg state "$state" \
                        '. + [{run_id:$run_id,state:$state}] | unique_by([.run_id,.state])' \
                        <<<"$receipt_evidence"
                    )"
                  fi
            done < <(printf '%s' "$statuses" | jq -c \
              --arg ctx "$receipt_context" --arg receipt "$receipt_description" '
              .[][]
              | select(.context == $ctx and .description == $receipt)
              | select(.state == "success" or .state == "failure" or .state == "error")
              | select((.target_url // "") | test("^https://github[.]com/ContextualWisdomLab/[.]github/actions/runs/[1-9][0-9]*$"))
            ')
            [ "$(printf '%s' "$receipt_evidence" | jq 'length')" -eq 1 ] || return 1
            printf '%s\n' "$(printf '%s' "$receipt_evidence" | jq -r '.[0].state')"
          }
          trusted_direct_verdict_state() {
            expected_title="CodeQL Scan Dispatch ${TARGET_REPOSITORY}#${PR_NUMBER}@${PR_HEAD_SHA}/${PR_BASE_SHA}/${REQUIRED_RUN_ID}/${PRODUCER_SOURCE_SHA}"
            if ! producer_runs="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/workflows/codeql-scan-dispatch.yml/runs?event=repository_dispatch&per_page=100" 2>/dev/null)"; then
              return 1
            fi
            evidence_count=0
            evidence_state=
            while IFS= read -r producer_run_id; do
              [[ "$producer_run_id" =~ ^[1-9][0-9]*$ ]] || continue
              producer_run="$(gh api "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}" 2>/dev/null)" || continue
              handler_source_sha="$(printf '%s' "$producer_run" | jq -r '.head_sha // empty')"
              handler_source_is_compatible "$handler_source_sha" || continue
              if ! printf '%s' "$producer_run" | jq -e \
                --argjson run_id "$producer_run_id" --arg title "$expected_title" '
                .id == $run_id
                and .event == "repository_dispatch"
                and .path == ".github/workflows/codeql-scan-dispatch.yml"
                and .head_branch == "main"
                and .display_title == $title
                and .repository.full_name == "ContextualWisdomLab/.github"
                and ((.actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
                and ((.triggering_actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
              ' >/dev/null; then
                continue
              fi
              producer_jobs="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/jobs?filter=latest&per_page=100" 2>/dev/null)" || continue
              direct="$(printf '%s' "$producer_jobs" | jq -c --arg name "CodeQL dispatch scan (${LANGUAGE})" '
                [.[]?.jobs[]? | select(.name == "validate-dispatch" and .status == "completed" and .conclusion == "success")] as $validate
                | [.[]?.jobs[]? | select(.name == $name and .status == "completed")
                    | select([.steps[]? | select(.name == "Preserve CodeQL SARIF evidence" and .conclusion == "success")] | length == 1)
                    | {attempt:.run_attempt, gate:([.steps[]? | select(.name == "Enforce CodeQL Medium+ SARIF gate") | .conclusion] | if length == 1 then .[0] else "" end)}] as $scan
                | if ($validate | length) == 1 and ($scan | length) == 1
                  and ($scan[0].attempt | type) == "number" and $scan[0].attempt >= 1
                  and ($scan[0].gate == "success" or $scan[0].gate == "failure")
                  then $scan[0] else empty end
              ')"
              [ -n "$direct" ] || continue
              job_attempt="$(printf '%s' "$direct" | jq -r '.attempt')"
              artifact_name="codeql-dispatch-${LANGUAGE}-${producer_run_id}-${job_attempt}"
              artifacts="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/artifacts?name=${artifact_name}&per_page=100" 2>/dev/null)" || continue
              printf '%s' "$artifacts" | jq -e --arg name "$artifact_name" '
                [.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length == 1
              ' >/dev/null || continue
              evidence_count=$((evidence_count + 1))
              evidence_state="$(printf '%s' "$direct" | jq -r 'if .gate == "success" then "success" else "failure" end')"
            done < <(printf '%s' "$producer_runs" | jq -r --arg title "$expected_title" '
              [.[]?.workflow_runs[]? | select(.display_title == $title) | .id] | unique[] | tostring
            ')
            [ "$evidence_count" -eq 1 ] || return 1
            printf '%s\n' "$evidence_state"
          }
          verdict_state="$(trusted_verdict_state || trusted_direct_verdict_state || true)"
          case "$verdict_state" in
            success|failure|error)
              echo "verdict=${verdict_state}" >>"$GITHUB_OUTPUT"
              echo "Found authenticated current-head CodeQL verdict for ${LANGUAGE}: ${verdict_state}."
              exit 0
              ;;
          esac
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::Exact CodeQL job was rerun without an authenticated terminal verdict."
            exit 1
          fi
          echo "verdict=pending" >>"$GITHUB_OUTPUT"

      - name: Release runner or enforce current-head CodeQL verdict
        if: always() && needs.detect-languages.outputs.code == 'true'
        env:
          LANGUAGE: ${{ matrix.language }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          VERDICT_STATE: ${{ steps.dispatch.outputs.verdict }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_OUTCOME" != "success" ]; then
            echo "::error::CodeQL scan dispatch or exact-head verdict read did not succeed (outcome=${DISPATCH_OUTCOME})."
            exit 1
          fi
          case "$VERDICT_STATE" in
            success)
              echo "Current-head CodeQL dispatch verdict for ${LANGUAGE}: success."
              ;;
            failure|error)
              echo "::error::CodeQL dispatch scan for ${LANGUAGE} did not pass (state=${VERDICT_STATE}). See the linked dispatch run for SARIF evidence."
              exit 1
              ;;
            pending)
              echo "::error::CodeQL scan dispatched. The dispatch workflow will rerun this exact failed CodeQL job after publishing its terminal verdict."
              exit 1
              ;;
            *)
              echo "::error::CodeQL shard has no authenticated current-head verdict or dispatch receipt."
              exit 1
              ;;
          esac

  dispatch-current-head:
    name: Dispatch current-head CodeQL scan
    needs: [detect-languages, analyze-head]
    if: >-
      always()
      && github.event.action != 'closed'
      && github.event.pull_request.state != 'closed'
      && needs.detect-languages.result == 'success'
      && needs.detect-languages.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Dispatch current-head CodeQL scan
        env:
          GH_TOKEN: ${{ github.token }}
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
          TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ needs.detect-languages.outputs.base_sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_RUN_ID: ${{ github.run_id }}
          PRODUCER_SOURCE_SHA: ${{ github.workflow_sha }}
          MATRIX: ${{ needs.detect-languages.outputs.matrix }}
        run: |
          set -euo pipefail
          live_pr="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_head="$(printf '%s' "$live_pr" | jq -r '.head.sha // empty')"
          live_state="$(printf '%s' "$live_pr" | jq -r 'if (.state | type) == "string" then .state else empty end')"
          if [ -z "$live_head" ] || [ -z "$live_state" ]; then
            echo "::error::Could not validate live pull request state before CodeQL dispatch."
            exit 1
          fi
          if [ "$live_state" = "closed" ]; then
            echo "PR is closed on the live exact head; a current-head CodeQL scan is not requested."
            exit 0
          fi
          if [ "${live_head,,}" != "${PR_HEAD_SHA,,}" ]; then
            echo "Pull request head moved on the live open PR; a fresh dispatch will fire for the current head."
            exit 0
          fi
          live_base_repository="$(printf '%s' "$live_pr" | jq -r '.base.repo.full_name | select(type == "string")')"
          live_base_ref="$(printf '%s' "$live_pr" | jq -r '.base.ref | select(type == "string")')"
          live_base_sha="$(printf '%s' "$live_pr" | jq -r '.base.sha | select(type == "string")')"
          if [ "$live_base_repository" != "$TARGET_REPOSITORY" ] ||
            [ -z "$live_base_ref" ] || [ -z "${PR_BASE_REF:-}" ] ||
            ! [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
            ! [[ "${PR_BASE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] ||
            [ "$live_base_ref" != "$PR_BASE_REF" ]; then
            echo "::error::CodeQL coordinator rejected malformed live base metadata or a changed base ref."
            exit 1
          fi
          RERUN_MODE=failed
          if [ "${live_base_sha,,}" != "${PR_BASE_SHA,,}" ]; then
            echo "::notice::CodeQL live base advanced after the attempt capture; dispatching a whole-attempt refresh."
            PR_BASE_SHA="${live_base_sha,,}"
            RERUN_MODE=all
          fi
          if ! [[ "$REQUIRED_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
            ! [[ "$PRODUCER_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::CodeQL dispatch requires a canonical current run id."
            exit 1
          fi

          include_json="$(printf '%s' "$MATRIX" | jq -c '.include // empty' 2>/dev/null || true)"
          if [ -z "$include_json" ] ||
            [ "$(printf '%s' "$include_json" | jq 'type == "array" and length >= 1')" != "true" ]; then
            echo "::error::CodeQL coordinator received an empty or malformed language matrix."
            exit 1
          fi

          jobs_json="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUIRED_RUN_ID}/jobs" --jq '.jobs[]' |
              jq -s '{jobs:.}'
          )"
          matrix_job_ids='[]'
          required_jobs='[]'
          while IFS= read -r entry; do
            language="$(printf '%s' "$entry" | jq -r '.language // empty')"
            expected_name="CodeQL compatibility analysis (${language})"
            job_identity="$(printf '%s' "$jobs_json" | jq -c --arg name "$expected_name" '
              [.jobs[]? | select(.name == $name)]
              | if length == 1 then .[0] else empty end
            ')"
            job_id="$(printf '%s' "$job_identity" | jq -r '.id // empty' 2>/dev/null || true)"
            if ! [[ "$job_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::CodeQL coordinator missing current-head job id for ${language}."
              exit 1
            fi
            matrix_job_ids="$(jq -c --argjson job_id "$job_id" '. + [$job_id]' <<<"$matrix_job_ids")"
            if [ "$RERUN_MODE" = "all" ]; then
              if [ "$(printf '%s' "$job_identity" | jq -r '.status == "completed" and (.conclusion == "success" or .conclusion == "failure")')" != "true" ]; then
                echo "::error::CodeQL whole-attempt refresh requires every matrix job to have a terminal rerunnable conclusion."
                exit 1
              fi
              required_jobs="$(
                jq -c --arg language "$language" --argjson job_id "$job_id" \
                  '. + [{language:$language,job_id:$job_id}]' <<<"$required_jobs"
              )"
            elif [ "$(printf '%s' "$job_identity" | jq -r '.status == "completed" and .conclusion == "failure"')" = "true" ]; then
              required_jobs="$(
                jq -c --arg language "$language" --argjson job_id "$job_id" \
                  '. + [{language:$language,job_id:$job_id}]' <<<"$required_jobs"
              )"
            fi
          done < <(printf '%s' "$include_json" | jq -c '.[]')

          unrelated_failed_jobs="$(printf '%s' "$jobs_json" | jq -c --argjson matrix_ids "$matrix_job_ids" '
            [
              .jobs[]?
              | select(.status == "completed" and .conclusion == "failure")
              | select(.id as $job_id | $matrix_ids | index($job_id) == null)
              | .id
            ]
          ')"
          if [ "$(printf '%s' "$unrelated_failed_jobs" | jq 'length')" -ne 0 ]; then
            echo "::error::CodeQL coordinator rejected failed jobs outside the exact language map."
            exit 1
          fi

          handler_source_is_compatible() {
            handler_source_sha="$1"
            [[ "$handler_source_sha" =~ ^[0-9a-fA-F]{40}$ ]] || return 1
            if [ "${handler_source_sha,,}" = "${PRODUCER_SOURCE_SHA,,}" ]; then
              return 0
            fi
            source_compare="$(gh api "repos/ContextualWisdomLab/.github/compare/${PRODUCER_SOURCE_SHA}...${handler_source_sha}" 2>/dev/null)" || return 1
            printf '%s' "$source_compare" | jq -e \
              --arg source "${PRODUCER_SOURCE_SHA,,}" '
              .status == "ahead"
              and .behind_by == 0
              and ((.base_commit.sha // "" | ascii_downcase) == $source)
              and ((.merge_base_commit.sha // "" | ascii_downcase) == $source)
            ' >/dev/null
          }

          statuses="$(gh api --paginate --slurp "repos/${TARGET_REPOSITORY}/commits/${PR_HEAD_SHA}/statuses?per_page=100")"
          pending_matrix='[]'
          while IFS= read -r entry; do
            language="$(printf '%s' "$entry" | jq -r '.language // empty')"
            LANGUAGE="$language"
            trusted_verdict_state() {
              receipt_context="codeql-dispatch/${LANGUAGE}/${PR_BASE_SHA}"
              receipt_description="cwl1;h=${PR_HEAD_SHA};w=codeql-scan-dispatch;r=${REQUIRED_RUN_ID};s=${PRODUCER_SOURCE_SHA}"
              receipt_evidence='[]'
              while IFS= read -r candidate; do
                creator="$(printf '%s' "$candidate" | jq -r '.creator.login // "" | ascii_downcase')"
                state="$(printf '%s' "$candidate" | jq -r '.state // empty')"
                case "$creator" in
                  opencode-agent|opencode-agent\[bot\]) ;;
                  github-actions\[bot\])
                    [ "${TARGET_REPOSITORY,,}" = "contextualwisdomlab/.github" ] || continue
                    [ "${GITHUB_REPOSITORY,,}" = "contextualwisdomlab/.github" ] || continue
                    ;;
                  *) continue ;;
                esac
                    target_url="$(printf '%s' "$candidate" | jq -r '.target_url // empty')"
                    producer_run_id="${target_url##*/}"
                    [[ "$producer_run_id" =~ ^[1-9][0-9]*$ ]] || continue
                    if ! producer_run="$(gh api "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}" 2>/dev/null)"; then
                      continue
                    fi
                    handler_source_sha="$(printf '%s' "$producer_run" | jq -r '.head_sha // empty')"
                    handler_source_is_compatible "$handler_source_sha" || continue
                    expected_title="CodeQL Scan Dispatch ${TARGET_REPOSITORY}#${PR_NUMBER}@${PR_HEAD_SHA}/${PR_BASE_SHA}/${REQUIRED_RUN_ID}/${PRODUCER_SOURCE_SHA}"
                    if ! printf '%s' "$producer_run" | jq -e \
                      --argjson run_id "$producer_run_id" --arg title "$expected_title" \
                      --arg source "$PRODUCER_SOURCE_SHA" '
                      .id == $run_id
                      and .event == "repository_dispatch"
                      and .path == ".github/workflows/codeql-scan-dispatch.yml"
                      and .head_branch == "main"
                      and .display_title == $title
                      and .repository.full_name == "ContextualWisdomLab/.github"
                      and ((.actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
                      and ((.triggering_actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
                    ' >/dev/null; then
                      continue
                    fi
                    if ! producer_jobs="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/jobs?filter=latest&per_page=100" 2>/dev/null)"; then
                      continue
                    fi
                    if [ "$(printf '%s' "$producer_jobs" | jq '[.[]?.jobs[]? | select(.name == "validate-dispatch" and .status == "completed" and .conclusion == "success")] | length')" -ne 1 ]; then
                      continue
                    fi
                    expected_job="CodeQL dispatch scan (${LANGUAGE})"
                    job_attempt="$(printf '%s' "$producer_jobs" | jq -r \
                      --arg name "$expected_job" --arg state "$state" '
                      [
                        .[]?.jobs[]?
                        | select(.name == $name and .status == "completed")
                        | select(
                            ($state == "success" and .conclusion == "success")
                            or ($state != "success" and .conclusion == "failure")
                          )
                        | select([.steps[]? | select(.name == "Preserve CodeQL SARIF evidence" and .conclusion == "success")] | length == 1)
                        | select(
                            [.steps[]? | select(.name == "Enforce CodeQL Medium+ SARIF gate") | .conclusion] as $gate
                            | ($gate | length) == 1
                            and (
                              ($state == "success" and $gate[0] == "success")
                              or ($state == "failure" and $gate[0] == "failure")
                              or ($state == "error" and $gate[0] != "success" and $gate[0] != "failure")
                            )
                          )
                        | .run_attempt
                      ] | if length == 1 then .[0] | tostring else empty end
                    ')"
                    [[ "$job_attempt" =~ ^[1-9][0-9]*$ ]] || continue
                    artifact_name="codeql-dispatch-${LANGUAGE}-${producer_run_id}-${job_attempt}"
                    if ! artifacts="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/artifacts?name=${artifact_name}&per_page=100" 2>/dev/null)"; then
                      continue
                    fi
                    if printf '%s' "$artifacts" | jq -e --arg name "$artifact_name" '
                      [.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length == 1
                    ' >/dev/null; then
                      receipt_evidence="$(
                        jq -c --argjson run_id "$producer_run_id" --arg state "$state" \
                          '. + [{run_id:$run_id,state:$state}] | unique_by([.run_id,.state])' \
                          <<<"$receipt_evidence"
                      )"
                    fi
              done < <(printf '%s' "$statuses" | jq -c \
                --arg ctx "$receipt_context" --arg receipt "$receipt_description" '
                .[][]
                | select(.context == $ctx and .description == $receipt)
                | select(.state == "success" or .state == "failure" or .state == "error")
                | select((.target_url // "") | test("^https://github[.]com/ContextualWisdomLab/[.]github/actions/runs/[1-9][0-9]*$"))
              ')
              receipt_count="$(printf '%s' "$receipt_evidence" | jq 'length')"
              if [ "$receipt_count" -gt 1 ]; then
                echo ambiguous
                return 0
              fi
              [ "$receipt_count" -eq 1 ] || return 1
              printf '%s\n' "$(printf '%s' "$receipt_evidence" | jq -r '.[0].state')"
            }
            trusted_direct_verdict_state() {
              expected_title="CodeQL Scan Dispatch ${TARGET_REPOSITORY}#${PR_NUMBER}@${PR_HEAD_SHA}/${PR_BASE_SHA}/${REQUIRED_RUN_ID}/${PRODUCER_SOURCE_SHA}"
              if ! producer_runs="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/workflows/codeql-scan-dispatch.yml/runs?event=repository_dispatch&per_page=100" 2>/dev/null)"; then
                return 1
              fi
              evidence_count=0
              evidence_state=
              while IFS= read -r producer_run_id; do
                [[ "$producer_run_id" =~ ^[1-9][0-9]*$ ]] || continue
                producer_run="$(gh api "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}" 2>/dev/null)" || continue
                handler_source_sha="$(printf '%s' "$producer_run" | jq -r '.head_sha // empty')"
                handler_source_is_compatible "$handler_source_sha" || continue
                if ! printf '%s' "$producer_run" | jq -e \
                  --argjson run_id "$producer_run_id" --arg title "$expected_title" '
                  .id == $run_id and .event == "repository_dispatch"
                  and .path == ".github/workflows/codeql-scan-dispatch.yml"
                  and .head_branch == "main"
                  and .display_title == $title
                  and .repository.full_name == "ContextualWisdomLab/.github"
                  and ((.actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
                  and ((.triggering_actor.login // "" | ascii_downcase) == "opencode-agent[bot]")
                ' >/dev/null; then
                  continue
                fi
                producer_jobs="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/jobs?filter=latest&per_page=100" 2>/dev/null)" || continue
                direct="$(printf '%s' "$producer_jobs" | jq -c --arg name "CodeQL dispatch scan (${LANGUAGE})" '
                  [.[]?.jobs[]? | select(.name == "validate-dispatch" and .status == "completed" and .conclusion == "success")] as $validate
                  | [.[]?.jobs[]? | select(.name == $name and .status == "completed")
                      | select([.steps[]? | select(.name == "Preserve CodeQL SARIF evidence" and .conclusion == "success")] | length == 1)
                      | {attempt:.run_attempt, gate:([.steps[]? | select(.name == "Enforce CodeQL Medium+ SARIF gate") | .conclusion] | if length == 1 then .[0] else "" end)}] as $scan
                  | if ($validate | length) == 1 and ($scan | length) == 1
                    and ($scan[0].attempt | type) == "number" and $scan[0].attempt >= 1
                    and ($scan[0].gate == "success" or $scan[0].gate == "failure")
                    then $scan[0] else empty end
                ')"
                [ -n "$direct" ] || continue
                job_attempt="$(printf '%s' "$direct" | jq -r '.attempt')"
                artifact_name="codeql-dispatch-${LANGUAGE}-${producer_run_id}-${job_attempt}"
                artifacts="$(gh api --paginate --slurp "repos/ContextualWisdomLab/.github/actions/runs/${producer_run_id}/artifacts?name=${artifact_name}&per_page=100" 2>/dev/null)" || continue
                printf '%s' "$artifacts" | jq -e --arg name "$artifact_name" '
                  [.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length == 1
                ' >/dev/null || continue
                evidence_count=$((evidence_count + 1))
                evidence_state="$(printf '%s' "$direct" | jq -r 'if .gate == "success" then "success" else "failure" end')"
              done < <(printf '%s' "$producer_runs" | jq -r --arg title "$expected_title" '
                [.[]?.workflow_runs[]? | select(.display_title == $title) | .id] | unique[] | tostring
              ')
              if [ "$evidence_count" -gt 1 ]; then
                echo ambiguous
                return 0
              fi
              [ "$evidence_count" -eq 1 ] || return 1
              printf '%s\n' "$evidence_state"
            }
            verdict_state="$(trusted_verdict_state || trusted_direct_verdict_state || true)"
            case "$verdict_state" in
              success|failure|error)
                echo "Found authenticated current-head CodeQL verdict for ${language}: ${verdict_state}."
                ;;
              ambiguous)
                echo "::error::CodeQL coordinator rejected ambiguous evidence-complete receipts for ${language}."
                exit 1
                ;;
              *)
                pending_matrix="$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$pending_matrix")"
                ;;
            esac
          done < <(printf '%s' "$include_json" | jq -c '.[]')

          if [ "$(printf '%s' "$pending_matrix" | jq 'length')" -eq 0 ]; then
            echo "All detected CodeQL languages already have authenticated terminal verdicts; skipping dispatch."
            exit 0
          fi

          unmapped_pending_languages="$(
            jq -nc --argjson pending "$pending_matrix" --argjson jobs "$required_jobs" '
              ($jobs | map(.language)) as $failed_languages
              | [$pending[].language | select(. as $language | $failed_languages | index($language) == null)]
            '
          )"
          if [ "$(printf '%s' "$unmapped_pending_languages" | jq 'length')" -ne 0 ]; then
            echo "::error::CodeQL coordinator could not bind every pending language to an exact failed job."
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::CodeQL scan dispatch requires GitHub OIDC."
            exit 1
          fi
          separator='&'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] || separator='?'
          oidc_token="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" | jq -r '.value // empty')"
          if [ -z "$oidc_token" ]; then
            echo "::error::CodeQL scan dispatch could not obtain its OIDC token."
            exit 1
          fi
          app_token="$(curl -fsS -X POST -H "Authorization: Bearer ${oidc_token}" "${OPENCODE_API_BASE_URL}/exchange_github_app_token" | jq -r '.token // empty')"
          if [ -z "$app_token" ]; then
            echo "::error::CodeQL scan dispatch could not obtain its repository-scoped app token."
            exit 1
          fi
          echo "::add-mask::$app_token"
          jq -cn \
            --arg target_repository "$TARGET_REPOSITORY" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_base_ref "$PR_BASE_REF" \
            --arg pr_base_sha "$PR_BASE_SHA" \
            --arg pr_head_ref "$PR_HEAD_REF" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg producer_source_sha "$PRODUCER_SOURCE_SHA" \
            --arg rerun_mode "$RERUN_MODE" \
            --argjson matrix "$pending_matrix" \
            --arg required_run_id "$REQUIRED_RUN_ID" \
            --argjson required_jobs "$required_jobs" \
            '{event_type:"codeql-scan",client_payload:{target_repository:$target_repository,pr_number:$pr_number,pr_base_ref:$pr_base_ref,pr_base_sha:$pr_base_sha,pr_head_ref:$pr_head_ref,pr_head_sha:$pr_head_sha,producer_source_sha:$producer_source_sha,rerun_mode:$rerun_mode,matrix:$matrix,required_run_id:$required_run_id,required_jobs:$required_jobs}}' |
            GH_TOKEN="$app_token" gh api -X POST repos/ContextualWisdomLab/.github/dispatches --input -
