name: Organization Commercial Readiness Loop

on:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: organization-commercial-readiness-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coordinate:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORGANIZATION: ContextualWisdomLab
      ROTATION_SEED: ${{ github.run_number }}
      MAX_REPOSITORIES: "200"
      MAX_REVIEW_DISPATCHES: "1"
      MAX_DEVELOPMENT_DISPATCHES: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.13.2
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            api.opencode.ai:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout exact trusted coordinator source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Exchange OpenCode app token for bounded fleet coordination
        id: opencode_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          mark_unavailable() {
            echo "available=false" >>"$GITHUB_OUTPUT"
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OpenCode app token exchange unavailable: OIDC request environment is missing."
            mark_unavailable
            exit 0
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            echo "OpenCode app token exchange unavailable: OIDC token request did not complete."
            mark_unavailable
            exit 0
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "OpenCode app token exchange unavailable: OIDC token response was empty."
            mark_unavailable
            exit 0
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"; then
            echo "OpenCode app token exchange unavailable: app token request did not complete."
            mark_unavailable
            exit 0
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "OpenCode app token exchange unavailable: app token response was empty."
            mark_unavailable
            exit 0
          fi

          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Coordinate one bounded fleet pass
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || steps.opencode_app_token.outputs.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PR_REVIEW_MERGE_TOKEN or the job-bound OpenCode App token exchange is required; neither the reviewer credential nor repository-scoped GITHUB_TOKEN is accepted."
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          python scripts/ci/organization_commercial_readiness_loop.py \
            --organization "$ORGANIZATION" \
            --rotation-seed "$ROTATION_SEED" \
            --max-repositories "$MAX_REPOSITORIES" \
            --max-review-dispatches "$MAX_REVIEW_DISPATCHES" \
            --max-development-dispatches "$MAX_DEVELOPMENT_DISPATCHES" \
            --json-output "$RUNNER_TEMP/organization-commercial-readiness-loop.json"
          python -m json.tool "$RUNNER_TEMP/organization-commercial-readiness-loop.json" >/dev/null

      - name: Preserve the exact fleet receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-commercial-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/organization-commercial-readiness-loop.json
          if-no-files-found: error
          retention-days: 3
