name: Organization Commercial Readiness Loop

on:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: organization-commercial-readiness-loop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coordinate:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ORGANIZATION: ContextualWisdomLab
      ROTATION_SEED: ${{ github.run_number }}
      MAX_REPOSITORIES: "200"
      MAX_REVIEW_DISPATCHES: "1"
      MAX_DEVELOPMENT_DISPATCHES: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.13.2
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout exact trusted coordinator source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Coordinate one bounded fleet pass
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PR_REVIEW_MERGE_TOKEN is not provisioned; recording a bounded no-op until the maintainer credential is configured."
            python - "$RUNNER_TEMP/organization-commercial-readiness-loop.json" <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          from pathlib import Path

          output_path = Path(sys.argv[1])
          output_path.parent.resolve(strict=True)
          if output_path.is_symlink():
              raise RuntimeError("credential-unavailable receipt must not be a symlink")
          rendered = (
              json.dumps(
                  {
                      "status": "skipped_credential_unavailable",
                      "reason": "PR_REVIEW_MERGE_TOKEN is not provisioned",
                      "next_action": "Provision PR_REVIEW_MERGE_TOKEN for the next hourly pass.",
                  },
                  indent=2,
              )
              + "\n"
          )
          descriptor = os.open(
              output_path,
              os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW,
              0o600,
          )
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              handle.write(rendered)
          PY
            {
              echo "## Hourly coordinator: credential unavailable"
              echo "No cross-repository dispatch was attempted. Provision PR_REVIEW_MERGE_TOKEN, then the next hourly pass can resume bounded work."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::add-mask::$GH_TOKEN"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

          python scripts/ci/organization_commercial_readiness_loop.py \
            --organization "$ORGANIZATION" \
            --rotation-seed "$ROTATION_SEED" \
            --max-repositories "$MAX_REPOSITORIES" \
            --max-review-dispatches "$MAX_REVIEW_DISPATCHES" \
            --max-development-dispatches "$MAX_DEVELOPMENT_DISPATCHES" \
            --json-output "$RUNNER_TEMP/organization-commercial-readiness-loop.json"
          python -m json.tool "$RUNNER_TEMP/organization-commercial-readiness-loop.json" >/dev/null

      - name: Preserve the exact fleet receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-commercial-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/organization-commercial-readiness-loop.json
          if-no-files-found: error
          retention-days: 3
