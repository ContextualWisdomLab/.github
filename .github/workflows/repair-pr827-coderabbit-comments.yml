name: Repair PR 827 CodeRabbit comments

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repair-pr827-coderabbit-comments
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 827 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/opencode-rust-coverage-runtime-boundary-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/opencode-rust-coverage-runtime-boundary-main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Apply verified review repairs
        run: |
          set -euo pipefail
          python scripts/ci/repair_pr827_coderabbit_comments.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/opencode-review-dispatch.yml')
          text = path.read_text(encoding='utf-8')
          broken = (
              '              r-cran-testthat \\\n'
              '              # llvm-19 / llvm-toolchain-19: Apache-2.0 WITH LLVM-exception. \\\n'
              '              # See docs/doctoring/opencode-rust-coverage-runtime-boundary.md. \\\n'
              '              llvm-19 \\\n'
          )
          restored = (
              '              r-cran-testthat \\\n'
              '              llvm-19 \\\n'
          )
          if text.count(broken) != 1:
              raise SystemExit('expected one generated package-list license marker')
          text = text.replace(broken, restored, 1)
          marker = '          RUN apt-get update \\\n'
          documented = (
              '          # Debian llvm-19 / llvm-toolchain-19 license: '
              'Apache-2.0 WITH LLVM-exception.\n'
              '          # Source: docs/doctoring/opencode-rust-coverage-runtime-boundary.md.\n'
              + marker
          )
          if text.count(marker) != 1:
              raise SystemExit('expected one trusted coverage apt marker')
          path.write_text(text.replace(marker, documented, 1), encoding='utf-8')
          PY

      - name: Verify materialization, coverage, docs, and syntax
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_materialize_base_python_requirements.py \
            tests/test_opencode_rust_coverage_toolchain_contract.py
          python -m coverage erase
          python -m coverage run -m pytest tests
          python -m coverage report --show-missing --fail-under=100
          python -m compileall -q scripts tests
          git diff --check

      - name: Commit verified repair and remove one-shot files
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-pr827-coderabbit-comments.yml
          rm -f scripts/ci/repair_pr827_coderabbit_comments.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(coverage): preserve bounded requirement includes'
          git push origin HEAD:fix/opencode-rust-coverage-runtime-boundary-main
