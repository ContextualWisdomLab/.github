name: Source Fix 1616 Stale Two-Phase Contracts

on:
  push:
    branches:
      - fix/noema-review-token-expiry-20260901
    paths:
      - .github/workflows/source-fix-1616-stale-contracts.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/noema-review-token-expiry-20260901
          fetch-depth: 1
          persist-credentials: false

      - name: Repair stale workflow contracts and self-remove helper
        id: repair
        env:
          STARTING_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STARTING_HEAD"
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path('tests/test_noema_orchestrator_workflow_contract.py'),
              Path('tests/test_required_workflow_queue_contract.py'),
          ]
          old_step = '"Run Noema LLM review and submit verdict"'
          new_step = '"Prepare Noema model verdict"'
          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old_step)
              if count != 1:
                  raise SystemExit(f'{path}: expected one stale Noema step reference, found {count}')
              path.write_text(text.replace(old_step, new_step, 1), encoding='utf-8')

          orchestrator = files[0]
          text = orchestrator.read_text(encoding='utf-8')
          old = '    assert "python3 -m scripts.ci.noema_review_gate" in workflow\n'
          new = (
              '    assert ".github/actions/noema-review/two_phase.py" in workflow\n'
              '    assert "--prepare-verdict-file" in workflow\n'
              '    assert "--publish-verdict-file" in workflow\n'
              '    assert "python3 -m scripts.ci.noema_review_gate" not in workflow\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected one stale single-process Noema module assertion')
          orchestrator.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/source-fix-1616-stale-contracts.yml
          git diff --check

      - name: Install pinned review test dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

      - name: Verify stale contracts are GREEN
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_orchestrator_workflow_contract.py \
            tests/test_required_workflow_queue_contract.py \
            tests/test_noema_reviewer_token_lifetime.py \
            tests/test_noema_two_phase_handoff.py
          test ! -e .github/workflows/source-fix-1616-stale-contracts.yml
          git diff --check

      - name: Publish only if exact writer head is unchanged
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
          STARTING_HEAD: ${{ steps.repair.outputs.starting_head || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::A non-GITHUB_TOKEN writer credential is required so the repaired head receives synchronize-triggered checks.'
            exit 1
          fi
          writer_branch='fix/noema-review-token-expiry-20260901'
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${writer_branch}" --jq '.object.sha')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(noema): align contracts with two-phase publication'
          gh auth setup-git
          git push origin HEAD:"$writer_branch"
