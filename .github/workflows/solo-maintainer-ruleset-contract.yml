name: Solo Maintainer Ruleset Contract

on:
  push:
    branches: [fix/stacked-pr-central-required-workflows]
    paths:
      - ".github/workflows/solo-maintainer-ruleset-contract.yml"
      - "scripts/ci/audit_central_required_workflows.py"
      - "tests/test_central_required_workflow_ruleset_audit.py"
      - "tests/test_solo_maintainer_ruleset_policy.py"

permissions:
  contents: read

jobs:
  focused-contract:
    name: Focused solo-maintainer ruleset contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Execute focused ruleset contract
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/solo-maintainer-ruleset-requirements.txt" <<'EOF'
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          EOF
          python -m pip install \
            --only-binary=:all: \
            --require-hashes \
            -r "${RUNNER_TEMP}/solo-maintainer-ruleset-requirements.txt"
          python -m pytest -q \
            tests/test_central_required_workflow_ruleset_audit.py \
            tests/test_solo_maintainer_ruleset_policy.py
