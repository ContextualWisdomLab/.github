name: One-shot PR 743 current review fixes

on:
  push:
    branches: [fix/trusted-uv-lock-coverage-clean]
    paths:
      - .github/workflows/one-shot-pr743-current-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: one-shot-pr743-current-review-fixes
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout contributor branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/trusted-uv-lock-coverage-clean
          fetch-depth: 0

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Apply valid current review fixes and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          strix_test_path = Path("scripts/ci/test_strix_quick_gate.sh")
          strix_test = strix_test_path.read_text(encoding="utf-8")
          strix_test = replace_once(
              strix_test,
              "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6",
              "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0",
              "current setup-python pin contract",
          )
          strix_test_path.write_text(strix_test, encoding="utf-8")

          cleanup_path = Path("tests/test_repository_branch_coverage_pr743_cleanup.py")
          cleanup = cleanup_path.read_text(encoding="utf-8")
          anchor = (
              '    WORKFLOW_DIRECTORY / "one-shot-pr743-apply-git-isolation.yml",\n'
              ")\n"
          )
          replacement = (
              '    WORKFLOW_DIRECTORY / "one-shot-pr743-apply-git-isolation.yml",\n'
              '    WORKFLOW_DIRECTORY / "one-shot-pr743-finalize-git-isolation.yml",\n'
              '    WORKFLOW_DIRECTORY / "one-shot-pr743-finalize-git-isolation-v2.yml",\n'
              '    WORKFLOW_DIRECTORY / "one-shot-pr743-current-review-fixes.yml",\n'
              ")\n"
          )
          cleanup = replace_once(
              cleanup,
              anchor,
              replacement,
              "completed one-shot cleanup contract",
          )
          cleanup_path.write_text(cleanup, encoding="utf-8")
          PY
          rm .github/workflows/one-shot-pr743-current-review-fixes.yml

      - name: Verify focused current review contracts
        run: |
          set -euo pipefail
          bash scripts/ci/test_strix_quick_gate.sh
          python -m pytest -q \
            tests/test_repository_branch_coverage_pr743_cleanup.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_repository_branch_coverage_reporting_edges.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py

      - name: Verify complete central quality contract
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 scripts/ci
          python -m compileall -q scripts tests

      - name: Publish verified review fixes
        env:
          BRANCH_NAME: fix/trusted-uv-lock-coverage-clean
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/test_strix_quick_gate.sh \
            tests/test_repository_branch_coverage_pr743_cleanup.py \
            .github/workflows/one-shot-pr743-current-review-fixes.yml
          git diff --cached --quiet && { echo "No current review fixes generated" >&2; exit 1; }
          git commit -m "test(ci): align current PR 743 review contracts"
          git push origin "HEAD:${BRANCH_NAME}"
