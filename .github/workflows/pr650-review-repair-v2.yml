name: PR 650 Review Repair v2

on:
  push:
    branches:
      - claude/fast-mlsirm-pr-review-mt2e1z
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr650-review-repair-v2
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]'
      && (
        github.event_name == 'push'
        || github.event.pull_request.head.ref == 'claude/fast-mlsirm-pr-review-mt2e1z'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: claude/fast-mlsirm-pr-review-mt2e1z
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded review repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/opencode-review-dispatch.yml")
          source = workflow.read_text(encoding="utf-8")

          replacements = (
              (
                  '''          if ! oidc_response="$(
                    curl -fsS \\
                      -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \\
                      "${request_url}${separator}audience=${OIDC_AUDIENCE}"
                  )"; then'''.replace("                  ", ""),
                  '''          if ! oidc_response="$(
                    curl -fsS \\
                      --connect-timeout 5 \\
                      --max-time 20 \\
                      -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \\
                      "${request_url}${separator}audience=${OIDC_AUDIENCE}"
                  )"; then'''.replace("                  ", ""),
                  "OIDC request block",
              ),
              (
                  '''          if ! token_response="$(
                    curl -fsS \\
                      -X POST \\
                      -H "Authorization: Bearer ${oidc_token}" \\
                      "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
                  )"; then'''.replace("                  ", ""),
                  '''          if ! token_response="$(
                    curl -fsS \\
                      --connect-timeout 5 \\
                      --max-time 20 \\
                      -X POST \\
                      -H "Authorization: Bearer ${oidc_token}" \\
                      "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
                  )"; then'''.replace("                  ", ""),
                  "App-token exchange block",
              ),
              (
                  '''          collect_successful_r_cmd_check_evidence() {
                    local output_file="$1"
                    if ! gh pr checks "$PR_NUMBER" \\
                      --repo "$GH_REPOSITORY" \\
                      --json name,state,workflow >"$output_file"; then
                      return 1
                    fi
                    python3 "$GITHUB_WORKSPACE/scripts/ci/r_coverage_peer_gate.py" \\
                      require-check \\
                      --checks-json "$output_file" >/dev/null
                  }'''.replace("                  ", ""),
                  '''          collect_successful_r_cmd_check_evidence() {
                    local output_file="$1"
                    local checks_status
                    if gh pr checks "$PR_NUMBER" \\
                      --repo "$GH_REPOSITORY" \\
                      --json name,state,workflow >"$output_file"; then
                      checks_status=0
                    else
                      checks_status=$?
                    fi
                    case "$checks_status" in
                      0 | 1 | 8) ;;
                      *) return 1 ;;
                    esac
                    if ! jq -e 'type == "array"' "$output_file" >/dev/null; then
                      return 1
                    fi
                    python3 "$GITHUB_WORKSPACE/scripts/ci/r_coverage_peer_gate.py" \\
                      require-check \\
                      --checks-json "$output_file" >/dev/null
                  }'''.replace("                  ", ""),
                  "R CMD peer-check collector",
              ),
          )
          for old, new, label in replacements:
              if new in source:
                  continue
              if source.count(old) != 1:
                  raise SystemExit(f"expected {label} was not found")
              source = source.replace(old, new, 1)
          workflow.write_text(source, encoding="utf-8")

          tests = Path("tests/test_required_workflow_queue_contract.py")
          test_source = tests.read_text(encoding="utf-8")
          marker = "def test_opencode_review_token_exchange_and_r_peer_gate_are_bounded()"
          if marker not in test_source:
              test_source += '''\n\ndef test_opencode_review_token_exchange_and_r_peer_gate_are_bounded():\n    from pathlib import Path\n\n    workflow_text = Path(\n        ".github/workflows/opencode-review-dispatch.yml"\n    ).read_text(encoding="utf-8")\n    initial_exchange = workflow_text.split(\n        "- name: Exchange OpenCode app token for target repository metadata reads", 1\n    )[1].split("- name:", 1)[0]\n    assert initial_exchange.count("--connect-timeout 5") == 2\n    assert initial_exchange.count("--max-time 20") == 2\n    collector = workflow_text.split(\n        "collect_successful_r_cmd_check_evidence() {", 1\n    )[1].split("\\n          }", 1)[0]\n    assert '0 | 1 | 8)' in collector\n    assert \"jq -e 'type == \\\"array\\\"'\" in collector\n    assert 'checks_status=$?' in collector\n'''
              tests.write_text(test_source, encoding="utf-8")
          PY
          rm -f \
            .github/workflows/pr650-review-repair.yml \
            .github/workflows/pr650-review-repair-v2.yml

      - name: Validate focused contracts
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirements_security.py \
            tests/test_required_workflow_queue_contract.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          document = yaml.safe_load(
              Path(".github/workflows/opencode-review-dispatch.yml").read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(document, dict):
              raise SystemExit("workflow did not parse as a mapping")
          PY
          git diff --check
          test ! -e .github/workflows/pr650-review-repair.yml
          test ! -e .github/workflows/pr650-review-repair-v2.yml

      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(review): bound token exchange and preserve peer-check JSON"
          git push origin HEAD:claude/fast-mlsirm-pr-review-mt2e1z
