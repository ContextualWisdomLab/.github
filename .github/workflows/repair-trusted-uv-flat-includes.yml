name: Repair trusted uv flat requirements includes

on:
  push:
    branches:
      - fix/trusted-uv-downloader-current-main
    paths:
      - .github/workflows/repair-trusted-uv-flat-includes.yml

concurrency:
  group: repair-trusted-uv-flat-includes
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-opencode-review-ci-hashes.txt

      - name: Write the failing include regression first
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_materialize_base_python_requirements.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert materializer._is_hash_pinned(b"-r requirements-other.txt\\n")
              assert not materializer._is_hash_pinned(b"-r other-hashes.txt\\n")
              assert not materializer._is_hash_pinned(b"-r ./requirements-other.txt\\n")
              assert not materializer._is_hash_pinned(b"-r ../escape.txt\\n")
              assert materializer._is_bounded_requirement_include(
                  "--requirement requirements-other.txt"
              )
              assert not materializer._is_bounded_requirement_include("-r .")
              assert not materializer._is_bounded_requirement_include("-r -evil.txt")
              assert not materializer._is_bounded_requirement_include("-r ~evil.txt")
              assert not materializer._is_bounded_requirement_include("-r C:foo.txt")
              assert not materializer._is_bounded_requirement_include("-r foo?bar.txt")
              assert not materializer._is_bounded_requirement_include("-r foo#bar.txt")
              assert not materializer._is_bounded_requirement_include(r"-r foo\\\\bar.txt")
              assert not materializer._is_bounded_requirement_include("-r")
              assert not materializer._is_bounded_requirement_include("-r /abs/requirements.txt")
          '''
          new = '''    assert not materializer._is_hash_pinned(b"-r requirements-other.txt\\n")
              assert not materializer._is_hash_pinned(b"-r other-hashes.txt\\n")
              assert not materializer._is_hash_pinned(b"-r ./requirements-other.txt\\n")
              assert not materializer._is_hash_pinned(b"-r ../escape.txt\\n")
              assert not materializer._is_hash_pinned(
                  b"--requirement requirements-other.txt\\n"
              )
          '''
          if old not in text:
              raise SystemExit("expected include assertion block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          set +e
          python -m pytest -q \
            tests/test_materialize_base_python_requirements.py \
            -k hash_pin_detection_includes_pinned_and_excludes_unpinned_or_empty \
            >"${RUNNER_TEMP}/flat-include-red.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/flat-include-red.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::The relative-include regression unexpectedly passed before the production repair."
            exit 1
          fi
          grep -F "assert not True" "${RUNNER_TEMP}/flat-include-red.log" >/dev/null

      - name: Reject includes that cannot survive flat publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/ci/materialize_base_python_requirements.py")
          text = path.read_text(encoding="utf-8")

          text, removed_helpers = re.subn(
              r"\n\ndef _is_candidate_lock_path\(.*?\n\ndef _requirement_lines",
              "\n\ndef _requirement_lines",
              text,
              count=1,
              flags=re.DOTALL,
          )
          if removed_helpers != 1:
              raise SystemExit("expected include helper block was not found")

          replacement = '''def _is_hash_pinned(content: bytes) -> bool:
              """Return whether every installable line is an exact SHA-256 package pin.

              The materializer publishes accepted locks under generated flat file names.
              Relative ``-r`` and ``--requirement`` includes would therefore lose their
              source-relative target and are rejected instead of emitting an unusable
              closure. A global ``--require-hashes`` directive remains optional metadata;
              it is never trust evidence by itself.
              """
              lines = _requirement_lines(content)
              requirement_lines = [line for line in lines if line != "--require-hashes"]
              return bool(requirement_lines) and all(
                  _is_fully_hash_pinned_requirement(line)
                  for line in requirement_lines
              )


          def _is_fully_hash_pinned_requirement'''
          text, replaced_validator = re.subn(
              r"def _is_hash_pinned\(content: bytes\) -> bool:\n.*?\n\ndef _is_fully_hash_pinned_requirement",
              replacement,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if replaced_validator != 1:
              raise SystemExit("expected hash-pin validator was not found")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Align doctoring and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          doc = Path("docs/doctoring/trusted-uv-lock-materialization.md")
          text = doc.read_text(encoding="utf-8")
          anchor = """Generic requirements discovery continues to accept a global
          `--require-hashes` directive because pip performs a later closure preflight.
          """
          addition = """Generic requirements discovery continues to accept a global
          `--require-hashes` directive because pip performs a later closure preflight.
          Relative `-r` and `--requirement` includes are rejected: the materializer
          publishes each accepted lock under a generated flat file name, so preserving an
          include safely would require materializing and rewriting the complete immutable
          include graph rather than leaving a broken source-relative reference.
          """
          if anchor not in text:
              raise SystemExit("doctoring insertion point was not found")
          doc.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          bullet = (
              "- Rejected relative `-r` and `--requirement` directives from flat base-lock "
              "materialization so generated requirement names cannot retain broken or "
              "misdirected source-relative includes.\n"
          )
          marker = "### Fixed\n\n"
          if marker not in text:
              raise SystemExit("CHANGELOG Fixed section was not found")
          if bullet not in text:
              text = text.replace(marker, marker + bullet, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Run trusted uv tests with complete branch coverage
        run: |
          cat >"${RUNNER_TEMP}/trusted-uv-coveragerc" <<'EOF'
          [run]
          branch = True
          include =
              scripts/ci/materialize_base_python_requirements.py

          [report]
          fail_under = 100
          show_missing = True
          EOF
          export COVERAGE_RCFILE="${RUNNER_TEMP}/trusted-uv-coveragerc"
          python -m coverage erase
          python -m coverage run -m pytest \
            tests/test_materialize_base_python_requirements.py \
            tests/test_materialize_uv_export_hash_contract.py \
            tests/test_trusted_uv_download_contract.py \
            tests/test_trusted_uv_portability_and_streaming.py \
            tests/test_uv_export_isolation_contract.py \
            tests/test_uv_redirect_and_coverage_contract.py \
            tests/test_uv_redirect_boundary.py \
            tests/test_uv_workspace_fail_closed.py \
            tests/test_trusted_uv_materializer_quality_workflow_contract.py \
            -q
          python -m coverage report

      - name: Run complete central branch coverage and docstring gates
        run: |
          unset COVERAGE_RCFILE
          python -m coverage erase
          python -m coverage run -m pytest tests -q
          python -m coverage report
          python -m interrogate --fail-under 100 scripts/ci/materialize_base_python_requirements.py
          python -m compileall -q scripts/ci/materialize_base_python_requirements.py tests/test_materialize_base_python_requirements.py

      - name: Commit verified repair and remove one-shot workflow
        env:
          BRANCH_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TRIGGER_SHA"
          git rm .github/workflows/repair-trusted-uv-flat-includes.yml
          git diff --check
          git status --short
          git config user.name "cwl-ci-repair[bot]"
          git config user.email "cwl-ci-repair[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/doctoring/trusted-uv-lock-materialization.md \
            scripts/ci/materialize_base_python_requirements.py \
            tests/test_materialize_base_python_requirements.py
          git commit -m "fix(ci): reject flat requirement includes"
          auth_header="$(printf 'x-access-token:%s' "$BRANCH_PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" \
            push origin "HEAD:refs/heads/fix/trusted-uv-downloader-current-main"
