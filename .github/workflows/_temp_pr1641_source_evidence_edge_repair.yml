name: Temporary PR1641 source evidence edge repair

on:
  push:
    branches:
      - fix/noema-observed-defect-corpus-current-main-20260902
    paths:
      - .github/workflows/_temp_pr1641_source_evidence_edge_repair.yml

permissions:
  contents: write

concurrency:
  group: temp-pr1641-source-evidence-edge-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKFLOW_PUSH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
    steps:
      - name: Checkout exact writer head without persisted mutation credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install hash-locked review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r requirements-opencode-review-ci-hashes.txt

      - name: Revalidate exact writer head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          if [ -z "$remote_head" ] || [ "$remote_head" != "$local_head" ]; then
            echo "::error::writer head moved: local=$local_head remote=$remote_head"
            exit 1
          fi

      - name: Materialize externally demonstrated RED regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path("tests/test_noema_class_evidence_observation_contract.py")
          text = target.read_text(encoding="utf-8")
          marker = "def test_whitespace_only_changed_source_requires_explicit_blank_marker() -> None:"
          if marker not in text:
              text = text.rstrip() + r'''


          def test_whitespace_only_changed_source_requires_explicit_blank_marker() -> None:
              """Whitespace-only source cannot satisfy the quote guard via incidental spacing."""
              source = "    "
              diff = f"""diff --git a/src/tool.py b/src/tool.py
          --- a/src/tool.py
          +++ b/src/tool.py
          @@ -1 +1 @@
          -old = 1
          +{source}
          """
              verdict = _verdict(observations=True, source_excerpt=True)
              for probe in verdict["adversarial_validation"]["probes"]:
                  for field, witness in probe["class_evidence"].items():
                      witness["source_excerpt"] = source
                      witness["observation"] = (
                          f"Incidental    spacing is not a source quote for {probe['probe_kind']}:{field}."
                      )
              with pytest.raises(noema.NoemaModelOutputError, match="quote the exact source_excerpt"):
                  noema.validate_substantive_verdict(verdict, diff, ["src/tool.py"])


          def test_long_changed_line_uses_structural_exact_source_binding() -> None:
              """A source line longer than the prose cap remains reviewable without a vacuous quote."""
              source = "x" * (noema.MAX_THREAD_BODY_CHARS + 64)
              diff = f"""diff --git a/src/tool.py b/src/tool.py
          --- a/src/tool.py
          +++ b/src/tool.py
          @@ -1 +1 @@
          -old = 1
          +{source}
          """
              verdict = _verdict(observations=True, source_excerpt=True)
              for probe in verdict["adversarial_validation"]["probes"]:
                  for field, witness in probe["class_evidence"].items():
                      witness["source_excerpt"] = source
                      witness["observation"] = (
                          f"Bounded structural observation for {probe['probe_kind']}:{field} at the exact cited line."
                      )
              noema.validate_substantive_verdict(verdict, diff, ["src/tool.py"])
          ''' + "\n"
              target.write_text(text, encoding="utf-8")
          PY

      - name: Prove both edge regressions are specifically RED
        shell: bash
        run: |
          set -euo pipefail
          specs=(
            "tests/test_noema_class_evidence_observation_contract.py::test_whitespace_only_changed_source_requires_explicit_blank_marker"
            "tests/test_noema_class_evidence_observation_contract.py::test_long_changed_line_uses_structural_exact_source_binding"
          )
          for spec in "${specs[@]}"; do
            log="$(mktemp)"
            set +e
            python -m pytest -q "$spec" >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            if [ "$status" -eq 0 ]; then
              echo "::error::expected RED regression was already GREEN: $spec"
              exit 1
            fi
            if ! grep -q "1 failed" "$log"; then
              echo "::error::RED was not a test assertion/failure outcome: $spec"
              exit 1
            fi
          done

      - name: Apply smallest source, prompt, test, and traceability repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              target.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

          gate = "scripts/ci/noema_review_gate.py"
          replace_once(
              gate,
              '''        source_marker = source_excerpt if source_excerpt else "<blank>"
          if source_marker not in observation:
              raise NoemaModelOutputError(
                  f"Noema adversarial probe {index} class_evidence.{field} observation "
                  "must quote the exact source_excerpt (or <blank> for an empty line)"
              )
          ''',
              '''        source_is_blank = not source_excerpt.strip()
          source_marker = "<blank>" if source_is_blank else source_excerpt
          # Exact source identity is already established by equality against the
          # trusted changed-line map above. Repeating that source inside bounded
          # prose is an additional anti-vacuity signal only when it can fit.
          if source_is_blank or len(source_excerpt) <= MAX_THREAD_BODY_CHARS:
              if source_marker not in observation:
                  raise NoemaModelOutputError(
                      f"Noema adversarial probe {index} class_evidence.{field} observation "
                      "must quote the exact source_excerpt (or <blank> for an empty line)"
                  )
          ''',
          )
          replace_once(
              gate,
              "The observation must quote that exact source_excerpt (or <blank>) and explain the claimed behavior.",
              "For an empty or whitespace-only line the observation must quote <blank>; for a nonblank source_excerpt no longer than MAX_THREAD_BODY_CHARS it must quote the exact source_excerpt. Longer nonblank lines remain exactly bound by the separately validated source_excerpt field, while observation stays bounded and explains the claimed behavior.",
          )

          append_once(
              "docs/product-technical-gap-baseline.md",
              "## 2026-09-02 — Noema exact-source edge binding",
              '''## 2026-09-02 — Noema exact-source edge binding

          **Observed review misses.** External review found two edge cases in the
          exact changed-line witness contract after the main observed-defect corpus
          landed. A whitespace-only changed line was truthy, so incidental spacing
          in arbitrary prose could satisfy the quote predicate. Conversely, a
          nonblank changed line longer than the 1,200-character observation cap
          could never be repeated inside the bounded observation, making every
          otherwise valid formal verdict impossible for that location.

          **Owner repair.** Exact source identity remains the equality check between
          `class_evidence.source_excerpt` and the trusted changed-side diff map.
          Whitespace-only source is normalized to the explicit `<blank>` observation
          marker. For ordinary bounded lines the observation still quotes the exact
          source text. For longer nonblank lines the already-validated structural
          `source_excerpt` carries exact identity while the observation stays bounded,
          distinct, and bound to the schema-defined claim role. The omission marker
          remains ineligible source evidence.

          **Regression corpus.** The class-evidence suite now proves incidental
          whitespace cannot stand in for a source quote and that an over-cap changed
          line remains admissible without weakening exact source equality. These are
          durable false-positive/false-negative fixtures, not vendor-specific wording.
          ''',
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = (
              "- Harden Noema exact-source evidence edge cases: whitespace-only changed lines now require "
              "the explicit `<blank>` marker, while over-cap nonblank lines use the already-validated "
              "structural source excerpt without forcing impossible repetition inside bounded prose.\n"
          )
          if entry not in text:
              if "## [Unreleased]" in text:
                  text = text.replace("## [Unreleased]\n", "## [Unreleased]\n" + entry, 1)
              elif "## Unreleased" in text:
                  text = text.replace("## Unreleased\n", "## Unreleased\n" + entry, 1)
              else:
                  text = entry + "\n" + text
              changelog.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused GREEN contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts/ci
          python -m pytest -q \
            tests/test_noema_class_evidence_observation_contract.py \
            tests/test_noema_observed_defect_corpus_current_main.py
          git diff --check

      - name: Verify broader Noema suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_noema_*.py
          git diff --check

      - name: Remove temporary repair identity
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temp_pr1641_source_evidence_edge_repair.yml
          if git ls-files | grep -F '_temp_pr1641_source_evidence_edge_repair'; then
            echo "::error::temporary PR1641 repair identity remains tracked"
            exit 1
          fi
          git diff --check

      - name: Commit verified successor and trigger exact-head checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WORKFLOW_PUSH_TOKEN:-}" ]; then
            echo "::error::No workflow-starting mutation credential is configured; refusing github.token publication."
            exit 1
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          local_parent="$(git rev-parse HEAD)"
          if [ "$remote_head" != "$local_parent" ]; then
            echo "::error::writer branch moved before publish: local=$local_parent remote=$remote_head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::repair produced no publishable delta"
            exit 1
          fi
          git commit -m "fix(noema): harden exact-source evidence edge cases"
          git remote set-url origin "https://x-access-token:${WORKFLOW_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
