name: Source fix PR1588 no inference timeout

on:
  push:
    branches: [fix/strix-control-plane-supersession-20260901]
    paths: [.github/source-fix-1588-no-inference-timeout.trigger]

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/strix-control-plane-supersession-20260901
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Remove fixed Strix model-inference timeout
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_name='fix/strix-control-plane-supersession-20260901'
          starting_head="$GITHUB_SHA"
          echo "starting_head=$starting_head" >>"$GITHUB_OUTPUT"
          live_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1588" --jq '.state')"
          pr_head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1588" --jq '.head.ref')"
          test "$live_ref" = "$starting_head"
          test "$pr_state" = open
          test "$pr_head_ref" = "$branch_name"

          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt
          python3 <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/strix.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          if 'export LLM_TIMEOUT=300' not in workflow:
              raise SystemExit('expected fixed Strix LLM timeout is absent; re-evaluate live source')
          workflow = workflow.replace('export LLM_TIMEOUT=300', 'export LLM_TIMEOUT=0')
          if 'export LLM_TIMEOUT=300' in workflow:
              raise SystemExit('fixed Strix LLM timeout remains')
          if 'export LLM_TIMEOUT=0' not in workflow:
              raise SystemExit('disabled Strix LLM timeout is missing')
          workflow_path.write_text(workflow, encoding='utf-8')

          replacements = {
              Path('tests/test_strix_control_plane_supersession.py'): [
                  ('assert "export LLM_TIMEOUT=300" in workflow', 'assert "export LLM_TIMEOUT=0" in workflow'),
              ],
              Path('tests/test_strix_llm_timeout_contract.py'): [
                  ('assert "export LLM_TIMEOUT=300" in workflow', 'assert "export LLM_TIMEOUT=0" in workflow'),
                  ('assert "export LLM_TIMEOUT=0" not in workflow', 'assert "export LLM_TIMEOUT=300" not in workflow'),
              ],
              Path('scripts/ci/test_strix_quick_gate.sh'): [
                  ("assert_file_contains \"$workflow_file\" 'export LLM_TIMEOUT=300' \"strix preserves the current-main bounded model preflight timeout\"", "assert_file_contains \"$workflow_file\" 'export LLM_TIMEOUT=0' \"strix disables the model client inference timeout\""),
                  ("assert_file_not_contains \"$workflow_file\" 'export LLM_TIMEOUT=0'", "assert_file_not_contains \"$workflow_file\" 'export LLM_TIMEOUT=300'"),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # The older one-shot repair explicitly reintroduced the fixed timeout;
          # retire it rather than allowing a delayed run to restore that policy.
          for obsolete in (
              Path('.github/workflows/repair-pr1588-exact-head.yml'),
              Path('.github/repair-pr1588.trigger'),
          ):
              if obsolete.exists():
                  obsolete.unlink()

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          marker = 'Strix fixed model-inference timeout'
          if marker not in changelog_text:
              insert_at = changelog_text.find('\n', changelog_text.find('## [Unreleased]')) + 1
              changelog_text = (
                  changelog_text[:insert_at]
                  + '- Remove the Strix fixed model-inference timeout. `LLM_TIMEOUT=0` preserves the accepted no-wall-clock-deadline inference contract; provider/model slowness is not converted into model-unavailability evidence.\n'
                  + changelog_text[insert_at:]
              )
              changelog.write_text(changelog_text, encoding='utf-8')

          baseline = Path('docs/product-technical-gap-baseline.md')
          baseline_text = baseline.read_text(encoding='utf-8')
          marker = '## 2026-09-01 Strix no-fixed-inference-timeout repair'
          if marker not in baseline_text:
              baseline_text += '''\n\n## 2026-09-01 Strix no-fixed-inference-timeout repair\n\nThe Strix workflow had regressed to `LLM_TIMEOUT=300`, even though the accepted contextual-orchestrator sidecar contract states that model inference has no application-configured fixed wall-clock deadline and the executable quick-gate contract requires `LLM_TIMEOUT=0`. Five minutes is not evidence that a reasoning model is unavailable and therefore cannot act as a routing/admission rule. PR #1588 removes the fixed timeout, retains explicit operator/superseded-head cancellation, and retires its older one-shot helper because that helper explicitly reintroduced the invalid 300-second rule. Exact-head CI and independent review remain authoritative before integration.\n'''
              baseline.write_text(baseline_text, encoding='utf-8')
          PY

          python -m pytest -q tests/test_strix_control_plane_supersession.py tests/test_strix_llm_timeout_contract.py tests/test_required_workflow_queue_contract.py
          bash scripts/ci/test_strix_quick_gate.sh
          git diff --check

          latest_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          latest_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1588" --jq '.state')"
          latest_head_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1588" --jq '.head.ref')"
          test "$latest_ref" = "$starting_head"
          test "$latest_state" = open
          test "$latest_head_ref" = "$branch_name"

          rm -f .github/workflows/source-fix-1588-no-inference-timeout.yml .github/source-fix-1588-no-inference-timeout.trigger
          git add -A
          git diff --cached --check
          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git commit -m 'fix(strix): remove fixed model inference timeout'

      - name: Push repaired exact head
        env:
          GH_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN }}
          STARTING_HEAD: ${{ steps.patch.outputs.starting_head }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::No event-capable branch-write credential is configured.'
            exit 1
          fi
          branch_name='fix/strix-control-plane-supersession-20260901'
          remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" --jq '.object.sha')"
          test "$remote_head" = "$STARTING_HEAD"
          gh auth setup-git
          git push origin HEAD:"$branch_name"
