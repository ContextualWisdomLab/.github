# Reusable Release Tag (workflow_call), centralising the provenance-gated
# release cut that fast-mlsirm previously carried as a standalone
# workflow_dispatch file. See
# docs/adr/0032-release-pipeline-reusable-workflows.md and
# docs/doctoring/release-pipeline-reusable-workflows.md.
#
# The `on: workflow_dispatch` trigger (and any branch restriction) stays in
# each calling repo's own thin workflow file — a workflow_call target cannot
# also be the thing GitHub triggers directly on workflow_dispatch.
#
# Keeps every fail-closed check from the fast-mlsirm original:
# default-branch dispatch, 40-char lowercase release_commit, ancestry on the
# default-branch lineage, pyproject version match, exactly one CHANGELOG
# section, version-cut transition vs parent, optional fragment→aggregate
# drift check, size-capped release notes, refuse overwrite of an existing
# release, resume existing immutable tag only when it already points at
# release_commit, then gh release create --verify-tag --notes-file, then
# optional dispatch of the caller's publish wrapper.
#
# Example caller (.github/workflows/release-tag.yml in a product repo).
# Pin `uses:` to this file's exact commit SHA, not @main.
#
#   name: Release Tag
#   on:
#     workflow_dispatch:
#       inputs:
#         release_version:
#           required: true
#           type: string
#         release_commit:
#           required: true
#           type: string
#   permissions:
#     contents: read
#   concurrency:
#     group: release-tag
#     cancel-in-progress: false
#   jobs:
#     publish-release-tag:
#       uses: ContextualWisdomLab/.github/.github/workflows/release-tag.yml@<commit-sha>
#       with:
#         release_commit: ${{ inputs.release_commit }}
#         central_workflows_ref: <commit-sha>
#         publish_workflow: publish-pypi.yml
#         run_changelog_fragment_check: true
#         # optional: release_version — must match Noema bump when decide_version_with_noema
#       secrets: inherit
#       permissions:
#         contents: write
#         actions: write

name: Reusable Release Tag

on:
  workflow_call:
    inputs:
      release_version:
        description: >-
          Optional human-requested version. When decide_version_with_noema is
          true, this must equal the Noema-computed version or the gate fails
          closed. When decide_version_with_noema is false, this is required.
        required: false
        type: string
        default: ""
      release_commit:
        description: "Release source commit reviewed for this version (full lowercase SHA-1)"
        required: true
        type: string
      decide_version_with_noema:
        description: >-
          Reserved for the future calibrated Noema path. True currently fails
          closed until fast-mlsirm publishes a calibrated decision receipt and
          contextual-orchestrator publishes its immutable client/schema.
        required: false
        type: boolean
        default: false
      central_workflows_ref:
        description: >-
          Exact commit SHA of ContextualWisdomLab/.github that provides
          scripts/ci/noema_semver_bump.py. Must match the uses: pin on this
          reusable workflow.
        required: false
        type: string
        default: ""
      evidence_path:
        description: >-
          Repository-relative evidence pack JSON (API diffs, changelog
          fragments, commit/PR titles). Required when decide_version_with_noema
          is true; must set api_surface_inspected=true or include at least one
          API-surface finding. Missing packs fail closed (no synthesize).
        required: false
        type: string
        default: "release-evidence.json"
      publish_workflow:
        description: >-
          Caller-repo workflow filename to dispatch after the GitHub release
          is published (for example publish-pypi.yml or publish-package.yml).
          Empty skips package-publication dispatch (GitHub release only).
        required: false
        type: string
        default: "publish-pypi.yml"
      run_changelog_fragment_check:
        description: >-
          When true, run `python scripts/render_changelog_fragments.py --check
          CHANGELOG.md` before extracting release notes. Callers without that
          script must set this false.
        required: false
        type: boolean
        default: true
      pyproject_path:
        description: "Repository-relative path to the project file that carries project.version."
        required: false
        type: string
        default: "pyproject.toml"
      changelog_path:
        description: "Repository-relative path to the authoritative CHANGELOG."
        required: false
        type: string
        default: "CHANGELOG.md"
permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.repository }}-${{ inputs.release_commit }}
  cancel-in-progress: false

jobs:
  publish-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name: Verify dispatch targets the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$DISPATCH_REF" != "$expected_ref" ]; then
            echo "release dispatch must target $expected_ref, not $DISPATCH_REF" >&2
            exit 1
          fi
      - name: Validate release source identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0 (release-validated pin)
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - name: Verify the release source is on the current default-branch lineage
        env:
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$RELEASE_COMMIT" ]; then
            echo "checked-out release source does not match release_commit" >&2
            exit 1
          fi
          if ! git cat-file -e "$DISPATCH_SHA^{commit}"; then
            echo "default-branch dispatch commit is unavailable for ancestry verification" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$DISPATCH_SHA"; then
            echo "release commit must be an ancestor of the default branch" >&2
            exit 1
          fi
      - name: Resolve release_version (Noema semver gate or required input)
        id: semver
        env:
          DECIDE_WITH_NOEMA: ${{ inputs.decide_version_with_noema }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          CENTRAL_WORKFLOWS_REF: ${{ inputs.central_workflows_ref }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
          # Live URL/model/API-key clients are fail-closed until contextual-
          # orchestrator publishes a pinned immutable client/schema (ADR-0033).
          # Supply NOEMA_SEMVER_RECORDED_RESPONSE_PATH for offline verdicts, or
          # set decide_version_with_noema=false and pass release_version.
          NOEMA_SEMVER_RECORDED_RESPONSE_PATH: ${{ vars.NOEMA_SEMVER_RECORDED_RESPONSE_PATH || '' }}
        run: |
          set -euo pipefail
          if [ "$DECIDE_WITH_NOEMA" != "true" ]; then
            if [ -z "$REQUESTED_VERSION" ]; then
              echo "release_version is required when decide_version_with_noema is false" >&2
              exit 1
            fi
            # Reject newlines / whitespace injection into GITHUB_ENV/OUTPUT
            # command files, and require canonical three-component core semver.
            if ! printf '%s' "$REQUESTED_VERSION" | grep -Eq '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "release_version must be canonical three-component semver (optional v prefix)" >&2
              exit 1
            fi
            normalized="${REQUESTED_VERSION#v}"
            echo "RELEASE_VERSION=$normalized" >> "$GITHUB_ENV"
            echo "release_version=$normalized" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "automatic Noema semver decision requires a released fast-mlsirm calibrated receipt and immutable contextual-orchestrator client/schema" >&2
          exit 1
          if ! printf '%s' "$CENTRAL_WORKFLOWS_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "central_workflows_ref must be the exact 40-char SHA matching uses: pin" >&2
            exit 1
          fi
          git clone --depth 1 \
            "https://github.com/ContextualWisdomLab/.github.git" \
            .cwl-github-tmp
          git -C .cwl-github-tmp fetch --depth 1 origin "$CENTRAL_WORKFLOWS_REF"
          git -C .cwl-github-tmp checkout --force "$CENTRAL_WORKFLOWS_REF"
          mkdir -p .cwl-github
          cp -R .cwl-github-tmp/scripts .cwl-github/scripts
          rm -rf .cwl-github-tmp

          previous_version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          previous_version="${previous_version#v}"
          if [ -z "$previous_version" ]; then
            previous_version="0.0.0"
          fi

          if [ -f "$EVIDENCE_PATH" ]; then
            cp "$EVIDENCE_PATH" /tmp/release-evidence.json
          else
            echo "release evidence pack missing at $EVIDENCE_PATH; refusing to synthesize an empty API-surface pack (ADR-0033)" >&2
            exit 1
          fi
          PREVIOUS_VERSION_HINT="$previous_version" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("/tmp/release-evidence.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("release evidence pack must be a JSON object")
          if not data.get("previous_version"):
              data["previous_version"] = os.environ["PREVIOUS_VERSION_HINT"]
          # Empty API lists are only valid when the caller asserts the surface
          # was inspected; synthesized fallbacks without that marker are gone.
          api_keys = (
              "removed_public_symbols",
              "renamed_public_symbols",
              "required_arg_promotions",
          )
          inspected = data.get("api_surface_inspected") is True
          has_api_signal = any(
              isinstance(data.get(key), list) and len(data.get(key) or []) > 0
              for key in api_keys
          )
          if not inspected and not has_api_signal:
              raise SystemExit(
                  "release evidence pack must set api_surface_inspected=true "
                  "or include at least one API-surface finding "
                  "(removed/renamed/required-arg); refusing weak pack"
              )
          for key in api_keys + ("deprecated_alias_only",):
              if key in data and not isinstance(data[key], list):
                  raise SystemExit(f"evidence.{key} must be a list when present")
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

          args=(
            --evidence /tmp/release-evidence.json
            --previous-version "$previous_version"
            --output /tmp/noema-semver-provenance.json
            --notes-prefix /tmp/noema-semver-notes-prefix.md
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -n "$REQUESTED_VERSION" ]; then
            args+=(--requested-version "$REQUESTED_VERSION")
          fi
          python3 .cwl-github/scripts/ci/noema_semver_bump.py "${args[@]}"
          release_version="$(python3 -c 'import json; print(json.load(open("/tmp/noema-semver-provenance.json"))["release_version"])')"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          cp /tmp/noema-semver-provenance.json noema-semver-provenance.json
      - name: Verify the requested version is the released source version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PYPROJECT_PATH: ${{ inputs.pyproject_path }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          pyproject_path = Path(os.environ["PYPROJECT_PATH"])
          changelog_path = Path(os.environ["CHANGELOG_PATH"])
          core_semver = re.compile(
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\Z"
          )
          if core_semver.fullmatch(release_version) is None:
              raise SystemExit(
                  "release_version must be a canonical three-component semantic "
                  "version without leading zeros"
              )

          project = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))
          project_version = project["project"]["version"]
          if project_version != release_version:
              raise SystemExit(
                  f"{pyproject_path} version {project_version} does not match "
                  f"requested {release_version}"
              )

          header = f"## [{release_version}] - "
          matches = [
              line
              for line in changelog_path.read_text(encoding="utf-8").splitlines()
              if line.startswith(header)
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one CHANGELOG section for {release_version}; "
                  f"found {len(matches)}"
              )
          PY
      - name: Verify the release source is the version-cut transition
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PYPROJECT_PATH: ${{ inputs.pyproject_path }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          set -euo pipefail
          if ! parent_commit="$(git rev-parse "$RELEASE_COMMIT^" 2>/dev/null)"; then
            echo "release commit must have a verifiable first parent" >&2
            exit 1
          fi
          python3 - "$parent_commit" <<'PY'
          import os
          import subprocess
          import sys
          import tomllib

          parent_commit = sys.argv[1]
          release_version = os.environ["RELEASE_VERSION"]
          pyproject_path = os.environ["PYPROJECT_PATH"]
          changelog_path = os.environ["CHANGELOG_PATH"]

          def parent_text(path: str) -> str:
              result = subprocess.run(
                  ["git", "show", f"{parent_commit}:{path}"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f"release parent is missing required source file {path}"
                  )
              return result.stdout

          parent_project = tomllib.loads(parent_text(pyproject_path))
          parent_version = parent_project["project"]["version"]
          if parent_version == release_version:
              raise SystemExit(
                  "parent project version already equals requested release version"
              )

          header = f"## [{release_version}] - "
          parent_changelog = parent_text(changelog_path).splitlines()
          if any(line.startswith(header) for line in parent_changelog):
              raise SystemExit(
                  "parent CHANGELOG already contains requested release section"
              )
          PY
      - name: Fail closed on fragment to CHANGELOG aggregate drift
        if: inputs.run_changelog_fragment_check
        env:
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          set -euo pipefail
          python scripts/render_changelog_fragments.py --check "$CHANGELOG_PATH"
      - name: Extract the release notes from the CHANGELOG section
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          set -euo pipefail
          awk -v header="## [$RELEASE_VERSION] - " '
            index($0, header) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' "$CHANGELOG_PATH" > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG section for $RELEASE_VERSION is empty" >&2
            exit 1
          fi
      - name: Quote Noema semver verdict in release notes
        if: inputs.decide_version_with_noema
        run: |
          set -euo pipefail
          if [ -f /tmp/noema-semver-notes-prefix.md ]; then
            {
              cat /tmp/noema-semver-notes-prefix.md
              echo
              cat release_notes.md
            } > release_notes.md.tmp
            mv release_notes.md.tmp release_notes.md
          fi
          if [ -f noema-semver-provenance.json ]; then
            echo "Noema semver provenance recorded in noema-semver-provenance.json"
          fi
      - name: Cap the release body below the GitHub release-body limit
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          notes_path = Path("release_notes.md")
          notes_text = notes_path.read_text(encoding="utf-8")
          body_limit = 120_000
          if len(notes_text) > body_limit:
              release_version = os.environ["RELEASE_VERSION"]
              changelog_path = os.environ["CHANGELOG_PATH"]
              repository = os.environ["GITHUB_REPOSITORY"]
              changelog_url = (
                  f"https://github.com/{repository}/blob/"
                  f"v{release_version}/{changelog_path}"
              )
              headings = list(
                  dict.fromkeys(
                      line
                      for line in notes_text.splitlines()
                      if line.startswith("#### ")
                  )
              )
              summary_lines = [
                  "The complete notes for this release exceed GitHub's "
                  "release-body limit, so this body is a summary.",
                  "",
                  f"Full authoritative notes: the `[{release_version}]` "
                  f"section of [{changelog_path}]({changelog_url}).",
                  "",
                  "### Contents",
                  "",
              ]
              summary_lines += [
                  "- " + line[len("#### "):] for line in headings
              ]
              capped_text = "\n".join(summary_lines) + "\n"
              if len(capped_text) > body_limit:
                  capped_text = (
                      capped_text[: body_limit - 60].rsplit("\n", 1)[0]
                      + "\n\n(contents list truncated)\n"
                  )
              notes_path.write_text(capped_text, encoding="utf-8")
          PY
      - name: Verify the release is absent and classify the tag state
        id: release_tag_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          api_status() {
            endpoint="$1"
            response_file="$2"
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint"
          }
          response_file="$(mktemp)"
          status="$(api_status "releases/tags/v$RELEASE_VERSION" "$response_file")"
          case "$status" in
            404)
              ;;
            200)
              echo "release v$RELEASE_VERSION already exists; refusing to overwrite or reuse it" >&2
              exit 1
              ;;
            *)
              cat "$response_file" >&2
              echo "GitHub API returned HTTP $status while checking release v$RELEASE_VERSION" >&2
              exit 1
              ;;
          esac
          status="$(api_status "git/ref/tags/v$RELEASE_VERSION" "$response_file")"
          case "$status" in
            404)
              echo "resume_existing_tag=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag_object = response.get("object", {})
          actual_tag_sha = tag_object.get("sha")
          if (
              tag_object.get("type") != "commit"
              or actual_tag_sha != os.environ["RELEASE_COMMIT"]
          ):
              raise SystemExit(
                  "existing tag does not target the requested release commit"
              )
          PY
              echo "tag v$RELEASE_VERSION exists without a release; resuming publication for the existing immutable tag"
              echo "resume_existing_tag=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cat "$response_file" >&2
              echo "GitHub API returned HTTP $status while checking tag v$RELEASE_VERSION" >&2
              exit 1
              ;;
          esac
          rm -f "$response_file"
      - name: Atomically create the immutable release tag
        if: steps.release_tag_state.outputs.resume_existing_tag != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          cleanup() {
            rm -f "$request_file" "$response_file"
          }
          trap cleanup EXIT

          python3 - "$request_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "ref": f"refs/tags/v{os.environ['RELEASE_VERSION']}",
                      "sha": os.environ["RELEASE_COMMIT"],
                  }
              ),
              encoding="utf-8",
          )
          PY

          status="$(curl --silent --show-error \
            --request POST \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$request_file" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs")"
          if [ "$status" != "201" ]; then
            cat "$response_file" >&2
            echo "GitHub API returned HTTP $status while creating the release tag" >&2
            exit 1
          fi

          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_ref = f"refs/tags/v{os.environ['RELEASE_VERSION']}"
          actual_ref = response.get("ref")
          actual_sha = response.get("object", {}).get("sha")
          if actual_ref != expected_ref or actual_sha != os.environ["RELEASE_COMMIT"]:
              raise SystemExit(
                  "GitHub returned an unexpected ref or commit for the release tag"
              )
          PY
      - name: Publish the GitHub release from the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$RELEASE_VERSION" \
            --notes-file release_notes.md
      - name: Dispatch package publication from the verified release source
        if: inputs.publish_workflow != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PUBLISH_WORKFLOW: ${{ inputs.publish_workflow }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          CONTROL_PLANE_COMMIT="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if ! printf '%s' "$CONTROL_PLANE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "default-branch HEAD is unavailable for package publication dispatch" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$CONTROL_PLANE_COMMIT"; then
            echo "release commit must be an ancestor of the current default branch" >&2
            exit 1
          fi
          gh workflow run "$PUBLISH_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f release_tag="v$RELEASE_VERSION" \
            -f release_commit="$RELEASE_COMMIT" \
            -f control_plane_commit="$CONTROL_PLANE_COMMIT"
