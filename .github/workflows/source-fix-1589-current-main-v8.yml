name: One-shot PR 1589 current-main validation v8

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-current-main-v8.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Execute v5 repair with exact current-main fixture migrations
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/source-fix-1589-current-main-v5.yml").read_text(encoding="utf-8")
          marker = "        run: |\n"
          script = textwrap.dedent(workflow.split(marker, 1)[1])
          merge = "git merge --no-commit --no-ff -X ours refs/remotes/origin/main\n"
          script = script.replace(
              merge,
              'git config user.name "github-actions[bot]"\n'
              'git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n'
              + merge,
              1,
          )
          install = "python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt\n"
          patch = r'''
          python3 - <<'FIXTURES'
          from pathlib import Path

          path = Path("tests/test_noema_review_gate.py")
          text = path.read_text(encoding="utf-8").replace(
              'lambda repo, number, pr: "context"',
              'lambda repo, number, pr, changed_files=None: "context"',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_noema_removed_file_context.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import base64\n", "import base64\nimport json\n", 1)
          text = text.replace(
              'lambda args, stdin=None: "a.py\\tmodified\\n\\nb.py\\tremoved\\nfuzz/x.py\\tadded\\n",',
              'lambda args, stdin=None: "\\n".join(json.dumps(row) for row in [["a.py", "modified"], ["b.py", "removed"], ["fuzz/x.py", "added"]]) + "\\n",',
              1,
          )
          text = text.replace(
              '            return "fuzz/fuzz_opencode_normalize_output.py\\tremoved\\n"\n        if "contents/fuzz/fuzz_opencode_normalize_output.py?ref=base-sha" in target:\n            return encoded',
              '            return json.dumps(["fuzz/fuzz_opencode_normalize_output.py", "removed"]) + "\\n"\n        if "/compare/" in target:\n            return "c" * 40\n        if "contents/fuzz/fuzz_opencode_normalize_output.py?ref=" + "c" * 40 in target:\n            return encoded',
              1,
          )
          text = text.replace(
              'assert "File removed in this PR. Pre-deletion content at base ref" in context',
              'assert "Pre-deletion content at merge base" in context',
              1,
          )
          text = text.replace('"fetch_head_file_content"', '"fetch_file_content_at_ref"')
          text = text.replace('assert "base SHA unavailable" in context', 'assert "Merge-base lookup unavailable" in context', 1)
          text = text.replace(
              '    monkeypatch.setattr(noema, "fetch_file_content_at_ref", fail_fetch)\n\n    context = noema.changed_file_context(',
              '    monkeypatch.setattr(noema, "fetch_merge_base_sha", lambda repo, base, head: "c" * 40)\n    monkeypatch.setattr(noema, "fetch_file_content_at_ref", fail_fetch)\n\n    context = noema.changed_file_context(',
              1,
          )
          text = text.replace('assert "Unavailable from base content API" in context', 'assert "Unavailable from merge-base content API" in context', 1)
          text = text.replace('    monkeypatch.setattr(noema, "load_codegraph_context", lambda: "")\n', "", 1)
          text = text.replace(
              '    def fake_context(repo, number, head_sha, base_sha=""):\n        observed.append((repo, number, head_sha, base_sha))',
              '    monkeypatch.setattr(noema, "fetch_changed_files", lambda repo, number: [])\n\n    def fake_context(repo, number, head_sha, base_sha="", changed_files=None):\n        observed.append((repo, number, head_sha, base_sha, changed_files))',
              1,
          )
          text = text.replace(
              '    assert observed == [("owner/repo", 7, "head-sha", "base-sha")]',
              '    assert observed == [("owner/repo", 7, "head-sha", "base-sha", [])]',
              1,
          )
          path.write_text(text, encoding="utf-8")
          FIXTURES
          '''
          script = script.replace(install, patch + "\n" + install, 1)
          script = script.replace(
              "  .github/workflows/source-fix-1589-current-main-v5.yml\n",
              "  .github/workflows/source-fix-1589-current-main-v5.yml \\\n  .github/workflows/source-fix-1589-current-main-v6.yml \\\n  .github/workflows/source-fix-1589-current-main-v7.yml \\\n  .github/workflows/source-fix-1589-current-main-v8.yml\n",
              1,
          )
          Path("/tmp/run-v8.sh").write_text(script, encoding="utf-8")
          PY
          cd ..
          rm -rf source
          bash /tmp/run-v8.sh