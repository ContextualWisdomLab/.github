name: One-shot PR 1589 source-bound class evidence repair v2

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-source-bound-class-evidence-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Execute the reviewed exact transformation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor cdfcf4001033bcf521cc67dcfda0bab047e7ef36 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/source-fix-1589-source-bound-class-evidence.yml").read_text(encoding="utf-8")
          marker = "        run: |\n"
          if workflow.count(marker) != 1:
              raise SystemExit("source-bound writer run block changed unexpectedly")
          script = textwrap.dedent(workflow.split(marker, 1)[1])
          script = script.replace(
              'test "$(git rev-parse HEAD^)" = "cdfcf4001033bcf521cc67dcfda0bab047e7ef36"\n',
              'git merge-base --is-ancestor cdfcf4001033bcf521cc67dcfda0bab047e7ef36 HEAD\n',
              1,
          )
          Path("/tmp/apply-source-bound.sh").write_text(script, encoding="utf-8")
          PY
          cd ..
          rm -rf source
          bash /tmp/apply-source-bound.sh