name: PR 1629 DeepSeek preflight repair

on:
  push:
    branches:
      - fix/no-heuristic-review-admission-current-main
    paths:
      - .github/workflows/pr1629-deepseek-preflight-repair.yml
      - scripts/ci/repair_pr1629_deepseek_preflight.py

permissions:
  contents: write

concurrency:
  group: pr1629-deepseek-preflight-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify immutable repair input
        env:
          EXPECTED_BRANCH: fix/no-heuristic-review-admission-current-main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""

      - name: Execute RED-GREEN repair
        run: python scripts/ci/repair_pr1629_deepseek_preflight.py

      - name: Commit only publishable source and tests
        env:
          EXPECTED_BRANCH: fix/no-heuristic-review-admission-current-main
        run: |
          set -euo pipefail
          test ! -e scripts/ci/repair_pr1629_deepseek_preflight.py
          test ! -e .github/workflows/pr1629-deepseek-preflight-repair.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'repair produced no publishable change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(review): recover transient DeepSeek preflight failures'

          remote_head="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "branch moved during repair: expected $GITHUB_SHA, found $remote_head" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
