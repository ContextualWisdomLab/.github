name: PR 1629 DeepSeek preflight repair

on:
  push:
    branches:
      - fix/no-heuristic-review-admission-current-main
    paths:
      - .github/workflows/pr1629-deepseek-preflight-repair.yml
      - scripts/ci/repair_pr1629_deepseek_preflight.py
      - scripts/ci/repair_pr1629_deepseek_preflight_followup.py

permissions:
  contents: read

concurrency:
  group: pr1629-deepseek-preflight-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair head without persisted credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify immutable repair input
        env:
          EXPECTED_BRANCH: fix/no-heuristic-review-admission-current-main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""
          remote_head="$(git ls-remote https://github.com/ContextualWisdomLab/.github.git "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Execute RED-GREEN repair and legacy-oracle alignment
        run: python scripts/ci/repair_pr1629_deepseek_preflight_followup.py

      - name: Commit only publishable source and tests
        env:
          EXPECTED_BRANCH: fix/no-heuristic-review-admission-current-main
          PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
          OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
        run: |
          set -euo pipefail
          test ! -e scripts/ci/repair_pr1629_deepseek_preflight.py
          test ! -e scripts/ci/repair_pr1629_deepseek_preflight_followup.py
          test ! -e .github/workflows/pr1629-deepseek-preflight-repair.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'repair produced no publishable change' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(review): recover transient DeepSeek preflight failures'

          remote_head="$(git ls-remote https://github.com/ContextualWisdomLab/.github.git "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "branch moved during repair: expected $GITHUB_SHA, found $remote_head" >&2
            exit 1
          fi
          if [ -n "${PR_REVIEW_MERGE_TOKEN:-}" ]; then
            push_token="$PR_REVIEW_MERGE_TOKEN"
            push_source='PR_REVIEW_MERGE_TOKEN'
          elif [ -n "${OPENCODE_APPROVE_TOKEN:-}" ]; then
            push_token="$OPENCODE_APPROVE_TOKEN"
            push_source='OPENCODE_APPROVE_TOKEN'
          else
            echo 'No workflow-starting branch-mutation credential is configured; refusing github.token because it suppresses successor workflows.' >&2
            exit 78
          fi
          echo "Using workflow-starting mutation credential source: $push_source"
          git remote set-url origin "https://x-access-token:${push_token}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
