name: Rebuild PR 748 on current main
run-name: Rebuild PR 748 at ${{ github.sha }}
# Re-run after replacing the hard-coded patch path with a private temporary directory.

on:
  push:
    branches:
      - fix/npm-workspace-coverage-root-clean
    paths:
      - .github/workflows/rebuild-pr748-current-main.yml

concurrency:
  group: rebuild-pr748-current-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONWARNINGS: error

jobs:
  rebuild:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.ref == 'refs/heads/fix/npm-workspace-coverage-root-clean'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed resolver patch without regressing current toolchain
        env:
          REVIEWED_MAIN: f070c504c1cb06891b800d7ab0cf6ac7d3cf8eae
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$REVIEWED_MAIN" HEAD
          python3 -m py_compile scripts/ci/apply_pr748_current_main.py
          python3 scripts/ci/apply_pr748_current_main.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/opencode-review-dispatch.yml')
          workflow = path.read_text(encoding='utf-8')

          package_anchor = (
              '              r-cran-testthat ' + chr(92) + '\n'
              '              rustc ' + chr(92) + '\n'
          )
          package_replacement = (
              '              r-cran-testthat ' + chr(92) + '\n'
              '              llvm-19 ' + chr(92) + '\n'
              '              rustc ' + chr(92) + '\n'
          )
          if package_replacement not in workflow:
              if workflow.count(package_anchor) != 1:
                  raise SystemExit('LLVM package restoration anchor is not unique')
              workflow = workflow.replace(package_anchor, package_replacement, 1)

          tool_anchor = (
              '            && rm -rf /var/lib/apt/lists/*\n'
              "          RUN curl --proto '=https' --tlsv1.2 -fsSLo /tmp/node-linux-x64.tar.xz "
              + chr(92) + '\n'
          )
          tool_replacement = (
              '            && rm -rf /var/lib/apt/lists/*\n'
              '          ENV LLVM_COV=/usr/bin/llvm-cov-19\n'
              '          ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19\n'
              '          RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"\n'
              "          RUN curl --proto '=https' --tlsv1.2 -fsSLo /tmp/node-linux-x64.tar.xz "
              + chr(92) + '\n'
          )
          if tool_replacement not in workflow:
              if workflow.count(tool_anchor) != 1:
                  raise SystemExit('LLVM executable restoration anchor is not unique')
              workflow = workflow.replace(tool_anchor, tool_replacement, 1)

          llvm_package = workflow.index('              llvm-19 ' + chr(92))
          llvm_check = workflow.index('RUN test -x "$LLVM_COV" && test -x "$LLVM_PROFDATA"')
          cargo_llvm_cov = workflow.index(
              'https://github.com/taiki-e/cargo-llvm-cov/releases/download/'
          )
          if not llvm_package < llvm_check < cargo_llvm_cov:
              raise SystemExit('LLVM package/check ordering regressed')
          path.write_text(workflow, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install exact hash-locked central test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify focused behavior and complete resolver coverage
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py
          python -m coverage report \
            --include=scripts/ci/npm_workspace_install_root.py \
            --fail-under=100 \
            --show-missing
          python -m interrogate -vv --fail-under=100 scripts/ci/npm_workspace_install_root.py
          python -m pytest -q tests/test_opencode_agent_contract.py
          python -m compileall -q \
            scripts/ci/npm_workspace_install_root.py \
            tests/npm_workspace_test_support.py \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py \
            tests/test_opencode_agent_contract.py
          python -m ruff check \
            scripts/ci/npm_workspace_install_root.py \
            tests/npm_workspace_test_support.py \
            tests/test_npm_workspace_install_root.py \
            tests/test_npm_workspace_install_root_hardening.py \
            tests/test_opencode_agent_contract.py

      - name: Verify full central regression suite and workflow contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_path = Path('.github/workflows/opencode-review-dispatch.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          yaml.safe_load(workflow)
          required = (
              'resolve_npm_package_root()',
              'resolve_npm_install_root()',
              'npm_workspace_install_root.py',
              '--workspace "$npm_workspace_selector"',
              'npm offline ci (workspace root), lifecycle hooks disabled',
              '              llvm-19 ' + chr(92),
              'ENV LLVM_COV=/usr/bin/llvm-cov-19',
              'ENV LLVM_PROFDATA=/usr/bin/llvm-profdata-19',
          )
          missing = [fragment for fragment in required if fragment not in workflow]
          if missing:
              raise SystemExit(f'missing workflow contracts: {missing}')
          PY
          git diff --check

      - name: Build immutable verified seven-file product commit object
        env:
          API_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          TARGET_BRANCH: fix/npm-workspace-coverage-root-clean
          REVIEWED_MAIN: f070c504c1cb06891b800d7ab0cf6ac7d3cf8eae
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          rm -f \
            .coverage \
            .github/workflows/rebuild-pr748-current-main.yml \
            scripts/ci/apply_pr748_current_main.py
          git diff --check
          python3 - <<'PY' | tee "${RUNNER_TEMP}/pr748-materialization-receipt.txt"
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = 'ContextualWisdomLab/.github'
          parent_sha = os.environ['EXPECTED_HEAD']
          reviewed_main = os.environ['REVIEWED_MAIN']
          token = os.environ['API_TOKEN']
          api_root = f'https://api.github.com/repos/{repository}'
          expected_paths = {
              '.github/workflows/opencode-review-dispatch.yml',
              '.github/workflows/rebuild-pr748-current-main.yml',
              'docs/doctoring/npm-workspace-lock-ownership.md',
              'scripts/ci/apply_pr748_current_main.py',
              'scripts/ci/npm_workspace_install_root.py',
              'tests/npm_workspace_test_support.py',
              'tests/test_npm_workspace_install_root.py',
              'tests/test_npm_workspace_install_root_hardening.py',
              'tests/test_opencode_agent_contract.py',
          }
          permanent_paths = {
              '.github/workflows/opencode-review-dispatch.yml',
              'docs/doctoring/npm-workspace-lock-ownership.md',
              'scripts/ci/npm_workspace_install_root.py',
              'tests/npm_workspace_test_support.py',
              'tests/test_npm_workspace_install_root.py',
              'tests/test_npm_workspace_install_root_hardening.py',
              'tests/test_opencode_agent_contract.py',
          }

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + endpoint,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cwl-pr748-materializer',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          raw = subprocess.check_output(['git', 'diff', '--name-status', '-z', 'HEAD'])
          parts = raw.decode('utf-8').split('\0')
          changes = []
          index = 0
          while index < len(parts) - 1:
              status = parts[index]
              path = parts[index + 1]
              index += 2
              if status.startswith(('R', 'C')):
                  raise SystemExit(f'rename/copy outside reviewed scope: {status} {path}')
              changes.append((status, path))
          actual_paths = {path for _, path in changes}
          if actual_paths != expected_paths:
              raise SystemExit(
                  f'materialization path mismatch: missing={sorted(expected_paths - actual_paths)} '
                  f'extra={sorted(actual_paths - expected_paths)}'
              )

          final_diff = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', reviewed_main], text=True
              ).splitlines()
          )
          if final_diff != permanent_paths:
              raise SystemExit(
                  f'final seven-file scope mismatch: expected={sorted(permanent_paths)} '
                  f'actual={sorted(final_diff)}'
              )

          parent = request('GET', f'/git/commits/{parent_sha}')
          tree_entries = []
          for status, path in changes:
              if status == 'D':
                  tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              encoded = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              blob = request('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              mode = '100755' if os.access(path, os.X_OK) else '100644'
              tree_entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
              print(f"BLOB {blob['sha']} {path}")

          tree = request(
              'POST',
              '/git/trees',
              {'base_tree': parent['tree']['sha'], 'tree': tree_entries},
          )
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'fix(coverage): restore validated npm workspace lock owners',
                  'tree': tree['sha'],
                  'parents': [parent_sha],
              },
          )
          print(f"PR748_MATERIALIZATION_PARENT_SHA={parent_sha}")
          print(f"PR748_MATERIALIZATION_TREE_SHA={tree['sha']}")
          print(f"PR748_MATERIALIZATION_COMMIT_SHA={commit['sha']}")
          PY

      - name: Publish exact-head materialization pointer
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          commit_sha="$(sed -n 's/^PR748_MATERIALIZATION_COMMIT_SHA=//p' "${RUNNER_TEMP}/pr748-materialization-receipt.txt")"
          test "${#commit_sha}" -eq 40
          case "$commit_sha" in (*[!0-9a-f]*) exit 1;; esac
          body="PR748_MATERIALIZATION_PARENT_SHA=${EXPECTED_HEAD}%0APR748_MATERIALIZATION_COMMIT_SHA=${commit_sha}"
          gh api \
            --method POST \
            repos/ContextualWisdomLab/.github/issues/748/comments \
            -f "body=${body}"

      - name: Upload exact-head materialization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: pr748-exact-head-materialization
          path: ${{ runner.temp }}/pr748-materialization-receipt.txt
          if-no-files-found: error
          retention-days: 5
