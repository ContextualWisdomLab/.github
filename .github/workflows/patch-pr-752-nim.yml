name: Apply validated PR 752 NVIDIA NIM autofix migration

on:
  push:
    branches:
      - fix/hourly-nvidia-nim-autofix
    paths:
      - .github/workflows/patch-pr-752-nim.yml

permissions:
  contents: read

concurrency:
  group: patch-pr-752-nim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result_digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify immutable patch source
        run: echo 'ef6cae492b84b715856f0f6b1038bb07f7d069d994bca83991dbfe7a4f884ed8  .github/scripts/patch_pr_752.py' | sha256sum --check --strict

      - name: Prove contract is red before production migration
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_pr_review_autofix_nvidia_nim_contract.py \
            > "$RUNNER_TEMP/nim-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/nim-red.log"
          test "$status" -ne 0
          grep -F 'nvidia-nim/mistralai/mistral-nemotron' "$RUNNER_TEMP/nim-red.log"

      - name: Apply bounded provider migration
        run: python .github/scripts/patch_pr_752.py

      - name: Verify focused contract and Python syntax
        run: |
          python -m pytest -q tests/test_pr_review_autofix_nvidia_nim_contract.py
          python -m py_compile \
            .github/scripts/patch_pr_752.py \
            tests/test_pr_review_autofix_nvidia_nim_contract.py
          git diff --check

      - name: Bind exact validated result
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          value="$({
            printf '%s\0' '.github/workflows/pr-review-autofix.yml'
            cat .github/workflows/pr-review-autofix.yml
            printf '%s\0' 'docs/doctoring/hourly-nvidia-nim-autofix.md'
            cat docs/doctoring/hourly-nvidia-nim-autofix.md
          } | sha256sum | cut -d' ' -f1)"
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce exact validated result without executing target repository code
        env:
          EXPECTED_DIGEST: ${{ needs.validate.outputs.result_digest }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'ef6cae492b84b715856f0f6b1038bb07f7d069d994bca83991dbfe7a4f884ed8  .github/scripts/patch_pr_752.py' | sha256sum --check --strict
          python .github/scripts/patch_pr_752.py
          actual="$({
            printf '%s\0' '.github/workflows/pr-review-autofix.yml'
            cat .github/workflows/pr-review-autofix.yml
            printf '%s\0' 'docs/doctoring/hourly-nvidia-nim-autofix.md'
            cat docs/doctoring/hourly-nvidia-nim-autofix.md
          } | sha256sum | cut -d' ' -f1)"
          test -n "$EXPECTED_DIGEST"
          test "$actual" = "$EXPECTED_DIGEST"
          git diff --check

      - name: Commit validated result and remove temporary patch machinery
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/scripts/patch_pr_752.py \
            .github/workflows/patch-pr-752-nim.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/pr-review-autofix.yml \
            docs/doctoring/hourly-nvidia-nim-autofix.md \
            .github/scripts/patch_pr_752.py \
            .github/workflows/patch-pr-752-nim.yml
          git diff --cached --check
          git commit -m 'fix(ci): use NVIDIA NIM for scheduled OpenCode autofix'
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push \
            --force-with-lease="refs/heads/fix/hourly-nvidia-nim-autofix:${SOURCE_HEAD}" \
            "$remote_url" \
            HEAD:refs/heads/fix/hourly-nvidia-nim-autofix
