name: Source Fix 1700 Repair Driver Drift

on:
  push:
    branches:
      - fix/noema-evidence-completeness-no-heuristics
    paths:
      - .github/workflows/source-fix-1700-repair-driver-drift.yml

permissions:
  contents: write

concurrency:
  group: source-fix-1700-repair-driver-drift
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/noema-evidence-completeness-no-heuristics
          fetch-depth: 0
          persist-credentials: true

      - name: Repair exact-text drift and self-retire
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/source-fix-1700-noema-evidence-allocation.yml')
          text = path.read_text(encoding='utf-8')
          old = 'source or test/workflow changes require at least two distinct probes and other changes require at least one.'
          new = 'source or test changes require at least two distinct probes and other changes require at least one.'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'exact source-fix prompt drift repair expected one match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/source-fix-1700-repair-driver-drift.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/source-fix-1700-noema-evidence-allocation.yml
          git diff --cached --check
          git commit -m 'ci(noema): align source-fix with exact parent prompt'
          git push origin HEAD:fix/noema-evidence-completeness-no-heuristics
