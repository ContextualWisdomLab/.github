name: Repair PR 759 canonical source

on:
  push:
    branches:
      - fix/opencode-coverage-failure-diagnostics
    paths:
      - .github/workflows/repair-pr759-canonical-source.yml

permissions:
  contents: write

concurrency:
  group: repair-pr759-canonical-source
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/opencode-coverage-failure-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact repair trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Verify immutable repair parent
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "79e109e8987491d3023c824145c026c769ea4530"
          test "$(git rev-parse --abbrev-ref HEAD)" = "HEAD"

      - name: Apply canonical source repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one repair anchor in {path}, found {count}"
                  )
              file_path.write_text(content.replace(old, new, 1), encoding="utf-8")

          javascript_path = "scripts/ci/materialize_base_javascript_packages.py"
          replace_once(
              javascript_path,
              """import argparse
          import html
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import urllib.parse
          from typing import Any
          """,
              """import argparse
          import json
          import pathlib
          import re
          import runpy
          import subprocess
          import sys
          import urllib.parse
          from collections.abc import Callable
          from typing import Any, cast
          """,
          )
          replace_once(
              javascript_path,
              """SHA512_SRI_RE = re.compile(r"^sha512-[A-Za-z0-9+/]{86}==$")
          """,
              """SHA512_SRI_RE = re.compile(r"^sha512-[A-Za-z0-9+/]{86}==$")
          _COVERAGE_FAILURE_NAMESPACE = runpy.run_path(
              str(pathlib.Path(__file__).with_name("coverage_failure_summary.py"))
          )
          _publish_coverage_failure_summary = cast(
              Callable[[str, BaseException, str], None],
              _COVERAGE_FAILURE_NAMESPACE["publish_coverage_failure_summary"],
          )
          """,
          )
          replace_once(
              javascript_path,
              """def _publish_coverage_failure_summary(
              stage: str, error: BaseException, remediation: str
          ) -> None:
              \"\"\"Publish bounded exact setup failure evidence for deterministic reviews.\"\"\"
              github_output = os.environ.get(\"GITHUB_OUTPUT\")
              if not github_output:
                  return

              delimiter = \"CWL_COVERAGE_SUMMARY_EOF\"
              safe_stage = html.escape(\" \".join(stage.split())[:256], quote=True).replace(
                  delimiter, \"CWL_COVERAGE_SUMMARY_END\"
              )
              safe_reason = html.escape(
                  f\"{error.__class__.__name__}: {' '.join(str(error).split())}\"[:4096],
                  quote=True,
              ).replace(delimiter, \"CWL_COVERAGE_SUMMARY_END\")
              safe_remediation = html.escape(
                  \" \".join(remediation.split())[:1024], quote=True
              ).replace(delimiter, \"CWL_COVERAGE_SUMMARY_END\")
              summary = (
                  \"## Coverage Decision\\n\"
                  \"- Result: FAIL\\n\"
                  f\"- Failed stage: {safe_stage}\\n\"
                  \"- Exact failure:\\n\"
                  f\"<pre>{safe_reason}</pre>\\n\"
                  f\"- Next action: {safe_remediation}\\n\"
              )
              with pathlib.Path(github_output).open(\"a\", encoding=\"utf-8\") as output:
                  output.write(f\"coverage_summary<<{delimiter}\\n{summary}{delimiter}\\n\")


          """,
              "",
          )

          python_path = "scripts/ci/materialize_base_python_requirements.py"
          replace_once(
              python_path,
              """import argparse
          import fnmatch
          import html
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          """,
              """import argparse
          import fnmatch
          import json
          import pathlib
          import re
          import runpy
          import shutil
          import subprocess
          import sys
          import tempfile
          from collections.abc import Callable
          from typing import cast
          """,
          )
          replace_once(
              python_path,
              """UV_EXPORT_TIMEOUT_SECONDS = 120
          """,
              """UV_EXPORT_TIMEOUT_SECONDS = 120
          _COVERAGE_FAILURE_NAMESPACE = runpy.run_path(
              str(pathlib.Path(__file__).with_name("coverage_failure_summary.py"))
          )
          _publish_coverage_failure_summary = cast(
              Callable[[str, BaseException, str], None],
              _COVERAGE_FAILURE_NAMESPACE["publish_coverage_failure_summary"],
          )
          """,
          )
          replace_once(
              python_path,
              """def _publish_coverage_failure_summary(
              stage: str, error: BaseException, remediation: str
          ) -> None:
              \"\"\"Publish bounded exact setup failure evidence for deterministic reviews.\"\"\"
              github_output = os.environ.get(\"GITHUB_OUTPUT\")
              if not github_output:
                  return

              delimiter = \"CWL_COVERAGE_SUMMARY_EOF\"
              safe_stage = html.escape(\" \".join(stage.split())[:256], quote=True).replace(
                  delimiter, \"CWL_COVERAGE_SUMMARY_END\"
              )
              safe_reason = html.escape(
                  f\"{error.__class__.__name__}: {' '.join(str(error).split())}\"[:4096],
                  quote=True,
              ).replace(delimiter, \"CWL_COVERAGE_SUMMARY_END\")
              safe_remediation = html.escape(
                  \" \".join(remediation.split())[:1024], quote=True
              ).replace(delimiter, \"CWL_COVERAGE_SUMMARY_END\")
              summary = (
                  \"## Coverage Decision\\n\"
                  \"- Result: FAIL\\n\"
                  f\"- Failed stage: {safe_stage}\\n\"
                  \"- Exact failure:\\n\"
                  f\"<pre>{safe_reason}</pre>\\n\"
                  f\"- Next action: {safe_remediation}\\n\"
              )
              with pathlib.Path(github_output).open(\"a\", encoding=\"utf-8\") as output:
                  output.write(f\"coverage_summary<<{delimiter}\\n{summary}{delimiter}\\n\")


          """,
              "",
          )

          strix_path = "scripts/ci/strix_quick_gate.sh"
          replace_once(
              strix_path,
              "uv.lock | */uv.lock)",
              "uv.lock | */uv.lock | Cargo.toml | */Cargo.toml | Cargo.lock | */Cargo.lock)",
          )
          replace_once(
              strix_path,
              """backend/scripts/* | backend/tests/*)
          		;;
          """,
              """backend/scripts/* | backend/tests/*)
          		:
          		;;
          """,
          )

          strix_test_path = "scripts/ci/test_strix_quick_gate.sh"
          replace_once(
              strix_test_path,
              """	assert_file_contains \"$GATE_SCRIPT\" \"Dockerfile | */Dockerfile | Dockerfile.* | */Dockerfile.* | Containerfile | */Containerfile | Makefile | */Makefile\" \"strix gate treats deployment files as source files\"
          """,
              """	assert_file_contains \"$GATE_SCRIPT\" \"Dockerfile | */Dockerfile | Dockerfile.* | */Dockerfile.* | Containerfile | */Containerfile | Makefile | */Makefile\" \"strix gate treats deployment files as source files\"
          	assert_file_contains \"$GATE_SCRIPT\" \"Cargo.toml | */Cargo.toml | Cargo.lock | */Cargo.lock\" \"strix gate includes Rust crate dependency and feature context\"
          	assert_file_contains \"$GATE_SCRIPT\" \"backend/scripts/* | backend/tests/*)\" \"strix gate retains the standalone support-tool exclusion branch\"
          """,
          )

          agent_test_path = "tests/test_opencode_agent_contract.py"
          replace_once(
              agent_test_path,
              """    assert 'RUN test -x \"$LLVM_COV\" && test -x \"$LLVM_PROFDATA\"' in workflow
          """,
              """    assert 'RUN test -x \"$LLVM_COV\" && test -x \"$LLVM_PROFDATA\"' in workflow
              llvm_install = workflow.index(\"              llvm-19 \" + chr(92))
              llvm_check = workflow.index(
                  'RUN test -x \"$LLVM_COV\" && test -x \"$LLVM_PROFDATA\"'
              )
              cargo_llvm_cov_install = workflow.index(
                  \"https://github.com/taiki-e/cargo-llvm-cov/releases/download/\"
              )
              assert llvm_install < llvm_check < cargo_llvm_cov_install
          """,
          )

          latest_codeql_sha = "d1ba80a13dd99fba24a470575428917156a28b43"
          for workflow_path in (
              ".github/workflows/codeql-pr.yml",
              ".github/workflows/scheduled-security-scan.yml",
          ):
              workflow = Path(workflow_path)
              content = workflow.read_text(encoding="utf-8")
              content = content.replace(
                  "99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0",
                  f"{latest_codeql_sha} # v4.37.5",
              ).replace(
                  "f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4",
                  f"{latest_codeql_sha} # v4.37.5",
              )
              if latest_codeql_sha not in content:
                  raise SystemExit(f"CodeQL pin repair did not apply to {workflow_path}")
              workflow.write_text(content, encoding="utf-8")

          for obsolete in (
              ".github/workflows/one-shot-redact-materializer-diagnostics.yml",
              ".github/workflows/repair-pr759-early-redaction.yml",
              ".github/workflows/repair-pr759-canonical-source.yml",
          ):
              Path(obsolete).unlink(missing_ok=True)
          PY

      - name: Validate deterministic patch surfaces
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 -m py_compile \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py \
            tests/test_coverage_materializer_failure_diagnostics.py \
            tests/test_sanitize_github_output_summary.py \
            tests/test_opencode_agent_contract.py
          bash -n scripts/ci/strix_quick_gate.sh
          bash -n scripts/ci/test_strix_quick_gate.sh
          git diff --check
          test ! -e .github/workflows/one-shot-redact-materializer-diagnostics.yml
          test ! -e .github/workflows/repair-pr759-early-redaction.yml
          test ! -e .github/workflows/repair-pr759-canonical-source.yml

      - name: Publish canonical source commit
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(opencode-review): canonicalize coverage diagnostics"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/fix/opencode-coverage-failure-diagnostics
