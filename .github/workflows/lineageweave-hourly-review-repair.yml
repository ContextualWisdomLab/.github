name: LineageWeave Hourly Review Repair

on:
  schedule:
    # Minute 4 avoids pg-llm-batch (1), aFIPC (2), kaefa (3), codec-carver (5),
    # Wardnet (7), naruon (11), pg-erd-cloud (13), orchestrator (17),
    # noema (19), Clearfolio (23), Keyverse (29), Scopeweave (31),
    # DiskSage (37), Appguardrail (41), newsdom-api (43), Inkspan (47),
    # fast-mlsirm (49), BandScope (53), and semantic-data-portal (59).
    - cron: "4 * * * *"

concurrency:
  group: lineageweave-hourly-review-repair
  # A later heartbeat must not cancel an in-flight lineage or linkage RCA.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-review-repair:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-review-fix-scheduler.yml
    with:
      target_repository: ContextualWisdomLab/LineageWeave
      base_branch: main
      max_prs: "50"
      max_dispatches: "1"
      retry_hours: "2"
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
