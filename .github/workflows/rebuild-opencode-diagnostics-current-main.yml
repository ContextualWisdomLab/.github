name: Rebuild OpenCode diagnostics on current main

on:
  push:
    branches:
      - fix/opencode-coverage-diagnostics-current-main
    paths:
      - .github/workflows/rebuild-opencode-diagnostics-current-main.yml

permissions:
  contents: read

concurrency:
  group: rebuild-opencode-diagnostics-current-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rebuild-and-verify:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.actor == 'seonghobae' &&
      github.ref == 'refs/heads/fix/opencode-coverage-diagnostics-current-main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact trigger
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable reconstruction inputs
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD^)" = "f070c504c1cb06891b800d7ab0cf6ac7d3cf8eae"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            refs/heads/fix/opencode-coverage-failure-diagnostics:refs/remotes/origin/opencode-diagnostics-source
          test "$(git rev-parse refs/remotes/origin/opencode-diagnostics-source)" = \
            "bdd2b30c0ebef6ed93ace0d2926a7eaf8871653d"

      - name: Materialize reviewed feature files and three-way patches
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          source_ref=refs/remotes/origin/opencode-diagnostics-source
          merge_base=3f65dbee6672b78802e7d71d49c390f3817bb03b

          added_files=(
            .github/workflows/opencode-coverage-diagnostics-ci.yml
            docs/doctoring/coverage-failure-diagnostics.md
            docs/doctoring/coverage-native-fuzz-lock-boundary.md
            docs/doctoring/opencode-llvm-coverage-toolchain.md
            docs/doctoring/strix-source-directory-boundary.md
            docs/superpowers/plans/2026-08-05-coverage-native-fuzz-lock-boundary.md
            docs/superpowers/specs/2026-08-05-coverage-native-fuzz-lock-boundary-design.md
            scripts/ci/coverage_failure_summary.py
            scripts/ci/materialize_base_javascript_packages.py
            scripts/ci/sanitize_github_output_summary.py
            scripts/ci/strix_model_utils.sh
            tests/test_coverage_materializer_failure_diagnostics.py
            tests/test_coverage_native_fuzz_lock_boundary.py
            tests/test_sanitize_github_output_summary.py
            tests/test_strix_dependency_security_floor.py
            tests/test_strix_model_utils_source_dirs.py
          )
          git checkout "$source_ref" -- "${added_files[@]}"

          patched_files=(
            .github/workflows/opencode-review-dispatch.yml
            scripts/ci/materialize_base_python_requirements.py
            scripts/ci/strix_quick_gate.sh
            scripts/ci/test_strix_quick_gate.sh
            tests/test_opencode_agent_contract.py
          )
          for path in "${patched_files[@]}"; do
            patch_file="$(mktemp)"
            git diff --binary "$merge_base" "$source_ref" -- "$path" >"$patch_file"
            test -s "$patch_file"
            git apply --3way --index "$patch_file"
            rm -f "$patch_file"
          done

          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          fixed_anchor = "### Fixed\n\n"
          fixed_entries = (
              "- Keep the native Atheris fuzz-engine lock in dedicated repository fuzz workflows instead of installing it in the generic OpenCode coverage image; immutable hash-pinned property and regression test locks remain eligible for central coverage materialization.\n"
              "- Publish bounded, credential-redacted OpenCode coverage setup diagnostics through one shared helper and preserve exact-head, Rust dependency-context, and deterministic LLVM coverage-toolchain contracts.\n"
              "- Reject unsafe Strix source-directory overrides before path joining, including traversal, absolute, nested, symlink-expanding, glob, control-character, oversized, and excessive-cardinality values while retaining validated internationalized direct directory names.\n"
          )
          if fixed_entries.splitlines()[0] not in text:
              if text.count(fixed_anchor) != 1:
                  raise SystemExit("CHANGELOG.md: expected one Fixed section")
              text = text.replace(fixed_anchor, fixed_anchor + fixed_entries, 1)
          documentation_entry = (
              "- Add APA 7 doctoring records for coverage diagnostics, the generic coverage/native fuzz-engine dependency boundary, the Strix source-directory boundary, and the LLVM coverage toolchain, including trust models, verification fixtures, limitations, and rollback requirements.\n"
          )
          if documentation_entry not in text:
              text = text.rstrip() + "\n\n### Documentation\n\n" + documentation_entry
          path.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-opencode-review-ci-hashes.txt

      - name: Install hash-locked quality tooling
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt

      - name: Verify full central quality contract
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m pytest -q
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage report --fail-under=100 --show-missing
          python -m interrogate --fail-under 100 \
            scripts/ci/coverage_failure_summary.py \
            scripts/ci/materialize_base_javascript_packages.py \
            scripts/ci/materialize_base_python_requirements.py \
            scripts/ci/sanitize_github_output_summary.py
          python -m compileall -q scripts/ci tests
          bash -n \
            scripts/ci/strix_model_utils.sh \
            scripts/ci/strix_quick_gate.sh \
            scripts/ci/test_strix_quick_gate.sh
          git diff --check

      - name: Publish verified reconstruction and remove temporary workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          SOURCE_BRANCH: fix/opencode-coverage-diagnostics-current-main
          GH_TOKEN: ${{ github.token }}
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm -f .github/workflows/rebuild-opencode-diagnostics-current-main.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(opencode-review): restore actionable coverage diagnostics"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${SOURCE_BRANCH}:${EXPECTED_HEAD}" \
            "$remote_url" "HEAD:refs/heads/${SOURCE_BRANCH}"
