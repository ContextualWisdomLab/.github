# One-shot test-contract writer; remove after the exact-head repair publishes.
name: Source Fix 1656 Stale Close Contract

on:
  push:
    branches: [fix/close-empty-noop-runner-712]
    paths: [.github/workflows/source-fix-1656-stale-close-contract.yml]

permissions:
  contents: write

concurrency:
  group: source-fix-1656-stale-close-contract
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Revalidate exact remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          test -n "$remote_head"
          test "$remote_head" = "$local_head"

      - name: Align permanent required-workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_required_workflow_queue_contract.py")
          text = path.read_text(encoding="utf-8")

          old_inventory = '''    workflows = (\n        "close-empty-pr.yml",\n        "codeql-pr.yml",\n        "noema-review.yml",\n        "osv-scanner-pr.yml",\n        "pr-review-merge-scheduler.yml",\n        "scorecard-pr.yml",\n        "security-scan.yml",\n        "strix.yml",\n    )\n'''
          new_inventory = '''    workflows = (\n        "close-empty-pr.yml",\n        "codeql-pr.yml",\n        "noema-review.yml",\n        "osv-scanner-pr.yml",\n        "pr-review-merge-scheduler.yml",\n        "python-security.yml",\n        "sast-semgrep.yml",\n        "sbom-generation.yml",\n        "scorecard-pr.yml",\n        "secret-scan.yml",\n        "security-scan.yml",\n        "strix.yml",\n    )\n'''
          if text.count(old_inventory) != 1:
              raise SystemExit(
                  f"expected one close-event workflow inventory, found {text.count(old_inventory)}"
              )
          text = text.replace(old_inventory, new_inventory)

          old_contract = '''        else:\n            assert "cancel-closed-pr-runs:" in workflow\n            assert (\n                "PR closed; this run only cancels older runs through workflow concurrency."\n                in workflow\n            )\n        assert "github.event.action != 'closed'" in workflow\n'''
          new_contract = '''        elif filename in {\n            "close-empty-pr.yml",\n            "codeql-pr.yml",\n            "osv-scanner-pr.yml",\n            "pr-review-merge-scheduler.yml",\n            "python-security.yml",\n            "sast-semgrep.yml",\n            "sbom-generation.yml",\n            "scorecard-pr.yml",\n            "secret-scan.yml",\n            "security-scan.yml",\n        }:\n            assert "cancel-closed-pr-runs:" not in workflow\n            concurrency_contract = workflow.split("concurrency:", 1)[1].split(\n                "permissions:", 1\n            )[0]\n            assert "github.event.pull_request.number" in concurrency_contract\n            assert "github.event.pull_request.head.sha" not in concurrency_contract\n            assert "cancel-in-progress:" in concurrency_contract\n        else:\n            raise AssertionError(f"unclassified close-event workflow: {filename}")\n        assert "github.event.action != 'closed'" in workflow\n'''
          if text.count(old_contract) != 1:
              raise SystemExit(
                  f"expected one stale close-event contract, found {text.count(old_contract)}"
              )
          path.write_text(text.replace(old_contract, new_contract), encoding="utf-8")
          PY
          python -m compileall -q tests/test_required_workflow_queue_contract.py
          git diff --check

      - name: Publish only the permanent test contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_required_workflow_queue_contract.py
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::No test-contract repair produced"; exit 1; }
          git commit -m "test(actions): align runnerless close-event contract"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          parent="$(git rev-parse HEAD^)"
          test "$remote_head" = "$parent"
          git push origin "HEAD:${GITHUB_REF_NAME}"
