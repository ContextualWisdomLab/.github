name: Source Fix 1656 Stale Close Contract

on:
  push:
    branches:
      - fix/close-empty-noop-runner-712
    paths:
      - .github/workflows/source-fix-1656-stale-close-contract.yml

permissions:
  contents: write

concurrency:
  group: source-fix-1656-stale-close-contract
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Revalidate exact remote head
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          if [ -z "$remote_head" ] || [ "$remote_head" != "$local_head" ]; then
            echo "writer head moved: local=$local_head remote=$remote_head" >&2
            exit 1
          fi

      - name: Repair stale queue contract without runner-only test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contract_path = Path("tests/test_required_workflow_queue_contract.py")
          contract = contract_path.read_text(encoding="utf-8")
          old = '''        else:\n            assert "cancel-closed-pr-runs:" in workflow\n            assert (\n                "PR closed; this run only cancels older runs through workflow concurrency."\n                in workflow\n            )\n        assert "github.event.action != 'closed'" in workflow\n'''
          new = '''        elif filename in {\n            "close-empty-pr.yml",\n            "osv-scanner-pr.yml",\n            "scorecard-pr.yml",\n        }:\n            # These workflows use PR-stable workflow concurrency with\n            # cancel-in-progress, so a closed event retires the predecessor\n            # without allocating a no-op hosted-runner cleanup job.\n            assert "cancel-closed-pr-runs:" not in workflow\n            assert "cancel-in-progress: true" in workflow\n        else:\n            assert "cancel-closed-pr-runs:" in workflow\n            assert (\n                "PR closed; this run only cancels older runs through workflow concurrency."\n                in workflow\n            )\n        assert "github.event.action != 'closed'" in workflow\n'''
          if contract.count(old) != 1:
              raise SystemExit(f"expected one stale contract block, found {contract.count(old)}")
          contract = contract.replace(old, new)
          contract_path.write_text(contract, encoding="utf-8")

          close_path = Path(".github/workflows/close-empty-pr.yml")
          close = close_path.read_text(encoding="utf-8")
          sentinel = '''  # Compatibility sentinel for the established queue contract. The closed event\n  # still exists solely so workflow-level concurrency can retire older runs; this\n  # job is statically skipped and therefore never enters runner admission.\n  cancel-closed-pr-runs:\n    if: ${{ false }}\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo "PR closed; this run only cancels older runs through workflow concurrency."\n\n'''
          if close.count(sentinel) != 1:
              raise SystemExit(f"expected one compatibility sentinel, found {close.count(sentinel)}")
          close_path.write_text(close.replace(sentinel, ""), encoding="utf-8")

          for filename in ("close-empty-pr.yml", "osv-scanner-pr.yml", "scorecard-pr.yml"):
              workflow = Path(".github/workflows", filename).read_text(encoding="utf-8")
              assert "closed" in workflow
              assert "cancel-in-progress: true" in workflow
              assert "cancel-closed-pr-runs:" not in workflow
              assert "github.event.action != 'closed'" in workflow
          assert 'elif filename in {' in contract
          assert '"close-empty-pr.yml",' in contract
          assert '"osv-scanner-pr.yml",' in contract
          assert '"scorecard-pr.yml",' in contract
          PY
          python -m compileall -q tests/test_required_workflow_queue_contract.py tests/test_close_empty_pr_queue_pressure.py
          git diff --check

      - name: Publish repaired source and remove bounded repair workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/source-fix-1656-stale-close-contract.yml
          rm -f .github/workflows/tmp-pr1656-queue-contract-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_required_workflow_queue_contract.py \
            .github/workflows/close-empty-pr.yml \
            .github/workflows/source-fix-1656-stale-close-contract.yml \
            .github/workflows/tmp-pr1656-queue-contract-repair.yml
          git diff --cached --check
          git commit -m "test(actions): align close-event queue contract"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          parent="$(git rev-parse HEAD^)"
          if [ "$remote_head" != "$parent" ]; then
            echo "writer head moved before publish: expected=$parent remote=$remote_head" >&2
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
