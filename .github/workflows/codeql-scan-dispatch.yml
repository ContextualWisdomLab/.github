# Runs github/codeql-action outside any required-workflow context. GitHub
# categorically refuses to admit init/analyze inside a required workflow
# (docs/doctoring/codeql-pr-required-workflow-always-fails.md); this file is
# the native execution half of the dispatch+exact-job-wake design implemented by
# ContextualWisdomLab/.github#1778. Do not add workflow_dispatch here to allow
# manual testing:
# test_no_central_workflow_exposes_branch_selected_manual_dispatch (in
# tests/test_required_workflow_queue_contract.py) forbids it on every central
# workflow, because workflow_dispatch runs the workflow file as it exists on
# whatever ref the caller selects rather than pinning to the default branch,
# defeating the trusted-source-ref pinning this design otherwise depends on.
# Exercise this handler end-to-end by POSTing a real repository_dispatch
# event instead -- that always runs the default-branch version.
name: CodeQL Scan Dispatch
run-name: >-
  CodeQL Scan Dispatch ${{ github.event.client_payload.target_repository ||
  github.repository }}#${{
  github.event.client_payload.pr_number || 'event' }}@${{
  github.event.client_payload.pr_head_sha || github.sha }}/${{
  github.event.client_payload.pr_base_sha || 'none' }}/${{
  github.event.client_payload.required_run_id || github.run_id }}/${{
  github.event.client_payload.producer_source_sha || 'missing-source' }}

on:
  repository_dispatch:
    types: [codeql-scan]

concurrency:
  group: >-
    codeql-scan-dispatch-${{
    github.event.client_payload.target_repository || github.repository }}-${{
    github.event.client_payload.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-dispatch:
    name: validate-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    outputs:
      target_repository: ${{ steps.validate.outputs.target_repository }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      base_ref: ${{ steps.validate.outputs.base_ref }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
      head_ref: ${{ steps.validate.outputs.head_ref }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      matrix: ${{ steps.validate.outputs.matrix }}
      required_run_id: ${{ steps.validate.outputs.required_run_id }}
      required_jobs: ${{ steps.validate.outputs.required_jobs }}
      rerun_mode: ${{ steps.validate.outputs.rerun_mode }}
      producer_source_sha: ${{ steps.validate.outputs.producer_source_sha }}
    steps:
      - name: Exchange OpenCode app token for target repository metadata reads
        id: metadata_read_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail

          mark_unavailable() {
            echo "available=false" >>"$GITHUB_OUTPUT"
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] ||
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OpenCode app token exchange unavailable: OIDC request environment is missing."
            mark_unavailable
            exit 0
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            echo "OpenCode app token exchange unavailable: OIDC token request did not complete."
            mark_unavailable
            exit 0
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "OpenCode app token exchange unavailable: OIDC token response was empty."
            mark_unavailable
            exit 0
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"; then
            echo "OpenCode app token exchange unavailable: app token request did not complete."
            mark_unavailable
            exit 0
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "OpenCode app token exchange unavailable: app token response was empty."
            mark_unavailable
            exit 0
          fi

          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Bind workflow inputs to live organization pull request metadata
        id: validate
        env:
          GH_TOKEN: ${{ steps.metadata_read_app_token.outputs.token || secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
          # A rerun retains github.actor from the original dispatch; authorize
          # the identity that initiated the current run or rerun instead.
          # Reuses the same actor identity check as opencode-review-dispatch.yml
          # (both mint their dispatching token via the same exchange endpoint),
          # but deliberately does NOT reuse its OPENCODE_REPOSITORY_DISPATCH_TARGETS
          # allowlist: that list scopes a deliberately gradual OpenCode review
          # rollout to ~12 repos, whereas ruleset 18156473 (confirmed live via
          # `gh api orgs/ContextualWisdomLab/rulesets/18156473`) covers
          # ~ALL org repos except noema/.github/IRT-bibliography-set. Central
          # CodeQL is meant to run for every one of those repos, not a curated
          # subset -- reusing the narrower list would silently break CodeQL
          # dispatch for every repo not already on the OpenCode rollout list.
          # The org-membership regex below is the actual scope boundary here.
          DISPATCH_ACTOR: ${{ github.triggering_actor }}
          DISPATCH_SENDER: ${{ github.event.sender.login || '' }}
          ALLOWED_DISPATCH_ACTOR: ${{ vars.OPENCODE_REPOSITORY_DISPATCH_ACTOR }}
          TARGET_REPOSITORY: ${{ github.event.client_payload.target_repository }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          SUPPLIED_BASE_REF: ${{ github.event.client_payload.pr_base_ref || '' }}
          SUPPLIED_BASE_SHA: ${{ github.event.client_payload.pr_base_sha || '' }}
          SUPPLIED_HEAD_REF: ${{ github.event.client_payload.pr_head_ref || '' }}
          SUPPLIED_HEAD_SHA: ${{ github.event.client_payload.pr_head_sha || '' }}
          SUPPLIED_PRODUCER_SOURCE_SHA: ${{ github.event.client_payload.producer_source_sha || '' }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
          SUPPLIED_MATRIX: ${{ toJSON(github.event.client_payload.matrix) }}
          SUPPLIED_REQUIRED_RUN_ID: ${{ github.event.client_payload.required_run_id || '' }}
          SUPPLIED_REQUIRED_JOBS: ${{ toJSON(github.event.client_payload.required_jobs) }}
          SUPPLIED_RERUN_MODE: ${{ github.event.client_payload.rerun_mode || '' }}
          SUPPLIED_RERUN_REQUEST: ${{ toJSON(github.event.client_payload.rerun_request) }}
          # Pre-#2008 payloads still send scalar required_job_id +
          # required_language with a one-shard matrix. Synthesize
          # required_jobs from those only when the array is empty.
          SUPPLIED_REQUIRED_JOB_ID: ${{ github.event.client_payload.required_job_id || '' }}
          SUPPLIED_REQUIRED_LANGUAGE: ${{ github.event.client_payload.required_language || '' }}
        run: |
          set -euo pipefail
          # ALLOWED_DISPATCH_ACTOR is a comma-separated allowlist shared with
          # opencode-review-dispatch.yml and pr-review-fix-scheduler.yml; all
          # three parse it the same way. Actor AND sender must both equal the
          # SAME listed identity, and an empty allowlist admits nothing.
          actor_allowed=0
          IFS=',' read -r -a allowed_dispatch_actors <<<"$ALLOWED_DISPATCH_ACTOR"
          for allowed_actor in "${allowed_dispatch_actors[@]}"; do
            allowed_actor="${allowed_actor//[[:space:]]/}"
            if [ -n "$allowed_actor" ] &&
              [ "$DISPATCH_ACTOR" = "$allowed_actor" ] &&
              [ "$DISPATCH_SENDER" = "$allowed_actor" ]; then
              actor_allowed=1
              break
            fi
          done
          if [ "$actor_allowed" -ne 1 ]; then
            printf '::error::repository_dispatch authorization rejected actor=%s sender=%s because both must match one configured scheduler identity.\n' "${DISPATCH_ACTOR:-<empty>}" "${DISPATCH_SENDER:-<empty>}"
            exit 1
          fi
          printf 'Authorized repository_dispatch actor=%s sender=%s target=%s.\n' "$DISPATCH_ACTOR" "$DISPATCH_SENDER" "$TARGET_REPOSITORY"

          if ! [[ "$TARGET_REPOSITORY" =~ ^ContextualWisdomLab/[A-Za-z0-9_.-]+$ ]] ||
            ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            printf '::error::PR metadata validation rejected a target outside ContextualWisdomLab or an invalid pull request number. target=%s pr=%s\n' "${TARGET_REPOSITORY:-<empty>}" "${PR_NUMBER:-<empty>}"
            exit 1
          fi
          if ! [[ "$SUPPLIED_PRODUCER_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
            ! [[ "$WORKFLOW_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::CodeQL producer source is missing or malformed."
            exit 1
          fi
          if [ "${SUPPLIED_PRODUCER_SOURCE_SHA,,}" != "${WORKFLOW_SOURCE_SHA,,}" ]; then
            if ! source_compare="$(gh api "repos/ContextualWisdomLab/.github/compare/${SUPPLIED_PRODUCER_SOURCE_SHA}...${WORKFLOW_SOURCE_SHA}" 2>/dev/null)" ||
              ! printf '%s' "$source_compare" | jq -e \
                --arg source "${SUPPLIED_PRODUCER_SOURCE_SHA,,}" '
                .status == "ahead"
                and .behind_by == 0
                and ((.base_commit.sha // "" | ascii_downcase) == $source)
                and ((.merge_base_commit.sha // "" | ascii_downcase) == $source)
              ' >/dev/null; then
              echo "::error::CodeQL producer source is not an immutable ancestor of the current handler workflow source."
              exit 1
            fi
          fi

          matrix_json="$(printf '%s' "$SUPPLIED_MATRIX" | jq -c '.' 2>/dev/null || true)"
          jobs_json="$(printf '%s' "$SUPPLIED_REQUIRED_JOBS" | jq -c '.' 2>/dev/null || true)"
          rerun_request_json="$(printf '%s' "$SUPPLIED_RERUN_REQUEST" | jq -c '.' 2>/dev/null || true)"
          if [ -z "$matrix_json" ] ||
            [ "$(printf '%s' "$matrix_json" | jq 'type == "array" and length >= 1')" != "true" ] ||
            [ "$(printf '%s' "$matrix_json" | jq '[.[] | select((.language | type == "string") and (.language | test("^[a-z0-9-]+$")) and (."build-mode" | type == "string"))] | length == ($ARGS.positional[0] | tonumber)' --args "$(printf '%s' "$matrix_json" | jq 'length')")" != "true" ] ||
            [ "$(printf '%s' "$matrix_json" | jq '(map(.language) | unique | length) == (map(.language) | length)')" != "true" ]; then
            printf '::error::CodeQL scan dispatch matrix must contain at least one valid language/build-mode shard with unique languages. matrix=%s\n' "${SUPPLIED_MATRIX:-<empty>}"
            exit 1
          fi
          rerun_mode="${SUPPLIED_RERUN_MODE:-failed}"
          if [ "$rerun_mode" != "failed" ] && [ "$rerun_mode" != "all" ]; then
            printf '::error::CodeQL rerun mode is invalid.\n'
            exit 1
          fi
          if [ -n "$rerun_request_json" ] && [ "$rerun_request_json" != "null" ]; then
            if [ -n "$jobs_json" ] && [ "$(printf '%s' "$jobs_json" | jq '(. != null) and (. != [])')" = "true" ] ||
              [ -n "$SUPPLIED_RERUN_MODE" ] || [ -n "$SUPPLIED_REQUIRED_JOB_ID" ] ||
              [ -n "$SUPPLIED_REQUIRED_LANGUAGE" ]; then
              printf '::error::CodeQL dispatch rejected conflicting legacy and nested rerun envelopes.\n'
              exit 1
            fi
            if [ "$(printf '%s' "$rerun_request_json" | jq '
              type == "object"
              and ((keys | sort) == ["mode", "required_jobs"])
              and (.mode == "failed" or .mode == "all")
              and (.required_jobs | type == "array")
            ')" != "true" ]; then
              printf '::error::CodeQL rerun mode or required job envelope is invalid.\n'
              exit 1
            fi
            rerun_mode="$(printf '%s' "$rerun_request_json" | jq -r '.mode')"
            jobs_json="$(printf '%s' "$rerun_request_json" | jq -c '.required_jobs')"
          fi
          if [ -z "$jobs_json" ] ||
            [ "$(printf '%s' "$jobs_json" | jq '(. == null) or (. == [])')" = "true" ]; then
            if [ "$(printf '%s' "$matrix_json" | jq 'type == "array" and length == 1')" = "true" ] &&
              [[ "$SUPPLIED_REQUIRED_JOB_ID" =~ ^[1-9][0-9]*$ ]] &&
              [ "$SUPPLIED_REQUIRED_LANGUAGE" = "$(printf '%s' "$matrix_json" | jq -r '.[0].language // empty')" ]; then
              jobs_json="$(jq -nc --arg language "$SUPPLIED_REQUIRED_LANGUAGE" --arg job_id "$SUPPLIED_REQUIRED_JOB_ID" '[{language: $language, job_id: ($job_id | tonumber)}]')"
            fi
          fi
          if [ -z "$jobs_json" ] ||
            [ "$(jq -n --argjson matrix "$matrix_json" --argjson jobs "$jobs_json" '
              ($jobs | type == "array")
              and (($jobs | length) == ($matrix | length))
              and ($jobs | all(
                (.language | type == "string")
                and (.language | test("^[a-z0-9-]+$"))
                and (
                  ((.job_id | type == "number") and (.job_id == (.job_id | floor)) and (.job_id >= 1))
                  or ((.job_id | type == "string") and (.job_id | test("^[1-9][0-9]*$")))
                )
              ))
              and (($jobs | map(.language) | sort) == ($matrix | map(.language) | sort))
              and (($jobs | map(.language) | unique | length) == ($jobs | length))
              and (($jobs | map(.job_id | tostring) | unique | length) == ($jobs | length))
            ')" != "true" ]; then
            printf '::error::CodeQL wake identity is missing, non-canonical, or does not match the dispatched languages one-to-one.\n'
            exit 1
          fi
          if ! [[ "$SUPPLIED_REQUIRED_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            printf '::error::CodeQL wake identity is missing, non-canonical, or does not match the dispatched languages one-to-one.\n'
            exit 1
          fi
          jobs_json="$(printf '%s' "$jobs_json" | jq -c 'map({language, job_id: (.job_id | tonumber)})')"

          pull_request_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_base_repository="$(jq -r '.base.repo.full_name // empty' <<<"$pull_request_json")"
          live_head_repository="$(jq -r '.head.repo.full_name // empty' <<<"$pull_request_json")"
          live_base_ref="$(jq -r '.base.ref // empty' <<<"$pull_request_json")"
          live_base_sha="$(jq -r '.base.sha // empty' <<<"$pull_request_json")"
          live_head_ref="$(jq -r '.head.ref // empty' <<<"$pull_request_json")"
          live_head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request_json")"
          live_state="$(jq -r '.state // empty' <<<"$pull_request_json")"

          if [ "$live_state" != "open" ] ||
            [ "$live_base_repository" != "$TARGET_REPOSITORY" ] ||
            [ "$live_head_repository" != "$TARGET_REPOSITORY" ] ||
            ! [[ "$live_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
            ! [[ "$live_head_sha" =~ ^[0-9a-fA-F]{40}$ ]] ||
            [ -z "$live_base_ref" ] ||
            [ -z "$live_head_ref" ]; then
            printf '::error::PR metadata validation rejected closed, missing, cross-fork, or malformed live metadata. target=%s#%s state=%s base_repo=%s head_repo=%s base=%s head=%s\n' "$TARGET_REPOSITORY" "$PR_NUMBER" "${live_state:-<missing>}" "${live_base_repository:-<missing>}" "${live_head_repository:-<missing>}" "${live_base_sha:-<missing>}" "${live_head_sha:-<missing>}"
            exit 1
          fi

          mismatches=()
          [ "$SUPPLIED_BASE_REF" = "$live_base_ref" ] || mismatches+=("base_ref")
          [ "$SUPPLIED_BASE_SHA" = "$live_base_sha" ] || mismatches+=("base_sha")
          [ "$SUPPLIED_HEAD_REF" = "$live_head_ref" ] || mismatches+=("head_ref")
          [ "$SUPPLIED_HEAD_SHA" = "$live_head_sha" ] || mismatches+=("head_sha")
          if [ "${#mismatches[@]}" -gt 0 ]; then
            printf '::error::repository_dispatch metadata does not match the live pull request: %s. supplied_base=%s/%s live_base=%s/%s supplied_head=%s/%s live_head=%s/%s\n' "$(IFS=,; printf '%s' "${mismatches[*]}")" "${SUPPLIED_BASE_REF:-<empty>}" "${SUPPLIED_BASE_SHA:-<empty>}" "$live_base_ref" "$live_base_sha" "${SUPPLIED_HEAD_REF:-<empty>}" "${SUPPLIED_HEAD_SHA:-<empty>}" "$live_head_ref" "$live_head_sha"
            exit 1
          fi

          {
            printf 'target_repository=%s\n' "$TARGET_REPOSITORY"
            printf 'pr_number=%s\n' "$PR_NUMBER"
            printf 'base_ref=%s\n' "$live_base_ref"
            printf 'base_sha=%s\n' "$live_base_sha"
            printf 'head_ref=%s\n' "$live_head_ref"
            printf 'head_sha=%s\n' "$live_head_sha"
            echo "matrix<<EOF"
            printf '%s\n' "$matrix_json"
            echo "EOF"
            printf 'required_run_id=%s\n' "$SUPPLIED_REQUIRED_RUN_ID"
            printf 'rerun_mode=%s\n' "$rerun_mode"
            printf 'producer_source_sha=%s\n' "$SUPPLIED_PRODUCER_SOURCE_SHA"
            echo "required_jobs<<EOF"
            printf '%s\n' "$jobs_json"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          printf 'Validated current live metadata for %s#%s: base=%s/%s head=%s/%s.\n' "$TARGET_REPOSITORY" "$PR_NUMBER" "$live_base_ref" "$live_base_sha" "$live_head_ref" "$live_head_sha"

  scan:
    name: CodeQL dispatch scan (${{ matrix.language }})
    needs: validate-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: read
      id-token: write
      statuses: write # Required for downscoped OIDC status publication.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate-dispatch.outputs.matrix) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Exchange OpenCode app token for target repository content reads
        id: target_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail

          mark_unavailable() {
            echo "available=false" >>"$GITHUB_OUTPUT"
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OpenCode app token exchange unavailable: OIDC request environment is missing."
            mark_unavailable
            exit 0
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            echo "OpenCode app token exchange unavailable: OIDC token request did not complete."
            mark_unavailable
            exit 0
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "OpenCode app token exchange unavailable: OIDC token response was empty."
            mark_unavailable
            exit 0
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"; then
            echo "OpenCode app token exchange unavailable: app token request did not complete."
            mark_unavailable
            exit 0
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "OpenCode app token exchange unavailable: app token response was empty."
            mark_unavailable
            exit 0
          fi

          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Re-validate live pull request metadata before privileged scan
        env:
          GH_TOKEN: ${{ steps.target_app_token.outputs.token || secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ needs.validate-dispatch.outputs.target_repository }}
          PR_NUMBER: ${{ needs.validate-dispatch.outputs.pr_number }}
          EXPECTED_BASE_REF: ${{ needs.validate-dispatch.outputs.base_ref }}
          EXPECTED_BASE_SHA: ${{ needs.validate-dispatch.outputs.base_sha }}
          EXPECTED_HEAD_REF: ${{ needs.validate-dispatch.outputs.head_ref }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-dispatch.outputs.head_sha }}
        run: |
          set -euo pipefail
          pull_request_json="$(gh api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_state="$(jq -r '.state // empty' <<<"$pull_request_json")"
          live_base_ref="$(jq -r '.base.ref // empty' <<<"$pull_request_json")"
          live_base_sha="$(jq -r '.base.sha // empty' <<<"$pull_request_json")"
          live_head_ref="$(jq -r '.head.ref // empty' <<<"$pull_request_json")"
          live_head_sha="$(jq -r '.head.sha // empty' <<<"$pull_request_json")"
          if [ "$live_state" != "open" ] ||
            [ "$live_base_ref" != "$EXPECTED_BASE_REF" ] ||
            [ "$live_base_sha" != "$EXPECTED_BASE_SHA" ] ||
            [ "$live_head_ref" != "$EXPECTED_HEAD_REF" ] ||
            [ "$live_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            printf '::error::CodeQL scan dispatch metadata changed between validation and scan for %s#%s; retiring this superseded run.\n' "$TARGET_REPOSITORY" "$PR_NUMBER"
            exit 1
          fi

      - name: Fetch the pinned CodeQL SARIF gate script
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          gh api "repos/ContextualWisdomLab/.github/contents/scripts/ci/codeql_sarif_gate.py?ref=${WORKFLOW_SHA}" \
            --jq .content | base64 --decode >"$RUNNER_TEMP/codeql_sarif_gate.py"
          python3 -c "import ast; ast.parse(open('$RUNNER_TEMP/codeql_sarif_gate.py').read())"

      - name: Materialize pull request head for CodeQL scan
        env:
          GH_TOKEN: ${{ steps.target_app_token.outputs.token || secrets.PR_REVIEW_MERGE_TOKEN || secrets.OPENCODE_APPROVE_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ needs.validate-dispatch.outputs.target_repository }}
          HEAD_SHA: ${{ needs.validate-dispatch.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$TARGET_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git checkout --detach --quiet "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: codeql-results-dispatch
          ref: ${{ needs.validate-dispatch.outputs.head_ref }}
          sha: ${{ needs.validate-dispatch.outputs.head_sha }}

      - name: Enforce CodeQL Medium+ SARIF gate
        id: gate
        run: python3 "$RUNNER_TEMP/codeql_sarif_gate.py" codeql-results-dispatch

      - name: Preserve CodeQL SARIF evidence
        if: always() && hashFiles('codeql-results-dispatch/**/*.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-dispatch-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-results-dispatch
          retention-days: 7

      - name: Publish CodeQL dispatch status
        id: publish_status
        if: always()
        env:
          TARGET_APP_STATUS_TOKEN: ${{ steps.target_app_token.outputs.token || '' }}
          GITHUB_STATUS_READ_TOKEN: ${{ github.token }}
          PR_REVIEW_MERGE_STATUS_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || '' }}
          OPENCODE_APPROVE_STATUS_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN || '' }}
          TARGET_REPOSITORY: ${{ needs.validate-dispatch.outputs.target_repository }}
          HEAD_SHA: ${{ needs.validate-dispatch.outputs.head_sha }}
          BASE_SHA: ${{ needs.validate-dispatch.outputs.base_sha }}
          REQUIRED_RUN_ID: ${{ needs.validate-dispatch.outputs.required_run_id }}
          PRODUCER_SOURCE_SHA: ${{ needs.validate-dispatch.outputs.producer_source_sha }}
          LANGUAGE: ${{ matrix.language }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          case "$GATE_OUTCOME" in
            success)
              state="success"
              description="CodeQL dispatch scan passed (no unsuppressed Medium+ findings)"
              ;;
            failure)
              state="failure"
              description="CodeQL dispatch scan found unsuppressed Medium+ findings"
              ;;
            *)
              state="error"
              description="CodeQL dispatch scan did not produce a verdict (${GATE_OUTCOME:-unknown})"
              ;;
          esac
          receipt_description="cwl1;h=${HEAD_SHA};w=codeql-scan-dispatch;r=${REQUIRED_RUN_ID};s=${PRODUCER_SOURCE_SHA}"

          post_status() {
            token_label="$1"
            token="$2"
            if [ -z "$token" ]; then
              return 1
            fi
            status_response="$(mktemp)"
            status_error="$(mktemp)"
            if GH_TOKEN="$token" gh api -X POST "repos/${TARGET_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state="$state" \
              -f context="codeql-dispatch/${LANGUAGE}/${BASE_SHA}" \
              -f description="$receipt_description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >"$status_response" 2>"$status_error"; then
              rm -f "$status_response" "$status_error"
              echo "Published CodeQL dispatch status to ${TARGET_REPOSITORY}@${HEAD_SHA} using ${token_label}."
              return 0
            fi
            error_summary="$(head -n 1 "$status_error" | tr -d '\r' || true)"
            rm -f "$status_response" "$status_error"
            if [ -n "$error_summary" ]; then
              echo "::notice::CodeQL dispatch status publish using ${token_label} did not succeed: ${error_summary}"
            else
              echo "::notice::CodeQL dispatch status publish using ${token_label} did not succeed."
            fi
            return 1
          }

          if post_status "target-app-token" "$TARGET_APP_STATUS_TOKEN"; then
            exit 0
          fi
          if post_status "pr-review-merge-token" "$PR_REVIEW_MERGE_STATUS_TOKEN"; then
            exit 0
          fi
          if post_status "opencode-approve-token" "$OPENCODE_APPROVE_STATUS_TOKEN"; then
            exit 0
          fi
          if post_status "github-token" "$GITHUB_STATUS_READ_TOKEN"; then
            exit 0
          fi

          if [ "$GATE_OUTCOME" = "success" ]; then
            echo "::notice::Could not publish the CodeQL dispatch status after all configured credentials failed. The completed dispatch scan job remains the evidence for this head."
            exit 0
          fi

          echo "::error::Could not publish the CodeQL dispatch status after all configured credentials failed; the exact required job will remain failed and will not be woken with stale or missing evidence."
          exit 1

  settle-required-run:
    name: settle exact required run
    needs: [validate-dispatch, scan]
    if: >-
      always()
      && needs.validate-dispatch.result == 'success'
      && needs.scan.result != 'cancelled'
      && needs.scan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Exchange OpenCode app token for run settlement
        id: target_app_token
        env:
          OIDC_AUDIENCE: opencode-github-action
          OPENCODE_API_BASE_URL: https://api.opencode.ai
        run: |
          set -euo pipefail

          mark_unavailable() {
            echo "available=false" >>"$GITHUB_OUTPUT"
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] ||
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OpenCode app token exchange unavailable: OIDC request environment is missing."
            mark_unavailable
            exit 0
          fi

          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          separator="&"
          case "$request_url" in
            *\?*) ;;
            *) separator="?" ;;
          esac

          if ! oidc_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${request_url}${separator}audience=${OIDC_AUDIENCE}"
          )"; then
            echo "OpenCode app token exchange unavailable: OIDC token request did not complete."
            mark_unavailable
            exit 0
          fi

          oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
          if [ -z "$oidc_token" ]; then
            echo "OpenCode app token exchange unavailable: OIDC token response was empty."
            mark_unavailable
            exit 0
          fi

          if ! token_response="$(
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              "${OPENCODE_API_BASE_URL}/exchange_github_app_token"
          )"; then
            echo "OpenCode app token exchange unavailable: app token request did not complete."
            mark_unavailable
            exit 0
          fi

          app_token="$(jq -r '.token // empty' <<<"$token_response")"
          if [ -z "$app_token" ]; then
            echo "OpenCode app token exchange unavailable: app token response was empty."
            mark_unavailable
            exit 0
          fi

          echo "::add-mask::$app_token"
          {
            echo "available=true"
            echo "token=$app_token"
          } >>"$GITHUB_OUTPUT"

      - name: Settle exact CodeQL required run
        env:
          TARGET_APP_WAKE_TOKEN: ${{ steps.target_app_token.outputs.token || '' }}
          PR_REVIEW_MERGE_WAKE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN || '' }}
          OPENCODE_APPROVE_WAKE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN || '' }}
          GITHUB_WAKE_TOKEN: ${{ needs.validate-dispatch.outputs.target_repository == github.repository && github.token || '' }}
          HANDLER_READ_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ needs.validate-dispatch.outputs.target_repository }}
          PR_NUMBER: ${{ needs.validate-dispatch.outputs.pr_number }}
          BASE_REF: ${{ needs.validate-dispatch.outputs.base_ref }}
          BASE_SHA: ${{ needs.validate-dispatch.outputs.base_sha }}
          HEAD_REF: ${{ needs.validate-dispatch.outputs.head_ref }}
          HEAD_SHA: ${{ needs.validate-dispatch.outputs.head_sha }}
          REQUIRED_RUN_ID: ${{ needs.validate-dispatch.outputs.required_run_id }}
          REQUIRED_JOBS: ${{ needs.validate-dispatch.outputs.required_jobs }}
          RERUN_MODE: ${{ needs.validate-dispatch.outputs.rerun_mode }}
          PRODUCER_SOURCE_SHA: ${{ needs.validate-dispatch.outputs.producer_source_sha }}
        run: |
          set -euo pipefail

          run_api() {
            token_label="$1"
            token="$2"
            shift 2
            if [ -z "$token" ]; then
              return 1
            fi
            if GH_TOKEN="$token" gh api "$@"; then
              echo "::notice::CodeQL settlement API used ${token_label}." >&2
              return 0
            fi
            echo "::notice::CodeQL settlement API using ${token_label} did not succeed." >&2
            return 1
          }

          github_api() {
            run_api "target-app-token" "$TARGET_APP_WAKE_TOKEN" "$@" ||
              run_api "pr-review-merge-token" "$PR_REVIEW_MERGE_WAKE_TOKEN" "$@" ||
              run_api "opencode-approve-token" "$OPENCODE_APPROVE_WAKE_TOKEN" "$@" ||
              run_api "github-token" "$GITHUB_WAKE_TOKEN" "$@"
          }

          if ! pull="$(github_api "repos/${TARGET_REPOSITORY}/pulls/${PR_NUMBER}")"; then
            echo "::error::CodeQL settlement could not read the current pull request."
            exit 1
          fi
          if [ "$(printf '%s' "$pull" | jq -r '.state // empty')" != "open" ] ||
            [ "$(printf '%s' "$pull" | jq -r '.base.repo.full_name // empty')" != "$TARGET_REPOSITORY" ] ||
            [ "$(printf '%s' "$pull" | jq -r '.base.ref // empty')" != "$BASE_REF" ] ||
            [ "$(printf '%s' "$pull" | jq -r '.base.sha // empty')" != "$BASE_SHA" ] ||
            [ "$(printf '%s' "$pull" | jq -r '.head.repo.full_name // empty')" != "$TARGET_REPOSITORY" ] ||
            [ "$(printf '%s' "$pull" | jq -r '.head.ref // empty')" != "$HEAD_REF" ] ||
            [ "$(printf '%s' "$pull" | jq -r '.head.sha // empty')" != "$HEAD_SHA" ]; then
            echo "::error::CodeQL settlement rejected a closed PR, changed base, or stale head."
            exit 1
          fi

          if ! required_run="$(github_api "repos/${TARGET_REPOSITORY}/actions/runs/${REQUIRED_RUN_ID}")"; then
            echo "::error::CodeQL settlement could not read the required run."
            exit 1
          fi
          if [ "$(printf '%s' "$required_run" | jq -r --arg head "$HEAD_SHA" --argjson run_id "$REQUIRED_RUN_ID" '
            select(.id == $run_id)
            | select(.event == "pull_request")
            | select(.path == ".github/workflows/codeql-pr.yml")
            | select(.head_sha == $head)
            | select(.status == "completed" and .conclusion == "failure")
            | .id // empty
          ')" != "$REQUIRED_RUN_ID" ]; then
            echo "::error::CodeQL settlement rejected the required run identity."
            exit 1
          fi

          if ! required_job_pages="$(github_api --paginate --slurp "repos/${TARGET_REPOSITORY}/actions/runs/${REQUIRED_RUN_ID}/jobs?per_page=100")"; then
            echo "::error::CodeQL settlement could not read the required jobs."
            exit 1
          fi
          required_job_list="$(printf '%s' "$required_job_pages" | jq -c '[.[] | .jobs[]?]')"
          while IFS= read -r required_job; do
            language="$(printf '%s' "$required_job" | jq -r '.language // empty')"
            job_id="$(printf '%s' "$required_job" | jq -r '.job_id // empty')"
            expected_name="CodeQL compatibility analysis (${language})"
            match_count="$(printf '%s' "$required_job_list" | jq --arg language "$language" --arg name "$expected_name" --arg head "$HEAD_SHA" --argjson run_id "$REQUIRED_RUN_ID" --argjson job_id "$job_id" --arg mode "$RERUN_MODE" '
              [.[] | select(
                .id == $job_id
                and .run_id == $run_id
                and .head_sha == $head
                and .name == $name
                and .status == "completed"
                and (
                  ($mode == "failed" and .conclusion == "failure")
                  or ($mode == "all" and (.conclusion == "success" or .conclusion == "failure"))
                )
              )] | length
            ')"
            if [ "$match_count" -ne 1 ]; then
              echo "::error::CodeQL settlement rejected missing or ambiguous exact job identity for ${language}."
              exit 1
            fi
          done < <(printf '%s' "$REQUIRED_JOBS" | jq -c '.[]')

          required_job_ids="$(printf '%s' "$REQUIRED_JOBS" | jq -c '[.[].job_id]')"
          if [ "$RERUN_MODE" = "failed" ] &&
            [ "$(printf '%s' "$required_job_list" | jq --argjson required_ids "$required_job_ids" '
              [.[] | .id as $id | select(.status == "completed" and .conclusion == "failure" and ($required_ids | index($id) | not))] | length
            ')" -ne 0 ]; then
            echo "::error::CodeQL settlement rejected unrelated failed jobs outside the exact language map."
            exit 1
          fi

          if ! handler_job_pages="$(GH_TOKEN="$HANDLER_READ_TOKEN" gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")" ||
            ! handler_artifact_pages="$(GH_TOKEN="$HANDLER_READ_TOKEN" gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"; then
            echo "::error::CodeQL settlement could not read exact handler evidence."
            exit 1
          fi
          handler_jobs="$(printf '%s' "$handler_job_pages" | jq -c '[.[] | .jobs[]?]')"
          handler_artifacts="$(printf '%s' "$handler_artifact_pages" | jq -c '[.[] | .artifacts[]?]')"
          while IFS= read -r required_job; do
            language="$(printf '%s' "$required_job" | jq -r '.language')"
            expected_job_name="CodeQL dispatch scan (${language})"
            expected_artifact_name="codeql-dispatch-${language}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            handler_job_count="$(printf '%s' "$handler_jobs" | jq --arg name "$expected_job_name" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              [.[] | select(
                .name == $name
                and .status == "completed"
                and (.conclusion == "success" or .conclusion == "failure")
                and .run_attempt == $attempt
                and ([.steps[]? | select(.name == "Enforce CodeQL Medium+ SARIF gate" and (.conclusion == "success" or .conclusion == "failure"))] | length) == 1
                and ([.steps[]? | select(.name == "Preserve CodeQL SARIF evidence" and .conclusion == "success")] | length) == 1
              )] | length
            ')"
            handler_artifact_count="$(printf '%s' "$handler_artifacts" | jq --arg name "$expected_artifact_name" '
              [.[] | select(.name == $name and (.expired == false) and (.size_in_bytes > 0))] | length
            ')"
            if [ "$handler_job_count" -ne 1 ] || [ "$handler_artifact_count" -ne 1 ]; then
              echo "::error::CodeQL settlement rejected incomplete handler gate or SARIF evidence for ${language}."
              exit 1
            fi
          done < <(printf '%s' "$REQUIRED_JOBS" | jq -c '.[]')

          case "$RERUN_MODE" in
            failed) rerun_endpoint="rerun-failed-jobs" ;;
            all) rerun_endpoint="rerun" ;;
            *)
              echo "::error::CodeQL settlement rejected an unsupported rerun mode."
              exit 1
              ;;
          esac

          post_wake() {
            token_label="$1"
            token="$2"
            if [ -z "$token" ]; then
              return 1
            fi
            if GH_TOKEN="$token" gh api -X POST "repos/${TARGET_REPOSITORY}/actions/runs/${REQUIRED_RUN_ID}/${rerun_endpoint}" >/dev/null; then
              echo "Re-ran exact CodeQL required run ${REQUIRED_RUN_ID} mode=${RERUN_MODE} head=${HEAD_SHA} using ${token_label}."
              return 0
            fi
            echo "::notice::CodeQL settlement POST using ${token_label} did not succeed."
            return 1
          }

          if post_wake "target-app-token" "$TARGET_APP_WAKE_TOKEN" ||
            post_wake "pr-review-merge-token" "$PR_REVIEW_MERGE_WAKE_TOKEN" ||
            post_wake "opencode-approve-token" "$OPENCODE_APPROVE_WAKE_TOKEN" ||
            post_wake "github-token" "$GITHUB_WAKE_TOKEN"; then
            exit 0
          fi

          echo "::error::CodeQL settlement could not enqueue verified run-wide recovery."
          exit 1
