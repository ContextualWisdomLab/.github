name: Temporary DDD Prompt Binding Review Fix

on:
  push:
    branches:
      - fix/hourly-ddd-development-contract-20260901
    paths:
      - .github/workflows/tmp-ddd-binding-review-fix.yml
      - scripts/ci/tmp_apply_ddd_binding_review_fix.py

concurrency:
  group: tmp-ddd-binding-review-fix
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact review-fix branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/hourly-ddd-development-contract-20260901
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Normalize bootstrap escape generation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/tmp_apply_ddd_binding_review_fix.py")
          source = path.read_text(encoding="utf-8")
          replacements = (
              (
                  r'        continued = fragment.endswith("\\")',
                  r'        continued = fragment.endswith("\\\\")',
              ),
              (
                  r'        fragments.append(fragment.removesuffix("\\").rstrip())',
                  r'        fragments.append(fragment.removesuffix("\\\\").rstrip())',
              ),
          )
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"bootstrap escape normalization expected one fragment, found {count}: {old!r}"
                  )
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          PY
          python -W error -m py_compile scripts/ci/tmp_apply_ddd_binding_review_fix.py

      - name: Install exact focused-test dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cat >"${RUNNER_TEMP}/requirements.txt" <<'EOF'
          coverage==7.15.2 --hash=sha256:b9a6367e4aff723e8ee8190836836124284e8fcd4265e307c844010cfa074f3f
          iniconfig==2.1.0 --hash=sha256:9deba5723312380e77435581c6bf4935c94cbfab9b1ed33ef8d238ea168eb760
          packaging==26.2 --hash=sha256:5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
          pluggy==1.6.0 --hash=sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
          pygments==2.20.0 --hash=sha256:81a9e26dd42fd28a23a2d169d86d7ac03b46e2f8b59ed4698fb4785f946d0176
          pytest==9.1.1 --hash=sha256:37a86b45efb9a47a61a36449063e8e18d0cab3161329fc099eb21783169c4f0c
          EOF
          python -m pip install --only-binary=:all: --require-hashes -r "${RUNNER_TEMP}/requirements.txt"

      - name: RED — prove unused YAML prose is currently accepted
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python -W error scripts/ci/tmp_apply_ddd_binding_review_fix.py red
          set +e
          red_output="$(
            python -m pytest --import-mode=importlib \
              tests/test_organization_commercial_readiness_loop_policy.py \
              -k ddd_contract_rejects_unbound_unused_yaml_prose -q 2>&1
          )"
          red_status=$?
          set -e
          printf '%s\n' "$red_output"
          if [ "$red_status" -eq 0 ]; then
            echo '::error::RED regression unexpectedly passed before production repair.'
            exit 1
          fi
          grep -F 'AssertionError' <<<"$red_output" >/dev/null

      - name: GREEN — bind scoped capabilities to one product-agent command
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: python -W error scripts/ci/tmp_apply_ddd_binding_review_fix.py green

      - name: Verify exact policy coverage and source hygiene
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python -m coverage run --branch -m pytest --import-mode=importlib \
            tests/test_organization_commercial_readiness_loop*.py -q
          python -m coverage report \
            --include='scripts/ci/organization_commercial_readiness_loop.py' \
            --show-missing \
            --fail-under=100
          python -m compileall -q \
            scripts/ci/organization_commercial_readiness_loop.py \
            organization_commercial_readiness_fixtures.py \
            tests/test_organization_commercial_readiness_loop*.py
          git diff --check
          grep -F '# cwl-ddd-architecture-audit: v1' organization_commercial_readiness_fixtures.py >/dev/null
          grep -F -- '--architecture-contract-env CWL_DDD_CONTRACT_CAPABILITIES' organization_commercial_readiness_fixtures.py >/dev/null

      - name: Publish verified non-workflow review remediation
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          git restore --source=HEAD -- scripts/ci/tmp_apply_ddd_binding_review_fix.py
          git add \
            CHANGELOG.md \
            docs/doctoring/organization-commercial-readiness-loop.md \
            docs/product-technical-gap-baseline.md \
            organization_commercial_readiness_fixtures.py \
            scripts/ci/organization_commercial_readiness_loop.py \
            tests/test_organization_commercial_readiness_loop_policy.py
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo '::error::Workflow paths must be published only through the authorized connector.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(automation): bind DDD contract to product-agent invocation'
          git push origin HEAD:fix/hourly-ddd-development-contract-20260901
