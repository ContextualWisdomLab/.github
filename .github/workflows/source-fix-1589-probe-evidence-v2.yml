name: One-shot PR 1589 probe evidence repair v2

on:
  push:
    branches:
      - fix/noema-observed-defect-probe-taxonomy-20260901
    paths:
      - .github/workflows/source-fix-1589-probe-evidence-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Apply reviewed GREEN and retire repair workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/noema-observed-defect-probe-taxonomy-20260901
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-opencode-review-ci-hashes.txt

          cat > tests/test_noema_observed_defect_probe_taxonomy.py <<'PY'
          """Regression contract for Noema probes derived from observed reviewer findings."""

          from __future__ import annotations

          import json
          from typing import Any

          import pytest

          from scripts.ci import noema_review_gate as gate


          DIFF = """diff --git a/tool.py b/tool.py
          --- a/tool.py
          +++ b/tool.py
          @@ -1,2 +1,2 @@
          -old = False
          +candidate = source.value
           keep = True
          """

          CLASS_EVIDENCE_FIELDS = {
              "mutable_alias": ("alias_origin", "mutation_attempt", "post_validation_observation"),
              "time_of_check_time_of_use": ("check_observation", "intervening_change", "use_observation"),
              "execution_identity": ("incoming_identity", "retained_identity", "mismatch_guard"),
              "coercion_boundary": ("raw_value", "conversion_path", "canonicality_guard"),
              "test_oracle": ("assertion_under_test", "negative_control", "distinguishing_observation"),
              "cross_contract": ("first_contract", "second_contract", "contradiction_or_alignment"),
              "authority_boundary": ("component_authority", "external_authority", "enforcement_boundary"),
              "dependency_context": ("dependency", "omitted_or_included_context", "causal_effect"),
              "state_machine_race": ("initial_state", "event_order", "invariant_observation"),
          }


          def _class_evidence(probe_kind: str) -> dict[str, str]:
              """Build the exact class-specific witness schema expected for one probe kind."""
              return {
                  field: f"source-traced {field.replace('_', ' ')} witness"
                  for field in CLASS_EVIDENCE_FIELDS[probe_kind]
              }


          def _verdict(*, first_kind: Any, second_kind: Any) -> dict:
              """Build a material approval verdict with two exact-line adversarial probes."""
              probes = [
                  {
                      "path": "tool.py", "line": 1, "side": "RIGHT",
                      "hypothesis": "A caller-owned alias cannot mutate admitted state after validation.",
                      "attack_or_counterexample": "Mutate the original object after the reviewed assignment.",
                      "evidence": "The returned state is detached from the caller-owned object.",
                      "outcome": "falsified",
                  },
                  {
                      "path": "tool.py", "line": 1, "side": "RIGHT",
                      "hypothesis": "A signal for another execution cannot advance this execution.",
                      "attack_or_counterexample": "Replay the same transition with a mismatched execution identity.",
                      "evidence": "The transition rejects the mismatched identity before state mutation.",
                      "outcome": "falsified",
                  },
              ]
              for probe, probe_kind in zip(probes, (first_kind, second_kind), strict=True):
                  if probe_kind is not None:
                      probe["probe_kind"] = probe_kind
                  if isinstance(probe_kind, str) and probe_kind in CLASS_EVIDENCE_FIELDS:
                      probe["class_evidence"] = _class_evidence(probe_kind)
              return {
                  "decision": "approve",
                  "summary": "Reviewed the changed material line against observed defect classes.",
                  "reviewed_lines": [
                      {"path": "tool.py", "line": 1, "side": "RIGHT", "analysis": "Checked the assignment boundary."}
                  ],
                  "adversarial_validation": {
                      "status": "passed",
                      "residual_risk": "The bounded review cannot execute every downstream consumer.",
                      "probes": probes,
                  },
                  "findings": [],
              }


          def test_formal_material_verdict_rejects_unclassified_adversarial_probe() -> None:
              """A probe without an observed defect-class identity must fail closed."""
              with pytest.raises(RuntimeError, match="probe_kind"):
                  gate.validate_substantive_verdict(
                      _verdict(first_kind=None, second_kind="execution_identity"), DIFF, ["tool.py"]
                  )


          def test_formal_material_verdict_rejects_unknown_adversarial_probe_kind() -> None:
              """Free-form labels must not bypass the executable review taxonomy."""
              with pytest.raises(RuntimeError, match="probe_kind"):
                  gate.validate_substantive_verdict(
                      _verdict(first_kind="generic_correctness", second_kind="execution_identity"),
                      DIFF,
                      ["tool.py"],
                  )


          @pytest.mark.parametrize("bad_kind", [["mutable_alias"], {"kind": "mutable_alias"}])
          def test_probe_kind_container_fails_closed_as_review_validation(bad_kind: Any) -> None:
              """Malformed unhashable model output must fail closed, never crash the review job."""
              with pytest.raises(RuntimeError, match="probe_kind"):
                  gate.validate_substantive_verdict(
                      _verdict(first_kind=bad_kind, second_kind="execution_identity"), DIFF, ["tool.py"]
                  )


          def test_arbitrary_distinct_labels_without_class_witnesses_do_not_satisfy_diversity() -> None:
              """Distinct labels alone cannot turn generic evidence into two observed defect classes."""
              verdict = _verdict(first_kind="mutable_alias", second_kind="execution_identity")
              verdict["adversarial_validation"]["probes"][0]["class_evidence"] = {
                  "generic_observation": "The changed line exists."
              }
              with pytest.raises(RuntimeError, match="class_evidence"):
                  gate.validate_substantive_verdict(verdict, DIFF, ["tool.py"])


          def test_material_verdict_requires_distinct_observed_probe_classes() -> None:
              """Two structurally valid probes of one class must not satisfy material diversity."""
              with pytest.raises(RuntimeError, match="distinct probe_kind"):
                  gate.validate_substantive_verdict(
                      _verdict(first_kind="mutable_alias", second_kind="mutable_alias"), DIFF, ["tool.py"]
                  )


          def test_formal_material_verdict_accepts_class_bound_observed_defect_probes() -> None:
              """Two observed classes with their exact witness schemas remain admissible."""
              gate.validate_substantive_verdict(
                  _verdict(first_kind="mutable_alias", second_kind="execution_identity"), DIFF, ["tool.py"]
              )


          def test_rendered_prompt_contains_every_class_specific_witness_schema(monkeypatch) -> None:
              """Exercise call_llm and inspect the actual rendered request, not bytecode constants."""
              captured: dict[str, Any] = {}
              verdict = _verdict(first_kind="mutable_alias", second_kind="execution_identity")

              class Response:
                  def __enter__(self):
                      return self

                  def __exit__(self, *_args):
                      return False

                  def read(self) -> bytes:
                      return json.dumps(
                          {"choices": [{"message": {"content": json.dumps(verdict)}}]}
                      ).encode("utf-8")

              class Opener:
                  def open(self, request):
                      captured["payload"] = json.loads(request.data)
                      return Response()

              monkeypatch.setenv("CONTEXTUAL_ORCHESTRATOR_BASE_URL", "http://127.0.0.1:18080")
              monkeypatch.setenv("NOEMA_LLM_API_URL", "http://127.0.0.1:18080/v1/chat/completions")
              monkeypatch.setenv("NOEMA_LLM_API_KEY", "test-key")
              monkeypatch.setattr(gate.urllib.request, "build_opener", lambda *_args: Opener())

              result = gate.call_llm(
                  "owner/repo", 7, {"title": "probe contract", "headRefOid": "a" * 40},
                  DIFF, False, "a" * 40, "bounded changed-file context", ["tool.py"],
              )
              assert result["decision"] == "approve"
              prompt_text = captured["payload"]["messages"][1]["content"]
              assert "CodeGraph context" not in prompt_text
              for probe_kind, fields in CLASS_EVIDENCE_FIELDS.items():
                  assert probe_kind in prompt_text
                  for field in fields:
                      assert field in prompt_text
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/noema_review_gate.py")
          text = path.read_text(encoding="utf-8")
          kinds_block = '''OBSERVED_REVIEW_PROBE_KINDS = frozenset(
              {
                  "mutable_alias",
                  "time_of_check_time_of_use",
                  "execution_identity",
                  "coercion_boundary",
                  "test_oracle",
                  "cross_contract",
                  "authority_boundary",
                  "dependency_context",
                  "state_machine_race",
              }
          )
          '''
          evidence_block = '''OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS: dict[str, tuple[str, ...]] = {
              "mutable_alias": ("alias_origin", "mutation_attempt", "post_validation_observation"),
              "time_of_check_time_of_use": ("check_observation", "intervening_change", "use_observation"),
              "execution_identity": ("incoming_identity", "retained_identity", "mismatch_guard"),
              "coercion_boundary": ("raw_value", "conversion_path", "canonicality_guard"),
              "test_oracle": ("assertion_under_test", "negative_control", "distinguishing_observation"),
              "cross_contract": ("first_contract", "second_contract", "contradiction_or_alignment"),
              "authority_boundary": ("component_authority", "external_authority", "enforcement_boundary"),
              "dependency_context": ("dependency", "omitted_or_included_context", "causal_effect"),
              "state_machine_race": ("initial_state", "event_order", "invariant_observation"),
          }
          '''
          if evidence_block not in text:
              if text.count(kinds_block) != 1:
                  raise SystemExit("observed probe kind block changed unexpectedly")
              text = text.replace(kinds_block, kinds_block + evidence_block, 1)

          marker = "\ndef validate_substantive_verdict(\n"
          helper = '''
          def _validate_observed_probe_class_evidence(
              probe: dict[str, Any], probe_kind: str, index: int
          ) -> None:
              """Require the exact deterministic witness schema for a claimed defect class."""
              class_evidence = probe.get("class_evidence")
              required_fields = OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS[probe_kind]
              if not isinstance(class_evidence, dict) or set(class_evidence) != set(required_fields):
                  expected = ", ".join(required_fields)
                  raise RuntimeError(
                      f"Noema adversarial probe {index} class_evidence for {probe_kind} "
                      f"must contain exactly: {expected}"
                  )
              for field in required_fields:
                  value = class_evidence.get(field)
                  if not isinstance(value, str) or not value.strip():
                      raise RuntimeError(
                          f"Noema adversarial probe {index} class_evidence.{field} "
                          "requires source-traced witness text"
                      )

          '''
          if helper.strip() not in text:
              if text.count(marker) != 1:
                  raise SystemExit("validate marker changed unexpectedly")
              text = text.replace(marker, "\n" + helper + "def validate_substantive_verdict(\n", 1)

          old = '''        probe_kind = probe.get("probe_kind")
                  if probe_kind not in OBSERVED_REVIEW_PROBE_KINDS:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} requires probe_kind from the observed defect taxonomy"
                      )
                  probe_kinds.add(str(probe_kind))
          '''
          new = '''        probe_kind = probe.get("probe_kind")
                  if not isinstance(probe_kind, str) or probe_kind not in OBSERVED_REVIEW_PROBE_KINDS:
                      raise RuntimeError(
                          f"Noema adversarial probe {index} requires probe_kind from the observed defect taxonomy"
                      )
                  _validate_observed_probe_class_evidence(probe, probe_kind, index)
                  probe_kinds.add(probe_kind)
          '''
          if text.count(old) != 1:
              raise SystemExit("probe-kind validation block changed unexpectedly")
          text = text.replace(old, new, 1)

          codegraph_fn_start = text.find("def load_codegraph_context() -> str:\n")
          if codegraph_fn_start >= 0:
              codegraph_fn_end = text.find("\ndef build_review_context(", codegraph_fn_start)
              if codegraph_fn_end < 0:
                  raise SystemExit("CodeGraph helper boundary changed unexpectedly")
              text = text[:codegraph_fn_start] + text[codegraph_fn_end + 1 :]
          text = text.replace(
              '    codegraph = load_codegraph_context()\n    if codegraph:\n        sections.append("## CodeGraph context\\n" + codegraph)\n',
              "",
          )
          text = text.replace(
              "Review the PR diff plus the additional changed-file, review-thread, and CodeGraph context for correctness, security, maintainability, and behavioral regressions.",
              "Review the PR diff plus the additional changed-file and review-thread context for correctness, security, maintainability, and behavioral regressions.",
          )

          probe_line = '"probe_kind": "mutable_alias|time_of_check_time_of_use|execution_identity|coercion_boundary|test_oracle|cross_contract|authority_boundary|dependency_context|state_machine_race",\n'
          if text.count(probe_line) != 1:
              raise SystemExit("prompt probe-kind line changed unexpectedly")
          text = text.replace(
              probe_line,
              probe_line + '                                    "class_evidence": {"exact_fields_for_selected_probe_kind": "source-traced witness text"},\n',
              1,
          )
          taxonomy = "Classify every adversarial probe with one observed defect class and use distinct classes when multiple probes are required: mutable_alias, time_of_check_time_of_use, execution_identity, coercion_boundary, test_oracle, cross_contract, authority_boundary, dependency_context, state_machine_race."
          needle = f'                "{taxonomy}",\n'
          if text.count(needle) != 1:
              raise SystemExit("prompt taxonomy instruction changed unexpectedly")
          text = text.replace(
              needle,
              needle + '                "A probe_kind label is not evidence by itself. class_evidence must use exactly the class-specific source-traced witness fields in this schema: " + json.dumps(OBSERVED_REVIEW_PROBE_EVIDENCE_FIELDS, separators=(",", ":")) + ".",\n',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_noema_review_gate.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '"probe_kind": "mutable_alias",\n                    "hypothesis": "The assignment was removed.",\n                    "attack_or_counterexample": "Inspect the added hunk line.",\n                    "evidence": "The RIGHT-side assignment remains present.",',
                  '"probe_kind": "coercion_boundary",\n                    "class_evidence": {"raw_value": "The replacement could be a truthy non-boolean value.", "conversion_path": "Trace the changed assignment without implicit conversion.", "canonicality_guard": "The changed source uses the canonical boolean literal True."},\n                    "hypothesis": "A truthy non-boolean value could masquerade as canonical boolean state.",\n                    "attack_or_counterexample": "Use a string-like truthy value as the coercion counterexample.",\n                    "evidence": "The RIGHT-side assignment uses the boolean literal True without coercion.",',
              ),
              (
                  '"probe_kind": "execution_identity",\n                    "hypothesis": "The value became false.",\n                    "attack_or_counterexample": "Read the replacement literal.",\n                    "evidence": "The literal is True.",',
                  '"probe_kind": "test_oracle",\n                    "class_evidence": {"assertion_under_test": "A truthiness-only review oracle could accept a string value.", "negative_control": "Use the non-boolean string true as a negative control.", "distinguishing_observation": "The changed source is the boolean literal True, distinct by type."},\n                    "hypothesis": "A truthiness-only oracle could accept a non-boolean replacement.",\n                    "attack_or_counterexample": "Compare the boolean literal with a truthy string negative control.",\n                    "evidence": "The replacement is the exact boolean literal True.",',
              ),
              (
                  '"probe_kind": "mutable_alias",\n                    "hypothesis": "The value becomes false.",\n                    "attack_or_counterexample": "Trace the literal assigned at the changed line.",\n                    "evidence": "The changed source assigns the boolean literal True.",',
                  '"probe_kind": "coercion_boundary",\n                    "class_evidence": {"raw_value": "A caller could supply a truthy non-boolean value.", "conversion_path": "Trace whether the changed assignment coerces input.", "canonicality_guard": "The changed line assigns the canonical boolean literal True."},\n                    "hypothesis": "A truthy non-boolean value could cross the canonical boolean boundary.",\n                    "attack_or_counterexample": "Compare the literal with a truthy string counterexample.",\n                    "evidence": "The changed source assigns the exact boolean literal True.",',
              ),
              (
                  '"probe_kind": "time_of_check_time_of_use",\n                    "hypothesis": "The assignment is removed.",\n                    "attack_or_counterexample": "Compare the added side with the deleted side.",\n                    "evidence": "The RIGHT-side hunk contains one replacement assignment.",',
                  '"probe_kind": "test_oracle",\n                    "class_evidence": {"assertion_under_test": "Presence-only inspection could miss a wrong replacement type.", "negative_control": "Use a present but non-boolean replacement as the negative control.", "distinguishing_observation": "The changed line is both present and the exact boolean literal True."},\n                    "hypothesis": "A presence-only oracle could accept the wrong replacement value.",\n                    "attack_or_counterexample": "Use a present but type-wrong assignment as a negative control.",\n                    "evidence": "The RIGHT-side hunk contains the exact boolean replacement assignment.",',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"generic fixture changed unexpectedly: {old[:80]}")
              text = text.replace(old, new, 1)

          old1 = '{"path": "tool.py", "line": 1, "side": "RIGHT", "probe_kind": "mutable_alias", "hypothesis": "The value is false.", "attack_or_counterexample": "Read the literal.", "evidence": "The literal is True.", "outcome": "falsified"}'
          new1 = '{"path": "tool.py", "line": 1, "side": "RIGHT", "probe_kind": "coercion_boundary", "class_evidence": {"raw_value": "A truthy non-boolean value", "conversion_path": "No implicit conversion in the changed assignment", "canonicality_guard": "Exact boolean literal True"}, "hypothesis": "A non-boolean value crosses the canonical boundary.", "attack_or_counterexample": "Compare with a truthy string negative control.", "evidence": "The literal is the canonical boolean True.", "outcome": "falsified"}'
          old2 = '{"path": "tool.py", "line": 1, "side": "RIGHT", "probe_kind": "execution_identity", "hypothesis": "The assignment vanished.", "attack_or_counterexample": "Inspect the added line.", "evidence": "One assignment is present.", "outcome": "falsified"}'
          new2 = '{"path": "tool.py", "line": 1, "side": "RIGHT", "probe_kind": "test_oracle", "class_evidence": {"assertion_under_test": "Presence-only assignment check", "negative_control": "Present assignment with wrong value type", "distinguishing_observation": "Exact boolean literal and presence are both checked"}, "hypothesis": "A presence-only oracle accepts a wrong replacement.", "attack_or_counterexample": "Use a present but non-boolean assignment.", "evidence": "The changed assignment has the exact expected boolean value.", "outcome": "falsified"}'
          if old1 not in text or old2 not in text:
              raise SystemExit("one-line fixtures changed unexpectedly")
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)

          additions = {
              '"probe_kind": "cross_contract",\n                    "hypothesis": "The obsolete claim remains documented.",': '"probe_kind": "cross_contract",\n                    "class_evidence": {"first_contract": "The deleted documentation claim.", "second_contract": "The current contract after deletion.", "contradiction_or_alignment": "The obsolete conflicting claim is removed."},\n                    "hypothesis": "The obsolete claim remains documented.",',
              '"probe_kind": "authority_boundary",\n                    "hypothesis": "The safety gate is disabled.",': '"probe_kind": "authority_boundary",\n                    "class_evidence": {"component_authority": "The changed config controls this component safety gate.", "external_authority": "No external caller is authorized to silently disable the gate.", "enforcement_boundary": "The effective changed value is evaluated at the component configuration boundary."},\n                    "hypothesis": "The safety gate is disabled.",',
              '"probe_kind": "cross_contract",\n                    "hypothesis": "The key was renamed instead.",': '"probe_kind": "cross_contract",\n                    "class_evidence": {"first_contract": "The prior config key is safe with value true.", "second_contract": "The changed config retains key safe with value false.", "contradiction_or_alignment": "The key identity aligns while its safety value contradicts the prior contract."},\n                    "hypothesis": "The key was renamed instead.",',
          }
          for old, new in additions.items():
              if old not in text:
                  raise SystemExit(f"fixture marker missing: {old}")
              text = text.replace(old, new, 1)

          text = text.replace(
              "def test_review_context_builders_include_codegraph_threads_and_files(monkeypatch, tmp_path):",
              "def test_review_context_builders_include_threads_and_files(monkeypatch):",
          )
          text = text.replace(
              '    codegraph_path = tmp_path / "codegraph.md"\n    codegraph_path.write_text("call graph: src/a.py -> tests", encoding="utf-8")\n    monkeypatch.setenv("NOEMA_CODEGRAPH_CONTEXT_PATH", str(codegraph_path))\n',
              "",
          )
          text = text.replace('    assert "## CodeGraph context" in context\n    assert "call graph: src/a.py -> tests" in context\n', "")
          text = text.replace(
              "def test_review_context_reports_omitted_files_and_missing_codegraph(monkeypatch, tmp_path):\n    monkeypatch.delenv(\"NOEMA_CODEGRAPH_CONTEXT_PATH\", raising=False)\n    assert noema.load_codegraph_context() == \"\"\n\n    monkeypatch.setenv(\"NOEMA_CODEGRAPH_CONTEXT_PATH\", str(tmp_path / \"missing.md\"))\n    assert \"CodeGraph context unavailable\" in noema.load_codegraph_context()\n\n",
              "def test_review_context_reports_omitted_files(monkeypatch):\n",
          )
          path.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path

          docs = Path("docs/doctoring/noema-observed-defect-probe-taxonomy.md")
          text = docs.read_text(encoding="utf-8")
          old = "The deterministic validator rejects missing or unknown `probe_kind` values and rejects insufficient class diversity. Published review evidence includes each probe class so operators can audit what was actually attacked rather than infer coverage from generic prose."
          new = "The deterministic validator rejects non-string, missing, or unknown `probe_kind` values and requires an exact class-specific `class_evidence` witness schema before a label can count toward diversity. For example, mutable-alias evidence must identify the alias origin, mutation attempt, and post-validation observation; TOCTOU evidence must identify the checked value, intervening change, and later use. Published review evidence includes each validated probe class so operators can audit what was actually attacked rather than infer coverage from generic prose. The prompt no longer claims CodeGraph context is supplied: no trusted Noema workflow currently wires that input, so only actual changed-file and review-thread context is advertised."
          if old not in text:
              raise SystemExit("doctoring evidence paragraph changed unexpectedly")
          text = text.replace(old, new, 1)
          old = "1. a missing probe class fails closed;\n2. an unknown free-form class fails closed;\n3. two material-change probes using the same class fail the diversity requirement;\n4. two valid observed classes can satisfy the formal verdict contract; and\n5. the prompt retains every supported class name."
          new = "1. a missing probe class fails closed;\n2. unknown, list-valued, or object-valued classes fail closed as review-validation errors rather than crashing;\n3. arbitrary distinct labels without the exact class-specific witness schema fail closed;\n4. two material-change probes using the same validated class fail the diversity requirement;\n5. two valid class-bound observed probes can satisfy the formal verdict contract; and\n6. an exercised `call_llm` request contains every supported class and its witness-field schema while making no unwired CodeGraph claim."
          if old not in text:
              raise SystemExit("doctoring verification list changed unexpectedly")
          docs.write_text(text.replace(old, new, 1), encoding="utf-8")

          baseline = Path("docs/product-technical-gap-baseline.md")
          text = baseline.read_text(encoding="utf-8")
          old = "Material source/test changes already require two probes; they now must cover distinct classes so duplicated generic attacks cannot satisfy the gate. The prompt explicitly attacks these failure shapes and the published review evidence renders the class for auditability."
          new = "Material source/test changes already require two probes; they now must cover distinct classes, and a class label counts only when its exact class-specific `class_evidence` witness schema is present and non-empty, so arbitrary labels cannot satisfy the gate. The prompt explicitly attacks these failure shapes and publishes the validated class for auditability. The same repair removes the stale claim that CodeGraph context is supplied to Noema: the trusted workflow does not wire `NOEMA_CODEGRAPH_CONTEXT_PATH`, so the prompt now advertises only changed-file and review-thread context actually provided."
          if old not in text:
              raise SystemExit("baseline probe paragraph changed unexpectedly")
          baseline.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          old = "- Noema formal reviews now classify adversarial probes against an executable corpus of observed reviewer defect classes (mutable aliases, TOCTOU, identity/coercion boundaries, weak oracles, cross-contract and authority contradictions, dependency context, and state-machine races), and material changes require distinct probe classes before approval."
          new = "- Noema formal reviews now classify adversarial probes against an executable corpus of observed reviewer defect classes (mutable aliases, TOCTOU, identity/coercion boundaries, weak oracles, cross-contract and authority contradictions, dependency context, and state-machine races); class labels count only with exact class-specific structured witnesses, material changes require distinct validated classes, malformed labels fail closed, and the reviewer prompt no longer claims unwired CodeGraph context."
          if old not in text:
              raise SystemExit("changelog probe entry changed unexpectedly")
          changelog.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          PYTHONPATH=. python3 -m pytest -q \
            tests/test_noema_observed_defect_probe_taxonomy.py \
            tests/test_noema_observed_probe_doctoring.py \
            tests/test_noema_review_gate.py
          PYTHONPATH=. python3 -m pytest -q tests
          interrogate --fail-under=100 scripts/ci/noema_review_gate.py
          python3 -m compileall -q scripts/ci tests
