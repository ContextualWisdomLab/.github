name: Learning Contracts Hourly Review Repair Quality

on:
  pull_request:
    paths:
      - .github/workflows/learning-interoperability-contracts-hourly-review-repair.yml
      - .github/workflows/learning-interoperability-contracts-hourly-review-repair-quality.yml
      - tests/test_learning_interoperability_contracts_hourly_review_caller.py
      - docs/doctoring/learning-interoperability-contracts-hourly-review-caller.md
  push:
    branches: [main]
    paths:
      - .github/workflows/learning-interoperability-contracts-hourly-review-repair.yml
      - .github/workflows/learning-interoperability-contracts-hourly-review-repair-quality.yml
      - tests/test_learning_interoperability_contracts_hourly_review_caller.py
      - docs/doctoring/learning-interoperability-contracts-hourly-review-caller.md

permissions:
  contents: read

concurrency:
  group: learning-contracts-hourly-review-repair-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Learning contracts stacked-review caller contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout exact source revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked test tooling
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-opencode-review-ci-hashes.txt
      - name: Verify caller, rights, and approval boundaries
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_learning_interoperability_contracts_hourly_review_caller.py
          python -m interrogate \
            --fail-under 100 \
            tests/test_learning_interoperability_contracts_hourly_review_caller.py
          python -m compileall -q \
            tests/test_learning_interoperability_contracts_hourly_review_caller.py
          git diff --check
