name: Export PR 782 source

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/export-pr782-source.yml

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.repository == 'ContextualWisdomLab/.github' &&
      github.event.pull_request.number == 782 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/hourly-nvidia-nim-review-repair-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Package exact source
        run: |
          tar -cf pr782-source.tar \
            .github/workflows/pr-review-autofix.yml \
            scripts/ci/pr_review_conflict_scope.py \
            tests/test_pr_review_conflict_scope.py \
            docs/doctoring/hourly-nvidia-nim-autofix.md \
            CHANGELOG.md

      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr782-source-${{ github.event.pull_request.head.sha }}
          path: pr782-source.tar
          retention-days: 1
