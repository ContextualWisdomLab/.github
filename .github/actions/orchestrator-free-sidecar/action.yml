name: Orchestrator free sidecar
description: Provision the immutable contextual-orchestrator orchestrator/free gateway for a model-backed workflow.
inputs:
  gateway_mode:
    description: Bootstrap mode; external remains blocked until a released CO adapter is registered.
    required: false
    default: "sidecar"
  gateway_base_url:
    description: Deployment-authorized HTTPS gateway origin; never sourced from PR content.
    required: false
  gateway_token_file:
    description: Private runner-owned inference token file; never a raw credential input.
    required: false
  gateway_contract_revision:
    description: Immutable released CO adapter revision registered by protected owner source.
    required: false
  require_zdr:
    description: Require an attested Zero Data Retention route for private or internal content.
    required: false
    default: "false"
  catalog_limit:
    description: Maximum discovered route catalog size for the sidecar preflight (a candidate list probed lazily to a readiness target, ADR-0029).
    required: false
    default: "24"
  catalog_account_cap:
    description: Maximum routes admitted from one credential account.
    required: false
    default: "8"
runs:
  using: composite
  steps:
    - name: Checkout immutable central sidecar source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ContextualWisdomLab/.github
        ref: ${{ github.action_ref }}
        path: ${{ runner.temp }}/cwl-control-plane
        persist-credentials: false
    - name: Provision contextual-orchestrator orchestrator/free
      shell: bash --noprofile --norc -e -o pipefail {0}
      env:
        CONTEXTUAL_ORCHESTRATOR_GATEWAY_MODE: ${{ inputs.gateway_mode }}
        CONTEXTUAL_ORCHESTRATOR_BASE_URL: ${{ inputs.gateway_base_url }}
        CONTEXTUAL_ORCHESTRATOR_TOKEN_FILE: ${{ inputs.gateway_token_file }}
        CONTEXTUAL_ORCHESTRATOR_GATEWAY_CONTRACT_REVISION: ${{ inputs.gateway_contract_revision }}
        CONTEXTUAL_ORCHESTRATOR_REQUIRE_ZDR: ${{ inputs.require_zdr }}
        ORCHESTRATOR_CATALOG_LIMIT: ${{ inputs.catalog_limit }}
        ORCHESTRATOR_CATALOG_ACCOUNT_CAP: ${{ inputs.catalog_account_cap }}
      run: |
        set -euo pipefail
        control_plane="${RUNNER_TEMP}/cwl-control-plane"
        sidecar="${control_plane}/scripts/ci/contextual_orchestrator_review_sidecar.sh"
        if [ ! -f "$sidecar" ] || [ -L "$sidecar" ]; then
          echo "::error::Immutable central contextual-orchestrator sidecar source is missing or symlinked."
          exit 1
        fi
        bash "$sidecar"
